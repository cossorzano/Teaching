<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حقل الأعداد الحقيقية</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-inline-end:2px dashed #3d5a50;padding-inline-end:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-inline-start:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
span[dir='ltr']{white-space:nowrap}
svg{direction:ltr}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>تذكّر</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ ابدأ</button><button id="next">▶|</button>
<select id="voice"></select>
<label>السرعة <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">وضع التسجيل (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"ar-SA",
"meta":{"nivel": 0, "titulo": "حقل الأعداد الحقيقية", "enunciado": "ملخص: الأعداد الحقيقية بوصفها حقلًا مرتبًا تامًا", "datos": ["بنية الحقل", "ترتيب كلي متوافق", "خاصية أرخميدس", "الحدود العليا والدنيا", "الحد الأعلى الأصغر والحد الأدنى الأكبر", "مسلّمة التمام"]},
"steps":[
{"title": "حقل الأعداد الحقيقية", "sub": "ملخص: الأعداد الحقيقية بوصفها حقلًا مرتبًا تامًا", "clear": 1, "say": "مرحبًا. في هذا الفيديو نلخص البنية الكاملة للأعداد الحقيقية: حقل مرتب تام. سنرى مكوناته واحدًا تلو الآخر: الحقل، والترتيب، وخاصية أرخميدس، والتمام، مع الحد الأعلى الأصغر والحد الأدنى الأكبر.", "L": [["txt", "الأعداد الحقيقية حقل مرتب تام"], ["sub", "<span dir='ltr'>(ℝ, +, ·, ≤)</span>"]]},

{"title": "حقل مرتب تام", "clear": 1, "say": "الأعداد الحقيقية، مع الجمع والضرب والترتيب، تشكل حقلًا مرتبًا تامًا. وهذا يعني ثلاثة أمور: أنها مع الجمع والضرب حقل؛ وأن الترتيب كلي ومتوافق مع العمليتين؛ وأنها تحقق مسلّمة التمام.", "L": [["goal", "<span dir='ltr'>(ℝ, +, ·, ≤)</span>   حقل مرتب تام"], ["txt", "أولًا:  <span dir='ltr'>(ℝ, +, ·)</span>  حقل"], ["txt", "ثانيًا:  <span dir='ltr'>≤</span>  ترتيب كلي، متوافق مع  +  و  <span dir='ltr'>·</span>"], ["txt", "ثالثًا:  التمام، أي مسلّمة الحد الأعلى الأصغر"]]},

{"title": "1) الحقل", "clear": 1, "say": "أولًا، الحقل. مع الجمع، تشكل الأعداد الحقيقية زمرة إبدالية. ومع الضرب، تشكل الأعداد الحقيقية بعد حذف المجموعة التي لا تحوي إلا الصفر زمرة إبدالية. وإضافة إلى ذلك، الضرب توزيعي على الجمع: a ضرب، b زائد c، يساوي a ضرب b، زائد a ضرب c.", "L": [["goal", "<span dir='ltr'>(ℝ, +, ·)</span>  حقل"], ["res", "<span dir='ltr'>(ℝ, +)</span>   زمرة إبدالية"], ["res", "<span dir='ltr'>(ℝ ∖ {0}, ·)</span>   زمرة إبدالية"], ["res", "التوزيع:   <span dir='ltr'>a · (b + c) = a · b + a · c</span>"]], "pin": ["الحقل: <span dir='ltr'>(ℝ,+)</span> و <span dir='ltr'>(ℝ∖{0},·)</span> إبداليتان"]},

{"title": "2) الترتيب الكلي", "clear": 1, "say": "ثانيًا، الترتيب. أصغر من أو يساوي علاقة ترتيب كلي على الأعداد الحقيقية: فهي انعكاسية، وتخالفية، ومتعدية، ويمكن المقارنة بين أي عددين.", "L": [["goal", "<span dir='ltr'>≤</span>  علاقة ترتيب كلي على <span dir='ltr'>ℝ</span>"], ["txt", "انعكاسية، تخالفية، متعدية، وكل عنصرين قابلان للمقارنة"]], "pin": ["الترتيب الكلي <span dir='ltr'>≤</span>"]},

{"say": "وهي متوافقة مع الجمع: إذا كان a أصغر من أو يساوي b، فإن a زائد c أصغر من أو يساوي b زائد c. ومتوافقة مع الضرب: إذا كان الصفر أصغر من أو يساوي a، والصفر أصغر من أو يساوي b، فإن الصفر أصغر من أو يساوي a ضرب b. أي أن جداء عددين موجبين أو معدومين موجب أو معدوم.", "L": [["res", "التوافق مع الجمع:   <span dir='ltr'>a ≤ b  ⟹  a + c ≤ b + c</span>"], ["res", "التوافق مع الضرب:   <span dir='ltr'>0 ≤ a  ∧  0 ≤ b  ⟹  0 ≤ a · b</span>"]]},

{"title": "3) خاصية أرخميدس", "clear": 1, "say": "ثالثًا، خاصية أرخميدس. لكل عددين a و b أكبر من الصفر، يوجد عدد طبيعي n بحيث يكون n ضرب a أكبر من b. فبجمع a مع نفسه عددًا كافيًا من المرات، نتجاوز أي b.", "L": [["goal", "خاصية أرخميدس"], ["res", "<span dir='ltr'>∀ a, b &gt; 0,   ∃ n ∈ ℕ :   n · a &gt; b</span>"]], "pin": ["أرخميدس: <span dir='ltr'>∀a,b>0 ∃n: n·a>b</span>"]},

{"title": "4) الحد الأعلى", "clear": 1, "say": "رابعًا، نمهد للتمام. لتكن A مجموعة جزئية غير خالية من الأعداد الحقيقية. يكون العدد الحقيقي M حدًا أعلى لـ A إذا وفقط إذا كان، لكل عنصر a من A، العدد a أصغر من أو يساوي M.", "L": [["goal", "<span dir='ltr'>A ⊆ ℝ</span>،   <span dir='ltr'>A ≠ ∅</span>"], ["res", "<span dir='ltr'>M ∈ ℝ</span>  حد أعلى لـ <span dir='ltr'>A   ⟺   ∀ a ∈ A,   a ≤ M</span>"]], "pin": ["الحد الأعلى <span dir='ltr'>M: ∀a∈A, a ≤ M</span>"]},

{"title": "5) الحد الأعلى الأصغر", "clear": 1, "say": "يكون العدد الحقيقي s الحد الأعلى الأصغر لـ A إذا حقق شرطين. الأول: s حد أعلى لـ A. والثاني: لكل حد أعلى M لـ A، يكون s أصغر من أو يساوي M. أي أن الحد الأعلى الأصغر هو أصغر الحدود العليا.", "L": [["goal", "<span dir='ltr'>s ∈ ℝ</span>  هو الحد الأعلى الأصغر لـ <span dir='ltr'>A</span>  إذا تحقق:"], ["res", "أولًا:   <span dir='ltr'>s</span>  حد أعلى لـ <span dir='ltr'>A</span>"], ["res", "ثانيًا:   لكل حد أعلى  <span dir='ltr'>M</span>  لـ <span dir='ltr'>A</span>،   <span dir='ltr'>s ≤ M</span>"], ["txt", "الحد الأعلى الأصغر هو أصغر الحدود العليا"]], "pin": ["<span dir='ltr'>sup A</span>: أصغر الحدود العليا"]},

{"title": "6) التمام", "clear": 1, "say": "والآن مسلّمة التمام، وتسمى أيضًا مسلّمة الحد الأعلى الأصغر: كل مجموعة جزئية غير خالية من الأعداد الحقيقية ومحدودة من الأعلى لها حد أعلى أصغر في الأعداد الحقيقية. وهذه هي الخاصية التي تميز الأعداد الحقيقية.", "L": [["goal", "التمام: مسلّمة الحد الأعلى الأصغر"], ["res", "كل  <span dir='ltr'>A ⊆ ℝ</span>  غير خالية ومحدودة من الأعلى  لها حد أعلى أصغر في <span dir='ltr'>ℝ</span>"]], "pin": ["التمام: كل <span dir='ltr'>A≠∅</span> محدودة من الأعلى لها <span dir='ltr'>sup A</span>"]},

{"title": "7) الحد الأدنى", "clear": 1, "say": "والآن، الأمر نفسه للحدود الدنيا. لتكن A مجموعة جزئية غير خالية من الأعداد الحقيقية. يكون العدد الحقيقي m حدًا أدنى لـ A إذا وفقط إذا كان، لكل عنصر a من A، العدد m أصغر من أو يساوي a.", "L": [["goal", "<span dir='ltr'>A ⊆ ℝ</span>،   <span dir='ltr'>A ≠ ∅</span>"], ["res", "<span dir='ltr'>m ∈ ℝ</span>  حد أدنى لـ <span dir='ltr'>A   ⟺   ∀ a ∈ A,   m ≤ a</span>"]], "pin": ["الحد الأدنى <span dir='ltr'>m: ∀a∈A, m ≤ a</span>"]},

{"title": "8) الحد الأدنى الأكبر", "clear": 1, "say": "يكون العدد الحقيقي i الحد الأدنى الأكبر لـ A إذا حقق شرطين. الأول: i حد أدنى لـ A. والثاني: لكل حد أدنى m لـ A، يكون m أصغر من أو يساوي i. أي أن الحد الأدنى الأكبر هو أكبر الحدود الدنيا.", "L": [["goal", "<span dir='ltr'>i ∈ ℝ</span>  هو الحد الأدنى الأكبر لـ <span dir='ltr'>A</span>  إذا تحقق:"], ["res", "أولًا:   <span dir='ltr'>i</span>  حد أدنى لـ <span dir='ltr'>A</span>"], ["res", "ثانيًا:   لكل حد أدنى  <span dir='ltr'>m</span>  لـ <span dir='ltr'>A</span>،   <span dir='ltr'>m ≤ i</span>"], ["txt", "الحد الأدنى الأكبر هو أكبر الحدود الدنيا"]], "pin": ["<span dir='ltr'>inf A</span>: أكبر الحدود الدنيا"]},

{"title": "9) التمام للحد الأدنى الأكبر", "clear": 1, "say": "ومسلّمة التمام للحد الأدنى الأكبر: كل مجموعة جزئية غير خالية من الأعداد الحقيقية ومحدودة من الأدنى لها حد أدنى أكبر في الأعداد الحقيقية. وهي تكافئ مسلّمة الحد الأعلى الأصغر: يكفي تطبيق مسلّمة الحد الأعلى الأصغر على مجموعة نظائر عناصر A.", "L": [["goal", "التمام: مسلّمة الحد الأدنى الأكبر"], ["res", "كل  <span dir='ltr'>A ⊆ ℝ</span>  غير خالية ومحدودة من الأدنى  لها حد أدنى أكبر في <span dir='ltr'>ℝ</span>"], ["txt", "تكافئ مسلّمة الحد الأعلى الأصغر"]], "pin": ["التمام: كل <span dir='ltr'>A≠∅</span> محدودة من الأدنى لها <span dir='ltr'>inf A</span>"]},

{"title": "الخاتمة", "clear": 1, "say": "الخاتمة. هذه الخواص تميز الأعداد الحقيقية: فالأعداد الحقيقية هي الحقل المرتب التام الوحيد، بتقدير التماثل.", "L": [["res", "<span dir='ltr'>ℝ</span>  هو الحقل المرتب التام الوحيد،   بتقدير التماثل"]]},

{"title": "الخلاصة", "clear": 1, "say": "الخلاصة. الأعداد الحقيقية حقل، فيه ترتيب كلي متوافق مع الجمع والضرب، وهو تام: كل مجموعة غير خالية ومحدودة من الأعلى لها حد أعلى أصغر، وكل مجموعة غير خالية ومحدودة من الأدنى لها حد أدنى أكبر. وإضافة إلى ذلك، تحقق خاصية أرخميدس. شكرًا على المشاهدة.", "L": [["res", "<span dir='ltr'>(ℝ, +, ·)</span>  حقل،   <span dir='ltr'>≤</span>  ترتيب كلي متوافق"], ["res", "التمام:  كل <span dir='ltr'>A ≠ ∅</span> محدودة من الأعلى لها  <span dir='ltr'>sup A</span>"], ["res", "كل <span dir='ltr'>A ≠ ∅</span> محدودة من الأدنى لها  <span dir='ltr'>inf A</span>"], ["res", "أرخميدس:  <span dir='ltr'>∀ a, b &gt; 0,  ∃ n ∈ ℕ :  n · a &gt; b</span>"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' زائد ').replace(/⊙/g,' ضرب ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ إعادة'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ متابعة'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ إيقاف مؤقت';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ إيقاف مؤقت';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ إيقاف مؤقت';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^ar/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/hamed|shakir|naayf|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="حقل الأعداد الحقيقية";$('sub').textContent="ملخص: الأعداد الحقيقية بوصفها حقلًا مرتبًا تامًا";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
