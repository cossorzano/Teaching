<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قانونا الهيمنة</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-inline-end:2px dashed #3d5a50;padding-inline-end:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-inline-start:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(15px,1.9vw,24px)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
span[dir='ltr']{white-space:nowrap}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>تذكّر</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ ابدأ</button><button id="next">▶|</button>
<select id="voice"></select>
<label>السرعة <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">وضع التسجيل (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"ar-SA",
"meta":{"nivel": 2, "titulo": "قانونا الهيمنة", "enunciado": "ليكن <span dir='ltr'>(B, ⊕, ⊙, ∼)</span> جبر بول.  أثبت أنه لكل <span dir='ltr'>a ∈ B</span> يتحقق قانونا الهيمنة:", "tesis": "a ⊕ 1 = 1,   a ⊙ 0 = 0", "datos": ["(تجميع الجمع)  <span dir='ltr'>x ⊕ (y ⊕ z) = (x ⊕ y) ⊕ z</span>", "(تجميع الضرب)  <span dir='ltr'>x ⊙ (y ⊙ z) = (x ⊙ y) ⊙ z</span>", "(تساوي القوى)  <span dir='ltr'>x ⊕ x = x,   x ⊙ x = x</span>", "(المتمم)  <span dir='ltr'>x ⊕ ∼x = 1,   x ⊙ ∼x = 0</span>"]},
"steps":[
{"title": "قانونا الهيمنة", "sub": "تمرين · جبر بول", "clear": 1, "say": "مرحبًا. في هذا الفيديو سنحل تمرينًا عن جبر بول. سنتقدم ببطء شديد، فنكتب كل معادلة ونبرر كل خطوة.", "L": [["txt", "إضافة الواحد تعطي واحدًا، والضرب في الصفر يعطي صفرًا"]]},

{"say": "أولًا، المعطيات. B مجموعة معرّف عليها عمليتان، الجمع والضرب، وعملية متمم نكتبها بعلامة التيلدا. وهي جبر بول: شبكة توزيعية لها عنصر أصغر هو الصفر، وعنصر أكبر هو الواحد، ولكل عنصر متمم. والمثال النموذجي هو مجموعة أجزاء مجموعة U، مع الاتحاد والتقاطع والمتمم.", "L": [["hyp", "<span dir='ltr'>(B, ⊕, ⊙, ∼)</span> جبر بول<span class='tag'>فرضية</span>"], ["txt", "مع المجموعات:  <span dir='ltr'>𝒫(U)</span> مع الاتحاد والتقاطع والمتمم،  <span dir='ltr'>0 = ∅</span>،  <span dir='ltr'>1 = U</span>"]]},

{"say": "نتذكر تعريف المتمم. متمم a يحقق شرطين معًا: a زائد متممه يساوي واحدًا، و a ضرب متممه يساوي صفرًا. وفي المجموعات: A اتحاد متممها يساوي U، و A تقاطع متممها هو المجموعة الخالية.", "L": [["sub", "<span dir='ltr'>a ⊕ ∼a = 1</span><span class='tag'>تعريف المتمم</span>"], ["sub", "<span dir='ltr'>a ⊙ ∼a = 0</span><span class='tag'>تعريف المتمم</span>"], ["txt", "مع المجموعات:  <span dir='ltr'>A ∪ A<sup>c</sup> = U,   A ∩ A<sup>c</sup> = ∅</span>"]]},

{"say": "وسنستخدم أيضًا تجميعية الجمع والضرب، وتساوي القوى للعمليتين: a زائد a يساوي a، و a ضرب a يساوي a. نسجلها على الجانب مع تعريف المتمم.", "pin": ["(تجميع الجمع) <span dir='ltr'>x ⊕ (y ⊕ z) = (x ⊕ y) ⊕ z</span>", "(تجميع الضرب) <span dir='ltr'>x ⊙ (y ⊙ z) = (x ⊙ y) ⊙ z</span>", "(تساوي قوى الجمع) <span dir='ltr'>x ⊕ x = x</span>", "(تساوي قوى الضرب) <span dir='ltr'>x ⊙ x = x</span>", "(المتمم) <span dir='ltr'>x ⊕ ∼x = 1,   x ⊙ ∼x = 0</span>"]},

{"say": "المطلوب إثباته. لكل عنصر a من B، a زائد واحد يساوي واحدًا، و a ضرب صفر يساوي صفرًا. هذان هما قانونا الهيمنة: الواحد يهيمن على الجمع، والصفر يهيمن على الضرب. وفي المجموعات: A اتحاد U يساوي U، و A تقاطع المجموعة الخالية هو المجموعة الخالية.", "L": [["goal", "<span dir='ltr'>∀ a ∈ B:   a ⊕ 1 = 1</span>   و   <span dir='ltr'>a ⊙ 0 = 0</span><span class='tag'>المطلوب: قانونا الهيمنة</span>"], ["txt", "مع المجموعات:  <span dir='ltr'>A ∪ U = U,   A ∩ ∅ = ∅</span>"]]},

{"title": "الجزء الأول: a ⊕ 1 = 1", "clear": 1, "say": "نبدأ بالأول. ليكن a عنصرًا ما من B. نريد إثبات أن a زائد واحد يساوي واحدًا. ننطلق من الطرف الأيسر.", "L": [["txt", "ليكن <span dir='ltr'>a ∈ B</span>  (اختياري)"], ["goal", "نريد:  <span dir='ltr'>a ⊕ 1 = 1</span><span class='tag'>مطلوب هذا الجزء</span>"], ["txt", "<span dir='ltr'>a ⊕ 1</span>"]]},

{"say": "الخطوة الأولى. بحسب تعريف المتمم، a زائد متممه يساوي واحدًا. هذه هي الفرضية. إذن يمكننا استبدال الواحد بـ a زائد متمم a. ونترك a التي على اليسار كما هي.", "L": [["sub", "<span dir='ltr'>a ⊕ 1  =  a ⊕ (a ⊕ ∼a)</span><span class='tag'>تعويض: <span dir='ltr'>1 = a ⊕ ∼a</span>  (تعريف المتمم)</span>"]]},

{"say": "الخطوة الثانية. نطبق تجميعية الجمع، مع x يساوي a، و y يساوي a، و z يساوي متمم a. ننتقل من a زائد، a زائد متمم a، إلى، a زائد a، زائد متمم a.", "L": [["sub", "<span dir='ltr'>a ⊕ 1  =  (a ⊕ a) ⊕ ∼a</span><span class='tag'>تجميعية الجمع</span>"]]},

{"say": "الخطوة الثالثة. داخل القوس يظهر a زائد a. وبحسب تساوي القوى للجمع، a زائد a يساوي a. نميّزه ونعوّض.", "L": [["sub", "<span dir='ltr'>a ⊕ 1  =  (<mark>a ⊕ a</mark>) ⊕ ∼a</span>"], ["txt", "بحسب (تساوي قوى الجمع):  <span dir='ltr'><mark>a ⊕ a</mark> = a</span>"], ["sub", "<span dir='ltr'>a ⊕ 1  =  a ⊕ ∼a</span><span class='tag'>تساوي قوى الجمع</span>"]]},

{"say": "الخطوة الرابعة. لدينا الآن a زائد متمم a، وهو بحسب تعريف المتمم يساوي واحدًا.", "L": [["res", "<span dir='ltr'>a ⊕ 1  =  1</span><span class='tag'>تعريف المتمم</span>"]]},

{"say": "لقد أثبتنا قانون الهيمنة الأول. وفي المجموعات: A اتحاد U يساوي U. وبهذا ينتهي الجزء الأول.", "L": [["res", "<span dir='ltr'>a ⊕ 1 = 1   ∎</span>"], ["txt", "مع المجموعات:  <span dir='ltr'>A ∪ U = U</span>"]]},

{"title": "الجزء الثاني: a ⊙ 0 = 0", "clear": 1, "say": "ننتقل إلى الجزء الثاني. وهو مماثل، باستبدال الجمع بالضرب، والواحد بالصفر. ليكن a عنصرًا ما من B. نريد إثبات أن a ضرب صفر يساوي صفرًا. ننطلق من الطرف الأيسر.", "L": [["txt", "ليكن <span dir='ltr'>a ∈ B</span>  (اختياري)"], ["goal", "نريد:  <span dir='ltr'>a ⊙ 0 = 0</span><span class='tag'>مطلوب هذا الجزء</span>"], ["txt", "<span dir='ltr'>a ⊙ 0</span>"]]},

{"say": "الخطوة الأولى. بحسب تعريف المتمم، a ضرب متممه يساوي صفرًا. هذه هي الفرضية. إذن نستبدل الصفر بـ a ضرب متمم a. ونترك a التي على اليسار كما هي.", "L": [["sub", "<span dir='ltr'>a ⊙ 0  =  a ⊙ (a ⊙ ∼a)</span><span class='tag'>تعويض: <span dir='ltr'>0 = a ⊙ ∼a</span>  (تعريف المتمم)</span>"]]},

{"say": "الخطوة الثانية. نطبق تجميعية الضرب. ننتقل من a ضرب، a ضرب متمم a، إلى، a ضرب a، ضرب متمم a.", "L": [["sub", "<span dir='ltr'>a ⊙ 0  =  (a ⊙ a) ⊙ ∼a</span><span class='tag'>تجميعية الضرب</span>"]]},

{"say": "الخطوة الثالثة. داخل القوس يظهر a ضرب a. وبحسب تساوي القوى للضرب، a ضرب a يساوي a. نميّزه ونعوّض.", "L": [["sub", "<span dir='ltr'>a ⊙ 0  =  (<mark>a ⊙ a</mark>) ⊙ ∼a</span>"], ["txt", "بحسب (تساوي قوى الضرب):  <span dir='ltr'><mark>a ⊙ a</mark> = a</span>"], ["sub", "<span dir='ltr'>a ⊙ 0  =  a ⊙ ∼a</span><span class='tag'>تساوي قوى الضرب</span>"]]},

{"say": "الخطوة الرابعة. لدينا الآن a ضرب متمم a، وهو بحسب تعريف المتمم يساوي صفرًا.", "L": [["res", "<span dir='ltr'>a ⊙ 0  =  0</span><span class='tag'>تعريف المتمم</span>"]]},

{"say": "لقد أثبتنا قانون الهيمنة الثاني. وفي المجموعات: A تقاطع المجموعة الخالية هو المجموعة الخالية. وبهذا ينتهي الجزء الثاني.", "L": [["res", "<span dir='ltr'>a ⊙ 0 = 0   ∎</span>"], ["txt", "مع المجموعات:  <span dir='ltr'>A ∩ ∅ = ∅</span>"]]},

{"title": "الخلاصة", "clear": 1, "say": "نلخص. نكتب الواحد على شكل a زائد متمم a، ثم نجمّع، ونطبق تساوي القوى، ونعود إلى تعريف المتمم. ومع الضرب، نفعل الشيء نفسه مع الصفر. نستنتج أن قانوني الهيمنة يتحققان في كل جبر بول. وفي المجموعات: A اتحاد U يساوي U، و A تقاطع المجموعة الخالية هو المجموعة الخالية. شكرًا على المشاهدة.", "L": [["res", "<span dir='ltr'>a ⊕ 1 = 1</span>   (تعويض + تجميعية + تساوي القوى + المتمم)"], ["res", "<span dir='ltr'>a ⊙ 0 = 0</span>   (تعويض + تجميعية + تساوي القوى + المتمم)"], ["txt", "مع المجموعات:  <span dir='ltr'>A ∪ U = U,   A ∩ ∅ = ∅</span>"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' زائد ').replace(/⊙/g,' ضرب ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ إعادة'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ متابعة'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ إيقاف مؤقت';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ إيقاف مؤقت';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ إيقاف مؤقت';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^ar/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/hamed|shakir|naayf|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="قانونا الهيمنة";$('sub').textContent="تمرين · جبر بول";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
