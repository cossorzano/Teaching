<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الشبكات: خاصية تساوي القوى للعمليتين ⊕ و ⊙</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--mut:#9fb3aa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#16231f}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-inline-end:2px dashed #3d5a50;padding-inline-end:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3.2vw,40px);margin:12px 0;padding:6px 12px;border-inline-start:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(16px,2.2vw,28px)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t">الشبكات الجبرية: خاصية تساوي القوى</h1><div id="sub">التفاضل والتكامل · تمرين 1</div>
<div id="main"><div id="pin" class="pin"><h2>الفرضيات</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ ابدأ</button><button id="next">▶|</button>
<select id="voice"></select>
<label>السرعة <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">وضع التسجيل (H)</button><span id="cap"></span></div></div>
<script>
const A='a ⊕ a = a', S=(c,t)=>({c,t});
const M=t=>'<span dir="ltr">'+t+'</span>';
const meta={nivel:2,titulo:'الشبكات الجبرية: خاصية تساوي القوى',
 enunciado:'لتكن '+M('(B, ⊕, ⊙)')+' شبكة. أثبت خاصية تساوي القوى للعمليتين '+M('⊕')+' و '+M('⊙')+':',
 tesis:M('∀a∈B:   a ⊕ a = a,   a ⊙ a = a'),
 datos:[M('(Abs1)  x ⊕ (x ⊙ y) = x'),M('(Abs2)  x ⊙ (x ⊕ y) = x')]};
const steps=[
{title:'الشبكات الجبرية: خاصية تساوي القوى',sub:'تمرين 1',clear:1,say:'مرحبًا. في هذا الفيديو سنحل تمرينًا حول الشبكات الجبرية. سنتقدم ببطء شديد، فنكتب كل معادلة ونبرر كل خطوة.',L:[S('txt','أثبت خاصية تساوي القوى للعمليتين '+M('⊕')+' و '+M('⊙'))]},
{say:'أولًا، المعطيات. B مجموعة مزودة بعمليتين، جمع الشبكة وضرب الشبكة. كلتاهما عملية داخلية: إذا أجرينا العملية على عنصرين من B، تبقى النتيجة في B.',L:[S('hyp',M('(B, ⊕, ⊙)')+' شبكة<span class="tag">فرضية</span>'),S('hyp',M('⊕, ⊙')+' داخليتان: '+M('x ⊕ y ∈ B,  x ⊙ y ∈ B')+'<span class="tag">فرضية</span>')]},
{say:'إضافة إلى ذلك، فهما تبديليتان وتجميعيتان. لكن انتبه: لن نحتاج إلى هاتين الخاصيتين في البرهان كله. سنستخدم قانوني الامتصاص فقط.',L:[S('hyp',M('⊕, ⊙')+' تبديليتان وتجميعيتان<span class="tag">فرضية (لن نستخدمها)</span>')]},
{say:'هذا هو قانون الامتصاص الأول. ينص على أنه لأي x و y من B، فإن x ⊕ (x ⊙ y) يساوي x. نثبته على الجانب، لأنه فرضية سنستخدمها.',pin:M('(Abs1) x ⊕ (x ⊙ y) = x   ∀x,y∈B')},
{say:'والثاني هو قانون الامتصاص الثاني: x ⊙ (x ⊕ y) يساوي x، أيضًا لكل x و y. إنها الفكرة نفسها مع تبديل العمليتين.',pin:M('(Abs2) x ⊙ (x ⊕ y) = x   ∀x,y∈B')},
{say:'المطلوب إثباته: لكل عنصر a من B، فإن a ⊕ a يساوي a، و a ⊙ a يساوي a. أي أن إجراء العملية على عنصر مع نفسه لا يغيره. هذا ما يسمى خاصية تساوي القوى.',L:[S('goal','أثبت: '+M('∀a∈B, a ⊕ a = a')+'  و  '+M('a ⊙ a = a')+'<span class="tag">المطلوب</span>')]},
{title:'الجزء الأول: تساوي القوى للعملية ⊕',clear:1,say:'نبدأ بخاصية تساوي القوى للجمع. نأخذ عنصرًا a ما من B. وبما أنه اختياري، فإن ما سنثبته يصح لجميع العناصر.',L:[S('txt','ليكن '+M('a ∈ B')+'  (اختياري)'),S('goal','نريد: '+M('a ⊕ a = a')+'<span class="tag">المطلوب</span>')]},
{say:'نبدأ بقانون الامتصاص الثاني. لنتذكر: x ⊙ (x ⊕ y) = x، وهو صحيح لكل x و y من B.',L:[S('hyp',M('(Abs2)  x ⊙ (x ⊕ y) = x')+'<span class="tag">فرضية</span>')]},
{say:'بما أن هذا القانون صحيح لأي x و y، فهو صحيح بشكل خاص إذا اخترنا x يساوي a، و y يساوي a. وهذا مشروع، لأن a ينتمي إلى B.',L:[S('sub',M('x = a,   y = a')+'<span class="tag">اختيار</span>')]},
{say:'نعوض. حيث كان x نكتب a، وحيث كان y نكتب a. في الطرف الأيسر يبقى a ⊙ (a ⊕ a)، وفي الطرف الأيمن يصبح x هو a. نسمي هذه المساواة المعادلة واحد.',L:[S('sub',M('a ⊙ (a ⊕ a) = a      (1)')+'<span class="tag">'+M('Abs2')+' مع '+M('x=a, y=a')+'</span>')]},
{say:'لاحظ أن a ⊕ a ظهر بالفعل، وهو التعبير الذي نريد تبسيطه. لكن ما زال علينا التخلص من الضرب في الخارج. لذلك سنستخدم قانون الامتصاص الأول.',L:[S('hyp',M('(Abs1)  x ⊕ (x ⊙ y) = x')+'<span class="tag">فرضية</span>')]},
{say:'نختار الآن x يساوي a، لكن هذه المرة y يساوي a ⊕ a. هل هذا مشروع؟ نعم: بما أن الجمع عملية داخلية، فإن a ⊕ a ينتمي إلى B، ولذلك يمكنه أن يلعب دور y.',L:[S('sub',M('x = a,   y = a ⊕ a  ∈ B')+'<span class="tag">اختيار ('+M('⊕')+' داخلية)</span>')]},
{say:'نعوض في قانون الامتصاص الأول. يصبح x هو a، ويصبح y هو القوس a ⊕ a. فنحصل على a ⊕ (a ⊙ (a ⊕ a)) يساوي a. هذه هي المعادلة اثنان.',L:[S('sub',M('a ⊕ ( a ⊙ (a ⊕ a) ) = a      (2)')+'<span class="tag">'+M('Abs1')+' مع '+M('x=a, y=a⊕a')+'</span>')]},
{say:'والآن الخطوة الأساسية. انظر داخل قوس المعادلة اثنين: نجد بالضبط a ⊙ (a ⊕ a). ومن المعادلة واحد، هذا التعبير يساوي a. لنحدده.',L:[S('sub',M('a ⊕ ( <mark>a ⊙ (a ⊕ a)</mark> ) = a      (2)')),S('txt','من '+M('(1)')+':  '+M('<mark>a ⊙ (a ⊕ a)</mark> = a'))]},
{say:'نستبدل هذا الجزء بـ a. فتصبح المعادلة اثنان: a ⊕ a يساوي a.',L:[S('sub',M('a ⊕ ( <mark>a</mark> ) = a')),S('res',M('a ⊕ a = a   ∎')+'<span class="tag">الاستنتاج: '+M('⊕')+' تحقق خاصية تساوي القوى</span>')]},
{say:'بما أن a كان اختياريًا، فهذا يصح لكل a من B. لقد أثبتنا خاصية تساوي القوى للجمع.',L:[S('res',M('∀a∈B:  a ⊕ a = a'))]},
{title:'الجزء الثاني: تساوي القوى للعملية ⊙',clear:1,say:'ننتقل الآن إلى خاصية تساوي القوى للضرب. الفكرة نفسها، لكن مع تبديل دوري قانوني الامتصاص. نأخذ مجددًا عنصرًا اختياريًا a من B.',L:[S('txt','ليكن '+M('a ∈ B')+'  (اختياري)'),S('goal','نريد: '+M('a ⊙ a = a')+'<span class="tag">المطلوب</span>')]},
{say:'هذه المرة نبدأ بقانون الامتصاص الأول: x ⊕ (x ⊙ y) = x.',L:[S('hyp',M('(Abs1)  x ⊕ (x ⊙ y) = x')+'<span class="tag">فرضية</span>')]},
{say:'نختار x يساوي a، و y يساوي a. القانون صحيح لكل x و y، فهو صحيح بشكل خاص لهذا الاختيار.',L:[S('sub',M('x = a,   y = a')+'<span class="tag">اختيار</span>')]},
{say:'بالتعويض: a ⊕ (a ⊙ a) يساوي a. هذه هي المعادلة ثلاثة. والآن يظهر a ⊙ a، وهو ما نريد تبسيطه.',L:[S('sub',M('a ⊕ (a ⊙ a) = a      (3)')+'<span class="tag">'+M('Abs1')+' مع '+M('x=a, y=a')+'</span>')]},
{say:'نستخدم الآن قانون الامتصاص الثاني: x ⊙ (x ⊕ y) = x.',L:[S('hyp',M('(Abs2)  x ⊙ (x ⊕ y) = x')+'<span class="tag">فرضية</span>')]},
{say:'نختار x يساوي a، و y يساوي a ⊙ a. وهذا مشروع لأن الضرب عملية داخلية، وبالتالي a ⊙ a ينتمي إلى B.',L:[S('sub',M('x = a,   y = a ⊙ a  ∈ B')+'<span class="tag">اختيار ('+M('⊙')+' داخلية)</span>')]},
{say:'نعوض: a ⊙ (a ⊕ (a ⊙ a)) يساوي a. هذه هي المعادلة أربعة.',L:[S('sub',M('a ⊙ ( a ⊕ (a ⊙ a) ) = a      (4)')+'<span class="tag">'+M('Abs2')+' مع '+M('x=a, y=a⊙a')+'</span>')]},
{say:'لاحظ القوس الداخلي في المعادلة أربعة: إنه a ⊕ (a ⊙ a). ومن المعادلة ثلاثة، فهو يساوي a.',L:[S('sub',M('a ⊙ ( <mark>a ⊕ (a ⊙ a)</mark> ) = a      (4)')),S('txt','من '+M('(3)')+':  '+M('<mark>a ⊕ (a ⊙ a)</mark> = a'))]},
{say:'باستبدال هذا الجزء بـ a، تصبح المعادلة أربعة: a ⊙ a يساوي a.',L:[S('sub',M('a ⊙ ( <mark>a</mark> ) = a')),S('res',M('a ⊙ a = a   ∎')+'<span class="tag">الاستنتاج: '+M('⊙')+' تحقق خاصية تساوي القوى</span>')]},
{title:'الخلاصة',clear:1,say:'خلاصة القول: باستخدام قانوني الامتصاص فقط، وكون العمليتين داخليتين، أثبتنا أنه لكل a من B، فإن a ⊕ a يساوي a، و a ⊙ a يساوي a. واتبعنا النمط نفسه في المرتين: نطبق أحد قانوني الامتصاص مع x و y يساويان a، ثم نطبق الآخر مع y يساوي النتيجة، ثم نعوض. شكرًا على المشاهدة.',L:[S('res',M('∀a∈B:  a ⊕ a = a')),S('res',M('∀a∈B:  a ⊙ a = a'))]}
];
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l.c;d.innerHTML=l.t;if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){const d=document.createElement('div');d.className='l hyp';d.innerHTML=s.pin;if(k<n)d.style.animation='none';pins.appendChild(d)}}
 board.scrollTop=board.scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();txt=txt.replace(/⊕/g,' زائد ').replace(/⊙/g,' ضرب ').replace(/[()]/g,', ').replace(/\s+/g,' ');const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang='ar-SA';
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ إعادة'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ متابعة'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ إيقاف مؤقت';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ إيقاف مؤقت';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ إيقاف مؤقت';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^ar/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/hamed|shakir|naayf|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
document.body.addEventListener('click',()=>{},{once:true});
render(-1);$('cap').textContent='0 / '+steps.length;
</script></body></html>
