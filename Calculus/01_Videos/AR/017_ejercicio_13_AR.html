<title>مجموعة أجزاء U جبر بول</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}

#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-inline-start:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
span[dir='ltr']{white-space:nowrap}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}

{"say": "لإثبات ذلك يجب أن نتحقق من أمرين، إضافة إلى أنها شبكة توزيعية أصلًا. الأول: وجود عنصر أصغر، هو الصفر، وعنصر أكبر، هو الواحد. والثاني: أن لكل عنصر A، أي لكل مجموعة جزئية من U، متممًا. نسجل على الجانب تعريفي الاتحاد والتقاطع بالعناصر، وتعريف المتمم، التي سنستخدمها.", "L": [["goal", "<span dir='ltr'>(1)</span>  يوجد عنصر أصغر <span dir='ltr'>0</span> وعنصر أكبر <span dir='ltr'>1</span>"], ["goal", "<span dir='ltr'>(2)</span>  لكل <span dir='ltr'>A ⊆ U</span> متمم<span class='tag'>ما يجب التحقق منه</span>"]], "pin": ["تعريف الاتحاد: <span dir='ltr'>x ∈ X ∪ Y ⇔ x ∈ X ∨ x ∈ Y</span>", "تعريف التقاطع: <span dir='ltr'>x ∈ X ∩ Y ⇔ x ∈ X ∧ x ∈ Y</span>", "تعريف المتمم: <span dir='ltr'>x ∈ A<sup>c</sup> ⇔ x ∈ U ∧ x ∉ A</span>"]},

{"title": "ثانيًا: وجود المتمم", "clear": 1, "say": "ننتقل إلى وجود المتمم. لتكن A مجموعة جزئية من U. سنثبت أن متمم المجموعة A هو متمم لـ A في الشبكة. ولذلك يجب التحقق من شرطين: A اتحاد متممها يساوي U، و A تقاطع متممها يساوي المجموعة الخالية.", "L": [["txt", "لتكن <span dir='ltr'>A ⊆ U</span>"], ["goal", "<span dir='ltr'>(a)  A ∪ A<sup>c</sup> = U</span>"], ["goal", "<span dir='ltr'>(b)  A ∩ A<sup>c</sup> = ∅</span><span class='tag'>شرطا المتمم</span>"]]},

{"title": "الشرط الأول: اتحاد A ومتممها هو U", "clear": 1, "say": "الشرط الأول. نريد إثبات أن A اتحاد متممها يساوي U. ليكن x عنصرًا من U. ننطلق من أن x ينتمي إلى A اتحاد متمم A.", "L": [["goal", "نريد:  <span dir='ltr'>A ∪ A<sup>c</sup> = U</span>"], ["txt", "ليكن <span dir='ltr'>x ∈ U</span>"], ["txt", "<span dir='ltr'>x ∈ A ∪ A<sup>c</sup></span>"]]},

{"say": "الخطوة الثانية. بتعريف المتمم، x ينتمي إلى متمم A، إذا وفقط إذا، كان x لا ينتمي إلى A. إذن لدينا: x ينتمي إلى A، أو x لا ينتمي إلى A.", "L": [["sub", "⇔  <span dir='ltr'>(x ∈ A  ∨  x ∉ A)</span><span class='tag'>تعريف المتمم</span>"]]},

{"say": "هذا صحيح دائمًا: فإما أن x ينتمي إلى A، وإما لا. إذن كل عنصر x من U ينتمي إلى A اتحاد متممها. وبما أن A ومتممها مجموعتان جزئيتان من U، فاتحادهما كذلك، ونستنتج أن A اتحاد متممها يساوي U.", "L": [["res", "<span dir='ltr'>(x ∈ A  ∨  x ∉ A)</span>  صحيحة دائمًا<span class='tag'>العنصر إما ينتمي إلى <span dir='ltr'>A</span> وإما لا ينتمي</span>"], ["res", "<span dir='ltr'>A ∪ A<sup>c</sup> = U   ∎</span>"]]},

{"title": "الشرط الثاني: تقاطع A ومتممها خالٍ", "clear": 1, "say": "الشرط الثاني. نريد إثبات أن A تقاطع متممها يساوي المجموعة الخالية. ليكن x عنصرًا من U. ننطلق من أن x ينتمي إلى A تقاطع متمم A.", "L": [["goal", "نريد:  <span dir='ltr'>A ∩ A<sup>c</sup> = ∅</span>"], ["txt", "ليكن <span dir='ltr'>x ∈ U</span>"], ["txt", "<span dir='ltr'>x ∈ A ∩ A<sup>c</sup></span>"]]},

{"say": "الخطوة الأولى. بتعريف التقاطع، x ينتمي إلى A تقاطع متمم A، إذا وفقط إذا، كان x ينتمي إلى A، و x ينتمي إلى متمم A.", "L": [["sub", "⇔  <span dir='ltr'>(x ∈ A  ∧  x ∈ A<sup>c</sup>)</span><span class='tag'>تعريف التقاطع</span>"]]},

{"say": "الخطوة الثانية. بتعريف المتمم، x ينتمي إلى متمم A، إذا وفقط إذا، كان x لا ينتمي إلى A. إذن لدينا: x ينتمي إلى A، و x لا ينتمي إلى A.", "L": [["sub", "⇔  <span dir='ltr'>(x ∈ A  ∧  x ∉ A)</span><span class='tag'>تعريف المتمم</span>"]]},

{"say": "هذا مستحيل: لا يمكن أن ينتمي x إلى A وألا ينتمي إليها في الوقت نفسه. إذن لا يوجد عنصر x ينتمي إلى A تقاطع متممها، ونستنتج أن A تقاطع متممها يساوي المجموعة الخالية.", "L": [["res", "<span dir='ltr'>(x ∈ A  ∧  x ∉ A)</span>  مستحيلة<span class='tag'>لا يوجد <span dir='ltr'>x</span> يحقق الأمرين</span>"], ["res", "<span dir='ltr'>A ∩ A<sup>c</sup> = ∅   ∎</span>"]]},

{"title": "لكل عنصر متمم", "clear": 1, "say": "أثبتنا أنه لكل مجموعة جزئية A من U، A اتحاد متممها هو U، و A تقاطع متممها هو المجموعة الخالية. أي أن لكل عنصر من مجموعة أجزاء U متممًا.", "L": [["res", "<span dir='ltr'>A ∪ A<sup>c</sup> = U</span><span class='tag'>لكل <span dir='ltr'>A ⊆ U</span></span>"], ["res", "<span dir='ltr'>A ∩ A<sup>c</sup> = ∅</span><span class='tag'>لكل <span dir='ltr'>A ⊆ U</span></span>"], ["res", "لكل عنصر من مجموعة أجزاء <span dir='ltr'>U</span> متمم   <span dir='ltr'>∎</span>"]]},

{"title": "الاستنتاج", "clear": 1, "say": "بما أن مجموعة أجزاء U، مع الاتحاد والتقاطع، شبكة توزيعية، لها عنصر أصغر هو المجموعة الخالية، وعنصر أكبر هو U، ولكل عنصر فيها متمم، نستنتج أن مجموعة أجزاء U، مع الاتحاد والتقاطع والمتمم، تشكّل جبر بول. شكرًا على المشاهدة.", "L": [["res", "<span dir='ltr'>(𝒫(U), ∪, ∩)</span> شبكة توزيعية"], ["res", "الأصغر <span dir='ltr'>∅</span>،   الأكبر <span dir='ltr'>U</span>"], ["res", "لكل <span dir='ltr'>A</span> متمم هو <span dir='ltr'>A<sup>c</sup></span>"], ["res", "<span dir='ltr'>(𝒫(U), ∪, ∩, <sup>c</sup>)</span> جبر بول   <span dir='ltr'>∎</span>"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' زائد ').replace(/⊙/g,' ضرب ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ إعادة'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ متابعة'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ إيقاف مؤقت';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ إيقاف مؤقت';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ إيقاف مؤقت';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^ar/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/hamed|shakir|naayf|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="مجموعة أجزاء U جبر بول";$('sub').textContent="تمرين · جبر المجموعات";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
