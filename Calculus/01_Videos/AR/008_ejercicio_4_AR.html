<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ترتيبان متطابقان</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-inline-end:2px dashed #3d5a50;padding-inline-end:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-inline-start:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(15px,1.9vw,24px)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
sub{font-size:.6em}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>تذكّر</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ ابدأ</button><button id="next">▶|</button>
<select id="voice"></select>
<label>السرعة <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">وضع التسجيل (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"ar-SA",
"meta":{"nivel": 2, "titulo": "ترتيبان متطابقان", "enunciado": "لتكن <span dir='ltr'>(B, ⊕, ⊙)</span> شبكة. نعرّف  <span dir='ltr'>x ≤⊕ y ⇔ x ⊕ y = y</span>  و  <span dir='ltr'>x ≤⊙ y ⇔ x ⊙ y = x.</span>  أثبت أنه لكل <span dir='ltr'>x, y ∈ B:</span>", "tesis": "x ≤⊕ y  ⇔  x ≤⊙ y", "datos": ["(إبدال الجمع)  <span dir='ltr'>x ⊕ y = y ⊕ x</span>", "(إبدال الضرب)  <span dir='ltr'>x ⊙ y = y ⊙ x</span>", "<span dir='ltr'>(Abs1)  x ⊕ (x ⊙ y) = x</span>", "<span dir='ltr'>(Abs2)  x ⊙ (x ⊕ y) = x</span>"]},
"steps":[
{"title": "ترتيبان متطابقان", "sub": "تمرين · الشبكات الجبرية", "clear": 1, "say": "مرحبًا. في هذا الفيديو سنحل تمرينًا عن الشبكات الجبرية. سنتقدم ببطء شديد، فنكتب كل معادلة ونبرر كل خطوة.", "L": [["txt", "طريقتان لتعريف ترتيب على شبكة: هل هما الترتيب نفسه؟"]]},

{"say": "أولًا، المعطيات. B مجموعة معرّف عليها عمليتان، جمع الشبكة وضرب الشبكة، وهي شبكة. أي أن العمليتين داخليتان، إبداليتان، تجميعيتان، وتحققان قانوني الامتصاص.", "L": [["hyp", "<span dir='ltr'>(B, ⊕, ⊙)</span> شبكة<span class='tag'>فرضية</span>"]]},

{"say": "في هذا التمرين سنستخدم أربع خواص. إبدالية الجمع: x زائد y يساوي y زائد x. إبدالية الضرب: x ضرب y يساوي y ضرب x. قانون الامتصاص الأول: x زائد، x ضرب y، يساوي x. والثاني: x ضرب، x زائد y، يساوي x. نثبّتها على الجانب لأننا سنستخدمها.", "pin": ["(إبدال الجمع) <span dir='ltr'>x ⊕ y = y ⊕ x</span>", "(إبدال الضرب) <span dir='ltr'>x ⊙ y = y ⊙ x</span>", "<span dir='ltr'>(Abs1) x ⊕ (x ⊙ y) = x</span>", "<span dir='ltr'>(Abs2) x ⊙ (x ⊕ y) = x</span>"]},

{"say": "والآن التعريفان. نعرّف على B علاقتين. الأولى نسميها أصغر من أو يساوي بالنسبة إلى الجمع: x أصغر من أو يساوي y إذا وفقط إذا كان x زائد y يساوي y. وفي المجموعات هي الخاصية المعروفة: A محتواة في B إذا وفقط إذا كان A اتحاد B يساوي B.", "L": [["sub", "<span dir='ltr'>x ≤<sub>⊕</sub> y  ⇔  x ⊕ y = y</span><span class='tag'>تعريف <span dir='ltr'>≤⊕</span></span>"], ["txt", "مع المجموعات:  <span dir='ltr'>A ⊆ B  ⇔  A ∪ B = B</span>"]]},

{"say": "والثانية نسميها أصغر من أو يساوي بالنسبة إلى الضرب: x أصغر من أو يساوي y إذا وفقط إذا كان x ضرب y يساوي x. وفي المجموعات هي أيضًا خاصية معروفة: A محتواة في B إذا وفقط إذا كان A تقاطع B يساوي A.", "L": [["sub", "<span dir='ltr'>x ≤<sub>⊙</sub> y  ⇔  x ⊙ y = x</span><span class='tag'>تعريف <span dir='ltr'>≤⊙</span></span>"], ["txt", "مع المجموعات:  <span dir='ltr'>A ⊆ B  ⇔  A ∩ B = A</span>"]]},

{"say": "نسجل التعريفين على الجانب، تحت الخواص السابقة، لأنهما مفتاح التمرين.", "pin": ["(تعريف الجمع) <span dir='ltr'>x ≤<sub>⊕</sub> y ⇔ x ⊕ y = y</span>", "(تعريف الضرب) <span dir='ltr'>x ≤<sub>⊙</sub> y ⇔ x ⊙ y = x</span>"]},

{"say": "المطلوب إثباته. لكل x و y من B، يكون x أصغر من أو يساوي y بالنسبة إلى الجمع، إذا وفقط إذا، كان x أصغر من أو يساوي y بالنسبة إلى الضرب. أي أن العلاقتين متطابقتان. وفي المجموعات، يعني هذا أن A اتحاد B يساوي B تمامًا عندما يكون A تقاطع B يساوي A.", "L": [["goal", "<span dir='ltr'>∀ x, y ∈ B:   x ≤<sub>⊕</sub> y  ⇔  x ≤<sub>⊙</sub> y</span><span class='tag'>المطلوب</span>"], ["txt", "مع المجموعات:  <span dir='ltr'>A ∪ B = B  ⇔  A ∩ B = A</span>"]]},

{"say": "بما أنه تكافؤ، نثبته على جزأين. أولًا الاستلزام نحو اليمين، ثم الاستلزام نحو اليسار. ليكن x و y عنصرين ما من B.", "L": [["txt", "ليكن <span dir='ltr'>x, y ∈ B</span>  (اختياريين)"], ["goal", "<span dir='ltr'>(1)  x ≤<sub>⊕</sub> y  ⇒  x ≤<sub>⊙</sub> y</span>"], ["goal", "<span dir='ltr'>(2)  x ≤<sub>⊙</sub> y  ⇒  x ≤<sub>⊕</sub> y</span>"]]},

{"title": "الجزء الأول: x ≤⊕ y ⟹ x ≤⊙ y", "clear": 1, "say": "نبدأ بالاستلزام الأول. نفترض أن x أصغر من أو يساوي y بالنسبة إلى الجمع. هذه فرضية، وبحسب التعريف تعني أن x زائد y يساوي y.", "L": [["hyp", "<span dir='ltr'>x ≤<sub>⊕</sub> y</span><span class='tag'>فرضية</span>"], ["hyp", "<span dir='ltr'>x ⊕ y = y</span><span class='tag'>فرضية، بحسب تعريف <span dir='ltr'>≤⊕</span></span>"]]},

{"say": "نريد إثبات أن x أصغر من أو يساوي y بالنسبة إلى الضرب. وبحسب التعريف، يعني هذا أن x ضرب y يساوي x. هذه هي المساواة التي سنثبتها. ننطلق من الطرف الأيسر، x ضرب y.", "L": [["goal", "نريد:  <span dir='ltr'>x ⊙ y = x</span><span class='tag'>المطلوب، بحسب تعريف <span dir='ltr'>≤⊙</span></span>"], ["txt", "<span dir='ltr'>x ⊙ y</span>"]]},

{"say": "الخطوة الأولى. نستخدم الفرضية: y يساوي x زائد y. إذن يمكننا استبدال y التي على اليمين بـ x زائد y. ونترك x الأولى كما هي. ننتقل من x ضرب y، إلى x ضرب، x زائد y.", "L": [["sub", "<span dir='ltr'>x ⊙ y  =  x ⊙ (x ⊕ y)</span><span class='tag'>تعويض: <span dir='ltr'>y = x ⊕ y</span>  (الفرضية)</span>"]]},

{"say": "الخطوة الثانية. لدينا الآن قانون الامتصاص الثاني تمامًا، مع x يساوي x، و y يساوي y: x ضرب، x زائد y، يساوي x. نميّزه.", "L": [["sub", "<span dir='ltr'>x ⊙ y  =  <mark>x ⊙ (x ⊕ y)</mark></span>"], ["txt", "بحسب <span dir='ltr'>(Abs2):  <mark>x ⊙ (x ⊕ y)</mark> = x</span>"]]},

{"say": "نستبدل هذه الكتلة بـ x. فنحصل على أن x ضرب y يساوي x.", "L": [["res", "<span dir='ltr'>x ⊙ y  =  x</span><span class='tag'>الامتصاص</span>"]]},

{"say": "بحسب التعريف، تعني هذه المساواة أن x أصغر من أو يساوي y بالنسبة إلى الضرب. وبهذا ينتهي الاستلزام الأول.", "L": [["res", "<span dir='ltr'>x ⊙ y = x   ⟹   x ≤<sub>⊙</sub> y   ∎</span>"]]},

{"title": "الجزء الثاني: x ≤⊙ y ⟹ x ≤⊕ y", "clear": 1, "say": "ننتقل إلى الاستلزام الثاني. نفترض الآن أن x أصغر من أو يساوي y بالنسبة إلى الضرب. وبحسب التعريف، يعني هذا أن x ضرب y يساوي x. هذه فرضية هذا الجزء.", "L": [["hyp", "<span dir='ltr'>x ≤<sub>⊙</sub> y</span><span class='tag'>فرضية</span>"], ["hyp", "<span dir='ltr'>x ⊙ y = x</span><span class='tag'>فرضية، بحسب تعريف <span dir='ltr'>≤⊙</span></span>"]]},

{"say": "نريد إثبات أن x أصغر من أو يساوي y بالنسبة إلى الجمع. وبحسب التعريف، يعني هذا أن x زائد y يساوي y. ننطلق من الطرف الأيسر، x زائد y.", "L": [["goal", "نريد:  <span dir='ltr'>x ⊕ y = y</span><span class='tag'>المطلوب، بحسب تعريف <span dir='ltr'>≤⊕</span></span>"], ["txt", "<span dir='ltr'>x ⊕ y</span>"]]},

{"say": "الخطوة الأولى. نستخدم الفرضية: x يساوي x ضرب y. نستبدل x التي على اليسار بـ x ضرب y، ونترك y كما هي. ننتقل من x زائد y، إلى، x ضرب y، زائد y.", "L": [["sub", "<span dir='ltr'>x ⊕ y  =  (x ⊙ y) ⊕ y</span><span class='tag'>تعويض: <span dir='ltr'>x = x ⊙ y</span>  (الفرضية)</span>"]]},

{"say": "الخطوة الثانية. في العبارة تقع y على اليمين، والامتصاص يحتاج أن تكون على اليسار. نطبق إبدالية الجمع، مع x يساوي x ضرب y، و y يساوي y. ننتقل من x ضرب y، زائد y، إلى y زائد، x ضرب y.", "L": [["sub", "<span dir='ltr'>x ⊕ y  =  y ⊕ (x ⊙ y)</span><span class='tag'>إبدالية الجمع</span>"]]},

{"say": "الخطوة الثالثة. لتطبيق الامتصاص الأول مع x يساوي y، يجب أن يظهر داخل القوس y ضرب x، لا x ضرب y. نطبق إبدالية الضرب: x ضرب y يساوي y ضرب x.", "L": [["sub", "<span dir='ltr'>y ⊕ (<mark>x ⊙ y</mark>)</span>"], ["txt", "بحسب (إبدال الضرب):  <span dir='ltr'><mark>x ⊙ y</mark> = y ⊙ x</span>"], ["sub", "<span dir='ltr'>x ⊕ y  =  y ⊕ (y ⊙ x)</span><span class='tag'>إبدالية الضرب</span>"]]},

{"say": "الخطوة الرابعة. الآن لدينا فعلًا قانون الامتصاص الأول، مع x يساوي y، و y يساوي x: y زائد، y ضرب x، يساوي y. نميّزه ونعوّض.", "L": [["sub", "<span dir='ltr'>x ⊕ y  =  <mark>y ⊕ (y ⊙ x)</mark></span>"], ["txt", "بحسب <span dir='ltr'>(Abs1)</span> مع <span dir='ltr'>x=y, y=x:  <mark>y ⊕ (y ⊙ x)</mark> = y</span>"], ["res", "<span dir='ltr'>x ⊕ y  =  y</span><span class='tag'>الامتصاص</span>"]]},

{"say": "بحسب التعريف، تعني هذه المساواة أن x أصغر من أو يساوي y بالنسبة إلى الجمع. وبهذا ينتهي الاستلزام الثاني.", "L": [["res", "<span dir='ltr'>x ⊕ y = y   ⟹   x ≤<sub>⊕</sub> y   ∎</span>"]]},

{"title": "الاستنتاج", "clear": 1, "say": "لقد أثبتنا الاستلزامين. إذن، لكل x و y من B، يكون x أصغر من أو يساوي y بالنسبة إلى الجمع، إذا وفقط إذا، كان x أصغر من أو يساوي y بالنسبة إلى الضرب. التعريفان للترتيب متكافئان.", "L": [["res", "<span dir='ltr'>(1)  x ≤<sub>⊕</sub> y  ⇒  x ≤<sub>⊙</sub> y   ∎</span>"], ["res", "<span dir='ltr'>(2)  x ≤<sub>⊙</sub> y  ⇒  x ≤<sub>⊕</sub> y   ∎</span>"], ["res", "<span dir='ltr'>x ≤<sub>⊕</sub> y  ⇔  x ≤<sub>⊙</sub> y</span>"]]},

{"title": "الخلاصة", "clear": 1, "say": "نلخص. في الاستلزام الأول، استبدلنا y بـ x زائد y وطبقنا الامتصاص الثاني. وفي الثاني، استبدلنا x بـ x ضرب y، وبدّلنا ترتيب الجمع، وبدّلنا ترتيب الضرب، ثم طبقنا الامتصاص الأول. وفي المجموعات، هذا هو التكافؤ المعروف: A اتحاد B يساوي B، إذا وفقط إذا، كان A تقاطع B يساوي A. شكرًا على المشاهدة.", "L": [["res", "<span dir='ltr'>(1)</span>  تعويض + <span dir='ltr'>Abs2</span>"], ["res", "<span dir='ltr'>(2)</span>  تعويض + إبدال الجمع + إبدال الضرب + <span dir='ltr'>Abs1</span>"], ["txt", "مع المجموعات:  <span dir='ltr'>A ∪ B = B  ⇔  A ∩ B = A</span>"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' زائد ').replace(/⊙/g,' ضرب ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ إعادة'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ متابعة'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ إيقاف مؤقت';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ إيقاف مؤقت';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ إيقاف مؤقت';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^ar/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/hamed|shakir|naayf|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="ترتيبان متطابقان";$('sub').textContent="تمرين · الشبكات الجبرية";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
