<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الجداء الديكارتي والتقاطع</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-inline-end:2px dashed #3d5a50;padding-inline-end:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-inline-start:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
span[dir='ltr']{white-space:nowrap}
svg{direction:ltr}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>تذكّر</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ ابدأ</button><button id="next">▶|</button>
<select id="voice"></select>
<label>السرعة <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">وضع التسجيل (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"ar-SA",
"meta":{"nivel": 2, "titulo": "الجداء الديكارتي والتقاطع", "enunciado": "أثبت أنه لأي مجموعات <span dir='ltr'>A</span> و <span dir='ltr'>B</span> و <span dir='ltr'>C</span> و <span dir='ltr'>D</span> يتحقق:", "tesis": "(A ∩ B) × (C ∩ D) = (A × C) ∩ (B × D)", "datos": ["تعريف الجداء الديكارتي:  <span dir='ltr'>(x, y) ∈ X × Y  ⟺  x ∈ X ∧ y ∈ Y</span>"]},
"steps":[
{"title": "الجداء الديكارتي والتقاطع", "sub": "تمرين · جبر المجموعات", "clear": 1, "say": "مرحبًا. في هذا الفيديو سنثبت أن الجداء الديكارتي لتقاطعين هو تقاطع جداءين ديكارتيين. سنستدل عنصرًا عنصرًا، ببطء شديد، فنكتب كل معادلة ونبرر كل خطوة.", "L": [["txt", "إثبات أن  <span dir='ltr'>(A ∩ B) × (C ∩ D) = (A × C) ∩ (B × D)</span>"]]},

{"say": "ما نريد إثباته. لأي مجموعات A و B و C و D، فإن تقاطع A و B، ضرب تقاطع C و D، يساوي تقاطع A ضرب C، مع B ضرب D. نتذكر على الجانب التعريفات التي سنستخدمها: الجداء الديكارتي، والتقاطع، والاحتواء، وتساوي المجموعات.", "L": [["goal", "<span dir='ltr'>(A ∩ B) × (C ∩ D) = (A × C) ∩ (B × D)</span><span class='tag'>أثبت، لأي <span dir='ltr'>A</span> و <span dir='ltr'>B</span> و <span dir='ltr'>C</span> و <span dir='ltr'>D</span></span>"]], "pin": ["تعريف الجداء الديكارتي: <span dir='ltr'>(x, y) ∈ X × Y  ⟺  x ∈ X ∧ y ∈ Y</span>", "تعريف التقاطع: <span dir='ltr'>p ∈ X ∩ Y  ⟺  p ∈ X ∧ p ∈ Y</span>", "تعريف الاحتواء: <span dir='ltr'>X ⊆ Y</span>  ⟺  كل <span dir='ltr'>p ∈ X</span> يحقق <span dir='ltr'>p ∈ Y</span>", "تعريف التساوي: <span dir='ltr'>X = Y  ⟺  X ⊆ Y ∧ Y ⊆ X</span>"]},

{"title": "الخطة: الاحتواء المزدوج", "clear": 1, "say": "سنستدل عنصرًا عنصرًا. بحسب تعريف التساوي، علينا أن نثبت احتواءين. الأول: تقاطع A و B، ضرب تقاطع C و D، محتوى في تقاطع A ضرب C مع B ضرب D. والثاني: الاحتواء المعاكس.", "L": [["goal", "<span dir='ltr'>(1)  (A ∩ B) × (C ∩ D) ⊆ (A × C) ∩ (B × D)</span>"], ["goal", "<span dir='ltr'>(2)  (A × C) ∩ (B × D) ⊆ (A ∩ B) × (C ∩ D)</span>"]]},

{"title": "(١) الاحتواء الأول", "clear": 1, "say": "الاحتواء الأول. بحسب تعريف الاحتواء، نأخذ عنصرًا كيفيًا x، y من المجموعة الأولى، وعلينا أن نثبت أنه ينتمي إلى الثانية.", "L": [["hyp", "ليكن <span dir='ltr'>(x, y) ∈ (A ∩ B) × (C ∩ D)</span>"], ["goal", "نريد:  <span dir='ltr'>(x, y) ∈ (A × C) ∩ (B × D)</span>"]]},

{"say": "بحسب تعريف الجداء الديكارتي، حيث المجموعة الأولى هي A تقاطع B، والثانية هي C تقاطع D، فإن الإحداثي الأول x ينتمي إلى A تقاطع B، والإحداثي الثاني y ينتمي إلى C تقاطع D.", "L": [["txt", "حسب تعريف الجداء الديكارتي مع  <span dir='ltr'>X = A ∩ B</span>  و  <span dir='ltr'>Y = C ∩ D</span>:"], ["sub", "<span dir='ltr'>x ∈ A ∩ B   ∧   y ∈ C ∩ D</span>"]]},

{"say": "بحسب تعريف التقاطع، انتماء x إلى A تقاطع B يعني أن x ينتمي إلى A، و x ينتمي إلى B. وانتماء y إلى C تقاطع D يعني أن y ينتمي إلى C، و y ينتمي إلى D.", "L": [["txt", "حسب تعريف التقاطع:"], ["sub", "<span dir='ltr'>x ∈ A  ∧  x ∈ B</span>"], ["sub", "<span dir='ltr'>y ∈ C  ∧  y ∈ D</span>"]]},

{"clear": 1, "say": "الآن نعيد التجميع بطريقة أخرى. بما أن x ينتمي إلى A، و y ينتمي إلى C، فبحسب تعريف الجداء الديكارتي، الزوج x، y ينتمي إلى A ضرب C. وبما أن x ينتمي إلى B، و y ينتمي إلى D، فالزوج x، y ينتمي إلى B ضرب D.", "L": [["txt", "نعيد التجميع:  <span dir='ltr'>x ∈ A  ∧  y ∈ C</span>،  ومنه حسب تعريف الجداء الديكارتي:"], ["sub", "<span dir='ltr'>(x, y) ∈ A × C</span>"], ["txt", "وأيضًا:  <span dir='ltr'>x ∈ B  ∧  y ∈ D</span>،  ومنه حسب تعريف الجداء الديكارتي:"], ["sub", "<span dir='ltr'>(x, y) ∈ B × D</span>"]]},

{"say": "بحسب تعريف التقاطع، حيث المجموعة الأولى هي A ضرب C، والثانية هي B ضرب D، فإن الزوج x، y ينتمي إلى تقاطع A ضرب C مع B ضرب D.", "L": [["txt", "<span dir='ltr'>(x, y) ∈ A × C   ∧   (x, y) ∈ B × D</span>،  ومنه حسب تعريف التقاطع:"], ["res", "<span dir='ltr'>(x, y) ∈ (A × C) ∩ (B × D)</span>"]]},

{"say": "بما أن x، y كان عنصرًا كيفيًا من تقاطع A و B ضرب تقاطع C و D، نستنتج الاحتواء الأول.", "L": [["res", "<span dir='ltr'>(A ∩ B) × (C ∩ D) ⊆ (A × C) ∩ (B × D)</span>"]]},

{"title": "(٢) الاحتواء الثاني", "clear": 1, "say": "الاحتواء الثاني. نأخذ عنصرًا كيفيًا x، y من تقاطع A ضرب C مع B ضرب D، وعلينا أن نثبت أنه ينتمي إلى تقاطع A و B، ضرب تقاطع C و D.", "L": [["hyp", "ليكن <span dir='ltr'>(x, y) ∈ (A × C) ∩ (B × D)</span>"], ["goal", "نريد:  <span dir='ltr'>(x, y) ∈ (A ∩ B) × (C ∩ D)</span>"]]},

{"say": "بحسب تعريف التقاطع، الزوج x، y ينتمي إلى A ضرب C، والزوج x، y ينتمي إلى B ضرب D.", "L": [["txt", "حسب تعريف التقاطع:"], ["sub", "<span dir='ltr'>(x, y) ∈ A × C   ∧   (x, y) ∈ B × D</span>"]]},

{"say": "بحسب تعريف الجداء الديكارتي، انتماء الزوج x، y إلى A ضرب C يعني أن x ينتمي إلى A، و y ينتمي إلى C. وانتماؤه إلى B ضرب D يعني أن x ينتمي إلى B، و y ينتمي إلى D.", "L": [["txt", "حسب تعريف الجداء الديكارتي:"], ["sub", "<span dir='ltr'>x ∈ A  ∧  y ∈ C</span>"], ["sub", "<span dir='ltr'>x ∈ B  ∧  y ∈ D</span>"]]},

{"clear": 1, "say": "الآن نعيد التجميع بطريقة أخرى. بما أن x ينتمي إلى A، و x ينتمي إلى B، فبحسب تعريف التقاطع، x ينتمي إلى A تقاطع B. وبما أن y ينتمي إلى C، و y ينتمي إلى D، فإن y ينتمي إلى C تقاطع D.", "L": [["txt", "نعيد التجميع:  <span dir='ltr'>x ∈ A  ∧  x ∈ B</span>،  ومنه حسب تعريف التقاطع:"], ["sub", "<span dir='ltr'>x ∈ A ∩ B</span>"], ["txt", "وأيضًا:  <span dir='ltr'>y ∈ C  ∧  y ∈ D</span>،  ومنه حسب تعريف التقاطع:"], ["sub", "<span dir='ltr'>y ∈ C ∩ D</span>"]]},

{"say": "بحسب تعريف الجداء الديكارتي، حيث المجموعة الأولى هي A تقاطع B، والثانية هي C تقاطع D، فإن الزوج x، y ينتمي إلى تقاطع A و B، ضرب تقاطع C و D.", "L": [["txt", "<span dir='ltr'>x ∈ A ∩ B  ∧  y ∈ C ∩ D</span>،  ومنه حسب تعريف الجداء الديكارتي:"], ["res", "<span dir='ltr'>(x, y) ∈ (A ∩ B) × (C ∩ D)</span>"]]},

{"say": "بما أن x، y كان عنصرًا كيفيًا من تقاطع A ضرب C مع B ضرب D، نستنتج الاحتواء الثاني.", "L": [["res", "<span dir='ltr'>(A × C) ∩ (B × D) ⊆ (A ∩ B) × (C ∩ D)</span>"]]},

{"title": "الخاتمة", "clear": 1, "say": "الخاتمة. بما أن الاحتواءين متحققان، فبحسب تعريف التساوي، تقاطع A و B، ضرب تقاطع C و D، يساوي تقاطع A ضرب C مع B ضرب D. شكرًا على المشاهدة.", "L": [["txt", "<span dir='ltr'>(1)  (A ∩ B) × (C ∩ D) ⊆ (A × C) ∩ (B × D)</span>"], ["txt", "<span dir='ltr'>(2)  (A × C) ∩ (B × D) ⊆ (A ∩ B) × (C ∩ D)</span>"], ["res", "<span dir='ltr'>(A ∩ B) × (C ∩ D) = (A × C) ∩ (B × D)</span>"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' زائد ').replace(/⊙/g,' ضرب ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ إعادة'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ متابعة'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ إيقاف مؤقت';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ إيقاف مؤقت';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ إيقاف مؤقت';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^ar/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/hamed|shakir|naayf|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="الجداء الديكارتي والتقاطع";$('sub').textContent="تمرين · جبر المجموعات";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
