<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قانون الالتفاف</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-inline-end:2px dashed #3d5a50;padding-inline-end:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-inline-start:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(15px,1.9vw,24px)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
span[dir='ltr']{white-space:nowrap}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>تذكّر</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ ابدأ</button><button id="next">▶|</button>
<select id="voice"></select>
<label>السرعة <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">وضع التسجيل (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"ar-SA",
"meta":{"nivel": 2, "titulo": "قانون الالتفاف", "enunciado": "ليكن <span dir='ltr'>(B, ⊕, ⊙, ∼)</span> جبر بول.  أثبت أنه لكل <span dir='ltr'>a ∈ B</span> يتحقق قانون الالتفاف:", "tesis": "∼(∼a) = a", "datos": ["(إبدال الجمع)  <span dir='ltr'>x ⊕ y = y ⊕ x</span>", "(إبدال الضرب)  <span dir='ltr'>x ⊙ y = y ⊙ x</span>", "(المتمم)  <span dir='ltr'>x ⊕ ∼x = 1,   x ⊙ ∼x = 0</span>", "(الوحدانية)  <span dir='ltr'>x ⊕ y = 1</span> و <span dir='ltr'>x ⊙ y = 0 ⇒ y = ∼x</span>"]},
"steps":[
{"title": "قانون الالتفاف", "sub": "تمرين · جبر بول", "clear": 1, "say": "مرحبًا. في هذا الفيديو سنحل تمرينًا عن جبر بول. سنتقدم ببطء شديد، فنكتب كل معادلة ونبرر كل خطوة.", "L": [["txt", "متمم متمم <span dir='ltr'>a</span> هو <span dir='ltr'>a</span>"]]},

{"say": "أولًا، المعطيات. B مجموعة معرّف عليها عمليتان، الجمع والضرب، وعملية متمم نكتبها بعلامة التيلدا. وهي جبر بول: شبكة توزيعية لها عنصر أصغر هو الصفر، وعنصر أكبر هو الواحد، ولكل عنصر متمم. والمثال النموذجي هو مجموعة أجزاء مجموعة U، مع الاتحاد والتقاطع والمتمم.", "L": [["hyp", "<span dir='ltr'>(B, ⊕, ⊙, ∼)</span> جبر بول<span class='tag'>فرضية</span>"], ["txt", "مع المجموعات:  <span dir='ltr'>𝒫(U)</span> مع الاتحاد والتقاطع والمتمم"]]},

{"say": "نتذكر تعريف المتمم. متمم x عنصر يحقق شرطين معًا: x زائد متممه يساوي واحدًا، و x ضرب متممه يساوي صفرًا. وفي المجموعات: A اتحاد متممها يساوي U، و A تقاطع متممها هو المجموعة الخالية.", "L": [["sub", "<span dir='ltr'>x ⊕ ∼x = 1</span><span class='tag'>تعريف المتمم</span>"], ["sub", "<span dir='ltr'>x ⊙ ∼x = 0</span><span class='tag'>تعريف المتمم</span>"], ["txt", "مع المجموعات:  <span dir='ltr'>A ∪ A<sup>c</sup> = U,   A ∩ A<sup>c</sup> = ∅</span>"]]},

{"say": "من النتائج الأساسية في جبر بول أن متمم كل عنصر وحيد. أي إذا حقق عنصر y الشرطين بالنسبة إلى x، أي x زائد y يساوي واحدًا، و x ضرب y يساوي صفرًا، فإن y هو متمم x. وفي المجموعات: المجموعة الوحيدة التي اتحادها مع A يساوي U وتقاطعها مع A خالٍ هي متممة A.", "L": [["sub", "<span dir='ltr'>x ⊕ y = 1</span>   و   <span dir='ltr'>x ⊙ y = 0   ⟹   y = ∼x</span><span class='tag'>وحدانية المتمم</span>"], ["txt", "مع المجموعات:  <span dir='ltr'>A ∪ Y = U</span>  و  <span dir='ltr'>A ∩ Y = ∅  ⟹  Y = A<sup>c</sup></span>"]]},

{"say": "نسجل على الجانب ما سنستخدمه: إبدالية الجمع، وإبدالية الضرب، وتعريف المتمم، والوحدانية.", "pin": ["(إبدال الجمع) <span dir='ltr'>x ⊕ y = y ⊕ x</span>", "(إبدال الضرب) <span dir='ltr'>x ⊙ y = y ⊙ x</span>", "(المتمم) <span dir='ltr'>x ⊕ ∼x = 1,   x ⊙ ∼x = 0</span>", "(الوحدانية) <span dir='ltr'>x ⊕ y = 1</span> و <span dir='ltr'>x ⊙ y = 0 ⇒ y = ∼x</span>"]},

{"say": "المطلوب إثباته. لكل عنصر a من B، متمم متمم a يساوي a. وهذا هو قانون الالتفاف. وفي المجموعات: متممة متممة A هي A.", "L": [["goal", "<span dir='ltr'>∀ a ∈ B:   ∼(∼a) = a</span><span class='tag'>المطلوب: قانون الالتفاف</span>"], ["txt", "مع المجموعات:  <span dir='ltr'>(A<sup>c</sup>)<sup>c</sup> = A</span>"]]},

{"title": "الفكرة", "clear": 1, "say": "ليكن a عنصرًا ما من B. بحسب تعريف المتمم، لدينا فرضيتان: a زائد متممه يساوي واحدًا، و a ضرب متممه يساوي صفرًا.", "L": [["txt", "ليكن <span dir='ltr'>a ∈ B</span>  (اختياري)"], ["hyp", "<span dir='ltr'>a ⊕ ∼a = 1</span><span class='tag'>فرضية: تعريف <span dir='ltr'>∼a</span></span>"], ["hyp", "<span dir='ltr'>a ⊙ ∼a = 0</span><span class='tag'>فرضية: تعريف <span dir='ltr'>∼a</span></span>"]]},

{"say": "الفكرة كالتالي. بحسب الوحدانية، لإثبات أن متمم متمم a هو a، يكفي التحقق من أن a يحقق شرطي المتمم بالنسبة إلى متمم a. أي نطبق الوحدانية مع x يساوي متمم a، و y يساوي a.", "L": [["sub", "<span dir='ltr'>x = ∼a,   y = a</span><span class='tag'>اختيار في الوحدانية</span>"], ["goal", "يكفي إثبات:  <span dir='ltr'>∼a ⊕ a = 1</span>   و   <span dir='ltr'>∼a ⊙ a = 0</span><span class='tag'>مطلوب جديد</span>"]]},

{"title": "الشرط الأول", "clear": 1, "say": "الشرط الأول. نريد إثبات أن متمم a، زائد a، يساوي واحدًا. ننطلق من الطرف الأيسر.", "L": [["goal", "نريد:  <span dir='ltr'>∼a ⊕ a = 1</span><span class='tag'>مطلوب هذا الجزء</span>"], ["txt", "<span dir='ltr'>∼a ⊕ a</span>"]]},

{"say": "الخطوة الأولى. نطبق إبدالية الجمع، مع x يساوي متمم a، و y يساوي a. ننتقل من متمم a زائد a، إلى a زائد متمم a.", "L": [["sub", "<span dir='ltr'>∼a ⊕ a  =  a ⊕ ∼a</span><span class='tag'>إبدالية الجمع</span>"]]},

{"say": "الخطوة الثانية. لدينا الآن الفرضية الأولى تمامًا: a زائد متممه يساوي واحدًا. نميّزها ونعوّض.", "L": [["sub", "<span dir='ltr'>∼a ⊕ a  =  <mark>a ⊕ ∼a</mark></span>"], ["txt", "فرضية:  <span dir='ltr'><mark>a ⊕ ∼a</mark> = 1</span>"], ["res", "<span dir='ltr'>∼a ⊕ a  =  1</span><span class='tag'>تعريف المتمم</span>"]]},

{"title": "الشرط الثاني", "clear": 1, "say": "الشرط الثاني. نريد إثبات أن متمم a، ضرب a، يساوي صفرًا. ننطلق من الطرف الأيسر.", "L": [["goal", "نريد:  <span dir='ltr'>∼a ⊙ a = 0</span><span class='tag'>مطلوب هذا الجزء</span>"], ["txt", "<span dir='ltr'>∼a ⊙ a</span>"]]},

{"say": "الخطوة الأولى. نطبق إبدالية الضرب. ننتقل من متمم a ضرب a، إلى a ضرب متمم a.", "L": [["sub", "<span dir='ltr'>∼a ⊙ a  =  a ⊙ ∼a</span><span class='tag'>إبدالية الضرب</span>"]]},

{"say": "الخطوة الثانية. لدينا الآن الفرضية الثانية تمامًا: a ضرب متممه يساوي صفرًا. نميّزها ونعوّض.", "L": [["sub", "<span dir='ltr'>∼a ⊙ a  =  <mark>a ⊙ ∼a</mark></span>"], ["txt", "فرضية:  <span dir='ltr'><mark>a ⊙ ∼a</mark> = 0</span>"], ["res", "<span dir='ltr'>∼a ⊙ a  =  0</span><span class='tag'>تعريف المتمم</span>"]]},

{"title": "الاستنتاج", "clear": 1, "say": "تحققنا من الشرطين. أي أن a يحقق أن متمم a، زائد a، يساوي واحدًا، وأن متمم a، ضرب a، يساوي صفرًا. إذن، a متمم لمتمم a.", "L": [["res", "<span dir='ltr'>∼a ⊕ a = 1</span>   و   <span dir='ltr'>∼a ⊙ a = 0</span><span class='tag'>الشرطان</span>"], ["txt", "<span dir='ltr'>a</span> متمم لـ <span dir='ltr'>∼a</span>"]]},

{"say": "الآن نطبق وحدانية المتمم، مع x يساوي متمم a، و y يساوي a. وبما أن a يحقق الشرطين، فإن a هو متمم متمم a. وفي المجموعات: متممة متممة A هي A. وبهذا يثبت قانون الالتفاف.", "L": [["sub", "(الوحدانية) مع <span dir='ltr'>x = ∼a, y = a</span>"], ["res", "<span dir='ltr'>a = ∼(∼a)   ∎</span><span class='tag'>قانون الالتفاف</span>"], ["txt", "مع المجموعات:  <span dir='ltr'>(A<sup>c</sup>)<sup>c</sup> = A</span>"]]},

{"title": "الخلاصة", "clear": 1, "say": "نلخص. لإثبات أن متمم متمم a هو a، لا حاجة إلى حسابه: يكفي أن نرى، باستخدام الإبدالية، أن a يحقق شرطي المتمم بالنسبة إلى متمم a، ثم نطبق الوحدانية. نستنتج أن عملية المتمم التفافية. وفي المجموعات: متممة متممة A هي A. شكرًا على المشاهدة.", "L": [["res", "<span dir='ltr'>a ⊕ ∼a = 1  ⟹  ∼a ⊕ a = 1</span>   (إبدال الجمع)"], ["res", "<span dir='ltr'>a ⊙ ∼a = 0  ⟹  ∼a ⊙ a = 0</span>   (إبدال الضرب)"], ["res", "الوحدانية  ⟹  <span dir='ltr'>∼(∼a) = a</span>"], ["txt", "مع المجموعات:  <span dir='ltr'>(A<sup>c</sup>)<sup>c</sup> = A</span>"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' زائد ').replace(/⊙/g,' ضرب ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ إعادة'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ متابعة'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ إيقاف مؤقت';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ إيقاف مؤقت';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ إيقاف مؤقت';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^ar/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/hamed|shakir|naayf|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="قانون الالتفاف";$('sub').textContent="تمرين · جبر بول";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
