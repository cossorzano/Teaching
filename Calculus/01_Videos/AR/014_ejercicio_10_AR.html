<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مبدأ الثنوية</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-inline-end:2px dashed #3d5a50;padding-inline-end:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-inline-start:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
span[dir='ltr']{white-space:nowrap}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>تذكّر</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ ابدأ</button><button id="next">▶|</button>
<select id="voice"></select>
<label>السرعة <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">وضع التسجيل (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"ar-SA",
"meta":{"nivel": 2, "titulo": "مبدأ الثنوية", "enunciado": "ليكن <span dir='ltr'>(B, ⊕, ⊙, ∼, 0, 1)</span> جبر بول.  باستخدام مبدأ الثنوية، اكتب المتطابقات الثنوية لما يلي وتحقق منها:", "tesis": "(a)  a ⊕ 1 = 1,   (b)  a ⊕ (a ⊙ b) = a", "datos": ["(الثنوية)  <span dir='ltr'>⊕ ↔ ⊙,   0 ↔ 1</span>", "(الهيمنة)  <span dir='ltr'>a ⊕ 1 = 1,   a ⊙ 0 = 0</span>", "(الامتصاص)  <span dir='ltr'>a ⊕ (a ⊙ b) = a,   a ⊙ (a ⊕ b) = a</span>"]},
"steps":[
{"title": "مبدأ الثنوية", "sub": "تمرين · جبر بول", "clear": 1, "say": "مرحبًا. في هذا الفيديو سنحل تمرينًا عن جبر بول. سنتقدم ببطء شديد، فنكتب كل معادلة ونبرر كل خطوة.", "L": [["txt", "استخدام مبدأ الثنوية للحصول على متطابقات جديدة"]]},

{"say": "أولًا، المعطيات. B مجموعة معرّف عليها عمليتان، الجمع والضرب، وعملية متمم، وعنصران مميزان هما الصفر والواحد. وهي جبر بول. والمثال النموذجي هو مجموعة أجزاء مجموعة U، مع الاتحاد والتقاطع والمتمم، حيث الصفر هو المجموعة الخالية والواحد هو U.", "L": [["hyp", "<span dir='ltr'>(B, ⊕, ⊙, ∼, 0, 1)</span> جبر بول<span class='tag'>فرضية</span>"], ["txt", "مع المجموعات:  <span dir='ltr'>𝒫(U)</span> مع الاتحاد والتقاطع والمتمم،  <span dir='ltr'>0 = ∅</span>،  <span dir='ltr'>1 = U</span>"]]},

{"say": "نتذكر مبدأ الثنوية. أي متطابقة صحيحة في جبر بول تبقى صحيحة عند تبديل الجمع بالضرب، والصفر بالواحد، في آن واحد. وفي المجموعات، يعني هذا تبديل الاتحاد بالتقاطع، والمجموعة الخالية بـ U.", "L": [["sub", "<span dir='ltr'>⊕ ↔ ⊙,      0 ↔ 1</span><span class='tag'>مبدأ الثنوية: التبديل في آن واحد</span>"], ["txt", "مع المجموعات:  <span dir='ltr'>∪ ↔ ∩,      ∅ ↔ U</span>"]]},

{"say": "نسجله على الجانب، لأنه ما سنستخدمه في التمرين كله.", "pin": ["(الثنوية) كل متطابقة صحيحة تبقى صحيحة عند تبديل <span dir='ltr'>⊕ ↔ ⊙</span> و <span dir='ltr'>0 ↔ 1</span>"]},

{"say": "المطلوب. الجزء أ: انطلاقًا من قانون الهيمنة، a زائد واحد يساوي واحدًا، نكتب المتطابقة الثنوية ونتحقق من أنها صحيحة أيضًا. الجزء ب: انطلاقًا من قانون الامتصاص، a زائد، a ضرب b، يساوي a، نكتب المتطابقة الثنوية ونتحقق من أنها صحيحة أيضًا.", "L": [["goal", "<span dir='ltr'>(a)</span>  ثنوية  <span dir='ltr'>a ⊕ 1 = 1</span>  والتحقق من صحتها"], ["goal", "<span dir='ltr'>(b)</span>  ثنوية  <span dir='ltr'>a ⊕ (a ⊙ b) = a</span>  والتحقق من صحتها<span class='tag'>المطلوب</span>"]]},

{"title": "(أ) ثنوية قانون الهيمنة", "clear": 1, "say": "الجزء أ. المتطابقة الأصلية هي قانون الهيمنة: a زائد واحد يساوي واحدًا. وفي المجموعات: A اتحاد U يساوي U. نسجلها على الجانب، لأنها متطابقة صحيحة ننطلق منها.", "L": [["sub", "<span dir='ltr'>a ⊕ 1 = 1</span><span class='tag'>المتطابقة الأصلية: قانون الهيمنة</span>"], ["txt", "مع المجموعات:  <span dir='ltr'>A ∪ U = U</span>"]], "pin": ["(الهيمنة) <span dir='ltr'>a ⊕ 1 = 1</span>"]},

{"say": "بتطبيق مبدأ الثنوية، نبدّل الجمع بالضرب، والواحد بالصفر. في المتطابقة عملية جمع واحدة وواحدان، لذلك نغيّر الجمع إلى ضرب، والواحدين إلى صفرين.", "L": [["sub", "<span dir='ltr'>⊕ → ⊙,      1 → 0</span><span class='tag'>التبديل الثنوي</span>"], ["txt", "<span dir='ltr'>a ⊕ 1 = 1</span>   تصبح   <span dir='ltr'>a ⊙ 0 = 0</span>"]]},

{"say": "نحصل على المتطابقة الثنوية: a ضرب صفر يساوي صفرًا. وفي المجموعات: A تقاطع المجموعة الخالية هو المجموعة الخالية.", "L": [["res", "<span dir='ltr'>a ⊙ 0 = 0</span><span class='tag'>المتطابقة الثنوية</span>"], ["txt", "مع المجموعات:  <span dir='ltr'>A ∩ ∅ = ∅</span>"]]},

{"say": "الآن نتحقق من صحتها. هذه المساواة هي بالضبط قانون الهيمنة الثاني، الذي سبق إثباته. نسجلها على الجانب. إذن المتطابقة الثنوية صحيحة أيضًا. وبهذا ينتهي الجزء أ.", "L": [["res", "<span dir='ltr'>a ⊙ 0 = 0</span>  هي قانون الهيمنة الثاني   <span dir='ltr'>∎</span><span class='tag'>المتطابقة الثنوية صحيحة أيضًا</span>"]], "pin": ["(الهيمنة) <span dir='ltr'>a ⊙ 0 = 0</span>"]},

{"title": "(ب) ثنوية قانون الامتصاص", "clear": 1, "say": "الجزء ب. المتطابقة الأصلية هي قانون الامتصاص: a زائد، a ضرب b، يساوي a. وفي المجموعات: A اتحاد، A تقاطع B، يساوي A. نسجلها على الجانب.", "L": [["sub", "<span dir='ltr'>a ⊕ (a ⊙ b) = a</span><span class='tag'>المتطابقة الأصلية: قانون الامتصاص</span>"], ["txt", "مع المجموعات:  <span dir='ltr'>A ∪ (A ∩ B) = A</span>"]], "pin": ["(الامتصاص) <span dir='ltr'>a ⊕ (a ⊙ b) = a</span>"]},

{"say": "بتطبيق مبدأ الثنوية، نبدّل الجمع بالضرب، والعكس. في هذه المتطابقة لا يظهر الصفر ولا الواحد، لذلك نغيّر الجمع إلى ضرب، والضرب إلى جمع فقط.", "L": [["sub", "<span dir='ltr'>⊕ ↔ ⊙</span><span class='tag'>التبديل الثنوي</span>"], ["txt", "<span dir='ltr'>a ⊕ (a ⊙ b) = a</span>   تصبح   <span dir='ltr'>a ⊙ (a ⊕ b) = a</span>"]]},

{"say": "نحصل على المتطابقة الثنوية: a ضرب، a زائد b، يساوي a. وفي المجموعات: A تقاطع، A اتحاد B، يساوي A.", "L": [["res", "<span dir='ltr'>a ⊙ (a ⊕ b) = a</span><span class='tag'>المتطابقة الثنوية</span>"], ["txt", "مع المجموعات:  <span dir='ltr'>A ∩ (A ∪ B) = A</span>"]]},

{"say": "الآن نتحقق من صحتها. هذه المساواة هي قانون الامتصاص الثاني، الصحيح في كل شبكة، وبالتالي في جبر بول أيضًا. نسجلها على الجانب. وبهذا ينتهي الجزء ب.", "L": [["res", "<span dir='ltr'>a ⊙ (a ⊕ b) = a</span>  هي قانون الامتصاص الثاني   <span dir='ltr'>∎</span><span class='tag'>صحيحة في كل شبكة، وبالتالي في جبر بول</span>"]], "pin": ["(الامتصاص) <span dir='ltr'>a ⊙ (a ⊕ b) = a</span>"]},

{"title": "الاستنتاج", "clear": 1, "say": "نستنتج أنه بمجرد إثبات متطابقة، تكون متطابقتها الثنوية صحيحة تلقائيًا، دون حاجة إلى برهان مستقل جديد. وفي المجموعات: إذا كانت مساواة بين مجموعات صحيحة، فإن المساواة الناتجة عن تبديل الاتحاد بالتقاطع، والمجموعة الخالية بـ U، صحيحة أيضًا. شكرًا على المشاهدة.", "L": [["res", "متطابقة صحيحة  ⟹  ثنويتها صحيحة أيضًا"], ["res", "<span dir='ltr'>(a)  a ⊕ 1 = 1   ⟹   a ⊙ 0 = 0</span>"], ["res", "<span dir='ltr'>(b)  a ⊕ (a ⊙ b) = a   ⟹   a ⊙ (a ⊕ b) = a</span>"], ["txt", "مع المجموعات:  <span dir='ltr'>∪ ↔ ∩,   ∅ ↔ U</span>"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' زائد ').replace(/⊙/g,' ضرب ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ إعادة'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ متابعة'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ إيقاف مؤقت';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ إيقاف مؤقت';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ إيقاف مؤقت';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^ar/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/hamed|shakir|naayf|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="مبدأ الثنوية";$('sub').textContent="تمرين · جبر بول";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
