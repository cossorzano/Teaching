<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تساوي القوى بالحد الأعلى الأصغر والحد الأدنى الأكبر</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-inline-end:2px dashed #3d5a50;padding-inline-end:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-inline-start:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(15px,1.9vw,24px)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
span[dir='ltr']{white-space:nowrap}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>تذكّر</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ ابدأ</button><button id="next">▶|</button>
<select id="voice"></select>
<label>السرعة <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">وضع التسجيل (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"ar-SA",
"meta":{"nivel": 2, "titulo": "تساوي القوى بالحد الأعلى الأصغر والحد الأدنى الأكبر", "enunciado": "لتكن <span dir='ltr'>(B, ≤)</span> مجموعة مرتبة وهي شبكة، حيث <span dir='ltr'>a ⊕ b = sup{a, b}</span> و <span dir='ltr'>a ⊙ b = inf{a, b}.</span>  أثبت أنه لكل <span dir='ltr'>a ∈ B</span>:", "tesis": "a ⊕ a = a,   a ⊙ a = a", "datos": ["(انعكاس)  <span dir='ltr'>a ≤ a</span>", "<span dir='ltr'>(Sup)  s = sup S</span>: حد أعلى، وهو الأصغر", "<span dir='ltr'>(Inf)  i = inf S</span>: حد أدنى، وهو الأكبر"]},
"steps":[
{"title": "تساوي القوى بالحد الأعلى الأصغر والحد الأدنى الأكبر", "sub": "تمرين · الشبكات الجبرية", "clear": 1, "say": "مرحبًا. في هذا الفيديو سنحل تمرينًا عن الشبكات الجبرية. سنتقدم ببطء شديد، فنكتب كل معادلة ونبرر كل خطوة.", "L": [["txt", "أثبت أن الجمع والضرب في الشبكة يحققان تساوي القوى"]]},

{"say": "أولًا، المعطيات. B مجموعة معرّف عليها ترتيب، أي علاقة أصغر من أو يساوي، وهي انعكاسية وتخالفية ومتعدية. وهي شبكة. بالتعريف، لكل a و b من B يوجد حدهما الأعلى الأصغر وحدهما الأدنى الأكبر. مجموع a و b هو الحد الأعلى الأصغر للمجموعة المكونة من a و b، وحاصل الضرب هو الحد الأدنى الأكبر. وفي المجموعات: بالنسبة إلى الاحتواء، الاتحاد هو الحد الأعلى الأصغر، والتقاطع هو الحد الأدنى الأكبر.", "L": [["hyp", "<span dir='ltr'>(B, ≤)</span> مرتبة،  <span dir='ltr'>(B, ⊕, ⊙)</span> شبكة<span class='tag'>فرضية</span>"], ["hyp", "<span dir='ltr'>a ⊕ b = sup{a, b}</span><span class='tag'>فرضية: الحد الأعلى الأصغر موجود</span>"], ["hyp", "<span dir='ltr'>a ⊙ b = inf{a, b}</span><span class='tag'>فرضية: الحد الأدنى الأكبر موجود</span>"], ["txt", "مع المجموعات:  <span dir='ltr'>A ∪ B = sup{A, B},   A ∩ B = inf{A, B}</span>"]]},

{"say": "خاصية الترتيب التي سنستخدمها، على الجانب. الانعكاسية: كل عنصر a أصغر من أو يساوي a. وتعريفا الحد الأعلى الأصغر والحد الأدنى الأكبر، اللذان نتذكرهما الآن.", "pin": ["(انعكاس) <span dir='ltr'>a ≤ a</span>"]},

{"say": "الحد الأعلى الأصغر لمجموعة S هو أصغر حدودها العليا. أي أن s هو الحد الأعلى الأصغر لـ S إذا حقق شرطين. الأول: s حد أعلى، أي أن كل عنصر x من S أصغر من أو يساوي s. الثاني: s هو الأصغر، أي إذا كان c حدًا أعلى آخر لـ S، فإن s أصغر من أو يساوي c.", "L": [["sub", "<span dir='ltr'>s = sup S  ⇔  (i) ∀ x ∈ S:  x ≤ s</span><span class='tag'>حد أعلى</span>"], ["sub", "<span dir='ltr'>(ii)</span>  إذا كان <span dir='ltr'>∀ x ∈ S: x ≤ c</span>,  فإن  <span dir='ltr'>s ≤ c</span><span class='tag'>هو الأصغر</span>"]]},

{"say": "والحد الأدنى الأكبر لـ S هو أكبر حدودها الدنيا. أي أن i هو الحد الأدنى الأكبر لـ S إذا حقق شرطين. الأول: i حد أدنى، أي أن i أصغر من أو يساوي كل عنصر x من S. الثاني: i هو الأكبر، أي إذا كان c حدًا أدنى آخر لـ S، فإن c أصغر من أو يساوي i.", "L": [["sub", "<span dir='ltr'>i = inf S  ⇔  (i) ∀ x ∈ S:  i ≤ x</span><span class='tag'>حد أدنى</span>"], ["sub", "<span dir='ltr'>(ii)</span>  إذا كان <span dir='ltr'>∀ x ∈ S: c ≤ x</span>,  فإن  <span dir='ltr'>c ≤ i</span><span class='tag'>هو الأكبر</span>"]]},

{"say": "نسجل التعريفين على الجانب، تحت الانعكاسية، لأنهما مفتاح التمرين.", "pin": ["<span dir='ltr'>(Sup) s = sup S</span>: حد أعلى، وهو الأصغر", "<span dir='ltr'>(Inf) i = inf S</span>: حد أدنى، وهو الأكبر"]},

{"say": "المطلوب إثباته. لكل عنصر a من B، a زائد a يساوي a، و a ضرب a يساوي a. وفي المجموعات: A اتحاد A يساوي A، و A تقاطع A يساوي A.", "L": [["goal", "<span dir='ltr'>∀ a ∈ B:   a ⊕ a = a</span>   و   <span dir='ltr'>a ⊙ a = a</span><span class='tag'>المطلوب</span>"], ["txt", "مع المجموعات:  <span dir='ltr'>A ∪ A = A,   A ∩ A = A</span>"]]},

{"title": "الجزء الأول: a ⊕ a = a", "clear": 1, "say": "نبدأ بالجمع. ليكن a عنصرًا ما من B. نريد إثبات أن a زائد a يساوي a.", "L": [["txt", "ليكن <span dir='ltr'>a ∈ B</span>  (اختياري)"], ["goal", "نريد:  <span dir='ltr'>a ⊕ a = a</span><span class='tag'>مطلوب هذا الجزء</span>"]]},

{"say": "الخطوة الأولى. نطبق الفرضية، التي تقول إن a زائد b هو الحد الأعلى الأصغر للمجموعة المكونة من a و b، مع b يساوي a. فنحصل على أن a زائد a هو الحد الأعلى الأصغر للمجموعة المكونة من a و a. وفي المجموعات: A اتحاد A هو الحد الأعلى الأصغر لـ A و A.", "L": [["sub", "<span dir='ltr'>a ⊕ a  =  sup{a, a}</span><span class='tag'>الفرضية مع <span dir='ltr'>b = a</span></span>"], ["txt", "مع المجموعات:  <span dir='ltr'>A ∪ A = sup{A, A}</span>"]]},

{"say": "الخطوة الثانية. المجموعة لا تكرر عناصرها، لذا فالمجموعة المكونة من a و a تساوي المجموعة المكونة من a وحده. إنها مجموعة ذات عنصر واحد.", "L": [["sub", "<span dir='ltr'>{a, a}  =  {a}</span><span class='tag'>المجموعة لا تكرر عناصرها</span>"], ["res", "<span dir='ltr'>a ⊕ a  =  sup{a}</span>"]]},

{"say": "يبقى أن نثبت أن الحد الأعلى الأصغر للمجموعة المكونة من a وحده هو a. نفعل ذلك بتعريف الحد الأعلى الأصغر، بالتحقق من الشرطين. أي نريد إثبات أن a هو الحد الأعلى الأصغر للمجموعة المكونة من a.", "L": [["goal", "نريد:  <span dir='ltr'>sup{a} = a</span><span class='tag'>مطلوب مساعد</span>"]]},

{"say": "الشرط الأول: a حد أعلى. كل عنصر x من المجموعة المكونة من a أصغر من أو يساوي a. لكن العنصر الوحيد هو a، و a أصغر من أو يساوي a بفضل الانعكاسية.", "L": [["sub", "<span dir='ltr'>(i)  x ∈ {a}  ⇒  x = a  ⇒  x ≤ a</span><span class='tag'>الانعكاسية: <span dir='ltr'>a ≤ a</span></span>"], ["res", "<span dir='ltr'>a</span> حد أعلى لـ <span dir='ltr'>{a}</span>"]]},

{"say": "الشرط الثاني: a هو أصغر الحدود العليا. ليكن c حدًا أعلى آخر للمجموعة المكونة من a. هذه فرضية: كل عنصر x من المجموعة أصغر من أو يساوي c.", "L": [["txt", "ليكن <span dir='ltr'>c ∈ B</span>"], ["hyp", "<span dir='ltr'>∀ x ∈ {a}:  x ≤ c</span><span class='tag'>فرضية: <span dir='ltr'>c</span> حد أعلى لـ <span dir='ltr'>{a}</span></span>"]]},

{"say": "بما أن a ينتمي إلى المجموعة المكونة من a، نطبق الفرضية مع x يساوي a. فنحصل على أن a أصغر من أو يساوي c. وهذا تمامًا ما أردنا إثباته.", "L": [["sub", "<span dir='ltr'>a ∈ {a}  ⇒  a ≤ c</span><span class='tag'>الفرضية مع <span dir='ltr'>x = a</span></span>"], ["res", "<span dir='ltr'>(ii)  c</span> حد أعلى لـ <span dir='ltr'>{a}  ⇒  a ≤ c</span>"]]},

{"say": "تحققنا من الشرطين. إذن، a هو الحد الأعلى الأصغر للمجموعة المكونة من a. وبما أن a زائد a هو ذلك الحد، نستنتج أن a زائد a يساوي a. وفي المجموعات: A اتحاد A يساوي A. وبهذا ينتهي الجزء الأول.", "L": [["res", "<span dir='ltr'>sup{a} = a   ⟹   a ⊕ a = a   ∎</span>"], ["txt", "مع المجموعات:  <span dir='ltr'>A ∪ A = A</span>"]]},

{"title": "الجزء الثاني: a ⊙ a = a", "clear": 1, "say": "ننتقل إلى الجزء الثاني، مع الضرب. وهو مماثل، باستبدال الحد الأعلى الأصغر بالحد الأدنى الأكبر، والحدود العليا بالحدود الدنيا. ليكن a عنصرًا ما من B. نريد إثبات أن a ضرب a يساوي a.", "L": [["txt", "ليكن <span dir='ltr'>a ∈ B</span>  (اختياري)"], ["goal", "نريد:  <span dir='ltr'>a ⊙ a = a</span><span class='tag'>مطلوب هذا الجزء</span>"]]},

{"say": "الخطوة الأولى. نطبق الفرضية، التي تقول إن a ضرب b هو الحد الأدنى الأكبر للمجموعة المكونة من a و b، مع b يساوي a. وبما أن المجموعة المكونة من a و a هي المجموعة المكونة من a وحده، نحصل على أن a ضرب a هو الحد الأدنى الأكبر للمجموعة المكونة من a. وفي المجموعات: A تقاطع A هو الحد الأدنى الأكبر لـ A و A.", "L": [["sub", "<span dir='ltr'>a ⊙ a  =  inf{a, a}</span><span class='tag'>الفرضية مع <span dir='ltr'>b = a</span></span>"], ["txt", "مع المجموعات:  <span dir='ltr'>A ∩ A = inf{A, A}</span>"], ["res", "<span dir='ltr'>a ⊙ a  =  inf{a}</span><span class='tag'><span dir='ltr'>{a, a} = {a}</span></span>"]]},

{"say": "يبقى أن نثبت أن الحد الأدنى الأكبر للمجموعة المكونة من a وحده هو a. نفعل ذلك بتعريف الحد الأدنى الأكبر، بالتحقق من الشرطين.", "L": [["goal", "نريد:  <span dir='ltr'>inf{a} = a</span><span class='tag'>مطلوب مساعد</span>"]]},

{"say": "الشرط الأول: a حد أدنى. كل عنصر x من المجموعة المكونة من a يحقق أن a أصغر من أو يساوي x. لكن العنصر الوحيد هو a، و a أصغر من أو يساوي a بفضل الانعكاسية.", "L": [["sub", "<span dir='ltr'>(i)  x ∈ {a}  ⇒  x = a  ⇒  a ≤ x</span><span class='tag'>الانعكاسية: <span dir='ltr'>a ≤ a</span></span>"], ["res", "<span dir='ltr'>a</span> حد أدنى لـ <span dir='ltr'>{a}</span>"]]},

{"say": "الشرط الثاني: a هو أكبر الحدود الدنيا. ليكن c حدًا أدنى آخر للمجموعة المكونة من a. هذه فرضية: c أصغر من أو يساوي كل عنصر x من المجموعة.", "L": [["txt", "ليكن <span dir='ltr'>c ∈ B</span>"], ["hyp", "<span dir='ltr'>∀ x ∈ {a}:  c ≤ x</span><span class='tag'>فرضية: <span dir='ltr'>c</span> حد أدنى لـ <span dir='ltr'>{a}</span></span>"]]},

{"say": "بما أن a ينتمي إلى المجموعة المكونة من a، نطبق الفرضية مع x يساوي a. فنحصل على أن c أصغر من أو يساوي a. وهذا تمامًا ما أردنا إثباته.", "L": [["sub", "<span dir='ltr'>a ∈ {a}  ⇒  c ≤ a</span><span class='tag'>الفرضية مع <span dir='ltr'>x = a</span></span>"], ["res", "<span dir='ltr'>(ii)  c</span> حد أدنى لـ <span dir='ltr'>{a}  ⇒  c ≤ a</span>"]]},

{"say": "تحققنا من الشرطين. إذن، a هو الحد الأدنى الأكبر للمجموعة المكونة من a. وبما أن a ضرب a هو ذلك الحد، نستنتج أن a ضرب a يساوي a. وفي المجموعات: A تقاطع A يساوي A. وبهذا ينتهي الجزء الثاني.", "L": [["res", "<span dir='ltr'>inf{a} = a   ⟹   a ⊙ a = a   ∎</span>"], ["txt", "مع المجموعات:  <span dir='ltr'>A ∩ A = A</span>"]]},

{"title": "الاستنتاج", "clear": 1, "say": "لقد أثبتنا المساواتين لعنصر a اختياري. إذن، في أي شبكة، يحقق الجمع والضرب تساوي القوى. وفي المجموعات: A اتحاد A يساوي A، و A تقاطع A يساوي A. شكرًا على المشاهدة.", "L": [["res", "<span dir='ltr'>∀ a ∈ B:   a ⊕ a = a</span>"], ["res", "<span dir='ltr'>∀ a ∈ B:   a ⊙ a = a</span>"], ["txt", "مع المجموعات:  <span dir='ltr'>A ∪ A = A,   A ∩ A = A</span>"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' زائد ').replace(/⊙/g,' ضرب ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ إعادة'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ متابعة'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ إيقاف مؤقت';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ إيقاف مؤقت';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ إيقاف مؤقت';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^ar/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/hamed|shakir|naayf|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="تساوي القوى بالحد الأعلى الأصغر والحد الأدنى الأكبر";$('sub').textContent="تمرين · الشبكات الجبرية";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
