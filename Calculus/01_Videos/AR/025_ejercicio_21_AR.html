<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الفرق والفرق التناظري</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-inline-end:2px dashed #3d5a50;padding-inline-end:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-inline-start:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
span[dir='ltr']{white-space:nowrap}
svg{direction:ltr}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>تذكّر</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ ابدأ</button><button id="next">▶|</button>
<select id="voice"></select>
<label>السرعة <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">وضع التسجيل (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"ar-SA",
"meta":{"nivel": 2, "titulo": "الفرق والفرق التناظري", "enunciado": "أثبت أنه لأي مجموعتين <span dir='ltr'>A</span> و <span dir='ltr'>B</span> يتحقق:", "tesis": "A ∖ B = A △ (A ∩ B)", "datos": ["تعريف الفرق التناظري:  <span dir='ltr'>X △ Y = (X ∖ Y) ∪ (Y ∖ X)</span>"]},
"steps":[
{"title": "الفرق والفرق التناظري", "sub": "تمرين · جبر المجموعات", "clear": 1, "say": "مرحبًا. في هذا الفيديو سنثبت أن A ناقص B يساوي الفرق التناظري لـ A مع تقاطع A و B. سنستدل عنصرًا عنصرًا، ببطء شديد، فنكتب كل معادلة ونبرر كل خطوة.", "L": [["txt", "إثبات أن  <span dir='ltr'>A ∖ B = A △ (A ∩ B)</span>"]]},

{"say": "ما نريد إثباته. لأي مجموعتين A و B، فإن A ناقص B يساوي الفرق التناظري لـ A مع تقاطع A و B. نتذكر على الجانب التعريفات التي سنستخدمها: الفرق التناظري والفرق والتقاطع والاتحاد بالعناصر؛ وأن المجموعة الخالية ليس فيها عناصر؛ وأن مجموعتين متساويتان عندما تكون كل منهما محتواة في الأخرى.", "L": [["goal", "<span dir='ltr'>A ∖ B = A △ (A ∩ B)</span><span class='tag'>أثبت، لأي <span dir='ltr'>A</span> و <span dir='ltr'>B</span></span>"]], "pin": ["تعريف الفرق التناظري: <span dir='ltr'>X △ Y = (X ∖ Y) ∪ (Y ∖ X)</span>", "تعريف الفرق: <span dir='ltr'>x ∈ X ∖ Y  ⟺  x ∈ X ∧ x ∉ Y</span>", "تعريف التقاطع: <span dir='ltr'>x ∈ X ∩ Y  ⟺  x ∈ X ∧ x ∈ Y</span>", "تعريف الاتحاد: <span dir='ltr'>x ∈ X ∪ Y  ⟺  x ∈ X ∨ x ∈ Y</span>", "تعريف المجموعة الخالية: لا يوجد <span dir='ltr'>x</span> يحقق  <span dir='ltr'>x ∈ ∅</span>", "تعريف التساوي: <span dir='ltr'>X = Y  ⟺  X ⊆ Y ∧ Y ⊆ X</span>"]},

{"title": "نقطة الانطلاق", "clear": 1, "say": "أولًا، نتذكر تعريف الفرق التناظري: الفرق التناظري لـ X و Y هو اتحاد X ناقص Y، مع Y ناقص X. والآن نطبقه على حالتنا، فنأخذ X مساويًا لـ A، و Y مساويًا لتقاطع A و B. نعوّض عن X بـ A، وعن Y بـ A تقاطع B.", "L": [["txt", "حسب تعريف الفرق التناظري:"], ["sub", "<span dir='ltr'>X △ Y = (X ∖ Y) ∪ (Y ∖ X)</span>"], ["txt", "نأخذ  <span dir='ltr'>X = A</span>  و  <span dir='ltr'>Y = A ∩ B</span>:"], ["sub", "<span dir='ltr'>A △ (A ∩ B) = ( A ∖ <mark>(A ∩ B)</mark> ) ∪ ( <mark>(A ∩ B)</mark> ∖ A )</span><span class='tag'><span dir='ltr'>(★)</span></span>"]]},

{"title": "الخطة", "clear": 1, "say": "الآن سنبسّط كلًّا من جزأي هذا الاتحاد. في الفقرة الأولى، سنرى أن تقاطع A و B ناقص A هو المجموعة الخالية. وفي الفقرة الثانية، سنرى أن A ناقص تقاطع A و B يساوي A ناقص B. وفي الفقرة الثالثة، نستنتج.", "L": [["goal", "<span dir='ltr'>(1)  (A ∩ B) ∖ A = ∅</span>"], ["goal", "<span dir='ltr'>(2)  A ∖ (A ∩ B) = A ∖ B</span>"], ["goal", "<span dir='ltr'>(3)</span>  نستنتج بالتعويض في <span dir='ltr'>(★)</span>"]]},

{"title": "(١) المجموعة الخالية", "clear": 1, "say": "الفقرة الأولى. نريد أن نرى أن تقاطع A و B ناقص A ليس فيه أي عنصر. نفترض أن x عنصر من هذه المجموعة، وسنصل إلى تناقض.", "L": [["hyp", "ليكن <span dir='ltr'>x ∈ (A ∩ B) ∖ A</span>"], ["goal", "نريد:  الوصول إلى تناقض"]]},

{"say": "بحسب تعريف الفرق، x ينتمي إلى تقاطع A و B، و x لا ينتمي إلى A.", "L": [["txt", "حسب تعريف الفرق:"], ["sub", "<span dir='ltr'>x ∈ A ∩ B   ∧   x ∉ A</span>"]]},

{"say": "بحسب تعريف التقاطع، انتماء x إلى تقاطع A و B يعني أن x ينتمي إلى A، و x ينتمي إلى B. وبالخصوص، x ينتمي إلى A.", "L": [["txt", "حسب تعريف التقاطع:  <span dir='ltr'>x ∈ A ∩ B</span>  يعني  <span dir='ltr'>x ∈ A  ∧  x ∈ B</span>؛  وبالخصوص:"], ["sub", "<span dir='ltr'>x ∈ A</span>"]]},

{"say": "لكننا حصلنا على أن x لا ينتمي إلى A. إذن x ينتمي إلى A ولا ينتمي إلى A في آن واحد. وهذا تناقض.", "L": [["warn", "<span dir='ltr'>x ∈ A   ∧   x ∉ A</span>      →   تناقض"]]},

{"say": "إذن لا يوجد أي عنصر x في تقاطع A و B ناقص A. والمجموعة التي ليس فيها عناصر هي المجموعة الخالية. إذن تقاطع A و B ناقص A هو المجموعة الخالية.", "L": [["txt", "لا يمكن لأي <span dir='ltr'>x</span> أن ينتمي إلى  <span dir='ltr'>(A ∩ B) ∖ A</span>،  ومنه:"], ["res", "<span dir='ltr'>(A ∩ B) ∖ A = ∅</span>"]]},

{"title": "(٢) تبسيط الفرق", "clear": 1, "say": "الفقرة الثانية. نريد أن نرى أن A ناقص تقاطع A و B يساوي A ناقص B. بحسب تعريف التساوي، نثبت احتواءين. أولًا، A ناقص تقاطع A و B محتوى في A ناقص B. ثانيًا، A ناقص B محتوى في A ناقص تقاطع A و B.", "L": [["goal", "<span dir='ltr'>(2a)  A ∖ (A ∩ B) ⊆ A ∖ B</span>"], ["goal", "<span dir='ltr'>(2b)  A ∖ B ⊆ A ∖ (A ∩ B)</span>"]]},

{"title": "(٢أ) الاحتواء الأول", "clear": 1, "say": "ليكن x عنصرًا كيفيًا من A ناقص تقاطع A و B. بحسب تعريف الفرق، x ينتمي إلى A، و x لا ينتمي إلى تقاطع A و B.", "L": [["hyp", "ليكن <span dir='ltr'>x ∈ A ∖ (A ∩ B)</span>"], ["goal", "نريد:  <span dir='ltr'>x ∈ A ∖ B</span>"], ["txt", "حسب تعريف الفرق:"], ["sub", "<span dir='ltr'>x ∈ A   ∧   x ∉ A ∩ B</span>"]]},

{"say": "بحسب تعريف التقاطع، عدم انتماء x إلى تقاطع A و B يعني أنه ليس صحيحًا أن x ينتمي إلى A وإلى B في آن واحد. وبما أننا نعلم أن x ينتمي إلى A، فالطريقة الوحيدة لكي لا يتحقق الأمران معًا هي ألا ينتمي x إلى B.", "L": [["txt", "حسب تعريف التقاطع:  <span dir='ltr'>x ∉ A ∩ B</span>  يعني"], ["sub", "ليس <span dir='ltr'>(x ∈ A  ∧  x ∈ B)</span>"], ["txt", "بما أن  <span dir='ltr'>x ∈ A</span>،  فلا بد أن:"], ["sub", "<span dir='ltr'>x ∉ B</span>"]]},

{"say": "إذن x ينتمي إلى A، و x لا ينتمي إلى B. بحسب تعريف الفرق، x ينتمي إلى A ناقص B. وهذا يثبت الاحتواء الأول.", "L": [["txt", "<span dir='ltr'>x ∈ A  ∧  x ∉ B</span>،  ومنه حسب تعريف الفرق:"], ["res", "<span dir='ltr'>x ∈ A ∖ B</span>"], ["res", "<span dir='ltr'>A ∖ (A ∩ B) ⊆ A ∖ B</span>"]]},

{"title": "(٢ب) الاحتواء الثاني", "clear": 1, "say": "الآن الاحتواء العكسي. ليكن x عنصرًا كيفيًا من A ناقص B. بحسب تعريف الفرق، x ينتمي إلى A، و x لا ينتمي إلى B.", "L": [["hyp", "ليكن <span dir='ltr'>x ∈ A ∖ B</span>"], ["goal", "نريد:  <span dir='ltr'>x ∈ A ∖ (A ∩ B)</span>"], ["txt", "حسب تعريف الفرق:"], ["sub", "<span dir='ltr'>x ∈ A   ∧   x ∉ B</span>"]]},

{"say": "بما أن x لا ينتمي إلى B، فلا يمكن أن ينتمي x إلى A وإلى B في آن واحد. وبحسب تعريف التقاطع، x لا ينتمي إلى تقاطع A و B.", "L": [["txt", "<span dir='ltr'>x ∉ B</span>  ⟹  ليس <span dir='ltr'>(x ∈ A  ∧  x ∈ B)</span>،  ومنه حسب تعريف التقاطع:"], ["sub", "<span dir='ltr'>x ∉ A ∩ B</span>"]]},

{"say": "إذن x ينتمي إلى A، و x لا ينتمي إلى تقاطع A و B. بحسب تعريف الفرق، x ينتمي إلى A ناقص تقاطع A و B. وهذا يثبت الاحتواء الثاني.", "L": [["txt", "<span dir='ltr'>x ∈ A  ∧  x ∉ A ∩ B</span>،  ومنه حسب تعريف الفرق:"], ["res", "<span dir='ltr'>x ∈ A ∖ (A ∩ B)</span>"], ["res", "<span dir='ltr'>A ∖ B ⊆ A ∖ (A ∩ B)</span>"]]},

{"title": "(٢) الخلاصة", "clear": 1, "say": "بما أن الاحتواءين متحققان، فبحسب تعريف التساوي، نستنتج أن A ناقص تقاطع A و B يساوي A ناقص B.", "L": [["txt", "<span dir='ltr'>(2a)  A ∖ (A ∩ B) ⊆ A ∖ B</span>"], ["txt", "<span dir='ltr'>(2b)  A ∖ B ⊆ A ∖ (A ∩ B)</span>"], ["res", "<span dir='ltr'>A ∖ (A ∩ B) = A ∖ B</span>"]]},

{"title": "(٣) الخلاصة", "clear": 1, "say": "الفقرة الثالثة. نعود إلى العبارة الأولى. الفرق التناظري لـ A مع تقاطع A و B هو اتحاد A ناقص التقاطع، مع التقاطع ناقص A.", "L": [["txt", "ننطلق من <span dir='ltr'>(★)</span>:"], ["sub", "<span dir='ltr'>A △ (A ∩ B) = ( A ∖ (A ∩ B) ) ∪ ( (A ∩ B) ∖ A )</span>"]]},

{"say": "نعوّض عن الجزء الثاني بالمجموعة الخالية، مستخدمين نتيجة الفقرة الأولى.", "L": [["txt", "حسب <span dir='ltr'>(1)</span>،  <span dir='ltr'>(A ∩ B) ∖ A = ∅</span> :"], ["sub", "<span dir='ltr'>A △ (A ∩ B) = ( A ∖ (A ∩ B) ) ∪ <mark>∅</mark></span>"]]},

{"say": "اتحاد مجموعة مع المجموعة الخالية لا يغيّر المجموعة. فعلًا، x ينتمي إلى اتحاد مجموعة X مع المجموعة الخالية، إذا وفقط إذا كان x ينتمي إلى X، أو x ينتمي إلى المجموعة الخالية. لكن لا يوجد عنصر ينتمي إلى المجموعة الخالية، فهذا يكافئ انتماء x إلى X. ونطبق ذلك مع X مساوية لـ A ناقص تقاطع A و B.", "L": [["txt", "حسب تعريف الاتحاد و تعريف المجموعة الخالية:  <span dir='ltr'>x ∈ X ∪ ∅  ⟺  x ∈ X  ∨  x ∈ ∅  ⟺  x ∈ X</span>"], ["txt", "مع  <span dir='ltr'>X = A ∖ (A ∩ B)</span>:"], ["sub", "<span dir='ltr'>A △ (A ∩ B) = A ∖ (A ∩ B)</span>"]]},

{"say": "أخيرًا، نعوّض عن A ناقص تقاطع A و B بـ A ناقص B، مستخدمين نتيجة الفقرة الثانية.", "L": [["txt", "حسب <span dir='ltr'>(2)</span>،  <span dir='ltr'>A ∖ (A ∩ B) = A ∖ B</span> :"], ["res", "<span dir='ltr'>A △ (A ∩ B) = A ∖ B</span>"]]},

{"title": "الخاتمة", "clear": 1, "say": "الخاتمة. لقد أثبتنا أنه لأي مجموعتين A و B، فإن A ناقص B يساوي الفرق التناظري لـ A مع تقاطع A و B. شكرًا على المشاهدة.", "L": [["txt", "<span dir='ltr'>A △ (A ∩ B) = ( A ∖ (A ∩ B) ) ∪ ∅ = A ∖ (A ∩ B) = A ∖ B</span>"], ["res", "<span dir='ltr'>A ∖ B = A △ (A ∩ B)</span>"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' زائد ').replace(/⊙/g,' ضرب ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ إعادة'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ متابعة'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ إيقاف مؤقت';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ إيقاف مؤقت';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ إيقاف مؤقت';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^ar/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/hamed|shakir|naayf|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="الفرق والفرق التناظري";$('sub').textContent="تمرين · جبر المجموعات";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
