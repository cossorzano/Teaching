<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الترتيب في شبكة</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-inline-end:2px dashed #3d5a50;padding-inline-end:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-inline-start:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(15px,1.9vw,24px)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>تذكّر</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ ابدأ</button><button id="next">▶|</button>
<select id="voice"></select>
<label>السرعة <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">وضع التسجيل (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"ar-SA",
"meta":{"nivel": 2, "titulo": "الترتيب في شبكة", "enunciado": "لتكن <span dir='ltr'>(B, ⊕, ⊙)</span> شبكة. نعرّف على <span dir='ltr'>B</span> العلاقة  <span dir='ltr'>x ≤ y ⇔ x ⊕ y = y.</span>  أثبت أنه لكل <span dir='ltr'>a, b ∈ B:</span>", "tesis": "a ≤ a ⊕ b,   b ≤ a ⊕ b", "datos": ["(إبدال)  <span dir='ltr'>x ⊕ y = y ⊕ x</span>", "(تجميع)  <span dir='ltr'>x ⊕ (y ⊕ z) = (x ⊕ y) ⊕ z</span>", "(قوى)  <span dir='ltr'>x ⊕ x = x</span>"]},
"steps":[
{"title": "الترتيب في شبكة", "sub": "تمرين · الشبكات الجبرية", "clear": 1, "say": "مرحبًا. في هذا الفيديو سنحل تمرينًا عن الشبكات الجبرية. سنتقدم ببطء شديد، فنكتب كل معادلة ونبرر كل خطوة.", "L": [["txt", "علاقة ترتيب معرّفة بواسطة جمع الشبكة"]]},

{"say": "أولًا، المعطيات. B مجموعة معرّف عليها عمليتان، جمع الشبكة وضرب الشبكة، وهي شبكة. أي أن العمليتين داخليتان، إبداليتان، تجميعيتان، وتحققان قانوني الامتصاص.", "L": [["hyp", "<span dir='ltr'>(B, ⊕, ⊙)</span> شبكة<span class='tag'>فرضية</span>"]]},

{"say": "في هذا التمرين سنستخدم ثلاث خواص فقط للجمع. الإبدال: a زائد b يساوي b زائد a. التجميع: a زائد، b زائد c، يساوي a زائد b، زائد c. وتساوي القوى، وهي مبرهنة في الشبكات: a زائد a يساوي a. نثبّتها على الجانب لأننا سنستخدمها.", "pin": ["(إبدال) <span dir='ltr'>x ⊕ y = y ⊕ x</span>", "(تجميع) <span dir='ltr'>x ⊕ (y ⊕ z) = (x ⊕ y) ⊕ z</span>", "(قوى) <span dir='ltr'>x ⊕ x = x</span>"]},

{"say": "والآن التعريف. نعرّف على B علاقة، أصغر من أو يساوي، على النحو التالي. x أصغر من أو يساوي y إذا وفقط إذا كان x زائد y يساوي y. إنه تعريف: علاقة أصغر من أو يساوي تعني، بالتعريف، أننا إذا جمعنا x مع y حصلنا على y. وفي المجموعات هي الخاصية المعروفة: A محتواة في B إذا وفقط إذا كان A اتحاد B يساوي B.", "L": [["sub", "<span dir='ltr'>x ≤ y  ⇔  x ⊕ y = y</span><span class='tag'>تعريف <span dir='ltr'>≤</span></span>"], ["txt", "مثال بالمجموعات:  <span dir='ltr'>A ⊆ B  ⇔  A ∪ B = B</span>"]]},

{"say": "نسجل التعريف أيضًا على الجانب، تحت الخواص السابقة، لأنه مفتاح التمرين. لاحظ أنه يظهر مميَّزًا في العمود الجانبي.", "pin": ["(تعريف) <span dir='ltr'>x ≤ y ⇔ x ⊕ y = y</span>"]},

{"say": "المطلوب إثباته. لكل a و b من B يتحقق أمران: a أصغر من أو يساوي a زائد b، و b أصغر من أو يساوي a زائد b.", "L": [["goal", "<span dir='ltr'>∀ a, b ∈ B:   a ≤ a ⊕ b</span>   و   <span dir='ltr'>b ≤ a ⊕ b</span><span class='tag'>المطلوب</span>"]]},

{"title": "الجزء الأول: a ≤ a ⊕ b", "clear": 1, "say": "نبدأ بالأول. ليكن a و b عنصرين ما من B. نريد إثبات أن a أصغر من أو يساوي a زائد b.", "L": [["txt", "ليكن <span dir='ltr'>a, b ∈ B</span>  (اختياريين)"], ["goal", "نريد:  <span dir='ltr'>a ≤ a ⊕ b</span><span class='tag'>مطلوب هذا الجزء</span>"]]},

{"say": "لنتذكر التعريف: x أصغر من أو يساوي y إذا وفقط إذا كان x زائد y يساوي y.", "L": [["hyp", "<span dir='ltr'>x ≤ y  ⇔  x ⊕ y = y</span><span class='tag'>تعريف</span>"]]},

{"say": "نطبق التعريف مع x يساوي a، و y يساوي a زائد b. وهذا مشروع، لأن الجمع عملية داخلية، وبالتالي a زائد b ينتمي إلى B.", "L": [["sub", "<span dir='ltr'>x = a,   y = a ⊕ b  ∈ B</span><span class='tag'>اختيار <span dir='ltr'>(⊕</span> داخلية)</span>"]]},

{"say": "بالتعويض، a أصغر من أو يساوي a زائد b، إذا وفقط إذا كان a زائد، a زائد b، يساوي a زائد b.", "L": [["sub", "<span dir='ltr'>a ≤ a ⊕ b  ⇔  a ⊕ (a ⊕ b) = a ⊕ b</span><span class='tag'>التعريف مع <span dir='ltr'>x=a, y=a⊕b</span></span>"]]},

{"say": "إذن يكفي إثبات المساواة على اليمين: a زائد، a زائد b، يساوي a زائد b. لم تعد هذه متباينة، بل مساواة يمكننا إثباتها بخواص الجمع.", "L": [["goal", "يكفي إثبات:  <span dir='ltr'>a ⊕ (a ⊕ b) = a ⊕ b</span><span class='tag'>مطلوب جديد</span>"]]},

{"say": "ننطلق من الطرف الأيسر، a زائد، a زائد b، ونحوّله خطوة خطوة حتى نصل إلى الطرف الأيمن.", "L": [["txt", "<span dir='ltr'>a ⊕ (a ⊕ b)</span>"]]},

{"say": "الخطوة الأولى. نطبق تجميعية الجمع، مع x يساوي a، و y يساوي a، و z يساوي b. ننقل الأقواس: a زائد، a زائد b، يصبح a زائد a، زائد b.", "L": [["sub", "<span dir='ltr'>a ⊕ (a ⊕ b)  =  (a ⊕ a) ⊕ b</span><span class='tag'>تجميعية <span dir='ltr'>⊕</span>، مع <span dir='ltr'>x=a, y=a, z=b</span></span>"]]},

{"say": "الخطوة الثانية. داخل القوس يظهر a زائد a. وبتساوي القوى، a زائد a يساوي a. نميّزه.", "L": [["sub", "<span dir='ltr'>a ⊕ (a ⊕ b)  =  (<mark>a ⊕ a</mark>) ⊕ b</span>"], ["txt", "بحسب (قوى):  <span dir='ltr'><mark>a ⊕ a</mark> = a</span>"]]},

{"say": "نستبدل هذه الكتلة بـ a. فيبقى a زائد b.", "L": [["sub", "<span dir='ltr'>(<mark>a</mark>) ⊕ b</span>"], ["res", "<span dir='ltr'>a ⊕ (a ⊕ b)  =  a ⊕ b</span><span class='tag'>تساوي القوى لـ <span dir='ltr'>⊕</span></span>"]]},

{"say": "لقد أثبتنا المساواة. وبحسب التكافؤ الذي رأيناه، فإن هذه المساواة تعني تمامًا أن a أصغر من أو يساوي a زائد b. وبهذا ينتهي الجزء الأول.", "L": [["res", "<span dir='ltr'>a ⊕ (a ⊕ b) = a ⊕ b   ⟹   a ≤ a ⊕ b   ∎</span>"]]},

{"title": "الجزء الثاني: b ≤ a ⊕ b", "clear": 1, "say": "ننتقل إلى الجزء الثاني. مع a و b الاختياريين أنفسهما، نريد إثبات أن b أصغر من أو يساوي a زائد b. نعمل بالطريقة نفسها، لكن ستظهر هنا خطوة إضافية، لأن b ليس في الموضع الأول.", "L": [["txt", "ليكن <span dir='ltr'>a, b ∈ B</span>  (اختياريين)"], ["goal", "نريد:  <span dir='ltr'>b ≤ a ⊕ b</span><span class='tag'>مطلوب هذا الجزء</span>"]]},

{"say": "نطبق التعريف مع x يساوي b، و y يساوي a زائد b، الذي ينتمي مجددًا إلى B لأن الجمع داخلي.", "L": [["sub", "<span dir='ltr'>x = b,   y = a ⊕ b  ∈ B</span><span class='tag'>اختيار <span dir='ltr'>(⊕</span> داخلية)</span>"], ["sub", "<span dir='ltr'>b ≤ a ⊕ b  ⇔  b ⊕ (a ⊕ b) = a ⊕ b</span><span class='tag'>التعريف مع <span dir='ltr'>x=b, y=a⊕b</span></span>"]]},

{"say": "إذن يكفي إثبات أن b زائد، a زائد b، يساوي a زائد b. ننطلق من الطرف الأيسر.", "L": [["goal", "يكفي إثبات:  <span dir='ltr'>b ⊕ (a ⊕ b) = a ⊕ b</span><span class='tag'>مطلوب جديد</span>"], ["txt", "<span dir='ltr'>b ⊕ (a ⊕ b)</span>"]]},

{"say": "الخطوة الأولى. تجميعية الجمع، مع x يساوي b، و y يساوي a، و z يساوي b. ننتقل من b زائد، a زائد b، إلى b زائد a، زائد b.", "L": [["sub", "<span dir='ltr'>b ⊕ (a ⊕ b)  =  (b ⊕ a) ⊕ b</span><span class='tag'>تجميعية <span dir='ltr'>⊕</span>، مع <span dir='ltr'>x=b, y=a, z=b</span></span>"]]},

{"say": "الخطوة الثانية. لدينا الآن b زائد a داخل القوس، ونريد a زائد b. نطبق الإبدال: b زائد a يساوي a زائد b.", "L": [["sub", "<span dir='ltr'>(<mark>b ⊕ a</mark>) ⊕ b</span>"], ["txt", "بحسب (إبدال):  <span dir='ltr'><mark>b ⊕ a</mark> = a ⊕ b</span>"], ["sub", "<span dir='ltr'>b ⊕ (a ⊕ b)  =  (a ⊕ b) ⊕ b</span><span class='tag'>إبدالية <span dir='ltr'>⊕</span></span>"]]},

{"say": "الخطوة الثالثة. نريد جمع الـ b معًا. نطبق التجميع مرة أخرى، هذه المرة مع x يساوي a، و y يساوي b، و z يساوي b. ننتقل من a زائد b، زائد b، إلى a زائد، b زائد b.", "L": [["sub", "<span dir='ltr'>b ⊕ (a ⊕ b)  =  a ⊕ (b ⊕ b)</span><span class='tag'>تجميعية <span dir='ltr'>⊕</span>، مع <span dir='ltr'>x=a, y=b, z=b</span></span>"]]},

{"say": "الخطوة الرابعة. داخل القوس يظهر b زائد b. وبتساوي القوى، b زائد b يساوي b. نميّزه ونستبدله.", "L": [["sub", "<span dir='ltr'>a ⊕ (<mark>b ⊕ b</mark>)</span>"], ["txt", "بحسب (قوى):  <span dir='ltr'><mark>b ⊕ b</mark> = b</span>"], ["res", "<span dir='ltr'>b ⊕ (a ⊕ b)  =  a ⊕ b</span><span class='tag'>تساوي القوى لـ <span dir='ltr'>⊕</span></span>"]]},

{"say": "لقد أثبتنا المساواة. وبحسب التعريف، فإن هذه المساواة تعني أن b أصغر من أو يساوي a زائد b. وبهذا ينتهي الجزء الثاني.", "L": [["res", "<span dir='ltr'>b ⊕ (a ⊕ b) = a ⊕ b   ⟹   b ≤ a ⊕ b   ∎</span>"]]},

{"title": "الخلاصة", "clear": 1, "say": "نلخص. بحسب تعريف أصغر من أو يساوي، فإن إثبات أن x أصغر من أو يساوي y يعني إثبات أن x زائد y يساوي y. ولإثبات أن a أصغر من أو يساوي a زائد b، كفى التجميع وتساوي القوى. ولإثبات أن b أصغر من أو يساوي a زائد b، احتجنا أيضًا إلى الإبدال. وهكذا فإن a زائد b أكبر من أو يساوي كلًا من a و b. شكرًا على المشاهدة.", "L": [["res", "<span dir='ltr'>a ≤ a ⊕ b</span>   (تجميع + تساوي القوى)"], ["res", "<span dir='ltr'>b ≤ a ⊕ b</span>   (تجميع + إبدال + تجميع + تساوي القوى)"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' زائد ').replace(/⊙/g,' ضرب ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ إعادة'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ متابعة'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ إيقاف مؤقت';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ إيقاف مؤقت';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ إيقاف مؤقت';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^ar/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/hamed|shakir|naayf|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="الترتيب في شبكة";$('sub').textContent="تمرين · الشبكات الجبرية";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
