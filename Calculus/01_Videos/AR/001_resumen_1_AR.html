<title>الشبكات والجبر البولياني</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}

#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}

.pin .l{font-size:clamp(15px,1.9vw,24px)}

.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>تذكّر</h2><div id="pins"></div></div><div id="board"></div></div>

"steps":[
{"title": "الشبكات والجبر البولياني", "sub": "نظرية · المجموعات والعمليات", "clear": 1, "say": "مرحبًا. في هذا الفيديو سنتعرف على النظرية التي سنستخدمها في الفصل كله: كيف نصوغ العمليات بين المجموعات صياغة رياضية دقيقة، وما البنية الجبرية التي تظهر عندما نجمع بينها. سنتقدم ببطء شديد، تعريفًا بعد تعريف، مع أمثلة في كل خطوة.", "L": [["txt", "العمليات على المجموعات ⟵ بنى جبرية"]]},

{"title": "1. الشبكات", "clear": 1, "say": "نبدأ بفكرة. اتحاد المجموعات وتقاطعها يحققان خواص كثيرة. وبدلًا من إثباتها واحدة تلو الأخرى، نحتفظ بالخواص الأساسية فقط ونطلق عليها اسمًا: هذه البنية المجردة تسمى شبكة.", "L": [["txt", "الاتحاد <span dir='ltr'>∪</span> والتقاطع <span dir='ltr'>∩</span> يشتركان في خواص"], ["goal", "التجريد: الشبكة"]]},

{"say": "لتكن B مجموعة ما، معرّفًا عليها عمليتان ثنائيتان داخليتان، نكتبهما برمزي الزائد داخل دائرة والنقطة داخل دائرة. ثنائية تعني أنها تعمل على عنصرين في كل مرة. وداخلية تعني أن الناتج يبقى في B. على سبيل المثال، يمكن أن تكون B مجموعة أجزاء مجموعة شاملة U، وسنراها لاحقًا، مع الاتحاد بدل الزائد داخل دائرة، والتقاطع بدل النقطة داخل دائرة.", "L": [["hyp", "<span dir='ltr'>B</span> مجموعة،  <span dir='ltr'>⊕, ⊙ : B × B ⟶ B</span><span class='tag'>المعطيات: عمليتان ثنائيتان داخليتان</span>"], ["txt", "مثال: <span dir='ltr'>B =</span> مجموعة أجزاء <span dir='ltr'>U</span>،  <span dir='ltr'>⊕ = ∪</span>،  <span dir='ltr'>⊙ = ∩</span>"]]},

{"say": "نقول إن B مع هاتين العمليتين شبكة إذا تحققت، لكل a و b و c من B، ثلاثة أنواع من الخواص. الأولى هي الإبدال: ترتيب العنصرين لا يهم. مع المجموعات: A اتحاد B يساوي B اتحاد A، و A تقاطع B يساوي B تقاطع A.", "L": [["hyp", "<span dir='ltr'>a ⊕ b = b ⊕ a,     a ⊙ b = b ⊙ a</span><span class='tag'>الإبدال</span>"], ["txt", "مع المجموعات:  <span dir='ltr'>A ∪ B = B ∪ A</span>،   <span dir='ltr'>A ∩ B = B ∩ A</span>"]]},

{"say": "الثانية هي التجميع: عند إجراء العملية على ثلاثة عناصر، لا يهم أي عنصرين نجمعهما أولًا. وبفضلها يمكننا أن نكتب a زائد b زائد c من دون أقواس، ومن دون أي لبس.", "L": [["hyp", "<span dir='ltr'>a ⊕ (b ⊕ c) = (a ⊕ b) ⊕ c</span><span class='tag'>تجميعية <span dir='ltr'>⊕</span></span>"], ["hyp", "<span dir='ltr'>a ⊙ (b ⊙ c) = (a ⊙ b) ⊙ c</span><span class='tag'>تجميعية <span dir='ltr'>⊙</span></span>"]]},

{"say": "الثالثة هي الامتصاص، وهي تربط العمليتين إحداهما بالأخرى. إذا أضفنا إلى عنصر a حاصل ضربه في أي عنصر آخر، نحصل على a من جديد. والأمر نفسه عند تبديل العمليتين.", "L": [["hyp", "<span dir='ltr'>a ⊕ (a ⊙ b) = a</span><span class='tag'>الامتصاص <span dir='ltr'>1</span></span>"], ["hyp", "<span dir='ltr'>a ⊙ (a ⊕ b) = a</span><span class='tag'>الامتصاص <span dir='ltr'>2</span></span>"]]},

{"say": "لنرَ لماذا يبدو هذا طبيعيًا مع المجموعات. A اتحاد، A تقاطع B، من المنطقي أن يساوي A: فالتقاطع محتوى في A، لذا فإن ضمه إلى A لا يضيف شيئًا جديدًا. ولهذا تمتص A التقاطع.", "L": [["txt", "<span dir='ltr'>A ∩ B ⊆ A   ⟹   A ∪ (A ∩ B) = A</span>"]]},

{"say": "نلخص. الشبكة مجموعة معرّف عليها عمليتان داخليتان، إبداليتان وتجميعيتان، وتحققان قانوني الامتصاص. نسجل ذلك على الجانب.", "pin": "الشبكة: <span dir='ltr'>⊕</span>، <span dir='ltr'>⊙</span> داخليتان، إبداليتان، تجميعيتان، مع الامتصاص"},

{"say": "انطلاقًا من هذه المسلمات نبرهن أن كلتا العمليتين متساوية القوى: إجراء العملية على عنصر مع نفسه لا يغير شيئًا. مع المجموعات: A اتحاد A يساوي A، و A تقاطع A يساوي A.", "L": [["res", "<span dir='ltr'>a ⊕ a = a,     a ⊙ a = a</span><span class='tag'>تساوي القوى (يُبرهن بالامتصاص)</span>"], ["txt", "مع المجموعات:  <span dir='ltr'>A ∪ A = A</span>،  <span dir='ltr'>A ∩ A = A</span>"]]},

{"title": "2. الشبكات التوزيعية", "clear": 1, "say": "ننتقل إلى خاصية إضافية مهمة جدًا: التوزيع. تكون الشبكة توزيعية إذا كانت كل عملية توزيعية على الأخرى.", "L": [["goal", "شبكة توزيعية"]]},

{"say": "نكتب القانونين. الأول يقول إن a زائد، b ضرب c، يساوي، a زائد b، والكل ضرب، a زائد c. والثاني هو نفسه مع تبديل الأدوار.", "L": [["hyp", "<span dir='ltr'>a ⊕ (b ⊙ c) = (a ⊕ b) ⊙ (a ⊕ c)</span>"], ["hyp", "<span dir='ltr'>a ⊙ (b ⊕ c) = (a ⊙ b) ⊕ (a ⊙ c)</span>"]]},

{"say": "انتبه إلى فرق مهم عن الجبر المعتاد. في الأعداد، الضرب توزيعي على الجمع، لكن الجمع ليس توزيعيًا على الضرب. أما هنا، فالقانونان صحيحان معًا.", "L": [["txt", "الأعداد:  <span dir='ltr'>a·(b + c) = a·b + a·c   ✔</span>"], ["warn", "الأعداد:  <span dir='ltr'>a + (b·c) = (a + b)·(a + c)   ✘</span><span class='tag'>خطأ في الأعداد</span>"], ["res", "في الشبكة التوزيعية يصح القانونان"]]},

{"say": "هذه الخاصية أساسية، لأنها تسمح بتحويل العبارات المعقدة إلى تركيبات أبسط. نسجلها.", "pin": "توزيعية: كل من <span dir='ltr'>⊕</span> و <span dir='ltr'>⊙</span> توزيعية على الأخرى"},

{"title": "3. الجبر البولياني", "clear": 1, "say": "نضيف الآن مزيدًا من البنية. تخيل شبكة توزيعية فيها عنصر أصغر نسميه صفرًا، وعنصر أكبر نسميه واحدًا. في المجموعات سيكونان المجموعة الخالية والمجموعة الشاملة.", "L": [["goal", "شبكة توزيعية + <span dir='ltr'>0 + 1</span> + متممات"]]},

{"say": "الصفر والواحد يتصرفان كعنصرين محايدين. إضافة الصفر إلى عنصر لا تغيره، وكذلك الضرب في الواحد. مع المجموعات: A اتحاد المجموعة الخالية هو A، و A تقاطع المجموعة الشاملة U هو A.", "L": [["hyp", "<span dir='ltr'>a ⊕ 0 = a,     a ⊙ 1 = a</span><span class='tag'>العناصر المحايدة</span>"], ["txt", "مع المجموعات:  <span dir='ltr'>A ∪ ∅ = A</span>،   <span dir='ltr'>A ∩ U = A</span>"]]},

{"say": "عندما تتحقق كل هذه الشروط، تسمى البنية جبرًا بوليانيًا. نسجله على الجانب، مع ما سبق.", "pin": "بولياني: توزيعية + <span dir='ltr'>0</span>، <span dir='ltr'>1</span> + متممات"},

{"say": "في الجبر البولياني، متمم كل عنصر وحيد. ويتحقق قانون الانعكاس: متمم متمم a هو a نفسه. في المجموعات، متممة متممة A هي A.", "L": [["res", "<span dir='ltr'>∼(∼a) = a</span><span class='tag'>الانعكاس</span>"], ["txt", "مع المجموعات:  <span dir='ltr'>(A<sup>c</sup>)<sup>c</sup> = A</span>"]]},

{"say": "وتتحقق أيضًا قوانين الهيمنة. إضافة الواحد إلى أي عنصر تعطي واحدًا. وضرب أي عنصر في الصفر يعطي صفرًا. لاحظ أن الواحد يهيمن على الجمع، والصفر يهيمن على الضرب. مع المجموعات: A اتحاد U هو U، و A تقاطع المجموعة الخالية هو المجموعة الخالية.", "L": [["res", "<span dir='ltr'>a ⊕ 1 = 1,     a ⊙ 0 = 0</span><span class='tag'>الهيمنة</span>"], ["txt", "مع المجموعات:  <span dir='ltr'>A ∪ U = U</span>،   <span dir='ltr'>A ∩ ∅ = ∅</span>"]]},

{"say": "وقانونا دي مورغان. مجموع a و b هو متمم حاصل ضرب المتممين. والقانون الآخر بتبديل العمليتين. وهما يسمحان بالانتقال من عملية إلى أخرى عبر المتمم. مع المجموعات: A اتحاد B هو متممة، متممة A تقاطع متممة B. و A تقاطع B هو متممة، متممة A اتحاد متممة B.", "L": [["res", "<span dir='ltr'>a ⊕ b = ∼(∼a ⊙ ∼b)</span>"], ["res", "<span dir='ltr'>a ⊙ b = ∼(∼a ⊕ ∼b)</span><span class='tag'>قانونا دي مورغان</span>"], ["txt", "مع المجموعات:  <span dir='ltr'>A ∪ B = (A<sup>c</sup> ∩ B<sup>c</sup>)<sup>c</sup></span>"], ["txt", "مع المجموعات:  <span dir='ltr'>A ∩ B = (A<sup>c</sup> ∪ B<sup>c</sup>)<sup>c</sup></span>"]]},

{"say": "ومن السمات الجوهرية مبدأ الثنائية. أي متطابقة صحيحة تبقى صحيحة إذا بدلنا العمليتين، وبدلنا في الوقت نفسه الصفر والواحد. لنرَ مثالًا: إذا كان a زائد صفر يساوي a، فإن a ضرب واحد يساوي a.", "L": [["sub", "<span dir='ltr'>a ⊕ 0 = a</span><span class='tag'>متطابقة صحيحة</span>"], ["sub", "<span dir='ltr'>⊕ ↔ ⊙</span>،   <span dir='ltr'>0 ↔ 1</span><span class='tag'>التبديل الثنائي</span>"], ["res", "<span dir='ltr'>a ⊙ 1 = a</span><span class='tag'>المتطابقة الثنائية، صحيحة أيضًا</span>"]]},

{"title": "4. الجبر البولياني للمجموعات", "clear": 1, "say": "نجسد الآن كل هذا بالمجموعات. إذا أعطينا مجموعة شاملة U، فإننا نسمي مجموعة أجزاء U المجموعة المكونة من جميع المجموعات الجزئية من U. وتكتب بحرف P كبير مزخرف. مثلًا، إذا كانت U هي المجموعة المكونة من واحد واثنين، فإن أجزاء U أربعة: المجموعة الخالية، والمجموعة واحد، والمجموعة اثنان، والمجموعة واحد، اثنان.", "L": [["txt", "<span dir='ltr'>P(U) = { A | A ⊆ U }</span>"], ["txt", "مثال: <span dir='ltr'>U = {1, 2}  ⟹  P(U) = { ∅, {1}, {2}, {1,2} }</span>"]]},

{"say": "مع الاتحاد والتقاطع عمليتين، تكون مجموعة أجزاء U جبرًا بوليانيًا. هذا الجدول هو القاموس بين اللغة المجردة ولغة المجموعات.", "L": [["hyp", "<span dir='ltr'>⊕  ⟷  ∪</span>   (الاتحاد)"], ["hyp", "<span dir='ltr'>⊙  ⟷  ∩</span>   (التقاطع)"], ["hyp", "<span dir='ltr'>0  ⟷  ∅</span>   (المجموعة الخالية)"], ["hyp", "<span dir='ltr'>1  ⟷  U</span>   (المجموعة الشاملة)"], ["hyp", "<span dir='ltr'>∼A  ⟷  A<sup>c</sup></span>   (المتممة)"]]},

{"say": "متممة A هي مجموعة عناصر U التي لا تنتمي إلى A. مثلًا، إذا كانت U هي واحد، اثنان، ثلاثة، و A هي المجموعة واحد، فإن متممة A هي اثنان، ثلاثة.", "L": [["sub", "<span dir='ltr'>A<sup>c</sup> = { x ∈ U | x ∉ A }</span><span class='tag'>تعريف</span>"], ["txt", "مثال: <span dir='ltr'>U = {1,2,3}</span>،  <span dir='ltr'>A = {1}  ⟹  A<sup>c</sup> = {2,3}</span>"]]},

{"say": "معلومة مفيدة أخرى. المجموعتان A و B متساويتان إذا وفقط إذا كانت كل منهما محتواة في الأخرى. وهذه هي الطريقة المعتادة لإثبات المساواة: إثبات الاحتواءين كلٍّ على حدة.", "L": [["sub", "<span dir='ltr'>A = B  ⟺  A ⊆ B</span>  و  <span dir='ltr'>B ⊆ A</span>"], ["txt", "لإثبات <span dir='ltr'>A ⊆ B:</span> نأخذ <span dir='ltr'>x ∈ A</span> ونستنتج <span dir='ltr'>x ∈ B</span>"]]},

{"title": "5. الفرق والفرق التناظري", "clear": 1, "say": "انطلاقًا من المتممة نعرّف عمليات أخرى. الفرق A ناقص B هو مجموعة العناصر التي في A وليست في B. مثلًا، المجموعة واحد، اثنان، ثلاثة ناقص المجموعة اثنان هي المجموعة واحد، ثلاثة.", "L": [["sub", "<span dir='ltr'>A ∖ B = { x ∈ A | x ∉ B } = A ∩ B<sup>c</sup></span><span class='tag'>الفرق</span>"], ["txt", "مثال: <span dir='ltr'>{1,2,3} ∖ {2} = {1,3}</span>"]]},

{"say": "المساواة مع A تقاطع متممة B مفيدة جدًا: فهي تسمح بتحويل الفرق إلى تقاطع واستخدام كل الخواص التي نعرفها. وانتبه إلى أن الفرق ليس إبداليًا.", "L": [["warn", "<span dir='ltr'>A ∖ B ≠ B ∖ A</span>  (بوجه عام)<span class='tag'>انتبه</span>"]]},

{"say": "الفرق التناظري يجمع العناصر التي تنتمي إلى إحدى المجموعتين فقط. ونحصل عليه باتحاد A ناقص B مع B ناقص A. مثلًا، لتكن A هي واحد، اثنان، و B هي اثنان، ثلاثة. A ناقص B هو واحد، و B ناقص A هو ثلاثة، والاتحاد هو واحد، ثلاثة.", "L": [["sub", "<span dir='ltr'>A △ B = (A ∖ B) ∪ (B ∖ A)</span><span class='tag'>الفرق التناظري</span>"], ["txt", "مثال: <span dir='ltr'>{1,2} △ {2,3} = {1} ∪ {3} = {1,3}</span>"]]},

{"say": "تحقق هذه العمليات متطابقات تسمح بإعادة كتابة العبارات. الفرق التناظري هو الاتحاد من دون التقاطع: ما ينتمي إلى إحداهما، مع حذف ما ينتمي إلى كلتيهما. والثانية تقول إن A ناقص B هو الفرق التناظري بين A و A تقاطع B. لنتحقق من الأولى بالمثال السابق: الاتحاد هو واحد، اثنان، ثلاثة؛ والتقاطع هو اثنان؛ وواحد، اثنان، ثلاثة ناقص اثنين هو واحد، ثلاثة، وهو ما يطابق النتيجة.", "L": [["res", "<span dir='ltr'>A △ B = (A ∪ B) ∖ (A ∩ B)</span>"], ["res", "<span dir='ltr'>A ∖ B = A △ (A ∩ B)</span>"], ["txt", "التحقق بالمثال السابق: <span dir='ltr'>(A ∪ B) ∖ (A ∩ B) = {1,2,3} ∖ {2} = {1,3} ✔</span>"]]},

{"title": "6. الضرب الديكارتي", "clear": 1, "say": "البناء الأخير: الضرب الديكارتي. إذا أعطينا المجموعات A واحد، و A اثنين، وصولًا إلى A n، فإن حاصل ضربها هو مجموعة الصفوف ذات n مركبة، التي تنتمي مركبتها ذات الترتيب i إلى A i.", "L": [["sub", "<span dir='ltr'>A₁ × A₂ × ⋯ × Aₙ = { (x₁, x₂, …, xₙ) | xᵢ ∈ Aᵢ }</span><span class='tag'>تعريف</span>"]]},

{"say": "لنرَ مثالًا بمجموعتين. A هي واحد، اثنان، و B هي a، b. حاصل ضربهما يضم كل الأزواج التي مركبتها الأولى من A والثانية من B. وهي أربعة أزواج. الترتيب مهم: حاصل الضرب B في A مختلف.", "L": [["txt", "<span dir='ltr'>A = {1,2}</span>،   <span dir='ltr'>B = {a,b}</span>"], ["res", "<span dir='ltr'>A × B = { (1,a), (1,b), (2,a), (2,b) }</span>"], ["warn", "<span dir='ltr'>A × B ≠ B × A</span>  (بوجه عام)"]]},

{"say": "هذه العملية أساسية للدوال في عدة متغيرات، وللتمثيلات البيانية، ولمناطق المستوى والفضاء. مثلًا، المستوى هو حاصل ضرب المستقيم الحقيقي في نفسه.", "L": [["txt", "<span dir='ltr'>ℝ × ℝ = ℝ²</span>  (المستوى)،    <span dir='ltr'>ℝ × ℝ × ℝ = ℝ³</span>  (الفضاء)"]]},

{"say": "الضرب الديكارتي يتوافق جيدًا مع الاتحاد. اتحاد A و B، ضرب C، يساوي اتحاد A ضرب C و B ضرب C. والسبب: الزوج x، y ينتمي إلى المجموعة الأولى إذا كان x في A أو في B، وكان y في C. وهذا يعادل القول إنه في A ضرب C، أو في B ضرب C.", "L": [["res", "<span dir='ltr'>(A ∪ B) × C = (A × C) ∪ (B × C)</span>"], ["txt", "<span dir='ltr'>(x,y) ∈ (A∪B)×C ⟺ (x ∈ A أو x ∈ B) و y ∈ C ⟺ (x,y) ∈ A×C أو (x,y) ∈ B×C</span>"]]},

{"say": "ومع التقاطع يحدث الشيء نفسه: الزوج ينتمي إلى المجموعة الأولى إذا كان x في A وفي B، وكان y في C، وهذا يعادل أن يكون في A ضرب C وفي B ضرب C في آن واحد. ومع الفرق كذلك.", "L": [["res", "<span dir='ltr'>(A ∩ B) × C = (A × C) ∩ (B × C)</span>"], ["res", "<span dir='ltr'>(A ∖ B) × C = (A × C) ∖ (B × C)</span>"]]},

{"say": "بتطبيق خاصية الاتحاد مرتين نحصل على صيغة النشر. اتحاد A و B، ضرب، اتحاد C و D، هو اتحاد أربعة حواصل ضرب: A ضرب C، و B ضرب C، و A ضرب D، و B ضرب D. فكّر في أربعة مستطيلات.", "L": [["res", "<span dir='ltr'>(A ∪ B) × (C ∪ D) = (A × C) ∪ (B × C) ∪ (A × D) ∪ (B × D)</span>"], ["warn", "<span dir='ltr'>≠ (A × C) ∪ (B × D)</span><span class='tag'>خطأ شائع: الحدود المتقاطعة ناقصة</span>"]]},

{"title": "الخلاصة", "clear": 1, "say": "في الختام: هذه المتطابقات كلها ليست قواعد منفصلة، بل نتائج للبنية الجبرية الكامنة وراءها. ومعرفتها تتيح التعامل مع المجموعات بثقة، وتقسيم المناطق المعقدة إلى أجزاء أبسط، والاستدلال بدقة على المجالات والمديات. وفي التمارين سنستخدمها عمليًا ونظريًا. شكرًا على المشاهدة.", "L": [["res", "شبكة ⟵ توزيعية ⟵ جبر بولياني"], ["res", "<span dir='ltr'>P(U)</span> مع <span dir='ltr'>∪</span> و <span dir='ltr'>∩</span> و <span dir='ltr'>∅</span> و <span dir='ltr'>U</span> والمتممة"], ["res", "الفرق والفرق التناظري والضرب الديكارتي"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){const d=document.createElement('div');d.className='l hyp';d.innerHTML=s.pin;if(k<n)d.style.animation='none';pins.appendChild(d)}}
 board.scrollTop=board.scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' زائد ').replace(/⊙/g,' ضرب ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ إعادة'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ متابعة'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ إيقاف مؤقت';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ إيقاف مؤقت';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ إيقاف مؤقت';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^ar/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/hamed|shakir|naayf|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="الشبكات والجبر البولياني";$('sub').textContent="نظرية · المجموعات والعمليات";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
