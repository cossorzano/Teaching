<title>সেট ও অসমতা</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}

.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>

{"say": "B এক পর্যন্ত সবকিছু ঢেকে রাখে, এক সহ, আর দুই থেকে পরের সবকিছু, দুই সহ। যা বাকি থাকে তা হলো এক থেকে দুই পর্যন্ত খোলা ব্যবধি, আর সেই ব্যবধিটি A তে অন্তর্ভুক্ত, কারণ A হলো শূন্য থেকে দুই পর্যন্ত ব্যবধি। সুতরাং, প্রতিটি বাস্তব সংখ্যা A তে অথবা B তে আছে, আর সংযোগ হলো পুরো বাস্তব রেখা।", "L": [["txt", "B তে  (1, 2)  নেই, আর  (1, 2) ⊆ (0, 2) = A"], ["res", "A ∪ B = ℝ"], ["txt", "<svg viewBox='0 0 470 150' width='100%' style='max-width:520px;display:block' xmlns='http://www.w3.org/2000/svg'><text x='0' y='15' fill='#7cc4ff' font-size='15' font-family='Georgia,serif'>A = (0, 2)</text><line x1='30' y1='24' x2='450' y2='24' stroke='#3d5a50' stroke-width='2'/><line x1='170' y1='24' x2='310' y2='24' stroke='#7cc4ff' stroke-width='6'/><circle cx='170' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><circle cx='310' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><text x='0' y='49' fill='#ffd166' font-size='15' font-family='Georgia,serif'>B = (−∞, 1] ∪ [2, ∞)</text><line x1='30' y1='58' x2='450' y2='58' stroke='#3d5a50' stroke-width='2'/><line x1='30' y1='58' x2='240' y2='58' stroke='#ffd166' stroke-width='6'/><polygon points='22,58 32,51 32,65' fill='#ffd166'/><circle cx='240' cy='58' r='7' fill='#ffd166' stroke='#ffd166' stroke-width='3'/><line x1='310' y1='58' x2='450' y2='58' stroke='#ffd166' stroke-width='6'/><polygon points='458,58 448,51 448,65' fill='#ffd166'/><circle cx='310' cy='58' r='7' fill='#ffd166' stroke='#ffd166' stroke-width='3'/><text x='0' y='83' fill='#7be0a0' font-size='15' font-family='Georgia,serif'>A ∪ B = ℝ</text><line x1='30' y1='92' x2='450' y2='92' stroke='#3d5a50' stroke-width='2'/><line x1='30' y1='92' x2='450' y2='92' stroke='#7be0a0' stroke-width='6'/><polygon points='22,92 32,85 32,99' fill='#7be0a0'/><polygon points='458,92 448,85 448,99' fill='#7be0a0'/><line x1='170' y1='116' x2='170' y2='124' stroke='#9fb3aa'/><text x='170' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>0</text><line x1='240' y1='116' x2='240' y2='124' stroke='#9fb3aa'/><text x='240' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>1</text><line x1='310' y1='116' x2='310' y2='124' stroke='#9fb3aa'/><text x='310' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>2</text></svg>"]]},

{"title": "4) ছেদ A ∩ B", "clear": 1, "say": "ধাপ চার। ছেদ। সংজ্ঞা অনুযায়ী, A ছেদ B হলো সেই সব বাস্তব সংখ্যা x এর সেট, যাদের জন্য x, A তে আছে, এবং x, B তে আছে।", "L": [["sub", "A ∩ B = { x ∈ ℝ | x ∈ A  এবং  x ∈ B }<span class='tag'>ছেদের সংজ্ঞা</span>"]]},

{"say": "আমরা বসাই। সাধারণ মান হলো A এর সেই মানগুলো, শূন্য ও দুই এর মধ্যে, যেগুলো B তেও আছে। A এর ভেতরে, B এর বিন্দুগুলো হলো এক থেকে ছোট বা সমানগুলো; দুই থেকে পরের ব্যবধি কিছু যোগ করে না, কারণ দুই A তে নেই। অতএব ছেদ হলো শূন্য, খোলা, থেকে এক, বদ্ধ, পর্যন্ত ব্যবধি।", "L": [["txt", "A ও B বসিয়ে:"], ["sub", "A ∩ B = (0, 2) ∩ ( (−∞, 1] ∪ [2, ∞) )"], ["sub", "সাধারণ মান:   0 &lt; x ≤ 1"], ["res", "A ∩ B = (0, 1]"], ["txt", "<svg viewBox='0 0 470 150' width='100%' style='max-width:520px;display:block' xmlns='http://www.w3.org/2000/svg'><text x='0' y='15' fill='#7cc4ff' font-size='15' font-family='Georgia,serif'>A = (0, 2)</text><line x1='30' y1='24' x2='450' y2='24' stroke='#3d5a50' stroke-width='2'/><line x1='170' y1='24' x2='310' y2='24' stroke='#7cc4ff' stroke-width='6'/><circle cx='170' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><circle cx='310' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><text x='0' y='49' fill='#ffd166' font-size='15' font-family='Georgia,serif'>B = (−∞, 1] ∪ [2, ∞)</text><line x1='30' y1='58' x2='450' y2='58' stroke='#3d5a50' stroke-width='2'/><line x1='30' y1='58' x2='240' y2='58' stroke='#ffd166' stroke-width='6'/><polygon points='22,58 32,51 32,65' fill='#ffd166'/><circle cx='240' cy='58' r='7' fill='#ffd166' stroke='#ffd166' stroke-width='3'/><line x1='310' y1='58' x2='450' y2='58' stroke='#ffd166' stroke-width='6'/><polygon points='458,58 448,51 448,65' fill='#ffd166'/><circle cx='310' cy='58' r='7' fill='#ffd166' stroke='#ffd166' stroke-width='3'/><text x='0' y='83' fill='#7be0a0' font-size='15' font-family='Georgia,serif'>A ∩ B</text><line x1='30' y1='92' x2='450' y2='92' stroke='#3d5a50' stroke-width='2'/><line x1='170' y1='92' x2='240' y2='92' stroke='#7be0a0' stroke-width='6'/><circle cx='170' cy='92' r='7' fill='#16231f' stroke='#7be0a0' stroke-width='3'/><circle cx='240' cy='92' r='7' fill='#7be0a0' stroke='#7be0a0' stroke-width='3'/><line x1='170' y1='116' x2='170' y2='124' stroke='#9fb3aa'/><text x='170' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>0</text><line x1='240' y1='116' x2='240' y2='124' stroke='#9fb3aa'/><text x='240' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>1</text><line x1='310' y1='116' x2='310' y2='124' stroke='#9fb3aa'/><text x='310' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>2</text></svg>"]]},

{"title": "5) অন্তর A ∖ B", "clear": 1, "say": "ধাপ পাঁচ। অন্তর A বাদ B। সংজ্ঞা অনুযায়ী, এটি সেই সব বাস্তব সংখ্যা x এর সেট, যাদের জন্য x, A তে আছে, এবং x, B তে নেই।", "L": [["sub", "A ∖ B = { x ∈ ℝ | x ∈ A  এবং  x ∉ B }<span class='tag'>অন্তরের সংজ্ঞা</span>"]]},

{"say": "আমরা বসাই। A এর যে উপাদানগুলো B তে আছে, সেগুলো শূন্য থেকে এক পর্যন্ত, এক সহ, আর সেগুলো বাদ দেওয়া হয়। থাকে A এর সেই উপাদানগুলো, যেগুলো এক থেকে বড়। যেহেতু A দুই পর্যন্ত যায়, দুই বাদে, A বাদ B হলো এক থেকে দুই পর্যন্ত খোলা ব্যবধি।", "L": [["txt", "A ও B বসিয়ে:"], ["sub", "A ∖ B = (0, 2) ∖ ( (−∞, 1] ∪ [2, ∞) )"], ["sub", "(0, 1] বাদ দিয়ে:   1 &lt; x &lt; 2"], ["res", "A ∖ B = (1, 2)"], ["txt", "<svg viewBox='0 0 470 150' width='100%' style='max-width:520px;display:block' xmlns='http://www.w3.org/2000/svg'><text x='0' y='15' fill='#7cc4ff' font-size='15' font-family='Georgia,serif'>A = (0, 2)</text><line x1='30' y1='24' x2='450' y2='24' stroke='#3d5a50' stroke-width='2'/><line x1='170' y1='24' x2='310' y2='24' stroke='#7cc4ff' stroke-width='6'/><circle cx='170' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><circle cx='310' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><text x='0' y='49' fill='#ffd166' font-size='15' font-family='Georgia,serif'>B = (−∞, 1] ∪ [2, ∞)</text><line x1='30' y1='58' x2='450' y2='58' stroke='#3d5a50' stroke-width='2'/><line x1='30' y1='58' x2='240' y2='58' stroke='#ffd166' stroke-width='6'/><polygon points='22,58 32,51 32,65' fill='#ffd166'/><circle cx='240' cy='58' r='7' fill='#ffd166' stroke='#ffd166' stroke-width='3'/><line x1='310' y1='58' x2='450' y2='58' stroke='#ffd166' stroke-width='6'/><polygon points='458,58 448,51 448,65' fill='#ffd166'/><circle cx='310' cy='58' r='7' fill='#ffd166' stroke='#ffd166' stroke-width='3'/><text x='0' y='83' fill='#7be0a0' font-size='15' font-family='Georgia,serif'>A ∖ B</text><line x1='30' y1='92' x2='450' y2='92' stroke='#3d5a50' stroke-width='2'/><line x1='240' y1='92' x2='310' y2='92' stroke='#7be0a0' stroke-width='6'/><circle cx='240' cy='92' r='7' fill='#16231f' stroke='#7be0a0' stroke-width='3'/><circle cx='310' cy='92' r='7' fill='#16231f' stroke='#7be0a0' stroke-width='3'/><line x1='170' y1='116' x2='170' y2='124' stroke='#9fb3aa'/><text x='170' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>0</text><line x1='240' y1='116' x2='240' y2='124' stroke='#9fb3aa'/><text x='240' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>1</text><line x1='310' y1='116' x2='310' y2='124' stroke='#9fb3aa'/><text x='310' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>2</text></svg>"]]},

{"title": "6) অন্তর B ∖ A", "clear": 1, "say": "ধাপ ছয়। অন্তর B বাদ A। সংজ্ঞা অনুযায়ী, এটি সেই সব বাস্তব সংখ্যা x এর সেট, যাদের জন্য x, B তে আছে, এবং x, A তে নেই।", "L": [["sub", "B ∖ A = { x ∈ ℝ | x ∈ B  এবং  x ∉ A }<span class='tag'>অন্তরের সংজ্ঞা</span>"]]},

{"say": "আমরা বসাই। B থেকে বাদ দিতে হবে যা A তে আছে, অর্থাৎ শূন্য থেকে দুই পর্যন্ত খোলা ব্যবধি। প্রথম অংশ, ঋণাত্মক অসীম থেকে এক পর্যন্ত, থেকে শূন্য থেকে এক পর্যন্ত অংশটি চলে যায়, আর থাকে ঋণাত্মক অসীম থেকে শূন্য পর্যন্ত, শূন্য সহ, কারণ শূন্য A তে নেই। দ্বিতীয় অংশ, দুই থেকে পরের সবকিছু, অপরিবর্তিত থাকে, কারণ A তে দুই নেই। সুতরাং, B বাদ A হলো ঋণাত্মক অসীম থেকে শূন্য পর্যন্ত বদ্ধ ব্যবধি, আর দুই থেকে অসীম পর্যন্ত বদ্ধ ব্যবধির সংযোগ।", "L": [["txt", "A ও B বসিয়ে:"], ["sub", "B ∖ A = ( (−∞, 1] ∪ [2, ∞) ) ∖ (0, 2)"], ["sub", "(−∞, 1] ∖ (0, 2) = (−∞, 0]        [2, ∞) ∖ (0, 2) = [2, ∞)"], ["res", "B ∖ A = (−∞, 0] ∪ [2, ∞)"], ["txt", "<svg viewBox='0 0 470 150' width='100%' style='max-width:520px;display:block' xmlns='http://www.w3.org/2000/svg'><text x='0' y='15' fill='#7cc4ff' font-size='15' font-family='Georgia,serif'>A = (0, 2)</text><line x1='30' y1='24' x2='450' y2='24' stroke='#3d5a50' stroke-width='2'/><line x1='170' y1='24' x2='310' y2='24' stroke='#7cc4ff' stroke-width='6'/><circle cx='170' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><circle cx='310' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><text x='0' y='49' fill='#ffd166' font-size='15' font-family='Georgia,serif'>B = (−∞, 1] ∪ [2, ∞)</text><line x1='30' y1='58' x2='450' y2='58' stroke='#3d5a50' stroke-width='2'/><line x1='30' y1='58' x2='240' y2='58' stroke='#ffd166' stroke-width='6'/><polygon points='22,58 32,51 32,65' fill='#ffd166'/><circle cx='240' cy='58' r='7' fill='#ffd166' stroke='#ffd166' stroke-width='3'/><line x1='310' y1='58' x2='450' y2='58' stroke='#ffd166' stroke-width='6'/><polygon points='458,58 448,51 448,65' fill='#ffd166'/><circle cx='310' cy='58' r='7' fill='#ffd166' stroke='#ffd166' stroke-width='3'/><text x='0' y='83' fill='#7be0a0' font-size='15' font-family='Georgia,serif'>B ∖ A</text><line x1='30' y1='92' x2='450' y2='92' stroke='#3d5a50' stroke-width='2'/><line x1='30' y1='92' x2='170' y2='92' stroke='#7be0a0' stroke-width='6'/><polygon points='22,92 32,85 32,99' fill='#7be0a0'/><circle cx='170' cy='92' r='7' fill='#7be0a0' stroke='#7be0a0' stroke-width='3'/><line x1='310' y1='92' x2='450' y2='92' stroke='#7be0a0' stroke-width='6'/><polygon points='458,92 448,85 448,99' fill='#7be0a0'/><circle cx='310' cy='92' r='7' fill='#7be0a0' stroke='#7be0a0' stroke-width='3'/><line x1='170' y1='116' x2='170' y2='124' stroke='#9fb3aa'/><text x='170' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>0</text><line x1='240' y1='116' x2='240' y2='124' stroke='#9fb3aa'/><text x='240' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>1</text><line x1='310' y1='116' x2='310' y2='124' stroke='#9fb3aa'/><text x='310' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>2</text></svg>"]]},

{"title": "7) প্রতিসম অন্তর A △ B", "clear": 1, "say": "ধাপ সাত। প্রতিসম অন্তর। সংজ্ঞা অনুযায়ী, A ও B এর প্রতিসম অন্তর হলো A বাদ B, আর B বাদ A এর সংযোগ।", "L": [["sub", "A △ B = (A ∖ B) ∪ (B ∖ A)<span class='tag'>প্রতিসম অন্তরের সংজ্ঞা</span>"]]},

</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' প্লাস ').replace(/⊙/g,' গুণ ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ আবার চালান'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ চালিয়ে যান'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ বিরতি';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ বিরতি';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ বিরতি';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^bn/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/pradeep|bashkar|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="সেট ও অসমতা";$('sub').textContent="অনুশীলনী · সেটের বীজগণিত";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
