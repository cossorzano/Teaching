<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>দ্বৈততা নীতি</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>মনে রাখুন</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ শুরু</button><button id="next">▶|</button>
<select id="voice"></select>
<label>গতি <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">রেকর্ডিং মোড (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"bn-BD",
"meta":{"nivel": 2, "titulo": "দ্বৈততা নীতি", "enunciado": "ধরা যাক (B, ⊕, ⊙, ∼, 0, 1) একটি বুলীয় বীজগণিত।  দ্বৈততা নীতি ব্যবহার করে, নিচের অভেদগুলোর দ্বৈত অভেদ লিখুন ও যাচাই করুন:", "tesis": "(a)  a ⊕ 1 = 1,   (b)  a ⊕ (a ⊙ b) = a", "datos": ["(দ্বৈততা)  ⊕ ↔ ⊙,   0 ↔ 1", "(আধিপত্য)  a ⊕ 1 = 1,   a ⊙ 0 = 0", "(শোষণ)  a ⊕ (a ⊙ b) = a,   a ⊙ (a ⊕ b) = a"]},
"steps":[
{"title": "দ্বৈততা নীতি", "sub": "অনুশীলনী · বুলীয় বীজগণিত", "clear": 1, "say": "নমস্কার। এই ভিডিওতে আমরা বুলীয় বীজগণিত নিয়ে একটি অনুশীলনী সমাধান করব। আমরা খুব ধীরে এগোব, প্রতিটি সমীকরণ লিখব এবং প্রতিটি ধাপের যুক্তি দেব।", "L": [["txt", "নতুন অভেদ পেতে দ্বৈততা নীতির ব্যবহার"]]},

{"say": "প্রথমে, প্রদত্ত তথ্য। B একটি সেট, যার উপর দুটি প্রক্রিয়া আছে, যোগ ও গুণ, একটি পূরক প্রক্রিয়া, আর দুটি বিশেষ উপাদান, শূন্য ও এক। এটি একটি বুলীয় বীজগণিত। সাধারণ উদাহরণ হলো একটি সেট U এর ঘাত সেট, সংযোগ, ছেদ ও পূরক নিয়ে, যেখানে শূন্য হলো ফাঁকা সেট আর এক হলো U।", "L": [["hyp", "(B, ⊕, ⊙, ∼, 0, 1) বুলীয় বীজগণিত<span class='tag'>অনুমান</span>"], ["txt", "সেটের ক্ষেত্রে:  (𝒫(U), ∪, ∩, পূরক),   0 = ∅,   1 = U"]]},

{"say": "দ্বৈততা নীতি মনে করি। বুলীয় বীজগণিতে সঠিক যেকোনো অভেদ, যোগ ও গুণকে, এবং শূন্য ও একক একসাথে অদলবদল করলেও সঠিক থাকে। সেটের ক্ষেত্রে এর অর্থ সংযোগ ও ছেদকে, এবং ফাঁকা সেট ও U কে অদলবদল করা।", "L": [["sub", "⊕ ↔ ⊙,      0 ↔ 1<span class='tag'>দ্বৈততা নীতি: একসাথে অদলবদল</span>"], ["txt", "সেটের ক্ষেত্রে:  ∪ ↔ ∩,      ∅ ↔ U"]]},

{"say": "এটি আমরা বাঁ দিকে লিখে রাখি, কারণ পুরো অনুশীলনীতে এটিই ব্যবহার করব।", "pin": ["(দ্বৈততা) প্রতিটি সঠিক অভেদ ⊕ ↔ ⊙ এবং 0 ↔ 1 বদলালেও সঠিক থাকে"]},

{"say": "আমরা যা করতে চাই। অংশ a: আধিপত্য বিধি, a প্লাস এক সমান এক, থেকে শুরু করে তার দ্বৈত অভেদ লিখে যাচাই করা যে সেটিও সঠিক। অংশ b: শোষণ বিধি, a প্লাস, a গুণ b, সমান a, থেকে শুরু করে তার দ্বৈত অভেদ লিখে যাচাই করা যে সেটিও সঠিক।", "L": [["goal", "(a)  a ⊕ 1 = 1  এর দ্বৈত, এবং যাচাই করুন যে এটি সঠিক"], ["goal", "(b)  a ⊕ (a ⊙ b) = a  এর দ্বৈত, এবং যাচাই করুন যে এটি সঠিক<span class='tag'>প্রামাণ্য</span>"]]},

{"title": "(a) আধিপত্য বিধির দ্বৈত", "clear": 1, "say": "অংশ a। মূল অভেদ হলো আধিপত্য বিধি: a প্লাস এক সমান এক। সেটের ক্ষেত্রে: A সংযোগ U হলো U। এটি আমরা বাঁ দিকে লিখে রাখি, কারণ এটি একটি সঠিক প্রারম্ভিক অভেদ।", "L": [["sub", "a ⊕ 1 = 1<span class='tag'>মূল অভেদ: আধিপত্য বিধি</span>"], ["txt", "সেটের ক্ষেত্রে:  A ∪ U = U"]], "pin": ["(আধিপত্য) a ⊕ 1 = 1"]},

{"say": "দ্বৈততা নীতি প্রয়োগ করে, আমরা যোগকে গুণ দিয়ে, আর একক শূন্য দিয়ে বদলাই। অভেদে একটি যোগ আর দুটি এক আছে, তাই যোগকে গুণে, আর দুটি একককেই শূন্যে বদলাই।", "L": [["sub", "⊕ → ⊙,      1 → 0<span class='tag'>দ্বৈত অদলবদল</span>"], ["txt", "a ⊕ 1 = 1   হয়ে যায়   a ⊙ 0 = 0"]]},

{"say": "আমরা দ্বৈত অভেদ পাই: a গুণ শূন্য সমান শূন্য। সেটের ক্ষেত্রে: A ছেদ ফাঁকা সেট হলো ফাঁকা সেট।", "L": [["res", "a ⊙ 0 = 0<span class='tag'>দ্বৈত অভেদ</span>"], ["txt", "সেটের ক্ষেত্রে:  A ∩ ∅ = ∅"]]},

{"say": "এবার যাচাই করি যে এটি সঠিক। এই সমতাটি ঠিক দ্বিতীয় আধিপত্য বিধি, যা আগেই প্রমাণিত। এটি বাঁ দিকে লিখে রাখি। সুতরাং, দ্বৈত অভেদটিও সঠিক। এখানেই অংশ a শেষ।", "L": [["res", "a ⊙ 0 = 0  হলো দ্বিতীয় আধিপত্য বিধি   ∎<span class='tag'>দ্বৈত অভেদটিও সঠিক</span>"]], "pin": ["(আধিপত্য) a ⊙ 0 = 0"]},

{"title": "(b) শোষণ বিধির দ্বৈত", "clear": 1, "say": "অংশ b। মূল অভেদ হলো শোষণ বিধি: a প্লাস, a গুণ b, সমান a। সেটের ক্ষেত্রে: A সংযোগ, A ছেদ B, হলো A। এটি বাঁ দিকে লিখে রাখি।", "L": [["sub", "a ⊕ (a ⊙ b) = a<span class='tag'>মূল অভেদ: শোষণ বিধি</span>"], ["txt", "সেটের ক্ষেত্রে:  A ∪ (A ∩ B) = A"]], "pin": ["(শোষণ) a ⊕ (a ⊙ b) = a"]},

{"say": "দ্বৈততা নীতি প্রয়োগ করে, আমরা যোগকে গুণ দিয়ে, আর গুণকে যোগ দিয়ে বদলাই। এই অভেদে শূন্য বা এক কোনোটিই নেই, তাই শুধু যোগকে গুণে, আর গুণকে যোগে বদলাই।", "L": [["sub", "⊕ ↔ ⊙<span class='tag'>দ্বৈত অদলবদল</span>"], ["txt", "a ⊕ (a ⊙ b) = a   হয়ে যায়   a ⊙ (a ⊕ b) = a"]]},

{"say": "আমরা দ্বৈত অভেদ পাই: a গুণ, a প্লাস b, সমান a। সেটের ক্ষেত্রে: A ছেদ, A সংযোগ B, হলো A।", "L": [["res", "a ⊙ (a ⊕ b) = a<span class='tag'>দ্বৈত অভেদ</span>"], ["txt", "সেটের ক্ষেত্রে:  A ∩ (A ∪ B) = A"]]},

{"say": "এবার যাচাই করি যে এটি সঠিক। এই সমতাটি দ্বিতীয় শোষণ বিধি, যা প্রতিটি ল্যাটিসে সঠিক, এবং তাই বুলীয় বীজগণিতেও। এটি বাঁ দিকে লিখে রাখি। এখানেই অংশ b শেষ।", "L": [["res", "a ⊙ (a ⊕ b) = a  হলো দ্বিতীয় শোষণ বিধি   ∎<span class='tag'>প্রতিটি ল্যাটিসে সঠিক, তাই বুলীয় বীজগণিতেও</span>"]], "pin": ["(শোষণ) a ⊙ (a ⊕ b) = a"]},

{"title": "উপসংহার", "clear": 1, "say": "আমরা সিদ্ধান্তে আসি যে, একবার কোনো অভেদ প্রমাণিত হলে, তার দ্বৈত অভেদ স্বয়ংক্রিয়ভাবে সঠিক, নতুন কোনো স্বাধীন প্রমাণের দরকার নেই। সেটের ক্ষেত্রে: সেটের কোনো সমতা সঠিক হলে, সংযোগকে ছেদ দিয়ে, আর ফাঁকা সেটকে U দিয়ে বদলে পাওয়া সমতাটিও সঠিক। দেখার জন্য ধন্যবাদ।", "L": [["res", "সঠিক অভেদ  ⟹  তার দ্বৈতও সঠিক"], ["res", "(a)  a ⊕ 1 = 1   ⟹   a ⊙ 0 = 0"], ["res", "(b)  a ⊕ (a ⊙ b) = a   ⟹   a ⊙ (a ⊕ b) = a"], ["txt", "সেটের ক্ষেত্রে:  ∪ ↔ ∩,   ∅ ↔ U"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' প্লাস ').replace(/⊙/g,' গুণ ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ আবার চালান'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ চালিয়ে যান'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ বিরতি';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ বিরতি';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ বিরতি';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^bn/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/pradeep|bashkar|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="দ্বৈততা নীতি";$('sub').textContent="অনুশীলনী · বুলীয় বীজগণিত";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
