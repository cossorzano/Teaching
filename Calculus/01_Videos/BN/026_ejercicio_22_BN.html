<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>কার্তেসীয় গুণফল ও ছেদ</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>মনে রাখুন</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ শুরু</button><button id="next">▶|</button>
<select id="voice"></select>
<label>গতি <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">রেকর্ডিং মোড (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"bn-BD",
"meta":{"nivel": 2, "titulo": "কার্তেসীয় গুণফল ও ছেদ", "enunciado": "প্রমাণ করুন যে, যেকোনো সেট A, B, C, D এর জন্য:", "tesis": "(A ∩ B) × (C ∩ D) = (A × C) ∩ (B × D)", "datos": ["(× সংজ্ঞা)  (x, y) ∈ X × Y  ⟺  x ∈ X  এবং  y ∈ Y"]},
"steps":[
{"title": "কার্তেসীয় গুণফল ও ছেদ", "sub": "অনুশীলনী · সেটের বীজগণিত", "clear": 1, "say": "নমস্কার। এই ভিডিওতে আমরা প্রমাণ করব যে দুটি ছেদের কার্তেসীয় গুণফল হলো দুটি কার্তেসীয় গুণফলের ছেদ। আমরা উপাদান ধরে ধরে যুক্তি দেব, খুব ধীরে, প্রতিটি সমীকরণ লিখব এবং প্রতিটি ধাপের যুক্তি দেব।", "L": [["txt", "প্রমাণ করুন যে  (A ∩ B) × (C ∩ D) = (A × C) ∩ (B × D)"]]},

{"say": "আমরা কী প্রমাণ করতে চাই। যেকোনো সেট A, B, C ও D এর জন্য, A ও B এর ছেদ, ক্রস C ও D এর ছেদ, সমান A ক্রস C ও B ক্রস D এর ছেদ। বাম দিকে আমরা সেই সংজ্ঞাগুলো মনে করিয়ে দিই যা ব্যবহার করব: কার্তেসীয় গুণফল, ছেদ, অন্তর্ভুক্তি এবং সেটের সমতা।", "L": [["goal", "(A ∩ B) × (C ∩ D) = (A × C) ∩ (B × D)<span class='tag'>যেকোনো A, B, C, D এর জন্য প্রমাণ করুন</span>"]], "pin": ["(× সংজ্ঞা) (x, y) ∈ X × Y  ⟺  x ∈ X  এবং  y ∈ Y", "(∩ সংজ্ঞা) p ∈ X ∩ Y  ⟺  p ∈ X  এবং  p ∈ Y", "(⊆ সংজ্ঞা) X ⊆ Y  ⟺  প্রতিটি p ∈ X এর জন্য p ∈ Y", "(= সংজ্ঞা) X = Y  ⟺  X ⊆ Y  এবং  Y ⊆ X"]},

{"title": "পরিকল্পনা: দ্বিমুখী অন্তর্ভুক্তি", "clear": 1, "say": "আমরা উপাদান ধরে ধরে যুক্তি দেব। সমতার সংজ্ঞা অনুযায়ী, আমাদের দুটি অন্তর্ভুক্তি প্রমাণ করতে হবে। প্রথমটি, A ও B এর ছেদ, ক্রস C ও D এর ছেদ, A ক্রস C ও B ক্রস D এর ছেদের অন্তর্ভুক্ত। দ্বিতীয়টি, বিপরীত অন্তর্ভুক্তি।", "L": [["goal", "(1)  (A ∩ B) × (C ∩ D) ⊆ (A × C) ∩ (B × D)"], ["goal", "(2)  (A × C) ∩ (B × D) ⊆ (A ∩ B) × (C ∩ D)"]]},

{"title": "(1) (A ∩ B) × (C ∩ D) ⊆ (A × C) ∩ (B × D)", "clear": 1, "say": "প্রথম অন্তর্ভুক্তি। অন্তর্ভুক্তির সংজ্ঞা অনুযায়ী, আমরা প্রথম সেটের যেকোনো একটি উপাদান x, y নিই, এবং প্রমাণ করতে হবে যে এটি দ্বিতীয় সেটে আছে।", "L": [["hyp", "ধরা যাক (x, y) ∈ (A ∩ B) × (C ∩ D)"], ["goal", "আমরা চাই:  (x, y) ∈ (A × C) ∩ (B × D)"]]},

{"say": "কার্তেসীয় গুণফলের সংজ্ঞা অনুযায়ী, X সমান A ছেদ B, এবং Y সমান C ছেদ D নিয়ে, প্রথম স্থানাঙ্ক x, A ছেদ B তে আছে, এবং দ্বিতীয় স্থানাঙ্ক y, C ছেদ D তে আছে।", "L": [["txt", "(× সংজ্ঞা) অনুযায়ী,  X = A ∩ B,  Y = C ∩ D  নিয়ে:"], ["sub", "x ∈ A ∩ B   এবং   y ∈ C ∩ D"]]},

{"say": "ছেদের সংজ্ঞা অনুযায়ী, x, A ছেদ B তে থাকার অর্থ x, A তে আছে, এবং x, B তে আছে। আর y, C ছেদ D তে থাকার অর্থ y, C তে আছে, এবং y, D তে আছে।", "L": [["txt", "(∩ সংজ্ঞা) অনুযায়ী:"], ["sub", "x ∈ A  এবং  x ∈ B"], ["sub", "y ∈ C  এবং  y ∈ D"]]},

{"clear": 1, "say": "এবার আমরা অন্যভাবে সাজাই। যেহেতু x, A তে আছে, এবং y, C তে আছে, কার্তেসীয় গুণফলের সংজ্ঞা অনুযায়ী, x, y, A ক্রস C তে আছে। আর যেহেতু x, B তে আছে, এবং y, D তে আছে, x, y, B ক্রস D তে আছে।", "L": [["txt", "অন্যভাবে সাজাই:  x ∈ A  এবং  y ∈ C,  সুতরাং (× সংজ্ঞা) অনুযায়ী:"], ["sub", "(x, y) ∈ A × C"], ["txt", "আর একইভাবে:  x ∈ B  এবং  y ∈ D,  সুতরাং (× সংজ্ঞা) অনুযায়ী:"], ["sub", "(x, y) ∈ B × D"]]},

{"say": "ছেদের সংজ্ঞা অনুযায়ী, X সমান A ক্রস C, এবং Y সমান B ক্রস D নিয়ে, x, y, A ক্রস C ও B ক্রস D এর ছেদে আছে।", "L": [["txt", "(x, y) ∈ A × C   এবং   (x, y) ∈ B × D,  সুতরাং (∩ সংজ্ঞা) অনুযায়ী:"], ["res", "(x, y) ∈ (A × C) ∩ (B × D)"]]},

{"say": "যেহেতু x, y ছিল A ও B এর ছেদ ক্রস C ও D এর ছেদের যেকোনো উপাদান, প্রথম অন্তর্ভুক্তি প্রমাণিত হলো।", "L": [["res", "(A ∩ B) × (C ∩ D) ⊆ (A × C) ∩ (B × D)"]]},

{"title": "(2) (A × C) ∩ (B × D) ⊆ (A ∩ B) × (C ∩ D)", "clear": 1, "say": "দ্বিতীয় অন্তর্ভুক্তি। আমরা A ক্রস C ও B ক্রস D এর ছেদের যেকোনো একটি উপাদান x, y নিই, এবং প্রমাণ করতে হবে যে এটি A ও B এর ছেদ, ক্রস C ও D এর ছেদে আছে।", "L": [["hyp", "ধরা যাক (x, y) ∈ (A × C) ∩ (B × D)"], ["goal", "আমরা চাই:  (x, y) ∈ (A ∩ B) × (C ∩ D)"]]},

{"say": "ছেদের সংজ্ঞা অনুযায়ী, x, y, A ক্রস C তে আছে, এবং x, y, B ক্রস D তে আছে।", "L": [["txt", "(∩ সংজ্ঞা) অনুযায়ী:"], ["sub", "(x, y) ∈ A × C   এবং   (x, y) ∈ B × D"]]},

{"say": "কার্তেসীয় গুণফলের সংজ্ঞা অনুযায়ী, x, y, A ক্রস C তে থাকার অর্থ x, A তে আছে, এবং y, C তে আছে। আর x, y, B ক্রস D তে থাকার অর্থ x, B তে আছে, এবং y, D তে আছে।", "L": [["txt", "(× সংজ্ঞা) অনুযায়ী:"], ["sub", "x ∈ A  এবং  y ∈ C"], ["sub", "x ∈ B  এবং  y ∈ D"]]},

{"clear": 1, "say": "এবার আমরা অন্যভাবে সাজাই। যেহেতু x, A তে আছে, এবং x, B তে আছে, ছেদের সংজ্ঞা অনুযায়ী, x, A ছেদ B তে আছে। আর যেহেতু y, C তে আছে, এবং y, D তে আছে, y, C ছেদ D তে আছে।", "L": [["txt", "অন্যভাবে সাজাই:  x ∈ A  এবং  x ∈ B,  সুতরাং (∩ সংজ্ঞা) অনুযায়ী:"], ["sub", "x ∈ A ∩ B"], ["txt", "আর একইভাবে:  y ∈ C  এবং  y ∈ D,  সুতরাং (∩ সংজ্ঞা) অনুযায়ী:"], ["sub", "y ∈ C ∩ D"]]},

{"say": "কার্তেসীয় গুণফলের সংজ্ঞা অনুযায়ী, X সমান A ছেদ B, এবং Y সমান C ছেদ D নিয়ে, x, y, A ও B এর ছেদ, ক্রস C ও D এর ছেদে আছে।", "L": [["txt", "x ∈ A ∩ B  এবং  y ∈ C ∩ D,  সুতরাং (× সংজ্ঞা) অনুযায়ী:"], ["res", "(x, y) ∈ (A ∩ B) × (C ∩ D)"]]},

{"say": "যেহেতু x, y ছিল A ক্রস C ও B ক্রস D এর ছেদের যেকোনো উপাদান, দ্বিতীয় অন্তর্ভুক্তি প্রমাণিত হলো।", "L": [["res", "(A × C) ∩ (B × D) ⊆ (A ∩ B) × (C ∩ D)"]]},

{"title": "উপসংহার", "clear": 1, "say": "উপসংহার। যেহেতু দুটি অন্তর্ভুক্তিই সত্য, সমতার সংজ্ঞা অনুযায়ী, A ও B এর ছেদ, ক্রস C ও D এর ছেদ, সমান A ক্রস C ও B ক্রস D এর ছেদ। দেখার জন্য ধন্যবাদ।", "L": [["txt", "(1)  (A ∩ B) × (C ∩ D) ⊆ (A × C) ∩ (B × D)"], ["txt", "(2)  (A × C) ∩ (B × D) ⊆ (A ∩ B) × (C ∩ D)"], ["res", "(A ∩ B) × (C ∩ D) = (A × C) ∩ (B × D)"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' প্লাস ').replace(/⊙/g,' গুণ ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ আবার চালান'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ চালিয়ে যান'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ বিরতি';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ বিরতি';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ বিরতি';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^bn/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/pradeep|bashkar|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="কার্তেসীয় গুণফল ও ছেদ";$('sub').textContent="অনুশীলনী · সেটের বীজগণিত";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
