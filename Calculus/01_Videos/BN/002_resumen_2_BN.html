<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>বীজগাণিতিক কাঠামো</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:30%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(15px,1.9vw,24px)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>মনে রাখুন</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ শুরু</button><button id="next">▶|</button>
<select id="voice"></select>
<label>গতি <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">রেকর্ডিং মোড (H)</button><span id="cap"></span></div></div>

{"say": "এই স্বতঃসিদ্ধগুলো থেকে একটি উপপাদ্য পাওয়া যায়: স্বগুণিতা। a প্লাস a হলো a, আর a গুণ a হলো a। কোনো উপাদানকে নিজের সঙ্গে প্রক্রিয়া করলে কিছুই বদলায় না।", "L": [["res", "a ⊕ a = a<span class='tag'>উপপাদ্য: স্বগুণিতা</span>"], ["res", "a ⊙ a = a<span class='tag'>উপপাদ্য: স্বগুণিতা</span>"]]},

{"title": "বুলীয় বীজগণিত", "clear": 1, "say": "আর আমরা পৌঁছে যাই বুলীয় বীজগণিতে। এটি একটি বণ্টনশীল ল্যাটিস, যার একটি ক্ষুদ্রতম উপাদান শূন্য, একটি বৃহত্তম উপাদান এক, এবং প্রতিটি উপাদানের একটি পূরক আছে।", "L": [["goal", "বুলীয় বীজগণিত  =  বণ্টনশীল ল্যাটিস  +  0, 1  +  পূরক"]]},

{"say": "প্রতিটি উপাদান a এর একটি পূরক আছে, যা আমরা সামনে একটি টিল্ডা দিয়ে লিখি। এটিকে একসঙ্গে দুটি শর্ত মানতে হয়: a প্লাস তার পূরক হলো এক, আর a গুণ তার পূরক হলো শূন্য।", "L": [["sub", "a ⊕ ∼a = 1<span class='tag'>পূরক (দুটিই খাটতে হবে)</span>"], ["sub", "a ⊙ ∼a = 0<span class='tag'>পূরক (দুটিই খাটতে হবে)</span>"]]},

{"say": "বণ্টনশীল ল্যাটিস হওয়ায় প্রতিটি উপাদানের পূরক অনন্য। তাছাড়া, শূন্যের পূরক হলো এক।", "L": [["res", "প্রতিটি a এর জন্য ∼a অনন্য"], ["res", "∼0 = 1"]]},

{"say": "বাঁ দিকে বুলীয় বীজগণিতের মূল কথাগুলো লিখে রাখি।", "pin": "বুলীয়: বণ্টনশীল + 0, 1 + পূরক"},

{"title": "বুলীয় বীজগণিতের উপপাদ্য", "clear": 1, "say": "বুলীয় বীজগণিতে কয়েকটি উপপাদ্য খাটে। প্রথমটি আবর্তন বিধি: a এর পূরকের পূরক হলো a।", "L": [["res", "∼(∼a) = a<span class='tag'>আবর্তন বিধি</span>"]]},

{"say": "দ্বিতীয়, আধিপত্য। a প্লাস এক হলো এক। আর a গুণ শূন্য হলো শূন্য।", "L": [["res", "a ⊕ 1 = 1<span class='tag'>আধিপত্য</span>"], ["res", "a ⊙ 0 = 0<span class='tag'>আধিপত্য</span>"]]},

{"say": "তৃতীয়, ডি মরগানের বিধি। a প্লাস b হলো, a এর পূরক গুণ b এর পূরক, এর পূরক। আর a গুণ b হলো, a এর পূরক প্লাস b এর পূরক, এর পূরক।", "L": [["res", "a ⊕ b = ∼(∼a ⊙ ∼b)<span class='tag'>ডি মরগানের বিধি</span>"], ["res", "a ⊙ b = ∼(∼a ⊕ ∼b)<span class='tag'>ডি মরগানের বিধি</span>"]]},

{"title": "দ্বৈততার নীতি", "clear": 1, "say": "শেষে, দ্বৈততার নীতি। যেকোনো সত্য অভেদ সত্যই থাকে, যদি আমরা যোগ আর গুণ, এবং শূন্য আর এক অদলবদল করি।", "L": [["goal", "⊕ ↔ ⊙,      0 ↔ 1"]]},

{"say": "একটি উদাহরণ দেখি। a প্লাস শূন্য সমান a একটি সত্য অভেদ। প্রক্রিয়া ও নিরপেক্ষ উপাদানগুলো অদলবদল করলে পাই a গুণ এক সমান a, যা-ও সত্য।", "L": [["sub", "a ⊕ 0 = a<span class='tag'>সত্য অভেদ</span>"], ["sub", "⊕ ↔ ⊙,  0 ↔ 1"], ["res", "a ⊙ 1 = a<span class='tag'>দ্বৈত অভেদ, এটিও সত্য</span>"]]},

{"title": "সারসংক্ষেপ", "clear": 1, "say": "সংক্ষেপে বলি। ল্যাটিসের জন্য লাগে বিনিময়, সংযোজন আর শোষণ। বণ্টনশীল ল্যাটিস তাতে বণ্টন ধর্ম যোগ করে। আর বুলীয় বীজগণিত যোগ করে শূন্য, এক আর পূরক, যেখান থেকে আসে আবর্তন, আধিপত্য, ডি মরগান আর দ্বৈততা। দেখার জন্য ধন্যবাদ।", "L": [["res", "ল্যাটিস: বিনিময়, সংযোজন, শোষণ ⟹ স্বগুণিতা"], ["res", "+ বণ্টন ধর্ম ⟹ বণ্টনশীল ল্যাটিস"], ["res", "+ 0, 1, ∼a ⟹ বুলীয় বীজগণিত ⟹ আবর্তন, আধিপত্য, ডি মরগান, দ্বৈততা"]]}

<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){const d=document.createElement('div');d.className='l hyp';d.innerHTML=s.pin;if(k<n)d.style.animation='none';pins.appendChild(d)}}
 board.scrollTop=board.scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' প্লাস ').replace(/⊙/g,' গুণ ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ আবার চালান'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ চালিয়ে যান'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ বিরতি';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ বিরতি';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ বিরতি';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^bn/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/pradeep|bashkar|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="বীজগাণিতিক কাঠামো";$('sub').textContent="সারসংক্ষেপ: ল্যাটিস, বণ্টনশীল ল্যাটিস ও বুলীয় বীজগণিত";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
