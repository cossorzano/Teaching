<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>𝒫(U) 是一个格</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}

.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}

mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}

</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>备忘</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ 开始</button><button id="next">▶|</button>
<select id="voice"></select>
<label>语速 <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>

<script type="application/json" id="data">
{"lang":"zh-CN",
"meta":{"nivel": 2, "titulo": "𝒫(U) 是一个格", "enunciado": "证明 (𝒫(U), ∪, ∩) 是一个格。", "tesis": "(𝒫(U), ∪, ∩) 是一个格", "datos": ["（格）  ⊕, ⊙ 封闭；  交换律、结合律、吸收律", "（∪ 的定义）  x ∈ A ∪ B ⇔ x ∈ A 或 x ∈ B", "（∩ 的定义）  x ∈ A ∩ B ⇔ x ∈ A 且 x ∈ B"]},
"steps":[
{"title": "𝒫(U) 是一个格", "sub": "练习 · 代数格", "clear": 1, "say": "大家好。在这个视频中，我们来解一道关于格与集合的练习。我们会讲得很慢，写出每一个等式，并说明每一步的理由。", "L": [["txt", "证明 U 的幂集，连同并集与交集，构成一个格"]]},

{"say": "首先，回顾什么是格。在一个格中，B 带有加法和乘法两种运算，这两种运算必须在 B 中封闭，并且满足三条性质：交换律、结合律和吸收律。", "L": [["hyp", "(B, ⊕, ⊙) 是格  ⇔  ⊕, ⊙ 在 B 中封闭  且  满足：<span class='tag'>定义</span>"], ["hyp", "交换律，   结合律，   吸收律"]]},

{"say": "在我们的情形中，B 是 U 的幂集，加法是并集，乘法是交集。我们要证明的是，这些条件都成立。", "L": [["sub", "B = 𝒫(U),     ⊕ = ∪,     ⊙ = ∩<span class='tag'>我们的情形</span>"], ["goal", "要证：  (𝒫(U), ∪, ∩) 是一个格<span class='tag'>结论</span>"]]},

{"title": "运算的封闭性", "clear": 1, "say": "首先，运算是封闭的。给定 U 的两个子集 A 和 B，A 与 B 的并集也是 U 的子集，A 与 B 的交集也是 U 的子集。也就是说，U 的幂集中两个元素的并集和交集，仍然在 U 的幂集中。", "L": [["txt", "设 A, B ⊆ U"], ["res", "A ∪ B ⊆ U<span class='tag'>∪ 封闭</span>"], ["res", "A ∩ B ⊆ U<span class='tag'>∩ 封闭</span>"]]},

{"title": "方法：用元素推理", "clear": 1, "say": "现在我们用元素推理来证明这些性质。设 A、B、C 是 U 的子集，x 是 U 的一个元素。回顾一下，两个集合相等，当且仅当它们有相同的元素。因此，要证明两个集合相等，我们将证明 x 属于其中一个，当且仅当 x 属于另一个。", "L": [["txt", "设 A, B, C ⊆ U  且  x ∈ U"], ["goal", "X = Y   ⇔   (x ∈ X ⇔ x ∈ Y)<span class='tag'>集合相等：元素相同</span>"]]},

{"say": "再回顾并集和交集的定义。x 属于 A 与 B 的并集，当且仅当 x 属于 A，或者 x 属于 B。x 属于 A 与 B 的交集，当且仅当 x 属于 A，并且 x 属于 B。我们把它们记在左边。", "L": [["sub", "x ∈ A ∪ B  ⇔  x ∈ A  或  x ∈ B<span class='tag'>并集的定义</span>"], ["sub", "x ∈ A ∩ B  ⇔  x ∈ A  且  x ∈ B<span class='tag'>交集的定义</span>"]], "pin": ["（∪ 定义） x ∈ A ∪ B ⇔ x ∈ A 或 x ∈ B", "（∩ 定义） x ∈ A ∩ B ⇔ x ∈ A 且 x ∈ B"]},

{"title": "∪ 的交换律", "clear": 1, "say": "我们从并集的交换律开始。要证明 A 并 B 等于 B 并 A。从 x 属于 A 并 B 出发。", "L": [["goal", "要证：  A ∪ B = B ∪ A"], ["txt", "x ∈ A ∪ B"]]},

{"say": "第一步。由并集的定义，x 属于 A 并 B，当且仅当 x 属于 A，或者 x 属于 B。", "L": [["sub", "⇔  x ∈ A  或  x ∈ B<span class='tag'>∪ 的定义</span>"]]},

{"say": "第二步。由逻辑析取「或」的交换律，可以交换顺序：x 属于 B，或者 x 属于 A。", "L": [["sub", "⇔  x ∈ B  或  x ∈ A<span class='tag'>「或」的交换律</span>"]]},

{"say": "第三步。由并集的定义，反过来读，这等价于 x 属于 B 并 A。由于 x 是任意的，两个集合有相同的元素，因此它们相等。", "L": [["res", "⇔  x ∈ B ∪ A<span class='tag'>∪ 的定义</span>"], ["res", "A ∪ B = B ∪ A   ∎"]]},

{"title": "∩ 的交换律", "clear": 1, "say": "接着是交集的交换律。要证明 A 交 B 等于 B 交 A。从 x 属于 A 交 B 出发。", "L": [["goal", "要证：  A ∩ B = B ∩ A"], ["txt", "x ∈ A ∩ B"]]},

{"say": "第一步。由交集的定义，x 属于 A 交 B，当且仅当 x 属于 A，并且 x 属于 B。", "L": [["sub", "⇔  x ∈ A  且  x ∈ B<span class='tag'>∩ 的定义</span>"]]},

{"say": "第二步。由逻辑合取「且」的交换律，可以交换顺序：x 属于 B，并且 x 属于 A。", "L": [["sub", "⇔  x ∈ B  且  x ∈ A<span class='tag'>「且」的交换律</span>"]]},

{"say": "第三步。由交集的定义，反过来读，这等价于 x 属于 B 交 A。由于 x 是任意的，两个集合相等。", "L": [["res", "⇔  x ∈ B ∩ A<span class='tag'>∩ 的定义</span>"], ["res", "A ∩ B = B ∩ A   ∎"]]},

{"title": "∪ 的结合律", "clear": 1, "say": "下面是并集的结合律。要证明 A 并，B 并 C，等于，A 并 B，再并 C。从 x 属于 A 并，B 并 C 出发。", "L": [["goal", "要证：  A ∪ (B ∪ C) = (A ∪ B) ∪ C"], ["txt", "x ∈ A ∪ (B ∪ C)"]]},

{"say": "第一步。由并集的定义，x 属于 A，或者 x 属于 B 并 C。再用一次定义，x 属于 B 并 C，当且仅当 x 属于 B，或者 x 属于 C。", "L": [["sub", "⇔  x ∈ A  或  (x ∈ B  或  x ∈ C)<span class='tag'>∪ 的定义，用两次</span>"]]},

{"say": "第二步。由逻辑析取「或」的结合律，怎样分组都没有关系，所以可以去掉括号：x 属于 A，或者 x 属于 B，或者 x 属于 C。", "L": [["sub", "⇔  (x ∈ A  或  x ∈ B  或  x ∈ C)<span class='tag'>「或」的结合律</span>"]]},

{"say": "第三步。把前两项合在一起。由并集的定义，x 属于 A，或者 x 属于 B，等价于 x 属于 A 并 B。因此，我们得到 x 属于 A 并 B，或者 x 属于 C。", "L": [["sub", "⇔  (x ∈ A ∪ B)  或  x ∈ C<span class='tag'>∪ 的定义</span>"]]},

{"say": "第四步。由并集的定义，这等价于 x 属于，A 并 B，再并 C。由于 x 是任意的，两个集合相等。", "L": [["res", "⇔  x ∈ (A ∪ B) ∪ C<span class='tag'>∪ 的定义</span>"], ["res", "A ∪ (B ∪ C) = (A ∪ B) ∪ C   ∎"]]},

{"title": "∩ 的结合律", "clear": 1, "say": "接着是交集的结合律。要证明 A 交，B 交 C，等于，A 交 B，再交 C。从 x 属于 A 交，B 交 C 出发。", "L": [["goal", "要证：  A ∩ (B ∩ C) = (A ∩ B) ∩ C"], ["txt", "x ∈ A ∩ (B ∩ C)"]]},

{"say": "第一步。由交集的定义，x 属于 A，并且 x 属于 B 交 C。再用一次定义，x 属于 B 交 C，当且仅当 x 属于 B，并且 x 属于 C。", "L": [["sub", "⇔  x ∈ A  且  (x ∈ B  且  x ∈ C)<span class='tag'>∩ 的定义，用两次</span>"]]},

{"say": "第二步。由逻辑合取「且」的结合律，可以去掉括号：x 属于 A，并且 x 属于 B，并且 x 属于 C。", "L": [["sub", "⇔  (x ∈ A  且  x ∈ B  且  x ∈ C)<span class='tag'>「且」的结合律</span>"]]},

{"say": "第三步。把前两项合在一起。由交集的定义，x 属于 A，并且 x 属于 B，等价于 x 属于 A 交 B。因此，我们得到 x 属于 A 交 B，并且 x 属于 C。", "L": [["sub", "⇔  (x ∈ A ∩ B)  且  x ∈ C<span class='tag'>∩ 的定义</span>"]]},

{"say": "第四步。由交集的定义，这等价于 x 属于，A 交 B，再交 C。由于 x 是任意的，两个集合相等。", "L": [["res", "⇔  x ∈ (A ∩ B) ∩ C<span class='tag'>∩ 的定义</span>"], ["res", "A ∩ (B ∩ C) = (A ∩ B) ∩ C   ∎"]]},

{"title": "∪ 的吸收律", "clear": 1, "say": "最后是并集的吸收律。要证明 A 并，A 交 B，等于 A。从 x 属于 A 并，A 交 B 出发。", "L": [["goal", "要证：  A ∪ (A ∩ B) = A"], ["txt", "x ∈ A ∪ (A ∩ B)"]]},

{"say": "第一步。由并集的定义，再由交集的定义，x 属于 A，或者，x 属于 A 并且 x 属于 B。", "L": [["sub", "⇔  x ∈ A  或  (x ∈ A  且  x ∈ B)<span class='tag'>∪ 与 ∩ 的定义</span>"]]},

{"say": "第二步。这等价于 x 属于 A。如果 x 属于 A，析取的第一部分为真。反过来，如果析取为真，要么 x 属于 A，要么 x 既属于 A 又属于 B，两种情况下 x 都属于 A。", "L": [["sub", "⇔  x ∈ A<span class='tag'>若 x ∈ A，析取成立；若析取成立，则 x ∈ A</span>"]]},

{"say": "第三步。最后一行再次写出 x 属于 A。这正是属于等式右边的集合。由于 x 是任意的，两个集合相等。", "L": [["res", "⇔  x ∈ A"], ["res", "A ∪ (A ∩ B) = A   ∎"]]},

{"title": "∩ 的吸收律", "clear": 1, "say": "还有交集的吸收律。要证明 A 交，A 并 B，等于 A。从 x 属于 A 交，A 并 B 出发。", "L": [["goal", "要证：  A ∩ (A ∪ B) = A"], ["txt", "x ∈ A ∩ (A ∪ B)"]]},

{"say": "第一步。由交集的定义，再由并集的定义，x 属于 A，并且，x 属于 A 或者 x 属于 B。", "L": [["sub", "⇔  x ∈ A  且  (x ∈ A  或  x ∈ B)<span class='tag'>∩ 与 ∪ 的定义</span>"]]},

{"say": "第二步。这等价于 x 属于 A。如果 x 属于 A，合取的两部分都成立，因为 x 属于 A 使第二部分为真。反过来，如果合取为真，由第一部分可知 x 属于 A。", "L": [["sub", "⇔  x ∈ A<span class='tag'>若 x ∈ A，合取成立；若合取成立，则 x ∈ A</span>"]]},

{"say": "第三步。最后一行再次写出 x 属于 A。由于 x 是任意的，两个集合相等。", "L": [["res", "⇔  x ∈ A"], ["res", "A ∩ (A ∪ B) = A   ∎"]]},

{"title": "结论", "clear": 1, "say": "由于两种运算都是封闭的，并且满足交换律、结合律和吸收律，我们得出结论：U 的幂集，连同并集与交集，构成一个格。感谢观看。", "L": [["res", "∪, ∩ 在 𝒫(U) 中封闭"], ["res", "交换律，  结合律，  吸收律"], ["res", "(𝒫(U), ∪, ∩) 是一个格   ∎"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' 加 ').replace(/⊙/g,' 乘 ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ 重播'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ 继续'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ 暂停';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ 暂停';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ 暂停';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^zh/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/yunyang|yunxi|yunjian|kangkang|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="𝒫(U) 是一个格";$('sub').textContent="练习 · 代数格";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
