<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">

<title>三个集合的差</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}

#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}

.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}

mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}

.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>备忘</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">

<script type="application/json" id="data">
{"lang":"zh-CN",
"meta":{"nivel": 2, "titulo": "三个集合的差", "enunciado": "(a) 证明下面两个公式中，一个总是正确的，另一个有时是错误的。(b) 给出一个附加的充要条件，使错误的那个公式总是成立。", "tesis": "<span dir='ltr'>(i)  A ∖ (B ∖ C) = (A ∖ B) ∪ C</span><br><span dir='ltr'>(ii)  (A ∖ B) ∖ C = A ∖ (B ∪ C)</span>", "datos": ["（∖ 的定义）  x ∈ X ∖ Y  ⟺  x ∈ X  且  x ∉ Y"]},
"steps":[
{"title": "三个集合的差", "sub": "练习 · 集合代数", "clear": 1, "say": "大家好。在这个视频中，我们要研究关于三个集合之差的两个公式：其中一个总是正确的，另一个有时是错误的。然后，我们要寻找一个条件，使错误的那个公式总是成立。我们会讲得很慢，写出每一个等式，并说明每一步的理由。", "L": [["txt", "关于三个集合之差的两个公式"]]},

{"clear": 1, "say": "我们要做的事。在 (a) 小题中，有两个公式。公式 i：A 减去 B 减 C，等于 A 减 B 再并 C。公式 ii：A 减 B 再减 C，等于 A 减去 B 并 C。需要证明其中一个总是正确的，另一个有时是错误的。在 (b) 小题中，需要找到一个附加的充要条件，使错误的公式总是成立。我们在左边列出要用到的、用元素表示的定义。", "L": [["goal", "(a)  一个公式总是正确的，另一个有时是错误的："], ["txt", "(i)  A ∖ (B ∖ C) = (A ∖ B) ∪ C"], ["txt", "(ii)  (A ∖ B) ∖ C = A ∖ (B ∪ C)"], ["goal", "(b)  使错误的公式总是成立的充要条件"]], "pin": ["（∖ 定义） x ∈ X ∖ Y  ⟺  x ∈ X  且  x ∉ Y", "（∪ 定义） x ∈ X ∪ Y  ⟺  x ∈ X  或  x ∈ Y", "（∩ 定义） x ∈ X ∩ Y  ⟺  x ∈ X  且  x ∈ Y"]},

{"title": "(a) 分析 (i)", "clear": 1, "say": "(a) 小题，分析公式 i。我们将看到它一般不成立。要证明一个公式不总是成立，只需找到一个反例：一些具体的集合，使公式不成立。", "L": [["goal", "(i)  A ∖ (B ∖ C) = (A ∖ B) ∪ C   一般不成立"], ["txt", "只需一个反例"]]},

{"say": "取 A 为空集，B 为空集，C 为只含元素零的集合。", "L": [["hyp", "A = ∅"], ["hyp", "B = ∅"], ["hyp", "C = { 0 }"]]},

{"clear": 1, "say": "计算左边。首先，B 减 C 是空集减去含零的集合。因为空集没有元素，所以它不可能有不在 C 中的元素。所以 B 减 C 是空集。", "L": [["txt", "左边。  首先："], ["sub", "B ∖ C = ∅ ∖ { 0 } = ∅"]]},

{"say": "接着，A 减去 B 减 C，是空集减空集，仍然是空集。因此，左边是空集。", "L": [["sub", "A ∖ (B ∖ C) = ∅ ∖ ∅ = ∅"]]},

{"say": "计算右边。A 减 B 是空集减空集，即空集。空集并上含零的集合，就是含零的集合。因此，右边是含零的集合。", "L": [["txt", "右边："], ["sub", "A ∖ B = ∅ ∖ ∅ = ∅"], ["sub", "(A ∖ B) ∪ C = ∅ ∪ { 0 } = { 0 }"]]},

{"clear": 1, "say": "比较一下。左边是空集，右边是含零的集合。它们不相等，因为零属于后者，而不属于前者。所以公式 i 对这些集合不成立，它有时是错误的。", "L": [["warn", "∅ ≠ { 0 }   因为  0 ∈ { 0 }  且  0 ∉ ∅"], ["res", "(i) 有时是错误的"]]},

{"title": "(a) 分析 (ii)", "clear": 1, "say": "(a) 小题，分析公式 ii。我们要证明，对任意集合 A、B、C，A 减去 B 并 C，等于 A 减 B 再减 C。任取一个元素 x，写出一串等价关系。因为每一步都是等价的，可以双向阅读，这样就同时证明了两个包含关系。", "L": [["hyp", "设 x 为任意元素"], ["goal", "要证：  x ∈ A ∖ (B ∪ C)  ⟺  x ∈ (A ∖ B) ∖ C"]]},

{"clear": 1, "say": "从命题 x 属于 A 减去 B 并 C 出发。", "L": [["sub", "x ∈ A ∖ (B ∪ C)"]]},

{"say": "根据差集的定义，取 X 等于 A，Y 等于 B 并 C，这等价于 x 属于 A，并且 x 不属于 B 并 C。", "L": [["sub", "⟺  x ∈ A  且  x ∉ B ∪ C<span class='tag'>（∖ 定义）</span>"]]},

{"say": "x 不属于 B 并 C，意味着并非 x 属于 B 或者 x 属于 C。这恰好是 x 不属于 B，并且 x 不属于 C。", "L": [["sub", "⟺  x ∈ A  且  ( x ∉ B  且  x ∉ C )<span class='tag'>（∪ 定义）的否定</span>"]]},

{"say": "利用合取的结合律，换一种方式组合：先是 x 属于 A 且 x 不属于 B，然后再且上 x 不属于 C。", "L": [["sub", "⟺  ( x ∈ A  且  x ∉ B )  且  x ∉ C<span class='tag'>「且」的结合律</span>"]]},

{"say": "根据差集的定义，取 X 等于 A，Y 等于 B，x 属于 A 且 x 不属于 B，等价于 x 属于 A 减 B。", "L": [["sub", "⟺  x ∈ A ∖ B  且  x ∉ C<span class='tag'>（∖ 定义）</span>"]]},

{"say": "再根据差集的定义，这次取 X 等于 A 减 B，Y 等于 C，这等价于 x 属于 A 减 B 再减 C。", "L": [["sub", "⟺  x ∈ (A ∖ B) ∖ C<span class='tag'>（∖ 定义）</span>"]]},

{"clear": 1, "say": "由于 x 是任意的，首尾两个命题对所有 x 都等价。因此两个集合相等，公式 ii 对任意集合 A、B、C 都成立。", "L": [["res", "A ∖ (B ∪ C) = (A ∖ B) ∖ C"], ["res", "(ii) 总是正确的"]]},

{"title": "(b) 使 (i) 成立的条件", "clear": 1, "say": "(b) 小题。我们要找一个充要条件，使公式 i 总是成立。首先，用补集化简左边。我们在左边列出要用到的四条性质：差集等于与补集的交集，德摩根律，补集的补集是集合本身，以及分配律。", "L": [["goal", "寻找使  A ∖ (B ∖ C) = (A ∖ B) ∪ C  成立的条件"], ["txt", "首先，化简左边"]], "pin": ["(Dif) X ∖ Y = X ∩ Yᶜ", "(De Morgan) (X ∩ Y)ᶜ = Xᶜ ∪ Yᶜ", "(Invol) (Xᶜ)ᶜ = X", "(Distrib) X ∩ (Y ∪ Z) = (X ∩ Y) ∪ (X ∩ Z)"]},

{"clear": 1, "say": "从 A 减去 B 减 C 出发。", "L": [["sub", "A ∖ (B ∖ C)"]]},

{"say": "由性质 Dif，取 X 等于 A，Y 等于 B 减 C，A 减去 B 减 C，等于 A 交上 B 减 C 的补集。", "L": [["sub", "=  A ∩ (B ∖ C)ᶜ<span class='tag'>(Dif)</span>"]]},

{"say": "再由性质 Dif，这次取 X 等于 B，Y 等于 C，B 减 C 等于 B 交 C 的补集。", "L": [["sub", "=  A ∩ (B ∩ Cᶜ)ᶜ<span class='tag'>(Dif)</span>"]]},

{"say": "由德摩根律，取 X 等于 B，Y 等于 C 的补集，B 与 C 的补集之交的补集，等于 B 的补集并上 C 的补集的补集。", "L": [["sub", "=  A ∩ ( Bᶜ ∪ (Cᶜ)ᶜ )<span class='tag'>(De Morgan)</span>"]]},

{"say": "因为 C 的补集的补集就是 C，由性质 Invol，得到 A 交上 B 的补集并 C。", "L": [["sub", "=  A ∩ ( Bᶜ ∪ C )<span class='tag'>(Invol)</span>"]]},

{"say": "由分配律，取 X 等于 A，Y 等于 B 的补集，Z 等于 C，这等于 A 交 B 的补集，并上 A 交 C。", "L": [["sub", "=  (A ∩ Bᶜ) ∪ (A ∩ C)<span class='tag'>(Distrib)</span>"]]},

{"say": "再由性质 Dif，A 交 B 的补集就是 A 减 B。", "L": [["res", "=  (A ∖ B) ∪ (A ∩ C)<span class='tag'>(Dif)</span>"]]},

{"clear": 1, "say": "因此，等式 i 等价于：A 减 B 并上 A 交 C，等于 A 减 B 并上 C。我们把这个等式记作星号。两边唯一的区别是：左边出现的是 A 交 C，右边出现的是 C。", "L": [["txt", "(i)  等价于："], ["goal", "(A ∖ B) ∪ (A ∩ C) = (A ∖ B) ∪ C<span class='tag'>(★)</span>"]]},

{"title": "(b) (★) ⟺ C ⊆ A", "clear": 1, "say": "我们断言：星号等式成立，当且仅当 C 包含于 A。我们从两个方向证明。", "L": [["goal", "(★)   ⟺   C ⊆ A"], ["txt", "(⟸)  假设 C ⊆ A，证明 (★)"], ["txt", "(⟹)  假设 (★)，证明 C ⊆ A"]]},

{"clear": 1, "say": "首先证明从右到左的方向。假设 C 包含于 A。那么 A 交 C 等于 C。事实上，A 交 C 总是包含于 C。反过来，若 x 属于 C，因为 C 包含于 A，所以 x 属于 A，于是 x 既属于 A 又属于 C，也就是属于 A 交 C。", "L": [["hyp", "假设  C ⊆ A"], ["txt", "A ∩ C ⊆ C  总成立。  若  x ∈ C，  因为  C ⊆ A，  x ∈ A：  所以  x ∈ A ∩ C"], ["sub", "A ∩ C = C"]]},

{"say": "在星号等式的左边，把 A 交 C 换成 C。两边都得到 A 减 B 并上 C。因此星号等式成立。", "L": [["txt", "把  A ∩ C = C  代入 (★)："], ["res", "(A ∖ B) ∪ C = (A ∖ B) ∪ C"], ["res", "C ⊆ A  ⟹  (★)"]]},

{"clear": 1, "say": "其次证明从左到右的方向。假设星号等式成立，需要证明 C 包含于 A。设 x 是 C 中任意一个元素。", "L": [["hyp", "假设 (★)"], ["hyp", "设  x ∈ C"], ["goal", "要证：  x ∈ A"]]},

{"say": "因为 x 属于 C，根据并集的定义，x 属于 A 减 B 并上 C。再由星号等式，x 也属于 A 减 B 并上 A 交 C。", "L": [["txt", "x ∈ C  ⟹  x ∈ (A ∖ B) ∪ C   由（∪ 定义）"], ["txt", "由(★)："], ["sub", "x ∈ (A ∖ B) ∪ (A ∩ C)"]]},

{"say": "根据并集的定义，这意味着 x 属于 A 减 B，或者 x 属于 A 交 C。我们分两种情形讨论。", "L": [["txt", "由（∪ 定义）："], ["hyp", "情形 1：  x ∈ A ∖ B"], ["hyp", "情形 2：  x ∈ A ∩ C"]]},

{"say": "情形一，根据差集的定义，x 属于 A，并且 x 不属于 B。特别地，x 属于 A。情形二，根据交集的定义，x 属于 A，并且 x 属于 C。特别地，x 属于 A。", "L": [["sub", "情形 1：  由（∖ 定义），  x ∈ A  且  x ∉ B   ⟹   x ∈ A"], ["sub", "情形 2：  由（∩ 定义），  x ∈ A  且  x ∈ C   ⟹   x ∈ A"]]},

{"clear": 1, "say": "在两种情形下，x 都属于 A。由于 x 是 C 中任意元素，我们得出 C 包含于 A。", "L": [["res", "x ∈ A"], ["res", "(★)  ⟹  C ⊆ A"]]},

{"title": "结论", "clear": 1, "say": "(b) 小题的结论。公式 i 成立，当且仅当 C 包含于 A。用 (a) 小题的反例检验一下：C 是含零的集合，A 是空集，所以 C 不包含于 A，公式就不成立。", "L": [["res", "A ∖ (B ∖ C) = (A ∖ B) ∪ C   ⟺   C ⊆ A"], ["txt", "反例：  C = { 0 } ⊄ ∅ = A   ⟹   (i) 不成立"]]},

{"title": "小结", "clear": 1, "say": "小结。公式 ii 总是正确的。公式 i 有时是错误的，并且恰好在 C 包含于 A 时成立。感谢观看。", "L": [["res", "(ii)  (A ∖ B) ∖ C = A ∖ (B ∪ C)   总成立"], ["res", "(i)  A ∖ (B ∖ C) = (A ∖ B) ∪ C   ⟺   C ⊆ A"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' 加 ').replace(/⊙/g,' 乘 ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ 重播'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ 继续'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ 暂停';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ 暂停';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ 暂停';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^zh/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/yunyang|yunxi|yunjian|kangkang|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="三个集合的差";$('sub').textContent="练习 · 集合代数";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
