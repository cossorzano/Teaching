<!DOCTYPE html>

<title>𝒫(U) 是分配格</title>
<style>

</style></head><body><div id="app">

<script type="application/json" id="data">
{"lang":"zh-CN",
"meta":{"nivel": 2, "titulo": "𝒫(U) 是分配格", "enunciado": "证明 (𝒫(U), ∪, ∩) 是一个分配格。", "tesis": "(1)  A ∩ (B ∪ C) = (A ∩ B) ∪ (A ∩ C),   (2)  A ∪ (B ∩ C) = (A ∪ B) ∩ (A ∪ C)", "datos": ["（假设）  (𝒫(U), ∪, ∩) 是一个格", "（双向包含）  X = Y ⇔ X ⊆ Y 且 Y ⊆ X", "（∪、∩ 的定义）  x ∈ X ∪ Y ⇔ x ∈ X 或 x ∈ Y，   x ∈ X ∩ Y ⇔ x ∈ X 且 x ∈ Y"]},

{"title": "𝒫(U) 是分配格", "sub": "练习 · 集合代数", "clear": 1, "say": "大家好。在这个视频中，我们来解一道关于集合代数的练习。我们会讲得很慢，写出每一个等式，并说明每一步的理由。", "L": [["txt", "证明 U 的幂集，连同并集与交集，构成一个分配格"]]},

{"say": "首先，已知条件。我们已经知道，U 的幂集，连同并集与交集，构成一个格，其中并集起上确界的作用，交集起下确界的作用。", "L": [["hyp", "(𝒫(U), ∪, ∩) 是一个格<span class='tag'>假设：已知</span>"], ["txt", "∪ = 上确界，     ∩ = 下确界"]]},

{"say": "要说明它是分配格，我们必须验证：对 U 的任意子集 A、B、C，下面两个等式成立。第一个：A 交，B 并 C，等于，A 交 B，并，A 交 C。第二个：A 并，B 交 C，等于，A 并 B，交，A 并 C。", "L": [["txt", "设 A, B, C ⊆ U"], ["goal", "(1)  A ∩ (B ∪ C) = (A ∩ B) ∪ (A ∩ C)<span class='tag'>结论</span>"], ["goal", "(2)  A ∪ (B ∩ C) = (A ∪ B) ∩ (A ∪ C)<span class='tag'>结论</span>"]]},

{"say": "我们用双向包含来证明这两个等式。回顾一下，两个集合相等，当且仅当每一个都包含于另一个。再回顾用元素表述的并集和交集的定义：x 属于并集，如果它属于两个集合中的一个；x 属于交集，如果它同时属于两个集合。我们把它们记在左边。", "L": [["sub", "X = Y  ⇔  X ⊆ Y  且  Y ⊆ X<span class='tag'>用双向包含证明相等</span>"], ["sub", "X ⊆ Y  ⇔  (x ∈ X ⇒ x ∈ Y)<span class='tag'>包含</span>"]], "pin": ["（双向包含） X = Y ⇔ X ⊆ Y 且 Y ⊆ X", "（∪ 定义） x ∈ X ∪ Y ⇔ x ∈ X 或 x ∈ Y", "（∩ 定义） x ∈ X ∩ Y ⇔ x ∈ X 且 x ∈ Y"]},

{"title": "第一定律：A ∩ (B ∪ C) ⊆ (A ∩ B) ∪ (A ∩ C)", "clear": 1, "say": "我们从第一个等式开始。设 x 是 U 的一个元素。先证明从左到右的包含。假设 x 属于 A 交，B 并 C。这是一个假设。", "L": [["txt", "设 x ∈ U"], ["hyp", "x ∈ A ∩ (B ∪ C)<span class='tag'>假设</span>"], ["goal", "要证：  x ∈ (A ∩ B) ∪ (A ∩ C)<span class='tag'>结论</span>"]]},

{"say": "由交集的定义，x 属于 A，并且 x 属于 B 并 C。再由并集的定义，x 属于 B 并 C 的意思是：x 属于 B，或者 x 属于 C。", "L": [["hyp", "x ∈ A   且   x ∈ B ∪ C<span class='tag'>∩ 的定义</span>"], ["hyp", "x ∈ A   且   (x ∈ B  或  x ∈ C)<span class='tag'>∪ 的定义</span>"]]},

{"say": "现在分两种情形。情形一：x 属于 B。由于 x 也属于 A，由交集的定义，x 属于 A 交 B。", "L": [["sub", "情形 1：  x ∈ B"], ["sub", "x ∈ A  且  x ∈ B   ⟹   x ∈ A ∩ B<span class='tag'>∩ 的定义</span>"]]},

{"say": "情形二：x 属于 C。由于 x 也属于 A，由交集的定义，x 属于 A 交 C。", "L": [["sub", "情形 2：  x ∈ C"], ["sub", "x ∈ A  且  x ∈ C   ⟹   x ∈ A ∩ C<span class='tag'>∩ 的定义</span>"]]},

{"say": "无论哪种情形，x 属于 A 交 B，或者 x 属于 A 交 C。由并集的定义，x 属于，A 交 B，并，A 交 C。这个包含就证完了。", "L": [["res", "x ∈ (A ∩ B) ∪ (A ∩ C)<span class='tag'>∪ 的定义，两种情形都成立</span>"], ["res", "A ∩ (B ∪ C) ⊆ (A ∩ B) ∪ (A ∩ C)   ∎"]]},

{"title": "第一定律：(A ∩ B) ∪ (A ∩ C) ⊆ A ∩ (B ∪ C)", "clear": 1, "say": "反过来，我们证明从右到左的包含。假设 x 属于，A 交 B，并，A 交 C。这是一个假设。由并集的定义，x 属于 A 交 B，或者 x 属于 A 交 C。", "L": [["hyp", "x ∈ (A ∩ B) ∪ (A ∩ C)<span class='tag'>假设</span>"], ["hyp", "x ∈ A ∩ B   或   x ∈ A ∩ C<span class='tag'>∪ 的定义</span>"], ["goal", "要证：  x ∈ A ∩ (B ∪ C)<span class='tag'>结论</span>"]]},

{"say": "无论哪种情形，x 都属于 A。如果 x 属于 A 交 B，那么 x 属于 A 也属于 B。如果 x 属于 A 交 C，那么 x 属于 A 也属于 C。此外，第一种情形 x 属于 B，第二种情形 x 属于 C。也就是说，x 属于 A，并且，x 属于 B 或者 x 属于 C。", "L": [["sub", "x ∈ A   且   (x ∈ B  或  x ∈ C)<span class='tag'>每种情形用 ∩ 的定义</span>"]]},

{"say": "由并集的定义，x 属于 B 或者 x 属于 C，意思就是 x 属于 B 并 C。", "L": [["sub", "x ∈ A   且   x ∈ B ∪ C<span class='tag'>∪ 的定义</span>"]]},

{"say": "因此，由交集的定义，x 属于 A 交，B 并 C。这个包含就证完了。", "L": [["res", "x ∈ A ∩ (B ∪ C)<span class='tag'>∩ 的定义</span>"], ["res", "(A ∩ B) ∪ (A ∩ C) ⊆ A ∩ (B ∪ C)   ∎"]]},

{"title": "第一分配律", "clear": 1, "say": "两个包含都已证明。由双向包含，得到第一个等式：A 交，B 并 C，等于，A 交 B，并，A 交 C。", "L": [["res", "A ∩ (B ∪ C) = (A ∩ B) ∪ (A ∩ C)   ∎<span class='tag'>双向包含</span>"]]},

{"title": "第二定律 (1)：A ∪ (B ∩ C) ⊆ (A ∪ B) ∩ (A ∪ C)", "clear": 1, "say": "现在证明第二分配律，同样用双向包含。设 x 是 U 的一个元素。先看第一部分：证明 A 并，B 交 C，包含于，A 并 B，交，A 并 C。假设 x 属于 A 并，B 交 C。这是一个假设。", "L": [["txt", "设 x ∈ U"], ["hyp", "x ∈ A ∪ (B ∩ C)<span class='tag'>假设</span>"], ["goal", "要证：  x ∈ (A ∪ B) ∩ (A ∪ C)<span class='tag'>结论</span>"]]},

{"say": "由并集的定义，x 属于 A，或者 x 属于 B 交 C。分两种情形。", "L": [["hyp", "x ∈ A   或   x ∈ B ∩ C<span class='tag'>∪ 的定义</span>"]]},

{"say": "情形一：x 属于 A。那么显然，由并集的定义，x 属于 A 并 B，并且 x 属于 A 并 C。因此，x 属于这两个并集的交集。", "L": [["sub", "情形 1：  x ∈ A"], ["sub", "x ∈ A ∪ B   且   x ∈ A ∪ C<span class='tag'>∪ 的定义</span>"], ["res", "x ∈ (A ∪ B) ∩ (A ∪ C)<span class='tag'>∩ 的定义</span>"]]},

{"say": "情形二：x 属于 B 交 C。那么 x 属于 B，并且 x 属于 C。特别地，x 属于 A 并 B，因为 x 属于 B。x 也属于 A 并 C，因为 x 属于 C。所以 x 属于这两个并集的交集。", "L": [["sub", "情形 2：  x ∈ B ∩ C   ⟹   x ∈ B  且  x ∈ C<span class='tag'>∩ 的定义</span>"], ["sub", "x ∈ A ∪ B  （因为 x ∈ B）   且   x ∈ A ∪ C  （因为 x ∈ C）<span class='tag'>∪ 的定义</span>"], ["res", "x ∈ (A ∪ B) ∩ (A ∪ C)<span class='tag'>∩ 的定义</span>"]]},

{"say": "在两种情形下，x 都属于，A 并 B，交，A 并 C。因此，A 并，B 交 C，包含于，A 并 B，交，A 并 C。", "L": [["res", "A ∪ (B ∩ C) ⊆ (A ∪ B) ∩ (A ∪ C)   ∎<span class='tag'>两种情形都成立</span>"]]},

{"title": "第二定律 (2)：(A ∪ B) ∩ (A ∪ C) ⊆ A ∪ (B ∩ C)", "clear": 1, "say": "接着看第二部分：证明，A 并 B，交，A 并 C，包含于，A 并，B 交 C。现在假设 x 属于，A 并 B，交，A 并 C。这是一个假设。", "L": [["hyp", "x ∈ (A ∪ B) ∩ (A ∪ C)<span class='tag'>假设</span>"], ["goal", "要证：  x ∈ A ∪ (B ∩ C)<span class='tag'>结论</span>"]]},

{"say": "由交集的定义，x 属于 A 并 B，并且 x 属于 A 并 C。再由并集的定义，这意味着：x 属于 A 或者 x 属于 B，并且，x 属于 A 或者 x 属于 C。", "L": [["hyp", "x ∈ A ∪ B   且   x ∈ A ∪ C<span class='tag'>∩ 的定义</span>"], ["hyp", "(x ∈ A  或  x ∈ B)   且   (x ∈ A  或  x ∈ C)<span class='tag'>∪ 的定义</span>"]]},

{"say": "情形一：设 x 属于 A。这是一个假设。那么显然，由并集的定义，x 属于 A 并，B 交 C，证毕。", "L": [["hyp", "情形：  x ∈ A<span class='tag'>情形假设</span>"], ["res", "x ∈ A ∪ (B ∩ C)<span class='tag'>∪ 的定义：证毕</span>"]]},

{"say": "情形二：因此设 x 不属于 A。这是一个假设。在这个假设下，由前面的条件可以推出以下结论。", "L": [["hyp", "情形：  x ∉ A<span class='tag'>情形假设</span>"]]},

{"say": "由 x 属于 A 并 B，且 x 不属于 A，可得 x 属于 B。", "L": [["sub", "x ∈ A ∪ B   且   x ∉ A   ⟹   x ∈ B<span class='tag'>若 x ∈ A 或 x ∈ B，且 x ∉ A，则 x ∈ B</span>"]]},

{"say": "由 x 属于 A 并 C，且 x 不属于 A，可得 x 属于 C。", "L": [["sub", "x ∈ A ∪ C   且   x ∉ A   ⟹   x ∈ C<span class='tag'>若 x ∈ A 或 x ∈ C，且 x ∉ A，则 x ∈ C</span>"]]},

{"say": "因此，x 属于 B，并且 x 属于 C。也就是说，由交集的定义，x 属于 B 交 C。", "L": [["sub", "x ∈ B   且   x ∈ C   ⟹   x ∈ B ∩ C<span class='tag'>∩ 的定义</span>"]]},

{"say": "于是，由并集的定义，x 属于 A 并，B 交 C。", "L": [["res", "x ∈ A ∪ (B ∩ C)<span class='tag'>∪ 的定义</span>"]]},

{"say": "我们证明了在所有情形下 x 都属于 A 并，B 交 C。所以，A 并 B，交，A 并 C，包含于，A 并，B 交 C。", "L": [["res", "(A ∪ B) ∩ (A ∪ C) ⊆ A ∪ (B ∩ C)   ∎<span class='tag'>所有情形都成立</span>"]]},

{"title": "第二分配律", "clear": 1, "say": "由第一部分和第二部分，用双向包含，得到等式：A 并，B 交 C，等于，A 并 B，交，A 并 C。也就是说，并对交满足分配律。", "L": [["res", "A ∪ (B ∩ C) = (A ∪ B) ∩ (A ∪ C)   ∎<span class='tag'>双向包含：并对交满足分配律</span>"]]},

{"title": "结论", "clear": 1, "say": "由于在 U 的幂集上，连同并集与交集，两条分配律都成立，我们得出结论：它是一个分配格。感谢观看。", "L": [["res", "A ∩ (B ∪ C) = (A ∩ B) ∪ (A ∩ C)<span class='tag'>交对并满足分配律</span>"], ["res", "A ∪ (B ∩ C) = (A ∪ B) ∩ (A ∪ C)<span class='tag'>并对交满足分配律</span>"], ["res", "(𝒫(U), ∪, ∩) 是一个分配格   ∎"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' 加 ').replace(/⊙/g,' 乘 ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ 重播'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ 继续'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ 暂停';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ 暂停';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ 暂停';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^zh/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/yunyang|yunxi|yunjian|kangkang|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="𝒫(U) 是分配格";$('sub').textContent="练习 · 集合代数";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
