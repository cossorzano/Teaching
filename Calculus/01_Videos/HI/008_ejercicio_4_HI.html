<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>दो क्रम जो एक ही हैं</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(15px,1.9vw,24px)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
sub{font-size:.6em}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>याद रखें</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ शुरू करें</button><button id="next">▶|</button>
<select id="voice"></select>
<label>गति <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">रिकॉर्डिंग मोड (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">

"meta":{"nivel": 2, "titulo": "दो क्रम जो एक ही हैं", "enunciado": "मान लीजिए (B, ⊕, ⊙) एक जालक है। हम परिभाषित करते हैं  x ≤⊕ y ⇔ x ⊕ y = y  और  x ≤⊙ y ⇔ x ⊙ y = x।  सिद्ध कीजिए कि किन्हीं भी x, y ∈ B के लिए:", "tesis": "x ≤⊕ y  ⇔  x ≤⊙ y", "datos": ["(क्रम ⊕)  x ⊕ y = y ⊕ x", "(क्रम ⊙)  x ⊙ y = y ⊙ x", "(Abs1)  x ⊕ (x ⊙ y) = x", "(Abs2)  x ⊙ (x ⊕ y) = x"]},
"steps":[
{"title": "दो क्रम जो एक ही हैं", "sub": "अभ्यास · बीजीय जालक", "clear": 1, "say": "नमस्ते। इस वीडियो में हम बीजीय जालकों पर एक अभ्यास हल करेंगे। हम बहुत धीरे-धीरे चलेंगे, हर समीकरण लिखेंगे और हर कदम का कारण बताएँगे।", "L": [["txt", "जालक पर क्रम परिभाषित करने के दो तरीके: क्या वे एक ही हैं?"]]},

{"say": "पहले, दी गई बातें। B एक समुच्चय है जिस पर दो संक्रियाएँ हैं, जालक योग और जालक गुणन, और यह एक जालक है। यानी दोनों संक्रियाएँ आंतरिक, क्रमविनिमेय, साहचर्य हैं, और अवशोषण नियमों का पालन करती हैं।", "L": [["hyp", "(B, ⊕, ⊙) जालक<span class='tag'>परिकल्पना</span>"]]},

{"say": "इस अभ्यास में हम चार गुणों का उपयोग करेंगे। योग की क्रमविनिमेयता: x प्लस y, y प्लस x है। गुणन की क्रमविनिमेयता: x गुणा y, y गुणा x है। पहला अवशोषण नियम: x प्लस, x गुणा y, बराबर है x के। और दूसरा: x गुणा, x प्लस y, बराबर है x के। इन्हें हम बाईं ओर लगा देते हैं, क्योंकि इनका उपयोग करना है।", "pin": ["(क्रम ⊕) x ⊕ y = y ⊕ x", "(क्रम ⊙) x ⊙ y = y ⊙ x", "(Abs1) x ⊕ (x ⊙ y) = x", "(Abs2) x ⊙ (x ⊕ y) = x"]},

{"say": "अब परिभाषाएँ। B पर हम दो संबंध परिभाषित करते हैं। पहला, जिसे हम योग के सापेक्ष छोटा या बराबर कहते हैं: x, y से छोटा या बराबर है, यदि और केवल यदि x प्लस y बराबर है y के। समुच्चयों में यह जाना-पहचाना गुण है: A, B में समाहित है, यदि और केवल यदि A सम्मिलन B बराबर है B के।", "L": [["sub", "x ≤<sub>⊕</sub> y  ⇔  x ⊕ y = y<span class='tag'>≤⊕ की परिभाषा</span>"], ["txt", "समुच्चयों के साथ:  A ⊆ B  ⇔  A ∪ B = B"]]},

{"say": "दोनों परिभाषाएँ हम बाईं ओर, पिछले गुणों के नीचे लिख लेते हैं, क्योंकि यही इस अभ्यास की कुंजी हैं।", "pin": ["(परि ⊕) x ≤<sub>⊕</sub> y ⇔ x ⊕ y = y", "(परि ⊙) x ≤<sub>⊙</sub> y ⇔ x ⊙ y = x"]},

{"say": "हमें क्या सिद्ध करना है। B के किन्हीं भी x और y के लिए, x योग के सापेक्ष y से छोटा या बराबर है, यदि और केवल यदि, x गुणन के सापेक्ष y से छोटा या बराबर है। यानी दोनों संबंध एक ही हैं। समुच्चयों में इसका अर्थ है कि A सम्मिलन B, B होता है, ठीक तभी जब A सर्वनिष्ठ B, A होता है।", "L": [["goal", "∀ x, y ∈ B:   x ≤<sub>⊕</sub> y  ⇔  x ≤<sub>⊙</sub> y<span class='tag'>साध्य</span>"], ["txt", "समुच्चयों के साथ:  A ∪ B = B  ⇔  A ∩ B = A"]]},

{"say": "क्योंकि यह एक तुल्यता है, हम इसे दो भागों में सिद्ध करते हैं। पहले दाईं ओर का निहितार्थ, और फिर बाईं ओर का निहितार्थ। मान लीजिए x और y, B के कोई भी दो अवयव हैं।", "L": [["txt", "मान लीजिए x, y ∈ B  (यादृच्छिक)"], ["goal", "(1)  x ≤<sub>⊕</sub> y  ⇒  x ≤<sub>⊙</sub> y"], ["goal", "(2)  x ≤<sub>⊙</sub> y  ⇒  x ≤<sub>⊕</sub> y"]]},

{"title": "भाग 1: ≤⊕ से ≤⊙", "clear": 1, "say": "हम पहले निहितार्थ से शुरू करते हैं। मान लेते हैं कि x योग के सापेक्ष y से छोटा या बराबर है। यह एक परिकल्पना है, और परिभाषा के अनुसार इसका अर्थ है कि x प्लस y बराबर है y के।", "L": [["hyp", "x ≤<sub>⊕</sub> y<span class='tag'>परिकल्पना</span>"], ["hyp", "x ⊕ y = y<span class='tag'>परिकल्पना, ≤⊕ की परिभाषा से</span>"]]},

{"say": "हमें सिद्ध करना है कि x गुणन के सापेक्ष y से छोटा या बराबर है। परिभाषा के अनुसार इसका अर्थ है कि x गुणा y बराबर है x के। यही समता हमें सिद्ध करनी है। हम बाएँ पक्ष, x गुणा y, से शुरू करते हैं।", "L": [["goal", "हमें चाहिए:  x ⊙ y = x<span class='tag'>साध्य, ≤⊙ की परिभाषा से</span>"], ["txt", "x ⊙ y"]]},

{"say": "दूसरा कदम। अब हमारे पास ठीक दूसरा अवशोषण नियम है, x बराबर x, और y बराबर y लेकर: x गुणा, x प्लस y, बराबर है x के। इसे चिह्नित करते हैं।", "L": [["sub", "x ⊙ y  =  <mark>x ⊙ (x ⊕ y)</mark>"], ["txt", "(Abs2) से:  <mark>x ⊙ (x ⊕ y)</mark> = x"]]},

{"say": "परिभाषा के अनुसार, इस समता का अर्थ है कि x गुणन के सापेक्ष y से छोटा या बराबर है। इसके साथ पहला निहितार्थ पूरा होता है।", "L": [["res", "x ⊙ y = x   ⟹   x ≤<sub>⊙</sub> y   ∎"]]},

{"title": "भाग 2: ≤⊙ से ≤⊕", "clear": 1, "say": "अब दूसरे निहितार्थ पर चलते हैं। अब मान लेते हैं कि x गुणन के सापेक्ष y से छोटा या बराबर है। परिभाषा के अनुसार इसका अर्थ है कि x गुणा y बराबर है x के। यह इस भाग की परिकल्पना है।", "L": [["hyp", "x ≤<sub>⊙</sub> y<span class='tag'>परिकल्पना</span>"], ["hyp", "x ⊙ y = x<span class='tag'>परिकल्पना, ≤⊙ की परिभाषा से</span>"]]},

{"say": "हमें सिद्ध करना है कि x योग के सापेक्ष y से छोटा या बराबर है। परिभाषा के अनुसार इसका अर्थ है कि x प्लस y बराबर है y के। हम बाएँ पक्ष, x प्लस y, से शुरू करते हैं।", "L": [["goal", "हमें चाहिए:  x ⊕ y = y<span class='tag'>साध्य, ≤⊕ की परिभाषा से</span>"], ["txt", "x ⊕ y"]]},

{"say": "पहला कदम। हम परिकल्पना का उपयोग करते हैं: x बराबर है x गुणा y के। बाईं ओर के x को x गुणा y से बदलते हैं, और y को वैसा ही रहने देते हैं। x प्लस y से हम, x गुणा y, प्लस y पर पहुँचते हैं।", "L": [["sub", "x ⊕ y  =  (x ⊙ y) ⊕ y<span class='tag'>प्रतिस्थापन: x = x ⊙ y  (परिकल्पना)</span>"]]},

{"say": "दूसरा कदम। व्यंजक में y दाईं ओर है, और अवशोषण के लिए उसे बाईं ओर होना चाहिए। हम योग की क्रमविनिमेयता लगाते हैं, x बराबर x गुणा y, और y बराबर y लेकर। x गुणा y, प्लस y, से हम y प्लस, x गुणा y पर पहुँचते हैं।", "L": [["sub", "x ⊕ y  =  y ⊕ (x ⊙ y)<span class='tag'>⊕ की क्रमविनिमेयता</span>"]]},

{"say": "तीसरा कदम। x बराबर y लेकर पहला अवशोषण लगाने के लिए, कोष्ठक के अंदर y गुणा x होना चाहिए, x गुणा y नहीं। हम गुणन की क्रमविनिमेयता लगाते हैं: x गुणा y बराबर है y गुणा x के।", "L": [["sub", "y ⊕ (<mark>x ⊙ y</mark>)"], ["txt", "(क्रम ⊙) से:  <mark>x ⊙ y</mark> = y ⊙ x"], ["sub", "x ⊕ y  =  y ⊕ (y ⊙ x)<span class='tag'>⊙ की क्रमविनिमेयता</span>"]]},

{"say": "चौथा कदम। अब सचमुच हमारे पास पहला अवशोषण नियम है, x बराबर y, और y बराबर x लेकर: y प्लस, y गुणा x, बराबर है y के। इसे चिह्नित करके प्रतिस्थापित करते हैं।", "L": [["sub", "x ⊕ y  =  <mark>y ⊕ (y ⊙ x)</mark>"], ["txt", "(Abs1) से, x=y, y=x लेकर:  <mark>y ⊕ (y ⊙ x)</mark> = y"], ["res", "x ⊕ y  =  y<span class='tag'>अवशोषण</span>"]]},

{"say": "परिभाषा के अनुसार, इस समता का अर्थ है कि x योग के सापेक्ष y से छोटा या बराबर है। इसके साथ दूसरा निहितार्थ पूरा होता है।", "L": [["res", "x ⊕ y = y   ⟹   x ≤<sub>⊕</sub> y   ∎"]]},

{"title": "निष्कर्ष", "clear": 1, "say": "हमने दोनों निहितार्थ सिद्ध कर दिए। इसलिए, B के किन्हीं भी x और y के लिए, x योग के सापेक्ष y से छोटा या बराबर है, यदि और केवल यदि, x गुणन के सापेक्ष y से छोटा या बराबर है। क्रम की दोनों परिभाषाएँ तुल्य हैं।", "L": [["res", "(1)  x ≤<sub>⊕</sub> y  ⇒  x ≤<sub>⊙</sub> y   ∎"], ["res", "(2)  x ≤<sub>⊙</sub> y  ⇒  x ≤<sub>⊕</sub> y   ∎"], ["res", "x ≤<sub>⊕</sub> y  ⇔  x ≤<sub>⊙</sub> y"]]},

{"title": "सारांश", "clear": 1, "say": "सारांश में। पहले निहितार्थ के लिए, हमने y को x प्लस y से बदला और दूसरा अवशोषण नियम लगाया। दूसरे के लिए, हमने x को x गुणा y से बदला, योग का क्रम बदला, गुणन का क्रम बदला, और पहला अवशोषण नियम लगाया। समुच्चयों में यह जानी-पहचानी तुल्यता है: A सम्मिलन B, B है, यदि और केवल यदि, A सर्वनिष्ठ B, A है। देखने के लिए धन्यवाद।", "L": [["res", "(1)  प्रतिस्थापन + Abs2"], ["res", "(2)  प्रतिस्थापन + क्रम ⊕ + क्रम ⊙ + Abs1"], ["txt", "समुच्चयों के साथ:  A ∪ B = B  ⇔  A ∩ B = A"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' प्लस ').replace(/⊙/g,' गुणा ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ फिर से चलाएँ'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ जारी रखें'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ रोकें';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ रोकें';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ रोकें';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^hi/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/madhur|hemant|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="दो क्रम जो एक ही हैं";$('sub').textContent="अभ्यास · बीजीय जालक";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
