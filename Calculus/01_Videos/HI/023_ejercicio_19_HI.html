<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>कार्तीय गुणनफल</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>याद रखें</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ शुरू करें</button><button id="next">▶|</button>
<select id="voice"></select>
<label>गति <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">रिकॉर्डिंग मोड (H)</button><span id="cap"></span></div></div>

{"lang":"hi-IN",
"meta":{"nivel": 1, "titulo": "कार्तीय गुणनफल", "enunciado": "मान लीजिए A = (0, 2] और B = [−1, 1]। (a) कार्तीय गुणनफल A × B और B × A की गणना और वर्णन कीजिए। (b) सिद्ध कीजिए कि:", "tesis": "A × B ≠ B × A", "datos": ["A = (0, 2] = { x ∈ ℝ | 0 < x ≤ 2 }", "B = [−1, 1] = { x ∈ ℝ | −1 ≤ x ≤ 1 }"], "figura": "ultima"},
"steps":[
{"title": "कार्तीय गुणनफल", "sub": "अभ्यास · समुच्चयों का बीजगणित", "clear": 1, "say": "नमस्ते। इस वीडियो में हम अंतरालों के दो कार्तीय गुणनफल निकालेंगे, और सिद्ध करेंगे कि वे बराबर नहीं हैं। हम बहुत धीरे चलेंगे, हर समीकरण लिखेंगे और हर चरण का कारण बताएँगे।", "L": [["txt", "दो अंतरालों के कार्तीय गुणनफल A × B और B × A"]]},

{"say": "दी गई जानकारी। A वह अंतराल है जो बाईं ओर शून्य पर खुला है, और दाईं ओर दो पर बंद है: वे वास्तविक संख्याएँ x, जिनके लिए x शून्य से बड़ा है, और दो से छोटा या बराबर है। B ऋण एक से एक तक का बंद अंतराल है: वे वास्तविक संख्याएँ x, जिनके लिए x ऋण एक से बड़ा या बराबर है, और एक से छोटा या बराबर है।", "L": [["hyp", "A = (0, 2] = { x ∈ ℝ | 0 &lt; x ≤ 2 }<span class='tag'>दिया गया</span>"], ["hyp", "B = [−1, 1] = { x ∈ ℝ | −1 ≤ x ≤ 1 }<span class='tag'>दिया गया</span>"]]},

{"clear": 1, "say": "हम क्या करना चाहते हैं। पहला, भाग a: कार्तीय गुणनफल A क्रॉस B, और B क्रॉस A की गणना और वर्णन करना। दूसरा, भाग b: सिद्ध करना कि A क्रॉस B, B क्रॉस A से भिन्न है। बाईं ओर हम कार्तीय गुणनफल की परिभाषा याद करते हैं, और यह कि दो समुच्चय भिन्न कैसे सिद्ध किए जाते हैं: एक ऐसा बिंदु ढूँढना काफ़ी है जो एक में हो और दूसरे में नहीं।", "L": [["goal", "(a)  A × B  और  B × A  की गणना और वर्णन करें"], ["goal", "(b)  सिद्ध करें कि  A × B ≠ B × A"]], "pin": ["(× परिभाषा) X × Y = { (x, y) ∈ ℝ² | x ∈ X  और  y ∈ Y }", "(≠ परिभाषा) X ≠ Y  ⟸  कोई बिंदु है जो दोनों में से एक में है और दूसरे में नहीं"]},

{"title": "a) A × B की गणना", "clear": 1, "say": "भाग a। हम A क्रॉस B से शुरू करते हैं। कार्तीय गुणनफल की परिभाषा के अनुसार, A क्रॉस B समतल के उन बिंदुओं x, y का समुच्चय है, जिनके लिए x, A में है, और y, B में है।", "L": [["sub", "A × B = { (x, y) ∈ ℝ² | x ∈ A,  y ∈ B }<span class='tag'>कार्तीय गुणनफल की परिभाषा</span>"]]},

{"say": "हम A और B के स्थान पर दिए गए अंतराल रखते हैं। x का A में होना, इसका अर्थ है कि x शून्य से बड़ा है और दो से छोटा या बराबर है। और y का B में होना, इसका अर्थ है कि y ऋण एक से बड़ा या बराबर है, और एक से छोटा या बराबर है।", "L": [["txt", "x ∈ A  ⟺  0 &lt; x ≤ 2          y ∈ B  ⟺  −1 ≤ y ≤ 1"], ["res", "A × B = { (x, y) ∈ ℝ² | 0 &lt; x ≤ 2,  −1 ≤ y ≤ 1 }"]]},

{"title": "a) B × A की गणना", "clear": 1, "say": "अब B क्रॉस A। परिभाषा के अनुसार, B क्रॉस A समतल के उन बिंदुओं x, y का समुच्चय है, जिनके लिए x, B में है, और y, A में है।", "L": [["sub", "B × A = { (x, y) ∈ ℝ² | x ∈ B,  y ∈ A }<span class='tag'>कार्तीय गुणनफल की परिभाषा</span>"]]},

{"say": "हम रखते हैं। अब भूमिकाएँ बदल गई हैं। x का B में होना, इसका अर्थ है कि x ऋण एक से बड़ा या बराबर है, और एक से छोटा या बराबर है। और y का A में होना, इसका अर्थ है कि y शून्य से बड़ा है, और दो से छोटा या बराबर है।", "L": [["txt", "x ∈ B  ⟺  −1 ≤ x ≤ 1          y ∈ A  ⟺  0 &lt; y ≤ 2"], ["res", "B × A = { (x, y) ∈ ℝ² | −1 ≤ x ≤ 1,  0 &lt; y ≤ 2 }"]]},

{"say": "हम इस समुच्चय का वर्णन करते हैं। यह भी भुजा दो का एक वर्ग है। x निर्देशांक ऋण एक से एक तक जाता है, और y निर्देशांक शून्य से दो तक। अब नीचे की भुजा, जहाँ y शून्य है, शामिल नहीं है, और बाकी तीन भुजाएँ शामिल हैं। हम दोनों वर्गों को साथ देखते हैं: वे भिन्न हैं, क्योंकि वे समतल में एक ही जगह नहीं घेरते।", "L": [["txt", "यह भुजा 2 का वर्ग है:  x, −1 और 1 के बीच,  y, 0 और 2 के बीच"], ["txt", "भुजा y = 0: शामिल नहीं।  बाकी तीन भुजाएँ: शामिल।"], ["txt", "<svg viewBox='0 0 380 380' width='100%' style='max-width:340px;display:block' xmlns='http://www.w3.org/2000/svg' font-family='Georgia,serif'><rect x='157.5' y='147.5' width='170' height='170' fill='#7cc4ff' fill-opacity='.22' stroke='none'/><line x1='157.5' y1='317.5' x2='157.5' y2='147.5' stroke='#7cc4ff' stroke-width='3' stroke-dasharray='6 5'/><line x1='327.5' y1='317.5' x2='327.5' y2='147.5' stroke='#7cc4ff' stroke-width='3'/><line x1='157.5' y1='317.5' x2='327.5' y2='317.5' stroke='#7cc4ff' stroke-width='3'/><line x1='157.5' y1='147.5' x2='327.5' y2='147.5' stroke='#7cc4ff' stroke-width='3'/><rect x='72.5' y='62.5' width='170' height='170' fill='#ffd166' fill-opacity='.22' stroke='none'/><line x1='72.5' y1='232.5' x2='72.5' y2='62.5' stroke='#ffd166' stroke-width='3'/><line x1='242.5' y1='232.5' x2='242.5' y2='62.5' stroke='#ffd166' stroke-width='3'/><line x1='72.5' y1='232.5' x2='242.5' y2='232.5' stroke='#ffd166' stroke-width='3' stroke-dasharray='6 5'/><line x1='72.5' y1='62.5' x2='242.5' y2='62.5' stroke='#ffd166' stroke-width='3'/><line x1='10' y1='232.5' x2='370' y2='232.5' stroke='#9fb3aa'/><line x1='157.5' y1='10' x2='157.5' y2='370' stroke='#9fb3aa'/><text x='72.5' y='248.5' fill='#9fb3aa' font-size='14' text-anchor='middle'>-1</text><text x='149.5' y='322.5' fill='#9fb3aa' font-size='14' text-anchor='end'>-1</text><text x='242.5' y='248.5' fill='#9fb3aa' font-size='14' text-anchor='middle'>1</text><text x='149.5' y='152.5' fill='#9fb3aa' font-size='14' text-anchor='end'>1</text><text x='327.5' y='248.5' fill='#9fb3aa' font-size='14' text-anchor='middle'>2</text><text x='149.5' y='67.5' fill='#9fb3aa' font-size='14' text-anchor='end'>2</text><text x='362' y='226' fill='#9fb3aa' font-size='15'>x</text><text x='165' y='22' fill='#9fb3aa' font-size='15'>y</text><text x='242.5' y='283.5' fill='#7cc4ff' font-size='20' text-anchor='middle'>A×B</text><text x='157.5' y='100.75' fill='#ffd166' font-size='20' text-anchor='middle'>B×A</text></svg>"]]},

{"title": "b) A × B ≠ B × A", "clear": 1, "say": "भाग b। हम सिद्ध करना चाहते हैं कि A क्रॉस B, B क्रॉस A से भिन्न है। एक ऐसा बिंदु ढूँढना काफ़ी है जो एक समुच्चय में हो और दूसरे में नहीं। हम बिंदु दो, शून्य चुनते हैं।", "L": [["goal", "सिद्ध करें:  A × B ≠ B × A"], ["txt", "एक ऐसा बिंदु काफ़ी है जो एक में हो और दूसरे में नहीं।"], ["hyp", "हम बिंदु चुनते हैं  (2, 0)"]]},

{"say": "पहले, देखते हैं कि दो, शून्य, A क्रॉस B में है। कार्तीय गुणनफल की परिभाषा के अनुसार, जाँचना है कि पहला निर्देशांक, दो, A में है, और दूसरा, शून्य, B में है। दो, A में है, क्योंकि शून्य दो से छोटा है, और दो, दो से छोटा या बराबर है। और शून्य, B में है, क्योंकि ऋण एक शून्य से छोटा या बराबर है, और शून्य एक से छोटा या बराबर है।", "L": [["txt", "(2, 0) ∈ A × B ?   जाँचना है:  2 ∈ A  और  0 ∈ B"], ["sub", "2 ∈ A  क्योंकि  0 &lt; 2 ≤ 2"], ["sub", "0 ∈ B  क्योंकि  −1 ≤ 0 ≤ 1"], ["res", "(2, 0) ∈ A × B"]]},

<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' प्लस ').replace(/⊙/g,' गुणा ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ फिर से चलाएँ'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ जारी रखें'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ रोकें';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ रोकें';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ रोकें';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^hi/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/madhur|hemant|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="कार्तीय गुणनफल";$('sub').textContent="अभ्यास · समुच्चयों का बीजगणित";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
