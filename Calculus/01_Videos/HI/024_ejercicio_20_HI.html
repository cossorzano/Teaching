<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>सममित अंतर</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>याद रखें</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ शुरू करें</button><button id="next">▶|</button>
<select id="voice"></select>
<label>गति <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">रिकॉर्डिंग मोड (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"hi-IN",
"meta":{"nivel": 2, "titulo": "सममित अंतर", "enunciado": "सिद्ध कीजिए कि किन्हीं भी समुच्चयों A और B के लिए:", "tesis": "A △ B = (A ∪ B) ∖ (A ∩ B)", "datos": ["(△ परिभाषा)  A △ B = (A ∖ B) ∪ (B ∖ A)"]},
"steps":[
{"title": "सममित अंतर", "sub": "अभ्यास · समुच्चयों का बीजगणित", "clear": 1, "say": "नमस्ते। इस वीडियो में हम सिद्ध करेंगे कि दो समुच्चयों का सममित अंतर, सम्मिलन ऋण सर्वनिष्ठ के रूप में लिखा जा सकता है। हम अवयव दर अवयव तर्क करेंगे, बहुत धीरे, हर समीकरण लिखेंगे और हर चरण का कारण बताएँगे।", "L": [["txt", "सिद्ध करें कि  A △ B = (A ∪ B) ∖ (A ∩ B)"]]},

{"say": "हम क्या सिद्ध करना चाहते हैं। किन्हीं भी समुच्चयों A और B के लिए, A सममित अंतर B, A और B के सम्मिलन ऋण A और B के सर्वनिष्ठ के बराबर है। बाईं ओर हम वे परिभाषाएँ याद करते हैं जिनका हम उपयोग करेंगे: सममित अंतर, A ऋण B और B ऋण A का सम्मिलन है; अवयवों के द्वारा अंतर, सम्मिलन और सर्वनिष्ठ; और यह कि दो समुच्चय बराबर होते हैं जब हर एक दूसरे में अंतर्विष्ट हो।", "L": [["goal", "A △ B = (A ∪ B) ∖ (A ∩ B)<span class='tag'>किन्हीं भी A और B के लिए सिद्ध करें</span>"]], "pin": ["(△ परिभाषा) A △ B = (A ∖ B) ∪ (B ∖ A)", "(∖ परिभाषा) x ∈ X ∖ Y  ⟺  x ∈ X  और  x ∉ Y", "(∪ परिभाषा) x ∈ X ∪ Y  ⟺  x ∈ X  या  x ∈ Y", "(∩ परिभाषा) x ∈ X ∩ Y  ⟺  x ∈ X  और  x ∈ Y", "(⊆ परिभाषा) X ⊆ Y  ⟺  हर x ∈ X के लिए x ∈ Y", "(= परिभाषा) X = Y  ⟺  X ⊆ Y  और  Y ⊆ X"]},

{"title": "योजना: दोहरी अंतर्विष्टि", "clear": 1, "say": "हम अवयव दर अवयव तर्क करेंगे। समता की परिभाषा के अनुसार, हमें दो अंतर्विष्टियाँ सिद्ध करनी हैं। पहली, A सममित अंतर B, सम्मिलन ऋण सर्वनिष्ठ में अंतर्विष्ट है। दूसरी, सम्मिलन ऋण सर्वनिष्ठ, A सममित अंतर B में अंतर्विष्ट है।", "L": [["goal", "(1)  A △ B ⊆ (A ∪ B) ∖ (A ∩ B)"], ["goal", "(2)  (A ∪ B) ∖ (A ∩ B) ⊆ A △ B"]]},

{"title": "(1) A △ B ⊆ (A ∪ B) ∖ (A ∩ B)", "clear": 1, "say": "पहली अंतर्विष्टि। अंतर्विष्टि की परिभाषा के अनुसार, हम A सममित अंतर B का कोई भी अवयव x लेते हैं, और हमें सिद्ध करना है कि वह सम्मिलन ऋण सर्वनिष्ठ में है।", "L": [["hyp", "मान लीजिए x ∈ A △ B"], ["goal", "हमें चाहिए:  x ∈ (A ∪ B) ∖ (A ∩ B)"]]},

{"say": "सममित अंतर की परिभाषा के अनुसार, x, A ऋण B और B ऋण A के सम्मिलन में है। और सम्मिलन की परिभाषा के अनुसार, इसका अर्थ है कि x, A ऋण B में है, या x, B ऋण A में है। अतः, दो संभावनाओं में से कम से कम एक सत्य है, जिनका हम अलग अलग अध्ययन करते हैं।", "L": [["txt", "(△ परिभाषा) से:"], ["sub", "x ∈ (A ∖ B) ∪ (B ∖ A)"], ["txt", "(∪ परिभाषा) से:"], ["hyp", "स्थिति (i):  x ∈ A ∖ B"], ["hyp", "स्थिति (ii):  x ∈ B ∖ A"]]},

{"clear": 1, "say": "स्थिति एक: x, A ऋण B में है। अंतर की परिभाषा के अनुसार, इसका अर्थ है कि x, A में है, और x, B में नहीं है।", "L": [["hyp", "स्थिति (i):  x ∈ A ∖ B"], ["txt", "(∖ परिभाषा) से:"], ["sub", "x ∈ A   और   x ∉ B"]]},

{"say": "चूँकि x, A में है, विशेष रूप से x, A में है, या x, B में है। सम्मिलन की परिभाषा के अनुसार, x, A और B के सम्मिलन में है।", "L": [["txt", "x ∈ A  ⟹  x ∈ A  या  x ∈ B,  अतः (∪ परिभाषा) से:"], ["res", "x ∈ A ∪ B"]]},

{"say": "साथ ही, चूँकि x, B में नहीं है, ऐसा नहीं हो सकता कि x एक साथ A में और B में हो। सर्वनिष्ठ की परिभाषा के अनुसार, x, A और B के सर्वनिष्ठ में नहीं है।", "L": [["txt", "x ∉ B  ⟹  यह सत्य नहीं कि  x ∈ A  और  x ∈ B,  अतः (∩ परिभाषा) से:"], ["res", "x ∉ A ∩ B"]]},

{"say": "तो x सम्मिलन में है, और x सर्वनिष्ठ में नहीं है। अंतर की परिभाषा के अनुसार, X बराबर A सम्मिलन B, और Y बराबर A सर्वनिष्ठ B लेकर, x सम्मिलन ऋण सर्वनिष्ठ में है।", "L": [["txt", "x ∈ A ∪ B   और   x ∉ A ∩ B,  अतः (∖ परिभाषा) से:"], ["res", "x ∈ (A ∪ B) ∖ (A ∩ B)"]]},

{"clear": 1, "say": "स्थिति दो: x, B ऋण A में है। अंतर की परिभाषा के अनुसार, इसका अर्थ है कि x, B में है, और x, A में नहीं है।", "L": [["hyp", "स्थिति (ii):  x ∈ B ∖ A"], ["txt", "(∖ परिभाषा) से:"], ["sub", "x ∈ B   और   x ∉ A"]]},

{"say": "चूँकि x, B में है, विशेष रूप से x, A में है, या x, B में है। सम्मिलन की परिभाषा के अनुसार, x, A और B के सम्मिलन में है।", "L": [["txt", "x ∈ B  ⟹  x ∈ A  या  x ∈ B,  अतः (∪ परिभाषा) से:"], ["res", "x ∈ A ∪ B"]]},

{"say": "साथ ही, चूँकि x, A में नहीं है, ऐसा नहीं हो सकता कि x एक साथ A में और B में हो। सर्वनिष्ठ की परिभाषा के अनुसार, x, A और B के सर्वनिष्ठ में नहीं है।", "L": [["txt", "x ∉ A  ⟹  यह सत्य नहीं कि  x ∈ A  और  x ∈ B,  अतः (∩ परिभाषा) से:"], ["res", "x ∉ A ∩ B"]]},

{"say": "तो x सम्मिलन में है, और x सर्वनिष्ठ में नहीं है। अंतर की परिभाषा के अनुसार, x सम्मिलन ऋण सर्वनिष्ठ में है।", "L": [["txt", "x ∈ A ∪ B   और   x ∉ A ∩ B,  अतः (∖ परिभाषा) से:"], ["res", "x ∈ (A ∪ B) ∖ (A ∩ B)"]]},

{"clear": 1, "say": "दोनों स्थितियों में, x सम्मिलन ऋण सर्वनिष्ठ में है। चूँकि x, A सममित अंतर B का कोई भी अवयव था, पहली अंतर्विष्टि सिद्ध हुई।", "L": [["txt", "दोनों स्थितियों में  x ∈ (A ∪ B) ∖ (A ∩ B),  अतः:"], ["res", "A △ B ⊆ (A ∪ B) ∖ (A ∩ B)"]]},

{"title": "(2) (A ∪ B) ∖ (A ∩ B) ⊆ A △ B", "clear": 1, "say": "दूसरी अंतर्विष्टि। हम सम्मिलन ऋण सर्वनिष्ठ का कोई भी अवयव x लेते हैं, और हमें सिद्ध करना है कि वह A सममित अंतर B में है।", "L": [["hyp", "मान लीजिए x ∈ (A ∪ B) ∖ (A ∩ B)"], ["goal", "हमें चाहिए:  x ∈ A △ B"]]},

{"say": "अंतर की परिभाषा के अनुसार, x, A और B के सम्मिलन में है, और x, A और B के सर्वनिष्ठ में नहीं है।", "L": [["txt", "(∖ परिभाषा) से:"], ["sub", "x ∈ A ∪ B   और   x ∉ A ∩ B"]]},

{"say": "पहली शर्त, सम्मिलन की परिभाषा के अनुसार, कहती है कि x, A में है, या x, B में है। दूसरी शर्त, सर्वनिष्ठ की परिभाषा के अनुसार, कहती है कि यह सत्य नहीं कि x एक साथ A में और B में हो।", "L": [["txt", "(∪ परिभाषा) से:  x ∈ A ∪ B  का अर्थ है"], ["sub", "x ∈ A   या   x ∈ B"], ["txt", "(∩ परिभाषा) से:  x ∉ A ∩ B  का अर्थ है"], ["sub", "नहीं (x ∈ A  और  x ∈ B)"]]},

{"clear": 1, "say": "दोनों शर्तों को मिलाकर, दो संभावनाओं में से ठीक एक घटित होती है। यदि x, A में है, तो चूँकि वह एक साथ A में और B में नहीं हो सकता, x, B में नहीं है। और यदि x, B में है, तो इसी कारण से, x, A में नहीं है। हम दोनों स्थितियों का अलग अलग अध्ययन करते हैं।", "L": [["hyp", "स्थिति (i):  x ∈ A   और   x ∉ B"], ["hyp", "स्थिति (ii):  x ∈ B   और   x ∉ A"]]},

{"clear": 1, "say": "स्थिति एक: x, A में है, और x, B में नहीं है। अंतर की परिभाषा के अनुसार, x, A ऋण B में है। और सम्मिलन की परिभाषा के अनुसार, X बराबर A ऋण B लेकर, x, A ऋण B और B ऋण A के सम्मिलन में है, जो परिभाषा से A सममित अंतर B है।", "L": [["hyp", "स्थिति (i):  x ∈ A   और   x ∉ B"], ["txt", "(∖ परिभाषा) से:"], ["sub", "x ∈ A ∖ B"], ["txt", "(∪ परिभाषा) और (△ परिभाषा) से:"], ["res", "x ∈ (A ∖ B) ∪ (B ∖ A) = A △ B"]]},

{"clear": 1, "say": "स्थिति दो: x, B में है, और x, A में नहीं है। अंतर की परिभाषा के अनुसार, x, B ऋण A में है। और सम्मिलन की परिभाषा के अनुसार, x, A ऋण B और B ऋण A के सम्मिलन में है, जो परिभाषा से A सममित अंतर B है।", "L": [["hyp", "स्थिति (ii):  x ∈ B   और   x ∉ A"], ["txt", "(∖ परिभाषा) से:"], ["sub", "x ∈ B ∖ A"], ["txt", "(∪ परिभाषा) और (△ परिभाषा) से:"], ["res", "x ∈ (A ∖ B) ∪ (B ∖ A) = A △ B"]]},

{"clear": 1, "say": "दोनों स्थितियों में, x, A सममित अंतर B में है। चूँकि x सम्मिलन ऋण सर्वनिष्ठ का कोई भी अवयव था, दूसरी अंतर्विष्टि सिद्ध हुई।", "L": [["txt", "दोनों स्थितियों में  x ∈ A △ B,  अतः:"], ["res", "(A ∪ B) ∖ (A ∩ B) ⊆ A △ B"]]},

{"title": "निष्कर्ष", "clear": 1, "say": "निष्कर्ष। चूँकि दोनों अंतर्विष्टियाँ सत्य हैं, समता की परिभाषा के अनुसार, A सममित अंतर B, A और B के सम्मिलन ऋण A और B के सर्वनिष्ठ के बराबर है। देखने के लिए धन्यवाद।", "L": [["txt", "(1)  A △ B ⊆ (A ∪ B) ∖ (A ∩ B)"], ["txt", "(2)  (A ∪ B) ∖ (A ∩ B) ⊆ A △ B"], ["res", "A △ B = (A ∪ B) ∖ (A ∩ B)"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' प्लस ').replace(/⊙/g,' गुणा ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ फिर से चलाएँ'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ जारी रखें'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ रोकें';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ रोकें';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ रोकें';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^hi/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/madhur|hemant|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
