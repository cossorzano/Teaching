<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>जालक में क्रम</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(15px,1.9vw,24px)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>याद रखें</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ शुरू करें</button><button id="next">▶|</button>
<select id="voice"></select>
<label>गति <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">रिकॉर्डिंग मोड (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"hi-IN",
"meta":{"nivel": 2, "titulo": "जालक में क्रम", "enunciado": "मान लीजिए (B, ⊕, ⊙) एक जालक है। B पर संबंध  x ≤ y ⇔ x ⊕ y = y  परिभाषित करें। सिद्ध कीजिए कि किन्हीं भी a, b ∈ B के लिए:", "tesis": "a ≤ a ⊕ b,   b ≤ a ⊕ b", "datos": ["(क्रम)  x ⊕ y = y ⊕ x", "(साह)  x ⊕ (y ⊕ z) = (x ⊕ y) ⊕ z", "(वर्ग)  x ⊕ x = x"]},
"steps":[
{"title": "जालक में क्रम", "sub": "अभ्यास · बीजीय जालक", "clear": 1, "say": "नमस्ते। इस वीडियो में हम बीजीय जालकों पर एक अभ्यास हल करेंगे। हम बहुत धीरे-धीरे चलेंगे, हर समीकरण लिखेंगे और हर कदम का कारण बताएँगे।", "L": [["txt", "जालक के योग से परिभाषित एक क्रम संबंध"]]},

{"say": "पहले, दी गई बातें। B एक समुच्चय है जिस पर दो संक्रियाएँ हैं, जालक योग और जालक गुणनफल, और B एक जालक है। अर्थात्, दोनों संक्रियाएँ संवृत, क्रमविनिमेय और साहचर्य हैं, और अवशोषण नियमों को संतुष्ट करती हैं।", "L": [["hyp", "(B, ⊕, ⊙) जालक<span class='tag'>परिकल्पना</span>"]]},

{"say": "इस अभ्यास में हम योग के केवल तीन गुणों का उपयोग करेंगे। क्रमविनिमेयता: a प्लस b, b प्लस a है। साहचर्यता: a प्लस, b प्लस c, बराबर है, a प्लस b, प्लस c के। और वर्गसमता, जो जालकों का एक प्रमेय है: a प्लस a, a है। इन्हें हम बाईं ओर लगा देते हैं, क्योंकि इनका उपयोग करना है।", "pin": ["(क्रम) x ⊕ y = y ⊕ x", "(साह) x ⊕ (y ⊕ z) = (x ⊕ y) ⊕ z", "(वर्ग) x ⊕ x = x"]},

{"say": "अब परिभाषा। B पर हम एक संबंध, छोटा या बराबर, इस प्रकार परिभाषित करते हैं। x, y से छोटा या बराबर है, यदि और केवल यदि x प्लस y बराबर है y के। यह एक परिभाषा है: छोटा या बराबर का अर्थ, परिभाषा से, यह है कि x को y में जोड़ने पर y मिलता है। समुच्चयों में यह जाना-पहचाना गुण है: A, B में समाहित है, यदि और केवल यदि A सम्मिलन B बराबर है B के।", "L": [["sub", "x ≤ y  ⇔  x ⊕ y = y<span class='tag'>≤ की परिभाषा</span>"], ["txt", "समुच्चयों के साथ उदाहरण:  A ⊆ B  ⇔  A ∪ B = B"]]},

{"say": "परिभाषा को भी हम बाईं ओर, पिछले गुणों के नीचे लिख लेते हैं, क्योंकि यही इस अभ्यास की कुंजी है। ध्यान दीजिए कि बाएँ स्तंभ में यह उभरी हुई दिखती है।", "pin": ["(परि) x ≤ y ⇔ x ⊕ y = y"]},

{"say": "हमें क्या सिद्ध करना है। B के किन्हीं भी a और b के लिए दो बातें सत्य हैं: a, a प्लस b से छोटा या बराबर है, और b, a प्लस b से छोटा या बराबर है।", "L": [["goal", "∀ a, b ∈ B:   a ≤ a ⊕ b   और   b ≤ a ⊕ b<span class='tag'>साध्य</span>"]]},

{"title": "भाग 1: a ≤ a ⊕ b", "clear": 1, "say": "पहले वाले से शुरू करते हैं। मान लीजिए a और b, B के कोई भी दो अवयव हैं। हमें सिद्ध करना है कि a, a प्लस b से छोटा या बराबर है।", "L": [["txt", "मान लें a, b ∈ B  (स्वेच्छ)"], ["goal", "हमें चाहिए:  a ≤ a ⊕ b<span class='tag'>इस भाग का साध्य</span>"]]},

{"say": "परिभाषा याद करें: x, y से छोटा या बराबर है, यदि और केवल यदि x प्लस y बराबर है y के।", "L": [["hyp", "x ≤ y  ⇔  x ⊕ y = y<span class='tag'>परिभाषा</span>"]]},

{"say": "हम परिभाषा को x बराबर a, और y बराबर a प्लस b लेकर लगाते हैं। यह मान्य है, क्योंकि योग संवृत है, इसलिए a प्लस b, B में है।", "L": [["sub", "x = a,   y = a ⊕ b  ∈ B<span class='tag'>चयन (⊕ संवृत है)</span>"]]},

{"say": "प्रतिस्थापन करने पर, a, a प्लस b से छोटा या बराबर है, यदि और केवल यदि a प्लस, a प्लस b, बराबर है a प्लस b के।", "L": [["sub", "a ≤ a ⊕ b  ⇔  a ⊕ (a ⊕ b) = a ⊕ b<span class='tag'>परिभाषा, x=a, y=a⊕b लेकर</span>"]]},

{"say": "इसलिए दाईं ओर की समिका सिद्ध करना पर्याप्त है: a प्लस, a प्लस b, बराबर है a प्लस b के। अब यह असमिका नहीं, बल्कि एक समिका है, जिसे हम योग के गुणों से सिद्ध कर सकते हैं।", "L": [["goal", "सिद्ध करना पर्याप्त है:  a ⊕ (a ⊕ b) = a ⊕ b<span class='tag'>नया साध्य</span>"]]},

{"say": "हम बाएँ पक्ष, a प्लस, a प्लस b, से शुरू करते हैं, और उसे कदम दर कदम बदलते हैं जब तक दायाँ पक्ष न मिल जाए।", "L": [["txt", "a ⊕ (a ⊕ b)"]]},

{"say": "पहला कदम। हम योग की साहचर्यता लगाते हैं, x बराबर a, y बराबर a, और z बराबर b लेकर। कोष्ठक बदलते हैं: a प्लस, a प्लस b, बन जाता है a प्लस a, प्लस b।", "L": [["sub", "a ⊕ (a ⊕ b)  =  (a ⊕ a) ⊕ b<span class='tag'>⊕ की साहचर्यता, x=a, y=a, z=b लेकर</span>"]]},

{"say": "दूसरा कदम। कोष्ठक के भीतर a प्लस a है। वर्गसमता से, a प्लस a बराबर है a के। इसे चिह्नित करते हैं।", "L": [["sub", "a ⊕ (a ⊕ b)  =  (<mark>a ⊕ a</mark>) ⊕ b"], ["txt", "(वर्ग) से:  <mark>a ⊕ a</mark> = a"]]},

{"say": "उस भाग की जगह a रखते हैं। हमें a प्लस b मिलता है।", "L": [["sub", "(<mark>a</mark>) ⊕ b"], ["res", "a ⊕ (a ⊕ b)  =  a ⊕ b<span class='tag'>⊕ की वर्गसमता</span>"]]},

{"say": "हमने समिका सिद्ध कर दी। पहले देखी गई तुल्यता से, इस समिका का ठीक यही अर्थ है कि a, a प्लस b से छोटा या बराबर है। इसके साथ पहला भाग पूरा होता है।", "L": [["res", "a ⊕ (a ⊕ b) = a ⊕ b   ⟹   a ≤ a ⊕ b   ∎"]]},

{"title": "भाग 2: b ≤ a ⊕ b", "clear": 1, "say": "अब दूसरा भाग। उन्हीं स्वेच्छ a और b के साथ, हमें सिद्ध करना है कि b, a प्लस b से छोटा या बराबर है। तरीका वही है, पर यहाँ एक अतिरिक्त कदम आएगा, क्योंकि b पहले स्थान पर नहीं है।", "L": [["txt", "मान लें a, b ∈ B  (स्वेच्छ)"], ["goal", "हमें चाहिए:  b ≤ a ⊕ b<span class='tag'>इस भाग का साध्य</span>"]]},

{"say": "हम परिभाषा को x बराबर b, और y बराबर a प्लस b लेकर लगाते हैं, जो फिर से B में है क्योंकि योग संवृत है।", "L": [["sub", "x = b,   y = a ⊕ b  ∈ B<span class='tag'>चयन (⊕ संवृत है)</span>"], ["sub", "b ≤ a ⊕ b  ⇔  b ⊕ (a ⊕ b) = a ⊕ b<span class='tag'>परिभाषा, x=b, y=a⊕b लेकर</span>"]]},

{"say": "इसलिए यह सिद्ध करना पर्याप्त है कि b प्लस, a प्लस b, बराबर है a प्लस b के। हम बाएँ पक्ष से शुरू करते हैं।", "L": [["goal", "सिद्ध करना पर्याप्त है:  b ⊕ (a ⊕ b) = a ⊕ b<span class='tag'>नया साध्य</span>"], ["txt", "b ⊕ (a ⊕ b)"]]},

{"say": "पहला कदम। योग की साहचर्यता, x बराबर b, y बराबर a, और z बराबर b लेकर। b प्लस, a प्लस b, से हम b प्लस a, प्लस b पर पहुँचते हैं।", "L": [["sub", "b ⊕ (a ⊕ b)  =  (b ⊕ a) ⊕ b<span class='tag'>⊕ की साहचर्यता, x=b, y=a, z=b लेकर</span>"]]},

{"say": "दूसरा कदम। अब कोष्ठक के भीतर b प्लस a है, और हमें a प्लस b चाहिए। क्रमविनिमेयता लगाते हैं: b प्लस a बराबर है a प्लस b के।", "L": [["sub", "(<mark>b ⊕ a</mark>) ⊕ b"], ["txt", "(क्रम) से:  <mark>b ⊕ a</mark> = a ⊕ b"], ["sub", "b ⊕ (a ⊕ b)  =  (a ⊕ b) ⊕ b<span class='tag'>⊕ की क्रमविनिमेयता</span>"]]},

{"say": "तीसरा कदम। हम दोनों b को साथ लाना चाहते हैं। फिर से साहचर्यता लगाते हैं, इस बार x बराबर a, y बराबर b, और z बराबर b लेकर। a प्लस b, प्लस b, से हम a प्लस, b प्लस b पर पहुँचते हैं।", "L": [["sub", "b ⊕ (a ⊕ b)  =  a ⊕ (b ⊕ b)<span class='tag'>⊕ की साहचर्यता, x=a, y=b, z=b लेकर</span>"]]},

{"say": "चौथा कदम। कोष्ठक के भीतर b प्लस b है। वर्गसमता से, b प्लस b, b है। इसे चिह्नित करके बदल देते हैं।", "L": [["sub", "a ⊕ (<mark>b ⊕ b</mark>)"], ["txt", "(वर्ग) से:  <mark>b ⊕ b</mark> = b"], ["res", "b ⊕ (a ⊕ b)  =  a ⊕ b<span class='tag'>⊕ की वर्गसमता</span>"]]},

{"say": "हमने समिका सिद्ध कर दी। परिभाषा से, इस समिका का अर्थ है कि b, a प्लस b से छोटा या बराबर है। इसके साथ दूसरा भाग पूरा होता है।", "L": [["res", "b ⊕ (a ⊕ b) = a ⊕ b   ⟹   b ≤ a ⊕ b   ∎"]]},

{"title": "सारांश", "clear": 1, "say": "सारांश में। छोटा या बराबर की परिभाषा से, x का y से छोटा या बराबर होना सिद्ध करना, यह सिद्ध करना है कि x प्लस y बराबर है y के। a, a प्लस b से छोटा या बराबर है, इसके लिए साहचर्यता और वर्गसमता पर्याप्त थीं। b, a प्लस b से छोटा या बराबर है, इसके लिए क्रमविनिमेयता भी चाहिए थी। इस तरह a प्लस b, a और b दोनों से बड़ा या बराबर है। देखने के लिए धन्यवाद।", "L": [["res", "a ≤ a ⊕ b   (साहचर्यता + वर्गसमता)"], ["res", "b ≤ a ⊕ b   (साहचर्यता + क्रमविनिमेयता + साहचर्यता + वर्गसमता)"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' प्लस ').replace(/⊙/g,' गुणा ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ फिर से चलाएँ'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ जारी रखें'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ रोकें';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ रोकें';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ रोकें';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^hi/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/madhur|hemant|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="जालक में क्रम";$('sub').textContent="अभ्यास · बीजीय जालक";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
