<title>निरपेक्ष मान और समुच्चय</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>याद रखें</h2><div id="pins"></div></div><div id="board"></div></div>

amily='Georgia,serif'>2</text><line x1='402.72727272727275' y1='48' x2='402.72727272727275' y2='56' stroke='#9fb3aa'/><text x='402.72727272727275' y='72' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>5/2</text></svg>"]]},

{"title": "2) B ज्ञात करना", "clear": 1, "say": "अब B। हमारे पास है कि x ऋण एक का निरपेक्ष मान, धन x ऋण दो का निरपेक्ष मान, दो से छोटा है। हर निरपेक्ष मान उस बिंदु पर अपना व्यंजक बदलता है जहाँ उसका भीतरी भाग शून्य होता है: x ऋण एक, एक पर शून्य होता है, और x ऋण दो, दो पर शून्य होता है। ये दो बिंदु रेखा को तीन क्षेत्रों में बाँटते हैं: x एक से छोटा या बराबर, x एक और दो के बीच, और x दो से बड़ा या बराबर।", "L": [["sub", "|x − 1| + |x − 2| &lt; 2<span class='tag'>B की असमिका</span>"], ["txt", "|x − 1|  x = 1  पर बदलता है,    |x − 2|  x = 2  पर बदलता है"], ["hyp", "क्षेत्र 1:  x ≤ 1"], ["hyp", "क्षेत्र 2:  1 ≤ x ≤ 2"], ["hyp", "क्षेत्र 3:  x ≥ 2"]]},

{"title": "3) सम्मिलन A ∪ B", "clear": 1, "say": "चरण तीन। सम्मिलन। परिभाषा के अनुसार, A सम्मिलन B उन वास्तविक संख्याओं x का समुच्चय है, जिनके लिए x, A में है, या x, B में है।", "L": [["sub", "A ∪ B = { x ∈ ℝ | x ∈ A  या  x ∈ B }<span class='tag'>सम्मिलन की परिभाषा</span>"]]},

{"say": "हम A और B के स्थान पर वे अंतराल रखते हैं जो हमने ज्ञात किए हैं। A ऋण दो से दो तक जाता है, और B एक बटा दो से पाँच बटा दो तक। दोनों अंतराल एक दूसरे पर चढ़ते हैं, क्योंकि एक बटा दो, दो से छोटा है। सम्मिलन ऋण दो से शुरू होता है, उसे छोड़कर, क्योंकि वह A में नहीं है, और पाँच बटा दो पर समाप्त होता है, उसे छोड़कर, क्योंकि वह B में नहीं है। अतः, सम्मिलन ऋण दो से पाँच बटा दो तक का खुला अंतराल है।", "L": [["txt", "A और B रखने पर:"], ["sub", "A ∪ B = (−2, 2) ∪ (1/2, 5/2)"], ["res", "A ∪ B = (−2, 5/2)"], ["txt", "<svg viewBox='0 0 470 150' width='100%' style='max-width:520px;display:block' xmlns='http://www.w3.org/2000/svg'><text x='0' y='15' fill='#7cc4ff' font-size='15' font-family='Georgia,serif'>A = (−2, 2)</text><line x1='30.0' y1='24' x2='440.0' y2='24' stroke='#3d5a50' stroke-width='2'/><line x1='67.27272727272728' y1='24' x2='365.45454545454544' y2='24' stroke='#7cc4ff' stroke-width='6'/><circle cx='67.27272727272728' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><circle cx='365.45454545454544' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><text x='0' y='49' fill='#ffd166' font-size='15' font-family='Georgia,serif'>B = (1/2, 5/2)</text><line x1='30.0' y1='58' x2='440.0' y2='58' stroke='#3d5a50' stroke-width='2'/><line x1='253.63636363636363' y1='58' x2='402.72727272727275' y2='58' stroke='#ffd166' stroke-width='6'/><circle cx='253.63636363636363' cy='58' r='7' fill='#16231f' stroke='#ffd166' stroke-width='3'/><circle cx='402.72727272727275' cy='58' r='7' fill='#16231f' stroke='#ffd166' stroke-width='3'/><text x='0' y='83' fill='#7be0a0' font-size='15' font-family='Georgia,serif'>A ∪ B</text><line x1='30.0' y1='92' x2='440.0' y2='92' stroke='#3d5a50' stroke-width='2'/><line x1='67.27272727272728' y1='92' x2='402.72727272727275' y2='92' stroke='#7be0a0' stroke-width='6'/><circle cx='67.27272727272728' cy='92' r='7' fill='#16231f' stroke='#7be0a0' stroke-width='3'/><circle cx='402.72727272727275' cy='92' r='7' fill='#16231f' str {"title": "4) सर्वनिष्ठ A ∩ B", "clear": 1, "say": "चरण चार। सर्वनिष्ठ। परिभाषा के अनुसार, A सर्वनिष्ठ B उन वास्तविक संख्याओं x का समुच्चय है, जिनके लिए x, A में है, और x, B में है।", "L": [["sub", "A ∩ B = { x ∈ ℝ | x ∈ A  और  x ∈ B }<span class='tag'>सर्वनिष्ठ की परिभाषा</span>"]]},

{"say": "हम रखते हैं। A में होने का अर्थ है x ऋण दो और दो के बीच। B में होने का अर्थ है x एक बटा दो और पाँच बटा दो के बीच। दोनों एक साथ होने का अर्थ है x एक बटा दो से बड़ा, क्योंकि नीचे की ओर यही सबसे कड़ी शर्त है, और x दो से छोटा, जो ऊपर की ओर सबसे कड़ी शर्त है। अतः, सर्वनिष्ठ एक बटा दो से दो तक का खुला अंतराल है।", "L": [["txt", "A और B रखने पर:"], ["sub", "A ∩ B = (−2, 2) ∩ (1/2, 5/2)"], ["sub", "x &gt; −2  और  x &gt; 1/2  ⟹  x &gt; 1/2          x &lt; 2  और  x &lt; 5/2  ⟹  x &lt; 2"], ["res", "A ∩ B = (1/2, 2)"], ["txt", "<svg viewBox='0 0 470 150' width='100%' style='max-width:520px;display:block' xmlns='http://www.w3.org/2000/svg'><text x='0' y='15' fill='#7cc4ff' font-size='15' font-family='Georgia,serif'>A = (−2, 2)</text><line x1='30.0' y1='24' x2='440.0' y2='24' stroke='#3d5a50' stroke-width='2'/><line x1='67.27272727272728' y1='24' x2='365.45454545454544' y2='24' stroke='#7cc4ff' stroke-width='6'/><circle cx='67.27272727272728' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><circle cx='365.45454545454544' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><text x='0' y='49' fill='#ffd166' font-size='15' font-family='Georgia,serif'>B = (1/2, 5/2)</text><line x1='30.0' y1='58' x2='440.0' y2='58' stroke='#3d5a50' stroke-width='2'/><line x1='253.63636363636363' y1='58' x2='402.72727272727275' y2='58' stroke='#ffd166' stroke-width='6'/><circle cx='253.63636363636363' cy='58' r='7' fill='#16231f' stroke='#ffd166' stroke-width='3'/><circle cx='402.72727272727275' cy='58' r='7' fill='#16231f' stroke='#ffd166' stroke-width='3'/><text x='0' y='83' fill='#7be0a0' font-size='15' font-family='Georgia,serif'>A ∩ B</text><line x1='30.0' y1='92' x2='440.0' y2='92' stroke='#3d5a50' stroke-width='2'/><line x1='253.63636363636363' y1='92' x2='365.45454545454544' y2='92' stroke='#7be0a0' stroke-width='6'/><circle cx='253.63636363636363' cy='92' r='7' fill='#16231f' stroke='#7be0a0' stroke-width='3'/><circle cx='365.45454545454544' cy='92' r='7' {"title": "5) अंतर A ∖ B", "clear": 1, "say": "चरण पाँच। अंतर A ऋण B। परिभाषा के अनुसार, यह उन वास्तविक संख्याओं x का समुच्चय है, जिनके लिए x, A में है, और x, B में नहीं है।", "L": [["sub", "A ∖ B = { x ∈ ℝ | x ∈ A  और  x ∉ B }<span class='tag'>अंतर की परिभाषा</span>"]]},

<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' प्लस ').replace(/⊙/g,' गुणा ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ फिर से चलाएँ'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ जारी रखें'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ रोकें';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ रोकें';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ रोकें';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^hi/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/madhur|hemant|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="निरपेक्ष मान और समुच्चय";$('sub').textContent="अभ्यास · समुच्चयों का बीजगणित";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
