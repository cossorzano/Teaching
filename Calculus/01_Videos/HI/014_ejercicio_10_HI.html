<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>द्वैत सिद्धांत</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>याद रखें</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ शुरू करें</button><button id="next">▶|</button>
<select id="voice"></select>
<label>गति <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">रिकॉर्डिंग मोड (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"hi-IN",
"meta":{"nivel": 2, "titulo": "द्वैत सिद्धांत", "enunciado": "मान लीजिए (B, ⊕, ⊙, ∼, 0, 1) एक बूलीय बीजगणित है।  द्वैत सिद्धांत का उपयोग करके, इन सर्वसमिकाओं की द्वैत सर्वसमिकाएँ लिखिए और जाँचिए:", "tesis": "(a)  a ⊕ 1 = 1,   (b)  a ⊕ (a ⊙ b) = a", "datos": ["(द्वैत)  ⊕ ↔ ⊙,   0 ↔ 1", "(प्रभुत्व)  a ⊕ 1 = 1,   a ⊙ 0 = 0", "(अवशोषण)  a ⊕ (a ⊙ b) = a,   a ⊙ (a ⊕ b) = a"]},
"steps":[
{"title": "द्वैत सिद्धांत", "sub": "अभ्यास · बूलीय बीजगणित", "clear": 1, "say": "नमस्ते। इस वीडियो में हम बूलीय बीजगणित पर एक अभ्यास हल करेंगे। हम बहुत धीरे-धीरे चलेंगे, हर समीकरण लिखेंगे और हर कदम का कारण बताएँगे।", "L": [["txt", "नई सर्वसमिकाएँ पाने के लिए द्वैत सिद्धांत का उपयोग"]]},

{"say": "पहले, दी गई बातें। B एक समुच्चय है जिस पर दो संक्रियाएँ हैं, योग और गुणन, एक पूरक संक्रिया, और दो विशेष अवयव, शून्य और एक। यह एक बूलीय बीजगणित है। सामान्य उदाहरण किसी समुच्चय U का घात समुच्चय है, सम्मिलन, सर्वनिष्ठ और पूरक के साथ, जहाँ शून्य रिक्त समुच्चय है और एक U है।", "L": [["hyp", "(B, ⊕, ⊙, ∼, 0, 1) बूलीय बीजगणित<span class='tag'>परिकल्पना</span>"], ["txt", "समुच्चयों के साथ:  (𝒫(U), ∪, ∩, पूरक),   0 = ∅,   1 = U"]]},

{"say": "द्वैत सिद्धांत याद करते हैं। बूलीय बीजगणित में मान्य कोई भी सर्वसमिका, योग और गुणन को, तथा शून्य और एक को एक साथ आपस में बदलने पर भी मान्य रहती है। समुच्चयों में इसका अर्थ है सम्मिलन और सर्वनिष्ठ को, तथा रिक्त समुच्चय और U को आपस में बदलना।", "L": [["sub", "⊕ ↔ ⊙,      0 ↔ 1<span class='tag'>द्वैत सिद्धांत: एक साथ अदला-बदली</span>"], ["txt", "समुच्चयों के साथ:  ∪ ↔ ∩,      ∅ ↔ U"]]},

{"say": "इसे हम बाईं ओर लिख लेते हैं, क्योंकि पूरे अभ्यास में इसी का उपयोग करेंगे।", "pin": ["(द्वैत) हर मान्य सर्वसमिका ⊕ ↔ ⊙ और 0 ↔ 1 बदलने पर भी मान्य रहती है"]},

{"say": "हमें क्या करना है। भाग a: प्रभुत्व नियम, a प्लस एक, एक है, से शुरू करके उसकी द्वैत सर्वसमिका लिखना और जाँचना कि वह भी मान्य है। भाग b: अवशोषण नियम, a प्लस, a गुणा b, a है, से शुरू करके उसकी द्वैत सर्वसमिका लिखना और जाँचना कि वह भी मान्य है।", "L": [["goal", "(a)  a ⊕ 1 = 1  का द्वैत, और जाँचें कि यह मान्य है"], ["goal", "(b)  a ⊕ (a ⊙ b) = a  का द्वैत, और जाँचें कि यह मान्य है<span class='tag'>साध्य</span>"]]},

{"title": "(a) प्रभुत्व नियम का द्वैत", "clear": 1, "say": "भाग a। मूल सर्वसमिका प्रभुत्व नियम है: a प्लस एक, एक के बराबर है। समुच्चयों में: A सम्मिलन U, U है। इसे हम बाईं ओर लिख लेते हैं, क्योंकि यह एक मान्य आरंभिक सर्वसमिका है।", "L": [["sub", "a ⊕ 1 = 1<span class='tag'>मूल सर्वसमिका: प्रभुत्व नियम</span>"], ["txt", "समुच्चयों के साथ:  A ∪ U = U"]], "pin": ["(प्रभुत्व) a ⊕ 1 = 1"]},

{"say": "द्वैत सिद्धांत लगाकर, हम योग को गुणन से, और एक को शून्य से बदलते हैं। सर्वसमिका में एक योग और दो एक हैं, इसलिए योग को गुणन में, और दोनों एक को शून्य में बदलते हैं।", "L": [["sub", "⊕ → ⊙,      1 → 0<span class='tag'>द्वैत अदला-बदली</span>"], ["txt", "a ⊕ 1 = 1   बन जाता है   a ⊙ 0 = 0"]]},

{"say": "हमें द्वैत सर्वसमिका मिलती है: a गुणा शून्य, शून्य के बराबर है। समुच्चयों में: A सर्वनिष्ठ रिक्त समुच्चय, रिक्त है।", "L": [["res", "a ⊙ 0 = 0<span class='tag'>द्वैत सर्वसमिका</span>"], ["txt", "समुच्चयों के साथ:  A ∩ ∅ = ∅"]]},

{"say": "अब जाँचते हैं कि यह मान्य है। यह समता ठीक दूसरा प्रभुत्व नियम है, जो पहले ही सिद्ध हो चुका है। इसे बाईं ओर लिख लेते हैं। इसलिए द्वैत सर्वसमिका भी मान्य है। इसके साथ भाग a पूरा होता है।", "L": [["res", "a ⊙ 0 = 0  दूसरा प्रभुत्व नियम है   ∎<span class='tag'>द्वैत सर्वसमिका भी मान्य है</span>"]], "pin": ["(प्रभुत्व) a ⊙ 0 = 0"]},

{"title": "(b) अवशोषण नियम का द्वैत", "clear": 1, "say": "भाग b। मूल सर्वसमिका अवशोषण नियम है: a प्लस, a गुणा b, a के बराबर है। समुच्चयों में: A सम्मिलन, A सर्वनिष्ठ B, A है। इसे बाईं ओर लिख लेते हैं।", "L": [["sub", "a ⊕ (a ⊙ b) = a<span class='tag'>मूल सर्वसमिका: अवशोषण नियम</span>"], ["txt", "समुच्चयों के साथ:  A ∪ (A ∩ B) = A"]], "pin": ["(अवशोषण) a ⊕ (a ⊙ b) = a"]},

{"say": "द्वैत सिद्धांत लगाकर, हम योग को गुणन से, और गुणन को योग से बदलते हैं। इस सर्वसमिका में न शून्य है न एक, इसलिए केवल योग को गुणन में, और गुणन को योग में बदलते हैं।", "L": [["sub", "⊕ ↔ ⊙<span class='tag'>द्वैत अदला-बदली</span>"], ["txt", "a ⊕ (a ⊙ b) = a   बन जाता है   a ⊙ (a ⊕ b) = a"]]},

{"say": "हमें द्वैत सर्वसमिका मिलती है: a गुणा, a प्लस b, a के बराबर है। समुच्चयों में: A सर्वनिष्ठ, A सम्मिलन B, A है।", "L": [["res", "a ⊙ (a ⊕ b) = a<span class='tag'>द्वैत सर्वसमिका</span>"], ["txt", "समुच्चयों के साथ:  A ∩ (A ∪ B) = A"]]},

{"say": "अब जाँचते हैं कि यह मान्य है। यह समता दूसरे अवशोषण नियम की है, जो हर जालक में मान्य है, और इसलिए बूलीय बीजगणित में भी। इसे बाईं ओर लिख लेते हैं। इसके साथ भाग b पूरा होता है।", "L": [["res", "a ⊙ (a ⊕ b) = a  दूसरा अवशोषण नियम है   ∎<span class='tag'>हर जालक में मान्य, इसलिए बूलीय बीजगणित में भी</span>"]], "pin": ["(अवशोषण) a ⊙ (a ⊕ b) = a"]},

{"title": "निष्कर्ष", "clear": 1, "say": "हम निष्कर्ष निकालते हैं कि एक बार कोई सर्वसमिका सिद्ध हो जाए, तो उसकी द्वैत सर्वसमिका अपने आप मान्य होती है, किसी नए स्वतंत्र प्रमाण की आवश्यकता नहीं। समुच्चयों में: यदि समुच्चयों की कोई समता मान्य है, तो सम्मिलन को सर्वनिष्ठ से, और रिक्त समुच्चय को U से बदलने पर मिलने वाली समता भी मान्य है। देखने के लिए धन्यवाद।", "L": [["res", "मान्य सर्वसमिका  ⟹  उसका द्वैत भी मान्य"], ["res", "(a)  a ⊕ 1 = 1   ⟹   a ⊙ 0 = 0"], ["res", "(b)  a ⊕ (a ⊙ b) = a   ⟹   a ⊙ (a ⊕ b) = a"], ["txt", "समुच्चयों के साथ:  ∪ ↔ ∩,   ∅ ↔ U"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' प्लस ').replace(/⊙/g,' गुणा ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ फिर से चलाएँ'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ जारी रखें'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ रोकें';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ रोकें';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ रोकें';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^hi/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/madhur|hemant|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="द्वैत सिद्धांत";$('sub').textContent="अभ्यास · बूलीय बीजगणित";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
