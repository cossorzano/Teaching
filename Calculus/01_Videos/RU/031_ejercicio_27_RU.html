<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Разности трёх множеств</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}

#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>Запомним</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Начать</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Скорость <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Режим записи (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"ru-RU",
"meta":{"nivel": 2, "titulo": "Разности трёх множеств", "enunciado": "(a) Доказать, что одна из двух следующих формул всегда верна, а другая иногда неверна. (b) Найти дополнительное необходимое и достаточное условие, при котором неверная формула всегда выполняется.", "tesis": "<span dir='ltr'>(i)  A ∖ (B ∖ C) = (A ∖ B) ∪ C</span><br><span dir='ltr'>(ii)  (A ∖ B) ∖ C = A ∖ (B ∪ C)</span>", "datos": ["(Опр ∖)  x ∈ X ∖ Y  ⟺  x ∈ X  и  x ∉ Y"]},
"steps":[
{"title": "Разности трёх множеств", "sub": "Упражнение · Алгебра множеств", "clear": 1, "say": "Здравствуйте. В этом видео мы изучим две формулы с разностями трёх множеств: одна из них всегда верна, а другая иногда неверна. Затем мы найдём условие, при котором неверная формула всегда выполняется. Мы будем двигаться очень медленно, записывая каждое равенство и обосновывая каждый шаг.", "L": [["txt", "Две формулы с разностями трёх множеств"]]},

{"clear": 1, "say": "Что мы хотим сделать. В пункте а у нас две формулы. Формула один: А без разности Бэ и Цэ равно объединению А без Бэ и Цэ. Формула два: разность А без Бэ, без Цэ, равна А без объединения Бэ и Цэ. Нужно доказать, что одна из них всегда верна, а другая иногда неверна. В пункте бэ нужно найти дополнительное необходимое и достаточное условие, при котором неверная формула всегда выполняется. Слева мы вспоминаем определения через элементы, которыми будем пользоваться.", "L": [["goal", "(a)  Одна формула всегда верна, а другая иногда неверна:"], ["txt", "(i)  A ∖ (B ∖ C) = (A ∖ B) ∪ C"], ["txt", "(ii)  (A ∖ B) ∖ C = A ∖ (B ∪ C)"], ["goal", "(b)  Необходимое и достаточное условие, при котором неверная формула всегда выполняется"]], "pin": ["(Опр ∖) x ∈ X ∖ Y  ⟺  x ∈ X  и  x ∉ Y", "(Опр ∪) x ∈ X ∪ Y  ⟺  x ∈ X  или  x ∈ Y", "(Опр ∩) x ∈ X ∩ Y  ⟺  x ∈ X  и  x ∈ Y"]},

{"title": "(a) Анализ (i)", "clear": 1, "say": "Пункт а, анализ формулы один. Мы увидим, что в общем случае она неверна. Чтобы доказать, что формула не всегда верна, достаточно найти контрпример: конкретные множества, для которых она не выполняется.", "L": [["goal", "(i)  A ∖ (B ∖ C) = (A ∖ B) ∪ C   в общем случае неверна"], ["txt", "Достаточно одного контрпримера"]]},

{"say": "Возьмём А равным пустому множеству, Бэ равным пустому множеству, а Цэ равным множеству, единственный элемент которого ноль.", "L": [["hyp", "A = ∅"], ["hyp", "B = ∅"], ["hyp", "C = { 0 }"]]},

{"clear": 1, "say": "Вычислим левую часть. Сначала Бэ без Цэ — это пустое множество без множества, содержащего ноль. Так как в пустом множестве нет элементов, в нём не может быть элементов, не лежащих в Цэ. Значит, Бэ без Цэ пусто.", "L": [["txt", "Левая часть.  Сначала:"], ["sub", "B ∖ C = ∅ ∖ { 0 } = ∅"]]},

{"say": "Теперь А без разности Бэ и Цэ — это пустое множество без пустого, то есть снова пустое. Следовательно, левая часть — пустое множество.", "L": [["sub", "A ∖ (B ∖ C) = ∅ ∖ ∅ = ∅"]]},

{"say": "Вычислим правую часть. А без Бэ — это пустое без пустого, то есть пустое. А объединение пустого множества с множеством, содержащим ноль, — это множество, содержащее ноль. Следовательно, правая часть — множество, содержащее ноль.", "L": [["txt", "Правая часть:"], ["sub", "A ∖ B = ∅ ∖ ∅ = ∅"], ["sub", "(A ∖ B) ∪ C = ∅ ∪ { 0 } = { 0 }"]]},

{"clear": 1, "say": "Сравним. Левая часть пуста, а правая — множество, содержащее ноль. Они не равны, потому что ноль лежит во втором множестве и не лежит в первом. Значит, для этих множеств формула один не выполняется, и она иногда неверна.", "L": [["warn", "∅ ≠ { 0 }   так как  0 ∈ { 0 }  и  0 ∉ ∅"], ["res", "(i) иногда неверна"]]},

{"title": "(a) Анализ (ii)", "clear": 1, "say": "Пункт а, анализ формулы два. Докажем, что А без объединения Бэ и Цэ равно разности А без Бэ, без Цэ, для любых множеств А, Бэ и Цэ. Возьмём произвольный элемент икс и запишем цепочку равносильностей. Так как каждый шаг — равносильность, цепочку можно читать в обе стороны, и это доказывает оба включения сразу.", "L": [["hyp", "Пусть x — произвольный элемент"], ["goal", "Хотим:  x ∈ A ∖ (B ∪ C)  ⟺  x ∈ (A ∖ B) ∖ C"]]},

{"clear": 1, "say": "Начнём с утверждения: икс принадлежит А без объединения Бэ и Цэ.", "L": [["sub", "x ∈ A ∖ (B ∪ C)"]]},

{"say": "По определению разности, где икс большое — это А, а игрек большое — объединение Бэ и Цэ, это равносильно тому, что икс принадлежит А, и икс не принадлежит объединению Бэ и Цэ.", "L": [["sub", "⟺  x ∈ A  и  x ∉ B ∪ C<span class='tag'>(Опр ∖)</span>"]]},

{"say": "Далее, то, что икс не принадлежит объединению Бэ и Цэ, означает, что неверно, что икс принадлежит Бэ или икс принадлежит Цэ. А это происходит, когда икс не принадлежит Бэ, и икс не принадлежит Цэ.", "L": [["sub", "⟺  x ∈ A  и  ( x ∉ B  и  x ∉ C )<span class='tag'>(Опр ∪), отрицание</span>"]]},

{"say": "Перегруппируем по-другому, используя ассоциативность конъюнкции: сначала икс принадлежит А и не принадлежит Бэ, всё это вместе, и икс не принадлежит Цэ.", "L": [["sub", "⟺  ( x ∈ A  и  x ∉ B )  и  x ∉ C<span class='tag'>Ассоциативность «и»</span>"]]},

{"say": "По определению разности, где икс большое — это А, а игрек большое — Бэ, то, что икс принадлежит А и не принадлежит Бэ, равносильно тому, что икс принадлежит А без Бэ.", "L": [["sub", "⟺  x ∈ A ∖ B  и  x ∉ C<span class='tag'>(Опр ∖)</span>"]]},

{"say": "И снова по определению разности, теперь где икс большое — это А без Бэ, а игрек большое — Цэ, это равносильно тому, что икс принадлежит разности А без Бэ, без Цэ.", "L": [["sub", "⟺  x ∈ (A ∖ B) ∖ C<span class='tag'>(Опр ∖)</span>"]]},

{"clear": 1, "say": "Так как икс был произвольным, крайние утверждения равносильны для любого икс. Следовательно, множества равны, и формула два верна для любых множеств А, Бэ и Цэ.", "L": [["res", "A ∖ (B ∪ C) = (A ∖ B) ∖ C"], ["res", "(ii) всегда верна"]]},

{"title": "(b) Условие выполнения (i)", "clear": 1, "say": "Пункт бэ. Нам нужно необходимое и достаточное условие, при котором формула один всегда выполняется. Сначала упростим левую часть с помощью дополнений. Слева мы вспоминаем четыре свойства, которыми будем пользоваться: разность как пересечение с дополнением, законы де Моргана, то, что дополнение дополнения есть само множество, и дистрибутивность.", "L": [["goal", "Ищем условие, при котором  A ∖ (B ∖ C) = (A ∖ B) ∪ C  выполняется"], ["txt", "Сначала упростим левую часть"]], "pin": ["(Dif) X ∖ Y = X ∩ Yᶜ", "(De Morgan) (X ∩ Y)ᶜ = Xᶜ ∪ Yᶜ", "(Invol) (Xᶜ)ᶜ = X", "(Distrib) X ∩ (Y ∪ Z) = (X ∩ Y) ∪ (X ∩ Z)"]},

{"clear": 1, "say": "Начнём с А без разности Бэ и Цэ.", "L": [["sub", "A ∖ (B ∖ C)"]]},

{"say": "По свойству Dif, где икс большое — это А, а игрек большое — Бэ без Цэ, А без разности Бэ и Цэ равно пересечению А с дополнением разности Бэ и Цэ.", "L": [["sub", "=  A ∩ (B ∖ C)ᶜ<span class='tag'>(Dif)</span>"]]},

{"say": "Снова по свойству Dif, теперь где икс большое — это Бэ, а игрек большое — Цэ, Бэ без Цэ равно пересечению Бэ с дополнением Цэ.", "L": [["sub", "=  A ∩ (B ∩ Cᶜ)ᶜ<span class='tag'>(Dif)</span>"]]},

{"say": "По законам де Моргана, где икс большое — это Бэ, а игрек большое — дополнение Цэ, дополнение пересечения Бэ с дополнением Цэ равно объединению дополнения Бэ с дополнением дополнения Цэ.", "L": [["sub", "=  A ∩ ( Bᶜ ∪ (Cᶜ)ᶜ )<span class='tag'>(De Morgan)</span>"]]},

{"say": "А так как дополнение дополнения Цэ есть Цэ, по свойству Invol остаётся пересечение А с объединением дополнения Бэ и Цэ.", "L": [["sub", "=  A ∩ ( Bᶜ ∪ C )<span class='tag'>(Invol)</span>"]]},

{"say": "По дистрибутивности, где икс большое — это А, игрек большое — дополнение Бэ, а зет большое — Цэ, это равно объединению пересечения А с дополнением Бэ и пересечения А и Цэ.", "L": [["sub", "=  (A ∩ Bᶜ) ∪ (A ∩ C)<span class='tag'>(Distrib)</span>"]]},

{"say": "И по свойству Dif, пересечение А с дополнением Бэ есть А без Бэ.", "L": [["res", "=  (A ∖ B) ∪ (A ∩ C)<span class='tag'>(Dif)</span>"]]},

{"clear": 1, "say": "Следовательно, равенство один равносильно тому, что объединение А без Бэ и пересечения А и Цэ равно объединению А без Бэ и Цэ. Запишем это равенство как равенство со звёздочкой. Две части отличаются только тем, что слева стоит пересечение А и Цэ, а справа стоит Цэ.", "L": [["txt", "(i)  равносильно:"], ["goal", "(A ∖ B) ∪ (A ∩ C) = (A ∖ B) ∪ C<span class='tag'>(★)</span>"]]},

{"title": "(b) (★) ⟺ C ⊆ A", "clear": 1, "say": "Утверждаем, что равенство со звёздочкой выполняется тогда и только тогда, когда Цэ содержится в А. Докажем это в обе стороны.", "L": [["goal", "(★)   ⟺   C ⊆ A"], ["txt", "(⟸)  Предполагаем C ⊆ A и доказываем (★)"], ["txt", "(⟹)  Предполагаем (★) и доказываем C ⊆ A"]]},

{"clear": 1, "say": "Сначала направление справа налево. Предположим, что Цэ содержится в А. Тогда пересечение А и Цэ равно Цэ. Действительно, пересечение А и Цэ всегда содержится в Цэ. И обратно, если икс принадлежит Цэ, то, так как Цэ содержится в А, икс принадлежит А, значит, икс принадлежит и А, и Цэ, то есть пересечению А и Цэ.", "L": [["hyp", "Предполагаем  C ⊆ A"], ["txt", "A ∩ C ⊆ C  всегда.  А если  x ∈ C,  так как  C ⊆ A,  x ∈ A:  значит  x ∈ A ∩ C"], ["sub", "A ∩ C = C"]]},

{"say": "Заменим пересечение А и Цэ на Цэ в левой части равенства со звёздочкой. В обеих частях получаем объединение А без Бэ и Цэ. Следовательно, равенство со звёздочкой выполняется.", "L": [["txt", "Подставляя  A ∩ C = C  в (★):"], ["res", "(A ∖ B) ∪ C = (A ∖ B) ∪ C"], ["res", "C ⊆ A  ⟹  (★)"]]},

{"clear": 1, "say": "Теперь направление слева направо. Предположим, что равенство со звёздочкой выполняется, и нам нужно доказать, что Цэ содержится в А. Пусть икс — произвольный элемент Цэ.", "L": [["hyp", "Предполагаем (★)"], ["hyp", "Пусть  x ∈ C"], ["goal", "Хотим:  x ∈ A"]]},

{"say": "Так как икс принадлежит Цэ, по определению объединения икс принадлежит объединению А без Бэ и Цэ. А по равенству со звёздочкой икс принадлежит также объединению А без Бэ и пересечения А и Цэ.", "L": [["txt", "x ∈ C  ⟹  x ∈ (A ∖ B) ∪ C   по (Опр ∪)"], ["txt", "По (★):"], ["sub", "x ∈ (A ∖ B) ∪ (A ∩ C)"]]},

{"say": "По определению объединения, это означает, что икс принадлежит А без Бэ, или икс принадлежит пересечению А и Цэ. Рассмотрим оба случая.", "L": [["txt", "По (Опр ∪):"], ["hyp", "Случай 1:  x ∈ A ∖ B"], ["hyp", "Случай 2:  x ∈ A ∩ C"]]},

{"say": "В первом случае, по определению разности, икс принадлежит А и не принадлежит Бэ. В частности, икс принадлежит А. Во втором случае, по определению пересечения, икс принадлежит А и принадлежит Цэ. В частности, икс принадлежит А.", "L": [["sub", "Случай 1:  по (Опр ∖),  x ∈ A  и  x ∉ B   ⟹   x ∈ A"], ["sub", "Случай 2:  по (Опр ∩),  x ∈ A  и  x ∈ C   ⟹   x ∈ A"]]},

{"clear": 1, "say": "В обоих случаях икс принадлежит А. Так как икс был произвольным элементом Цэ, заключаем, что Цэ содержится в А.", "L": [["res", "x ∈ A"], ["res", "(★)  ⟹  C ⊆ A"]]},

{"title": "Вывод", "clear": 1, "say": "Вывод пункта бэ. Формула один верна тогда и только тогда, когда Цэ содержится в А. Проверим на контрпримере из пункта а: Цэ было множеством, содержащим ноль, а А было пустым, поэтому Цэ не содержалось в А, и формула не выполнялась.", "L": [["res", "A ∖ (B ∖ C) = (A ∖ B) ∪ C   ⟺   C ⊆ A"], ["txt", "Контрпример:  C = { 0 } ⊄ ∅ = A   ⟹   (i) неверна"]]},

{"title": "Итог", "clear": 1, "say": "Подведём итог. Формула два всегда верна. Формула один иногда неверна и выполняется в точности тогда, когда Цэ содержится в А. Спасибо за внимание.", "L": [["res", "(ii)  (A ∖ B) ∖ C = A ∖ (B ∪ C)   всегда"], ["res", "(i)  A ∖ (B ∖ C) = (A ∖ B) ∪ C   ⟺   C ⊆ A"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' плюс ').replace(/⊙/g,' умножить на ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Повторить'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Продолжить'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Пауза';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Пауза';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Пауза';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^ru/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/dmitry|pavel|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Разности трёх множеств";$('sub').textContent="Упражнение · Алгебра множеств";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
