<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Алгебраические структуры</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:30%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(15px,1.9vw,24px)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>Запомним</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Начать</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Скорость <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Режим записи (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"ru-RU",
"meta":{"nivel": 0, "titulo": "Алгебраические структуры", "enunciado": "Конспект: решётка, дистрибутивная решётка и булева алгебра", "datos": ["Решётка", "Дистрибутивная решётка", "Булева алгебра", "Теоремы булевой алгебры", "Принцип двойственности"]},
"steps":[
{"title": "Алгебраические структуры", "sub": "Конспект: решётка, дистрибутивная решётка и булева алгебра", "clear": 1, "say": "Здравствуйте. В этом видео мы повторим, прямо по формулам, три алгебраические структуры, которые вкладываются одна в другую: решётку, дистрибутивную решётку и булеву алгебру.", "L": [["txt", "Решётка  ⊂  Дистрибутивная решётка  ⊂  Булева алгебра"]]},

{"title": "Решётка", "clear": 1, "say": "Начнём с решётки. Тройка Бэ, плюс в кружке, точка в кружке, является решёткой, если обе операции бинарные и внутренние, и для всех а, бэ и цэ из Бэ выполняются определённые свойства.", "L": [["hyp", "(B, ⊕, ⊙) — решётка<span class='tag'>⊕, ⊙ бинарные и внутренние</span>"], ["hyp", "Для всех  a, b, c ∈ B"]]},

{"say": "Первое свойство, коммутативность. а плюс бэ равно бэ плюс а. И а умножить на бэ равно бэ умножить на а.", "L": [["sub", "a ⊕ b = b ⊕ a<span class='tag'>Коммутативность</span>"], ["sub", "a ⊙ b = b ⊙ a<span class='tag'>Коммутативность</span>"]]},

{"say": "Второе свойство, ассоциативность. а плюс, бэ плюс цэ, равно, а плюс бэ, плюс цэ. И то же самое для произведения: а умножить на, бэ умножить на цэ, равно, а умножить на бэ, умножить на цэ.", "L": [["sub", "a ⊕ (b ⊕ c) = (a ⊕ b) ⊕ c<span class='tag'>Ассоциативность</span>"], ["sub", "a ⊙ (b ⊙ c) = (a ⊙ b) ⊙ c<span class='tag'>Ассоциативность</span>"]]},

{"say": "Третье свойство, поглощение. а плюс, а умножить на бэ, равно а. И а умножить на, а плюс бэ, равно а. Каждая операция поглощает другую.", "L": [["sub", "a ⊕ (a ⊙ b) = a<span class='tag'>Поглощение</span>"], ["sub", "a ⊙ (a ⊕ b) = a<span class='tag'>Поглощение</span>"]]},

{"say": "Из этих аксиом следует теорема: идемпотентность. а плюс а равно а, и а умножить на а равно а. Применение операции к элементу и к нему же самому ничего не меняет.", "L": [["res", "a ⊕ a = a<span class='tag'>Теорема: идемпотентность</span>"], ["res", "a ⊙ a = a<span class='tag'>Теорема: идемпотентность</span>"]]},

{"say": "Запишем слева главное о решётке: коммутативность, ассоциативность и поглощение.", "pin": "Решётка: коммутативность, ассоциативность, поглощение"},

{"title": "Дистрибутивная решётка", "clear": 1, "say": "Перейдём к дистрибутивной решётке. Это решётка, в которой дополнительно выполняется дистрибутивность.", "L": [["goal", "Дистрибутивная решётка  =  Решётка  +  дистрибутивность"]]},

{"say": "Каждая операция дистрибутивна относительно другой. а плюс, бэ умножить на цэ, равно, а плюс бэ, умножить на, а плюс цэ. И а умножить на, бэ плюс цэ, равно, а умножить на бэ, плюс, а умножить на цэ.", "L": [["sub", "a ⊕ (b ⊙ c) = (a ⊕ b) ⊙ (a ⊕ c)<span class='tag'>Дистрибутивность</span>"], ["sub", "a ⊙ (b ⊕ c) = (a ⊙ b) ⊕ (a ⊙ c)<span class='tag'>Дистрибутивность</span>"]]},

{"title": "Булева алгебра", "clear": 1, "say": "И мы приходим к булевой алгебре. Это дистрибутивная решётка, в которой есть ещё наименьший элемент, ноль, наибольший элемент, единица, и дополнение для каждого элемента.", "L": [["goal", "Булева алгебра  =  Дистрибутивная решётка  +  0, 1  +  дополнения"]]},

{"say": "Ноль — нейтральный элемент суммы, а единица — нейтральный элемент произведения. а плюс ноль равно а. И а умножить на единицу равно а.", "L": [["sub", "a ⊕ 0 = a<span class='tag'>0 нейтрален для ⊕</span>"], ["sub", "a ⊙ 1 = a<span class='tag'>1 нейтральна для ⊙</span>"]]},

{"say": "У каждого элемента а есть дополнение, которое мы обозначаем тильдой перед ним. Оно должно удовлетворять сразу двум условиям: а плюс его дополнение равно единице, а умножить на его дополнение равно нулю.", "L": [["sub", "a ⊕ ∼a = 1<span class='tag'>Дополнение (оба условия обязательны)</span>"], ["sub", "a ⊙ ∼a = 0<span class='tag'>Дополнение (оба условия обязательны)</span>"]]},

{"say": "Поскольку решётка дистрибутивна, дополнение каждого элемента единственно. Кроме того, дополнение нуля — это единица.", "L": [["res", "∼a единственно для каждого a"], ["res", "∼0 = 1"]]},

{"say": "Запишем слева главное о булевой алгебре.", "pin": "Булева алгебра: дистрибутивность + 0, 1 + дополнения"},

{"title": "Теоремы булевой алгебры", "clear": 1, "say": "В булевой алгебре выполняется несколько теорем. Первая — закон инволюции: дополнение дополнения а есть а.", "L": [["res", "∼(∼a) = a<span class='tag'>Закон инволюции</span>"]]},

{"say": "Вторая — доминирование. а плюс единица равно единице. И а умножить на ноль равно нулю.", "L": [["res", "a ⊕ 1 = 1<span class='tag'>Доминирование</span>"], ["res", "a ⊙ 0 = 0<span class='tag'>Доминирование</span>"]]},

{"say": "Третья — законы де Моргана. а плюс бэ есть дополнение, дополнения а умножить на дополнение бэ. И а умножить на бэ есть дополнение, дополнения а плюс дополнение бэ.", "L": [["res", "a ⊕ b = ∼(∼a ⊙ ∼b)<span class='tag'>Закон де Моргана</span>"], ["res", "a ⊙ b = ∼(∼a ⊕ ∼b)<span class='tag'>Закон де Моргана</span>"]]},

{"title": "Принцип двойственности", "clear": 1, "say": "Наконец, принцип двойственности. Любое верное тождество остаётся верным, если поменять местами сумму и произведение, а также ноль и единицу.", "L": [["goal", "⊕ ↔ ⊙,      0 ↔ 1"]]},

{"say": "Рассмотрим пример. а плюс ноль равно а — верное тождество. Поменяв местами операции и нейтральные элементы, получаем: а умножить на единицу равно а, и это тоже верно.", "L": [["sub", "a ⊕ 0 = a<span class='tag'>Верное тождество</span>"], ["sub", "⊕ ↔ ⊙,  0 ↔ 1"], ["res", "a ⊙ 1 = a<span class='tag'>Двойственное тождество, тоже верное</span>"]]},

{"title": "Итоги", "clear": 1, "say": "Подведём итоги. Решётка требует коммутативности, ассоциативности и поглощения. Дистрибутивная решётка добавляет дистрибутивность. А булева алгебра добавляет ноль, единицу и дополнения, откуда следуют инволюция, доминирование, законы де Моргана и двойственность. Спасибо за внимание.", "L": [["res", "Решётка: коммутативность, ассоциативность, поглощение ⟹ идемпотентность"], ["res", "+ дистрибутивность ⟹ Дистрибутивная решётка"], ["res", "+ 0, 1, ∼a ⟹ Булева алгебра ⟹ инволюция, доминирование, де Морган, двойственность"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){const d=document.createElement('div');d.className='l hyp';d.innerHTML=s.pin;if(k<n)d.style.animation='none';pins.appendChild(d)}}
 board.scrollTop=board.scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' плюс ').replace(/⊙/g,' умножить на ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Повторить'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Продолжить'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Пауза';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Пауза';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Пауза';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^ru/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/dmitry|pavel|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Алгебраические структуры";$('sub').textContent="Конспект: решётка, дистрибутивная решётка и булева алгебра";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
