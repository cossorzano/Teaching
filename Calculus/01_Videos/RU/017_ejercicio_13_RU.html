<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>𝒫(U) — булева алгебра</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>Запомним</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Начать</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Скорость <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Режим записи (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"ru-RU",

"steps":[
{"title": "𝒫(U) — булева алгебра", "sub": "Упражнение · Алгебра множеств", "clear": 1, "say": "Здравствуйте. В этом видео мы решим упражнение об алгебре множеств. Мы будем двигаться очень медленно, записывая каждое равенство и обосновывая каждый шаг.", "L": [["txt", "Доказать, что множество всех подмножеств U с объединением, пересечением и дополнением — булева алгебра"]]},

{"say": "Сначала данные. У — множество, а множество всех его подмножеств обозначается Пэ от У. Мы знаем, что множество всех подмножеств У с объединением и пересечением образует дистрибутивную решётку.", "L": [["hyp", "(𝒫(U), ∪, ∩) — дистрибутивная решётка<span class='tag'>Гипотеза</span>"]]},

{"say": "Для каждого подмножества А множества У определим его дополнение как множество тех иксов из У, которые не принадлежат А.", "L": [["sub", "A<sup>c</sup> = { x ∈ U | x ∉ A }<span class='tag'>Определение дополнения</span>"]]},

{"say": "Что мы хотим доказать. Множество всех подмножеств У с объединением, пересечением и дополнением является булевой алгеброй.", "L": [["goal", "(𝒫(U), ∪, ∩, <sup>c</sup>) — булева алгебра<span class='tag'>Утверждение</span>"]]},

{"say": "Для этого, помимо того, что это уже дистрибутивная решётка, нужно проверить две вещи. Первое: существование наименьшего элемента, нуля, и наибольшего, единицы. Второе: что каждый элемент А, подмножество У, имеет дополнение. Запишем слева определения объединения и пересечения через элементы, а также определение дополнения, которыми мы будем пользоваться.", "L": [["goal", "(1)  Существуют наименьший элемент 0 и наибольший 1"], ["goal", "(2)  Каждое A ⊆ U имеет дополнение<span class='tag'>Что нужно проверить</span>"]], "pin": ["(Опр ∪) x ∈ X ∪ Y ⇔ x ∈ X или x ∈ Y", "(Опр ∩) x ∈ X ∩ Y ⇔ x ∈ X и x ∈ Y", "(Опр c) x ∈ A<sup>c</sup> ⇔ x ∈ U и x ∉ A"]},

{"title": "(1) Наименьший и наибольший элементы", "clear": 1, "say": "Начнём с наименьшего элемента. Пустое множество — наименьший элемент. Чтобы доказать это, пусть А — произвольное подмножество У. Проверим два равенства.", "L": [["txt", "Пусть A ⊆ U  (произвольное)"], ["goal", "Хотим:  ∅ — наименьший элемент"]]},

{"say": "Первое равенство. Пустое множество объединение А равно А.", "L": [["sub", "∅ ∪ A = A<span class='tag'>Пустое множество не добавляет элементов</span>"]]},

{"say": "Второе равенство. Пустое множество пересечение А равно пустому множеству.", "L": [["sub", "∅ ∩ A = ∅<span class='tag'>У пустого множества нет общих элементов с A</span>"]]},

{"say": "Следовательно, пустое множество — наименьший элемент.", "L": [["res", "∅ — наименьший элемент   ∎"]]},

{"say": "Продолжим с наибольшим элементом. Всё множество У — наибольший элемент. Чтобы доказать это, пусть А — произвольное подмножество У. Проверим два равенства.", "L": [["txt", "Пусть A ⊆ U  (произвольное)"], ["goal", "Хотим:  U — наибольший элемент"]], "title": "Наибольший элемент", "clear": 1},

{"say": "Первое равенство. А объединение У равно У.", "L": [["sub", "A ∪ U = U<span class='tag'>U уже содержит все элементы</span>"]]},

{"say": "Второе равенство. А пересечение У равно А.", "L": [["sub", "A ∩ U = A<span class='tag'>Элементы A лежат в U</span>"]]},

{"say": "Следовательно, всё множество У — наибольший элемент.", "L": [["res", "U — наибольший элемент   ∎"]]},

{"say": "Итак, пустое множество — нейтральный элемент объединения, а У — нейтральный элемент пересечения. То есть ноль — это пустое множество, а единица — это У. Запишем их слева.", "L": [["res", "∅ — нейтральный элемент ∪   (0 = ∅)"], ["res", "U — нейтральный элемент ∩   (1 = U)"]], "title": "Нейтральные элементы", "clear": 1, "pin": ["(Нейтральные) ∅ ∪ A = A,   A ∩ U = A"]},

{"title": "(2) Существование дополнения", "clear": 1, "say": "Переходим к существованию дополнения. Пусть А — подмножество У. Докажем, что дополнение множества А является дополнением А в решётке. Для этого нужно проверить два условия: А объединение его дополнение есть У, и А пересечение его дополнение есть пустое множество.", "L": [["txt", "Пусть A ⊆ U"], ["goal", "(a)  A ∪ A<sup>c</sup> = U"], ["goal", "(b)  A ∩ A<sup>c</sup> = ∅<span class='tag'>Два условия дополнения</span>"]]},

{"title": "(a) Первое условие: A ∪ Aᶜ = U", "clear": 1, "say": "Первое условие. Хотим доказать, что А объединение его дополнение равно У. Пусть икс — элемент У. Исходим из того, что икс принадлежит А объединение дополнение А.", "L": [["goal", "Хотим:  A ∪ A<sup>c</sup> = U"], ["txt", "Пусть x ∈ U"], ["txt", "x ∈ A ∪ A<sup>c</sup>"]]},

{"say": "Первый шаг. По определению объединения, икс принадлежит А объединение дополнение А тогда и только тогда, когда икс принадлежит А, или икс принадлежит дополнению А.", "L": [["sub", "⇔  (x ∈ A  или  x ∈ A<sup>c</sup>)<span class='tag'>Определение ∪</span>"]]},

{"say": "Второй шаг. По определению дополнения, икс принадлежит дополнению А тогда и только тогда, когда икс не принадлежит А. Следовательно, имеем: икс принадлежит А, или икс не принадлежит А.", "L": [["sub", "⇔  (x ∈ A  или  x ∉ A)<span class='tag'>Определение дополнения</span>"]]},

{"say": "Это всегда верно: икс либо принадлежит А, либо нет. Значит, каждый элемент икс из У принадлежит А объединение его дополнение. Так как, кроме того, А и его дополнение — подмножества У, их объединение тоже подмножество У, и мы заключаем, что А объединение его дополнение равно У.", "L": [["res", "(x ∈ A  или  x ∉ A)  всегда верно<span class='tag'>Элемент либо принадлежит A, либо нет</span>"], ["res", "A ∪ A<sup>c</sup> = U   ∎"]]},

{"title": "(b) Второе условие: A ∩ Aᶜ = ∅", "clear": 1, "say": "Второе условие. Хотим доказать, что А пересечение его дополнение равно пустому множеству. Пусть икс — элемент У. Исходим из того, что икс принадлежит А пересечение дополнение А.", "L": [["goal", "Хотим:  A ∩ A<sup>c</sup> = ∅"], ["txt", "Пусть x ∈ U"], ["txt", "x ∈ A ∩ A<sup>c</sup>"]]},

{"say": "Первый шаг. По определению пересечения, икс принадлежит А пересечение дополнение А тогда и только тогда, когда икс принадлежит А, и икс принадлежит дополнению А.", "L": [["sub", "⇔  (x ∈ A  и  x ∈ A<sup>c</sup>)<span class='tag'>Определение ∩</span>"]]},

{"say": "Второй шаг. По определению дополнения, икс принадлежит дополнению А тогда и только тогда, когда икс не принадлежит А. Следовательно, имеем: икс принадлежит А, и икс не принадлежит А.", "L": [["sub", "⇔  (x ∈ A  и  x ∉ A)<span class='tag'>Определение дополнения</span>"]]},

{"say": "Это невозможно: икс не может одновременно принадлежать А и не принадлежать А. Значит, ни один элемент икс не принадлежит А пересечение его дополнение, и мы заключаем, что А пересечение его дополнение равно пустому множеству.", "L": [["res", "(x ∈ A  и  x ∉ A)  невозможно<span class='tag'>Ни один x не удовлетворяет обоим</span>"], ["res", "A ∩ A<sup>c</sup> = ∅   ∎"]]},

{"title": "У каждого элемента есть дополнение", "clear": 1, "say": "Мы доказали, что для любого подмножества А множества У, А объединение его дополнение есть У, а А пересечение его дополнение есть пустое множество. То есть у каждого элемента множества всех подмножеств У есть дополнение.", "L": [["res", "A ∪ A<sup>c</sup> = U<span class='tag'>Для любого A ⊆ U</span>"], ["res", "A ∩ A<sup>c</sup> = ∅<span class='tag'>Для любого A ⊆ U</span>"], ["res", "У каждого элемента 𝒫(U) есть дополнение   ∎"]]},

{"title": "Вывод", "clear": 1, "say": "Так как множество всех подмножеств У с объединением и пересечением — дистрибутивная решётка, с наименьшим элементом, пустым множеством, наибольшим элементом, У, и дополнением для каждого элемента, мы заключаем, что множество всех подмножеств У с объединением, пересечением и дополнением является булевой алгеброй. Спасибо за внимание.", "L": [["res", "(𝒫(U), ∪, ∩) — дистрибутивная решётка"], ["res", "Наименьший ∅,   наибольший U"], ["res", "У каждого A есть дополнение A<sup>c</sup>"], ["res", "(𝒫(U), ∪, ∩, <sup>c</sup>) — булева алгебра   ∎"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' плюс ').replace(/⊙/g,' умножить на ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Повторить'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Продолжить'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Пауза';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Пауза';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Пауза';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^ru/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/dmitry|pavel|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="𝒫(U) — булева алгебра";$('sub').textContent="Упражнение · Алгебра множеств";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
