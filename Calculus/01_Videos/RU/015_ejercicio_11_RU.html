<style>

{"title": "Ассоциативность ∪", "clear": 1, "say": "Переходим к ассоциативности объединения. Хотим доказать, что А объединение, Бэ объединение Цэ, равно, А объединение Бэ, объединение Цэ. Исходим из того, что икс принадлежит А объединение, Бэ объединение Цэ.", "L": [["goal", "Хотим:  A ∪ (B ∪ C) = (A ∪ B) ∪ C"], ["txt", "x ∈ A ∪ (B ∪ C)"]]},

{"say": "Четвёртый шаг. По определению объединения, это равносильно тому, что икс принадлежит, А объединение Бэ, объединение Цэ. Так как икс произволен, два множества равны.", "L": [["res", "⇔  x ∈ (A ∪ B) ∪ C<span class='tag'>Определение ∪</span>"], ["res", "A ∪ (B ∪ C) = (A ∪ B) ∪ C   ∎"]]},

{"say": "Второй шаг. По ассоциативности логической конъюнкции «и» можно убрать скобки: икс принадлежит А, и икс принадлежит Бэ, и икс принадлежит Цэ.", "L": [["sub", "⇔  (x ∈ A  и  x ∈ B  и  x ∈ C)<span class='tag'>Ассоциативность «и»</span>"]]},

{"say": "Третий шаг. Сгруппируем первые два члена. По определению пересечения, икс принадлежит А, и икс принадлежит Бэ, равносильно тому, что икс принадлежит А пересечение Бэ. Следовательно, икс принадлежит А пересечение Бэ, и икс принадлежит Цэ.", "L": [["sub", "⇔  (x ∈ A ∩ B)  и  x ∈ C<span class='tag'>Определение ∩</span>"]]},

{"say": "Четвёртый шаг. По определению пересечения, это равносильно тому, что икс принадлежит, А пересечение Бэ, пересечение Цэ. Так как икс произволен, два множества равны.", "L": [["res", "⇔  x ∈ (A ∩ B) ∩ C<span class='tag'>Определение ∩</span>"], ["res", "A ∩ (B ∩ C) = (A ∩ B) ∩ C   ∎"]]},

{"title": "Поглощение для ∪", "clear": 1, "say": "Закончим поглощением для объединения. Хотим доказать, что А объединение, А пересечение Бэ, равно А. Исходим из того, что икс принадлежит А объединение, А пересечение Бэ.", "L": [["goal", "Хотим:  A ∪ (A ∩ B) = A"], ["txt", "x ∈ A ∪ (A ∩ B)"]]},

{"say": "Первый шаг. По определению объединения, а затем пересечения, икс принадлежит А, или, икс принадлежит А и икс принадлежит Бэ.", "L": [["sub", "⇔  x ∈ A  или  (x ∈ A  и  x ∈ B)<span class='tag'>Определения ∪ и ∩</span>"]]},

{"say": "Второй шаг. Это равносильно тому, что икс принадлежит А. Если икс принадлежит А, первая часть дизъюнкции верна. Обратно, если дизъюнкция верна, то либо икс принадлежит А, либо икс принадлежит и А, и Бэ, и в обоих случаях икс принадлежит А.", "L": [["sub", "⇔  x ∈ A<span class='tag'>Если x ∈ A, дизъюнкция верна; если дизъюнкция верна, то x ∈ A</span>"]]},

{"say": "Третий шаг. Последняя строка снова записывает, что икс принадлежит А. Это принадлежность множеству в правой части равенства. Так как икс произволен, два множества равны.", "L": [["res", "⇔  x ∈ A"], ["res", "A ∪ (A ∩ B) = A   ∎"]]},

{"title": "Поглощение для ∩", "clear": 1, "say": "И поглощение для пересечения. Хотим доказать, что А пересечение, А объединение Бэ, равно А. Исходим из того, что икс принадлежит А пересечение, А объединение Бэ.", "L": [["goal", "Хотим:  A ∩ (A ∪ B) = A"], ["txt", "x ∈ A ∩ (A ∪ B)"]]},

<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' плюс ').replace(/⊙/g,' умножить на ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Повторить'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Продолжить'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Пауза';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Пауза';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Пауза';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^ru/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/dmitry|pavel|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="𝒫(U) — решётка";$('sub').textContent="Упражнение · Алгебраические решётки";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
