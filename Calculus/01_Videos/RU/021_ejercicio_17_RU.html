<title>Модули и множества</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>Запомним</h2><div id="pins"></div></div><div id="board"></div></div>

{"title": "4) Пересечение A ∩ B", "clear": 1, "say": "Шаг четвёртый. Пересечение. По определению, А пересечение Бэ — это множество действительных чисел икс, таких что икс принадлежит А, и икс принадлежит Бэ.", "L": [["sub", "A ∩ B = { x ∈ ℝ | x ∈ A  и  x ∈ B }<span class='tag'>Определение пересечения</span>"]]},

{"say": "Подставим. Принадлежать А значит, что икс между минус двумя и двумя. Принадлежать Бэ значит, что икс между одной второй и пятью вторыми. И то и другое одновременно значит, что икс больше одной второй, потому что это самое сильное условие снизу, и икс меньше двух, это самое сильное условие сверху. Следовательно, пересечение — интервал от одной второй до двух.", "L": [["txt", "Подставляя A и B:"], ["sub", "A ∩ B = (−2, 2) ∩ (1/2, 5/2)"], ["sub", "x &gt; −2  и  x &gt; 1/2  ⟹  x &gt; 1/2          x &lt; 2  и  x &lt; 5/2  ⟹  x &lt; 2"], ["res", "A ∩ B = (1/2, 2)"], ["txt", "<svg viewBox='0 0 470 150' width='100%' style='max-width:520px;display:block' xmlns='http://www.w3.org/2000/svg'><text x='0' y='15' fill='#7cc4ff' font-size='15' font-family='Georgia,serif'>A = (−2, 2)</text><line x1='30.0' y1='24' x2='440.0' y2='24' stroke='#3d5a50' stroke-width='2'/><line x1='67.27272727272728' y1='24' x2='365.45454545454544' y2='24' stroke='#7cc4ff' stroke-width='6'/><circle cx='67.27272727272728' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><circle cx='365.45454545454544' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><text x='0' y='49' fill='#ffd166' font-size='15' font-family='Georgia,serif'>B = (1/2, 5/2)</text><line x1='30.0' y1='58' x2='440.0' y2='58' stroke='#3d5a50' stroke-width='2'/><line x1='253.63636363636363' y1='58' x2='402.72727272727275' y2='58' stroke='#ffd166' stroke-width='6'/><circle cx='253.63636363636363' cy='58' r='7' fill='#16231f' stroke='#ffd166' stroke-width='3'/><circle cx='402.72727272727275' cy='58' r='7' fill='#16231f' stroke='#ffd166' stroke-width='3'/><text x='0' y='83' fill='#7be0a0' font-size='15' font-family='Georgia,serif'>A ∩ B</text><line x1='30.0' y1='92' x2='440.0' y2='92' stroke='#3d5a50' stroke-width='2'/><line x1='253.63636363636363' y1='92' x2='365.45454545454544' y2='92' stroke='#7be0a0' stroke-width='6'/><circle cx='253.63636363636363' cy='92' r='7' fill='#16231f' stroke='#7be0a0' stroke-width='3'/><circle cx='365.45454545454544' cy='92' r='7' fill='#16231f' stroke='#7be0a0' stroke-width='3'/><line x1='67.27272727272728' y1='116' x2='67.27272727272728' y2='124' stroke='#9fb3aa'/><text x='67.27272727272728' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>−2</text><line x1='216.36363636363637' y1='116' x2='216.36363636363637' y2='124' stroke='#9fb3aa'/><text x='216.36363636363637' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>0</text><line x1='253.63636363636363' y1='116' x2='253.63636363636363' y2='124' stroke='#9fb3aa'/><text x='253.63636363636363' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>1/2</text><line x1='365.45454545454544' y1='116' x2='365.45454545454544' y2='124' stroke='#9fb3aa'/><text x='365.45454545454544' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>2</text><line x1='402.72727272727275' y1='116' x2='402.72727272727275' y2='124' stroke='#9fb3aa'/><text x='402.72727272727275' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>5/2</text></svg>"]]},

{"title": "5) Разность A ∖ B", "clear": 1, "say": "Шаг пятый. Разность А без Бэ. По определению, это множество действительных чисел икс, таких что икс принадлежит А, и икс не принадлежит Бэ.", "L": [["sub", "A ∖ B = { x ∈ ℝ | x ∈ A  и  x ∉ B }<span class='tag'>Определение разности</span>"]]},

{"say": "Подставим. Принадлежать А — это икс между минус двумя и двумя. Не принадлежать Бэ — это икс меньше или равен одной второй, или икс больше или равен пяти вторым. При икс, большем или равном пяти вторым, невозможно лежать в А, потому что А заканчивается в двух. Остаётся икс больше минус двух, и икс меньше или равен одной второй. Одна вторая лежит в А и не лежит в Бэ, поэтому она включается. Следовательно, А без Бэ — промежуток от минус двух, не включая, до одной второй, включая.", "L": [["txt", "Подставляя A и B:"], ["sub", "A ∖ B = (−2, 2) ∖ (1/2, 5/2)"], ["sub", "x ∉ B  ⟺  x ≤ 1/2  или  x ≥ 5/2"], ["warn", "x ≥ 5/2  и  x &lt; 2   →   невозможно"], ["res", "A ∖ B = (−2, 1/2]"], ["txt", "<svg viewBox='0 0 470 150' width='100%' style='max-width:520px;display:block' xmlns='http://www.w3.org/2000/svg'><text x='0' y='15' fill='#7cc4ff' font-size='15' font-family='Georgia,serif'>A = (−2, 2)</text><line x1='30.0' y1='24' x2='440.0' y2='24' stroke='#3d5a50' stroke-width='2'/><line x1='67.27272727272728' y1='24' x2='365.45454545454544' y2='24' stroke='#7cc4ff' stroke-width='6'/><circle cx='67.27272727272728' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><circle cx='365.45454545454544' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><text x='0' y='49' fill='#ffd166' font-size='15' font-family='Georgia,serif'>B = (1/2, 5/2)</text><line x1='30.0' y1='58' x2='440.0' y2='58' stroke='#3d5a50' stroke-width='2'/><line x1='253.63636363636363' y1='58' x2='402.72727272727275' y2='58' stroke='#ffd166' stroke-width='6'/><circle cx='253.63636363636363' cy='58' r='7' fill='#16231f' stroke='#ffd166' stroke-width='3'/><circle cx='402.72727272727275' cy='58' r='7' fill='#16231f' stroke='#ffd166' stroke-width='3'/><text x='0' y='83' fill='#7be0a0' font-size='15' font-family='Georgia,serif'>A ∖ B</text><line x1='30.0' y1='92' x2='440.0' y2='92' stroke='#3d5a50' stroke-width='2'/><line x1='67.27272727272728' y1='92' x2='253.63636363636363' y2='92' stroke='#7be0a0' stroke-width='6'/><circle cx='67.27272727272728' cy='92' r='7' fill='#16231f' stroke='#7be0a0' stroke-width='3'/><circle cx='253.63636363636363' cy='92' r='7' fill='#7be0a0' stroke='#7be0a0' stroke-width='3'/><line x1='67.27272727272728' y1='116' x2='67.27272727272728' y2='124' stroke='#9fb3aa'/><text x='67.27272727272728' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>−2</text><line x1='216.36363636363637' y1='116' x2='216.36363636363637' y2='124' stroke='#9fb3aa'/><text x='216.36363636363637' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>0</text><line x1='253.63636363636363' y1='116' x2='253.63636363636363' y2='124' stroke='#9fb3aa'/><text x='253.63636363636363' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>1/2</text><line x1='365.45454545454544' y1='116' x2='365.45454545454544' y2='124' stroke='#9fb3aa'/><text x='365.45454545454544' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>2</text><line x1='402.72727272727275' y1='116' x2='402.72727272727275' y2='124' stroke='#9fb3aa'/><text x='402.72727272727275' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>5/2</text></svg>"]]},

{"title": "6) Разность B ∖ A", "clear": 1, "say": "Шаг шестой. Разность Бэ без А. По определению, это множество действительных чисел икс, таких что икс принадлежит Бэ, и икс не принадлежит А.", "L": [["sub", "B ∖ A = { x ∈ ℝ | x ∈ B  и  x ∉ A }<span class='tag'>Определение разности</span>"]]},

<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' плюс ').replace(/⊙/g,' умножить на ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Повторить'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Продолжить'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Пауза';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Пауза';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Пауза';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^ru/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/dmitry|pavel|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Модули и множества";$('sub').textContent="Упражнение · Алгебра множеств";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
