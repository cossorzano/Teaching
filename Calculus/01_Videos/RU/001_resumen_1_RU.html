"steps":[
{"title": "Решётки и булевы алгебры", "sub": "Теория · Множества и операции", "clear": 1, "say": "Здравствуйте. В этом видео мы разберём теорию, которой будем пользоваться во всей главе: как формализовать операции над множествами и какая алгебраическая структура возникает, когда мы их комбинируем. Мы будем двигаться очень медленно, определение за определением, с примерами на каждом шаге.", "L": [["txt", "Операции над множествами ⟶ алгебраические структуры"]]},

{"title": "1. Решётки", "clear": 1, "say": "Начнём с идеи. Объединение и пересечение множеств обладают многими свойствами. Вместо того чтобы доказывать их по одному, мы оставляем только самые существенные свойства и даём им имя: такая абстрактная структура называется решёткой.", "L": [["txt", "Объединение ∪ и пересечение ∩ имеют общие свойства"], ["goal", "Абстракция: решётка"]]},

{"say": "Пусть Бэ — произвольное множество с двумя внутренними бинарными операциями, которые мы обозначаем символами плюс в кружке и точка в кружке. Бинарная означает, что операция применяется сразу к двум элементам. Внутренняя означает, что результат остаётся в Бэ. Например, Бэ может быть множеством всех подмножеств универсального множества У, о котором мы поговорим позже, где плюсу в кружке соответствует объединение, а точке в кружке — пересечение.", "L": [["hyp", "B — множество,  ⊕, ⊙ : B × B ⟶ B<span class='tag'>Дано: две внутренние бинарные операции</span>"], ["txt", "Пример: B = множество подмножеств U,  ⊕ = ∪,  ⊙ = ∩"]]},

{"say": "Мы говорим, что Бэ с этими операциями является решёткой, если для всех а, бэ и цэ из Бэ выполняются три вида свойств. Первое — коммутативность: порядок двух элементов не важен. Для множеств: А объединение Бэ равно Бэ объединение А, и А пересечение Бэ равно Бэ пересечение А.", "L": [["hyp", "a ⊕ b = b ⊕ a,     a ⊙ b = b ⊙ a<span class='tag'>Коммутативность</span>"], ["txt", "Для множеств:  A ∪ B = B ∪ A,   A ∩ B = B ∩ A"]]},

{"say": "Второе — ассоциативность: когда мы применяем операцию к трём элементам, неважно, какие два сгруппировать первыми. Благодаря этому можно писать а плюс бэ плюс цэ без скобок, без всякой двусмысленности.", "L": [["hyp", "a ⊕ (b ⊕ c) = (a ⊕ b) ⊕ c<span class='tag'>Ассоциативность ⊕</span>"], ["hyp", "a ⊙ (b ⊙ c) = (a ⊙ b) ⊙ c<span class='tag'>Ассоциативность ⊙</span>"]]},

{"say": "Третье — поглощение, которое связывает две операции между собой. Если к элементу а прибавить его произведение с любым другим элементом, снова получится а. И то же самое, если поменять операции местами.", "L": [["hyp", "a ⊕ (a ⊙ b) = a<span class='tag'>Поглощение 1</span>"], ["hyp", "a ⊙ (a ⊕ b) = a<span class='tag'>Поглощение 2</span>"]]},

{"say": "Посмотрим, почему это естественно для множеств. А объединение, А пересечение Бэ, должно равняться А: пересечение содержится в А, поэтому объединение его с А ничего нового не добавляет. Вот почему А поглощает пересечение.", "L": [["txt", "A ∩ B ⊆ A   ⟹   A ∪ (A ∩ B) = A"]]},

{"say": "Подведём итог. Решётка — это множество с двумя внутренними операциями, которые коммутативны, ассоциативны и удовлетворяют двум законам поглощения. Запишем это слева.", "pin": "Решётка: ⊕, ⊙ внутренние, коммутативные, ассоциативные, с поглощением"},

{"say": "Из этих аксиом доказывается, что обе операции идемпотентны: применение операции к элементу и к нему же самому ничего не меняет. Для множеств: А объединение А равно А, и А пересечение А равно А.", "L": [["res", "a ⊕ a = a,     a ⊙ a = a<span class='tag'>Идемпотентность (доказывается через поглощение)</span>"], ["txt", "Для множеств:  A ∪ A = A,  A ∩ A = A"]]},

{"title": "2. Дистрибутивные решётки", "clear": 1, "say": "Перейдём к дополнительному, очень важному свойству: дистрибутивности. Решётка называется дистрибутивной, если каждая операция дистрибутивна относительно другой.", "L": [["goal", "Дистрибутивная решётка"]]},

{"say": "Запишем оба закона. Первый говорит, что а плюс, бэ умножить на цэ, равно, а плюс бэ, всё это умножить на, а плюс цэ. Второй такой же, только роли меняются местами.", "L": [["hyp", "a ⊕ (b ⊙ c) = (a ⊕ b) ⊙ (a ⊕ c)"], ["hyp", "a ⊙ (b ⊕ c) = (a ⊙ b) ⊕ (a ⊙ c)"]]},

{"say": "Обратите внимание на важное отличие от привычной алгебры. Для чисел умножение дистрибутивно относительно сложения, но сложение не дистрибутивно относительно умножения. Здесь же, наоборот, оба закона выполняются одновременно.", "L": [["txt", "Числа:  a·(b + c) = a·b + a·c   ✔"], ["warn", "Числа:  a + (b·c) = (a + b)·(a + c)   ✘<span class='tag'>Неверно для чисел</span>"], ["res", "В дистрибутивной решётке верны оба"]]},

{"say": "Это свойство ключевое, потому что позволяет превращать сложные выражения в более простые комбинации. Запишем его.", "pin": "Дистрибутивность: ⊕ и ⊙ дистрибутивны друг относительно друга"},

{"title": "3. Булевы алгебры", "clear": 1, "say": "Теперь добавим ещё структуры. Представьте дистрибутивную решётку, в которой есть наименьший элемент, который мы называем нулём, и наибольший элемент, который мы называем единицей. Для множеств это будут пустое множество и универсальное множество.", "L": [["goal", "Дистрибутивная решётка + 0 + 1 + дополнения"]]},

{"say": "Ноль и единица ведут себя как нейтральные элементы. Прибавление нуля к элементу его не меняет, и умножение на единицу тоже. Для множеств: А объединение пустое множество есть А, и А пересечение универсальное множество У есть А.", "L": [["hyp", "a ⊕ 0 = a,     a ⊙ 1 = a<span class='tag'>Нейтральные элементы</span>"], ["txt", "Для множеств:  A ∪ ∅ = A,   A ∩ U = A"]]},

{"say": "Кроме того, мы требуем, чтобы у каждого элемента а было дополнение, которое мы обозначаем тильдой перед ним. Дополнение удовлетворяет сразу двум условиям. Вместе с а в сумме оно даёт единицу. В произведении с а оно даёт ноль. Для множеств: А объединение его дополнение есть универсальное множество У, а А пересечение его дополнение есть пустое множество.", "L": [["hyp", "a ⊕ ∼a = 1<span class='tag'>Дополнение</span>"], ["hyp", "a ⊙ ∼a = 0<span class='tag'>Дополнение</span>"], ["txt", "Для множеств:  A ∪ A<sup>c</sup> = U,   A ∩ A<sup>c</sup> = ∅"]]},

{"say": "Когда выполнены все эти условия, структура называется булевой алгеброй. Запишем её слева, рядом с предыдущими.", "pin": "Булева алгебра: дистрибутивность + 0, 1 + дополнения"},

{"say": "В булевой алгебре дополнение каждого элемента единственно. И выполняется закон инволюции: дополнение дополнения а есть само а. Для множеств: дополнение дополнения А есть А.", "L": [["res", "∼(∼a) = a<span class='tag'>Инволюция</span>"], ["txt", "Для множеств:  (A<sup>c</sup>)<sup>c</sup> = A"]]},

{"say": "Выполняются и законы доминирования. Если прибавить единицу к любому элементу, получится единица. Если умножить любой элемент на ноль, получится ноль. Заметьте, что единица доминирует в сумме, а ноль — в произведении. Для множеств: А объединение У есть У, а А пересечение пустое множество есть пустое множество.", "L": [["res", "a ⊕ 1 = 1,     a ⊙ 0 = 0<span class='tag'>Доминирование</span>"], ["txt", "Для множеств:  A ∪ U = U,   A ∩ ∅ = ∅"]]},

{"say": "И законы де Моргана. Сумма а и бэ есть дополнение произведения дополнений. И второй закон, с операциями, поменянными местами. Они позволяют переходить от одной операции к другой через дополнение. Для множеств: А объединение Бэ есть дополнение, дополнения А пересечение дополнение Бэ. А пересечение Бэ есть дополнение, дополнения А объединение дополнение Бэ.", "L": [["res", "a ⊕ b = ∼(∼a ⊙ ∼b)"], ["res", "a ⊙ b = ∼(∼a ⊕ ∼b)<span class='tag'>Законы де Моргана</span>"], ["txt", "Для множеств:  A ∪ B = (A<sup>c</sup> ∩ B<sup>c</sup>)<sup>c</sup>"], ["txt", "Для множеств:  A ∩ B = (A<sup>c</sup> ∪ B<sup>c</sup>)<sup>c</sup>"]]},

{"say": "Важнейшая особенность — принцип двойственности. Любое верное тождество остаётся верным, если поменять местами две операции и одновременно ноль и единицу. Рассмотрим пример: если а плюс ноль равно а, то а умножить на единицу равно а.", "L": [["sub", "a ⊕ 0 = a<span class='tag'>Верное тождество</span>"], ["sub", "⊕ ↔ ⊙,   0 ↔ 1<span class='tag'>Двойственная замена</span>"], ["res", "a ⊙ 1 = a<span class='tag'>Двойственное тождество, тоже верное</span>"]]},

{"title": "4. Булева алгебра множеств", "clear": 1, "say": "Теперь воплотим всё это на множествах. Для универсального множества У множеством его подмножеств называется множество, состоящее из всех подмножеств У. Оно обозначается каллиграфической заглавной буквой Пэ. Например, если У — множество из единицы и двойки, то у него четыре подмножества: пустое множество, множество из единицы, множество из двойки и множество из единицы и двойки.", "L": [["txt", "P(U) = { A | A ⊆ U }"], ["txt", "Пример: U = {1, 2}  ⟹  P(U) = { ∅, {1}, {2}, {1,2} }"]]},

{"say": "С объединением и пересечением в качестве операций множество подмножеств У является булевой алгеброй. Эта таблица — словарь между абстрактным языком и языком множеств.", "L": [["hyp", "⊕  ⟷  ∪   (объединение)"], ["hyp", "⊙  ⟷  ∩   (пересечение)"], ["hyp", "0  ⟷  ∅   (пустое множество)"], ["hyp", "1  ⟷  U   (универсальное множество)"], ["hyp", "∼A  ⟷  A<sup>c</sup>   (дополнение)"]]},

{"say": "Дополнение А — это множество элементов У, которые не принадлежат А. Например, если У состоит из единицы, двойки и тройки, а А — из единицы, то дополнение А состоит из двойки и тройки.", "L": [["sub", "A<sup>c</sup> = { x ∈ U | x ∉ A }<span class='tag'>Определение</span>"], ["txt", "Пример: U = {1,2,3},  A = {1}  ⟹  A<sup>c</sup> = {2,3}"]]},

{"say": "Ещё один полезный факт. Два множества А и Бэ равны тогда и только тогда, когда каждое из них содержится в другом. Это обычный способ доказывать равенства: доказать два включения по отдельности.", "L": [["sub", "A = B  ⟺  A ⊆ B  и  B ⊆ A"], ["txt", "Чтобы доказать A ⊆ B: взять x ∈ A и вывести x ∈ B"]]},

{"title": "5. Разность и симметрическая разность", "clear": 1, "say": "С помощью дополнения определяются и другие операции. Разность А минус Бэ — это множество элементов, которые лежат в А, но не лежат в Бэ. Например, множество из единицы, двойки и тройки минус множество из двойки есть множество из единицы и тройки.", "L": [["sub", "A ∖ B = { x ∈ A | x ∉ B } = A ∩ B<sup>c</sup><span class='tag'>Разность</span>"], ["txt", "Пример: {1,2,3} ∖ {2} = {1,3}"]]},

{"say": "Равенство с А пересечение дополнение Бэ очень полезно: оно позволяет превратить разность в пересечение и использовать все уже известные свойства. Учтите, что разность не коммутативна.", "L": [["warn", "A ∖ B ≠ B ∖ A  (в общем случае)<span class='tag'>Осторожно</span>"]]},

{"say": "Симметрическая разность собирает элементы, которые лежат ровно в одном из двух множеств. Она получается объединением А минус Бэ и Бэ минус А. Например, пусть А состоит из единицы и двойки, а Бэ — из двойки и тройки. А минус Бэ — это единица, Бэ минус А — тройка, а их объединение — единица и тройка.", "L": [["sub", "A △ B = (A ∖ B) ∪ (B ∖ A)<span class='tag'>Симметрическая разность</span>"], ["txt", "Пример: {1,2} △ {2,3} = {1} ∪ {3} = {1,3}"]]},

{"say": "Эти операции удовлетворяют тождествам, которые позволяют переписывать выражения. Симметрическая разность — это объединение без пересечения: то, что лежит хотя бы в одном из множеств, за вычетом того, что лежит в обоих. Второе тождество говорит, что А минус Бэ есть симметрическая разность А и А пересечение Бэ. Проверим первое на предыдущем примере: объединение — это единица, двойка и тройка; пересечение — двойка; а единица, двойка и тройка без двойки — это единица и тройка, что совпадает с результатом.", "L": [["res", "A △ B = (A ∪ B) ∖ (A ∩ B)"], ["res", "A ∖ B = A △ (A ∩ B)"], ["txt", "Проверка на предыдущем примере: (A ∪ B) ∖ (A ∩ B) = {1,2,3} ∖ {2} = {1,3} ✔"]]},

{"title": "6. Декартово произведение", "clear": 1, "say": "Последняя конструкция: декартово произведение. Для множеств А один, А два, и так далее до А эн, их произведение — это множество наборов из эн элементов, в которых компонента с номером и принадлежит множеству А и.", "L": [["sub", "A₁ × A₂ × ⋯ × Aₙ = { (x₁, x₂, …, xₙ) | xᵢ ∈ Aᵢ }<span class='tag'>Определение</span>"]]},

{"say": "Рассмотрим пример с двумя множествами. А состоит из единицы и двойки, а Бэ — из а и бэ. Их произведение содержит все пары, у которых первая компонента из А, а вторая из Бэ. Таких пар четыре. Порядок важен: произведение Бэ на А — другое.", "L": [["txt", "A = {1,2},   B = {a,b}"], ["res", "A × B = { (1,a), (1,b), (2,a), (2,b) }"], ["warn", "A × B ≠ B × A  (в общем случае)"]]},

<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){const d=document.createElement('div');d.className='l hyp';d.innerHTML=s.pin;if(k<n)d.style.animation='none';pins.appendChild(d)}}
 board.scrollTop=board.scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' плюс ').replace(/⊙/g,' умножить на ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Повторить'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Продолжить'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Пауза';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Пауза';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Пауза';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^ru/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/dmitry|pavel|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Решётки и булевы алгебры";$('sub').textContent="Теория · Множества и операции";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
