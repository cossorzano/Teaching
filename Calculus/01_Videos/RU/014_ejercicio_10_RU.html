<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Принцип двойственности</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>Запомним</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Начать</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Скорость <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Режим записи (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"ru-RU",
"meta":{"nivel": 2, "titulo": "Принцип двойственности", "enunciado": "Пусть (B, ⊕, ⊙, ∼, 0, 1) — булева алгебра.  С помощью принципа двойственности записать и проверить двойственные тождества для:", "tesis": "(a)  a ⊕ 1 = 1,   (b)  a ⊕ (a ⊙ b) = a", "datos": ["(Двойств)  ⊕ ↔ ⊙,   0 ↔ 1", "(Погл)  a ⊕ 1 = 1,   a ⊙ 0 = 0", "(Abs)  a ⊕ (a ⊙ b) = a,   a ⊙ (a ⊕ b) = a"]},
"steps":[
{"title": "Принцип двойственности", "sub": "Упражнение · Булева алгебра", "clear": 1, "say": "Здравствуйте. В этом видео мы решим упражнение о булевых алгебрах. Мы будем двигаться очень медленно, записывая каждое равенство и обосновывая каждый шаг.", "L": [["txt", "Применение принципа двойственности для получения новых тождеств"]]},

{"say": "Сначала данные. Бэ — множество с двумя операциями, суммой и произведением, операцией дополнения и двумя выделенными элементами, нулём и единицей. Это булева алгебра. Типичный пример — множество всех подмножеств множества У, с объединением, пересечением и дополнением, где ноль — пустое множество, а единица — это У.", "L": [["hyp", "(B, ⊕, ⊙, ∼, 0, 1) — булева алгебра<span class='tag'>Гипотеза</span>"], ["txt", "Для множеств:  (𝒫(U), ∪, ∩, дополнение),   0 = ∅,   1 = U"]]},

{"say": "Вспомним принцип двойственности. Любое тождество, верное в булевой алгебре, остаётся верным, если одновременно заменить сумму на произведение, а ноль на единицу. Для множеств это означает замену объединения на пересечение, а пустого множества на У.", "L": [["sub", "⊕ ↔ ⊙,      0 ↔ 1<span class='tag'>Принцип двойственности: заменяем одновременно</span>"], ["txt", "Для множеств:  ∪ ↔ ∩,      ∅ ↔ U"]]},

{"say": "Запишем его слева, потому что именно им мы будем пользоваться во всём упражнении.", "pin": ["(Двойств) Любое верное тождество остаётся верным при замене ⊕ ↔ ⊙ и 0 ↔ 1"]},

{"say": "Что мы хотим сделать. Пункт а: исходя из закона поглощения единицей, а плюс единица равно единице, записать двойственное тождество и проверить, что оно тоже верно. Пункт бэ: исходя из закона поглощения, а плюс, а умножить на бэ, равно а, записать двойственное тождество и проверить, что оно тоже верно.", "L": [["goal", "(a)  Двойственное к  a ⊕ 1 = 1  и проверка, что оно верно"], ["goal", "(b)  Двойственное к  a ⊕ (a ⊙ b) = a  и проверка, что оно верно<span class='tag'>Утверждение</span>"]]},

{"title": "(a) Двойственное к закону поглощения единицей", "clear": 1, "say": "Пункт а. Исходное тождество — закон поглощения единицей: а плюс единица равно единице. Для множеств: А объединение У равно У. Запишем его слева, потому что это верное исходное тождество.", "L": [["sub", "a ⊕ 1 = 1<span class='tag'>Исходное тождество: поглощение единицей</span>"], ["txt", "Для множеств:  A ∪ U = U"]], "pin": ["(Погл) a ⊕ 1 = 1"]},

{"say": "Применяя принцип двойственности, заменяем сумму на произведение, а единицу на ноль. В тождестве одна сумма и две единицы, поэтому сумму меняем на произведение, а обе единицы на нули.", "L": [["sub", "⊕ → ⊙,      1 → 0<span class='tag'>Двойственная замена</span>"], ["txt", "a ⊕ 1 = 1   превращается в   a ⊙ 0 = 0"]]},

{"say": "Получаем двойственное тождество: а умножить на ноль равно нулю. Для множеств: А пересечение пустое множество — пустое множество.", "L": [["res", "a ⊙ 0 = 0<span class='tag'>Двойственное тождество</span>"], ["txt", "Для множеств:  A ∩ ∅ = ∅"]]},

{"say": "Теперь проверим, что оно верно. Это равенство — в точности закон поглощения нулём, уже доказанный. Запишем его слева. Следовательно, двойственное тождество тоже верно. На этом пункт а закончен.", "L": [["res", "a ⊙ 0 = 0  — это закон поглощения нулём   ∎<span class='tag'>Двойственное тождество тоже верно</span>"]], "pin": ["(Погл) a ⊙ 0 = 0"]},

{"title": "(b) Двойственное к закону поглощения", "clear": 1, "say": "Пункт бэ. Исходное тождество — закон поглощения: а плюс, а умножить на бэ, равно а. Для множеств: А объединение, А пересечение Бэ, равно А. Запишем его слева.", "L": [["sub", "a ⊕ (a ⊙ b) = a<span class='tag'>Исходное тождество: закон поглощения</span>"], ["txt", "Для множеств:  A ∪ (A ∩ B) = A"]], "pin": ["(Abs) a ⊕ (a ⊙ b) = a"]},

{"say": "Применяя принцип двойственности, заменяем сумму на произведение и наоборот. В этом тождестве нет ни нуля, ни единицы, поэтому мы только меняем сумму на произведение, а произведение на сумму.", "L": [["sub", "⊕ ↔ ⊙<span class='tag'>Двойственная замена</span>"], ["txt", "a ⊕ (a ⊙ b) = a   превращается в   a ⊙ (a ⊕ b) = a"]]},

{"say": "Получаем двойственное тождество: а умножить на, а плюс бэ, равно а. Для множеств: А пересечение, А объединение Бэ, равно А.", "L": [["res", "a ⊙ (a ⊕ b) = a<span class='tag'>Двойственное тождество</span>"], ["txt", "Для множеств:  A ∩ (A ∪ B) = A"]]},

{"say": "Теперь проверим, что оно верно. Это равенство — второй закон поглощения, верный в любой решётке, а значит, и в булевой алгебре. Запишем его слева. На этом пункт бэ закончен.", "L": [["res", "a ⊙ (a ⊕ b) = a  — это второй закон поглощения   ∎<span class='tag'>Верно в любой решётке, а значит, и в булевой алгебре</span>"]], "pin": ["(Abs) a ⊙ (a ⊕ b) = a"]},

{"title": "Вывод", "clear": 1, "say": "Мы заключаем, что после доказательства тождества двойственное к нему тождество автоматически верно, без нового независимого доказательства. Для множеств: если равенство множеств верно, то верно и равенство, полученное заменой объединения на пересечение, а пустого множества на У. Спасибо за внимание.", "L": [["res", "Верное тождество  ⟹  двойственное к нему тоже верно"], ["res", "(a)  a ⊕ 1 = 1   ⟹   a ⊙ 0 = 0"], ["res", "(b)  a ⊕ (a ⊙ b) = a   ⟹   a ⊙ (a ⊕ b) = a"], ["txt", "Для множеств:  ∪ ↔ ∩,   ∅ ↔ U"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' плюс ').replace(/⊙/g,' умножить на ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Повторить'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Продолжить'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Пауза';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Пауза';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Пауза';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^ru/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/dmitry|pavel|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Принцип двойственности";$('sub').textContent="Упражнение · Булева алгебра";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
