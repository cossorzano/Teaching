<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Порядок в решётке</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(15px,1.9vw,24px)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>Запомним</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Начать</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Скорость <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Режим записи (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"ru-RU",
"meta":{"nivel": 2, "titulo": "Порядок в решётке", "enunciado": "Пусть (B, ⊕, ⊙) — решётка. Определим на B отношение  x ≤ y ⇔ x ⊕ y = y.  Доказать, что для любых a, b ∈ B:", "tesis": "a ≤ a ⊕ b,   b ≤ a ⊕ b", "datos": ["(Комм)  x ⊕ y = y ⊕ x", "(Асс)  x ⊕ (y ⊕ z) = (x ⊕ y) ⊕ z", "(Идем)  x ⊕ x = x"]},
"steps":[
{"title": "Порядок в решётке", "sub": "Упражнение · Алгебраические решётки", "clear": 1, "say": "Здравствуйте. В этом видео мы решим упражнение об алгебраических решётках. Мы будем двигаться очень медленно, записывая каждое равенство и обосновывая каждый шаг.", "L": [["txt", "Отношение порядка, заданное через решёточную сумму"]]},

{"say": "Сначала данные. Бэ — множество с двумя операциями, решёточной суммой и решёточным произведением, и это решётка. То есть обе операции внутренние, коммутативные, ассоциативные и удовлетворяют законам поглощения.", "L": [["hyp", "(B, ⊕, ⊙) — решётка<span class='tag'>Гипотеза</span>"]]},

{"say": "В этом упражнении мы используем только три свойства суммы. Коммутативность: а плюс бэ равно бэ плюс а. Ассоциативность: а плюс, бэ плюс цэ, равно а плюс бэ, плюс цэ. И идемпотентность, которая является теоремой о решётках: а плюс а равно а. Закрепим их слева, потому что будем ими пользоваться.", "pin": ["(Комм) x ⊕ y = y ⊕ x", "(Асс) x ⊕ (y ⊕ z) = (x ⊕ y) ⊕ z", "(Идем) x ⊕ x = x"]},

{"say": "Теперь определение. На Бэ мы определяем отношение, меньше или равно, следующим образом. Икс меньше или равен игрек тогда и только тогда, когда икс плюс игрек равно игрек. Это определение: отношение меньше или равно означает, по определению, что, прибавив икс к игрек, мы получаем игрек. Для множеств это хорошо известное свойство: А содержится в Бэ тогда и только тогда, когда А объединение Бэ равно Бэ.", "L": [["sub", "x ≤ y  ⇔  x ⊕ y = y<span class='tag'>Определение ≤</span>"], ["txt", "Пример с множествами:  A ⊆ B  ⇔  A ∪ B = B"]]},

{"say": "Запишем определение тоже слева, под предыдущими свойствами, потому что это ключ к упражнению. Обратите внимание, что в левой колонке оно выделено.", "pin": ["(Опр) x ≤ y ⇔ x ⊕ y = y"]},

{"say": "Что нужно доказать. Для любых а и бэ из Бэ выполняются два утверждения: а меньше или равно а плюс бэ, и бэ меньше или равно а плюс бэ.", "L": [["goal", "∀ a, b ∈ B:   a ≤ a ⊕ b   и   b ≤ a ⊕ b<span class='tag'>Утверждение</span>"]]},

{"title": "Часть 1: a ≤ a ⊕ b", "clear": 1, "say": "Начнём с первого. Пусть а и бэ — два произвольных элемента Бэ. Мы хотим доказать, что а меньше или равно а плюс бэ.", "L": [["txt", "Пусть a, b ∈ B  (произвольные)"], ["goal", "Нужно:  a ≤ a ⊕ b<span class='tag'>Утверждение этой части</span>"]]},

{"say": "Напомним определение: икс меньше или равен игрек тогда и только тогда, когда икс плюс игрек равно игрек.", "L": [["hyp", "x ≤ y  ⇔  x ⊕ y = y<span class='tag'>Определение</span>"]]},

{"say": "Применим определение при икс, равном а, и игрек, равном а плюс бэ. Это законно, потому что сумма — внутренняя операция, а значит, а плюс бэ принадлежит Бэ.", "L": [["sub", "x = a,   y = a ⊕ b  ∈ B<span class='tag'>Выбор (⊕ внутренняя)</span>"]]},

{"say": "Подставляя, получаем: а меньше или равно а плюс бэ тогда и только тогда, когда а плюс, а плюс бэ, равно а плюс бэ.", "L": [["sub", "a ≤ a ⊕ b  ⇔  a ⊕ (a ⊕ b) = a ⊕ b<span class='tag'>Определение при x=a, y=a⊕b</span>"]]},

{"say": "Значит, достаточно доказать равенство справа: а плюс, а плюс бэ, равно а плюс бэ. Это уже не неравенство, а равенство, которое можно доказать с помощью свойств суммы.", "L": [["goal", "Достаточно доказать:  a ⊕ (a ⊕ b) = a ⊕ b<span class='tag'>Новое утверждение</span>"]]},

{"say": "Начнём с левой части, а плюс, а плюс бэ, и будем преобразовывать её шаг за шагом, пока не получим правую часть.", "L": [["txt", "a ⊕ (a ⊕ b)"]]},

{"say": "Первый шаг. Применим ассоциативность суммы при икс, равном а, игрек, равном а, и зэт, равном бэ. Переставим скобки: а плюс, а плюс бэ, превращается в а плюс а, плюс бэ.", "L": [["sub", "a ⊕ (a ⊕ b)  =  (a ⊕ a) ⊕ b<span class='tag'>Ассоциативность ⊕ при x=a, y=a, z=b</span>"]]},

{"say": "Второй шаг. В скобках стоит а плюс а. По идемпотентности а плюс а равно а. Выделим это.", "L": [["sub", "a ⊕ (a ⊕ b)  =  (<mark>a ⊕ a</mark>) ⊕ b"], ["txt", "По (Идем):  <mark>a ⊕ a</mark> = a"]]},

{"say": "Заменим этот блок на а. Остаётся а плюс бэ.", "L": [["sub", "(<mark>a</mark>) ⊕ b"], ["res", "a ⊕ (a ⊕ b)  =  a ⊕ b<span class='tag'>Идемпотентность ⊕</span>"]]},

{"say": "Мы доказали равенство. По равносильности, которую мы видели раньше, это равенство в точности означает, что а меньше или равно а плюс бэ. На этом первая часть закончена.", "L": [["res", "a ⊕ (a ⊕ b) = a ⊕ b   ⟹   a ≤ a ⊕ b   ∎"]]},

{"title": "Часть 2: b ≤ a ⊕ b", "clear": 1, "say": "Переходим ко второй части. При тех же произвольных а и бэ мы хотим доказать, что бэ меньше или равно а плюс бэ. Действуем так же, но здесь появится лишний шаг, потому что бэ стоит не на первом месте.", "L": [["txt", "Пусть a, b ∈ B  (произвольные)"], ["goal", "Нужно:  b ≤ a ⊕ b<span class='tag'>Утверждение этой части</span>"]]},

{"say": "Применим определение при икс, равном бэ, и игрек, равном а плюс бэ, которое снова принадлежит Бэ, потому что сумма — внутренняя операция.", "L": [["sub", "x = b,   y = a ⊕ b  ∈ B<span class='tag'>Выбор (⊕ внутренняя)</span>"], ["sub", "b ≤ a ⊕ b  ⇔  b ⊕ (a ⊕ b) = a ⊕ b<span class='tag'>Определение при x=b, y=a⊕b</span>"]]},

{"say": "Значит, достаточно доказать, что бэ плюс, а плюс бэ, равно а плюс бэ. Начнём с левой части.", "L": [["goal", "Достаточно доказать:  b ⊕ (a ⊕ b) = a ⊕ b<span class='tag'>Новое утверждение</span>"], ["txt", "b ⊕ (a ⊕ b)"]]},

{"say": "Первый шаг. Ассоциативность суммы при икс, равном бэ, игрек, равном а, и зэт, равном бэ. Переходим от бэ плюс, а плюс бэ, к бэ плюс а, плюс бэ.", "L": [["sub", "b ⊕ (a ⊕ b)  =  (b ⊕ a) ⊕ b<span class='tag'>Ассоциативность ⊕ при x=b, y=a, z=b</span>"]]},

{"say": "Второй шаг. Теперь в скобках стоит бэ плюс а, а нам нужно а плюс бэ. Применим коммутативность: бэ плюс а равно а плюс бэ.", "L": [["sub", "(<mark>b ⊕ a</mark>) ⊕ b"], ["txt", "По (Комм):  <mark>b ⊕ a</mark> = a ⊕ b"], ["sub", "b ⊕ (a ⊕ b)  =  (a ⊕ b) ⊕ b<span class='tag'>Коммутативность ⊕</span>"]]},

{"say": "Третий шаг. Мы хотим собрать два бэ вместе. Снова применим ассоциативность, теперь при икс, равном а, игрек, равном бэ, и зэт, равном бэ. Переходим от а плюс бэ, плюс бэ, к а плюс, бэ плюс бэ.", "L": [["sub", "b ⊕ (a ⊕ b)  =  a ⊕ (b ⊕ b)<span class='tag'>Ассоциативность ⊕ при x=a, y=b, z=b</span>"]]},

{"say": "Четвёртый шаг. В скобках стоит бэ плюс бэ. По идемпотентности бэ плюс бэ равно бэ. Выделим и заменим.", "L": [["sub", "a ⊕ (<mark>b ⊕ b</mark>)"], ["txt", "По (Идем):  <mark>b ⊕ b</mark> = b"], ["res", "b ⊕ (a ⊕ b)  =  a ⊕ b<span class='tag'>Идемпотентность ⊕</span>"]]},

{"say": "Мы доказали равенство. По определению это равенство означает, что бэ меньше или равно а плюс бэ. На этом вторая часть закончена.", "L": [["res", "b ⊕ (a ⊕ b) = a ⊕ b   ⟹   b ≤ a ⊕ b   ∎"]]},

{"title": "Итоги", "clear": 1, "say": "Подведём итоги. По определению меньше или равно, доказать, что икс меньше или равен игрек, значит доказать, что икс плюс игрек равно игрек. Для а меньше или равно а плюс бэ хватило ассоциативности и идемпотентности. Для бэ меньше или равно а плюс бэ понадобилась ещё и коммутативность. Итак, а плюс бэ больше или равно и а, и бэ. Спасибо за внимание.", "L": [["res", "a ≤ a ⊕ b   (ассоциативность + идемпотентность)"], ["res", "b ≤ a ⊕ b   (ассоциативность + коммутативность + ассоциативность + идемпотентность)"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' плюс ').replace(/⊙/g,' умножить на ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Повторить'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Продолжить'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Пауза';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Пауза';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Пауза';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^ru/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/dmitry|pavel|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Порядок в решётке";$('sub').textContent="Упражнение · Алгебраические решётки";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
