<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Решётки: идемпотентность ⊕ и ⊙</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--mut:#9fb3aa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#16231f}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3.2vw,40px);margin:12px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(16px,2.2vw,28px)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t">Алгебраические решётки: идемпотентность</h1><div id="sub">Математический анализ · Упражнение 1</div>
<div id="main"><div id="pin" class="pin"><h2>Гипотезы</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Начать</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Скорость <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Режим записи (H)</button><span id="cap"></span></div></div>
<script>
const A='a ⊕ a = a', S=(c,t)=>({c,t});
const meta={nivel:2,titulo:'Алгебраические решётки: идемпотентность',
 enunciado:'Пусть (B, ⊕, ⊙) — решётка. Доказать идемпотентность ⊕ и ⊙:',
 tesis:'∀a∈B:   a ⊕ a = a,   a ⊙ a = a',
 datos:['(Abs1)  x ⊕ (x ⊙ y) = x','(Abs2)  x ⊙ (x ⊕ y) = x']};
const steps=[
{title:'Алгебраические решётки: идемпотентность',sub:'Упражнение 1',clear:1,say:'Здравствуйте. В этом видео мы решим упражнение об алгебраических решётках. Мы будем двигаться очень медленно, записывая каждое равенство и обосновывая каждый шаг.',L:[S('txt','Доказать идемпотентность ⊕ и ⊙')]},
{say:'Сначала данные. B — множество с двумя операциями: решёточной суммой и решёточным произведением. Обе операции внутренние: если применить их к двум элементам B, результат тоже лежит в B.',L:[S('hyp','(B, ⊕, ⊙) — решётка<span class="tag">Гипотеза</span>'),S('hyp','⊕, ⊙ внутренние: x ⊕ y ∈ B,  x ⊙ y ∈ B<span class="tag">Гипотеза</span>')]},
{say:'Кроме того, они коммутативны и ассоциативны. Но обратите внимание: во всём доказательстве эти свойства нам не понадобятся. Мы будем использовать только законы поглощения.',L:[S('hyp','⊕, ⊙ коммутативны и ассоциативны<span class="tag">Гипотеза (не используется)</span>')]},
{say:'Вот первый закон поглощения, Abs1. Он утверждает, что для любых x и y из B выражение x ⊕ (x ⊙ y) равно x. Закрепим его слева, потому что это гипотеза, которой мы будем пользоваться.',pin:'(Abs1) x ⊕ (x ⊙ y) = x   ∀x,y∈B'},
{say:'И второй, Abs2: x ⊙ (x ⊕ y) равно x, тоже для всех x и y. Это та же идея, только операции поменялись местами.',pin:'(Abs2) x ⊙ (x ⊕ y) = x   ∀x,y∈B'},
{say:'Что нужно доказать: для каждого элемента a из B a ⊕ a равно a, и a ⊙ a равно a. Иначе говоря, если применить операцию к элементу и к нему же самому, он не меняется. Это свойство называется идемпотентностью.',L:[S('goal','Доказать: ∀a∈B, a ⊕ a = a  и  a ⊙ a = a<span class="tag">Цель</span>')]},
{title:'Часть 1: идемпотентность ⊕',clear:1,say:'Начнём с идемпотентности суммы. Возьмём произвольный элемент a из B. Поскольку он произвольный, всё, что мы докажем, будет верно для всех элементов.',L:[S('txt','Пусть a ∈ B  (произвольный)'),S('goal','Нужно: a ⊕ a = a<span class="tag">Цель</span>')]},
{say:'Начнём с Abs2. Напомним: x ⊙ (x ⊕ y) = x, и это верно для всех x и y из B.',L:[S('hyp','(Abs2)  x ⊙ (x ⊕ y) = x<span class="tag">Гипотеза</span>')]},
{say:'Раз Abs2 верен для любых x и y, то, в частности, он верен при x, равном a, и y, равном a. Это законно, потому что a принадлежит B.',L:[S('sub','x = a,   y = a<span class="tag">Выбор</span>')]},
{say:'Подставляем. Вместо x пишем a, и вместо y тоже пишем a. Слева получается a ⊙ (a ⊕ a), а справа x превращается в a. Назовём это равенство уравнением один.',L:[S('sub','a ⊙ (a ⊕ a) = a      (1)<span class="tag">Abs2 при x=a, y=a</span>')]},
{say:'Заметьте, что уже появилось a ⊕ a — именно то выражение, которое мы хотим упростить. Но нам ещё нужно избавиться от внешнего произведения. Для этого воспользуемся Abs1.',L:[S('hyp','(Abs1)  x ⊕ (x ⊙ y) = x<span class="tag">Гипотеза</span>')]},
{say:'Теперь возьмём x, равное a, но на этот раз y, равное a ⊕ a. Законно ли это? Да: поскольку сумма — внутренняя операция, a ⊕ a принадлежит B, а значит, может играть роль y.',L:[S('sub','x = a,   y = a ⊕ a  ∈ B<span class="tag">Выбор (⊕ внутренняя)</span>')]},
{say:'Подставляем в Abs1. x становится a, а y становится скобкой a ⊕ a. Получаем: a ⊕ (a ⊙ (a ⊕ a)) равно a. Это уравнение два.',L:[S('sub','a ⊕ ( a ⊙ (a ⊕ a) ) = a      (2)<span class="tag">Abs1 при x=a, y=a⊕a</span>')]},
{say:'А теперь ключевой шаг. Посмотрите внутрь скобки в уравнении два: там стоит ровно a ⊙ (a ⊕ a). По уравнению один это выражение равно a. Выделим его.',L:[S('sub','a ⊕ ( <mark>a ⊙ (a ⊕ a)</mark> ) = a      (2)'),S('txt','По (1):  <mark>a ⊙ (a ⊕ a)</mark> = a')]},
{say:'Заменяем этот блок на a. Уравнение два превращается в: a ⊕ a равно a.',L:[S('sub','a ⊕ ( <mark>a</mark> ) = a'),S('res','a ⊕ a = a   ∎<span class="tag">Вывод: ⊕ идемпотентна</span>')]},
{say:'Поскольку a было произвольным, это верно для любого a из B. Идемпотентность суммы доказана.',L:[S('res','∀a∈B:  a ⊕ a = a')]},
{title:'Часть 2: идемпотентность ⊙',clear:1,say:'Теперь идемпотентность произведения. Идея та же, но роли Abs1 и Abs2 меняются местами. Снова возьмём произвольный элемент a из B.',L:[S('txt','Пусть a ∈ B  (произвольный)'),S('goal','Нужно: a ⊙ a = a<span class="tag">Цель</span>')]},
{say:'На этот раз начнём с Abs1: x ⊕ (x ⊙ y) = x.',L:[S('hyp','(Abs1)  x ⊕ (x ⊙ y) = x<span class="tag">Гипотеза</span>')]},
{say:'Берём x, равное a, и y, равное a. Закон верен для всех x и y, а значит, в частности, и для этих.',L:[S('sub','x = a,   y = a<span class="tag">Выбор</span>')]},
{say:'Подставляя, получаем: a ⊕ (a ⊙ a) равно a. Это уравнение три. Теперь появилось a ⊙ a — то, что мы хотим упростить.',L:[S('sub','a ⊕ (a ⊙ a) = a      (3)<span class="tag">Abs1 при x=a, y=a</span>')]},
{say:'Теперь воспользуемся Abs2: x ⊙ (x ⊕ y) = x.',L:[S('hyp','(Abs2)  x ⊙ (x ⊕ y) = x<span class="tag">Гипотеза</span>')]},
{say:'Берём x, равное a, и y, равное a ⊙ a. Это законно, потому что произведение — внутренняя операция, а значит, a ⊙ a лежит в B.',L:[S('sub','x = a,   y = a ⊙ a  ∈ B<span class="tag">Выбор (⊙ внутренняя)</span>')]},
{say:'Подставляем: a ⊙ (a ⊕ (a ⊙ a)) равно a. Это уравнение четыре.',L:[S('sub','a ⊙ ( a ⊕ (a ⊙ a) ) = a      (4)<span class="tag">Abs2 при x=a, y=a⊙a</span>')]},
{say:'Посмотрите на внутреннюю скобку в уравнении четыре: это a ⊕ (a ⊙ a). По уравнению три она равна a.',L:[S('sub','a ⊙ ( <mark>a ⊕ (a ⊙ a)</mark> ) = a      (4)'),S('txt','По (3):  <mark>a ⊕ (a ⊙ a)</mark> = a')]},
{say:'Заменяя этот блок на a, получаем из уравнения четыре: a ⊙ a равно a.',L:[S('sub','a ⊙ ( <mark>a</mark> ) = a'),S('res','a ⊙ a = a   ∎<span class="tag">Вывод: ⊙ идемпотентна</span>')]},
{title:'Итоги',clear:1,say:'Подведём итоги. Используя только два закона поглощения и то, что операции внутренние, мы доказали, что для любого a из B a ⊕ a равно a, и a ⊙ a равно a. Оба раза мы действовали по одной схеме: применяли один закон поглощения при x и y, равных a, затем другой — при y, равном полученному результату, и делали подстановку. Спасибо за просмотр.',L:[S('res','∀a∈B:  a ⊕ a = a'),S('res','∀a∈B:  a ⊙ a = a')]}
];
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l.c;d.innerHTML=l.t;if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){const d=document.createElement('div');d.className='l hyp';d.textContent=s.pin;if(k<n)d.style.animation='none';pins.appendChild(d)}}
 board.scrollTop=board.scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();txt=txt.replace(/⊕/g,' плюс ').replace(/⊙/g,' умножить на ').replace(/[()]/g,', ').replace(/\s+/g,' ');const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang='ru-RU';
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Повторить'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Продолжить'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Пауза';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Пауза';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Пауза';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^ru/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/dmitry|pavel|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
document.body.addEventListener('click',()=>{},{once:true});
render(-1);$('cap').textContent='0 / '+steps.length;
</script></body></html>
