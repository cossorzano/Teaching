<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Симметрическая разность</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>Запомним</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Начать</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Скорость <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Режим записи (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"ru-RU",
"meta":{"nivel": 2, "titulo": "Симметрическая разность", "enunciado": "Доказать, что для любых множеств A и B выполняется:", "tesis": "A △ B = (A ∪ B) ∖ (A ∩ B)", "datos": ["(Опр △)  A △ B = (A ∖ B) ∪ (B ∖ A)"]},
"steps":[
{"title": "Симметрическая разность", "sub": "Упражнение · Алгебра множеств", "clear": 1, "say": "Здравствуйте. В этом видео мы докажем, что симметрическую разность двух множеств можно записать как объединение без пересечения. Мы будем рассуждать поэлементно, очень медленно, записывая каждое равенство и обосновывая каждый шаг.", "L": [["txt", "Доказать, что  A △ B = (A ∪ B) ∖ (A ∩ B)"]]},

{"say": "Что мы хотим доказать. Для любых множеств А и Бэ симметрическая разность А и Бэ равна объединению А и Бэ без пересечения А и Бэ. Слева мы вспоминаем определения, которыми будем пользоваться: симметрическая разность — это объединение А без Бэ и Бэ без А; разность, объединение и пересечение через элементы; и то, что два множества равны, когда каждое содержится в другом.", "L": [["goal", "A △ B = (A ∪ B) ∖ (A ∩ B)<span class='tag'>Доказать для любых A и B</span>"]], "pin": ["(Опр △) A △ B = (A ∖ B) ∪ (B ∖ A)", "(Опр ∖) x ∈ X ∖ Y  ⟺  x ∈ X  и  x ∉ Y", "(Опр ∪) x ∈ X ∪ Y  ⟺  x ∈ X  или  x ∈ Y", "(Опр ∩) x ∈ X ∩ Y  ⟺  x ∈ X  и  x ∈ Y", "(Опр ⊆) X ⊆ Y  ⟺  каждое x ∈ X удовлетворяет x ∈ Y", "(Опр =) X = Y  ⟺  X ⊆ Y  и  Y ⊆ X"]},

{"title": "План: двойное включение", "clear": 1, "say": "Мы будем рассуждать поэлементно. По определению равенства нужно доказать два включения. Первое: симметрическая разность А и Бэ содержится в объединении без пересечения. Второе: объединение без пересечения содержится в симметрической разности А и Бэ.", "L": [["goal", "(1)  A △ B ⊆ (A ∪ B) ∖ (A ∩ B)"], ["goal", "(2)  (A ∪ B) ∖ (A ∩ B) ⊆ A △ B"]]},

{"title": "(1) A △ B ⊆ (A ∪ B) ∖ (A ∩ B)", "clear": 1, "say": "Первое включение. По определению включения возьмём произвольный элемент икс из симметрической разности А и Бэ, и нам нужно доказать, что он принадлежит объединению без пересечения.", "L": [["hyp", "Пусть x ∈ A △ B"], ["goal", "Хотим:  x ∈ (A ∪ B) ∖ (A ∩ B)"]]},

{"say": "По определению симметрической разности, икс принадлежит объединению А без Бэ и Бэ без А. А по определению объединения это означает, что икс принадлежит А без Бэ, или икс принадлежит Бэ без А. Значит, выполняется хотя бы одна из двух возможностей, и мы рассмотрим их по отдельности.", "L": [["txt", "По (Опр △):"], ["sub", "x ∈ (A ∖ B) ∪ (B ∖ A)"], ["txt", "По (Опр ∪):"], ["hyp", "Случай (i):  x ∈ A ∖ B"], ["hyp", "Случай (ii):  x ∈ B ∖ A"]]},

{"clear": 1, "say": "Случай первый: икс принадлежит А без Бэ. По определению разности это означает, что икс принадлежит А, и икс не принадлежит Бэ.", "L": [["hyp", "Случай (i):  x ∈ A ∖ B"], ["txt", "По (Опр ∖):"], ["sub", "x ∈ A   и   x ∉ B"]]},

{"say": "Так как икс принадлежит А, в частности икс принадлежит А или икс принадлежит Бэ. По определению объединения, икс принадлежит объединению А и Бэ.", "L": [["txt", "x ∈ A  ⟹  x ∈ A  или  x ∈ B,  поэтому по (Опр ∪):"], ["res", "x ∈ A ∪ B"]]},

{"say": "Кроме того, икс не принадлежит Бэ, поэтому икс не может принадлежать А и Бэ одновременно. По определению пересечения, икс не принадлежит пересечению А и Бэ.", "L": [["txt", "x ∉ B  ⟹  неверно, что  x ∈ A  и  x ∈ B,  поэтому по (Опр ∩):"], ["res", "x ∉ A ∩ B"]]},

{"say": "Итак, икс принадлежит объединению, и икс не принадлежит пересечению. По определению разности, где икс большое — это А объединение Бэ, а игрек большое — А пересечение Бэ, икс принадлежит объединению без пересечения.", "L": [["txt", "x ∈ A ∪ B   и   x ∉ A ∩ B,  поэтому по (Опр ∖):"], ["res", "x ∈ (A ∪ B) ∖ (A ∩ B)"]]},

{"clear": 1, "say": "Случай второй: икс принадлежит Бэ без А. По определению разности, это значит, что икс принадлежит Бэ, а икс не принадлежит А.", "L": [["hyp", "Случай (ii):  x ∈ B ∖ A"], ["txt", "По (Опр ∖):"], ["sub", "x ∈ B   и   x ∉ A"]]},

{"say": "Так как икс принадлежит Бэ, в частности икс принадлежит А или икс принадлежит Бэ. По определению объединения, икс принадлежит объединению А и Бэ.", "L": [["txt", "x ∈ B  ⟹  x ∈ A  или  x ∈ B,  поэтому по (Опр ∪):"], ["res", "x ∈ A ∪ B"]]},

{"say": "Кроме того, икс не принадлежит А, поэтому икс не может принадлежать А и Бэ одновременно. По определению пересечения, икс не принадлежит пересечению А и Бэ.", "L": [["txt", "x ∉ A  ⟹  неверно, что  x ∈ A  и  x ∈ B,  поэтому по (Опр ∩):"], ["res", "x ∉ A ∩ B"]]},

{"say": "Итак, икс принадлежит объединению, и икс не принадлежит пересечению. По определению разности, икс принадлежит объединению без пересечения.", "L": [["txt", "x ∈ A ∪ B   и   x ∉ A ∩ B,  поэтому по (Опр ∖):"], ["res", "x ∈ (A ∪ B) ∖ (A ∩ B)"]]},

{"clear": 1, "say": "В обоих случаях икс принадлежит объединению без пересечения. Так как икс был произвольным элементом симметрической разности А и Бэ, первое включение доказано.", "L": [["txt", "В обоих случаях  x ∈ (A ∪ B) ∖ (A ∩ B),  поэтому:"], ["res", "A △ B ⊆ (A ∪ B) ∖ (A ∩ B)"]]},

{"title": "(2) (A ∪ B) ∖ (A ∩ B) ⊆ A △ B", "clear": 1, "say": "Второе включение. Возьмём произвольный элемент икс из объединения без пересечения, и нам нужно доказать, что он принадлежит симметрической разности А и Бэ.", "L": [["hyp", "Пусть x ∈ (A ∪ B) ∖ (A ∩ B)"], ["goal", "Хотим:  x ∈ A △ B"]]},

{"say": "По определению разности, икс принадлежит объединению А и Бэ, и икс не принадлежит пересечению А и Бэ.", "L": [["txt", "По (Опр ∖):"], ["sub", "x ∈ A ∪ B   и   x ∉ A ∩ B"]]},

{"say": "Первое условие, по определению объединения, говорит, что икс принадлежит А, или икс принадлежит Бэ. Второе условие, по определению пересечения, говорит, что неверно, что икс принадлежит А и Бэ одновременно.", "L": [["txt", "По (Опр ∪):  x ∈ A ∪ B  означает"], ["sub", "x ∈ A   или   x ∈ B"], ["txt", "По (Опр ∩):  x ∉ A ∩ B  означает"], ["sub", "не (x ∈ A  и  x ∈ B)"]]},

{"clear": 1, "say": "Объединяя два условия, получаем, что выполняется ровно одна из двух возможностей. Если икс принадлежит А, то, так как он не может принадлежать А и Бэ одновременно, икс не принадлежит Бэ. А если икс принадлежит Бэ, то по той же причине икс не принадлежит А. Рассмотрим эти два случая по отдельности.", "L": [["hyp", "Случай (i):  x ∈ A   и   x ∉ B"], ["hyp", "Случай (ii):  x ∈ B   и   x ∉ A"]]},

{"clear": 1, "say": "Случай первый: икс принадлежит А, и икс не принадлежит Бэ. По определению разности, икс принадлежит А без Бэ. А по определению объединения, где икс большое — это А без Бэ, икс принадлежит объединению А без Бэ и Бэ без А, а это по определению симметрическая разность А и Бэ.", "L": [["hyp", "Случай (i):  x ∈ A   и   x ∉ B"], ["txt", "По (Опр ∖):"], ["sub", "x ∈ A ∖ B"], ["txt", "По (Опр ∪) и (Опр △):"], ["res", "x ∈ (A ∖ B) ∪ (B ∖ A) = A △ B"]]},

{"clear": 1, "say": "Случай второй: икс принадлежит Бэ, и икс не принадлежит А. По определению разности, икс принадлежит Бэ без А. А по определению объединения, икс принадлежит объединению А без Бэ и Бэ без А, а это по определению симметрическая разность А и Бэ.", "L": [["hyp", "Случай (ii):  x ∈ B   и   x ∉ A"], ["txt", "По (Опр ∖):"], ["sub", "x ∈ B ∖ A"], ["txt", "По (Опр ∪) и (Опр △):"], ["res", "x ∈ (A ∖ B) ∪ (B ∖ A) = A △ B"]]},

{"clear": 1, "say": "В обоих случаях икс принадлежит симметрической разности А и Бэ. Так как икс был произвольным элементом объединения без пересечения, второе включение доказано.", "L": [["txt", "В обоих случаях  x ∈ A △ B,  поэтому:"], ["res", "(A ∪ B) ∖ (A ∩ B) ⊆ A △ B"]]},

{"title": "Вывод", "clear": 1, "say": "Вывод. Так как выполняются оба включения, по определению равенства симметрическая разность А и Бэ равна объединению А и Бэ без пересечения А и Бэ. Спасибо за внимание.", "L": [["txt", "(1)  A △ B ⊆ (A ∪ B) ∖ (A ∩ B)"], ["txt", "(2)  (A ∪ B) ∖ (A ∩ B) ⊆ A △ B"], ["res", "A △ B = (A ∪ B) ∖ (A ∩ B)"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' плюс ').replace(/⊙/g,' умножить на ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Повторить'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Продолжить'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Пауза';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Пауза';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Пауза';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^ru/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/dmitry|pavel|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Симметрическая разность";$('sub').textContent="Упражнение · Алгебра множеств";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
