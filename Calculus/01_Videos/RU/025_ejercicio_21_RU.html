<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Разность и симметрическая разность</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>Запомним</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Начать</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Скорость <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Режим записи (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"ru-RU",
"meta":{"nivel": 2, "titulo": "Разность и симметрическая разность", "enunciado": "Доказать, что для любых множеств A и B выполняется:", "tesis": "A ∖ B = A △ (A ∩ B)", "datos": ["(Опр △)  X △ Y = (X ∖ Y) ∪ (Y ∖ X)"]},
"steps":[
{"title": "A ∖ B = A △ (A ∩ B)", "sub": "Упражнение · Алгебра множеств", "clear": 1, "say": "Здравствуйте. В этом видео мы докажем, что А без Бэ равно симметрической разности А и пересечения А и Бэ. Мы будем рассуждать поэлементно, очень медленно, записывая каждое равенство и обосновывая каждый шаг.", "L": [["txt", "Доказать, что  A ∖ B = A △ (A ∩ B)"]]},

{"say": "Что мы хотим доказать. Для любых множеств А и Бэ множество А без Бэ равно симметрической разности А и пересечения А и Бэ. Слева мы вспоминаем определения, которыми будем пользоваться: симметрическая разность, разность, пересечение и объединение через элементы; то, что пустое множество не содержит элементов; и то, что два множества равны, когда каждое содержится в другом.", "L": [["goal", "A ∖ B = A △ (A ∩ B)<span class='tag'>Доказать для любых A и B</span>"]], "pin": ["(Опр △) X △ Y = (X ∖ Y) ∪ (Y ∖ X)", "(Опр ∖) x ∈ X ∖ Y  ⟺  x ∈ X  и  x ∉ Y", "(Опр ∩) x ∈ X ∩ Y  ⟺  x ∈ X  и  x ∈ Y", "(Опр ∪) x ∈ X ∪ Y  ⟺  x ∈ X  или  x ∈ Y", "(Опр ∅) ни одно x не удовлетворяет  x ∈ ∅", "(Опр =) X = Y  ⟺  X ⊆ Y  и  Y ⊆ X"]},

{"title": "Отправная точка", "clear": 1, "say": "Сначала вспомним определение симметрической разности: симметрическая разность икс большого и игрек большого — это объединение икс большого без игрек большого и игрек большого без икс большого. Применим его к нашему случаю: возьмём вместо икс большого множество А, а вместо игрек большого — пересечение А и Бэ.", "L": [["txt", "По (Опр △):"], ["sub", "X △ Y = (X ∖ Y) ∪ (Y ∖ X)"], ["txt", "Берём  X = A  и  Y = A ∩ B:"], ["sub", "A △ (A ∩ B) = ( A ∖ <mark>(A ∩ B)</mark> ) ∪ ( <mark>(A ∩ B)</mark> ∖ A )<span class='tag'>(★)</span>"]]},

{"title": "План", "clear": 1, "say": "Теперь упростим каждую из двух частей этого объединения. В первом пункте мы увидим, что пересечение А и Бэ без А — это пустое множество. Во втором пункте мы увидим, что А без пересечения А и Бэ равно А без Бэ. А в третьем пункте сделаем вывод.", "L": [["goal", "(1)  (A ∩ B) ∖ A = ∅"], ["goal", "(2)  A ∖ (A ∩ B) = A ∖ B"], ["goal", "(3)  Вывод подстановкой в (★)"]]},

{"title": "(1) (A ∩ B) ∖ A = ∅", "clear": 1, "say": "Пункт первый. Мы хотим показать, что в пересечении А и Бэ без А нет ни одного элемента. Предположим, что икс — элемент этого множества, и придём к противоречию.", "L": [["hyp", "Пусть x ∈ (A ∩ B) ∖ A"], ["goal", "Хотим:  прийти к противоречию"]]},

{"say": "По определению разности, икс принадлежит пересечению А и Бэ, и икс не принадлежит А.", "L": [["txt", "По (Опр ∖):"], ["sub", "x ∈ A ∩ B   и   x ∉ A"]]},

{"say": "По определению пересечения, то, что икс принадлежит пересечению А и Бэ, означает, что икс принадлежит А, и икс принадлежит Бэ. В частности, икс принадлежит А.", "L": [["txt", "По (Опр ∩):  x ∈ A ∩ B  означает  x ∈ A  и  x ∈ B.  В частности:"], ["sub", "x ∈ A"]]},

{"say": "Но мы получили, что икс не принадлежит А. Значит, икс одновременно принадлежит А и не принадлежит А. Это противоречие.", "L": [["warn", "x ∈ A   и   x ∉ A      →   противоречие"]]},

{"say": "Следовательно, в пересечении А и Бэ без А нет ни одного элемента икс. Множество без элементов — это пустое множество. Значит, пересечение А и Бэ без А — пустое множество.", "L": [["txt", "Ни одно x не может лежать в  (A ∩ B) ∖ A,  поэтому:"], ["res", "(A ∩ B) ∖ A = ∅"]]},

{"title": "(2) A ∖ (A ∩ B) = A ∖ B", "clear": 1, "say": "Пункт второй. Мы хотим показать, что А без пересечения А и Бэ равно А без Бэ. По определению равенства докажем два включения. Первое: А без пересечения А и Бэ содержится в А без Бэ. Второе: А без Бэ содержится в А без пересечения А и Бэ.", "L": [["goal", "(2a)  A ∖ (A ∩ B) ⊆ A ∖ B"], ["goal", "(2b)  A ∖ B ⊆ A ∖ (A ∩ B)"]]},

{"title": "(2a) A ∖ (A ∩ B) ⊆ A ∖ B", "clear": 1, "say": "Пусть икс — произвольный элемент множества А без пересечения А и Бэ. По определению разности, икс принадлежит А, и икс не принадлежит пересечению А и Бэ.", "L": [["hyp", "Пусть x ∈ A ∖ (A ∩ B)"], ["goal", "Хотим:  x ∈ A ∖ B"], ["txt", "По (Опр ∖):"], ["sub", "x ∈ A   и   x ∉ A ∩ B"]]},

{"say": "По определению пересечения, то, что икс не принадлежит пересечению А и Бэ, означает, что икс не принадлежит А и Бэ одновременно. Так как мы знаем, что икс принадлежит А, остаётся единственная возможность: икс не принадлежит Бэ.", "L": [["txt", "По (Опр ∩):  x ∉ A ∩ B  означает"], ["sub", "не (x ∈ A  и  x ∈ B)"], ["txt", "Так как  x ∈ A,  обязательно:"], ["sub", "x ∉ B"]]},

{"say": "Итак, икс принадлежит А, и икс не принадлежит Бэ. По определению разности, икс принадлежит А без Бэ. Это доказывает первое включение.", "L": [["txt", "x ∈ A  и  x ∉ B,  поэтому по (Опр ∖):"], ["res", "x ∈ A ∖ B"], ["res", "A ∖ (A ∩ B) ⊆ A ∖ B"]]},

{"title": "(2b) A ∖ B ⊆ A ∖ (A ∩ B)", "clear": 1, "say": "Теперь обратное включение. Пусть икс — произвольный элемент множества А без Бэ. По определению разности, икс принадлежит А, а икс не принадлежит Бэ.", "L": [["hyp", "Пусть x ∈ A ∖ B"], ["goal", "Хотим:  x ∈ A ∖ (A ∩ B)"], ["txt", "По (Опр ∖):"], ["sub", "x ∈ A   и   x ∉ B"]]},

{"say": "Икс не принадлежит Бэ, поэтому икс не может принадлежать А и Бэ одновременно. По определению пересечения, икс не принадлежит пересечению А и Бэ.", "L": [["txt", "x ∉ B  ⟹  не (x ∈ A  и  x ∈ B),  поэтому по (Опр ∩):"], ["sub", "x ∉ A ∩ B"]]},

{"say": "Итак, икс принадлежит А, и икс не принадлежит пересечению А и Бэ. По определению разности, икс принадлежит А без пересечения А и Бэ. Это доказывает второе включение.", "L": [["txt", "x ∈ A  и  x ∉ A ∩ B,  поэтому по (Опр ∖):"], ["res", "x ∈ A ∖ (A ∩ B)"], ["res", "A ∖ B ⊆ A ∖ (A ∩ B)"]]},

{"title": "(2) Вывод", "clear": 1, "say": "Так как выполняются оба включения, по определению равенства заключаем, что А без пересечения А и Бэ равно А без Бэ.", "L": [["txt", "(2a)  A ∖ (A ∩ B) ⊆ A ∖ B"], ["txt", "(2b)  A ∖ B ⊆ A ∖ (A ∩ B)"], ["res", "A ∖ (A ∩ B) = A ∖ B"]]},

{"title": "(3) Вывод", "clear": 1, "say": "Пункт третий. Вернёмся к исходному выражению. Симметрическая разность А и пересечения А и Бэ — это объединение А без пересечения и пересечения без А.", "L": [["txt", "Исходим из (★):"], ["sub", "A △ (A ∩ B) = ( A ∖ (A ∩ B) ) ∪ ( (A ∩ B) ∖ A )"]]},

{"say": "Заменим вторую часть пустым множеством, используя результат первого пункта.", "L": [["txt", "По (1),  (A ∩ B) ∖ A = ∅ :"], ["sub", "A △ (A ∩ B) = ( A ∖ (A ∩ B) ) ∪ <mark>∅</mark>"]]},

{"say": "Объединение множества с пустым множеством не меняет это множество. Действительно, икс принадлежит объединению множества икс большое с пустым множеством тогда и только тогда, когда икс принадлежит икс большому, или икс принадлежит пустому множеству. Но пустому множеству не принадлежит ни один элемент, поэтому это равносильно тому, что икс принадлежит икс большому. Применим это, взяв в качестве икс большого множество А без пересечения А и Бэ.", "L": [["txt", "По (Опр ∪) и (Опр ∅):  x ∈ X ∪ ∅  ⟺  x ∈ X  или  x ∈ ∅  ⟺  x ∈ X"], ["txt", "При  X = A ∖ (A ∩ B):"], ["sub", "A △ (A ∩ B) = A ∖ (A ∩ B)"]]},

{"say": "Наконец, заменим А без пересечения А и Бэ на А без Бэ, используя результат второго пункта.", "L": [["txt", "По (2),  A ∖ (A ∩ B) = A ∖ B :"], ["res", "A △ (A ∩ B) = A ∖ B"]]},

{"title": "Вывод", "clear": 1, "say": "Вывод. Мы доказали, что для любых множеств А и Бэ множество А без Бэ равно симметрической разности А и пересечения А и Бэ. Спасибо за внимание.", "L": [["txt", "A △ (A ∩ B) = ( A ∖ (A ∩ B) ) ∪ ∅ = A ∖ (A ∩ B) = A ∖ B"], ["res", "A ∖ B = A △ (A ∩ B)"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' плюс ').replace(/⊙/g,' умножить на ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Повторить'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Продолжить'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Пауза';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Пауза';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Пауза';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^ru/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/dmitry|pavel|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Разность и симметрическая разность";$('sub').textContent="Упражнение · Алгебра множеств";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
