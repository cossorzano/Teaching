<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Законы поглощения нулём и единицей</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(15px,1.9vw,24px)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>Запомним</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Начать</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Скорость <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Режим записи (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"ru-RU",
"meta":{"nivel": 2, "titulo": "Законы поглощения нулём и единицей", "enunciado": "Пусть (B, ⊕, ⊙, ∼) — булева алгебра.  Доказать, что для любого a ∈ B выполняются законы поглощения нулём и единицей:", "tesis": "a ⊕ 1 = 1,   a ⊙ 0 = 0", "datos": ["(Асс ⊕)  x ⊕ (y ⊕ z) = (x ⊕ y) ⊕ z", "(Асс ⊙)  x ⊙ (y ⊙ z) = (x ⊙ y) ⊙ z", "(Идем)  x ⊕ x = x,   x ⊙ x = x", "(Доп)  x ⊕ ∼x = 1,   x ⊙ ∼x = 0"]},
"steps":[
{"title": "Законы поглощения нулём и единицей", "sub": "Упражнение · Булева алгебра", "clear": 1, "say": "Здравствуйте. В этом видео мы решим упражнение о булевых алгебрах. Мы будем двигаться очень медленно, записывая каждое равенство и обосновывая каждый шаг.", "L": [["txt", "Прибавить единицу — получится единица, умножить на ноль — получится ноль"]]},

{"say": "Сначала данные. Бэ — множество с двумя операциями, суммой и произведением, и операцией дополнения, которую мы обозначаем тильдой. Это булева алгебра: дистрибутивная решётка с наименьшим элементом ноль, наибольшим элементом один и дополнением для каждого элемента. Типичный пример — множество всех подмножеств множества У, с объединением, пересечением и дополнением.", "L": [["hyp", "(B, ⊕, ⊙, ∼) — булева алгебра<span class='tag'>Гипотеза</span>"], ["txt", "Для множеств:  (𝒫(U), ∪, ∩, дополнение),   0 = ∅,   1 = U"]]},

{"say": "Вспомним определение дополнения. Дополнение а удовлетворяет сразу двум условиям: а плюс его дополнение равно единице, и а умножить на его дополнение равно нулю. Для множеств: А объединение его дополнение равно У, а А пересечение его дополнение — пустое множество.", "L": [["sub", "a ⊕ ∼a = 1<span class='tag'>Определение дополнения</span>"], ["sub", "a ⊙ ∼a = 0<span class='tag'>Определение дополнения</span>"], ["txt", "Для множеств:  A ∪ A<sup>c</sup> = U,   A ∩ A<sup>c</sup> = ∅"]]},

{"say": "Кроме того, мы используем ассоциативность суммы и произведения и идемпотентность обеих операций: а плюс а равно а, и а умножить на а равно а. Запишем их слева вместе с определением дополнения.", "pin": ["(Асс ⊕) x ⊕ (y ⊕ z) = (x ⊕ y) ⊕ z", "(Асс ⊙) x ⊙ (y ⊙ z) = (x ⊙ y) ⊙ z", "(Идем ⊕) x ⊕ x = x", "(Идем ⊙) x ⊙ x = x", "(Доп) x ⊕ ∼x = 1,   x ⊙ ∼x = 0"]},

{"say": "Что нужно доказать. Для каждого элемента а из Бэ, а плюс единица равно единице, и а умножить на ноль равно нулю. Это законы поглощения нулём и единицей: единица поглощает сумму, а ноль поглощает произведение. Для множеств: А объединение У равно У, и А пересечение пустое множество — пустое множество.", "L": [["goal", "∀ a ∈ B:   a ⊕ 1 = 1   и   a ⊙ 0 = 0<span class='tag'>Утверждение: законы поглощения</span>"], ["txt", "Для множеств:  A ∪ U = U,   A ∩ ∅ = ∅"]]},

{"title": "Часть 1: a ⊕ 1 = 1", "clear": 1, "say": "Начнём с первого. Пусть а — произвольный элемент Бэ. Мы хотим доказать, что а плюс единица равно единице. Начнём с левой части.", "L": [["txt", "Пусть a ∈ B  (произвольный)"], ["goal", "Нужно:  a ⊕ 1 = 1<span class='tag'>Утверждение этой части</span>"], ["txt", "a ⊕ 1"]]},

{"say": "Первый шаг. По определению дополнения, а плюс его дополнение равно единице. Это гипотеза. Значит, единицу можно заменить на а плюс дополнение а. Левое а оставляем как есть.", "L": [["sub", "a ⊕ 1  =  a ⊕ (a ⊕ ∼a)<span class='tag'>Подстановка: 1 = a ⊕ ∼a  (определение дополнения)</span>"]]},

{"say": "Второй шаг. Применим ассоциативность суммы при икс, равном а, игрек, равном а, и зэт, равном дополнению а. Переходим от, а плюс, а плюс дополнение а, к, а плюс а, плюс дополнение а.", "L": [["sub", "a ⊕ 1  =  (a ⊕ a) ⊕ ∼a<span class='tag'>Ассоциативность ⊕</span>"]]},

{"say": "Третий шаг. В скобках стоит а плюс а. По идемпотентности суммы а плюс а равно а. Выделим и подставим.", "L": [["sub", "a ⊕ 1  =  (<mark>a ⊕ a</mark>) ⊕ ∼a"], ["txt", "По (Идем ⊕):  <mark>a ⊕ a</mark> = a"], ["sub", "a ⊕ 1  =  a ⊕ ∼a<span class='tag'>Идемпотентность ⊕</span>"]]},

{"say": "Четвёртый шаг. Теперь у нас а плюс дополнение а, что по определению дополнения равно единице.", "L": [["res", "a ⊕ 1  =  1<span class='tag'>Определение дополнения</span>"]]},

{"say": "Мы доказали первый закон. Для множеств: А объединение У равно У. На этом первая часть закончена.", "L": [["res", "a ⊕ 1 = 1   ∎"], ["txt", "Для множеств:  A ∪ U = U"]]},

{"title": "Часть 2: a ⊙ 0 = 0", "clear": 1, "say": "Переходим ко второй части. Она аналогична: меняем сумму на произведение, а единицу на ноль. Пусть а — произвольный элемент Бэ. Мы хотим доказать, что а умножить на ноль равно нулю. Начнём с левой части.", "L": [["txt", "Пусть a ∈ B  (произвольный)"], ["goal", "Нужно:  a ⊙ 0 = 0<span class='tag'>Утверждение этой части</span>"], ["txt", "a ⊙ 0"]]},

{"say": "Первый шаг. По определению дополнения, а умножить на его дополнение равно нулю. Это гипотеза. Значит, заменим ноль на а умножить на дополнение а. Левое а оставляем как есть.", "L": [["sub", "a ⊙ 0  =  a ⊙ (a ⊙ ∼a)<span class='tag'>Подстановка: 0 = a ⊙ ∼a  (определение дополнения)</span>"]]},

{"say": "Второй шаг. Применим ассоциативность произведения. Переходим от, а умножить на, а умножить на дополнение а, к, а умножить на а, умножить на дополнение а.", "L": [["sub", "a ⊙ 0  =  (a ⊙ a) ⊙ ∼a<span class='tag'>Ассоциативность ⊙</span>"]]},

{"say": "Третий шаг. В скобках стоит а умножить на а. По идемпотентности произведения а умножить на а равно а. Выделим и подставим.", "L": [["sub", "a ⊙ 0  =  (<mark>a ⊙ a</mark>) ⊙ ∼a"], ["txt", "По (Идем ⊙):  <mark>a ⊙ a</mark> = a"], ["sub", "a ⊙ 0  =  a ⊙ ∼a<span class='tag'>Идемпотентность ⊙</span>"]]},

{"say": "Четвёртый шаг. Теперь у нас а умножить на дополнение а, что по определению дополнения равно нулю.", "L": [["res", "a ⊙ 0  =  0<span class='tag'>Определение дополнения</span>"]]},

{"say": "Мы доказали второй закон. Для множеств: А пересечение пустое множество — пустое множество. На этом вторая часть закончена.", "L": [["res", "a ⊙ 0 = 0   ∎"], ["txt", "Для множеств:  A ∩ ∅ = ∅"]]},

{"title": "Итоги", "clear": 1, "say": "Подведём итоги. Мы записываем единицу как а плюс дополнение а, применяем ассоциативность, идемпотентность и возвращаемся к определению дополнения. С произведением — то же самое с нулём. Мы заключаем, что в любой булевой алгебре выполняются законы поглощения нулём и единицей. Для множеств: А объединение У равно У, и А пересечение пустое множество — пустое множество. Спасибо за внимание.", "L": [["res", "a ⊕ 1 = 1   (подстановка + ассоциативность + идемпотентность + дополнение)"], ["res", "a ⊙ 0 = 0   (подстановка + ассоциативность + идемпотентность + дополнение)"], ["txt", "Для множеств:  A ∪ U = U,   A ∩ ∅ = ∅"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' плюс ').replace(/⊙/g,' умножить на ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Повторить'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Продолжить'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Пауза';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Пауза';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Пауза';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^ru/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/dmitry|pavel|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Законы поглощения нулём и единицей";$('sub').textContent="Упражнение · Булева алгебра";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
