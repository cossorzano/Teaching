<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relaciones, operaciones y estructuras algebraicas</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>Recuerda</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Empezar</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Velocidad <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Modo grabación (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"es-ES",
"meta":{"nivel": 0, "titulo": "Relaciones, operaciones y estructuras algebraicas", "enunciado": "Resumen: relaciones binarias, operaciones y jerarquía de estructuras, del magma al cuerpo", "datos": ["Relaciones de equivalencia", "Órdenes parcial y total", "Operaciones binarias", "Magma, semigrupo y monoide", "Grupo y grupo abeliano", "Anillos", "Cuerpo"]},
"steps":[
{"title": "Relaciones, operaciones y estructuras algebraicas", "sub": "Resumen teórico · Álgebra", "clear": 1, "say": "Hola. En este vídeo resumimos las relaciones binarias, las operaciones, y la jerarquía de estructuras algebraicas: desde el magma hasta el cuerpo. Primero las relaciones, y después las estructuras, añadiendo propiedades una a una.", "L": [["txt", "Relaciones binarias  →  operaciones  →  estructuras algebraicas"]]},
{"title": "1) Relación binaria", "clear": 1, "say": "Una relación binaria sobre un conjunto E es un subconjunto R del producto cartesiano E por E. Escribir que el par a, b pertenece a R, significa que a está relacionado con b.", "L": [["goal", "Relación binaria:   R ⊆ E × E"], ["txt", "(a, b) ∈ R   significa que  a  está relacionado con  b"]]},
{"title": "2) Relación de equivalencia", "clear": 1, "say": "Una relación binaria de equivalencia es una relación que cumple tres propiedades. Reflexiva: para todo a, el par a, a pertenece a R. Simétrica: si el par a, b pertenece a R, entonces el par b, a pertenece a R. Y transitiva: si los pares a, b y b, c pertenecen a R, entonces el par a, c pertenece a R.", "L": [["goal", "Relación de equivalencia"], ["res", "Reflexiva:   (a, a) ∈ R"], ["res", "Simétrica:   (a, b) ∈ R  ⟹  (b, a) ∈ R"], ["res", "Transitiva:   (a, b), (b, c) ∈ R  ⟹  (a, c) ∈ R"]]},
{"say": "Se escribe de tres formas, según el contexto: el par a, b pertenece a R, a equivalente a b, o a igual a b.", "L": [["txt", "Notación, según el contexto:"], ["sub", "(a, b) ∈ R,       a ∼ b,       a = b"]]},
{"title": "3) Orden parcial", "clear": 1, "say": "Una relación binaria de orden parcial también cumple tres propiedades. Reflexiva: el par a, a pertenece a R. Antisimétrica: si los pares a, b y b, a pertenecen a R, entonces a es igual a b. Y transitiva, igual que antes. Se escribe el par a, b pertenece a R, o a menor o igual que b.", "L": [["goal", "Relación de orden parcial"], ["res", "Reflexiva:   (a, a) ∈ R"], ["res", "Antisimétrica:   (a, b), (b, a) ∈ R  ⟹  a = b"], ["res", "Transitiva:   (a, b), (b, c) ∈ R  ⟹  (a, c) ∈ R"], ["sub", "Notación:   (a, b) ∈ R,       a ≤ b"]]},
{"title": "4) Orden total", "clear": 1, "say": "Una relación de orden total es un orden parcial en el que cualesquiera dos elementos son comparables: para todos a y b, el par a, b pertenece a R, o el par b, a pertenece a R. Atención: no hay que confundirla con decir que si a, b está en R entonces b, a no está, que contradice la reflexividad.", "L": [["goal", "Relación de orden total"], ["txt", "Orden parcial, y además:"], ["res", "∀ a, b:   (a, b) ∈ R   o   (b, a) ∈ R"], ["warn", "No:  (a, b) ∈ R ⟹ (b, a) ∉ R   (contradice la reflexividad)"]]},
{"title": "5) Operaciones binarias", "clear": 1, "say": "Pasamos a las operaciones. Una operación binaria interna sobre E es una función f de E por E en E: combina dos elementos de E y devuelve otro elemento de E. Una operación binaria externa es una función f de E por F en E: combina un elemento de E con uno de otro conjunto F, y devuelve un elemento de E.", "L": [["goal", "Operación binaria interna:   f : E × E → E"], ["goal", "Operación binaria externa:   f : E × F → E"]]},
{"title": "6) Magma", "clear": 1, "say": "Ahora la jerarquía de estructuras, añadiendo propiedades en cada nivel. Un magma es un conjunto E con una operación binaria interna, que escribimos con el símbolo más redondo.", "L": [["goal", "Magma:   (E, ⊕)"], ["txt", "⊕  operación binaria interna"]], "pin": ["Magma:  ⊕ interna"]},
{"title": "7) Semigrupo", "clear": 1, "say": "Un semigrupo es un magma en el que la operación es asociativa: a más b, más c, es igual a a más, b más c.", "L": [["goal", "Semigrupo:   (E, ⊕)   Magma  +"], ["res", "Asociativa:   (a ⊕ b) ⊕ c = a ⊕ (b ⊕ c)"]], "pin": ["Semigrupo:  + asociativa"]},
{"title": "8) Monoide", "clear": 1, "say": "Un monoide es un semigrupo con elemento neutro: existe un único elemento, que llamamos cero, tal que, para todo a, a más cero es a, y cero más a es a.", "L": [["goal", "Monoide:   (E, ⊕)   Semigrupo  +"], ["res", "Elemento neutro:   ∃! 0  tal que  ∀ a:   a ⊕ 0 = a,    0 ⊕ a = a"]], "pin": ["Monoide:  + elemento neutro"]},
{"title": "9) Grupo", "clear": 1, "say": "Un grupo es un monoide en el que todo elemento tiene simétrico: para todo a, existe un único elemento, el simétrico de a, tal que a más su simétrico, y su simétrico más a, son iguales al elemento neutro cero.", "L": [["goal", "Grupo:   (E, ⊕)   Monoide  +"], ["res", "Elemento simétrico:   ∀ a,  ∃! ∼a  tal que"], ["res", "a ⊕ (∼a) = (∼a) ⊕ a = 0"]], "pin": ["Grupo:  + elemento simétrico"]},
{"title": "10) Grupo abeliano", "clear": 1, "say": "Un grupo abeliano es un grupo en el que la operación es conmutativa: a más b es igual a b más a.", "L": [["goal", "Grupo abeliano:   (E, ⊕)   Grupo  +"], ["res", "Conmutativa:   a ⊕ b = b ⊕ a"]], "pin": ["Grupo abeliano:  + conmutativa"]},
{"title": "11) Anillo", "clear": 1, "say": "Un anillo tiene dos operaciones: la suma, escrita con el más redondo, y el producto, escrito con el por redondo. Con la suma, E es un grupo abeliano. Con el producto, E es un semigrupo.", "L": [["goal", "Anillo:   (E, ⊕, ⊙)"], ["res", "(E, ⊕)   Grupo abeliano"], ["res", "(E, ⊙)   Semigrupo"]], "pin": ["Anillo:  (E,⊕) abeliano, (E,⊙) semigrupo"]},
{"say": "Y además las dos operaciones se relacionan con dos distributividades. Por la izquierda: a por, b más c, es igual a a por b, más a por c. Por la derecha: b más c, por a, es igual a b por a, más c por a.", "L": [["res", "Distributiva por la izquierda:   a ⊙ (b ⊕ c) = (a ⊙ b) ⊕ (a ⊙ c)"], ["res", "Distributiva por la derecha:   (b ⊕ c) ⊙ a = (b ⊙ a) ⊕ (c ⊙ a)"]]},
{"title": "12) Anillo unitario", "clear": 1, "say": "Un anillo unitario es un anillo en el que el producto tiene elemento neutro: es decir, E con el producto es un monoide.", "L": [["goal", "Anillo unitario:   (E, ⊕, ⊙)   Anillo  +"], ["res", "(E, ⊙)   Monoide"]], "pin": ["Anillo unitario:  (E,⊙) monoide"]},
{"title": "13) Anillo de división", "clear": 1, "say": "Un anillo de división es un anillo unitario en el que todo elemento distinto de cero tiene inverso para el producto: es decir, E menos el conjunto que contiene solo al cero, con el producto, es un grupo.", "L": [["goal", "Anillo de división:   (E, ⊕, ⊙)   Anillo unitario  +"], ["res", "(E ∖ {0}, ⊙)   Grupo"]], "pin": ["Anillo de división:  (E∖{0},⊙) grupo"]},
{"title": "14) Cuerpo", "clear": 1, "say": "Y un cuerpo es un anillo de división en el que el producto es conmutativo.", "L": [["goal", "Cuerpo:   (E, ⊕, ⊙)   Anillo de división  +"], ["res", "⊙  conmutativa"]], "pin": ["Cuerpo:  ⊙ conmutativa"]},
{"title": "Resumen", "clear": 1, "say": "Resumen. Las relaciones de equivalencia son reflexivas, simétricas y transitivas. Los órdenes parciales son reflexivos, antisimétricos y transitivos, y el orden es total si todos los pares son comparables. Para las estructuras, cada nivel añade una propiedad: el semigrupo, la asociatividad; el monoide, el elemento neutro; el grupo, el simétrico; el grupo abeliano, la conmutatividad. Con dos operaciones, el anillo, el anillo unitario, el anillo de división, y el cuerpo. Gracias por ver el vídeo.", "L": [["res", "Equivalencia:  reflexiva, simétrica, transitiva"], ["res", "Orden parcial:  reflexiva, antisimétrica, transitiva"], ["res", "Orden total:  ∀ a, b:  (a, b) ∈ R  o  (b, a) ∈ R"], ["res", "Magma → Semigrupo → Monoide → Grupo → Grupo abeliano"], ["txt", "        + asociativa    + neutro    + simétrico    + conmutativa"], ["res", "Anillo → Anillo unitario → Anillo de división → Cuerpo"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' más ').replace(/⊙/g,' por ').replace(/∼/g,' complementario de ').replace(/≤/g,' menor o igual que ').replace(/[()]/g,', ').replace(/\b1\b/g,' uno ').replace(/\b0\b/g,' cero ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Repetir'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Continuar'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pausa';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pausa';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pausa';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/pablo|jorge|diego|enrique|miguel|alvaro|álvaro|male|google español$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent='Relaciones, operaciones y estructuras algebraicas';$('sub').textContent='Resumen teórico · Álgebra';
$('cap').textContent='0 / '+steps.length;
</script></body></html>
