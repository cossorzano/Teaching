<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recta real ampliada</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>Recuerda</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Empezar</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Velocidad <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Modo grabación (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"es-ES",
"meta":{"nivel": 0, "titulo": "Recta real ampliada", "enunciado": "Resumen: definición, orden, supremos e ínfimos y operaciones en la recta real ampliada", "datos": ["Definición", "Orden", "Supremo e ínfimo", "Operaciones definidas", "Operaciones no definidas", "No es un cuerpo"]},
"steps":[
{"title": "Recta real ampliada", "sub": "Resumen teórico · Cálculo", "clear": 1, "say": "Hola. En este vídeo resumimos la recta real ampliada: cómo se define, cómo se ordena, qué ocurre con los supremos e ínfimos, y qué operaciones se pueden hacer con más y menos infinito.", "L": [["txt", "La recta real ampliada  <span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span>"]]},
{"title": "1) Definición", "clear": 1, "say": "La recta real ampliada se obtiene añadiendo a los números reales los dos símbolos menos infinito y más infinito. Se escribe con una barra encima de la erre doble de los reales.", "L": [["goal", "<span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span> = ℝ ∪ { −∞, +∞ }"]], "pin": ["Definición: <span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span> = ℝ ∪ {−∞, +∞}"]},
{"title": "2) Orden", "clear": 1, "say": "Primero, el orden. El orden de la recta real ampliada extiende el de los números reales. Para todo x real, menos infinito es menor o igual que x, y x es menor o igual que más infinito. Y menos infinito es estrictamente menor que más infinito.", "L": [["goal", "≤  extiende el orden de ℝ"], ["res", "∀ x ∈ ℝ :   −∞ ≤ x ≤ +∞"], ["res", "−∞ &lt; +∞"]], "pin": ["Orden: −∞ ≤ x ≤ +∞"]},
{"title": "3) Cotas", "clear": 1, "say": "Segundo, las cotas. A diferencia de los números reales, en la recta ampliada todo subconjunto A tiene supremo y tiene ínfimo, sin necesidad de que esté acotado. Por ejemplo, el conjunto vacío: todo elemento es cota superior del vacío, y la menor de ellas es menos infinito. Así, el supremo del vacío es menos infinito, y el ínfimo del vacío es más infinito.", "L": [["goal", "Todo  A ⊆ <span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span>  tiene supremo e ínfimo en <span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span>"], ["txt", "Por ejemplo, para  A = ∅:"], ["sub", "sup ∅ = −∞,        inf ∅ = +∞"]], "pin": ["Todo A ⊆ <span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span> tiene sup A e inf A"]},
{"title": "4) Supremo", "clear": 1, "say": "Tercero, cuándo el supremo es más o menos infinito. Si A es un subconjunto de los números reales, el supremo de A es más infinito si y solo si A no está acotado superiormente en los números reales. Y el supremo de A es menos infinito si y solo si A es el conjunto vacío, o A es el conjunto que contiene solo a menos infinito.", "L": [["goal", "Supremo"], ["res", "A ⊆ ℝ:   sup A = +∞   ⟺   A no está acotado superiormente en ℝ"], ["res", "sup A = −∞   ⟺   A = ∅   o   A = { −∞ }"]], "pin": ["Supremo: +∞ si no acotado; −∞ si A=∅ o {−∞}"]},
{"say": "En general, para un subconjunto cualquiera A de la recta real ampliada, el supremo es más infinito, si y solo si más infinito pertenece a A, o la parte real de A no está acotada superiormente.", "L": [["txt", "En general, para  A ⊆ <span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span> :"], ["sub", "sup A = +∞   ⟺   +∞ ∈ A   o   A ∩ ℝ no acotado superiormente en ℝ"]]},
{"title": "5) Ínfimo", "clear": 1, "say": "Cuarto, el ínfimo, que es lo simétrico. Si A es un subconjunto de los números reales, el ínfimo de A es menos infinito si y solo si A no está acotado inferiormente en los números reales. Y el ínfimo de A es más infinito si y solo si A es el conjunto vacío, o A es el conjunto que contiene solo a más infinito.", "L": [["goal", "Ínfimo"], ["res", "A ⊆ ℝ:   inf A = −∞   ⟺   A no está acotado inferiormente en ℝ"], ["res", "inf A = +∞   ⟺   A = ∅   o   A = { +∞ }"]], "pin": ["Ínfimo: −∞ si no acotado; +∞ si A=∅ o {+∞}"]},
{"title": "6) Operaciones", "clear": 1, "say": "Quinto, las operaciones, que están solo parcialmente definidas. La suma: para todo x real, x más más infinito es más infinito, y x más menos infinito es menos infinito. El producto: si a es mayor que cero, a por más infinito es más infinito, y a por menos infinito es menos infinito. Si a es menor que cero, el signo se invierte: a por más infinito es menos infinito, y a por menos infinito es más infinito.", "L": [["goal", "Operaciones definidas"], ["res", "x + (±∞) = ±∞        ∀ x ∈ ℝ"], ["res", "a · (±∞) = ±∞        si  a &gt; 0"], ["res", "a · (±∞) = ∓∞        si  a &lt; 0"]], "pin": ["Operaciones: x+(±∞)=±∞, a·(±∞)=±∞ (a>0)"]},
{"say": "Y la división: para todo a real, a dividido entre más o menos infinito es cero. También están definidas más infinito más más infinito, que es más infinito, y menos infinito más menos infinito, que es menos infinito.", "L": [["res", "a / (±∞) = 0        ∀ a ∈ ℝ"], ["res", "(+∞) + (+∞) = +∞,        (−∞) + (−∞) = −∞"]]},
{"title": "7) Operaciones no definidas", "clear": 1, "say": "Sin embargo, hay operaciones que no están definidas, porque no se puede asignar un valor razonable. Más infinito menos más infinito, es decir, sumar más infinito con menos infinito, no está definida. Y cero por más o menos infinito tampoco.", "L": [["goal", "No están definidas"], ["warn", "(+∞) + (−∞)    es decir,    ∞ − ∞"], ["warn", "0 · (±∞)"]]},
{"title": "8) Observación", "clear": 1, "say": "Observación final. La recta real ampliada no es un cuerpo ni un anillo. Por ejemplo, más infinito no tiene opuesto: no existe ningún elemento que sumado a más infinito dé cero. Debe usarse solo como herramienta auxiliar para describir comportamientos no acotados.", "L": [["warn", "<span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span> no es cuerpo ni anillo"], ["txt", "Por ejemplo,  +∞  no tiene opuesto"], ["txt", "Herramienta auxiliar para comportamientos no acotados"]]},
{"title": "Resumen", "clear": 1, "say": "Resumen. La recta real ampliada es los números reales más menos infinito y más infinito. Su orden extiende el de los números reales, y todo subconjunto tiene supremo e ínfimo. Las operaciones están parcialmente definidas, y no es un cuerpo ni un anillo. Gracias por ver el vídeo.", "L": [["res", "<span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span> = ℝ ∪ { −∞, +∞ },    −∞ ≤ x ≤ +∞"], ["res", "Todo A ⊆ <span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span> tiene  sup A  e  inf A"], ["res", "∞ − ∞   y   0 · (±∞)   no definidas"], ["res", "<span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span> no es cuerpo ni anillo"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' más ').replace(/⊙/g,' por ').replace(/∼/g,' complementario de ').replace(/≤/g,' menor o igual que ').replace(/[()]/g,', ').replace(/\b1\b/g,' uno ').replace(/\b0\b/g,' cero ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Repetir'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Continuar'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pausa';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pausa';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pausa';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/pablo|jorge|diego|enrique|miguel|alvaro|álvaro|male|google español$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent='Recta real ampliada';$('sub').textContent='Resumen teórico · Cálculo';
$('cap').textContent='0 / '+steps.length;
</script></body></html>
