<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Producto cartesiano e intersección</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>Recuerda</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Empezar</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Velocidad <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Modo grabación (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"es-ES",
"meta":{"nivel": 2, "titulo": "Producto cartesiano e intersección", "enunciado": "Demostrar que, para cualesquiera conjuntos A, B, C, D, se cumple:", "tesis": "(A ∩ B) × (C ∩ D) = (A × C) ∩ (B × D)", "datos": ["(Def ×)  (x, y) ∈ X × Y  ⟺  x ∈ X  e  y ∈ Y"]},
"steps":[
{"title": "Producto cartesiano e intersección", "sub": "Ejercicio · Álgebra de conjuntos", "clear": 1, "say": "Hola. En este vídeo vamos a demostrar que el producto cartesiano de dos intersecciones es la intersección de dos productos cartesianos. Razonaremos elemento a elemento, muy despacio, escribiendo cada ecuación y justificando cada paso.", "L": [["txt", "Demostrar que  (A ∩ B) × (C ∩ D) = (A × C) ∩ (B × D)"]]},
{"say": "Lo que queremos demostrar. Para cualesquiera conjuntos A, B, C y D, la intersección de A y B, por la intersección de C y D, es igual a la intersección de A por C, con B por D. Recordamos a la izquierda las definiciones que vamos a usar: producto cartesiano, intersección, inclusión e igualdad de conjuntos.", "L": [["goal", "(A ∩ B) × (C ∩ D) = (A × C) ∩ (B × D)<span class='tag'>Demostrar, para cualesquiera A, B, C, D</span>"]], "pin": ["(Def ×) (x, y) ∈ X × Y  ⟺  x ∈ X  e  y ∈ Y", "(Def ∩) p ∈ X ∩ Y  ⟺  p ∈ X  y  p ∈ Y", "(Def ⊆) X ⊆ Y  ⟺  todo p ∈ X cumple p ∈ Y", "(Def =) X = Y  ⟺  X ⊆ Y  y  Y ⊆ X"]},
{"title": "Plan: doble inclusión", "clear": 1, "say": "Razonaremos elemento a elemento. Por la definición de igualdad, tenemos que demostrar dos inclusiones. La primera, la intersección de A y B, por la intersección de C y D, está incluida en la intersección de A por C con B por D. La segunda, la inclusión contraria.", "L": [["goal", "(1)  (A ∩ B) × (C ∩ D) ⊆ (A × C) ∩ (B × D)"], ["goal", "(2)  (A × C) ∩ (B × D) ⊆ (A ∩ B) × (C ∩ D)"]]},
{"title": "(1) (A ∩ B) × (C ∩ D) ⊆ (A × C) ∩ (B × D)", "clear": 1, "say": "Primera inclusión. Por la definición de inclusión, tomamos un elemento cualquiera x, y del primer conjunto, y tenemos que probar que pertenece al segundo.", "L": [["hyp", "Sea (x, y) ∈ (A ∩ B) × (C ∩ D)"], ["goal", "Queremos:  (x, y) ∈ (A × C) ∩ (B × D)"]]},
{"say": "Por la definición de producto cartesiano, con X igual a A intersección B, e Y igual a C intersección D, la primera coordenada x pertenece a A intersección B, y la segunda coordenada y pertenece a C intersección D.", "L": [["txt", "Por (Def ×) con  X = A ∩ B,  Y = C ∩ D:"], ["sub", "x ∈ A ∩ B   e   y ∈ C ∩ D"]]},
{"say": "Por la definición de intersección, x pertenece a A intersección B significa que x pertenece a A, y x pertenece a B. Y y pertenece a C intersección D significa que y pertenece a C, e y pertenece a D.", "L": [["txt", "Por (Def ∩):"], ["sub", "x ∈ A  y  x ∈ B"], ["sub", "y ∈ C  e  y ∈ D"]]},
{"clear": 1, "say": "Ahora agrupamos de otra manera. Como x pertenece a A, e y pertenece a C, por la definición de producto cartesiano, x, y pertenece a A por C. Y como x pertenece a B, e y pertenece a D, x, y pertenece a B por D.", "L": [["txt", "Agrupamos:  x ∈ A  e  y ∈ C,  luego por (Def ×):"], ["sub", "(x, y) ∈ A × C"], ["txt", "Y también:  x ∈ B  e  y ∈ D,  luego por (Def ×):"], ["sub", "(x, y) ∈ B × D"]]},
{"say": "Por la definición de intersección, con X igual a A por C, e Y igual a B por D, x, y pertenece a la intersección de A por C con B por D.", "L": [["txt", "(x, y) ∈ A × C   y   (x, y) ∈ B × D,  luego por (Def ∩):"], ["res", "(x, y) ∈ (A × C) ∩ (B × D)"]]},
{"say": "Como x, y era un elemento cualquiera de la intersección de A y B, por la intersección de C y D, concluimos la primera inclusión.", "L": [["res", "(A ∩ B) × (C ∩ D) ⊆ (A × C) ∩ (B × D)"]]},
{"title": "(2) (A × C) ∩ (B × D) ⊆ (A ∩ B) × (C ∩ D)", "clear": 1, "say": "Segunda inclusión. Tomamos un elemento cualquiera x, y de la intersección de A por C con B por D, y tenemos que probar que pertenece a la intersección de A y B, por la intersección de C y D.", "L": [["hyp", "Sea (x, y) ∈ (A × C) ∩ (B × D)"], ["goal", "Queremos:  (x, y) ∈ (A ∩ B) × (C ∩ D)"]]},
{"say": "Por la definición de intersección, x, y pertenece a A por C, y x, y pertenece a B por D.", "L": [["txt", "Por (Def ∩):"], ["sub", "(x, y) ∈ A × C   y   (x, y) ∈ B × D"]]},
{"say": "Por la definición de producto cartesiano, x, y pertenece a A por C significa que x pertenece a A, e y pertenece a C. Y x, y pertenece a B por D significa que x pertenece a B, e y pertenece a D.", "L": [["txt", "Por (Def ×):"], ["sub", "x ∈ A  e  y ∈ C"], ["sub", "x ∈ B  e  y ∈ D"]]},
{"clear": 1, "say": "Ahora agrupamos de otra manera. Como x pertenece a A, y x pertenece a B, por la definición de intersección, x pertenece a A intersección B. Y como y pertenece a C, e y pertenece a D, y pertenece a C intersección D.", "L": [["txt", "Agrupamos:  x ∈ A  y  x ∈ B,  luego por (Def ∩):"], ["sub", "x ∈ A ∩ B"], ["txt", "Y también:  y ∈ C  e  y ∈ D,  luego por (Def ∩):"], ["sub", "y ∈ C ∩ D"]]},
{"say": "Por la definición de producto cartesiano, con X igual a A intersección B, e Y igual a C intersección D, x, y pertenece a la intersección de A y B, por la intersección de C y D.", "L": [["txt", "x ∈ A ∩ B  e  y ∈ C ∩ D,  luego por (Def ×):"], ["res", "(x, y) ∈ (A ∩ B) × (C ∩ D)"]]},
{"say": "Como x, y era un elemento cualquiera de la intersección de A por C con B por D, concluimos la segunda inclusión.", "L": [["res", "(A × C) ∩ (B × D) ⊆ (A ∩ B) × (C ∩ D)"]]},
{"title": "Conclusión", "clear": 1, "say": "Conclusión. Como se cumplen las dos inclusiones, por la definición de igualdad, la intersección de A y B, por la intersección de C y D, es igual a la intersección de A por C con B por D. Gracias por ver el vídeo.", "L": [["txt", "(1)  (A ∩ B) × (C ∩ D) ⊆ (A × C) ∩ (B × D)"], ["txt", "(2)  (A × C) ∩ (B × D) ⊆ (A ∩ B) × (C ∩ D)"], ["res", "(A ∩ B) × (C ∩ D) = (A × C) ∩ (B × D)"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' más ').replace(/⊙/g,' por ').replace(/∼/g,' complementario de ').replace(/≤/g,' menor o igual que ').replace(/[()]/g,', ').replace(/\b1\b/g,' uno ').replace(/\b0\b/g,' cero ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Repetir'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Continuar'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pausa';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pausa';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pausa';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/pablo|jorge|diego|enrique|miguel|alvaro|álvaro|male|google español$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent='Producto cartesiano e intersección';$('sub').textContent='Ejercicio · Álgebra de conjuntos';
$('cap').textContent='0 / '+steps.length;
</script></body></html>
