<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Retículos: idempotencia de ⊕ y ⊙</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--mut:#9fb3aa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#16231f}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3.2vw,40px);margin:12px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(16px,2.2vw,28px)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t">Retículos algebraicos: idempotencia</h1><div id="sub">Cálculo · Ejercicio 1</div>
<div id="main"><div id="pin" class="pin"><h2>Hipótesis</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Empezar</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Velocidad <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Modo grabación (H)</button><span id="cap"></span></div></div>
<script>
const A='a ⊕ a = a', S=(c,t)=>({c,t});
const meta={nivel:2,titulo:'Retículos algebraicos: idempotencia',
 enunciado:'Sea (B, ⊕, ⊙) un retículo. Demostrar la idempotencia de ⊕ y de ⊙:',
 tesis:'∀a∈B:   a ⊕ a = a,   a ⊙ a = a',
 datos:['(Abs1)  x ⊕ (x ⊙ y) = x','(Abs2)  x ⊙ (x ⊕ y) = x']};
const steps=[
{title:'Retículos algebraicos: idempotencia',sub:'Ejercicio 1',clear:1,say:'Hola. En este vídeo vamos a resolver un ejercicio sobre retículos algebraicos. Vamos a ir muy despacio, escribiendo cada ecuación y justificando cada paso.',L:[S('txt','Demostrar la idempotencia de ⊕ y de ⊙')]},
{say:'Primero, los datos. B es un conjunto con dos operaciones, la suma reticular y el producto reticular. Ambas son internas: si operamos dos elementos de B, el resultado sigue estando en B.',L:[S('hyp','(B, ⊕, ⊙) retículo<span class="tag">Hipótesis</span>'),S('hyp','⊕, ⊙ internas: x ⊕ y ∈ B,  x ⊙ y ∈ B<span class="tag">Hipótesis</span>')]},
{say:'Además, son conmutativas y asociativas. Pero ojo: en toda la demostración no las vamos a necesitar. Solo usaremos las leyes de absorción.',L:[S('hyp','⊕, ⊙ conmutativas y asociativas<span class="tag">Hipótesis (no la usaremos)</span>')]},
{say:'Aquí tenemos la primera ley de absorción, Abs1. Dice que, para cualesquiera x e y de B, x ⊕ (x ⊙ y) es igual a x. La dejamos fijada a la izquierda, porque es una hipótesis que usaremos.',pin:'(Abs1) x ⊕ (x ⊙ y) = x   ∀x,y∈B'},
{say:'Y la segunda, Abs2: x ⊙ (x ⊕ y) es igual a x, también para todo x e y. Es la misma idea con las operaciones intercambiadas.',pin:'(Abs2) x ⊙ (x ⊕ y) = x   ∀x,y∈B'},
{say:'Lo que queremos demostrar: para todo elemento a de B, a ⊕ a es igual a a, y a ⊙ a es igual a a. Es decir, operar un elemento consigo mismo no lo cambia. A esto se le llama idempotencia.',L:[S('goal','Demostrar: ∀a∈B, a ⊕ a = a  y  a ⊙ a = a<span class="tag">Tesis</span>')]},
{title:'Parte 1: idempotencia de ⊕',clear:1,say:'Empezamos con la idempotencia de la suma. Tomamos un elemento a cualquiera de B. Como es arbitrario, lo que demostremos valdrá para todos.',L:[S('txt','Sea a ∈ B  (arbitrario)'),S('goal','Queremos: a ⊕ a = a<span class="tag">Tesis</span>')]},
{say:'Empezamos con Abs2. Recordemos: x ⊙ (x ⊕ y) = x, y vale para todo x e y de B.',L:[S('hyp','(Abs2)  x ⊙ (x ⊕ y) = x<span class="tag">Hipótesis</span>')]},
{say:'Como Abs2 se cumple para cualquier x e y, en particular se cumple eligiendo x igual a a, e y igual a a. Es legítimo, porque a pertenece a B.',L:[S('sub','x = a,   y = a<span class="tag">Elección</span>')]},
{say:'Sustituimos. Donde había una x escribimos a, y donde había una y escribimos a. A la izquierda queda a ⊙ (a ⊕ a), y a la derecha, x se convierte en a. Llamamos a esta igualdad la ecuación uno.',L:[S('sub','a ⊙ (a ⊕ a) = a      (1)<span class="tag">Abs2 con x=a, y=a</span>')]},
{say:'Fíjate en que ya aparece a ⊕ a, la expresión que queremos simplificar. Pero todavía nos falta quitar ese producto de fuera. Para eso usaremos Abs1.',L:[S('hyp','(Abs1)  x ⊕ (x ⊙ y) = x<span class="tag">Hipótesis</span>')]},
{say:'Ahora elegimos x igual a a, pero esta vez y igual a a ⊕ a. ¿Es legítimo? Sí: como la suma es una operación interna, a ⊕ a pertenece a B, así que puede hacer de y.',L:[S('sub','x = a,   y = a ⊕ a  ∈ B<span class="tag">Elección (⊕ interna)</span>')]},
{say:'Sustituimos en Abs1. La x pasa a ser a. Y la y pasa a ser el paréntesis a ⊕ a. Obtenemos a ⊕ (a ⊙ (a ⊕ a)) igual a a. Es la ecuación dos.',L:[S('sub','a ⊕ ( a ⊙ (a ⊕ a) ) = a      (2)<span class="tag">Abs1 con x=a, y=a⊕a</span>')]},
{say:'Ahora viene la clave. Mira dentro del paréntesis de la ecuación dos: aparece exactamente a ⊙ (a ⊕ a). Por la ecuación uno, esa expresión vale a. Lo marcamos.',L:[S('sub','a ⊕ ( <mark>a ⊙ (a ⊕ a)</mark> ) = a      (2)'),S('txt','Por (1):  <mark>a ⊙ (a ⊕ a)</mark> = a')]},
{say:'Sustituimos ese bloque por a. La ecuación dos queda: a ⊕ a igual a a.',L:[S('sub','a ⊕ ( <mark>a</mark> ) = a'),S('res','a ⊕ a = a   ∎<span class="tag">Conclusión: ⊕ es idempotente</span>')]},
{say:'Como a era arbitrario, esto vale para todo a de B. Ya tenemos la idempotencia de la suma.',L:[S('res','∀a∈B:  a ⊕ a = a')]},
{title:'Parte 2: idempotencia de ⊙',clear:1,say:'Ahora la idempotencia del producto. La idea es la misma, pero intercambiando los papeles de Abs1 y Abs2. Tomamos de nuevo a arbitrario en B.',L:[S('txt','Sea a ∈ B  (arbitrario)'),S('goal','Queremos: a ⊙ a = a<span class="tag">Tesis</span>')]},
{say:'Esta vez empezamos por Abs1: x ⊕ (x ⊙ y) = x.',L:[S('hyp','(Abs1)  x ⊕ (x ⊙ y) = x<span class="tag">Hipótesis</span>')]},
{say:'Elegimos x igual a a, e y igual a a. Vale para todo x e y, así que en particular para estos.',L:[S('sub','x = a,   y = a<span class="tag">Elección</span>')]},
{say:'Sustituyendo: a ⊕ (a ⊙ a) es igual a a. Es la ecuación tres. Ahora aparece a ⊙ a, que es lo que queremos simplificar.',L:[S('sub','a ⊕ (a ⊙ a) = a      (3)<span class="tag">Abs1 con x=a, y=a</span>')]},
{say:'Ahora usamos Abs2: x ⊙ (x ⊕ y) = x.',L:[S('hyp','(Abs2)  x ⊙ (x ⊕ y) = x<span class="tag">Hipótesis</span>')]},
{say:'Elegimos x igual a a, e y igual a a ⊙ a. Es legítimo porque el producto es una operación interna, y por tanto a ⊙ a está en B.',L:[S('sub','x = a,   y = a ⊙ a  ∈ B<span class="tag">Elección (⊙ interna)</span>')]},
{say:'Sustituimos: a ⊙ (a ⊕ (a ⊙ a)) es igual a a. Es la ecuación cuatro.',L:[S('sub','a ⊙ ( a ⊕ (a ⊙ a) ) = a      (4)<span class="tag">Abs2 con x=a, y=a⊙a</span>')]},
{say:'Observa el paréntesis interior de la ecuación cuatro: es a ⊕ (a ⊙ a). Por la ecuación tres, vale a.',L:[S('sub','a ⊙ ( <mark>a ⊕ (a ⊙ a)</mark> ) = a      (4)'),S('txt','Por (3):  <mark>a ⊕ (a ⊙ a)</mark> = a')]},
{say:'Sustituyendo ese bloque por a, la ecuación cuatro queda: a ⊙ a igual a a.',L:[S('sub','a ⊙ ( <mark>a</mark> ) = a'),S('res','a ⊙ a = a   ∎<span class="tag">Conclusión: ⊙ es idempotente</span>')]},
{title:'Resumen',clear:1,say:'Resumiendo. Con solo las dos leyes de absorción, y usando que las operaciones son internas, hemos probado que para todo a de B, a ⊕ a es a, y a ⊙ a es a. Hemos seguido el mismo patrón: aplicar una absorción con x igual a y igual a a, aplicarla de nuevo con y igual al resultado, y sustituir. Gracias por ver el vídeo.',L:[S('res','∀a∈B:  a ⊕ a = a'),S('res','∀a∈B:  a ⊙ a = a')]}
];
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l.c;d.innerHTML=l.t;if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){const d=document.createElement('div');d.className='l hyp';d.textContent=s.pin;if(k<n)d.style.animation='none';pins.appendChild(d)}}
 board.scrollTop=board.scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();txt=txt.replace(/⊕/g,' más ').replace(/⊙/g,' por ').replace(/[()]/g,', ').replace(/\s+/g,' ');const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang='es-ES';
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Repetir'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Continuar'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pausa';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pausa';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pausa';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/pablo|jorge|diego|enrique|miguel|alvaro|álvaro|male|google español$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
document.body.addEventListener('click',()=>{},{once:true});
render(-1);$('cap').textContent='0 / '+steps.length;
</script></body></html>
