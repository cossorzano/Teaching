{"title": "𝒫(U) es un retículo distributivo", "sub": "Ejercicio · Álgebra de conjuntos", "clear": 1, "say": "Hola. En este vídeo vamos a resolver un ejercicio sobre álgebra de conjuntos. Vamos a ir muy despacio, escribiendo cada ecuación y justificando cada paso.", "L": [["txt", "Demostrar que las partes de U, con la unión y la intersección, forman un retículo distributivo"]]},
{"say": "Primero, los datos. Ya sabemos que las partes de U, con la unión y la intersección, forman un retículo, donde la unión juega el papel de supremo, y la intersección el de ínfimo.", "L": [["hyp", "(𝒫(U), ∪, ∩) es un retículo<span class='tag'>Hipótesis: ya sabemos</span>"], ["txt", "∪ = supremo,     ∩ = ínfimo"]]},

{"title": "Primera ley: A ∩ (B ∪ C) ⊆ (A ∩ B) ∪ (A ∩ C)", "clear": 1, "say": "Empezamos con la primera igualdad. Sea x un elemento de U. Primero probamos la inclusión de izquierda a derecha. Suponemos que x pertenece a A intersección, B unión C. Esto es una hipótesis.", "L": [["txt", "Sea x ∈ U"], ["hyp", "x ∈ A ∩ (B ∪ C)<span class='tag'>Hipótesis</span>"], ["goal", "Queremos:  x ∈ (A ∩ B) ∪ (A ∩ C)<span class='tag'>Tesis</span>"]]},

{"say": "En cualquier caso, x pertenece a A intersección B, o x pertenece a A intersección C. Por la definición de unión, x pertenece a A intersección B, unión, A intersección C. Con esto termina esta inclusión.", "L": [["res", "x ∈ (A ∩ B) ∪ (A ∩ C)<span class='tag'>Definición de ∪, en cualquier caso</span>"], ["res", "A ∩ (B ∪ C) ⊆ (A ∩ B) ∪ (A ∩ C)   ∎"]]},
{"title": "Primera ley: (A ∩ B) ∪ (A ∩ C) ⊆ A ∩ (B ∪ C)", "clear": 1, "say": "Recíprocamente, probamos la inclusión de derecha a izquierda. Suponemos que x pertenece a A intersección B, unión, A intersección C. Esto es una hipótesis. Por la definición de unión, x pertenece a A intersección B, o x pertenece a A intersección C.", "L": [["hyp", "x ∈ (A ∩ B) ∪ (A ∩ C)<span class='tag'>Hipótesis</span>"], ["hyp", "x ∈ A ∩ B   o   x ∈ A ∩ C<span class='tag'>Definición de ∪</span>"], ["goal", "Queremos:  x ∈ A ∩ (B ∪ C)<span class='tag'>Tesis</span>"]]},

{"title": "Primera ley distributiva", "clear": 1, "say": "Hemos probado las dos inclusiones. Por la doble inclusión, concluimos la primera igualdad: A intersección, B unión C, es igual a, A intersección B, unión, A intersección C.", "L": [["res", "A ∩ (B ∪ C) = (A ∩ B) ∪ (A ∩ C)   ∎<span class='tag'>Doble inclusión</span>"]]},
{"title": "Segunda ley (1): A ∪ (B ∩ C) ⊆ (A ∪ B) ∩ (A ∪ C)", "clear": 1, "say": "Probamos ahora la segunda ley distributiva, también por doble inclusión. Sea x un elemento de U. Empezamos por el apartado uno: demostrar que A unión, B intersección C, está contenido en, A unión B, intersección, A unión C. Suponemos que x pertenece a A unión, B intersección C. Esto es una hipótesis.", "L": [["txt", "Sea x ∈ U"], ["hyp", "x ∈ A ∪ (B ∩ C)<span class='tag'>Hipótesis</span>"], ["goal", "Queremos:  x ∈ (A ∪ B) ∩ (A ∪ C)<span class='tag'>Tesis</span>"]]},

{"say": "En cualquiera de los dos casos, x pertenece a A unión B, intersección, A unión C. Y por tanto, A unión, B intersección C, está contenido en, A unión B, intersección, A unión C.", "L": [["res", "A ∪ (B ∩ C) ⊆ (A ∪ B) ∩ (A ∪ C)   ∎<span class='tag'>En ambos casos</span>"]]},
{"title": "Segunda ley (2): (A ∪ B) ∩ (A ∪ C) ⊆ A ∪ (B ∩ C)", "clear": 1, "say": "Pasamos al apartado dos: demostrar que A unión B, intersección, A unión C, está contenido en, A unión, B intersección C. Suponemos ahora que x pertenece a A unión B, intersección, A unión C. Esto es una hipótesis.", "L": [["hyp", "x ∈ (A ∪ B) ∩ (A ∪ C)<span class='tag'>Hipótesis</span>"], ["goal", "Queremos:  x ∈ A ∪ (B ∩ C)<span class='tag'>Tesis</span>"]]},
{"say": "Por la definición de intersección, x pertenece a A unión B, y x pertenece a A unión C. Y por la definición de unión, esto significa: x pertenece a A o x pertenece a B, y además, x pertenece a A o x pertenece a C.", "L": [["hyp", "x ∈ A ∪ B   y   x ∈ A ∪ C<span class='tag'>Definición de ∩</span>"], ["hyp", "(x ∈ A  o  x ∈ B)   y   (x ∈ A  o  x ∈ C)<span class='tag'>Definición de ∪</span>"]]},
{"say": "Primer caso: supongamos que x pertenece a A. Esto es una hipótesis. Entonces, claramente, x pertenece a A unión, B intersección C, por la definición de unión, y hemos terminado.", "L": [["hyp", "Caso:  x ∈ A<span class='tag'>Hipótesis del caso</span>"], ["res", "x ∈ A ∪ (B ∩ C)<span class='tag'>Definición de ∪: hemos terminado</span>"]]},
{"say": "Segundo caso: supongamos por tanto que x no pertenece a A. Esto es una hipótesis. Bajo esta suposición, de las condiciones anteriores se deduce lo siguiente.", "L": [["hyp", "Caso:  x ∉ A<span class='tag'>Hipótesis del caso</span>"]]},
{"say": "De x pertenece a A unión B, y x no pertenece a A, se sigue que x pertenece a B.", "L": [["sub", "x ∈ A ∪ B   y   x ∉ A   ⟹   x ∈ B<span class='tag'>Si x ∈ A o x ∈ B, y x ∉ A, entonces x ∈ B</span>"]]},

<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' más ').replace(/⊙/g,' por ').replace(/∼/g,' complementario de ').replace(/≤/g,' menor o igual que ').replace(/[()]/g,', ').replace(/\b1\b/g,' uno ').replace(/\b0\b/g,' cero ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Repetir'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Continuar'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pausa';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pausa';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pausa';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/pablo|jorge|diego|enrique|miguel|alvaro|álvaro|male|google español$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent='𝒫(U) es un retículo distributivo';$('sub').textContent='Ejercicio · Álgebra de conjuntos';
$('cap').textContent='0 / '+steps.length;
</script></body></html>
