<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>P(U) es un retículo</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>Recuerda</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Empezar</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Velocidad <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Modo grabación (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">

"meta":{"nivel": 2, "titulo": "𝒫(U) es un retículo", "enunciado": "Demostrar que (𝒫(U), ∪, ∩) es un retículo.", "tesis": "(𝒫(U), ∪, ∩) es un retículo", "datos": ["(Retículo)  ⊕, ⊙ internas;  conmutatividad, asociatividad, absorción", "(Def ∪)  x ∈ A ∪ B ⇔ x ∈ A o x ∈ B", "(Def ∩)  x ∈ A ∩ B ⇔ x ∈ A y x ∈ B"]},
"steps":[
{"title": "𝒫(U) es un retículo", "sub": "Ejercicio · Retículos algebraicos", "clear": 1, "say": "Hola. En este vídeo vamos a resolver un ejercicio sobre retículos y conjuntos. Vamos a ir muy despacio, escribiendo cada ecuación y justificando cada paso.", "L": [["txt", "Demostrar que las partes de U, con la unión y la intersección, forman un retículo"]]},
{"say": "Primero, recordamos qué es un retículo. En un retículo, B con las operaciones suma y producto, las dos operaciones deben ser internas en B, y satisfacer tres propiedades: conmutatividad, asociatividad y absorción.", "L": [["hyp", "(B, ⊕, ⊙) retículo  ⇔  ⊕, ⊙ internas en B  y  cumplen:<span class='tag'>Definición</span>"], ["hyp", "Conmutatividad,   Asociatividad,   Absorción"]]},
{"say": "En nuestro caso, B es el conjunto de partes de U, la suma es la unión, y el producto es la intersección. Lo que queremos demostrar es que se cumplen estas condiciones.", "L": [["sub", "B = 𝒫(U),     ⊕ = ∪,     ⊙ = ∩<span class='tag'>Nuestro caso</span>"], ["goal", "Probar:  (𝒫(U), ∪, ∩) es un retículo<span class='tag'>Tesis</span>"]]},
{"title": "Operaciones internas", "clear": 1, "say": "Primero, las operaciones son internas. Dados dos subconjuntos A y B de U, la unión de A y B también es un subconjunto de U, y la intersección de A y B también es un subconjunto de U. Es decir, la unión y la intersección de dos elementos de las partes de U siguen estando en las partes de U.", "L": [["txt", "Sean A, B ⊆ U"], ["res", "A ∪ B ⊆ U<span class='tag'>∪ es interna</span>"], ["res", "A ∩ B ⊆ U<span class='tag'>∩ es interna</span>"]]},
{"title": "Método: razonar con elementos", "clear": 1, "say": "Probamos ahora las propiedades por razonamiento con elementos. Sean A, B y C subconjuntos de U, y sea x un elemento de U. Recordamos que dos conjuntos son iguales si y solo si tienen los mismos elementos. Así, para probar que dos conjuntos son iguales, probaremos que x pertenece a uno si y solo si pertenece al otro.", "L": [["txt", "Sean A, B, C ⊆ U  y  x ∈ U"], ["goal", "X = Y   ⇔   (x ∈ X ⇔ x ∈ Y)<span class='tag'>Igualdad de conjuntos: mismos elementos</span>"]]},
{"say": "Y recordamos la definición de unión y de intersección. x pertenece a la unión de A y B si y solo si x pertenece a A, o x pertenece a B. Y x pertenece a la intersección de A y B si y solo si x pertenece a A, y x pertenece a B. Las anotamos a la izquierda.", "L": [["sub", "x ∈ A ∪ B  ⇔  x ∈ A  o  x ∈ B<span class='tag'>Definición de unión</span>"], ["sub", "x ∈ A ∩ B  ⇔  x ∈ A  y  x ∈ B<span class='tag'>Definición de intersección</span>"]], "pin": ["(Def ∪) x ∈ A ∪ B ⇔ x ∈ A o x ∈ B", "(Def ∩) x ∈ A ∩ B ⇔ x ∈ A y x ∈ B"]},
{"title": "Conmutatividad de ∪", "clear": 1, "say": "Empezamos con la conmutatividad de la unión. Queremos probar que A unión B es igual a B unión A. Partimos de x pertenece a A unión B.", "L": [["goal", "Queremos:  A ∪ B = B ∪ A"], ["txt", "x ∈ A ∪ B"]]},
{"say": "Primer paso. Por la definición de unión, x pertenece a A unión B si y solo si x pertenece a A, o x pertenece a B.", "L": [["sub", "⇔  x ∈ A  o  x ∈ B<span class='tag'>Definición de ∪</span>"]]},
{"say": "Segundo paso. Por la conmutatividad de la disyunción lógica o, podemos intercambiar el orden: x pertenece a B, o x pertenece a A.", "L": [["sub", "⇔  x ∈ B  o  x ∈ A<span class='tag'>Conmutatividad de «o»</span>"]]},
{"say": "Tercer paso. Por la definición de unión, leída al revés, esto equivale a que x pertenece a B unión A. Como x es arbitrario, los dos conjuntos tienen los mismos elementos, y por tanto son iguales.", "L": [["res", "⇔  x ∈ B ∪ A<span class='tag'>Definición de ∪</span>"], ["res", "A ∪ B = B ∪ A   ∎"]]},
{"title": "Conmutatividad de ∩", "clear": 1, "say": "Seguimos con la conmutatividad de la intersección. Queremos probar que A intersección B es igual a B intersección A. Partimos de x pertenece a A intersección B.", "L": [["goal", "Queremos:  A ∩ B = B ∩ A"], ["txt", "x ∈ A ∩ B"]]},
{"say": "Primer paso. Por la definición de intersección, x pertenece a A intersección B si y solo si x pertenece a A, y x pertenece a B.", "L": [["sub", "⇔  x ∈ A  y  x ∈ B<span class='tag'>Definición de ∩</span>"]]},
{"say": "Segundo paso. Por la conmutatividad de la conjunción lógica y, podemos intercambiar el orden: x pertenece a B, y x pertenece a A.", "L": [["sub", "⇔  x ∈ B  y  x ∈ A<span class='tag'>Conmutatividad de «y»</span>"]]},
{"say": "Tercer paso. Por la definición de intersección, leída al revés, esto equivale a que x pertenece a B intersección A. Como x es arbitrario, los dos conjuntos son iguales.", "L": [["res", "⇔  x ∈ B ∩ A<span class='tag'>Definición de ∩</span>"], ["res", "A ∩ B = B ∩ A   ∎"]]},
{"title": "Asociatividad de ∪", "clear": 1, "say": "Pasamos a la asociatividad de la unión. Queremos probar que A unión, B unión C, es igual a, A unión B, unión C. Partimos de x pertenece a A unión, B unión C.", "L": [["goal", "Queremos:  A ∪ (B ∪ C) = (A ∪ B) ∪ C"], ["txt", "x ∈ A ∪ (B ∪ C)"]]},
{"say": "Primer paso. Por la definición de unión, x pertenece a A, o x pertenece a B unión C. Y aplicando otra vez la definición, x pertenece a B unión C si y solo si x pertenece a B, o x pertenece a C.", "L": [["sub", "⇔  x ∈ A  o  (x ∈ B  o  x ∈ C)<span class='tag'>Definición de ∪, aplicada dos veces</span>"]]},
{"say": "Segundo paso. Por la asociatividad de la disyunción lógica o, no importa cómo agrupemos, así que podemos quitar los paréntesis: x pertenece a A, o x pertenece a B, o x pertenece a C.", "L": [["sub", "⇔  (x ∈ A  o  x ∈ B  o  x ∈ C)<span class='tag'>Asociatividad de «o»</span>"]]},
{"say": "Tercer paso. Agrupamos los dos primeros términos. Por la definición de unión, x pertenece a A, o x pertenece a B, equivale a que x pertenece a A unión B. Por tanto, tenemos x pertenece a A unión B, o x pertenece a C.", "L": [["sub", "⇔  (x ∈ A ∪ B)  o  x ∈ C<span class='tag'>Definición de ∪</span>"]]},
{"say": "Cuarto paso. Por la definición de unión, esto equivale a que x pertenece a A unión B, unión C. Como x es arbitrario, los dos conjuntos son iguales.", "L": [["res", "⇔  x ∈ (A ∪ B) ∪ C<span class='tag'>Definición de ∪</span>"], ["res", "A ∪ (B ∪ C) = (A ∪ B) ∪ C   ∎"]]},
{"title": "Asociatividad de ∩", "clear": 1, "say": "Seguimos con la asociatividad de la intersección. Queremos probar que A intersección, B intersección C, es igual a, A intersección B, intersección C. Partimos de x pertenece a A intersección, B intersección C.", "L": [["goal", "Queremos:  A ∩ (B ∩ C) = (A ∩ B) ∩ C"], ["txt", "x ∈ A ∩ (B ∩ C)"]]},
{"say": "Primer paso. Por la definición de intersección, x pertenece a A, y x pertenece a B intersección C. Y aplicando otra vez la definición, x pertenece a B intersección C si y solo si x pertenece a B, y x pertenece a C.", "L": [["sub", "⇔  x ∈ A  y  (x ∈ B  y  x ∈ C)<span class='tag'>Definición de ∩, aplicada dos veces</span>"]]},
{"say": "Segundo paso. Por la asociatividad de la conjunción lógica y, podemos quitar los paréntesis: x pertenece a A, y x pertenece a B, y x pertenece a C.", "L": [["sub", "⇔  (x ∈ A  y  x ∈ B  y  x ∈ C)<span class='tag'>Asociatividad de «y»</span>"]]},
{"say": "Tercer paso. Agrupamos los dos primeros términos. Por la definición de intersección, x pertenece a A, y x pertenece a B, equivale a que x pertenece a A intersección B. Por tanto, tenemos x pertenece a A intersección B, y x pertenece a C.", "L": [["sub", "⇔  (x ∈ A ∩ B)  y  x ∈ C<span class='tag'>Definición de ∩</span>"]]},
{"say": "Cuarto paso. Por la definición de intersección, esto equivale a que x pertenece a A intersección B, intersección C. Como x es arbitrario, los dos conjuntos son iguales.", "L": [["res", "⇔  x ∈ (A ∩ B) ∩ C<span class='tag'>Definición de ∩</span>"], ["res", "A ∩ (B ∩ C) = (A ∩ B) ∩ C   ∎"]]},
{"title": "Absorción de ∪", "clear": 1, "say": "Terminamos con la absorción de la unión. Queremos probar que A unión, A intersección B, es igual a A. Partimos de x pertenece a A unión, A intersección B.", "L": [["goal", "Queremos:  A ∪ (A ∩ B) = A"], ["txt", "x ∈ A ∪ (A ∩ B)"]]},
{"say": "Primer paso. Por la definición de unión, y después la de intersección, x pertenece a A, o, x pertenece a A y x pertenece a B.", "L": [["sub", "⇔  x ∈ A  o  (x ∈ A  y  x ∈ B)<span class='tag'>Definición de ∪ y de ∩</span>"]]},
{"say": "Segundo paso. Esto equivale a que x pertenece a A. Si x pertenece a A, la primera parte de la disyunción es cierta. Y recíprocamente, si la disyunción es cierta, o bien x pertenece a A, o bien x pertenece a A y a B, y en los dos casos x pertenece a A.", "L": [["sub", "⇔  x ∈ A<span class='tag'>Si x ∈ A se cumple la disyunción; y si se cumple la disyunción, x ∈ A</span>"]]},
{"say": "Tercer paso. La última línea escribe de nuevo que x pertenece a A. Es la pertenencia al conjunto de la derecha de la igualdad. Como x es arbitrario, los dos conjuntos son iguales.", "L": [["res", "⇔  x ∈ A"], ["res", "A ∪ (A ∩ B) = A   ∎"]]},
{"title": "Absorción de ∩", "clear": 1, "say": "Y la absorción de la intersección. Queremos probar que A intersección, A unión B, es igual a A. Partimos de x pertenece a A intersección, A unión B.", "L": [["goal", "Queremos:  A ∩ (A ∪ B) = A"], ["txt", "x ∈ A ∩ (A ∪ B)"]]},
{"say": "Primer paso. Por la definición de intersección, y después la de unión, x pertenece a A, y, x pertenece a A o x pertenece a B.", "L": [["sub", "⇔  x ∈ A  y  (x ∈ A  o  x ∈ B)<span class='tag'>Definición de ∩ y de ∪</span>"]]},
{"say": "Segundo paso. Esto equivale a que x pertenece a A. Si x pertenece a A, se cumplen las dos partes de la conjunción, porque x pertenece a A hace cierta la segunda. Y recíprocamente, si la conjunción es cierta, x pertenece a A por la primera parte.", "L": [["sub", "⇔  x ∈ A<span class='tag'>Si x ∈ A se cumple la conjunción; y si se cumple, x ∈ A</span>"]]},
{"say": "Tercer paso. La última línea escribe de nuevo que x pertenece a A. Como x es arbitrario, los dos conjuntos son iguales.", "L": [["res", "⇔  x ∈ A"], ["res", "A ∩ (A ∪ B) = A   ∎"]]},
{"title": "Conclusión", "clear": 1, "say": "Como ambas operaciones son internas y satisfacen conmutatividad, asociatividad y absorción, concluimos que las partes de U, con la unión y la intersección, son un retículo. Gracias por ver el vídeo.", "L": [["res", "∪, ∩ internas en 𝒫(U)"], ["res", "Conmutatividad,  Asociatividad,  Absorción"], ["res", "(𝒫(U), ∪, ∩) es un retículo   ∎"]]}

<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' más ').replace(/⊙/g,' por ').replace(/∼/g,' complementario de ').replace(/≤/g,' menor o igual que ').replace(/[()]/g,', ').replace(/\b1\b/g,' uno ').replace(/\b0\b/g,' cero ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Repetir'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Continuar'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pausa';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pausa';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pausa';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/pablo|jorge|diego|enrique|miguel|alvaro|álvaro|male|google español$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent='P(U) es un retículo';$('sub').textContent='Ejercicio · Álgebra de Boole';
$('cap').textContent='0 / '+steps.length;
</script></body></html>
