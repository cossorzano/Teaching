<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inclusiones en el plano</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>Recuerda</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Empezar</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Velocidad <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Modo grabación (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"es-ES",
"meta":{"nivel": 1, "titulo": "Inclusiones en el plano", "enunciado": "Sea δ > 0 y consideremos en ℝ² los conjuntos A = { (x, y) ∈ ℝ² | |x| + |y| < δ }, B = { (x, y) ∈ ℝ² | √(x² + y²) < δ } y C = { (x, y) ∈ ℝ² | max{ |x|, |y| } < δ }. Demostrar que:", "tesis": "A ⊆ B ⊆ C", "datos": ["δ > 0", "A = { (x, y) ∈ ℝ² | |x| + |y| < δ }", "B = { (x, y) ∈ ℝ² | √(x² + y²) < δ }", "C = { (x, y) ∈ ℝ² | max{ |x|, |y| } < δ }"]},

{"title": "Inclusiones en el plano", "sub": "Ejercicio · Álgebra de conjuntos", "clear": 1, "say": "Hola. En este vídeo vamos a demostrar que tres conjuntos del plano, definidos con el valor absoluto, la norma euclídea y el máximo, están uno dentro de otro. Iremos muy despacio, escribiendo cada ecuación y justificando cada paso.", "L": [["txt", "Demostrar que  A ⊆ B ⊆ C  en el plano"]]},
{"say": "Los datos. Sea delta un número real mayor que cero. A es el conjunto de los puntos x, y del plano tales que el valor absoluto de x, más el valor absoluto de y, es menor que delta. B es el conjunto de los puntos x, y tales que la raíz cuadrada de x al cuadrado más y al cuadrado es menor que delta. Y C es el conjunto de los puntos x, y tales que el máximo del valor absoluto de x y el valor absoluto de y es menor que delta.", "L": [["hyp", "δ &gt; 0<span class='tag'>Dato</span>"], ["hyp", "A = { (x, y) ∈ ℝ² | |x| + |y| &lt; δ }"], ["hyp", "B = { (x, y) ∈ ℝ² | √(x² + y²) &lt; δ }"], ["hyp", "C = { (x, y) ∈ ℝ² | max{ |x|, |y| } &lt; δ }"]]},
{"say": "Lo que queremos demostrar. A está incluido en B, y B está incluido en C. Aquí inclusión significa incluido o igual. A la derecha vemos los tres conjuntos dibujados para delta igual a uno: A es el rombo, B es el círculo, y C es el cuadrado. Las líneas discontinuas indican que el borde no pertenece al conjunto. Recordamos a la izquierda lo que vamos a usar: la definición de inclusión, que el cuadrado de un valor absoluto es el cuadrado del número, que la raíz cuadrada del cuadrado de un número es su valor absoluto, y que la raíz cuadrada conserva el orden.", "L": [["goal", "A ⊆ B   y   B ⊆ C<span class='tag'>Demostrar</span>"], ["txt", "<svg viewBox='0 0 300 300' width='100%' style='max-width:300px;display:block' xmlns='http://www.w3.org/2000/svg' font-family='Georgia,serif'><rect x='40' y='40' width='220' height='220' fill='#7be0a0' fill-opacity='.15' stroke='#7be0a0' stroke-width='2.5' stroke-dasharray='6 4'/><circle cx='150' cy='150' r='110' fill='#ffd166' fill-opacity='.15' stroke='#ffd166' stroke-width='2.5' stroke-dasharray='6 4'/><polygon points='150,40 260,150 150,260 40,150' fill='#7cc4ff' fill-opacity='.25' stroke='#7cc4ff' stroke-width='2.5' stroke-dasharray='6 4'/><line x1='10' y1='150' x2='290' y2='150' stroke='#9fb3aa' stroke-width='1'/><line x1='150' y1='10' x2='150' y2='290' stroke='#9fb3aa' stroke-width='1'/><text x='260' y='166' fill='#9fb3aa' font-size='16' text-anchor='middle'>δ</text><text x='40' y='166' fill='#9fb3aa' font-size='16' text-anchor='middle'>−δ</text><text x='156' y='54' fill='#9fb3aa' font-size='14'>δ</text><text x='136' y='155' fill='#7cc4ff' font-size='18'>A</text><text x='184' y='116' fill='#ffd166' font-size='18'>B</text><text x='216' y='84' fill='#7be0a0' font-size='18'>C</text></svg>"]], "pin": ["(Def ⊆) X ⊆ Y  ⟺  todo p ∈ X cumple p ∈ Y", "(P1) |a|² = a²", "(P2) √(a²) = |a|", "(P3) si 0 ≤ u ≤ v entonces √u ≤ √v"], "clear": 1},
{"title": "1) A ⊆ B", "clear": 1, "say": "Primera parte: demostramos que A está incluido en B. Por la definición de inclusión, tomamos un punto cualquiera x, y de A, y tenemos que probar que pertenece a B.", "L": [["hyp", "Sea (x, y) ∈ A"], ["goal", "Queremos:  (x, y) ∈ B,  es decir,  √(x² + y²) &lt; δ"]]},
{"say": "Como x, y pertenece a A, por la definición de A se cumple que el valor absoluto de x, más el valor absoluto de y, es menor que delta. Esta es nuestra hipótesis.", "L": [["hyp", "(x, y) ∈ A  ⟹  |x| + |y| &lt; δ<span class='tag'>Hipótesis</span>"]]},
{"clear": 1, "say": "Ahora calculamos el cuadrado de la suma de los valores absolutos. Desarrollando el cuadrado de una suma, es el cuadrado de valor absoluto de x, más dos veces el valor absoluto de x por el valor absoluto de y, más el cuadrado del valor absoluto de y.", "L": [["txt", "Desarrollamos el cuadrado de una suma:"], ["sub", "(|x| + |y|)² = |x|² + 2|x||y| + |y|²"]]},
{"say": "Por la propiedad P1, el cuadrado de valor absoluto de x es x al cuadrado, y el cuadrado del valor absoluto de y es y al cuadrado. Lo sustituimos.", "L": [["txt", "Por (P1) con a = x  y  con a = y:"], ["sub", "(|x| + |y|)² = <mark>x²</mark> + 2|x||y| + <mark>y²</mark>"]]},
{"say": "Como el valor absoluto de x y el valor absoluto de y son mayores o iguales que cero, el término dos por valor absoluto de x por valor absoluto de y es mayor o igual que cero. Por tanto, si se lo quitamos a la suma, ésta disminuye o se queda igual. Luego el cuadrado de la suma es mayor o igual que x al cuadrado más y al cuadrado.", "L": [["txt", "Como |x| ≥ 0 y |y| ≥ 0, se tiene 2|x||y| ≥ 0, luego:"], ["res", "x² + y² ≤ (|x| + |y|)²"]]},
{"clear": 1, "say": "Ahora tomamos raíces cuadradas. Usamos la propiedad P3, con u igual a x al cuadrado más y al cuadrado, y v igual al cuadrado de la suma de los valores absolutos. Ambos son mayores o iguales que cero, y u es menor o igual que v. Entonces la raíz cuadrada de x al cuadrado más y al cuadrado es menor o igual que la raíz cuadrada de, valor absoluto de x más valor absoluto de y, al cuadrado.", "L": [["txt", "(P3) con  u = x² + y²,  v = (|x| + |y|)²,  0 ≤ u ≤ v:"], ["sub", "√(x² + y²) ≤ √( (|x| + |y|)² )"]]},
{"say": "Y por la propiedad P2, con a igual a la suma del valor absoluto de x y el valor absoluto de y, la raíz cuadrada de ese cuadrado es el valor absoluto de la suma. Pero la suma ya es mayor o igual que cero, así que su valor absoluto es ella misma.", "L": [["txt", "(P2) con  a = |x| + |y| ≥ 0:   √( (|x| + |y|)² ) = | |x| + |y| | = |x| + |y|"], ["res", "√(x² + y²) ≤ |x| + |y|"]]},
{"clear": 1, "say": "Juntamos esta desigualdad con la hipótesis. La raíz cuadrada de x al cuadrado más y al cuadrado es menor o igual que el valor absoluto de x más el valor absoluto de y, y esto es menor que delta.", "L": [["txt", "Juntando con la hipótesis  |x| + |y| &lt; δ :"], ["res", "√(x² + y²) ≤ |x| + |y| &lt; δ"]]},
{"say": "Por tanto, la raíz cuadrada de x al cuadrado más y al cuadrado es menor que delta. Esto es exactamente la definición de B, así que x, y pertenece a B. Como x, y era un punto cualquiera de A, concluimos que A está incluido en B.", "L": [["txt", "Entonces  √(x² + y²) &lt; δ,  luego:"], ["hyp", "(x, y) ∈ B"], ["res", "A ⊆ B"]]},
{"title": "2) B ⊆ C", "clear": 1, "say": "Segunda parte: demostramos que B está incluido en C. Tomamos un punto cualquiera x, y de B, y tenemos que probar que pertenece a C.", "L": [["hyp", "Sea (x, y) ∈ B"], ["goal", "Queremos:  (x, y) ∈ C,  es decir,  max{ |x|, |y| } &lt; δ"]]},
{"say": "Como x, y pertenece a B, por la definición de B se cumple que la raíz cuadrada de x al cuadrado más y al cuadrado es menor que delta. Esta es nuestra hipótesis.", "L": [["hyp", "(x, y) ∈ B  ⟹  √(x² + y²) &lt; δ<span class='tag'>Hipótesis</span>"]]},
{"clear": 1, "say": "Primero, como y al cuadrado es mayor o igual que cero, x al cuadrado es menor o igual que x al cuadrado más y al cuadrado. De la misma forma, como x al cuadrado es mayor o igual que cero, y al cuadrado es menor o igual que x al cuadrado más y al cuadrado.", "L": [["txt", "Como  y² ≥ 0  y  x² ≥ 0:"], ["sub", "x² ≤ x² + y²"], ["sub", "y² ≤ x² + y²"]]},
{"say": "Tomamos raíces cuadradas, con la propiedad P3. Con u igual a x al cuadrado, y v igual a x al cuadrado más y al cuadrado, la raíz de x al cuadrado es menor o igual que la raíz de x al cuadrado más y al cuadrado. Y por la propiedad P2, la raíz cuadrada de x al cuadrado es el valor absoluto de x. Lo mismo con y.", "L": [["txt", "(P3) con  u = x²,  v = x² + y²,  y después (P2) con  a = x:"], ["sub", "|x| = √(x²) ≤ √(x² + y²)"], ["txt", "(P3) con  u = y²,  v = x² + y²,  y después (P2) con  a = y:"], ["sub", "|y| = √(y²) ≤ √(x² + y²)"]]},
{"clear": 1, "say": "Ahora usamos la hipótesis. El valor absoluto de x es menor o igual que la raíz de x al cuadrado más y al cuadrado, que es menor que delta. Y lo mismo para y. Por tanto, el valor absoluto de x es menor que delta, y el valor absoluto de y es menor que delta.", "L": [["txt", "Juntando con la hipótesis  √(x² + y²) &lt; δ :"], ["res", "|x| ≤ √(x² + y²) &lt; δ"], ["res", "|y| ≤ √(x² + y²) &lt; δ"]]},
{"say": "El máximo de dos números es uno de los dos, y los dos son menores que delta. Por tanto, el máximo del valor absoluto de x y el valor absoluto de y es menor que delta. Esto es la definición de C, así que x, y pertenece a C. Como x, y era un punto cualquiera de B, concluimos que B está incluido en C.", "L": [["txt", "|x| &lt; δ  y  |y| &lt; δ  ⟹  max{ |x|, |y| } &lt; δ"], ["hyp", "(x, y) ∈ C"], ["res", "B ⊆ C"]]},
{"title": "Conclusión", "clear": 1, "say": "Conclusión. Juntando las dos partes, A está incluido en B, y B está incluido en C. Geométricamente, el rombo está dentro del círculo, y el círculo está dentro del cuadrado. Gracias por ver el vídeo.", "L": [["res", "A ⊆ B   y   B ⊆ C   ⟹   A ⊆ B ⊆ C"], ["txt", "<svg viewBox='0 0 300 300' width='100%' style='max-width:300px;display:block' xmlns='http://www.w3.org/2000/svg' font-family='Georgia,serif'><rect x='40' y='40' width='220' height='220' fill='#7be0a0' fill-opacity='.15' stroke='#7be0a0' stroke-width='2.5' stroke-dasharray='6 4'/><circle cx='150' cy='150' r='110' fill='#ffd166' fill-opacity='.15' stroke='#ffd166' stroke-width='2.5' stroke-dasharray='6 4'/><polygon points='150,40 260,150 150,260 40,150' fill='#7cc4ff' fill-opacity='.25' stroke='#7cc4ff' stroke-width='2.5' stroke-dasharray='6 4'/><line x1='10' y1='150' x2='290' y2='150' stroke='#9fb3aa' stroke-width='1'/><line x1='150' y1='10' x2='150' y2='290' stroke='#9fb3aa' stroke-width='1'/><text x='260' y='166' fill='#9fb3aa' font-size='16' text-anchor='middle'>δ</text><text x='40' y='166' fill='#9fb3aa' font-size='16' text-anchor='middle'>−δ</text><text x='156' y='54' fill='#9fb3aa' font-size='14'>δ</text><text x='136' y='155' fill='#7cc4ff' font-size='18'>A</text><text x='184' y='116' fill='#ffd166' font-size='18'>B</text><text x='216' y='84' fill='#7be0a0' font-size='18'>C</text></svg>"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' más ').replace(/⊙/g,' por ').replace(/∼/g,' complementario de ').replace(/≤/g,' menor o igual que ').replace(/[()]/g,', ').replace(/\b1\b/g,' uno ').replace(/\b0\b/g,' cero ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Repetir'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Continuar'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pausa';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pausa';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pausa';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/pablo|jorge|diego|enrique|miguel|alvaro|álvaro|male|google español$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent='Inclusiones en el plano';$('sub').textContent='Ejercicio · Álgebra de conjuntos';
$('cap').textContent='0 / '+steps.length;
</script></body></html>
