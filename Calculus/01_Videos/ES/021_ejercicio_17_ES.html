<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Valores absolutos y conjuntos</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>Recuerda</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Empezar</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Velocidad <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Modo grabación (H)</button><span id="cap"></span></div></div>

{"title": "Valores absolutos y conjuntos", "sub": "Ejercicio · Álgebra de conjuntos", "clear": 1, "say": "Hola. En este vídeo vamos a resolver un ejercicio de álgebra de conjuntos, donde los conjuntos vienen definidos con valores absolutos. Iremos muy despacio, escribiendo cada ecuación y justificando cada paso.", "L": [["txt", "Unión, intersección, diferencias y diferencia simétrica de dos conjuntos definidos con valores absolutos"]]},
{"say": "Los datos. A es el conjunto de los números reales x tales que el valor absoluto de x es menor que dos. B es el conjunto de los números reales x tales que el valor absoluto de x menos uno, más el valor absoluto de x menos dos, es menor que dos.", "L": [["hyp", "A = { x ∈ ℝ | |x| &lt; 2 }<span class='tag'>Dato</span>"], ["hyp", "B = { x ∈ ℝ | |x − 1| + |x − 2| &lt; 2 }<span class='tag'>Dato</span>"]]},
{"say": "Lo que queremos hacer. Definir y calcular cinco conjuntos: la unión de A y B, la intersección, A menos B, B menos A, y la diferencia simétrica. Recordamos a la izquierda la definición de valor absoluto y las definiciones de las operaciones con elementos, que vamos a usar.", "L": [["goal", "A ∪ B,   A ∩ B,   A ∖ B,   B ∖ A,   A △ B<span class='tag'>Definir y calcular</span>"]], "pin": ["(Def |·|) |a| = a si a ≥ 0;   |a| = −a si a &lt; 0", "(Def ∪) A ∪ B = { x ∈ ℝ | x ∈ A o x ∈ B }", "(Def ∩) A ∩ B = { x ∈ ℝ | x ∈ A y x ∈ B }", "(Def ∖) A ∖ B = { x ∈ ℝ | x ∈ A y x ∉ B }", "(Def △) A △ B = (A ∖ B) ∪ (B ∖ A)"]},
{"title": "1) Determinar A", "clear": 1, "say": "Paso uno. Primero determinamos A y B como intervalos. Empezamos con A. Tenemos que el valor absoluto de x es menor que dos. Usamos la definición de valor absoluto, y distinguimos dos casos según el signo de x.", "L": [["sub", "|x| &lt; 2<span class='tag'>Desigualdad de A</span>"], ["hyp", "Caso 1:  x ≥ 0   ⟹   |x| = x"], ["hyp", "Caso 2:  x &lt; 0   ⟹   |x| = −x"]]},
{"say": "En el caso uno, x es mayor o igual que cero, y el valor absoluto de x es x. La desigualdad queda x menor que dos. Luego x está entre cero, incluido, y dos. En el caso dos, x es menor que cero, y el valor absoluto de x es menos x. La desigualdad queda menos x menor que dos. Multiplicando por menos uno se invierte la desigualdad, y queda x mayor que menos dos. Luego x está entre menos dos y cero, sin incluir el cero. Juntando los dos casos, x está entre menos dos y dos.", "L": [["sub", "Caso 1:  x &lt; 2   y   x ≥ 0   ⟹   0 ≤ x &lt; 2"], ["sub", "Caso 2:  −x &lt; 2  ⟺  x &gt; −2   y   x &lt; 0   ⟹   −2 &lt; x &lt; 0"], ["res", "A = (−2, 2)"], ["txt", "<svg viewBox='0 0 470 82' width='100%' style='max-width:520px;display:block' xmlns='http://www.w3.org/2000/svg'><text x='0' y='15' fill='#7cc4ff' font-size='15' font-family='Georgia,serif'>A = (−2, 2)</text><line x1='30.0' y1='24' x2='440.0' y2='24' stroke='#3d5a50' stroke-width='2'/><line x1='67.27272727272728' y1='24' x2='365.45454545454544' y2='24' stroke='#7cc4ff' stroke-width='6'/><circle cx='67.27272727272728' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><circle cx='365.45454545454544' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><line x1='67.27272727272728' y1='48' x2='67.27272727272728' y2='56' stroke='#9fb3aa'/><text x='67.27272727272728' y='72' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>−2</text><line x1='216.36363636363637' y1='48' x2='216.36363636363637' y2='56' stroke='#9fb3aa'/><text x='216.36363636363637' y='72' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>0</text><line x1='253.63636363636363' y1='48' x2='253.63636363636363' y2='56' stroke='#9fb3aa'/><text x='253.63636363636363' y='72' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>1/2</text><line x1='365.45454545454544' y1='48' x2='365.45454545454544' y2='56' stroke='#9fb3aa'/><text x='365.45454545454544' y='72' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>2</text><line x1='402.72727272727275' y1='48' x2='402.72727272727275' y2='56' stroke='#9fb3aa'/><text x='402.72727272727275' y='72' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>5/2</text></svg>"]]},
{"title": "2) Determinar B", "clear": 1, "say": "Ahora B. Tenemos que el valor absoluto de x menos uno, más el valor absoluto de x menos dos, es menor que dos. Cada valor absoluto cambia de expresión en el punto donde se anula su interior: x menos uno se anula en uno, y x menos dos se anula en dos. Estos dos puntos dividen la recta en tres zonas: x menor o igual que uno, x entre uno y dos, y x mayor o igual que dos.", "L": [["sub", "|x − 1| + |x − 2| &lt; 2<span class='tag'>Desigualdad de B</span>"], ["txt", "|x − 1| cambia en  x = 1,    |x − 2| cambia en  x = 2"], ["hyp", "Zona 1:  x ≤ 1"], ["hyp", "Zona 2:  1 ≤ x ≤ 2"], ["hyp", "Zona 3:  x ≥ 2"]]},
{"clear": 1, "say": "Zona uno: x menor o igual que uno. Entonces x menos uno es menor o igual que cero, y su valor absoluto es uno menos x. También x menos dos es negativo, y su valor absoluto es dos menos x. La suma es uno menos x, más dos menos x, es decir, tres menos dos x.", "L": [["hyp", "Zona 1:  x ≤ 1"], ["txt", "x − 1 ≤ 0  ⟹  |x − 1| = 1 − x"], ["txt", "x − 2 &lt; 0  ⟹  |x − 2| = 2 − x"], ["sub", "|x − 1| + |x − 2| = (1 − x) + (2 − x) = 3 − 2x"]]},
{"say": "Zona dos: x entre uno y dos. Entonces x menos uno es mayor o igual que cero, y su valor absoluto es x menos uno. Pero x menos dos es menor o igual que cero, y su valor absoluto es dos menos x. La suma es x menos uno, más dos menos x. Las x se cancelan, y queda uno.", "L": [["hyp", "Zona 2:  1 ≤ x ≤ 2"], ["txt", "x − 1 ≥ 0  ⟹  |x − 1| = x − 1"], ["txt", "x − 2 ≤ 0  ⟹  |x − 2| = 2 − x"], ["sub", "|x − 1| + |x − 2| = (x − 1) + (2 − x) = 1"]], "clear": 1},
{"say": "Zona tres: x mayor o igual que dos. Entonces los dos valores son mayores o iguales que cero, y los valores absolutos son x menos uno, y x menos dos. La suma es x menos uno, más x menos dos, es decir, dos x menos tres.", "L": [["hyp", "Zona 3:  x ≥ 2"], ["txt", "x − 1 ≥ 0  ⟹  |x − 1| = x − 1"], ["txt", "x − 2 ≥ 0  ⟹  |x − 2| = x − 2"], ["sub", "|x − 1| + |x − 2| = (x − 1) + (x − 2) = 2x − 3"]], "clear": 1},
{"clear": 1, "say": "Ahora imponemos que la suma sea menor que dos en cada zona. En la zona uno, tres menos dos x es menor que dos. Restando tres, menos dos x es menor que menos uno. Dividiendo entre menos dos, se invierte la desigualdad, y x es mayor que un medio. Como además x es menor o igual que uno, en esta zona tenemos x entre un medio, sin incluir, y uno, incluido.", "L": [["hyp", "Zona 1:  x ≤ 1"], ["txt", "|x − 1| + |x − 2| = 3 − 2x &lt; 2"], ["sub", "3 − 2x &lt; 2  ⟺  −2x &lt; −1  ⟺  x &gt; 1/2"], ["sub", "1/2 &lt; x ≤ 1"]]},

<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' más ').replace(/⊙/g,' por ').replace(/∼/g,' complementario de ').replace(/≤/g,' menor o igual que ').replace(/[()]/g,', ').replace(/\b1\b/g,' uno ').replace(/\b0\b/g,' cero ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Repetir'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Continuar'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pausa';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pausa';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pausa';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/pablo|jorge|diego|enrique|miguel|alvaro|álvaro|male|google español$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent='Valores absolutos y conjuntos';$('sub').textContent='Ejercicio · Álgebra de conjuntos';
$('cap').textContent='0 / '+steps.length;
</script></body></html>
