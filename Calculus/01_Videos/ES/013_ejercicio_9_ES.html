<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leyes de De Morgan</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}

#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}

.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>Recuerda</h2><div id="pins"></div></div><div id="board"></div></div>

<script type="application/json" id="data">
{"lang":"es-ES",
"meta":{"nivel": 3, "titulo": "Leyes de De Morgan", "enunciado": "Sea (B, ⊕, ⊙, ∼) un álgebra de Boole.  Probar que, para cualesquiera a, b ∈ B, se cumplen las leyes de De Morgan:", "tesis": "∼(a ⊕ b) = ∼a ⊙ ∼b,   ∼(a ⊙ b) = ∼a ⊕ ∼b", "datos": ["(Dist)  x ⊕ (y ⊙ z) = (x ⊕ y) ⊙ (x ⊕ z),   x ⊙ (y ⊕ z) = (x ⊙ y) ⊕ (x ⊙ z)", "(Compl)  x ⊕ ∼x = 1,   x ⊙ ∼x = 0", "(Dom)  x ⊕ 1 = 1,   x ⊙ 0 = 0", "(Unic)  x ⊕ y = 1 y x ⊙ y = 0 ⇒ y = ∼x"]},
"steps":[
{"title": "Leyes de De Morgan", "sub": "Ejercicio · Álgebra de Boole", "clear": 1, "say": "Hola. En este vídeo vamos a resolver un ejercicio sobre álgebras de Boole. Vamos a ir muy despacio, escribiendo cada ecuación y justificando cada paso.", "L": [["txt", "Las leyes de De Morgan"]]},

{"say": "Primero, los datos. B es un conjunto con dos operaciones, la suma y el producto, y una operación complemento, que escribimos con una tilde. Es un álgebra de Boole: un retículo distributivo con elemento mínimo cero, elemento máximo uno, y un complementario para cada elemento. El ejemplo típico son las partes de un conjunto U, con la unión, la intersección y el complementario de conjuntos.", "L": [["hyp", "(B, ⊕, ⊙, ∼) álgebra de Boole<span class='tag'>Hipótesis</span>"], ["txt", "Con conjuntos:  (𝒫(U), ∪, ∩, complementario),   0 = ∅,   1 = U"]]},

{"say": "Vamos a usar muchas propiedades, así que las dejamos todas anotadas a la izquierda. Primero, la conmutatividad y la asociatividad de la suma y del producto.", "pin": ["(Conm ⊕) x ⊕ y = y ⊕ x", "(Conm ⊙) x ⊙ y = y ⊙ x", "(Asoc ⊕) x ⊕ (y ⊕ z) = (x ⊕ y) ⊕ z", "(Asoc ⊙) x ⊙ (y ⊙ z) = (x ⊙ y) ⊙ z"]},

{"say": "Segundo, la distributividad. Un retículo distributivo cumple que cada operación distribuye respecto de la otra. Las dos primeras fórmulas son las de la definición. Las otras dos son las mismas con los factores intercambiados, y se obtienen aplicando la conmutatividad.", "pin": ["(Dist 1) x ⊕ (y ⊙ z) = (x ⊕ y) ⊙ (x ⊕ z)", "(Dist 2) x ⊙ (y ⊕ z) = (x ⊙ y) ⊕ (x ⊙ z)", "(Dist 3) (x ⊕ y) ⊙ z = (x ⊙ z) ⊕ (y ⊙ z)", "(Dist 4) (x ⊙ y) ⊕ z = (x ⊕ z) ⊙ (y ⊕ z)"]},

{"say": "Tercero, los elementos neutros y los complementarios. Cero es neutro de la suma, y uno es neutro del producto. Y la definición de complementario: x más su complementario es uno, y x por su complementario es cero. Las igualdades con los términos intercambiados salen de la conmutatividad.", "pin": ["(Neutro ⊕) x ⊕ 0 = x = 0 ⊕ x", "(Neutro ⊙) x ⊙ 1 = x = 1 ⊙ x", "(Compl) x ⊕ ∼x = 1,   x ⊙ ∼x = 0"]},

{"say": "Y cuarto, dos teoremas conocidos de las álgebras de Boole. Las leyes de dominación: x más uno es uno, y x por cero es cero, también con los términos intercambiados. Y la unicidad del complementario: si x más y es uno, y x por y es cero, entonces y es el complementario de x.", "pin": ["(Dom) x ⊕ 1 = 1 = 1 ⊕ x", "(Dom) x ⊙ 0 = 0 = 0 ⊙ x", "(Unic) x ⊕ y = 1 y x ⊙ y = 0 ⇒ y = ∼x"]},

{"say": "Lo que queremos demostrar. Para cualesquiera a y b de B, el complementario de a más b es igual al complementario de a, por el complementario de b. Y el complementario de a por b es igual al complementario de a, más el complementario de b. Son las leyes de De Morgan. Con conjuntos: el complementario de A unión B es el complementario de A intersección el complementario de B. Y el complementario de A intersección B es el complementario de A unión el complementario de B.", "L": [["goal", "∀ a, b ∈ B:   ∼(a ⊕ b) = ∼a ⊙ ∼b<span class='tag'>Tesis (1)</span>"], ["goal", "∼(a ⊙ b) = ∼a ⊕ ∼b<span class='tag'>Tesis (2)</span>"], ["txt", "Con conjuntos:  (A ∪ B)<sup>c</sup> = A<sup>c</sup> ∩ B<sup>c</sup>"], ["txt", "Con conjuntos:  (A ∩ B)<sup>c</sup> = A<sup>c</sup> ∪ B<sup>c</sup>"]]},

{"title": "Parte 1: ∼(a ⊕ b) = ∼a ⊙ ∼b", "clear": 1, "say": "Empezamos con la primera ley. Sean a y b dos elementos cualesquiera de B. Basta probar que el complementario de a por el complementario de b es el complemento de a más b. Por la unicidad del complemento, esto significa comprobar dos condiciones.", "L": [["txt", "Sean a, b ∈ B  (arbitrarios)"], ["sub", "x = a ⊕ b,   y = ∼a ⊙ ∼b<span class='tag'>Elección en (Unic)</span>"]]},

{"say": "Es decir, basta probar dos igualdades. Primera: a más b, más, el complementario de a por el complementario de b, es igual a uno. Segunda: a más b, por, el complementario de a por el complementario de b, es igual a cero.", "L": [["goal", "(i)   (a ⊕ b) ⊕ (∼a ⊙ ∼b) = 1"], ["goal", "(ii)  (a ⊕ b) ⊙ (∼a ⊙ ∼b) = 0<span class='tag'>Nueva tesis</span>"]]},

{"title": "Condición (i)", "clear": 1, "say": "Primera condición. Queremos probar que a más b, más, el complementario de a por el complementario de b, es igual a uno. Partimos del lado izquierdo y lo transformamos paso a paso.", "L": [["goal", "Queremos:  (a ⊕ b) ⊕ (∼a ⊙ ∼b) = 1"], ["txt", "(a ⊕ b) ⊕ (∼a ⊙ ∼b)"]]},

{"say": "Primer paso. Aplicamos la distributividad de la suma respecto del producto, con x igual a a más b, y igual al complementario de a, y z igual al complementario de b. Obtenemos un producto de dos factores: a más b, más el complementario de a, por, a más b, más el complementario de b.", "L": [["sub", "= ((a ⊕ b) ⊕ ∼a) ⊙ ((a ⊕ b) ⊕ ∼b)<span class='tag'>Distributividad: x ⊕ (y ⊙ z) = (x ⊕ y) ⊙ (x ⊕ z)</span>"]]},

{"say": "Segundo paso. Reorganizamos cada factor con la asociatividad y la conmutatividad de la suma, para que cada elemento quede junto a su complementario. En el primer factor, a más b, más el complementario de a, se convierte en a más su complementario, más b. En el segundo factor, a más b, más el complementario de b, se convierte en a más, b más su complementario.", "L": [["sub", "= ((a ⊕ ∼a) ⊕ b) ⊙ (a ⊕ (b ⊕ ∼b))<span class='tag'>Asociatividad y conmutatividad de ⊕</span>"]]},

{"say": "Tercer paso. Por la definición de complementario, a más su complementario es uno, y b más su complementario es uno.", "L": [["sub", "= (1 ⊕ b) ⊙ (a ⊕ 1)<span class='tag'>Complemento: a ⊕ ∼a = 1,  b ⊕ ∼b = 1</span>"]]},

{"say": "Cuarto paso. Por la ley de dominación, uno más b es uno, y a más uno es uno.", "L": [["sub", "= 1 ⊙ 1<span class='tag'>Dominación: 1 ⊕ b = 1,  a ⊕ 1 = 1</span>"]]},

{"say": "Quinto paso. Uno es el neutro del producto, así que uno por uno es uno. Con esto termina la primera condición.", "L": [["res", "= 1   ∎<span class='tag'>Neutro de ⊙</span>"]]},

{"title": "Condición (ii)", "clear": 1, "say": "Segunda condición. Queremos probar que a más b, por, el complementario de a por el complementario de b, es igual a cero. Partimos del lado izquierdo.", "L": [["goal", "Queremos:  (a ⊕ b) ⊙ (∼a ⊙ ∼b) = 0"], ["txt", "(a ⊕ b) ⊙ (∼a ⊙ ∼b)"]]},

{"say": "Primer paso. Asociatividad del producto, con x igual a a más b, y igual al complementario de a, y z igual al complementario de b.", "L": [["sub", "= ((a ⊕ b) ⊙ ∼a) ⊙ ∼b<span class='tag'>Asociatividad de ⊙</span>"]]},

{"say": "Segundo paso. Distributividad del producto respecto de la suma, en el paréntesis interior, con x igual a a, y igual a b, y z igual al complementario de a. A más b, por el complementario de a, se convierte en a por su complementario, más, b por el complementario de a.", "L": [["sub", "= ((a ⊙ ∼a) ⊕ (b ⊙ ∼a)) ⊙ ∼b<span class='tag'>Distributividad: (x ⊕ y) ⊙ z = (x ⊙ z) ⊕ (y ⊙ z)</span>"]]},

{"say": "Tercer paso. Por la definición de complementario, a por su complementario es cero.", "L": [["sub", "= (0 ⊕ (b ⊙ ∼a)) ⊙ ∼b<span class='tag'>Complemento: a ⊙ ∼a = 0</span>"]]},

{"say": "Cuarto paso. Cero es el neutro de la suma: cero más x es x. Por tanto, cero más, b por el complementario de a, es b por el complementario de a.", "L": [["sub", "= (b ⊙ ∼a) ⊙ ∼b<span class='tag'>Neutro de ⊕: 0 ⊕ x = x</span>"]]},

{"say": "Quinto paso. Usamos la asociatividad y la conmutatividad del producto. Partimos de b por el complementario de a, todo ello por el complementario de b. Reordenamos los factores para que b quede junto a su complementario, y obtenemos b por, el complementario de b por el complementario de a.", "L": [["sub", "= b ⊙ (∼b ⊙ ∼a)<span class='tag'>Conmutatividad y asociatividad de ⊙</span>"]]},

{"say": "Sexto paso. Asociatividad del producto, con x igual a b, y igual al complementario de b, y z igual al complementario de a. Pasamos de b por, el complementario de b por el complementario de a, a, b por su complementario, todo ello por el complementario de a.", "L": [["sub", "= (b ⊙ ∼b) ⊙ ∼a<span class='tag'>Asociatividad de ⊙</span>"]]},

{"say": "Séptimo paso. Por la definición de complementario, b por su complementario es cero.", "L": [["sub", "= 0 ⊙ ∼a<span class='tag'>Complemento: b ⊙ ∼b = 0</span>"]]},

{"say": "Octavo paso. Por la ley de dominación, cero por x es cero. Con esto termina la segunda condición.", "L": [["res", "= 0   ∎<span class='tag'>Dominación: 0 ⊙ x = 0</span>"]]},

{"title": "Conclusión de la parte 1", "clear": 1, "say": "Como el complementario de a por el complementario de b cumple ambas condiciones, es el complemento de a más b. Y por la unicidad del complemento en un retículo distributivo, concluimos la primera ley de De Morgan. Con conjuntos: el complementario de A unión B es el complementario de A intersección el complementario de B.", "L": [["res", "∼a ⊙ ∼b es el complemento de a ⊕ b"], ["res", "∼(a ⊕ b) = ∼a ⊙ ∼b   ∎<span class='tag'>Unicidad del complemento</span>"], ["txt", "Con conjuntos:  (A ∪ B)<sup>c</sup> = A<sup>c</sup> ∩ B<sup>c</sup>"]]},

{"title": "Parte 2: ∼(a ⊙ b) = ∼a ⊕ ∼b", "clear": 1, "say": "Pasamos a la segunda ley. Sean a y b dos elementos cualesquiera de B. De nuevo, basta probar que el complementario de a más el complementario de b es el complemento de a por b. Por la unicidad del complemento, esto significa comprobar dos condiciones.", "L": [["txt", "Sean a, b ∈ B  (arbitrarios)"], ["sub", "x = a ⊙ b,   y = ∼a ⊕ ∼b<span class='tag'>Elección en (Unic)</span>"]]},

{"say": "Es decir, basta probar dos igualdades. Primera: a por b, más, el complementario de a más el complementario de b, es igual a uno. Segunda: a por b, por, el complementario de a más el complementario de b, es igual a cero.", "L": [["goal", "(i)   (a ⊙ b) ⊕ (∼a ⊕ ∼b) = 1"], ["goal", "(ii)  (a ⊙ b) ⊙ (∼a ⊕ ∼b) = 0<span class='tag'>Nueva tesis</span>"]]},

{"title": "Condición (i)", "clear": 1, "say": "Primera condición. Queremos probar que a por b, más, el complementario de a más el complementario de b, es igual a uno. Partimos del lado izquierdo.", "L": [["goal", "Queremos:  (a ⊙ b) ⊕ (∼a ⊕ ∼b) = 1"], ["txt", "(a ⊙ b) ⊕ (∼a ⊕ ∼b)"]]},

{"say": "Primer paso. Asociatividad de la suma, con x igual a a por b, y igual al complementario de a, y z igual al complementario de b.", "L": [["sub", "= ((a ⊙ b) ⊕ ∼a) ⊕ ∼b<span class='tag'>Asociatividad de ⊕</span>"]]},

{"say": "Segundo paso. Distributividad de la suma respecto del producto, en el paréntesis interior, con x igual a a, y igual a b, y z igual al complementario de a. A por b, más el complementario de a, se convierte en a más su complementario, por, b más el complementario de a.", "L": [["sub", "= ((a ⊕ ∼a) ⊙ (b ⊕ ∼a)) ⊕ ∼b<span class='tag'>Distributividad: (x ⊙ y) ⊕ z = (x ⊕ z) ⊙ (y ⊕ z)</span>"]]},

{"say": "Tercer paso. Por la definición de complementario, a más su complementario es uno.", "L": [["sub", "= (1 ⊙ (b ⊕ ∼a)) ⊕ ∼b<span class='tag'>Complemento: a ⊕ ∼a = 1</span>"]]},

{"say": "Cuarto paso. Uno es el neutro del producto: uno por x es x. Por tanto, uno por, b más el complementario de a, es b más el complementario de a.", "L": [["sub", "= (b ⊕ ∼a) ⊕ ∼b<span class='tag'>Neutro de ⊙: 1 ⊙ x = x</span>"]]},

{"say": "Quinto paso. Con la conmutatividad y la asociatividad de la suma, juntamos b con su complementario. Primero conmutamos b con el complementario de a, y después asociamos. El resultado es el complementario de a más, b más su complementario.", "L": [["sub", "= ∼a ⊕ (b ⊕ ∼b)<span class='tag'>Conmutatividad y asociatividad de ⊕</span>"]]},

{"say": "Sexto paso. Por la definición de complementario, b más su complementario es uno.", "L": [["sub", "= ∼a ⊕ 1<span class='tag'>Complemento: b ⊕ ∼b = 1</span>"]]},

{"say": "Séptimo paso. Por la ley de dominación, x más uno es uno. Con esto termina la primera condición.", "L": [["res", "= 1   ∎<span class='tag'>Dominación: x ⊕ 1 = 1</span>"]]},

{"title": "Condición (ii)", "clear": 1, "say": "Segunda condición. Queremos probar que a por b, por, el complementario de a más el complementario de b, es igual a cero. Partimos del lado izquierdo.", "L": [["goal", "Queremos:  (a ⊙ b) ⊙ (∼a ⊕ ∼b) = 0"], ["txt", "(a ⊙ b) ⊙ (∼a ⊕ ∼b)"]]},

{"say": "Primer paso. Distributividad del producto respecto de la suma, con x igual a a por b, y igual al complementario de a, y z igual al complementario de b. Obtenemos una suma de dos términos: a por b, por el complementario de a, más, a por b, por el complementario de b.", "L": [["sub", "= ((a ⊙ b) ⊙ ∼a) ⊕ ((a ⊙ b) ⊙ ∼b)<span class='tag'>Distributividad: x ⊙ (y ⊕ z) = (x ⊙ y) ⊕ (x ⊙ z)</span>"]]},

{"say": "Segundo paso. Reorganizamos cada término con la asociatividad y la conmutatividad del producto, para que cada elemento quede junto a su complementario. En el primer término, a por b, por el complementario de a, se convierte en a por su complementario, por b. En el segundo, a por b, por el complementario de b, se convierte en a por, b por su complementario.", "L": [["sub", "= ((a ⊙ ∼a) ⊙ b) ⊕ (a ⊙ (b ⊙ ∼b))<span class='tag'>Asociatividad y conmutatividad de ⊙</span>"]]},

{"say": "Tercer paso. Por la definición de complementario, a por su complementario es cero, y b por su complementario es cero.", "L": [["sub", "= (0 ⊙ b) ⊕ (a ⊙ 0)<span class='tag'>Complemento: a ⊙ ∼a = 0,  b ⊙ ∼b = 0</span>"]]},

{"say": "Cuarto paso. Por la ley de dominación, cero por b es cero, y a por cero es cero.", "L": [["sub", "= 0 ⊕ 0<span class='tag'>Dominación: 0 ⊙ b = 0,  a ⊙ 0 = 0</span>"]]},

{"say": "Quinto paso. Cero es el neutro de la suma, y también se puede ver como idempotencia de la suma: cero más cero es cero. Con esto termina la segunda condición.", "L": [["res", "= 0   ∎<span class='tag'>Idempotencia / neutro de ⊕</span>"]]},

{"title": "Conclusión de la parte 2", "clear": 1, "say": "Como el complementario de a más el complementario de b cumple ambas condiciones, es el complemento de a por b. Y por la unicidad del complemento, concluimos la segunda ley de De Morgan. Con conjuntos: el complementario de A intersección B es el complementario de A unión el complementario de B.", "L": [["res", "∼a ⊕ ∼b es el complemento de a ⊙ b"], ["res", "∼(a ⊙ b) = ∼a ⊕ ∼b   ∎<span class='tag'>Unicidad del complemento</span>"], ["txt", "Con conjuntos:  (A ∩ B)<sup>c</sup> = A<sup>c</sup> ∪ B<sup>c</sup>"]]},

{"title": "Resumen", "clear": 1, "say": "Resumiendo. En las dos leyes, la unicidad del complementario nos permite no calcular el complementario directamente, sino comprobar las dos condiciones. En cada una usamos la distributividad, agrupamos cada elemento con su complementario, y aplicamos neutros y dominación. Con conjuntos: el complementario de la unión es la intersección de los complementarios, y el complementario de la intersección es la unión de los complementarios. Gracias por ver el vídeo.", "L": [["res", "∼(a ⊕ b) = ∼a ⊙ ∼b"], ["res", "∼(a ⊙ b) = ∼a ⊕ ∼b"], ["txt", "Con conjuntos:  (A ∪ B)<sup>c</sup> = A<sup>c</sup> ∩ B<sup>c</sup>,   (A ∩ B)<sup>c</sup> = A<sup>c</sup> ∪ B<sup>c</sup>"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' más ').replace(/⊙/g,' por ').replace(/∼/g,' complementario de ').replace(/≤/g,' menor o igual que ').replace(/[()]/g,', ').replace(/\b1\b/g,' uno ').replace(/\b0\b/g,' cero ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Repetir'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Continuar'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pausa';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pausa';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pausa';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/pablo|jorge|diego|enrique|miguel|alvaro|álvaro|male|google español$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
