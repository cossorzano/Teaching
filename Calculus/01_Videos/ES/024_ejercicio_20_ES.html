<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diferencia simétrica</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>Recuerda</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Empezar</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Velocidad <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Modo grabación (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"es-ES",
"meta":{"nivel": 2, "titulo": "Diferencia simétrica", "enunciado": "Demostrar que, para cualesquiera conjuntos A y B, se cumple:", "tesis": "A △ B = (A ∪ B) ∖ (A ∩ B)", "datos": ["(Def △)  A △ B = (A ∖ B) ∪ (B ∖ A)"]},
"steps":[
{"title": "Diferencia simétrica", "sub": "Ejercicio · Álgebra de conjuntos", "clear": 1, "say": "Hola. En este vídeo vamos a demostrar que la diferencia simétrica de dos conjuntos se puede escribir como la unión menos la intersección. Razonaremos elemento a elemento, muy despacio, escribiendo cada ecuación y justificando cada paso.", "L": [["txt", "Demostrar que  A △ B = (A ∪ B) ∖ (A ∩ B)"]]},
{"say": "Lo que queremos demostrar. Para cualesquiera conjuntos A y B, A diferencia simétrica B es igual a la unión de A y B, menos la intersección de A y B. Recordamos a la izquierda las definiciones que vamos a usar: la diferencia simétrica es la unión de A menos B con B menos A; la diferencia, la unión y la intersección con elementos; y que dos conjuntos son iguales cuando cada uno está incluido en el otro.", "L": [["goal", "A △ B = (A ∪ B) ∖ (A ∩ B)<span class='tag'>Demostrar, para cualesquiera A y B</span>"]], "pin": ["(Def △) A △ B = (A ∖ B) ∪ (B ∖ A)", "(Def ∖) x ∈ X ∖ Y  ⟺  x ∈ X  y  x ∉ Y", "(Def ∪) x ∈ X ∪ Y  ⟺  x ∈ X  o  x ∈ Y", "(Def ∩) x ∈ X ∩ Y  ⟺  x ∈ X  y  x ∈ Y", "(Def ⊆) X ⊆ Y  ⟺  todo x ∈ X cumple x ∈ Y", "(Def =) X = Y  ⟺  X ⊆ Y  y  Y ⊆ X"]},
{"title": "Plan: doble inclusión", "clear": 1, "say": "Razonaremos elemento a elemento. Por la definición de igualdad, tenemos que demostrar dos inclusiones. La primera, A diferencia simétrica B está incluido en la unión menos la intersección. La segunda, la unión menos la intersección está incluida en A diferencia simétrica B.", "L": [["goal", "(1)  A △ B ⊆ (A ∪ B) ∖ (A ∩ B)"], ["goal", "(2)  (A ∪ B) ∖ (A ∩ B) ⊆ A △ B"]]},
{"title": "(1) A △ B ⊆ (A ∪ B) ∖ (A ∩ B)", "clear": 1, "say": "Primera inclusión. Por la definición de inclusión, tomamos un elemento cualquiera x de A diferencia simétrica B, y tenemos que probar que pertenece a la unión menos la intersección.", "L": [["hyp", "Sea x ∈ A △ B"], ["goal", "Queremos:  x ∈ (A ∪ B) ∖ (A ∩ B)"]]},
{"say": "Por la definición de diferencia simétrica, x pertenece a la unión de A menos B, con B menos A. Y por la definición de unión, esto significa que x pertenece a A menos B, o x pertenece a B menos A. Por tanto, se cumple al menos una de dos posibilidades, que estudiamos por separado.", "L": [["txt", "Por (Def △):"], ["sub", "x ∈ (A ∖ B) ∪ (B ∖ A)"], ["txt", "Por (Def ∪):"], ["hyp", "Caso (i):  x ∈ A ∖ B"], ["hyp", "Caso (ii):  x ∈ B ∖ A"]]},
{"clear": 1, "say": "Caso uno: x pertenece a A menos B. Por la definición de diferencia, esto significa que x pertenece a A, y x no pertenece a B.", "L": [["hyp", "Caso (i):  x ∈ A ∖ B"], ["txt", "Por (Def ∖):"], ["sub", "x ∈ A   y   x ∉ B"]]},
{"say": "Como x pertenece a A, en particular x pertenece a A, o x pertenece a B. Por la definición de unión, x pertenece a la unión de A y B.", "L": [["txt", "x ∈ A  ⟹  x ∈ A  o  x ∈ B,  luego por (Def ∪):"], ["res", "x ∈ A ∪ B"]]},
{"say": "Además, como x no pertenece a B, no puede ocurrir que x pertenezca a A y a B a la vez. Por la definición de intersección, x no pertenece a la intersección de A y B.", "L": [["txt", "x ∉ B  ⟹  no es cierto que  x ∈ A  y  x ∈ B,  luego por (Def ∩):"], ["res", "x ∉ A ∩ B"]]},
{"say": "Tenemos entonces que x pertenece a la unión, y x no pertenece a la intersección. Por la definición de diferencia, con X igual a A unión B, e Y igual a A intersección B, x pertenece a la unión menos la intersección.", "L": [["txt", "x ∈ A ∪ B   y   x ∉ A ∩ B,  luego por (Def ∖):"], ["res", "x ∈ (A ∪ B) ∖ (A ∩ B)"]]},
{"clear": 1, "say": "Caso dos: x pertenece a B menos A. Por la definición de diferencia, esto significa que x pertenece a B, y x no pertenece a A.", "L": [["hyp", "Caso (ii):  x ∈ B ∖ A"], ["txt", "Por (Def ∖):"], ["sub", "x ∈ B   y   x ∉ A"]]},
{"say": "Como x pertenece a B, en particular x pertenece a A, o x pertenece a B. Por la definición de unión, x pertenece a la unión de A y B.", "L": [["txt", "x ∈ B  ⟹  x ∈ A  o  x ∈ B,  luego por (Def ∪):"], ["res", "x ∈ A ∪ B"]]},
{"say": "Además, como x no pertenece a A, no puede ocurrir que x pertenezca a A y a B a la vez. Por la definición de intersección, x no pertenece a la intersección de A y B.", "L": [["txt", "x ∉ A  ⟹  no es cierto que  x ∈ A  y  x ∈ B,  luego por (Def ∩):"], ["res", "x ∉ A ∩ B"]]},
{"say": "Tenemos entonces que x pertenece a la unión, y x no pertenece a la intersección. Por la definición de diferencia, x pertenece a la unión menos la intersección.", "L": [["txt", "x ∈ A ∪ B   y   x ∉ A ∩ B,  luego por (Def ∖):"], ["res", "x ∈ (A ∪ B) ∖ (A ∩ B)"]]},
{"clear": 1, "say": "En los dos casos, x pertenece a la unión menos la intersección. Como x era un elemento cualquiera de A diferencia simétrica B, concluimos la primera inclusión.", "L": [["txt", "En ambos casos  x ∈ (A ∪ B) ∖ (A ∩ B),  luego:"], ["res", "A △ B ⊆ (A ∪ B) ∖ (A ∩ B)"]]},
{"title": "(2) (A ∪ B) ∖ (A ∩ B) ⊆ A △ B", "clear": 1, "say": "Segunda inclusión. Tomamos un elemento cualquiera x de la unión menos la intersección, y tenemos que probar que pertenece a A diferencia simétrica B.", "L": [["hyp", "Sea x ∈ (A ∪ B) ∖ (A ∩ B)"], ["goal", "Queremos:  x ∈ A △ B"]]},
{"say": "Por la definición de diferencia, x pertenece a la unión de A y B, y x no pertenece a la intersección de A y B.", "L": [["txt", "Por (Def ∖):"], ["sub", "x ∈ A ∪ B   y   x ∉ A ∩ B"]]},
{"say": "La primera condición, por la definición de unión, dice que x pertenece a A, o x pertenece a B. La segunda condición, por la definición de intersección, dice que no se cumple que x pertenezca a A y a B a la vez.", "L": [["txt", "Por (Def ∪):  x ∈ A ∪ B  significa"], ["sub", "x ∈ A   o   x ∈ B"], ["txt", "Por (Def ∩):  x ∉ A ∩ B  significa"], ["sub", "no (x ∈ A  y  x ∈ B)"]]},
{"clear": 1, "say": "Combinando las dos condiciones, ocurre exactamente una de dos posibilidades. Si x pertenece a A, como no pueden pertenecer a A y a B a la vez, x no pertenece a B. Y si x pertenece a B, por la misma razón, x no pertenece a A. Estudiamos los dos casos por separado.", "L": [["hyp", "Caso (i):  x ∈ A   y   x ∉ B"], ["hyp", "Caso (ii):  x ∈ B   y   x ∉ A"]]},
{"clear": 1, "say": "Caso uno: x pertenece a A, y x no pertenece a B. Por la definición de diferencia, x pertenece a A menos B. Y por la definición de unión, con X igual a A menos B, x pertenece a la unión de A menos B con B menos A, que es, por definición, A diferencia simétrica B.", "L": [["hyp", "Caso (i):  x ∈ A   y   x ∉ B"], ["txt", "Por (Def ∖):"], ["sub", "x ∈ A ∖ B"], ["txt", "Por (Def ∪) y (Def △):"], ["res", "x ∈ (A ∖ B) ∪ (B ∖ A) = A △ B"]]},
{"clear": 1, "say": "Caso dos: x pertenece a B, y x no pertenece a A. Por la definición de diferencia, x pertenece a B menos A. Y por la definición de unión, x pertenece a la unión de A menos B con B menos A, que es, por definición, A diferencia simétrica B.", "L": [["hyp", "Caso (ii):  x ∈ B   y   x ∉ A"], ["txt", "Por (Def ∖):"], ["sub", "x ∈ B ∖ A"], ["txt", "Por (Def ∪) y (Def △):"], ["res", "x ∈ (A ∖ B) ∪ (B ∖ A) = A △ B"]]},
{"clear": 1, "say": "En los dos casos, x pertenece a A diferencia simétrica B. Como x era un elemento cualquiera de la unión menos la intersección, concluimos la segunda inclusión.", "L": [["txt", "En ambos casos  x ∈ A △ B,  luego:"], ["res", "(A ∪ B) ∖ (A ∩ B) ⊆ A △ B"]]},
{"title": "Conclusión", "clear": 1, "say": "Conclusión. Como se cumplen las dos inclusiones, por la definición de igualdad, A diferencia simétrica B es igual a la unión de A y B, menos la intersección de A y B. Gracias por ver el vídeo.", "L": [["txt", "(1)  A △ B ⊆ (A ∪ B) ∖ (A ∩ B)"], ["txt", "(2)  (A ∪ B) ∖ (A ∩ B) ⊆ A △ B"], ["res", "A △ B = (A ∪ B) ∖ (A ∩ B)"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' más ').replace(/⊙/g,' por ').replace(/∼/g,' complementario de ').replace(/≤/g,' menor o igual que ').replace(/[()]/g,', ').replace(/\b1\b/g,' uno ').replace(/\b0\b/g,' cero ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Repetir'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Continuar'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pausa';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pausa';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pausa';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/pablo|jorge|diego|enrique|miguel|alvaro|álvaro|male|google español$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent='Diferencia simétrica';$('sub').textContent='Ejercicio · Álgebra de conjuntos';
$('cap').textContent='0 / '+steps.length;
</script></body></html>
