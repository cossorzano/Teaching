<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orden en un retículo</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(15px,1.9vw,24px)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>Recuerda</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Empezar</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Velocidad <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Modo grabación (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"es-ES",
"meta":{"nivel": 2, "titulo": "Orden en un retículo", "enunciado": "Sea (B, ⊕, ⊙) un retículo. Se define en B la relación  x ≤ y ⇔ x ⊕ y = y.  Probar que, para cualesquiera a, b ∈ B:", "tesis": "a ≤ a ⊕ b,   b ≤ a ⊕ b", "datos": ["(Conm)  x ⊕ y = y ⊕ x", "(Asoc)  x ⊕ (y ⊕ z) = (x ⊕ y) ⊕ z", "(Idem)  x ⊕ x = x"]},
"steps":[
{"title":"Orden en un retículo","sub":"Ejercicio · Retículos algebraicos","clear":1,
"say":"Hola. En este vídeo vamos a resolver un ejercicio sobre retículos algebraicos. Vamos a ir muy despacio, escribiendo cada ecuación y justificando cada paso.",
"L":[["txt","Una relación de orden definida con la suma reticular"]]},

{"say":"Primero, los datos. B es un conjunto con dos operaciones, la suma reticular y el producto reticular, y es un retículo. Es decir, ambas operaciones son internas, conmutativas, asociativas, y cumplen las leyes de absorción.",
"L":[["hyp","(B, ⊕, ⊙) retículo<span class='tag'>Hipótesis</span>"]]},

{"say":"En este ejercicio solo vamos a usar tres propiedades de la suma. La conmutatividad: a más b es b más a. La asociatividad: a más, b más c, es a más b, más c. Y la idempotencia, que es un teorema de los retículos: a más a es a. Las dejamos fijadas a la izquierda, porque las vamos a utilizar.",
"pin":["(Conm) x ⊕ y = y ⊕ x","(Asoc) x ⊕ (y ⊕ z) = (x ⊕ y) ⊕ z","(Idem) x ⊕ x = x"]},

{"say":"Ahora la definición. En B definimos una relación, menor o igual, de la siguiente forma. x es menor o igual que y si y solo si x más y es igual a y. Es una definición: la relación menor o igual significa, por definición, que al sumar x con y obtenemos y. Con conjuntos, es la propiedad conocida: A está contenido en B si y solo si A unión B es igual a B.",
"L":[["sub","x ≤ y  ⇔  x ⊕ y = y<span class='tag'>Definición de ≤</span>"],["txt","Ejemplo con conjuntos:  A ⊆ B  ⇔  A ∪ B = B"]]},

{"say":"Anotamos también la definición a la izquierda, debajo de las propiedades anteriores, porque es la clave del ejercicio. Fíjate en que aparece resaltada en la columna de la izquierda.",
"pin":["(Def) x ≤ y ⇔ x ⊕ y = y"]},

{"say":"Lo que queremos demostrar. Para cualesquiera a y b de B, se cumplen dos cosas: a es menor o igual que a más b, y b es menor o igual que a más b.",
"L":[["goal","∀ a, b ∈ B:   a ≤ a ⊕ b   y   b ≤ a ⊕ b<span class='tag'>Tesis</span>"]]},

{"title":"Parte 1: a ≤ a ⊕ b","clear":1,
"say":"Empezamos con la primera. Sean a y b dos elementos cualesquiera de B. Queremos probar que a es menor o igual que a más b.",
"L":[["txt","Sean a, b ∈ B  (arbitrarios)"],["goal","Queremos:  a ≤ a ⊕ b<span class='tag'>Tesis de esta parte</span>"]]},

{"say":"Recordemos la definición: x es menor o igual que y si y solo si x más y es igual a y.",
"L":[["hyp","x ≤ y  ⇔  x ⊕ y = y<span class='tag'>Definición</span>"]]},

{"say":"Aplicamos la definición con x igual a a, e y igual a a más b. Es legítimo, porque la suma es interna, y por tanto a más b pertenece a B.",
"L":[["sub","x = a,   y = a ⊕ b  ∈ B<span class='tag'>Elección (⊕ es interna)</span>"]]},

{"say":"Sustituyendo, a es menor o igual que a más b, si y solo si a más, a más b, es igual a a más b.",
"L":[["sub","a ≤ a ⊕ b  ⇔  a ⊕ (a ⊕ b) = a ⊕ b<span class='tag'>Definición con x=a, y=a⊕b</span>"]]},

{"say":"Por tanto, basta probar la igualdad de la derecha: a más, a más b, es igual a a más b. Lo que ya no es una desigualdad, sino una igualdad que podemos demostrar con las propiedades de la suma.",
"L":[["goal","Basta probar:  a ⊕ (a ⊕ b) = a ⊕ b<span class='tag'>Nueva tesis</span>"]]},

{"say":"Partimos del lado izquierdo, a más, a más b, y lo transformamos paso a paso hasta llegar al lado derecho.",
"L":[["txt","a ⊕ (a ⊕ b)"]]},

{"say":"Primer paso. Aplicamos la asociatividad de la suma, con x igual a a, y igual a a, y z igual a b. Cambiamos los paréntesis: a más, a más b, pasa a ser a más a, más b.",
"L":[["sub","a ⊕ (a ⊕ b)  =  (a ⊕ a) ⊕ b<span class='tag'>Asociatividad de ⊕, con x=a, y=a, z=b</span>"]]},

{"say":"Segundo paso. Dentro del paréntesis aparece a más a. Por la idempotencia, a más a es igual a a. Lo marcamos.",
"L":[["sub","a ⊕ (a ⊕ b)  =  (<mark>a ⊕ a</mark>) ⊕ b"],["txt","Por (Idem):  <mark>a ⊕ a</mark> = a"]]},

{"say":"Sustituimos ese bloque por a. Nos queda a más b.",
"L":[["sub","(<mark>a</mark>) ⊕ b"],["res","a ⊕ (a ⊕ b)  =  a ⊕ b<span class='tag'>Idempotencia de ⊕</span>"]]},

{"say":"Hemos probado la igualdad. Por la equivalencia que vimos antes, esa igualdad significa justo que a es menor o igual que a más b. Con esto termina la primera parte.",
"L":[["res","a ⊕ (a ⊕ b) = a ⊕ b   ⟹   a ≤ a ⊕ b   ∎"]]},

{"title":"Parte 2: b ≤ a ⊕ b","clear":1,
"say":"Pasamos a la segunda parte. Con los mismos a y b arbitrarios, queremos probar que b es menor o igual que a más b. Se hace igual, pero aquí aparecerá un paso extra, porque b no está en la primera posición.",
"L":[["txt","Sean a, b ∈ B  (arbitrarios)"],["goal","Queremos:  b ≤ a ⊕ b<span class='tag'>Tesis de esta parte</span>"]]},

{"say":"Aplicamos la definición con x igual a b, e y igual a a más b, que de nuevo pertenece a B porque la suma es interna.",
"L":[["sub","x = b,   y = a ⊕ b  ∈ B<span class='tag'>Elección (⊕ es interna)</span>"],["sub","b ≤ a ⊕ b  ⇔  b ⊕ (a ⊕ b) = a ⊕ b<span class='tag'>Definición con x=b, y=a⊕b</span>"]]},

{"say":"Por tanto, basta probar que b más, a más b, es igual a a más b. Partimos del lado izquierdo.",
"L":[["goal","Basta probar:  b ⊕ (a ⊕ b) = a ⊕ b<span class='tag'>Nueva tesis</span>"],["txt","b ⊕ (a ⊕ b)"]]},

{"say":"Primer paso. Asociatividad de la suma, con x igual a b, y igual a a, y z igual a b. Pasamos de b más, a más b, a b más a, más b.",
"L":[["sub","b ⊕ (a ⊕ b)  =  (b ⊕ a) ⊕ b<span class='tag'>Asociatividad de ⊕, con x=b, y=a, z=b</span>"]]},

{"say":"Segundo paso. Ahora tenemos b más a dentro del paréntesis, y queremos a más b. Aplicamos la conmutatividad: b más a es igual a a más b.",
"L":[["sub","(<mark>b ⊕ a</mark>) ⊕ b"],["txt","Por (Conm):  <mark>b ⊕ a</mark> = a ⊕ b"],["sub","b ⊕ (a ⊕ b)  =  (a ⊕ b) ⊕ b<span class='tag'>Conmutatividad de ⊕</span>"]]},

{"say":"Tercer paso. Queremos juntar las dos b. Aplicamos otra vez la asociatividad, ahora con x igual a a, y igual a b, y z igual a b. Pasamos de a más b, más b, a a más, b más b.",
"L":[["sub","b ⊕ (a ⊕ b)  =  a ⊕ (b ⊕ b)<span class='tag'>Asociatividad de ⊕, con x=a, y=b, z=b</span>"]]},

{"say":"Cuarto paso. Dentro del paréntesis aparece b más b. Por la idempotencia, b más b es b. Lo marcamos y lo sustituimos.",
"L":[["sub","a ⊕ (<mark>b ⊕ b</mark>)"],["txt","Por (Idem):  <mark>b ⊕ b</mark> = b"],["res","b ⊕ (a ⊕ b)  =  a ⊕ b<span class='tag'>Idempotencia de ⊕</span>"]]},

{"say":"Hemos probado la igualdad. Por la definición, esa igualdad significa que b es menor o igual que a más b. Con esto termina la segunda parte.",
"L":[["res","b ⊕ (a ⊕ b) = a ⊕ b   ⟹   b ≤ a ⊕ b   ∎"]]},

{"title":"Resumen","clear":1,
"say":"Resumiendo. Con la definición de menor o igual, probar que x es menor o igual que y es probar que x más y es igual a y. Para a menor o igual que a más b, bastó asociar y usar la idempotencia. Para b menor o igual que a más b, hizo falta además la conmutatividad. Así, a más b es mayor o igual que a y que b. Gracias por ver el vídeo.",
"L":[["res","a ≤ a ⊕ b   (asociatividad + idempotencia)"],["res","b ≤ a ⊕ b   (asociatividad + conmutatividad + asociatividad + idempotencia)"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' más ').replace(/⊙/g,' por ').replace(/≤/g,' menor o igual que ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Repetir'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Continuar'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pausa';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pausa';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pausa';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/pablo|jorge|diego|enrique|miguel|alvaro|álvaro|male|google español$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent='Orden en un retículo';$('sub').textContent='Ejercicio · Retículos algebraicos';
$('cap').textContent='0 / '+steps.length;
</script></body></html>
