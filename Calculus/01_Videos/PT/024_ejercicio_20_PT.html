<!DOCTYPE html>
<html lang="pt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diferença simétrica</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>Lembre-se</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Começar</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Velocidade <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Modo gravação (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"pt-BR",
"meta":{"nivel": 2, "titulo": "Diferença simétrica", "enunciado": "Demonstrar que, para quaisquer conjuntos A e B, se verifica:", "tesis": "A △ B = (A ∪ B) ∖ (A ∩ B)", "datos": ["(Def △)  A △ B = (A ∖ B) ∪ (B ∖ A)"]},
"steps":[
{"title": "Diferença simétrica", "sub": "Exercício · Álgebra de conjuntos", "clear": 1, "say": "Olá. Neste vídeo vamos demonstrar que a diferença simétrica de dois conjuntos pode escrever-se como a união menos a interseção. Vamos raciocinar elemento a elemento, muito devagar, escrevendo cada equação e justificando cada passo.", "L": [["txt", "Demonstrar que  A △ B = (A ∪ B) ∖ (A ∩ B)"]]},

{"say": "O que queremos demonstrar. Para quaisquer conjuntos A e B, A diferença simétrica B é igual à união de A e B, menos a interseção de A e B. Recordamos à esquerda as definições que vamos usar: a diferença simétrica é a união de A menos B com B menos A; a diferença, a união e a interseção com elementos; e que dois conjuntos são iguais quando cada um está contido no outro.", "L": [["goal", "A △ B = (A ∪ B) ∖ (A ∩ B)<span class='tag'>Demonstrar, para quaisquer A e B</span>"]], "pin": ["(Def △) A △ B = (A ∖ B) ∪ (B ∖ A)", "(Def ∖) x ∈ X ∖ Y  ⟺  x ∈ X  e  x ∉ Y", "(Def ∪) x ∈ X ∪ Y  ⟺  x ∈ X  ou  x ∈ Y", "(Def ∩) x ∈ X ∩ Y  ⟺  x ∈ X  e  x ∈ Y", "(Def ⊆) X ⊆ Y  ⟺  todo x ∈ X cumpre x ∈ Y", "(Def =) X = Y  ⟺  X ⊆ Y  e  Y ⊆ X"]},

{"title": "Plano: dupla inclusão", "clear": 1, "say": "Vamos raciocinar elemento a elemento. Pela definição de igualdade, temos de demonstrar duas inclusões. A primeira: A diferença simétrica B está contida na união menos a interseção. A segunda: a união menos a interseção está contida em A diferença simétrica B.", "L": [["goal", "(1)  A △ B ⊆ (A ∪ B) ∖ (A ∩ B)"], ["goal", "(2)  (A ∪ B) ∖ (A ∩ B) ⊆ A △ B"]]},

{"title": "(1) A △ B ⊆ (A ∪ B) ∖ (A ∩ B)", "clear": 1, "say": "Primeira inclusão. Pela definição de inclusão, tomamos um elemento qualquer x de A diferença simétrica B, e temos de provar que pertence à união menos a interseção.", "L": [["hyp", "Seja x ∈ A △ B"], ["goal", "Queremos:  x ∈ (A ∪ B) ∖ (A ∩ B)"]]},

{"say": "Pela definição de diferença simétrica, x pertence à união de A menos B, com B menos A. E pela definição de união, isto significa que x pertence a A menos B, ou x pertence a B menos A. Portanto, verifica-se pelo menos uma de duas possibilidades, que estudamos separadamente.", "L": [["txt", "Por (Def △):"], ["sub", "x ∈ (A ∖ B) ∪ (B ∖ A)"], ["txt", "Por (Def ∪):"], ["hyp", "Caso (i):  x ∈ A ∖ B"], ["hyp", "Caso (ii):  x ∈ B ∖ A"]]},

{"clear": 1, "say": "Caso um: x pertence a A menos B. Pela definição de diferença, isto significa que x pertence a A, e x não pertence a B.", "L": [["hyp", "Caso (i):  x ∈ A ∖ B"], ["txt", "Por (Def ∖):"], ["sub", "x ∈ A   e   x ∉ B"]]},

{"say": "Como x pertence a A, em particular x pertence a A, ou x pertence a B. Pela definição de união, x pertence à união de A e B.", "L": [["txt", "x ∈ A  ⟹  x ∈ A  ou  x ∈ B,  logo por (Def ∪):"], ["res", "x ∈ A ∪ B"]]},

{"say": "Além disso, como x não pertence a B, não pode acontecer que x pertença a A e a B ao mesmo tempo. Pela definição de interseção, x não pertence à interseção de A e B.", "L": [["txt", "x ∉ B  ⟹  não é verdade que  x ∈ A  e  x ∈ B,  logo por (Def ∩):"], ["res", "x ∉ A ∩ B"]]},

{"say": "Temos então que x pertence à união, e x não pertence à interseção. Pela definição de diferença, com X igual a A união B, e Y igual a A interseção B, x pertence à união menos a interseção.", "L": [["txt", "x ∈ A ∪ B   e   x ∉ A ∩ B,  logo por (Def ∖):"], ["res", "x ∈ (A ∪ B) ∖ (A ∩ B)"]]},

{"clear": 1, "say": "Caso dois: x pertence a B menos A. Pela definição de diferença, isto significa que x pertence a B, e x não pertence a A.", "L": [["hyp", "Caso (ii):  x ∈ B ∖ A"], ["txt", "Por (Def ∖):"], ["sub", "x ∈ B   e   x ∉ A"]]},

{"say": "Como x pertence a B, em particular x pertence a A, ou x pertence a B. Pela definição de união, x pertence à união de A e B.", "L": [["txt", "x ∈ B  ⟹  x ∈ A  ou  x ∈ B,  logo por (Def ∪):"], ["res", "x ∈ A ∪ B"]]},

{"say": "Além disso, como x não pertence a A, não pode acontecer que x pertença a A e a B ao mesmo tempo. Pela definição de interseção, x não pertence à interseção de A e B.", "L": [["txt", "x ∉ A  ⟹  não é verdade que  x ∈ A  e  x ∈ B,  logo por (Def ∩):"], ["res", "x ∉ A ∩ B"]]},

{"say": "Temos então que x pertence à união, e x não pertence à interseção. Pela definição de diferença, x pertence à união menos a interseção.", "L": [["txt", "x ∈ A ∪ B   e   x ∉ A ∩ B,  logo por (Def ∖):"], ["res", "x ∈ (A ∪ B) ∖ (A ∩ B)"]]},

{"clear": 1, "say": "Nos dois casos, x pertence à união menos a interseção. Como x era um elemento qualquer de A diferença simétrica B, concluímos a primeira inclusão.", "L": [["txt", "Em ambos os casos  x ∈ (A ∪ B) ∖ (A ∩ B),  logo:"], ["res", "A △ B ⊆ (A ∪ B) ∖ (A ∩ B)"]]},

{"title": "(2) (A ∪ B) ∖ (A ∩ B) ⊆ A △ B", "clear": 1, "say": "Segunda inclusão. Tomamos um elemento qualquer x da união menos a interseção, e temos de provar que pertence a A diferença simétrica B.", "L": [["hyp", "Seja x ∈ (A ∪ B) ∖ (A ∩ B)"], ["goal", "Queremos:  x ∈ A △ B"]]},

{"say": "Pela definição de diferença, x pertence à união de A e B, e x não pertence à interseção de A e B.", "L": [["txt", "Por (Def ∖):"], ["sub", "x ∈ A ∪ B   e   x ∉ A ∩ B"]]},

{"say": "A primeira condição, pela definição de união, diz que x pertence a A, ou x pertence a B. A segunda condição, pela definição de interseção, diz que não se verifica que x pertença a A e a B ao mesmo tempo.", "L": [["txt", "Por (Def ∪):  x ∈ A ∪ B  significa"], ["sub", "x ∈ A   ou   x ∈ B"], ["txt", "Por (Def ∩):  x ∉ A ∩ B  significa"], ["sub", "não (x ∈ A  e  x ∈ B)"]]},

{"clear": 1, "say": "Combinando as duas condições, acontece exatamente uma de duas possibilidades. Se x pertence a A, como não pode pertencer a A e a B ao mesmo tempo, x não pertence a B. E se x pertence a B, pela mesma razão, x não pertence a A. Estudamos os dois casos separadamente.", "L": [["hyp", "Caso (i):  x ∈ A   e   x ∉ B"], ["hyp", "Caso (ii):  x ∈ B   e   x ∉ A"]]},

{"clear": 1, "say": "Caso um: x pertence a A, e x não pertence a B. Pela definição de diferença, x pertence a A menos B. E pela definição de união, com X igual a A menos B, x pertence à união de A menos B com B menos A, que é, por definição, A diferença simétrica B.", "L": [["hyp", "Caso (i):  x ∈ A   e   x ∉ B"], ["txt", "Por (Def ∖):"], ["sub", "x ∈ A ∖ B"], ["txt", "Por (Def ∪) e (Def △):"], ["res", "x ∈ (A ∖ B) ∪ (B ∖ A) = A △ B"]]},

{"clear": 1, "say": "Caso dois: x pertence a B, e x não pertence a A. Pela definição de diferença, x pertence a B menos A. E pela definição de união, x pertence à união de A menos B com B menos A, que é, por definição, A diferença simétrica B.", "L": [["hyp", "Caso (ii):  x ∈ B   e   x ∉ A"], ["txt", "Por (Def ∖):"], ["sub", "x ∈ B ∖ A"], ["txt", "Por (Def ∪) e (Def △):"], ["res", "x ∈ (A ∖ B) ∪ (B ∖ A) = A △ B"]]},

{"clear": 1, "say": "Nos dois casos, x pertence a A diferença simétrica B. Como x era um elemento qualquer da união menos a interseção, concluímos a segunda inclusão.", "L": [["txt", "Em ambos os casos  x ∈ A △ B,  logo:"], ["res", "(A ∪ B) ∖ (A ∩ B) ⊆ A △ B"]]},

{"title": "Conclusão", "clear": 1, "say": "Conclusão. Como se verificam as duas inclusões, pela definição de igualdade, A diferença simétrica B é igual à união de A e B, menos a interseção de A e B. Obrigado por ver o vídeo.", "L": [["txt", "(1)  A △ B ⊆ (A ∪ B) ∖ (A ∩ B)"], ["txt", "(2)  (A ∪ B) ∖ (A ∩ B) ⊆ A △ B"], ["res", "A △ B = (A ∪ B) ∖ (A ∩ B)"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' mais ').replace(/⊙/g,' vezes ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Repetir'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Continuar'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pausa';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pausa';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pausa';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^pt/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/antonio|antônio|donato|fabio|duarte|male|google português$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Diferença simétrica";$('sub').textContent="Exercício · Álgebra de conjuntos";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
