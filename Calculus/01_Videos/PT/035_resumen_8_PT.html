<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="pt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reta real estendida</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>Lembre-se</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Começar</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Velocidade <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Modo gravação (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"pt-BR",
"meta":{"nivel": 0, "titulo": "Reta real estendida", "enunciado": "Resumo: definição, ordem, supremos e ínfimos, e operações na reta real estendida", "datos": ["Definição", "Ordem", "Supremo e ínfimo", "Operações definidas", "Operações não definidas", "Não é um corpo"]},
"steps":[
{"title": "Reta real estendida", "sub": "Resumo: definição, ordem, supremos e ínfimos, e operações na reta real estendida", "clear": 1, "say": "Olá. Neste vídeo resumimos a reta real estendida: como se define, como se ordena, o que acontece com os supremos e ínfimos, e que operações se podem fazer com mais e menos infinito.", "L": [["txt", "A reta real estendida  <span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span>"]]},

{"title": "1) Definição", "clear": 1, "say": "A reta real estendida obtém-se acrescentando aos números reais os dois símbolos menos infinito e mais infinito. Escreve-se com uma barra por cima do R duplo dos reais.", "L": [["goal", "<span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span> = ℝ ∪ { −∞, +∞ }"]], "pin": ["Definição: <span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span> = ℝ ∪ {−∞, +∞}"]},

{"title": "2) Ordem", "clear": 1, "say": "Primeiro, a ordem. A ordem da reta real estendida estende a dos números reais. Para todo o x real, menos infinito é menor ou igual a x, e x é menor ou igual a mais infinito. E menos infinito é estritamente menor que mais infinito.", "L": [["goal", "≤  estende a ordem de ℝ"], ["res", "∀ x ∈ ℝ :   −∞ ≤ x ≤ +∞"], ["res", "−∞ &lt; +∞"]], "pin": ["Ordem: −∞ ≤ x ≤ +∞"]},

{"title": "3) Cotas", "clear": 1, "say": "Segundo, as cotas. Ao contrário dos números reais, na reta estendida todo o subconjunto A tem supremo e tem ínfimo, sem precisar de ser limitado. Por exemplo, o conjunto vazio: todo o elemento é cota superior do vazio, e a menor delas é menos infinito. Assim, o supremo do vazio é menos infinito, e o ínfimo do vazio é mais infinito.", "L": [["goal", "Todo  A ⊆ <span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span>  tem supremo e ínfimo em <span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span>"], ["txt", "Por exemplo, para  A = ∅:"], ["sub", "sup ∅ = −∞,        inf ∅ = +∞"]], "pin": ["Todo A ⊆ <span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span> tem sup A e inf A"]},

{"title": "4) Supremo", "clear": 1, "say": "Terceiro, quando o supremo é mais ou menos infinito. Se A é um subconjunto dos números reais, o supremo de A é mais infinito se e só se A não é limitado superiormente nos números reais. E o supremo de A é menos infinito se e só se A é o conjunto vazio, ou A é o conjunto que contém apenas menos infinito.", "L": [["goal", "Supremo"], ["res", "A ⊆ ℝ:   sup A = +∞   ⟺   A não é limitado superiormente em ℝ"], ["res", "sup A = −∞   ⟺   A = ∅   ou   A = { −∞ }"]], "pin": ["Supremo: +∞ se ilimitado; −∞ se A=∅ ou {−∞}"]},

{"say": "Em geral, para um subconjunto qualquer A da reta real estendida, o supremo é mais infinito se e só se mais infinito pertence a A, ou a parte real de A não é limitada superiormente.", "L": [["txt", "Em geral, para  A ⊆ <span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span> :"], ["sub", "sup A = +∞   ⟺   +∞ ∈ A   ou   A ∩ ℝ não limitado superiormente em ℝ"]]},

{"title": "5) Ínfimo", "clear": 1, "say": "Quarto, o ínfimo, que é o simétrico. Se A é um subconjunto dos números reais, o ínfimo de A é menos infinito se e só se A não é limitado inferiormente nos números reais. E o ínfimo de A é mais infinito se e só se A é o conjunto vazio, ou A é o conjunto que contém apenas mais infinito.", "L": [["goal", "Ínfimo"], ["res", "A ⊆ ℝ:   inf A = −∞   ⟺   A não é limitado inferiormente em ℝ"], ["res", "inf A = +∞   ⟺   A = ∅   ou   A = { +∞ }"]], "pin": ["Ínfimo: −∞ se ilimitado; +∞ se A=∅ ou {+∞}"]},

{"title": "6) Operações", "clear": 1, "say": "Quinto, as operações, que estão apenas parcialmente definidas. A soma: para todo o x real, x mais mais infinito é mais infinito, e x mais menos infinito é menos infinito. O produto: se a é maior que zero, a vezes mais infinito é mais infinito, e a vezes menos infinito é menos infinito. Se a é menor que zero, o sinal inverte-se: a vezes mais infinito é menos infinito, e a vezes menos infinito é mais infinito.", "L": [["goal", "Operações definidas"], ["res", "x + (±∞) = ±∞        ∀ x ∈ ℝ"], ["res", "a · (±∞) = ±∞        se  a &gt; 0"], ["res", "a · (±∞) = ∓∞        se  a &lt; 0"]], "pin": ["Operações: x+(±∞)=±∞, a·(±∞)=±∞ (a>0)"]},

{"say": "E a divisão: para todo o a real, a dividido por mais ou menos infinito é zero. Também estão definidas mais infinito mais mais infinito, que é mais infinito, e menos infinito mais menos infinito, que é menos infinito.", "L": [["res", "a / (±∞) = 0        ∀ a ∈ ℝ"], ["res", "(+∞) + (+∞) = +∞,        (−∞) + (−∞) = −∞"]]},

{"title": "7) Operações não definidas", "clear": 1, "say": "No entanto, há operações que não estão definidas, porque não se lhes pode atribuir um valor razoável. Mais infinito menos mais infinito, ou seja, somar mais infinito com menos infinito, não está definida. E zero vezes mais ou menos infinito também não.", "L": [["goal", "Não estão definidas"], ["warn", "(+∞) + (−∞)    ou seja,    ∞ − ∞"], ["warn", "0 · (±∞)"]]},

{"title": "8) Observação", "clear": 1, "say": "Observação final. A reta real estendida não é um corpo nem um anel. Por exemplo, mais infinito não tem oposto: não existe nenhum elemento que, somado a mais infinito, dê zero. Deve usar-se apenas como ferramenta auxiliar para descrever comportamentos não limitados.", "L": [["warn", "<span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span> não é corpo nem anel"], ["txt", "Por exemplo,  +∞  não tem oposto"], ["txt", "Ferramenta auxiliar para comportamentos não limitados"]]},

{"title": "Resumo", "clear": 1, "say": "Resumo. A reta real estendida é formada pelos números reais, mais menos infinito e mais infinito. A sua ordem estende a dos números reais, e todo o subconjunto tem supremo e ínfimo. As operações estão parcialmente definidas, e não é um corpo nem um anel. Obrigado por assistir.", "L": [["res", "<span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span> = ℝ ∪ { −∞, +∞ },    −∞ ≤ x ≤ +∞"], ["res", "Todo A ⊆ <span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span> tem  sup A  e  inf A"], ["res", "∞ − ∞   e   0 · (±∞)   não definidas"], ["res", "<span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span> não é corpo nem anel"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' mais ').replace(/⊙/g,' vezes ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Repetir'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Continuar'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pausa';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pausa';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pausa';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^pt/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/antonio|antônio|donato|fabio|duarte|male|google português$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Reta real estendida";$('sub').textContent="Resumo: definição, ordem, supremos e ínfimos, e operações na reta real estendida";
$('cap').textContent='0 / '+steps.length;
</script></body></html>

</body></html>
