<!DOCTYPE html>
<html lang="pt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Os números reais</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>Lembre-se</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Começar</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Velocidade <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Modo gravação (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"pt-BR",
"meta":{"nivel": 0, "titulo": "Os números reais", "enunciado": "Resumo: corpo, ordem, completude, propriedade arquimediana, reta estendida e valor absoluto", "datos": ["Estrutura de corpo", "Ordem", "Completude", "Propriedade arquimediana", "Reta real estendida", "Valor absoluto"]},
"steps":[
{"title": "Os números reais: resumo", "sub": "Resumo: corpo, ordem, completude, propriedade arquimediana, reta estendida e valor absoluto", "clear": 1, "say": "Olá. Neste vídeo resumimos as propriedades fundamentais dos números reais, que são a base sobre a qual se constrói todo o cálculo: limites, continuidade, derivabilidade e integrabilidade. Veremos seis ideias: a estrutura de corpo, a ordem, a completude, a propriedade arquimediana, a reta real estendida, e o valor absoluto.", "L": [["txt", "O conjunto dos números reais  ℝ  é o quadro do Cálculo"], ["txt", "Limite · continuidade · derivabilidade · integrabilidade"], ["txt", "Dependem de propriedades estruturais de ℝ, não apenas de operar"]]},

{"title": "1) Estrutura de corpo", "clear": 1, "say": "Primeira ideia: a estrutura algébrica. Os números reais, com a soma e o produto, formam um corpo comutativo. Isto significa quatro coisas. Um: a soma e o produto são operações internas, associativas e comutativas. Dois: existem elementos neutros, o zero para a soma, e o um para o produto. Três: todo número real x tem um oposto, menos x. E quatro: se x é diferente de zero, tem um inverso multiplicativo, x elevado a menos um.", "L": [["goal", "(ℝ, +, ·)  é um corpo comutativo"], ["txt", "Soma e produto: internas, associativas e comutativas"], ["txt", "Neutros:  0  e  1"], ["txt", "Oposto:  todo x tem  −x"], ["txt", "Inverso:  se x ≠ 0,  existe  x⁻¹"]], "pin": ["1. Corpo: (ℝ, +, ·)"]},

{"clear": 1, "say": "Para todos os números reais a, b e c valem estas identidades. Associatividade da soma: a mais, b mais c, é igual a, a mais b, mais c. Associatividade do produto: a vezes, b vezes c, é igual a, a vezes b, vezes c. Distributividade: a vezes, b mais c, é igual a a vezes b, mais a vezes c. E os neutros: a mais zero é a, e a vezes um é a. Estas propriedades garantem que as manipulações algébricas do cálculo são coerentes.", "L": [["res", "a + (b + c) = (a + b) + c"], ["res", "a (b c) = (a b) c"], ["res", "a (b + c) = a b + a c"], ["res", "a + 0 = a,        a · 1 = a"], ["txt", "Garantem a coerência das manipulações algébricas"]]},

{"title": "2) Ordem", "clear": 1, "say": "Segunda ideia: a ordem. Além de ser um corpo, o conjunto dos números reais tem uma relação de ordem total, menor ou igual, compatível com as operações. Ser total significa que podemos comparar quaisquer dois números reais.", "L": [["goal", "ℝ  tem uma ordem total  ≤"], ["txt", "Quaisquer dois números reais podem ser comparados"]], "pin": ["2. Ordem total ≤"]},

{"say": "A compatibilidade com a soma diz que se a é menor ou igual a b, então a mais c é menor ou igual a b mais c, para todo c. A compatibilidade com o produto diz que se c é maior ou igual a zero, e a é menor ou igual a b, então a vezes c é menor ou igual a b vezes c. Atenção: é preciso que c seja positivo ou zero.", "L": [["res", "a ≤ b   ⟹   a + c ≤ b + c"], ["res", "0 ≤ c  e  a ≤ b   ⟹   a c ≤ b c"]]},

{"say": "A ordem total permite definir os intervalos: aberto de a a b, fechado de a a b, de a a mais infinito, e outros. Os intervalos são fundamentais para formular limites e continuidade.", "L": [["txt", "Intervalos:   (a, b),    [a, b],    (a, +∞),   …"], ["txt", "São centrais em limites e em continuidade"]]},

{"title": "3) Completude", "clear": 1, "say": "Terceira ideia, a mais importante: a completude. É a propriedade distintiva dos números reais. Seja A um subconjunto não vazio dos números reais, e limitado superiormente. Então existe um número real s com duas propriedades.", "L": [["goal", "A ⊆ ℝ,   A ≠ ∅,   limitado superiormente"], ["txt", "Então existe  s ∈ ℝ  tal que:"]], "pin": ["3. Completude: sup A"]},

{"say": "Primeira propriedade: para todo elemento a de A, a é menor ou igual a s. Ou seja, s é um majorante de A.", "L": [["res", "(1)   ∀ a ∈ A,   a ≤ s"], ["txt", "s é majorante de A"]]},

{"say": "Segunda propriedade: para todo épsilon maior que zero, existe um elemento a de A tal que s menos épsilon é menor que a. Ou seja, nenhuma quantidade menor que s é majorante: s é o menor dos majorantes.", "L": [["res", "(2)   ∀ ε &gt; 0,   ∃ a ∈ A :   s − ε &lt; a"], ["txt", "Nada menor que s é majorante: s é o menor majorante"]]},

{"say": "Este número s chama-se o supremo de A, e escreve-se supremo de A. De forma análoga, todo conjunto não vazio e limitado inferiormente tem um ínfimo.", "L": [["res", "s = sup A      (supremo de A)"], ["txt", "Analogamente: não vazio e limitado inferiormente  ⟹  existe  inf A"]]},

{"say": "Estas propriedades não se deduzem da álgebra nem da ordem: são axiomas próprios dos números reais. De facto, falham nos números racionais. E são o fundamento lógico do cálculo: a existência de limites de sucessões monótonas e limitadas, a convergência de sucessões definidas por aproximação, e a definição rigorosa de limite, apoiam-se na existência de supremos e ínfimos.", "L": [["txt", "Axioma próprio de ℝ.  Falha em ℚ"], ["txt", "Fundamenta:"], ["txt", "· limites de sucessões monótonas e limitadas"], ["txt", "· convergência de sucessões definidas por aproximação"], ["txt", "· a definição rigorosa:   lim aₙ = L   (n → ∞)"]], "clear": 1},

{"title": "4) Propriedade arquimediana", "clear": 1, "say": "Quarta ideia: a propriedade arquimediana. Diz que, para todos os números a e b maiores que zero, existe um número natural n tal que n vezes a é maior que b. Ou seja, por menor que seja a, somando-o vezes suficientes ultrapassa-se qualquer b.", "L": [["goal", "Propriedade arquimediana"], ["res", "∀ a, b &gt; 0,   ∃ n ∈ ℕ :   n a &gt; b"]], "pin": ["4. Arquimediana"]},

{"say": "Isto garante que os números naturais não são limitados nos números reais, e permite relacionar quantidades reais com aproximações discretas. É uma ferramenta essencial em demonstrações com estimativas e controle de erros.", "L": [["txt", "ℕ não é limitado em ℝ"], ["txt", "Relaciona quantidades reais com aproximações discretas"], ["txt", "Útil em estimativas e controle de erros"]]},

{"title": "5) Reta real estendida", "clear": 1, "say": "Quinta ideia: a reta real estendida. Obtém-se acrescentando aos números reais os dois símbolos menos infinito e mais infinito. Permite descrever de forma unificada os comportamentos não limitados.", "L": [["goal", "<span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span> = ℝ ∪ { −∞, +∞ }"], ["txt", "Descreve de forma unificada os comportamentos não limitados"]], "pin": ["5. Reta estendida <span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span>"]},

{"say": "A ordem dos números reais estende-se: para todo x real, menos infinito é menor ou igual a x, e x é menor ou igual a mais infinito. No entanto, a reta estendida não é um corpo nem um anel, porque algumas operações só se definem de forma parcial. Deve ser usada apenas como ferramenta auxiliar.", "L": [["res", "∀ x ∈ ℝ :   −∞ ≤ x ≤ +∞"], ["warn", "<span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span> não é corpo nem anel"], ["txt", "Ferramenta auxiliar"]]},

{"title": "6) Valor absoluto", "clear": 1, "say": "Sexta ideia: o valor absoluto, associado à estrutura ordenada dos números reais. Define-se por casos. O valor absoluto de x é x, se x é maior ou igual a zero, e é menos x, se x é menor que zero.", "L": [["goal", "Valor absoluto"], ["res", "|x| = x    se  x ≥ 0"], ["res", "|x| = −x   se  x &lt; 0"]], "pin": ["6. Valor absoluto |x|"]},

{"say": "Permite exprimir a distância entre dois números reais pelo valor absoluto de x menos y, e formular desigualdades de forma simétrica. Em particular, o valor absoluto de x menos a é menor que épsilon, se e somente se, x está entre a menos épsilon e a mais épsilon.", "L": [["txt", "Distância entre x e y:   |x − y|"], ["res", "|x − a| &lt; ε   ⟺   a − ε &lt; x &lt; a + ε"], ["txt", "Base técnica da definição de limite e de continuidade"]]},

{"title": "Resumo", "clear": 1, "say": "Resumo. Os números reais formam um corpo comutativo, com uma ordem total compatível com as operações. A sua propriedade distintiva é a completude: todo conjunto não vazio e limitado superiormente tem supremo. Dela segue-se a propriedade arquimediana. A reta estendida é uma ferramenta auxiliar, e o valor absoluto mede distâncias. Obrigado por ver o vídeo.", "L": [["res", "ℝ:  corpo comutativo  +  ordem total compatível"], ["res", "Completude:  todo A ≠ ∅ limitado superiormente tem  sup A"], ["res", "Arquimediana:  ∀ a, b &gt; 0,  ∃ n ∈ ℕ :  n a &gt; b"], ["res", "|x − a| &lt; ε  ⟺  a − ε &lt; x &lt; a + ε"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' mais ').replace(/⊙/g,' vezes ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Repetir'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Continuar'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pausa';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pausa';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pausa';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^pt/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/antonio|antônio|donato|fabio|duarte|male|google português$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Os números reais";$('sub').textContent="Resumo: corpo, ordem, completude, propriedade arquimediana, reta estendida e valor absoluto";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
