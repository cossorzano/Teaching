<!DOCTYPE html>
<html lang="pt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Produto cartesiano e interseção</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>Lembre-se</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Começar</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Velocidade <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Modo gravação (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"pt-BR",
"meta":{"nivel": 2, "titulo": "Produto cartesiano e interseção", "enunciado": "Demonstrar que, para quaisquer conjuntos A, B, C, D, se verifica:", "tesis": "(A ∩ B) × (C ∩ D) = (A × C) ∩ (B × D)", "datos": ["(Def ×)  (x, y) ∈ X × Y  ⟺  x ∈ X  e  y ∈ Y"]},
"steps":[
{"title": "Produto cartesiano e interseção", "sub": "Exercício · Álgebra de conjuntos", "clear": 1, "say": "Olá. Neste vídeo vamos demonstrar que o produto cartesiano de duas interseções é a interseção de dois produtos cartesianos. Vamos raciocinar elemento a elemento, muito devagar, escrevendo cada equação e justificando cada passo.", "L": [["txt", "Demonstrar que  (A ∩ B) × (C ∩ D) = (A × C) ∩ (B × D)"]]},

{"say": "O que queremos demonstrar. Para quaisquer conjuntos A, B, C e D, a interseção de A e B, vezes a interseção de C e D, é igual à interseção de A vezes C, com B vezes D. Recordamos à esquerda as definições que vamos usar: produto cartesiano, interseção, inclusão e igualdade de conjuntos.", "L": [["goal", "(A ∩ B) × (C ∩ D) = (A × C) ∩ (B × D)<span class='tag'>Demonstrar, para quaisquer A, B, C, D</span>"]], "pin": ["(Def ×) (x, y) ∈ X × Y  ⟺  x ∈ X  e  y ∈ Y", "(Def ∩) p ∈ X ∩ Y  ⟺  p ∈ X  e  p ∈ Y", "(Def ⊆) X ⊆ Y  ⟺  todo p ∈ X cumpre p ∈ Y", "(Def =) X = Y  ⟺  X ⊆ Y  e  Y ⊆ X"]},

{"title": "Plano: dupla inclusão", "clear": 1, "say": "Vamos raciocinar elemento a elemento. Pela definição de igualdade, temos de demonstrar duas inclusões. A primeira: a interseção de A e B, vezes a interseção de C e D, está contida na interseção de A vezes C com B vezes D. A segunda: a inclusão contrária.", "L": [["goal", "(1)  (A ∩ B) × (C ∩ D) ⊆ (A × C) ∩ (B × D)"], ["goal", "(2)  (A × C) ∩ (B × D) ⊆ (A ∩ B) × (C ∩ D)"]]},

{"title": "(1) (A ∩ B) × (C ∩ D) ⊆ (A × C) ∩ (B × D)", "clear": 1, "say": "Primeira inclusão. Pela definição de inclusão, tomamos um elemento qualquer x, y do primeiro conjunto, e temos de provar que pertence ao segundo.", "L": [["hyp", "Seja (x, y) ∈ (A ∩ B) × (C ∩ D)"], ["goal", "Queremos:  (x, y) ∈ (A × C) ∩ (B × D)"]]},

{"say": "Pela definição de produto cartesiano, com X igual a A interseção B, e Y igual a C interseção D, a primeira coordenada x pertence a A interseção B, e a segunda coordenada y pertence a C interseção D.", "L": [["txt", "Por (Def ×) com  X = A ∩ B,  Y = C ∩ D:"], ["sub", "x ∈ A ∩ B   e   y ∈ C ∩ D"]]},

{"say": "Pela definição de interseção, x pertencer a A interseção B significa que x pertence a A, e x pertence a B. E y pertencer a C interseção D significa que y pertence a C, e y pertence a D.", "L": [["txt", "Por (Def ∩):"], ["sub", "x ∈ A  e  x ∈ B"], ["sub", "y ∈ C  e  y ∈ D"]]},

{"clear": 1, "say": "Agora agrupamos de outra maneira. Como x pertence a A, e y pertence a C, pela definição de produto cartesiano, x, y pertence a A vezes C. E como x pertence a B, e y pertence a D, x, y pertence a B vezes D.", "L": [["txt", "Agrupamos:  x ∈ A  e  y ∈ C,  logo por (Def ×):"], ["sub", "(x, y) ∈ A × C"], ["txt", "E também:  x ∈ B  e  y ∈ D,  logo por (Def ×):"], ["sub", "(x, y) ∈ B × D"]]},

{"say": "Pela definição de interseção, com X igual a A vezes C, e Y igual a B vezes D, x, y pertence à interseção de A vezes C com B vezes D.", "L": [["txt", "(x, y) ∈ A × C   e   (x, y) ∈ B × D,  logo por (Def ∩):"], ["res", "(x, y) ∈ (A × C) ∩ (B × D)"]]},

{"say": "Como x, y era um elemento qualquer da interseção de A e B, vezes a interseção de C e D, concluímos a primeira inclusão.", "L": [["res", "(A ∩ B) × (C ∩ D) ⊆ (A × C) ∩ (B × D)"]]},

{"title": "(2) (A × C) ∩ (B × D) ⊆ (A ∩ B) × (C ∩ D)", "clear": 1, "say": "Segunda inclusão. Tomamos um elemento qualquer x, y da interseção de A vezes C com B vezes D, e temos de provar que pertence à interseção de A e B, vezes a interseção de C e D.", "L": [["hyp", "Seja (x, y) ∈ (A × C) ∩ (B × D)"], ["goal", "Queremos:  (x, y) ∈ (A ∩ B) × (C ∩ D)"]]},

{"say": "Pela definição de interseção, x, y pertence a A vezes C, e x, y pertence a B vezes D.", "L": [["txt", "Por (Def ∩):"], ["sub", "(x, y) ∈ A × C   e   (x, y) ∈ B × D"]]},

{"say": "Pela definição de produto cartesiano, x, y pertencer a A vezes C significa que x pertence a A, e y pertence a C. E x, y pertencer a B vezes D significa que x pertence a B, e y pertence a D.", "L": [["txt", "Por (Def ×):"], ["sub", "x ∈ A  e  y ∈ C"], ["sub", "x ∈ B  e  y ∈ D"]]},

{"clear": 1, "say": "Agora agrupamos de outra maneira. Como x pertence a A, e x pertence a B, pela definição de interseção, x pertence a A interseção B. E como y pertence a C, e y pertence a D, y pertence a C interseção D.", "L": [["txt", "Agrupamos:  x ∈ A  e  x ∈ B,  logo por (Def ∩):"], ["sub", "x ∈ A ∩ B"], ["txt", "E também:  y ∈ C  e  y ∈ D,  logo por (Def ∩):"], ["sub", "y ∈ C ∩ D"]]},

{"say": "Pela definição de produto cartesiano, com X igual a A interseção B, e Y igual a C interseção D, x, y pertence à interseção de A e B, vezes a interseção de C e D.", "L": [["txt", "x ∈ A ∩ B  e  y ∈ C ∩ D,  logo por (Def ×):"], ["res", "(x, y) ∈ (A ∩ B) × (C ∩ D)"]]},

{"say": "Como x, y era um elemento qualquer da interseção de A vezes C com B vezes D, concluímos a segunda inclusão.", "L": [["res", "(A × C) ∩ (B × D) ⊆ (A ∩ B) × (C ∩ D)"]]},

{"title": "Conclusão", "clear": 1, "say": "Conclusão. Como se verificam as duas inclusões, pela definição de igualdade, a interseção de A e B, vezes a interseção de C e D, é igual à interseção de A vezes C com B vezes D. Obrigado por ver o vídeo.", "L": [["txt", "(1)  (A ∩ B) × (C ∩ D) ⊆ (A × C) ∩ (B × D)"], ["txt", "(2)  (A × C) ∩ (B × D) ⊆ (A ∩ B) × (C ∩ D)"], ["res", "(A ∩ B) × (C ∩ D) = (A × C) ∩ (B × D)"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' mais ').replace(/⊙/g,' vezes ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Repetir'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Continuar'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pausa';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pausa';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pausa';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^pt/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/antonio|antônio|donato|fabio|duarte|male|google português$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Produto cartesiano e interseção";$('sub').textContent="Exercício · Álgebra de conjuntos";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
