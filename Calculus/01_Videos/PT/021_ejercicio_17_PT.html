<title>Valores absolutos e conjuntos</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>

<script type="application/json" id="data">
{"lang":"pt-BR",
"meta":{"nivel": 1, "titulo": "Valores absolutos e conjuntos", "enunciado": "Sejam A = { x ∈ ℝ | |x| < 2 } e B = { x ∈ ℝ | |x − 1| + |x − 2| < 2 }. Definir e calcular:", "tesis": "A ∪ B,   A ∩ B,   A ∖ B,   B ∖ A,   A △ B", "datos": ["A = { x ∈ ℝ | |x| < 2 }", "B = { x ∈ ℝ | |x − 1| + |x − 2| < 2 }", "(Def △)  A △ B = (A ∖ B) ∪ (B ∖ A)"]},
"steps":[
{"title": "Valores absolutos e conjuntos", "sub": "Exercício · Álgebra de conjuntos", "clear": 1, "say": "Olá. Neste vídeo vamos resolver um exercício de álgebra de conjuntos, onde os conjuntos são definidos com valores absolutos. Vamos muito devagar, escrevendo cada equação e justificando cada passo.", "L": [["txt", "União, interseção, diferenças e diferença simétrica de dois conjuntos definidos com valores absolutos"]]},

{"say": "Os dados. A é o conjunto dos números reais x tais que o valor absoluto de x é menor que dois. B é o conjunto dos números reais x tais que o valor absoluto de x menos um, mais o valor absoluto de x menos dois, é menor que dois.", "L": [["hyp", "A = { x ∈ ℝ | |x| &lt; 2 }<span class='tag'>Dado</span>"], ["hyp", "B = { x ∈ ℝ | |x − 1| + |x − 2| &lt; 2 }<span class='tag'>Dado</span>"]]},

{"say": "O que queremos fazer. Definir e calcular cinco conjuntos: a união de A e B, a interseção, A menos B, B menos A, e a diferença simétrica. Recordamos à esquerda a definição de valor absoluto e as definições das operações com elementos, que vamos usar.", "L": [["goal", "A ∪ B,   A ∩ B,   A ∖ B,   B ∖ A,   A △ B<span class='tag'>Definir e calcular</span>"]], "pin": ["(Def |·|) |a| = a se a ≥ 0;   |a| = −a se a &lt; 0", "(Def ∪) A ∪ B = { x ∈ ℝ | x ∈ A ou x ∈ B }", "(Def ∩) A ∩ B = { x ∈ ℝ | x ∈ A e x ∈ B }", "(Def ∖) A ∖ B = { x ∈ ℝ | x ∈ A e x ∉ B }", "(Def △) A △ B = (A ∖ B) ∪ (B ∖ A)"]},

{"title": "1) Determinar A", "clear": 1, "say": "Passo um. Primeiro determinamos A e B como intervalos. Começamos por A. Temos que o valor absoluto de x é menor que dois. Usamos a definição de valor absoluto, e distinguimos dois casos segundo o sinal de x.", "L": [["sub", "|x| &lt; 2<span class='tag'>Desigualdade de A</span>"], ["hyp", "Caso 1:  x ≥ 0   ⟹   |x| = x"], ["hyp", "Caso 2:  x &lt; 0   ⟹   |x| = −x"]]},

{"say": "No caso um, x é maior ou igual a zero, e o valor absoluto de x é x. A desigualdade fica x menor que dois. Logo x está entre zero, incluído, e dois. No caso dois, x é menor que zero, e o valor absoluto de x é menos x. A desigualdade fica menos x menor que dois. Multiplicando por menos um, a desigualdade inverte-se, e fica x maior que menos dois. Logo x está entre menos dois e zero, sem incluir o zero. Juntando os dois casos, x está entre menos dois e dois.", "L": [["sub", "Caso 1:  x &lt; 2   e   x ≥ 0   ⟹   0 ≤ x &lt; 2"], ["sub", "Caso 2:  −x &lt; 2  ⟺  x &gt; −2   e   x &lt; 0   ⟹   −2 &lt; x &lt; 0"], ["res", "A = (−2, 2)"], ["txt", "<svg viewBox='0 0 470 82' width='100%' style='max-width:520px;display:block' xmlns='http://www.w3.org/2000/svg'><text x='0' y='15' fill='#7cc4ff' font-size='15' font-family='Georgia,serif'>A = (−2, 2)</text><line x1='30.0' y1='24' x2='440.0' y2='24' stroke='#3d5a50' stroke-width='2'/><line x1='67.27272727272728' y1='24' x2='365.45454545454544' y2='24' stroke='#7cc4ff' stroke-width='6'/><circle cx='67.27272727272728' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><circle cx='365.45454545454544' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><line x1='67.27272727272728' y1='48' x2='67.27272727272728' y2='56' stroke='#9fb3aa'/><text x='67.27272727272728' y='72' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>−2</text><line x1='216.36363636363637' y1='48' x2='216.36363636363637' y2='56' stroke='#9fb3aa'/><text x='216.36363636363637' y='72' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>0</text><line x1='253.63636363636363' y1='48' x2='253.63636363636363' y2='56' stroke='#9fb3aa'/><text x='253.63636363636363' y='72' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>1/2</text><line x1='365.45454545454544' y1='48' x2='365.45454545454544' y2='56' stroke='#9fb3aa'/><text x='365.45454545454544' y='72' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>2</text><line x1='402.72727272727275' y1='48' x2='402.72727272727275' y2='56' stroke='#9fb3aa'/><text x='402.72727272727275' y='72' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>5/2</text></svg>"]]},

{"title": "2) Determinar B", "clear": 1, "say": "Agora B. Temos que o valor absoluto de x menos um, mais o valor absoluto de x menos dois, é menor que dois. Cada valor absoluto muda de expressão no ponto onde o seu interior se anula: x menos um anula-se em um, e x menos dois anula-se em dois. Estes dois pontos dividem a reta em três zonas: x menor ou igual a um, x entre um e dois, e x maior ou igual a dois.", "L": [["sub", "|x − 1| + |x − 2| &lt; 2<span class='tag'>Desigualdade de B</span>"], ["txt", "|x − 1| muda em  x = 1,    |x − 2| muda em  x = 2"], ["hyp", "Zona 1:  x ≤ 1"], ["hyp", "Zona 2:  1 ≤ x ≤ 2"], ["hyp", "Zona 3:  x ≥ 2"]]},

{"clear": 1, "say": "Zona um: x menor ou igual a um. Então x menos um é menor ou igual a zero, e o seu valor absoluto é um menos x. Também x menos dois é negativo, e o seu valor absoluto é dois menos x. A soma é um menos x, mais dois menos x, ou seja, três menos dois x.", "L": [["hyp", "Zona 1:  x ≤ 1"], ["txt", "x − 1 ≤ 0  ⟹  |x − 1| = 1 − x"], ["txt", "x − 2 &lt; 0  ⟹  |x − 2| = 2 − x"], ["sub", "|x − 1| + |x − 2| = (1 − x) + (2 − x) = 3 − 2x"]]},

{"say": "Zona dois: x entre um e dois. Então x menos um é maior ou igual a zero, e o seu valor absoluto é x menos um. Mas x menos dois é menor ou igual a zero, e o seu valor absoluto é dois menos x. A soma é x menos um, mais dois menos x. Os x cancelam-se, e fica um.", "L": [["hyp", "Zona 2:  1 ≤ x ≤ 2"], ["txt", "x − 1 ≥ 0  ⟹  |x − 1| = x − 1"], ["txt", "x − 2 ≤ 0  ⟹  |x − 2| = 2 − x"], ["sub", "|x − 1| + |x − 2| = (x − 1) + (2 − x) = 1"]], "clear": 1},

{"say": "Zona três: x maior ou igual a dois. Então as duas quantidades são maiores ou iguais a zero, e os valores absolutos são x menos um, e x menos dois. A soma é x menos um, mais x menos dois, ou seja, dois x menos três.", "L": [["hyp", "Zona 3:  x ≥ 2"], ["txt", "x − 1 ≥ 0  ⟹  |x − 1| = x − 1"], ["txt", "x − 2 ≥ 0  ⟹  |x − 2| = x − 2"], ["sub", "|x − 1| + |x − 2| = (x − 1) + (x − 2) = 2x − 3"]], "clear": 1},

{"clear": 1, "say": "Agora impomos que a soma seja menor que dois em cada zona. Na zona um, três menos dois x é menor que dois. Subtraindo três, menos dois x é menor que menos um. Dividindo por menos dois, a desigualdade inverte-se, e x é maior que um meio. Como além disso x é menor ou igual a um, nesta zona temos x entre um meio, sem incluir, e um, incluído.", "L": [["hyp", "Zona 1:  x ≤ 1"], ["txt", "|x − 1| + |x − 2| = 3 − 2x &lt; 2"], ["sub", "3 − 2x &lt; 2  ⟺  −2x &lt; −1  ⟺  x &gt; 1/2"], ["sub", "1/2 &lt; x ≤ 1"]]},

{"say": "Na zona dois, a soma vale um, e um é menor que dois. Isto é sempre verdadeiro, portanto todos os x entre um e dois, ambos incluídos, cumprem a condição.", "L": [["hyp", "Zona 2:  1 ≤ x ≤ 2"], ["txt", "|x − 1| + |x − 2| = 1"], ["sub", "1 &lt; 2   (sempre verdadeiro)"], ["sub", "1 ≤ x ≤ 2"]], "clear": 1},

{"say": "Na zona três, dois x menos três é menor que dois. Somando três, dois x é menor que cinco. Dividindo por dois, x é menor que cinco meios. Como além disso x é maior ou igual a dois, nesta zona temos x entre dois, incluído, e cinco meios, sem incluir.", "L": [["hyp", "Zona 3:  x ≥ 2"], ["txt", "|x − 1| + |x − 2| = 2x − 3 &lt; 2"], ["sub", "2x − 3 &lt; 2  ⟺  2x &lt; 5  ⟺  x &lt; 5/2"], ["sub", "2 ≤ x &lt; 5/2"]], "clear": 1},

{"clear": 1, "say": "Unindo as três zonas, um meio menor que x menor ou igual a um, junto com x entre um e dois, junto com x maior ou igual a dois e menor que cinco meios, obtemos que x está entre um meio e cinco meios. Portanto, B é o intervalo aberto de um meio a cinco meios.", "L": [["sub", "(1/2, 1] ∪ [1, 2] ∪ [2, 5/2) = (1/2, 5/2)"], ["res", "B = (1/2, 5/2)"], ["txt", "<svg viewBox='0 0 470 116' width='100%' style='max-width:520px;display:block' xmlns='http://www.w3.org/2000/svg'><text x='0' y='15' fill='#7cc4ff' font-size='15' font-family='Georgia,serif'>A = (−2, 2)</text><line x1='30.0' y1='24' x2='440.0' y2='24' stroke='#3d5a50' stroke-width='2'/><line x1='67.27272727272728' y1='24' x2='365.45454545454544' y2='24' stroke='#7cc4ff' stroke-width='6'/><circle cx='67.27272727272728' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><circle cx='365.45454545454544' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><text x='0' y='49' fill='#ffd166' font-size='15' font-family='Georgia,serif'>B = (1/2, 5/2)</text><line x1='30.0' y1='58' x2='440.0' y2='58' stroke='#3d5a50' stroke-width='2'/><line x1='253.63636363636363' y1='58' x2='402.72727272727275' y2='58' stroke='#ffd166' stroke-width='6'/><circle cx='253.63636363636363' cy='58' r='7' fill='#16231f' stroke='#ffd166' stroke-width='3'/><circle cx='402.72727272727275' cy='58' r='7' fill='#16231f' stroke='#ffd166' stroke-width='3'/><line x1='67.27272727272728' y1='82' x2='67.27272727272728' y2='90' stroke='#9fb3aa'/><text x='67.27272727272728' y='106' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>−2</text><line x1='216.36363636363637' y1='82' x2='216.36363636363637' y2='90' stroke='#9fb3aa'/><text x='216.36363636363637' y='106' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>0</text><line x1='253.63636363636363' y1='82' x2='253.63636363636363' y2='90' stroke='#9fb3aa'/><text x='253.63636363636363' y='106' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>1/2</text><line x1='365.45454545454544' y1='82' x2='365.45454545454544' y2='90' stroke='#9fb3aa'/><text x='365.45454545454544' y='106' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>2</text><line x1='402.72727272727275' y1='82' x2='402.72727272727275' y2='90' stroke='#9fb3aa'/><text x='402.72727272727275' y='106' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>5/2</text></svg>"]]},

{"title": "3) União A ∪ B", "clear": 1, "say": "Passo três. A união. Por definição, A união B é o conjunto dos números reais x tais que x pertence a A, ou x pertence a B.", "L": [["sub", "A ∪ B = { x ∈ ℝ | x ∈ A  ou  x ∈ B }<span class='tag'>Definição de união</span>"]]},

='#7be0a0' stroke-width='3'/><line x1='67.27272727272728' y1='116' x2='67.27272727272728' y2='124' stroke='#9fb3aa'/><text x='67.27272727272728' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>−2</text><line x1='216.36363636363637' y1='116' x2='216.36363636363637' y2='124' stroke='#9fb3aa'/><text x='216.36363636363637' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>0</text><line x1='253.63636363636363' y1='116' x2='253.63636363636363' y2='124' stroke='#9fb3aa'/><text x='253.63636363636363' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>1/2</text><line x1='365.45454545454544' y1='116' x2='365.45454545454544' y2='124' stroke='#9fb3aa'/><text x='365.45454545454544' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>2</text><line x1='402.72727272727275' y1='116' x2='402.72727272727275' y2='124' stroke='#9fb3aa'/><text x='402.72727272727275' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>5/2</text></svg>"]]},

<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' mais ').replace(/⊙/g,' vezes ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Repetir'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Continuar'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pausa';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pausa';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pausa';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^pt/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/antonio|antônio|donato|fabio|duarte|male|google português$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Valores absolutos e conjuntos";$('sub').textContent="Exercício · Álgebra de conjuntos";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
