<!DOCTYPE html>
<html lang="pt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>𝒫(U) é um reticulado distributivo</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}

#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}

mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}

.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>Lembre-se</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">

<select id="voice"></select>
<label>Velocidade <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>

<script type="application/json" id="data">
{"lang":"pt-BR",
"meta":{"nivel": 2, "titulo": "𝒫(U) é um reticulado distributivo", "enunciado": "Demonstrar que (𝒫(U), ∪, ∩) é um reticulado distributivo.", "tesis": "(1)  A ∩ (B ∪ C) = (A ∩ B) ∪ (A ∩ C),   (2)  A ∪ (B ∩ C) = (A ∪ B) ∩ (A ∪ C)", "datos": ["(Hipótese)  (𝒫(U), ∪, ∩) é um reticulado", "(Dupla inclusão)  X = Y ⇔ X ⊆ Y e Y ⊆ X", "(Def ∪, ∩)  x ∈ X ∪ Y ⇔ x ∈ X ou x ∈ Y,   x ∈ X ∩ Y ⇔ x ∈ X e x ∈ Y"]},
"steps":[
{"title": "𝒫(U) é um reticulado distributivo", "sub": "Exercício · Álgebra de conjuntos", "clear": 1, "say": "Olá. Neste vídeo vamos resolver um exercício sobre álgebra de conjuntos. Vamos devagar, escrevendo cada equação e justificando cada passo.", "L": [["txt", "Demonstrar que o conjunto das partes de U, com a união e a interseção, forma um reticulado distributivo"]]},

{"say": "Primeiro, os dados. Já sabemos que o conjunto das partes de U, com a união e a interseção, forma um reticulado, onde a união faz o papel de supremo, e a interseção o de ínfimo.", "L": [["hyp", "(𝒫(U), ∪, ∩) é um reticulado<span class='tag'>Hipótese: já sabemos</span>"], ["txt", "∪ = supremo,     ∩ = ínfimo"]]},

{"say": "Para que seja distributivo, devemos verificar que, para quaisquer subconjuntos A, B e C de U, valem duas igualdades. A primeira: A interseção, B união C, é igual a, A interseção B, união, A interseção C. A segunda: A união, B interseção C, é igual a, A união B, interseção, A união C.", "L": [["txt", "Sejam A, B, C ⊆ U"], ["goal", "(1)  A ∩ (B ∪ C) = (A ∩ B) ∪ (A ∩ C)<span class='tag'>Tese</span>"], ["goal", "(2)  A ∪ (B ∩ C) = (A ∪ B) ∩ (A ∪ C)<span class='tag'>Tese</span>"]]},

{"say": "Vamos provar as duas igualdades por dupla inclusão. Lembramos que dois conjuntos são iguais se e somente se cada um está contido no outro. E lembramos as definições de união e de interseção com elementos: x pertence à união se pertence a um dos dois conjuntos, e x pertence à interseção se pertence aos dois. Anotamo-las à esquerda.", "L": [["sub", "X = Y  ⇔  X ⊆ Y  e  Y ⊆ X<span class='tag'>Igualdade por dupla inclusão</span>"], ["sub", "X ⊆ Y  ⇔  (x ∈ X ⇒ x ∈ Y)<span class='tag'>Inclusão</span>"]], "pin": ["(Dupla inclusão) X = Y ⇔ X ⊆ Y e Y ⊆ X", "(Def ∪) x ∈ X ∪ Y ⇔ x ∈ X ou x ∈ Y", "(Def ∩) x ∈ X ∩ Y ⇔ x ∈ X e x ∈ Y"]},

{"title": "Primeira lei: A ∩ (B ∪ C) ⊆ (A ∩ B) ∪ (A ∩ C)", "clear": 1, "say": "Começamos pela primeira igualdade. Seja x um elemento de U. Primeiro provamos a inclusão da esquerda para a direita. Supomos que x pertence a A interseção, B união C. Isto é uma hipótese.", "L": [["txt", "Seja x ∈ U"], ["hyp", "x ∈ A ∩ (B ∪ C)<span class='tag'>Hipótese</span>"], ["goal", "Queremos:  x ∈ (A ∩ B) ∪ (A ∩ C)<span class='tag'>Tese</span>"]]},

{"say": "Pela definição de interseção, x pertence a A, e x pertence a B união C. E pela definição de união, x pertence a B união C significa que x pertence a B, ou x pertence a C.", "L": [["hyp", "x ∈ A   e   x ∈ B ∪ C<span class='tag'>Definição de ∩</span>"], ["hyp", "x ∈ A   e   (x ∈ B  ou  x ∈ C)<span class='tag'>Definição de ∪</span>"]]},

{"say": "Agora distinguimos dois casos. Primeiro caso: x pertence a B. Como x também pertence a A, pela definição de interseção, x pertence a A interseção B.", "L": [["sub", "Caso 1:  x ∈ B"], ["sub", "x ∈ A  e  x ∈ B   ⟹   x ∈ A ∩ B<span class='tag'>Definição de ∩</span>"]]},

{"say": "Segundo caso: x pertence a C. Como x também pertence a A, pela definição de interseção, x pertence a A interseção C.", "L": [["sub", "Caso 2:  x ∈ C"], ["sub", "x ∈ A  e  x ∈ C   ⟹   x ∈ A ∩ C<span class='tag'>Definição de ∩</span>"]]},

{"say": "Em qualquer caso, x pertence a A interseção B, ou x pertence a A interseção C. Pela definição de união, x pertence a A interseção B, união, A interseção C. Com isto termina esta inclusão.", "L": [["res", "x ∈ (A ∩ B) ∪ (A ∩ C)<span class='tag'>Definição de ∪, em qualquer caso</span>"], ["res", "A ∩ (B ∪ C) ⊆ (A ∩ B) ∪ (A ∩ C)   ∎"]]},

{"title": "Primeira lei: (A ∩ B) ∪ (A ∩ C) ⊆ A ∩ (B ∪ C)", "clear": 1, "say": "Reciprocamente, provamos a inclusão da direita para a esquerda. Supomos que x pertence a A interseção B, união, A interseção C. Isto é uma hipótese. Pela definição de união, x pertence a A interseção B, ou x pertence a A interseção C.", "L": [["hyp", "x ∈ (A ∩ B) ∪ (A ∩ C)<span class='tag'>Hipótese</span>"], ["hyp", "x ∈ A ∩ B   ou   x ∈ A ∩ C<span class='tag'>Definição de ∪</span>"], ["goal", "Queremos:  x ∈ A ∩ (B ∪ C)<span class='tag'>Tese</span>"]]},

{"say": "Em qualquer caso, x pertence a A. Se x pertence a A interseção B, então x pertence a A e a B. E se x pertence a A interseção C, então x pertence a A e a C. Além disso, no primeiro caso x pertence a B, e no segundo x pertence a C. Ou seja, x pertence a A, e x pertence a B ou x pertence a C.", "L": [["sub", "x ∈ A   e   (x ∈ B  ou  x ∈ C)<span class='tag'>Definição de ∩ em cada caso</span>"]]},

{"say": "Pela definição de união, x pertence a B ou x pertence a C significa que x pertence a B união C.", "L": [["sub", "x ∈ A   e   x ∈ B ∪ C<span class='tag'>Definição de ∪</span>"]]},

{"say": "Portanto, pela definição de interseção, x pertence a A interseção, B união C. Com isto termina esta inclusão.", "L": [["res", "x ∈ A ∩ (B ∪ C)<span class='tag'>Definição de ∩</span>"], ["res", "(A ∩ B) ∪ (A ∩ C) ⊆ A ∩ (B ∪ C)   ∎"]]},

{"title": "Primeira lei distributiva", "clear": 1, "say": "Provamos as duas inclusões. Pela dupla inclusão, concluímos a primeira igualdade: A interseção, B união C, é igual a, A interseção B, união, A interseção C.", "L": [["res", "A ∩ (B ∪ C) = (A ∩ B) ∪ (A ∩ C)   ∎<span class='tag'>Dupla inclusão</span>"]]},

{"title": "Segunda lei (1): A ∪ (B ∩ C) ⊆ (A ∪ B) ∩ (A ∪ C)", "clear": 1, "say": "Provamos agora a segunda lei distributiva, também por dupla inclusão. Seja x um elemento de U. Começamos pela parte um: demonstrar que A união, B interseção C, está contido em, A união B, interseção, A união C. Supomos que x pertence a A união, B interseção C. Isto é uma hipótese.", "L": [["txt", "Seja x ∈ U"], ["hyp", "x ∈ A ∪ (B ∩ C)<span class='tag'>Hipótese</span>"], ["goal", "Queremos:  x ∈ (A ∪ B) ∩ (A ∪ C)<span class='tag'>Tese</span>"]]},

{"say": "Pela definição de união, x pertence a A, ou x pertence a B interseção C. Distinguimos dois casos.", "L": [["hyp", "x ∈ A   ou   x ∈ B ∩ C<span class='tag'>Definição de ∪</span>"]]},

{"say": "Primeiro caso: x pertence a A. Então, claramente, x pertence a A união B, e x pertence a A união C, pela definição de união. Portanto, x pertence à interseção das duas uniões.", "L": [["sub", "Caso 1:  x ∈ A"], ["sub", "x ∈ A ∪ B   e   x ∈ A ∪ C<span class='tag'>Definição de ∪</span>"], ["res", "x ∈ (A ∪ B) ∩ (A ∪ C)<span class='tag'>Definição de ∩</span>"]]},

{"say": "Segundo caso: x pertence a B interseção C. Então x pertence a B, e x pertence a C. Em particular, x pertence a A união B, porque x pertence a B. E x pertence a A união C, porque x pertence a C. Logo x pertence à interseção das duas uniões.", "L": [["sub", "Caso 2:  x ∈ B ∩ C   ⟹   x ∈ B  e  x ∈ C<span class='tag'>Definição de ∩</span>"], ["sub", "x ∈ A ∪ B  (porque x ∈ B)   e   x ∈ A ∪ C  (porque x ∈ C)<span class='tag'>Definição de ∪</span>"], ["res", "x ∈ (A ∪ B) ∩ (A ∪ C)<span class='tag'>Definição de ∩</span>"]]},

{"say": "Em qualquer dos dois casos, x pertence a A união B, interseção, A união C. E portanto, A união, B interseção C, está contido em, A união B, interseção, A união C.", "L": [["res", "A ∪ (B ∩ C) ⊆ (A ∪ B) ∩ (A ∪ C)   ∎<span class='tag'>Em ambos os casos</span>"]]},

{"title": "Segunda lei (2): (A ∪ B) ∩ (A ∪ C) ⊆ A ∪ (B ∩ C)", "clear": 1, "say": "Passamos à parte dois: demonstrar que A união B, interseção, A união C, está contido em, A união, B interseção C. Supomos agora que x pertence a A união B, interseção, A união C. Isto é uma hipótese.", "L": [["hyp", "x ∈ (A ∪ B) ∩ (A ∪ C)<span class='tag'>Hipótese</span>"], ["goal", "Queremos:  x ∈ A ∪ (B ∩ C)<span class='tag'>Tese</span>"]]},

{"say": "Pela definição de interseção, x pertence a A união B, e x pertence a A união C. E pela definição de união, isto significa: x pertence a A ou x pertence a B, e além disso, x pertence a A ou x pertence a C.", "L": [["hyp", "x ∈ A ∪ B   e   x ∈ A ∪ C<span class='tag'>Definição de ∩</span>"], ["hyp", "(x ∈ A  ou  x ∈ B)   e   (x ∈ A  ou  x ∈ C)<span class='tag'>Definição de ∪</span>"]]},

{"say": "Primeiro caso: suponhamos que x pertence a A. Isto é uma hipótese. Então, claramente, x pertence a A união, B interseção C, pela definição de união, e terminamos.", "L": [["hyp", "Caso:  x ∈ A<span class='tag'>Hipótese do caso</span>"], ["res", "x ∈ A ∪ (B ∩ C)<span class='tag'>Definição de ∪: terminamos</span>"]]},

{"say": "Segundo caso: suponhamos portanto que x não pertence a A. Isto é uma hipótese. Sob esta suposição, das condições anteriores deduz-se o seguinte.", "L": [["hyp", "Caso:  x ∉ A<span class='tag'>Hipótese do caso</span>"]]},

{"say": "De x pertence a A união B, e x não pertence a A, segue-se que x pertence a B.", "L": [["sub", "x ∈ A ∪ B   e   x ∉ A   ⟹   x ∈ B<span class='tag'>Se x ∈ A ou x ∈ B, e x ∉ A, então x ∈ B</span>"]]},

{"say": "De x pertence a A união C, e x não pertence a A, segue-se que x pertence a C.", "L": [["sub", "x ∈ A ∪ C   e   x ∉ A   ⟹   x ∈ C<span class='tag'>Se x ∈ A ou x ∈ C, e x ∉ A, então x ∈ C</span>"]]},

{"say": "Portanto, x pertence a B, e x pertence a C. Ou seja, pela definição de interseção, x pertence a B interseção C.", "L": [["sub", "x ∈ B   e   x ∈ C   ⟹   x ∈ B ∩ C<span class='tag'>Definição de ∩</span>"]]},

{"say": "Em consequência, pela definição de união, x pertence a A união, B interseção C.", "L": [["res", "x ∈ A ∪ (B ∩ C)<span class='tag'>Definição de ∪</span>"]]},

{"say": "Provamos que em todos os casos x pertence a A união, B interseção C. Logo, A união B, interseção, A união C, está contido em, A união, B interseção C.", "L": [["res", "(A ∪ B) ∩ (A ∪ C) ⊆ A ∪ (B ∩ C)   ∎<span class='tag'>Em todos os casos</span>"]]},

{"title": "Segunda lei distributiva", "clear": 1, "say": "Das partes um e dois, pela dupla inclusão, concluímos a igualdade: A união, B interseção C, é igual a, A união B, interseção, A união C. Ou seja, a união distribui sobre a interseção.", "L": [["res", "A ∪ (B ∩ C) = (A ∪ B) ∩ (A ∪ C)   ∎<span class='tag'>Dupla inclusão: a união distribui sobre a interseção</span>"]]},

{"title": "Conclusão", "clear": 1, "say": "Como no conjunto das partes de U, com a união e a interseção, valem ambas as leis distributivas, concluímos que é um reticulado distributivo. Obrigado por assistir.", "L": [["res", "A ∩ (B ∪ C) = (A ∩ B) ∪ (A ∩ C)<span class='tag'>A interseção distribui sobre a união</span>"], ["res", "A ∪ (B ∩ C) = (A ∪ B) ∩ (A ∪ C)<span class='tag'>A união distribui sobre a interseção</span>"], ["res", "(𝒫(U), ∪, ∩) é um reticulado distributivo   ∎"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' mais ').replace(/⊙/g,' vezes ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Repetir'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Continuar'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pausa';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pausa';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pausa';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^pt/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/antonio|antônio|donato|fabio|duarte|male|google português$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="𝒫(U) é um reticulado distributivo";$('sub').textContent="Exercício · Álgebra de conjuntos";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
