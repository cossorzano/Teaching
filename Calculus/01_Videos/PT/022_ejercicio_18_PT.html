<!DOCTYPE html>
<html lang="pt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inclusões no plano</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>Lembre-se</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Começar</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Velocidade <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Modo gravação (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"pt-BR",
"meta":{"nivel": 1, "titulo": "Inclusões no plano", "enunciado": "Seja δ > 0 e consideremos em ℝ² os conjuntos A = { (x, y) ∈ ℝ² | |x| + |y| < δ }, B = { (x, y) ∈ ℝ² | √(x² + y²) < δ } e C = { (x, y) ∈ ℝ² | max{ |x|, |y| } < δ }. Demonstrar que:", "tesis": "A ⊆ B ⊆ C", "datos": ["δ > 0", "A = { (x, y) ∈ ℝ² | |x| + |y| < δ }", "B = { (x, y) ∈ ℝ² | √(x² + y²) < δ }", "C = { (x, y) ∈ ℝ² | max{ |x|, |y| } < δ }"]},
"steps":[
{"title": "Inclusões no plano", "sub": "Exercício · Álgebra de conjuntos", "clear": 1, "say": "Olá. Neste vídeo vamos demonstrar que três conjuntos do plano, definidos com o valor absoluto, a norma euclidiana e o máximo, estão um dentro do outro. Vamos muito devagar, escrevendo cada equação e justificando cada passo.", "L": [["txt", "Demonstrar que  A ⊆ B ⊆ C  no plano"]]},

{"say": "Os dados. Seja delta um número real maior que zero. A é o conjunto dos pontos x, y do plano tais que o valor absoluto de x, mais o valor absoluto de y, é menor que delta. B é o conjunto dos pontos x, y tais que a raiz quadrada de x ao quadrado mais y ao quadrado é menor que delta. E C é o conjunto dos pontos x, y tais que o máximo do valor absoluto de x e do valor absoluto de y é menor que delta.", "L": [["hyp", "δ &gt; 0<span class='tag'>Dado</span>"], ["hyp", "A = { (x, y) ∈ ℝ² | |x| + |y| &lt; δ }"], ["hyp", "B = { (x, y) ∈ ℝ² | √(x² + y²) &lt; δ }"], ["hyp", "C = { (x, y) ∈ ℝ² | max{ |x|, |y| } &lt; δ }"]]},

{"say": "O que queremos demonstrar. A está contido em B, e B está contido em C. Aqui, inclusão significa contido ou igual. À direita vemos os três conjuntos desenhados para delta igual a um: A é o losango, B é o círculo, e C é o quadrado. As linhas tracejadas indicam que a fronteira não pertence ao conjunto. Recordamos à esquerda o que vamos usar: a definição de inclusão, que o quadrado de um valor absoluto é o quadrado do número, que a raiz quadrada do quadrado de um número é o seu valor absoluto, e que a raiz quadrada conserva a ordem.", "L": [["goal", "A ⊆ B   e   B ⊆ C<span class='tag'>Demonstrar</span>"], ["txt", "<svg viewBox='0 0 300 300' width='100%' style='max-width:300px;display:block' xmlns='http://www.w3.org/2000/svg' font-family='Georgia,serif'><rect x='40' y='40' width='220' height='220' fill='#7be0a0' fill-opacity='.15' stroke='#7be0a0' stroke-width='2.5' stroke-dasharray='6 4'/><circle cx='150' cy='150' r='110' fill='#ffd166' fill-opacity='.15' stroke='#ffd166' stroke-width='2.5' stroke-dasharray='6 4'/><polygon points='150,40 260,150 150,260 40,150' fill='#7cc4ff' fill-opacity='.25' stroke='#7cc4ff' stroke-width='2.5' stroke-dasharray='6 4'/><line x1='10' y1='150' x2='290' y2='150' stroke='#9fb3aa' stroke-width='1'/><line x1='150' y1='10' x2='150' y2='290' stroke='#9fb3aa' stroke-width='1'/><text x='260' y='166' fill='#9fb3aa' font-size='16' text-anchor='middle'>δ</text><text x='40' y='166' fill='#9fb3aa' font-size='16' text-anchor='middle'>−δ</text><text x='156' y='54' fill='#9fb3aa' font-size='14'>δ</text><text x='136' y='155' fill='#7cc4ff' font-size='18'>A</text><text x='184' y='116' fill='#ffd166' font-size='18'>B</text><text x='216' y='84' fill='#7be0a0' font-size='18'>C</text></svg>"]], "pin": ["(Def ⊆) X ⊆ Y  ⟺  todo p ∈ X cumpre p ∈ Y", "(P1) |a|² = a²", "(P2) √(a²) = |a|", "(P3) se 0 ≤ u ≤ v então √u ≤ √v"], "clear": 1},

{"title": "1) A ⊆ B", "clear": 1, "say": "Primeira parte: demonstramos que A está contido em B. Pela definição de inclusão, tomamos um ponto qualquer x, y de A, e temos de provar que pertence a B.", "L": [["hyp", "Seja (x, y) ∈ A"], ["goal", "Queremos:  (x, y) ∈ B,  ou seja,  √(x² + y²) &lt; δ"]]},

{"say": "Como x, y pertence a A, pela definição de A verifica-se que o valor absoluto de x, mais o valor absoluto de y, é menor que delta. Esta é a nossa hipótese.", "L": [["hyp", "(x, y) ∈ A  ⟹  |x| + |y| &lt; δ<span class='tag'>Hipótese</span>"]]},

{"clear": 1, "say": "Agora calculamos o quadrado da soma dos valores absolutos. Desenvolvendo o quadrado de uma soma, é o quadrado do valor absoluto de x, mais duas vezes o valor absoluto de x vezes o valor absoluto de y, mais o quadrado do valor absoluto de y.", "L": [["txt", "Desenvolvemos o quadrado de uma soma:"], ["sub", "(|x| + |y|)² = |x|² + 2|x||y| + |y|²"]]},

{"say": "Pela propriedade P1, o quadrado do valor absoluto de x é x ao quadrado, e o quadrado do valor absoluto de y é y ao quadrado. Substituímos.", "L": [["txt", "Por (P1) com a = x  e  com a = y:"], ["sub", "(|x| + |y|)² = <mark>x²</mark> + 2|x||y| + <mark>y²</mark>"]]},

{"say": "Como o valor absoluto de x e o valor absoluto de y são maiores ou iguais a zero, o termo duas vezes o valor absoluto de x vezes o valor absoluto de y é maior ou igual a zero. Portanto, se o retirarmos da soma, esta diminui ou fica igual. Logo o quadrado da soma é maior ou igual a x ao quadrado mais y ao quadrado.", "L": [["txt", "Como |x| ≥ 0 e |y| ≥ 0, tem-se 2|x||y| ≥ 0, logo:"], ["res", "x² + y² ≤ (|x| + |y|)²"]]},

{"clear": 1, "say": "Agora tomamos raízes quadradas. Usamos a propriedade P3, com u igual a x ao quadrado mais y ao quadrado, e v igual ao quadrado da soma dos valores absolutos. Ambos são maiores ou iguais a zero, e u é menor ou igual a v. Então a raiz quadrada de x ao quadrado mais y ao quadrado é menor ou igual à raiz quadrada de, valor absoluto de x mais valor absoluto de y, ao quadrado.", "L": [["txt", "(P3) com  u = x² + y²,  v = (|x| + |y|)²,  0 ≤ u ≤ v:"], ["sub", "√(x² + y²) ≤ √( (|x| + |y|)² )"]]},

{"say": "E pela propriedade P2, com a igual à soma do valor absoluto de x e do valor absoluto de y, a raiz quadrada desse quadrado é o valor absoluto da soma. Mas a soma já é maior ou igual a zero, portanto o seu valor absoluto é ela própria.", "L": [["txt", "(P2) com  a = |x| + |y| ≥ 0:   √( (|x| + |y|)² ) = | |x| + |y| | = |x| + |y|"], ["res", "√(x² + y²) ≤ |x| + |y|"]]},

{"clear": 1, "say": "Juntamos esta desigualdade com a hipótese. A raiz quadrada de x ao quadrado mais y ao quadrado é menor ou igual ao valor absoluto de x mais o valor absoluto de y, e isto é menor que delta.", "L": [["txt", "Juntando com a hipótese  |x| + |y| &lt; δ :"], ["res", "√(x² + y²) ≤ |x| + |y| &lt; δ"]]},

{"say": "Portanto, a raiz quadrada de x ao quadrado mais y ao quadrado é menor que delta. Isto é exatamente a definição de B, portanto x, y pertence a B. Como x, y era um ponto qualquer de A, concluímos que A está contido em B.", "L": [["txt", "Então  √(x² + y²) &lt; δ,  logo:"], ["hyp", "(x, y) ∈ B"], ["res", "A ⊆ B"]]},

{"title": "2) B ⊆ C", "clear": 1, "say": "Segunda parte: demonstramos que B está contido em C. Tomamos um ponto qualquer x, y de B, e temos de provar que pertence a C.", "L": [["hyp", "Seja (x, y) ∈ B"], ["goal", "Queremos:  (x, y) ∈ C,  ou seja,  max{ |x|, |y| } &lt; δ"]]},

{"say": "Como x, y pertence a B, pela definição de B verifica-se que a raiz quadrada de x ao quadrado mais y ao quadrado é menor que delta. Esta é a nossa hipótese.", "L": [["hyp", "(x, y) ∈ B  ⟹  √(x² + y²) &lt; δ<span class='tag'>Hipótese</span>"]]},

{"clear": 1, "say": "Primeiro, como y ao quadrado é maior ou igual a zero, x ao quadrado é menor ou igual a x ao quadrado mais y ao quadrado. Da mesma forma, como x ao quadrado é maior ou igual a zero, y ao quadrado é menor ou igual a x ao quadrado mais y ao quadrado.", "L": [["txt", "Como  y² ≥ 0  e  x² ≥ 0:"], ["sub", "x² ≤ x² + y²"], ["sub", "y² ≤ x² + y²"]]},

{"say": "Tomamos raízes quadradas, com a propriedade P3. Com u igual a x ao quadrado, e v igual a x ao quadrado mais y ao quadrado, a raiz de x ao quadrado é menor ou igual à raiz de x ao quadrado mais y ao quadrado. E pela propriedade P2, a raiz quadrada de x ao quadrado é o valor absoluto de x. O mesmo com y.", "L": [["txt", "(P3) com  u = x²,  v = x² + y²,  e depois (P2) com  a = x:"], ["sub", "|x| = √(x²) ≤ √(x² + y²)"], ["txt", "(P3) com  u = y²,  v = x² + y²,  e depois (P2) com  a = y:"], ["sub", "|y| = √(y²) ≤ √(x² + y²)"]]},

{"clear": 1, "say": "Agora usamos a hipótese. O valor absoluto de x é menor ou igual à raiz de x ao quadrado mais y ao quadrado, que é menor que delta. E o mesmo para y. Portanto, o valor absoluto de x é menor que delta, e o valor absoluto de y é menor que delta.", "L": [["txt", "Juntando com a hipótese  √(x² + y²) &lt; δ :"], ["res", "|x| ≤ √(x² + y²) &lt; δ"], ["res", "|y| ≤ √(x² + y²) &lt; δ"]]},

{"say": "O máximo de dois números é um dos dois, e os dois são menores que delta. Portanto, o máximo do valor absoluto de x e do valor absoluto de y é menor que delta. Isto é a definição de C, portanto x, y pertence a C. Como x, y era um ponto qualquer de B, concluímos que B está contido em C.", "L": [["txt", "|x| &lt; δ  e  |y| &lt; δ  ⟹  max{ |x|, |y| } &lt; δ"], ["hyp", "(x, y) ∈ C"], ["res", "B ⊆ C"]]},

{"title": "Conclusão", "clear": 1, "say": "Conclusão. Juntando as duas partes, A está contido em B, e B está contido em C. Geometricamente, o losango está dentro do círculo, e o círculo está dentro do quadrado. Obrigado por ver o vídeo.", "L": [["res", "A ⊆ B   e   B ⊆ C   ⟹   A ⊆ B ⊆ C"], ["txt", "<svg viewBox='0 0 300 300' width='100%' style='max-width:300px;display:block' xmlns='http://www.w3.org/2000/svg' font-family='Georgia,serif'><rect x='40' y='40' width='220' height='220' fill='#7be0a0' fill-opacity='.15' stroke='#7be0a0' stroke-width='2.5' stroke-dasharray='6 4'/><circle cx='150' cy='150' r='110' fill='#ffd166' fill-opacity='.15' stroke='#ffd166' stroke-width='2.5' stroke-dasharray='6 4'/><polygon points='150,40 260,150 150,260 40,150' fill='#7cc4ff' fill-opacity='.25' stroke='#7cc4ff' stroke-width='2.5' stroke-dasharray='6 4'/><line x1='10' y1='150' x2='290' y2='150' stroke='#9fb3aa' stroke-width='1'/><line x1='150' y1='10' x2='150' y2='290' stroke='#9fb3aa' stroke-width='1'/><text x='260' y='166' fill='#9fb3aa' font-size='16' text-anchor='middle'>δ</text><text x='40' y='166' fill='#9fb3aa' font-size='16' text-anchor='middle'>−δ</text><text x='156' y='54' fill='#9fb3aa' font-size='14'>δ</text><text x='136' y='155' fill='#7cc4ff' font-size='18'>A</text><text x='184' y='116' fill='#ffd166' font-size='18'>B</text><text x='216' y='84' fill='#7be0a0' font-size='18'>C</text></svg>"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' mais ').replace(/⊙/g,' vezes ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Repetir'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Continuar'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pausa';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pausa';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pausa';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^pt/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/antonio|antônio|donato|fabio|duarte|male|google português$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Inclusões no plano";$('sub').textContent="Exercício · Álgebra de conjuntos";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
