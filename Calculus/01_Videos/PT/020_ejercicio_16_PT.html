<!DOCTYPE html>
<html lang="pt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conjuntos e desigualdades</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>Lembre-se</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Começar</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Velocidade <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Modo gravação (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"pt-BR",
"meta":{"nivel": 1, "titulo": "Conjuntos e desigualdades", "enunciado": "Sejam A = { x ∈ ℝ | x² − 2x < 0 } e B = { x ∈ ℝ | x² − 3x + 2 ≥ 0 }. Definir e calcular:", "tesis": "A ∪ B,   A ∩ B,   A ∖ B,   B ∖ A,   A △ B", "datos": ["A = { x ∈ ℝ | x² − 2x < 0 }", "B = { x ∈ ℝ | x² − 3x + 2 ≥ 0 }", "(Def △)  A △ B = (A ∖ B) ∪ (B ∖ A)"]},
"steps":[
{"title": "Conjuntos e desigualdades", "sub": "Exercício · Álgebra de conjuntos", "clear": 1, "say": "Olá. Neste vídeo vamos resolver um exercício de álgebra de conjuntos, onde os conjuntos são definidos por desigualdades. Vamos devagar, escrevendo cada equação e justificando cada passo.", "L": [["txt", "União, interseção, diferenças e diferença simétrica de dois conjuntos definidos por desigualdades"]]},

{"say": "Os dados. A é o conjunto dos números reais x tais que x ao quadrado menos dois x é menor que zero. B é o conjunto dos números reais x tais que x ao quadrado menos três x mais dois é maior ou igual a zero.", "L": [["hyp", "A = { x ∈ ℝ | x² − 2x &lt; 0 }<span class='tag'>Dado</span>"], ["hyp", "B = { x ∈ ℝ | x² − 3x + 2 ≥ 0 }<span class='tag'>Dado</span>"]]},

{"say": "O que queremos fazer. Definir e calcular cinco conjuntos: a união de A e B, a interseção, A menos B, B menos A, e a diferença simétrica. Lembramos à esquerda as definições com elementos, que vamos usar.", "L": [["goal", "A ∪ B,   A ∩ B,   A ∖ B,   B ∖ A,   A △ B<span class='tag'>Definir e calcular</span>"]], "pin": ["(Def ∪) A ∪ B = { x ∈ ℝ | x ∈ A ou x ∈ B }", "(Def ∩) A ∩ B = { x ∈ ℝ | x ∈ A e x ∈ B }", "(Def ∖) A ∖ B = { x ∈ ℝ | x ∈ A e x ∉ B }", "(Def △) A △ B = (A ∖ B) ∪ (B ∖ A)"]},

{"title": "1) Determinar A", "clear": 1, "say": "Passo um. Primeiro determinamos A e B como intervalos. Começamos com A. Temos que x ao quadrado menos dois x é menor que zero.", "L": [["sub", "x² − 2x &lt; 0<span class='tag'>Desigualdade de A</span>"]]},

{"say": "Pomos x em evidência. Então x ao quadrado menos dois x é igual a x vezes, x menos dois. A desigualdade equivale a que x vezes, x menos dois, é menor que zero.", "L": [["txt", "Fator comum  x :"], ["sub", "x² − 2x &lt; 0  ⟺  x (x − 2) &lt; 0"]]},

{"say": "Um produto é negativo quando os dois fatores têm sinais opostos. Há dois casos. Primeiro caso: x é maior que zero, e x menos dois é menor que zero. Segundo caso: x é menor que zero, e x menos dois é maior que zero.", "L": [["txt", "Produto negativo ⟺ fatores de sinal oposto:"], ["hyp", "Caso 1:  x &gt; 0  e  x − 2 &lt; 0"], ["hyp", "Caso 2:  x &lt; 0  e  x − 2 &gt; 0"]]},

{"say": "No caso um, x é maior que zero, e x é menor que dois. Isso dá o intervalo aberto de zero a dois. No caso dois, x é menor que zero, e x é maior que dois. Isto é impossível, porque nenhum número é ao mesmo tempo menor que zero e maior que dois. Portanto, A é o intervalo aberto de zero a dois.", "L": [["sub", "Caso 1:  0 &lt; x &lt; 2"], ["warn", "Caso 2:  x &lt; 0  e  x &gt; 2   →   impossível"], ["res", "A = (0, 2)"], ["txt", "<svg viewBox='0 0 470 82' width='100%' style='max-width:520px;display:block' xmlns='http://www.w3.org/2000/svg'><text x='0' y='15' fill='#7cc4ff' font-size='15' font-family='Georgia,serif'>A = (0, 2)</text><line x1='30' y1='24' x2='450' y2='24' stroke='#3d5a50' stroke-width='2'/><line x1='170' y1='24' x2='310' y2='24' stroke='#7cc4ff' stroke-width='6'/><circle cx='170' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><circle cx='310' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><line x1='170' y1='48' x2='170' y2='56' stroke='#9fb3aa'/><text x='170' y='72' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>0</text><line x1='240' y1='48' x2='240' y2='56' stroke='#9fb3aa'/><text x='240' y='72' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>1</text><line x1='310' y1='48' x2='310' y2='56' stroke='#9fb3aa'/><text x='310' y='72' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>2</text></svg>"]]},

{"title": "2) Determinar B", "clear": 1, "say": "Agora B. Temos que x ao quadrado menos três x mais dois é maior ou igual a zero.", "L": [["sub", "x² − 3x + 2 ≥ 0<span class='tag'>Desigualdade de B</span>"]]},

{"say": "Fatorizamos o polinómio. As raízes são um e dois, porque um mais dois é três, e um vezes dois é dois. Então x ao quadrado menos três x mais dois é igual a, x menos um, vezes, x menos dois.", "L": [["txt", "Raízes 1 e 2  (soma 3, produto 2):"], ["sub", "x² − 3x + 2 ≥ 0  ⟺  (x − 1)(x − 2) ≥ 0"]]},

{"say": "Um produto é maior ou igual a zero quando os dois fatores são maiores ou iguais a zero, ou os dois são menores ou iguais a zero. Caso um: x menos um é maior ou igual a zero, e x menos dois é maior ou igual a zero. Caso dois: x menos um é menor ou igual a zero, e x menos dois é menor ou igual a zero.", "L": [["txt", "Produto ≥ 0 ⟺ fatores do mesmo sinal (ou algum nulo):"], ["hyp", "Caso 1:  x − 1 ≥ 0  e  x − 2 ≥ 0"], ["hyp", "Caso 2:  x − 1 ≤ 0  e  x − 2 ≤ 0"]]},

{"say": "No caso um, x é maior ou igual a um, e x é maior ou igual a dois. As duas cumprem-se ao mesmo tempo quando x é maior ou igual a dois. No caso dois, x é menor ou igual a um, e x é menor ou igual a dois. As duas cumprem-se ao mesmo tempo quando x é menor ou igual a um. Portanto, B é a união do intervalo de menos infinito a um, fechado em um, com o intervalo de dois a infinito, fechado em dois.", "L": [["sub", "Caso 1:  x ≥ 1  e  x ≥ 2   ⟹   x ≥ 2"], ["sub", "Caso 2:  x ≤ 1  e  x ≤ 2   ⟹   x ≤ 1"], ["res", "B = (−∞, 1] ∪ [2, ∞)"], ["txt", "<svg viewBox='0 0 470 116' width='100%' style='max-width:520px;display:block' xmlns='http://www.w3.org/2000/svg'><text x='0' y='15' fill='#7cc4ff' font-size='15' font-family='Georgia,serif'>A = (0, 2)</text><line x1='30' y1='24' x2='450' y2='24' stroke='#3d5a50' stroke-width='2'/><line x1='170' y1='24' x2='310' y2='24' stroke='#7cc4ff' stroke-width='6'/><circle cx='170' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><circle cx='310' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><text x='0' y='49' fill='#ffd166' font-size='15' font-family='Georgia,serif'>B = (−∞, 1] ∪ [2, ∞)</text><line x1='30' y1='58' x2='450' y2='58' stroke='#3d5a50' stroke-width='2'/><line x1='30' y1='58' x2='240' y2='58' stroke='#ffd166' stroke-width='6'/><polygon points='22,58 32,51 32,65' fill='#ffd166'/><circle cx='240' cy='58' r='7' fill='#ffd166' stroke='#ffd166' stroke-width='3'/><line x1='310' y1='58' x2='450' y2='58' stroke='#ffd166' stroke-width='6'/><polygon points='458,58 448,51 448,65' fill='#ffd166'/><circle cx='310' cy='58' r='7' fill='#ffd166' stroke='#ffd166' stroke-width='3'/><line x1='170' y1='82' x2='170' y2='90' stroke='#9fb3aa'/><text x='170' y='106' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>0</text><line x1='240' y1='82' x2='240' y2='90' stroke='#9fb3aa'/><text x='240' y='106' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>1</text><line x1='310' y1='82' x2='310' y2='90' stroke='#9fb3aa'/><text x='310' y='106' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>2</text></svg>"]]},

{"title": "3) União A ∪ B", "clear": 1, "say": "Passo três. A união. Por definição, A união B é o conjunto dos números reais x tais que x pertence a A, ou x pertence a B.", "L": [["sub", "A ∪ B = { x ∈ ℝ | x ∈ A  ou  x ∈ B }<span class='tag'>Definição de união</span>"]]},

{"say": "Substituímos A e B pelos intervalos que calculámos.", "L": [["txt", "Substituindo A e B:"], ["sub", "A ∪ B = (0, 2) ∪ ( (−∞, 1] ∪ [2, ∞) )"]]},

{"say": "B cobre tudo até um, incluindo o um, e de dois em diante, incluindo o dois. O que falta é o intervalo aberto de um a dois, e esse intervalo está contido em A, porque A é o intervalo de zero a dois. Portanto, cada número real está em A ou em B, e a união é toda a reta real.", "L": [["txt", "Falta  (1, 2)  em B, e  (1, 2) ⊆ (0, 2) = A"], ["res", "A ∪ B = ℝ"], ["txt", "<svg viewBox='0 0 470 150' width='100%' style='max-width:520px;display:block' xmlns='http://www.w3.org/2000/svg'><text x='0' y='15' fill='#7cc4ff' font-size='15' font-family='Georgia,serif'>A = (0, 2)</text><line x1='30' y1='24' x2='450' y2='24' stroke='#3d5a50' stroke-width='2'/><line x1='170' y1='24' x2='310' y2='24' stroke='#7cc4ff' stroke-width='6'/><circle cx='170' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><circle cx='310' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><text x='0' y='49' fill='#ffd166' font-size='15' font-family='Georgia,serif'>B = (−∞, 1] ∪ [2, ∞)</text><line x1='30' y1='58' x2='450' y2='58' stroke='#3d5a50' stroke-width='2'/><line x1='30' y1='58' x2='240' y2='58' stroke='#ffd166' stroke-width='6'/><polygon points='22,58 32,51 32,65' fill='#ffd166'/><circle cx='240' cy='58' r='7' fill='#ffd166' stroke='#ffd166' stroke-width='3'/><line x1='310' y1='58' x2='450' y2='58' stroke='#ffd166' stroke-width='6'/><polygon points='458,58 448,51 448,65' fill='#ffd166'/><circle cx='310' cy='58' r='7' fill='#ffd166' stroke='#ffd166' stroke-width='3'/><text x='0' y='83' fill='#7be0a0' font-size='15' font-family='Georgia,serif'>A ∪ B = ℝ</text><line x1='30' y1='92' x2='450' y2='92' stroke='#3d5a50' stroke-width='2'/><line x1='30' y1='92' x2='450' y2='92' stroke='#7be0a0' stroke-width='6'/><polygon points='22,92 32,85 32,99' fill='#7be0a0'/><polygon points='458,92 448,85 448,99' fill='#7be0a0'/><line x1='170' y1='116' x2='170' y2='124' stroke='#9fb3aa'/><text x='170' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>0</text><line x1='240' y1='116' x2='240' y2='124' stroke='#9fb3aa'/><text x='240' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>1</text><line x1='310' y1='116' x2='310' y2='124' stroke='#9fb3aa'/><text x='310' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>2</text></svg>"]]},

{"title": "4) Interseção A ∩ B", "clear": 1, "say": "Passo quatro. A interseção. Por definição, A interseção B é o conjunto dos números reais x tais que x pertence a A, e x pertence a B.", "L": [["sub", "A ∩ B = { x ∈ ℝ | x ∈ A  e  x ∈ B }<span class='tag'>Definição de interseção</span>"]]},

{"say": "Substituímos. Os valores comuns são os de A, entre zero e dois, que além disso estão em B. Dentro de A, os pontos de B são os menores ou iguais a um; o intervalo de dois em diante não acrescenta nada, porque dois não está em A. Logo a interseção é o intervalo de zero, aberto, a um, fechado.", "L": [["txt", "Substituindo A e B:"], ["sub", "A ∩ B = (0, 2) ∩ ( (−∞, 1] ∪ [2, ∞) )"], ["sub", "Valores comuns:   0 &lt; x ≤ 1"], ["res", "A ∩ B = (0, 1]"], ["txt", "<svg viewBox='0 0 470 150' width='100%' style='max-width:520px;display:block' xmlns='http://www.w3.org/2000/svg'><text x='0' y='15' fill='#7cc4ff' font-size='15' font-family='Georgia,serif'>A = (0, 2)</text><line x1='30' y1='24' x2='450' y2='24' stroke='#3d5a50' stroke-width='2'/><line x1='170' y1='24' x2='310' y2='24' stroke='#7cc4ff' stroke-width='6'/><circle cx='170' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><circle cx='310' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><text x='0' y='49' fill='#ffd166' font-size='15' font-family='Georgia,serif'>B = (−∞, 1] ∪ [2, ∞)</text><line x1='30' y1='58' x2='450' y2='58' stroke='#3d5a50' stroke-width='2'/><line x1='30' y1='58' x2='240' y2='58' stroke='#ffd166' stroke-width='6'/><polygon points='22,58 32,51 32,65' fill='#ffd166'/><circle cx='240' cy='58' r='7' fill='#ffd166' stroke='#ffd166' stroke-width='3'/><line x1='310' y1='58' x2='450' y2='58' stroke='#ffd166' stroke-width='6'/><polygon points='458,58 448,51 448,65' fill='#ffd166'/><circle cx='310' cy='58' r='7' fill='#ffd166' stroke='#ffd166' stroke-width='3'/><text x='0' y='83' fill='#7be0a0' font-size='15' font-family='Georgia,serif'>A ∩ B</text><line x1='30' y1='92' x2='450' y2='92' stroke='#3d5a50' stroke-width='2'/><line x1='170' y1='92' x2='240' y2='92' stroke='#7be0a0' stroke-width='6'/><circle cx='170' cy='92' r='7' fill='#16231f' stroke='#7be0a0' stroke-width='3'/><circle cx='240' cy='92' r='7' fill='#7be0a0' stroke='#7be0a0' stroke-width='3'/><line x1='170' y1='116' x2='170' y2='124' stroke='#9fb3aa'/><text x='170' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>0</text><line x1='240' y1='116' x2='240' y2='124' stroke='#9fb3aa'/><text x='240' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>1</text><line x1='310' y1='116' x2='310' y2='124' stroke='#9fb3aa'/><text x='310' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>2</text></svg>"]]},

{"title": "5) Diferença A ∖ B", "clear": 1, "say": "Passo cinco. A diferença A menos B. Por definição, é o conjunto dos números reais x tais que x pertence a A, e x não pertence a B.", "L": [["sub", "A ∖ B = { x ∈ ℝ | x ∈ A  e  x ∉ B }<span class='tag'>Definição de diferença</span>"]]},

{"say": "Substituímos. Os elementos de A que estão em B são os de zero a um, com o um incluído, e são retirados. Ficam os de A maiores que um. Como A chega até dois, sem o incluir, A menos B é o intervalo aberto de um a dois.", "L": [["txt", "Substituindo A e B:"], ["sub", "A ∖ B = (0, 2) ∖ ( (−∞, 1] ∪ [2, ∞) )"], ["sub", "Retiramos (0, 1]:   1 &lt; x &lt; 2"], ["res", "A ∖ B = (1, 2)"], ["txt", "<svg viewBox='0 0 470 150' width='100%' style='max-width:520px;display:block' xmlns='http://www.w3.org/2000/svg'><text x='0' y='15' fill='#7cc4ff' font-size='15' font-family='Georgia,serif'>A = (0, 2)</text><line x1='30' y1='24' x2='450' y2='24' stroke='#3d5a50' stroke-width='2'/><line x1='170' y1='24' x2='310' y2='24' stroke='#7cc4ff' stroke-width='6'/><circle cx='170' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><circle cx='310' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><text x='0' y='49' fill='#ffd166' font-size='15' font-family='Georgia,serif'>B = (−∞, 1] ∪ [2, ∞)</text><line x1='30' y1='58' x2='450' y2='58' stroke='#3d5a50' stroke-width='2'/><line x1='30' y1='58' x2='240' y2='58' stroke='#ffd166' stroke-width='6'/><polygon points='22,58 32,51 32,65' fill='#ffd166'/><circle cx='240' cy='58' r='7' fill='#ffd166' stroke='#ffd166' stroke-width='3'/><line x1='310' y1='58' x2='450' y2='58' stroke='#ffd166' stroke-width='6'/><polygon points='458,58 448,51 448,65' fill='#ffd166'/><circle cx='310' cy='58' r='7' fill='#ffd166' stroke='#ffd166' stroke-width='3'/><text x='0' y='83' fill='#7be0a0' font-size='15' font-family='Georgia,serif'>A ∖ B</text><line x1='30' y1='92' x2='450' y2='92' stroke='#3d5a50' stroke-width='2'/><line x1='240' y1='92' x2='310' y2='92' stroke='#7be0a0' stroke-width='6'/><circle cx='240' cy='92' r='7' fill='#16231f' stroke='#7be0a0' stroke-width='3'/><circle cx='310' cy='92' r='7' fill='#16231f' stroke='#7be0a0' stroke-width='3'/><line x1='170' y1='116' x2='170' y2='124' stroke='#9fb3aa'/><text x='170' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>0</text><line x1='240' y1='116' x2='240' y2='124' stroke='#9fb3aa'/><text x='240' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>1</text><line x1='310' y1='116' x2='310' y2='124' stroke='#9fb3aa'/><text x='310' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>2</text></svg>"]]},

{"title": "6) Diferença B ∖ A", "clear": 1, "say": "Passo seis. A diferença B menos A. Por definição, é o conjunto dos números reais x tais que x pertence a B, e x não pertence a A.", "L": [["sub", "B ∖ A = { x ∈ ℝ | x ∈ B  e  x ∉ A }<span class='tag'>Definição de diferença</span>"]]},

0a0' stroke-width='6'/><polygon points='22,92 32,85 32,99' fill='#7be0a0'/><circle cx='170' cy='92' r='7' fill='#7be0a0' stroke='#7be0a0' stroke-width='3'/><line x1='310' y1='92' x2='450' y2='92' stroke='#7be0a0' stroke-width='6'/><polygon points='458,92 448,85 448,99' fill='#7be0a0'/><circle cx='310' cy='92' r='7' fill='#7be0a0' stroke='#7be0a0' stroke-width='3'/><line x1='170' y1='116' x2='170' y2='124' stroke='#9fb3aa'/><text x='170' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>0</text><line x1='240' y1='116' x2='240' y2='124' stroke='#9fb3aa'/><text x='240' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>1</text><line x1='310' y1='116' x2='310' y2='124' stroke='#9fb3aa'/><text x='310' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>2</text></svg>"]]},

{"title": "7) Diferença simétrica A △ B", "clear": 1, "say": "Passo sete. A diferença simétrica. Por definição, A diferença simétrica B é a união de A menos B, com B menos A.", "L": [["sub", "A △ B = (A ∖ B) ∪ (B ∖ A)<span class='tag'>Definição de diferença simétrica</span>"]]},

{"say": "Agora unimos. O dois pertence ao intervalo fechado de dois a infinito, por isso o intervalo aberto de um a dois e o intervalo de dois a infinito juntam-se no intervalo aberto de um a infinito. Portanto, a diferença simétrica é a união do intervalo de menos infinito a zero, fechado, com o intervalo aberto de um a infinito.", "L": [["txt", "(1, 2) ∪ [2, ∞) = (1, ∞)   porque  2 ∈ [2, ∞)"], ["res", "A △ B = (−∞, 0] ∪ (1, ∞)"], ["txt", "<svg viewBox='0 0 470 150' width='100%' style='max-width:520px;display:block' xmlns='http://www.w3.org/2000/svg'><text x='0' y='15' fill='#7cc4ff' font-size='15' font-family='Georgia,serif'>A = (0, 2)</text><line x1='30' y1='24' x2='450' y2='24' stroke='#3d5a50' stroke-width='2'/><line x1='170' y1='24' x2='310' y2='24' stroke='#7cc4ff' stroke-width='6'/><circle cx='170' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><circle cx='310' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><text x='0' y='49' fill='#ffd166' font-size='15' font-family='Georgia,serif'>B = (−∞, 1] ∪ [2, ∞)</text><line x1='30' y1='58' x2='450' y2='58' stroke='#3d5a50' stroke-width='2'/><line x1='30' y1='58' x2='240' y2='58' stroke='#ffd166' stroke-width='6'/><polygon points='22,58 32,51 32,65' fill='#ffd166'/><circle cx='240' cy='58' r='7' fill='#ffd166' stroke='#ffd166' stroke-width='3'/><line x1='310' y1='58' x2='450' y2='58' stroke='#ffd166' stroke-width='6'/><polygon points='458,58 448,51 448,65' fill='#ffd166'/><circle cx='310' cy='58' r='7' fill='#ffd166' stroke='#ffd166' stroke-width='3'/><text x='0' y='83' fill='#7be0a0' font-size='15' font-family='Georgia,serif'>A △ B</text><line x1='30' y1='92' x2='450' y2='92' stroke='#3d5a50' stroke-width='2'/><line x1='30' y1='92' x2='170' y2='92' stroke='#7be0a0' stroke-width='6'/><polygon points='22,92 32,85 32,99' fill='#7be0a0'/><circle cx='170' cy='92' r='7' fill='#7be0a0' stroke='#7be0a0' stroke-width='3'/><line x1='240' y1='92' x2='450' y2='92' stroke='#7be0a0' stroke-width='6'/><polygon points='458,92 448,85 448,99' fill='#7be0a0'/><circle cx='240' cy='92' r='7' fill='#16231f' stroke='#7be0a0' stroke-width='3'/><line x1='170' y1='116' x2='170' y2='124' stroke='#9fb3aa'/><text x='170' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>0</text><line x1='240' y1='116' x2='240' y2='124' stroke='#9fb3aa'/><text x='240' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>1</text><line x1='310' y1='116' x2='310' y2='124' stroke='#9fb3aa'/><text x='310' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>2</text></svg>"]]},

<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' mais ').replace(/⊙/g,' vezes ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Repetir'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Continuar'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pausa';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pausa';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pausa';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^pt/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/antonio|antônio|donato|fabio|duarte|male|google português$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Conjuntos e desigualdades";$('sub').textContent="Exercício · Álgebra de conjuntos";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
