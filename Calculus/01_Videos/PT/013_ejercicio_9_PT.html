<!DOCTYPE html>
<html lang="pt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leis de De Morgan</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}

#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>Lembre-se</h2><div id="pins"></div></div><div id="board"></div></div>

<script type="application/json" id="data">
{"lang":"pt-BR",
"meta":{"nivel": 3, "titulo": "Leis de De Morgan", "enunciado": "Seja (B, ⊕, ⊙, ∼) uma álgebra de Boole.  Provar que, para quaisquer a, b ∈ B, valem as leis de De Morgan:", "tesis": "∼(a ⊕ b) = ∼a ⊙ ∼b,   ∼(a ⊙ b) = ∼a ⊕ ∼b", "datos": ["(Dist)  x ⊕ (y ⊙ z) = (x ⊕ y) ⊙ (x ⊕ z),   x ⊙ (y ⊕ z) = (x ⊙ y) ⊕ (x ⊙ z)", "(Compl)  x ⊕ ∼x = 1,   x ⊙ ∼x = 0", "(Dom)  x ⊕ 1 = 1,   x ⊙ 0 = 0", "(Unic)  x ⊕ y = 1 e x ⊙ y = 0 ⇒ y = ∼x"]},
"steps":[
{"title": "Leis de De Morgan", "sub": "Exercício · Álgebra de Boole", "clear": 1, "say": "Olá. Neste vídeo vamos resolver um exercício sobre álgebras de Boole. Vamos bem devagar, escrevendo cada equação e justificando cada passo.", "L": [["txt", "As leis de De Morgan"]]},

{"say": "Primeiro, os dados. B é um conjunto com duas operações, a soma e o produto, e uma operação complementar, que escrevemos com um til. É uma álgebra de Boole: um reticulado distributivo com elemento mínimo zero, elemento máximo um, e um complementar para cada elemento. O exemplo típico são as partes de um conjunto U, com a união, a interseção e o complementar de conjuntos.", "L": [["hyp", "(B, ⊕, ⊙, ∼) álgebra de Boole<span class='tag'>Hipótese</span>"], ["txt", "Com conjuntos:  (𝒫(U), ∪, ∩, complementar),   0 = ∅,   1 = U"]]},

{"say": "Vamos usar muitas propriedades, por isso deixamos todas anotadas à esquerda. Primeiro, a comutatividade e a associatividade da soma e do produto.", "pin": ["(Comut ⊕) x ⊕ y = y ⊕ x", "(Comut ⊙) x ⊙ y = y ⊙ x", "(Assoc ⊕) x ⊕ (y ⊕ z) = (x ⊕ y) ⊕ z", "(Assoc ⊙) x ⊙ (y ⊙ z) = (x ⊙ y) ⊙ z"]},

{"say": "Segundo, a distributividade. Um reticulado distributivo cumpre que cada operação distribui em relação à outra. As duas primeiras fórmulas são as da definição. As outras duas são as mesmas com os fatores trocados, e obtêm-se aplicando a comutatividade.", "pin": ["(Dist 1) x ⊕ (y ⊙ z) = (x ⊕ y) ⊙ (x ⊕ z)", "(Dist 2) x ⊙ (y ⊕ z) = (x ⊙ y) ⊕ (x ⊙ z)", "(Dist 3) (x ⊕ y) ⊙ z = (x ⊙ z) ⊕ (y ⊙ z)", "(Dist 4) (x ⊙ y) ⊕ z = (x ⊕ z) ⊙ (y ⊕ z)"]},

{"say": "Terceiro, os elementos neutros e os complementares. Zero é neutro da soma, e um é neutro do produto. E a definição de complementar: x mais o seu complementar é um, e x vezes o seu complementar é zero. As igualdades com os termos trocados saem da comutatividade.", "pin": ["(Neutro ⊕) x ⊕ 0 = x = 0 ⊕ x", "(Neutro ⊙) x ⊙ 1 = x = 1 ⊙ x", "(Compl) x ⊕ ∼x = 1,   x ⊙ ∼x = 0"]},

{"say": "E quarto, dois teoremas conhecidos das álgebras de Boole. As leis de dominação: x mais um é um, e x vezes zero é zero, também com os termos trocados. E a unicidade do complementar: se x mais y é um, e x vezes y é zero, então y é o complementar de x.", "pin": ["(Dom) x ⊕ 1 = 1 = 1 ⊕ x", "(Dom) x ⊙ 0 = 0 = 0 ⊙ x", "(Unic) x ⊕ y = 1 e x ⊙ y = 0 ⇒ y = ∼x"]},

{"say": "O que queremos provar. Para quaisquer a e b de B, o complementar de a mais b é igual ao complementar de a, vezes o complementar de b. E o complementar de a vezes b é igual ao complementar de a, mais o complementar de b. São as leis de De Morgan. Com conjuntos: o complementar de A união B é o complementar de A interseção o complementar de B. E o complementar de A interseção B é o complementar de A união o complementar de B.", "L": [["goal", "∀ a, b ∈ B:   ∼(a ⊕ b) = ∼a ⊙ ∼b<span class='tag'>Tese (1)</span>"], ["goal", "∼(a ⊙ b) = ∼a ⊕ ∼b<span class='tag'>Tese (2)</span>"], ["txt", "Com conjuntos:  (A ∪ B)<sup>c</sup> = A<sup>c</sup> ∩ B<sup>c</sup>"], ["txt", "Com conjuntos:  (A ∩ B)<sup>c</sup> = A<sup>c</sup> ∪ B<sup>c</sup>"]]},

{"title": "Parte 1: ∼(a ⊕ b) = ∼a ⊙ ∼b", "clear": 1, "say": "Começamos pela primeira lei. Sejam a e b dois elementos quaisquer de B. Basta provar que o complementar de a vezes o complementar de b é o complementar de a mais b. Pela unicidade do complementar, isto significa verificar duas condições.", "L": [["txt", "Sejam a, b ∈ B  (arbitrários)"], ["sub", "x = a ⊕ b,   y = ∼a ⊙ ∼b<span class='tag'>Escolha em (Unic)</span>"]]},

{"say": "Ou seja, basta provar duas igualdades. Primeira: a mais b, mais, o complementar de a vezes o complementar de b, é igual a um. Segunda: a mais b, vezes, o complementar de a vezes o complementar de b, é igual a zero.", "L": [["goal", "(i)   (a ⊕ b) ⊕ (∼a ⊙ ∼b) = 1"], ["goal", "(ii)  (a ⊕ b) ⊙ (∼a ⊙ ∼b) = 0<span class='tag'>Nova tese</span>"]]},

{"title": "Condição (i)", "clear": 1, "say": "Primeira condição. Queremos provar que a mais b, mais, o complementar de a vezes o complementar de b, é igual a um. Partimos do lado esquerdo e transformamo-lo passo a passo.", "L": [["goal", "Queremos:  (a ⊕ b) ⊕ (∼a ⊙ ∼b) = 1"], ["txt", "(a ⊕ b) ⊕ (∼a ⊙ ∼b)"]]},

{"say": "Primeiro passo. Aplicamos a distributividade da soma em relação ao produto, com x igual a a mais b, y igual ao complementar de a, e z igual ao complementar de b. Obtemos um produto de dois fatores: a mais b, mais o complementar de a, vezes, a mais b, mais o complementar de b.", "L": [["sub", "= ((a ⊕ b) ⊕ ∼a) ⊙ ((a ⊕ b) ⊕ ∼b)<span class='tag'>Distributividade: x ⊕ (y ⊙ z) = (x ⊕ y) ⊙ (x ⊕ z)</span>"]]},

{"say": "Segundo passo. Reorganizamos cada fator com a associatividade e a comutatividade da soma, para que cada elemento fique junto do seu complementar. No primeiro fator, a mais b, mais o complementar de a, passa a a mais o seu complementar, mais b. No segundo fator, a mais b, mais o complementar de b, passa a a mais, b mais o seu complementar.", "L": [["sub", "= ((a ⊕ ∼a) ⊕ b) ⊙ (a ⊕ (b ⊕ ∼b))<span class='tag'>Associatividade e comutatividade de ⊕</span>"]]},

{"say": "Terceiro passo. Pela definição de complementar, a mais o seu complementar é um, e b mais o seu complementar é um.", "L": [["sub", "= (1 ⊕ b) ⊙ (a ⊕ 1)<span class='tag'>Complementar: a ⊕ ∼a = 1,  b ⊕ ∼b = 1</span>"]]},

{"say": "Quarto passo. Pela lei de dominação, um mais b é um, e a mais um é um.", "L": [["sub", "= 1 ⊙ 1<span class='tag'>Dominação: 1 ⊕ b = 1,  a ⊕ 1 = 1</span>"]]},

{"say": "Quinto passo. Um é o neutro do produto, então um vezes um é um. Com isto termina a primeira condição.", "L": [["res", "= 1   ∎<span class='tag'>Neutro de ⊙</span>"]]},

{"title": "Condição (ii)", "clear": 1, "say": "Segunda condição. Queremos provar que a mais b, vezes, o complementar de a vezes o complementar de b, é igual a zero. Partimos do lado esquerdo.", "L": [["goal", "Queremos:  (a ⊕ b) ⊙ (∼a ⊙ ∼b) = 0"], ["txt", "(a ⊕ b) ⊙ (∼a ⊙ ∼b)"]]},

{"say": "Primeiro passo. Associatividade do produto, com x igual a a mais b, y igual ao complementar de a, e z igual ao complementar de b.", "L": [["sub", "= ((a ⊕ b) ⊙ ∼a) ⊙ ∼b<span class='tag'>Associatividade de ⊙</span>"]]},

{"say": "Segundo passo. Distributividade do produto em relação à soma, no parêntese interior, com x igual a a, y igual a b, e z igual ao complementar de a. A mais b, vezes o complementar de a, passa a a vezes o seu complementar, mais, b vezes o complementar de a.", "L": [["sub", "= ((a ⊙ ∼a) ⊕ (b ⊙ ∼a)) ⊙ ∼b<span class='tag'>Distributividade: (x ⊕ y) ⊙ z = (x ⊙ z) ⊕ (y ⊙ z)</span>"]]},

{"say": "Terceiro passo. Pela definição de complementar, a vezes o seu complementar é zero.", "L": [["sub", "= (0 ⊕ (b ⊙ ∼a)) ⊙ ∼b<span class='tag'>Complementar: a ⊙ ∼a = 0</span>"]]},

{"say": "Quarto passo. Zero é o neutro da soma: zero mais x é x. Portanto, zero mais, b vezes o complementar de a, é b vezes o complementar de a.", "L": [["sub", "= (b ⊙ ∼a) ⊙ ∼b<span class='tag'>Neutro de ⊕: 0 ⊕ x = x</span>"]]},

{"say": "Quinto passo. Usamos a associatividade e a comutatividade do produto. Partimos de b vezes o complementar de a, tudo vezes o complementar de b. Reordenamos os fatores para que b fique junto do seu complementar, e obtemos b vezes, o complementar de b vezes o complementar de a.", "L": [["sub", "= b ⊙ (∼b ⊙ ∼a)<span class='tag'>Comutatividade e associatividade de ⊙</span>"]]},

{"say": "Sexto passo. Associatividade do produto, com x igual a b, y igual ao complementar de b, e z igual ao complementar de a. Passamos de b vezes, o complementar de b vezes o complementar de a, para, b vezes o seu complementar, tudo vezes o complementar de a.", "L": [["sub", "= (b ⊙ ∼b) ⊙ ∼a<span class='tag'>Associatividade de ⊙</span>"]]},

{"say": "Sétimo passo. Pela definição de complementar, b vezes o seu complementar é zero.", "L": [["sub", "= 0 ⊙ ∼a<span class='tag'>Complementar: b ⊙ ∼b = 0</span>"]]},

{"say": "Oitavo passo. Pela lei de dominação, zero vezes x é zero. Com isto termina a segunda condição.", "L": [["res", "= 0   ∎<span class='tag'>Dominação: 0 ⊙ x = 0</span>"]]},

{"title": "Conclusão da parte 1", "clear": 1, "say": "Como o complementar de a vezes o complementar de b cumpre as duas condições, é o complementar de a mais b. E pela unicidade do complementar num reticulado distributivo, concluímos a primeira lei de De Morgan. Com conjuntos: o complementar de A união B é o complementar de A interseção o complementar de B.", "L": [["res", "∼a ⊙ ∼b é o complementar de a ⊕ b"], ["res", "∼(a ⊕ b) = ∼a ⊙ ∼b   ∎<span class='tag'>Unicidade do complementar</span>"], ["txt", "Com conjuntos:  (A ∪ B)<sup>c</sup> = A<sup>c</sup> ∩ B<sup>c</sup>"]]},

{"title": "Parte 2: ∼(a ⊙ b) = ∼a ⊕ ∼b", "clear": 1, "say": "Passamos à segunda lei. Sejam a e b dois elementos quaisquer de B. De novo, basta provar que o complementar de a mais o complementar de b é o complementar de a vezes b. Pela unicidade do complementar, isto significa verificar duas condições.", "L": [["txt", "Sejam a, b ∈ B  (arbitrários)"], ["sub", "x = a ⊙ b,   y = ∼a ⊕ ∼b<span class='tag'>Escolha em (Unic)</span>"]]},

{"say": "Ou seja, basta provar duas igualdades. Primeira: a vezes b, mais, o complementar de a mais o complementar de b, é igual a um. Segunda: a vezes b, vezes, o complementar de a mais o complementar de b, é igual a zero.", "L": [["goal", "(i)   (a ⊙ b) ⊕ (∼a ⊕ ∼b) = 1"], ["goal", "(ii)  (a ⊙ b) ⊙ (∼a ⊕ ∼b) = 0<span class='tag'>Nova tese</span>"]]},

{"title": "Condição (i)", "clear": 1, "say": "Primeira condição. Queremos provar que a vezes b, mais, o complementar de a mais o complementar de b, é igual a um. Partimos do lado esquerdo.", "L": [["goal", "Queremos:  (a ⊙ b) ⊕ (∼a ⊕ ∼b) = 1"], ["txt", "(a ⊙ b) ⊕ (∼a ⊕ ∼b)"]]},

{"say": "Primeiro passo. Associatividade da soma, com x igual a a vezes b, y igual ao complementar de a, e z igual ao complementar de b.", "L": [["sub", "= ((a ⊙ b) ⊕ ∼a) ⊕ ∼b<span class='tag'>Associatividade de ⊕</span>"]]},

{"say": "Segundo passo. Distributividade da soma em relação ao produto, no parêntese interior, com x igual a a, y igual a b, e z igual ao complementar de a. A vezes b, mais o complementar de a, passa a a mais o seu complementar, vezes, b mais o complementar de a.", "L": [["sub", "= ((a ⊕ ∼a) ⊙ (b ⊕ ∼a)) ⊕ ∼b<span class='tag'>Distributividade: (x ⊙ y) ⊕ z = (x ⊕ z) ⊙ (y ⊕ z)</span>"]]},

{"say": "Terceiro passo. Pela definição de complementar, a mais o seu complementar é um.", "L": [["sub", "= (1 ⊙ (b ⊕ ∼a)) ⊕ ∼b<span class='tag'>Complementar: a ⊕ ∼a = 1</span>"]]},

{"say": "Quarto passo. Um é o neutro do produto: um vezes x é x. Portanto, um vezes, b mais o complementar de a, é b mais o complementar de a.", "L": [["sub", "= (b ⊕ ∼a) ⊕ ∼b<span class='tag'>Neutro de ⊙: 1 ⊙ x = x</span>"]]},

{"say": "Quinto passo. Com a comutatividade e a associatividade da soma, juntamos b com o seu complementar. Primeiro comutamos b com o complementar de a, e depois associamos. O resultado é o complementar de a mais, b mais o seu complementar.", "L": [["sub", "= ∼a ⊕ (b ⊕ ∼b)<span class='tag'>Comutatividade e associatividade de ⊕</span>"]]},

{"say": "Sexto passo. Pela definição de complementar, b mais o seu complementar é um.", "L": [["sub", "= ∼a ⊕ 1<span class='tag'>Complementar: b ⊕ ∼b = 1</span>"]]},

{"say": "Sétimo passo. Pela lei de dominação, x mais um é um. Com isto termina a primeira condição.", "L": [["res", "= 1   ∎<span class='tag'>Dominação: x ⊕ 1 = 1</span>"]]},

{"title": "Condição (ii)", "clear": 1, "say": "Segunda condição. Queremos provar que a vezes b, vezes, o complementar de a mais o complementar de b, é igual a zero. Partimos do lado esquerdo.", "L": [["goal", "Queremos:  (a ⊙ b) ⊙ (∼a ⊕ ∼b) = 0"], ["txt", "(a ⊙ b) ⊙ (∼a ⊕ ∼b)"]]},

{"say": "Primeiro passo. Distributividade do produto em relação à soma, com x igual a a vezes b, y igual ao complementar de a, e z igual ao complementar de b. Obtemos uma soma de dois termos: a vezes b, vezes o complementar de a, mais, a vezes b, vezes o complementar de b.", "L": [["sub", "= ((a ⊙ b) ⊙ ∼a) ⊕ ((a ⊙ b) ⊙ ∼b)<span class='tag'>Distributividade: x ⊙ (y ⊕ z) = (x ⊙ y) ⊕ (x ⊙ z)</span>"]]},

{"say": "Segundo passo. Reorganizamos cada termo com a associatividade e a comutatividade do produto, para que cada elemento fique junto do seu complementar. No primeiro termo, a vezes b, vezes o complementar de a, passa a a vezes o seu complementar, vezes b. No segundo, a vezes b, vezes o complementar de b, passa a a vezes, b vezes o seu complementar.", "L": [["sub", "= ((a ⊙ ∼a) ⊙ b) ⊕ (a ⊙ (b ⊙ ∼b))<span class='tag'>Associatividade e comutatividade de ⊙</span>"]]},

{"say": "Terceiro passo. Pela definição de complementar, a vezes o seu complementar é zero, e b vezes o seu complementar é zero.", "L": [["sub", "= (0 ⊙ b) ⊕ (a ⊙ 0)<span class='tag'>Complementar: a ⊙ ∼a = 0,  b ⊙ ∼b = 0</span>"]]},

{"say": "Quarto passo. Pela lei de dominação, zero vezes b é zero, e a vezes zero é zero.", "L": [["sub", "= 0 ⊕ 0<span class='tag'>Dominação: 0 ⊙ b = 0,  a ⊙ 0 = 0</span>"]]},

{"say": "Quinto passo. Zero é o neutro da soma, e também se pode ver como idempotência da soma: zero mais zero é zero. Com isto termina a segunda condição.", "L": [["res", "= 0   ∎<span class='tag'>Idempotência / neutro de ⊕</span>"]]},

{"title": "Conclusão da parte 2", "clear": 1, "say": "Como o complementar de a mais o complementar de b cumpre as duas condições, é o complementar de a vezes b. E pela unicidade do complementar, concluímos a segunda lei de De Morgan. Com conjuntos: o complementar de A interseção B é o complementar de A união o complementar de B.", "L": [["res", "∼a ⊕ ∼b é o complementar de a ⊙ b"], ["res", "∼(a ⊙ b) = ∼a ⊕ ∼b   ∎<span class='tag'>Unicidade do complementar</span>"], ["txt", "Com conjuntos:  (A ∩ B)<sup>c</sup> = A<sup>c</sup> ∪ B<sup>c</sup>"]]},

{"title": "Resumo", "clear": 1, "say": "Resumindo. Nas duas leis, a unicidade do complementar permite-nos não calcular o complementar diretamente, mas verificar as duas condições. Em cada uma usamos a distributividade, agrupamos cada elemento com o seu complementar, e aplicamos neutros e dominação. Com conjuntos: o complementar da união é a interseção dos complementares, e o complementar da interseção é a união dos complementares. Obrigado por assistir.", "L": [["res", "∼(a ⊕ b) = ∼a ⊙ ∼b"], ["res", "∼(a ⊙ b) = ∼a ⊕ ∼b"], ["txt", "Com conjuntos:  (A ∪ B)<sup>c</sup> = A<sup>c</sup> ∩ B<sup>c</sup>,   (A ∩ B)<sup>c</sup> = A<sup>c</sup> ∪ B<sup>c</sup>"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' mais ').replace(/⊙/g,' vezes ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Repetir'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Continuar'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pausa';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pausa';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pausa';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^pt/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/antonio|antônio|donato|fabio|duarte|male|google português$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Leis de De Morgan";$('sub').textContent="Exercício · Álgebra de Boole";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
