<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reticulados: idempotência de ⊕ e ⊙</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--mut:#9fb3aa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#16231f}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3.2vw,40px);margin:12px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(16px,2.2vw,28px)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t">Reticulados algébricos: idempotência</h1><div id="sub">Cálculo · Exercício 1</div>
<div id="main"><div id="pin" class="pin"><h2>Hipóteses</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Começar</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Velocidade <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Modo gravação (H)</button><span id="cap"></span></div></div>
<script>
const A='a ⊕ a = a', S=(c,t)=>({c,t});
const meta={nivel:2,titulo:'Reticulados algébricos: idempotência',
 enunciado:'Seja (B, ⊕, ⊙) um reticulado. Demonstrar a idempotência de ⊕ e de ⊙:',
 tesis:'∀a∈B:   a ⊕ a = a,   a ⊙ a = a',
 datos:['(Abs1)  x ⊕ (x ⊙ y) = x','(Abs2)  x ⊙ (x ⊕ y) = x']};
const steps=[
{title:'Reticulados algébricos: idempotência',sub:'Exercício 1',clear:1,say:'Olá. Neste vídeo vamos resolver um exercício sobre reticulados algébricos. Vamos bem devagar, escrevendo cada equação e justificando cada passo.',L:[S('txt','Demonstrar a idempotência de ⊕ e de ⊙')]},
{say:'Primeiro, os dados. B é um conjunto com duas operações, a soma reticular e o produto reticular. Ambas são internas: se operarmos dois elementos de B, o resultado continua em B.',L:[S('hyp','(B, ⊕, ⊙) reticulado<span class="tag">Hipótese</span>'),S('hyp','⊕, ⊙ internas: x ⊕ y ∈ B,  x ⊙ y ∈ B<span class="tag">Hipótese</span>')]},
{say:'Além disso, são comutativas e associativas. Mas atenção: em toda a demonstração não vamos precisar delas. Usaremos apenas as leis de absorção.',L:[S('hyp','⊕, ⊙ comutativas e associativas<span class="tag">Hipótese (não será usada)</span>')]},
{say:'Aqui temos a primeira lei de absorção, Abs1. Ela diz que, para quaisquer x e y de B, x ⊕ (x ⊙ y) é igual a x. Vamos deixá-la fixada à esquerda, porque é uma hipótese que vamos usar.',pin:'(Abs1) x ⊕ (x ⊙ y) = x   ∀x,y∈B'},
{say:'E a segunda, Abs2: x ⊙ (x ⊕ y) é igual a x, também para todos x e y. É a mesma ideia com as operações trocadas.',pin:'(Abs2) x ⊙ (x ⊕ y) = x   ∀x,y∈B'},
{say:'O que queremos demonstrar: para todo elemento a de B, a ⊕ a é igual a a, e a ⊙ a é igual a a. Ou seja, operar um elemento consigo mesmo não o altera. Isso se chama idempotência.',L:[S('goal','Demonstrar: ∀a∈B, a ⊕ a = a  e  a ⊙ a = a<span class="tag">Tese</span>')]},
{title:'Parte 1: idempotência de ⊕',clear:1,say:'Começamos pela idempotência da soma. Tomamos um elemento a qualquer de B. Como ele é arbitrário, o que demonstrarmos valerá para todos.',L:[S('txt','Seja a ∈ B  (arbitrário)'),S('goal','Queremos: a ⊕ a = a<span class="tag">Tese</span>')]},
{say:'Começamos com Abs2. Lembremos: x ⊙ (x ⊕ y) = x, e isso vale para todos x e y de B.',L:[S('hyp','(Abs2)  x ⊙ (x ⊕ y) = x<span class="tag">Hipótese</span>')]},
{say:'Como Abs2 vale para quaisquer x e y, em particular vale escolhendo x igual a a, e y igual a a. Isso é legítimo, porque a pertence a B.',L:[S('sub','x = a,   y = a<span class="tag">Escolha</span>')]},
{say:'Substituímos. Onde havia um x escrevemos a, e onde havia um y escrevemos a. À esquerda fica a ⊙ (a ⊕ a), e à direita, x se torna a. Chamamos essa igualdade de equação um.',L:[S('sub','a ⊙ (a ⊕ a) = a      (1)<span class="tag">Abs2 com x=a, y=a</span>')]},
{say:'Repare que já aparece a ⊕ a, a expressão que queremos simplificar. Mas ainda precisamos eliminar esse produto de fora. Para isso usaremos Abs1.',L:[S('hyp','(Abs1)  x ⊕ (x ⊙ y) = x<span class="tag">Hipótese</span>')]},
{say:'Agora escolhemos x igual a a, mas desta vez y igual a a ⊕ a. Isso é legítimo? Sim: como a soma é uma operação interna, a ⊕ a pertence a B, então pode fazer o papel de y.',L:[S('sub','x = a,   y = a ⊕ a  ∈ B<span class="tag">Escolha (⊕ interna)</span>')]},
{say:'Substituímos em Abs1. O x passa a ser a. E o y passa a ser o parêntese a ⊕ a. Obtemos a ⊕ (a ⊙ (a ⊕ a)) igual a a. É a equação dois.',L:[S('sub','a ⊕ ( a ⊙ (a ⊕ a) ) = a      (2)<span class="tag">Abs1 com x=a, y=a⊕a</span>')]},
{say:'Agora vem o passo-chave. Olhe dentro do parêntese da equação dois: aparece exatamente a ⊙ (a ⊕ a). Pela equação um, essa expressão vale a. Vamos destacá-la.',L:[S('sub','a ⊕ ( <mark>a ⊙ (a ⊕ a)</mark> ) = a      (2)'),S('txt','Por (1):  <mark>a ⊙ (a ⊕ a)</mark> = a')]},
{say:'Substituímos esse bloco por a. A equação dois fica: a ⊕ a igual a a.',L:[S('sub','a ⊕ ( <mark>a</mark> ) = a'),S('res','a ⊕ a = a   ∎<span class="tag">Conclusão: ⊕ é idempotente</span>')]},
{say:'Como a era arbitrário, isso vale para todo a de B. Já temos a idempotência da soma.',L:[S('res','∀a∈B:  a ⊕ a = a')]},
{title:'Parte 2: idempotência de ⊙',clear:1,say:'Agora a idempotência do produto. A ideia é a mesma, mas trocando os papéis de Abs1 e Abs2. Tomamos novamente a arbitrário em B.',L:[S('txt','Seja a ∈ B  (arbitrário)'),S('goal','Queremos: a ⊙ a = a<span class="tag">Tese</span>')]},
{say:'Desta vez começamos por Abs1: x ⊕ (x ⊙ y) = x.',L:[S('hyp','(Abs1)  x ⊕ (x ⊙ y) = x<span class="tag">Hipótese</span>')]},
{say:'Escolhemos x igual a a, e y igual a a. Vale para todos x e y, então em particular para estes.',L:[S('sub','x = a,   y = a<span class="tag">Escolha</span>')]},
{say:'Substituindo: a ⊕ (a ⊙ a) é igual a a. É a equação três. Agora aparece a ⊙ a, que é o que queremos simplificar.',L:[S('sub','a ⊕ (a ⊙ a) = a      (3)<span class="tag">Abs1 com x=a, y=a</span>')]},
{say:'Agora usamos Abs2: x ⊙ (x ⊕ y) = x.',L:[S('hyp','(Abs2)  x ⊙ (x ⊕ y) = x<span class="tag">Hipótese</span>')]},
{say:'Escolhemos x igual a a, e y igual a a ⊙ a. É legítimo porque o produto é uma operação interna, e portanto a ⊙ a está em B.',L:[S('sub','x = a,   y = a ⊙ a  ∈ B<span class="tag">Escolha (⊙ interna)</span>')]},
{say:'Substituímos: a ⊙ (a ⊕ (a ⊙ a)) é igual a a. É a equação quatro.',L:[S('sub','a ⊙ ( a ⊕ (a ⊙ a) ) = a      (4)<span class="tag">Abs2 com x=a, y=a⊙a</span>')]},
{say:'Observe o parêntese interno da equação quatro: é a ⊕ (a ⊙ a). Pela equação três, ele vale a.',L:[S('sub','a ⊙ ( <mark>a ⊕ (a ⊙ a)</mark> ) = a      (4)'),S('txt','Por (3):  <mark>a ⊕ (a ⊙ a)</mark> = a')]},
{say:'Substituindo esse bloco por a, a equação quatro fica: a ⊙ a igual a a.',L:[S('sub','a ⊙ ( <mark>a</mark> ) = a'),S('res','a ⊙ a = a   ∎<span class="tag">Conclusão: ⊙ é idempotente</span>')]},
{title:'Resumo',clear:1,say:'Resumindo. Apenas com as duas leis de absorção, e usando que as operações são internas, demonstramos que para todo a de B, a ⊕ a é a, e a ⊙ a é a. Seguimos o mesmo padrão: aplicar uma absorção com x e y iguais a a, aplicar a outra com y igual ao resultado, e substituir. Obrigado por assistir ao vídeo.',L:[S('res','∀a∈B:  a ⊕ a = a'),S('res','∀a∈B:  a ⊙ a = a')]}
];
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l.c;d.innerHTML=l.t;if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){const d=document.createElement('div');d.className='l hyp';d.textContent=s.pin;if(k<n)d.style.animation='none';pins.appendChild(d)}}
 board.scrollTop=board.scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();txt=txt.replace(/⊕/g,' mais ').replace(/⊙/g,' vezes ').replace(/[()]/g,', ').replace(/\s+/g,' ');const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang='pt-BR';
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Repetir'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Continuar'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pausar';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pausar';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pausar';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^pt/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/antonio|duarte|daniel|male|google português do brasil$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
document.body.addEventListener('click',()=>{},{once:true});
render(-1);$('cap').textContent='0 / '+steps.length;
</script></body></html>
