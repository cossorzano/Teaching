<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La droite réelle achevée</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>À retenir</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Commencer</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Vitesse <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Mode enregistrement (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"fr-FR",
"meta":{"nivel": 0, "titulo": "La droite réelle achevée", "enunciado": "Résumé : définition, ordre, bornes supérieures et inférieures, et opérations sur la droite réelle achevée", "datos": ["Définition", "Ordre", "Borne supérieure et borne inférieure", "Opérations définies", "Opérations non définies", "Ce n'est pas un corps"]},
"steps":[
{"title": "La droite réelle achevée", "sub": "Résumé : définition, ordre, bornes supérieures et inférieures, et opérations sur la droite réelle achevée", "clear": 1, "say": "Bonjour. Dans cette vidéo, nous résumons la droite réelle achevée : comment on la définit, comment on l'ordonne, ce qui se passe avec les bornes supérieures et inférieures, et quelles opérations on peut faire avec plus et moins l'infini.", "L": [["txt", "La droite réelle achevée  <span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span>"]]},

{"title": "1) Définition", "clear": 1, "say": "La droite réelle achevée s'obtient en ajoutant aux nombres réels les deux symboles moins l'infini et plus l'infini. On la note avec une barre au-dessus du R majuscule à double barre des réels.", "L": [["goal", "<span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span> = ℝ ∪ { −∞, +∞ }"]], "pin": ["Définition : <span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span> = ℝ ∪ {−∞, +∞}"]},

{"title": "2) Ordre", "clear": 1, "say": "D'abord, l'ordre. L'ordre de la droite réelle achevée prolonge celui des nombres réels. Pour tout x réel, moins l'infini est inférieur ou égal à x, et x est inférieur ou égal à plus l'infini. Et moins l'infini est strictement inférieur à plus l'infini.", "L": [["goal", "≤  prolonge l'ordre de ℝ"], ["res", "∀ x ∈ ℝ :   −∞ ≤ x ≤ +∞"], ["res", "−∞ &lt; +∞"]], "pin": ["Ordre : −∞ ≤ x ≤ +∞"]},

{"title": "3) Bornes", "clear": 1, "say": "Ensuite, les bornes. Contrairement aux nombres réels, dans la droite achevée toute partie A a une borne supérieure et une borne inférieure, sans avoir besoin d'être bornée. Par exemple, l'ensemble vide : tout élément est un majorant du vide, et le plus petit d'entre eux est moins l'infini. Ainsi, la borne supérieure du vide est moins l'infini, et sa borne inférieure est plus l'infini.", "L": [["goal", "Toute partie  A ⊆ <span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span>  a une borne supérieure et une borne inférieure dans <span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span>"], ["txt", "Par exemple, pour  A = ∅ :"], ["sub", "sup ∅ = −∞,        inf ∅ = +∞"]], "pin": ["Toute A ⊆ <span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span> a sup A et inf A"]},

{"title": "4) Borne supérieure", "clear": 1, "say": "Troisièmement, quand la borne supérieure vaut plus ou moins l'infini. Si A est une partie des nombres réels, la borne supérieure de A vaut plus l'infini si et seulement si A n'est pas majorée dans les réels. Et elle vaut moins l'infini si et seulement si A est l'ensemble vide, ou A est l'ensemble qui ne contient que moins l'infini.", "L": [["goal", "Borne supérieure"], ["res", "A ⊆ ℝ :   sup A = +∞   ⟺   A n'est pas majorée dans ℝ"], ["res", "sup A = −∞   ⟺   A = ∅   ou   A = { −∞ }"]], "pin": ["sup : +∞ si non majorée ; −∞ si A=∅ ou {−∞}"]},

{"say": "En général, pour une partie quelconque A de la droite réelle achevée, la borne supérieure vaut plus l'infini si et seulement si plus l'infini appartient à A, ou la partie réelle de A n'est pas majorée.", "L": [["txt", "En général, pour  A ⊆ <span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span> :"], ["sub", "sup A = +∞   ⟺   +∞ ∈ A   ou   A ∩ ℝ non majorée dans ℝ"]]},

{"title": "5) Borne inférieure", "clear": 1, "say": "Quatrièmement, la borne inférieure, qui est symétrique. Si A est une partie des nombres réels, la borne inférieure de A vaut moins l'infini si et seulement si A n'est pas minorée dans les réels. Et elle vaut plus l'infini si et seulement si A est l'ensemble vide, ou A est l'ensemble qui ne contient que plus l'infini.", "L": [["goal", "Borne inférieure"], ["res", "A ⊆ ℝ :   inf A = −∞   ⟺   A n'est pas minorée dans ℝ"], ["res", "inf A = +∞   ⟺   A = ∅   ou   A = { +∞ }"]], "pin": ["inf : −∞ si non minorée ; +∞ si A=∅ ou {+∞}"]},

{"title": "6) Opérations", "clear": 1, "say": "Cinquièmement, les opérations, qui ne sont que partiellement définies. L'addition : pour tout x réel, x plus plus l'infini donne plus l'infini, et x plus moins l'infini donne moins l'infini. La multiplication : si a est strictement positif, a fois plus l'infini donne plus l'infini, et a fois moins l'infini donne moins l'infini. Si a est strictement négatif, le signe s'inverse : a fois plus l'infini donne moins l'infini, et a fois moins l'infini donne plus l'infini.", "L": [["goal", "Opérations définies"], ["res", "x + (±∞) = ±∞        ∀ x ∈ ℝ"], ["res", "a · (±∞) = ±∞        si  a &gt; 0"], ["res", "a · (±∞) = ∓∞        si  a &lt; 0"]], "pin": ["Opérations : x+(±∞)=±∞, a·(±∞)=±∞ (a>0)"]},

{"say": "Et la division : pour tout a réel, a divisé par plus ou moins l'infini donne zéro. Sont aussi définis plus l'infini plus plus l'infini, qui donne plus l'infini, et moins l'infini plus moins l'infini, qui donne moins l'infini.", "L": [["res", "a / (±∞) = 0        ∀ a ∈ ℝ"], ["res", "(+∞) + (+∞) = +∞,        (−∞) + (−∞) = −∞"]]},

{"title": "7) Opérations non définies", "clear": 1, "say": "Cependant, certaines opérations ne sont pas définies, car on ne peut pas leur attribuer une valeur raisonnable. Plus l'infini moins plus l'infini, c'est-à-dire la somme de plus l'infini et de moins l'infini, n'est pas définie. Et zéro fois plus ou moins l'infini non plus.", "L": [["goal", "Non définies"], ["warn", "(+∞) + (−∞)    c'est-à-dire    ∞ − ∞"], ["warn", "0 · (±∞)"]]},

{"title": "8) Remarque", "clear": 1, "say": "Remarque finale. La droite réelle achevée n'est ni un corps ni un anneau. Par exemple, plus l'infini n'a pas d'opposé : aucun élément ajouté à plus l'infini ne donne zéro. Elle ne doit servir que d'outil auxiliaire pour décrire des comportements non bornés.", "L": [["warn", "<span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span> n'est ni un corps ni un anneau"], ["txt", "Par exemple,  +∞  n'a pas d'opposé"], ["txt", "Outil auxiliaire pour les comportements non bornés"]]},

{"title": "Résumé", "clear": 1, "say": "Résumé. La droite réelle achevée est formée des nombres réels, de moins l'infini et de plus l'infini. Son ordre prolonge celui des réels, et toute partie a une borne supérieure et une borne inférieure. Les opérations sont partiellement définies, et ce n'est ni un corps ni un anneau. Merci d'avoir regardé.", "L": [["res", "<span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span> = ℝ ∪ { −∞, +∞ },    −∞ ≤ x ≤ +∞"], ["res", "Toute A ⊆ <span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span> a  sup A  et  inf A"], ["res", "∞ − ∞   et   0 · (±∞)   non définies"], ["res", "<span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span> n'est ni un corps ni un anneau"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' plus ').replace(/⊙/g,' fois ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Rejouer'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Reprendre'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pause';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/henri|paul|claude|remy|rémy|male|google français$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="La droite réelle achevée";$('sub').textContent="Résumé : définition, ordre, bornes supérieures et inférieures, et opérations sur la droite réelle achevée";
$('cap').textContent='0 / '+steps.length;
</script></body></html>

</body></html>
