<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inclusions dans le plan</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>À retenir</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Commencer</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Vitesse <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Mode enregistrement (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"fr-FR",
"meta":{"nivel": 1, "titulo": "Inclusions dans le plan", "enunciado": "Soit δ > 0 et considérons dans ℝ² les ensembles A = { (x, y) ∈ ℝ² | |x| + |y| < δ }, B = { (x, y) ∈ ℝ² | √(x² + y²) < δ } et C = { (x, y) ∈ ℝ² | max{ |x|, |y| } < δ }. Démontrer que :", "tesis": "A ⊆ B ⊆ C", "datos": ["δ > 0", "A = { (x, y) ∈ ℝ² | |x| + |y| < δ }", "B = { (x, y) ∈ ℝ² | √(x² + y²) < δ }", "C = { (x, y) ∈ ℝ² | max{ |x|, |y| } < δ }"]},
"steps":[
{"title": "Inclusions dans le plan", "sub": "Exercice · Algèbre des ensembles", "clear": 1, "say": "Bonjour. Dans cette vidéo, nous allons démontrer que trois ensembles du plan, définis avec la valeur absolue, la norme euclidienne et le maximum, sont contenus l'un dans l'autre. Nous irons très lentement, en écrivant chaque équation et en justifiant chaque étape.", "L": [["txt", "Démontrer que  A ⊆ B ⊆ C  dans le plan"]]},

{"say": "Les données. Soit delta un nombre réel strictement positif. A est l'ensemble des points x, y du plan tels que la valeur absolue de x, plus la valeur absolue de y, est inférieure à delta. B est l'ensemble des points x, y tels que la racine carrée de x au carré plus y au carré est inférieure à delta. Et C est l'ensemble des points x, y tels que le maximum de la valeur absolue de x et de la valeur absolue de y est inférieur à delta.", "L": [["hyp", "δ &gt; 0<span class='tag'>Donnée</span>"], ["hyp", "A = { (x, y) ∈ ℝ² | |x| + |y| &lt; δ }"], ["hyp", "B = { (x, y) ∈ ℝ² | √(x² + y²) &lt; δ }"], ["hyp", "C = { (x, y) ∈ ℝ² | max{ |x|, |y| } &lt; δ }"]]},

{"say": "Ce que nous voulons démontrer. A est inclus dans B, et B est inclus dans C. Ici, l'inclusion signifie inclus ou égal. À droite, nous voyons les trois ensembles dessinés pour delta égal à un : A est le losange, B est le disque, et C est le carré. Les lignes en pointillés indiquent que le bord n'appartient pas à l'ensemble. Nous rappelons à gauche ce que nous allons utiliser : la définition de l'inclusion, que le carré d'une valeur absolue est le carré du nombre, que la racine carrée du carré d'un nombre est sa valeur absolue, et que la racine carrée conserve l'ordre.", "L": [["goal", "A ⊆ B   et   B ⊆ C<span class='tag'>Démontrer</span>"], ["txt", "<svg viewBox='0 0 300 300' width='100%' style='max-width:300px;display:block' xmlns='http://www.w3.org/2000/svg' font-family='Georgia,serif'><rect x='40' y='40' width='220' height='220' fill='#7be0a0' fill-opacity='.15' stroke='#7be0a0' stroke-width='2.5' stroke-dasharray='6 4'/><circle cx='150' cy='150' r='110' fill='#ffd166' fill-opacity='.15' stroke='#ffd166' stroke-width='2.5' stroke-dasharray='6 4'/><polygon points='150,40 260,150 150,260 40,150' fill='#7cc4ff' fill-opacity='.25' stroke='#7cc4ff' stroke-width='2.5' stroke-dasharray='6 4'/><line x1='10' y1='150' x2='290' y2='150' stroke='#9fb3aa' stroke-width='1'/><line x1='150' y1='10' x2='150' y2='290' stroke='#9fb3aa' stroke-width='1'/><text x='260' y='166' fill='#9fb3aa' font-size='16' text-anchor='middle'>δ</text><text x='40' y='166' fill='#9fb3aa' font-size='16' text-anchor='middle'>−δ</text><text x='156' y='54' fill='#9fb3aa' font-size='14'>δ</text><text x='136' y='155' fill='#7cc4ff' font-size='18'>A</text><text x='184' y='116' fill='#ffd166' font-size='18'>B</text><text x='216' y='84' fill='#7be0a0' font-size='18'>C</text></svg>"]], "pin": ["(Déf ⊆) X ⊆ Y  ⟺  tout p ∈ X vérifie p ∈ Y", "(P1) |a|² = a²", "(P2) √(a²) = |a|", "(P3) si 0 ≤ u ≤ v alors √u ≤ √v"], "clear": 1},

{"title": "1) A ⊆ B", "clear": 1, "say": "Première partie : nous démontrons que A est inclus dans B. Par la définition de l'inclusion, nous prenons un point quelconque x, y de A, et nous devons prouver qu'il appartient à B.", "L": [["hyp", "Soit (x, y) ∈ A"], ["goal", "On veut :  (x, y) ∈ B,  c'est-à-dire  √(x² + y²) &lt; δ"]]},

{"say": "Comme x, y appartient à A, par la définition de A, la valeur absolue de x, plus la valeur absolue de y, est inférieure à delta. C'est notre hypothèse.", "L": [["hyp", "(x, y) ∈ A  ⟹  |x| + |y| &lt; δ<span class='tag'>Hypothèse</span>"]]},

{"clear": 1, "say": "Calculons maintenant le carré de la somme des valeurs absolues. En développant le carré d'une somme, on obtient le carré de la valeur absolue de x, plus deux fois la valeur absolue de x fois la valeur absolue de y, plus le carré de la valeur absolue de y.", "L": [["txt", "On développe le carré d'une somme :"], ["sub", "(|x| + |y|)² = |x|² + 2|x||y| + |y|²"]]},

{"say": "Par la propriété P1, le carré de la valeur absolue de x est x au carré, et le carré de la valeur absolue de y est y au carré. Nous les remplaçons.", "L": [["txt", "Par (P1) avec a = x  et  avec a = y :"], ["sub", "(|x| + |y|)² = <mark>x²</mark> + 2|x||y| + <mark>y²</mark>"]]},

{"say": "Comme la valeur absolue de x et la valeur absolue de y sont positives ou nulles, le terme deux fois la valeur absolue de x fois la valeur absolue de y est positif ou nul. Donc, si on l'enlève de la somme, celle-ci diminue ou reste égale. Ainsi le carré de la somme est supérieur ou égal à x au carré plus y au carré.", "L": [["txt", "Comme |x| ≥ 0 et |y| ≥ 0, on a 2|x||y| ≥ 0, donc :"], ["res", "x² + y² ≤ (|x| + |y|)²"]]},

{"clear": 1, "say": "Prenons maintenant les racines carrées. Nous utilisons la propriété P3, avec u égal à x au carré plus y au carré, et v égal au carré de la somme des valeurs absolues. Les deux sont positifs ou nuls, et u est inférieur ou égal à v. Alors la racine carrée de x au carré plus y au carré est inférieure ou égale à la racine carrée de, valeur absolue de x plus valeur absolue de y, au carré.", "L": [["txt", "(P3) avec  u = x² + y²,  v = (|x| + |y|)²,  0 ≤ u ≤ v :"], ["sub", "√(x² + y²) ≤ √( (|x| + |y|)² )"]]},

{"say": "Et par la propriété P2, avec a égal à la somme de la valeur absolue de x et de la valeur absolue de y, la racine carrée de ce carré est la valeur absolue de la somme. Mais la somme est déjà positive ou nulle, donc sa valeur absolue est la somme elle-même.", "L": [["txt", "(P2) avec  a = |x| + |y| ≥ 0 :   √( (|x| + |y|)² ) = | |x| + |y| | = |x| + |y|"], ["res", "√(x² + y²) ≤ |x| + |y|"]]},

{"clear": 1, "say": "Combinons cette inégalité avec l'hypothèse. La racine carrée de x au carré plus y au carré est inférieure ou égale à la valeur absolue de x plus la valeur absolue de y, et ceci est inférieur à delta.", "L": [["txt", "En combinant avec l'hypothèse  |x| + |y| &lt; δ :"], ["res", "√(x² + y²) ≤ |x| + |y| &lt; δ"]]},

{"say": "Par conséquent, la racine carrée de x au carré plus y au carré est inférieure à delta. C'est exactement la définition de B, donc x, y appartient à B. Comme x, y était un point quelconque de A, nous concluons que A est inclus dans B.", "L": [["txt", "Alors  √(x² + y²) &lt; δ,  donc :"], ["hyp", "(x, y) ∈ B"], ["res", "A ⊆ B"]]},

{"title": "2) B ⊆ C", "clear": 1, "say": "Deuxième partie : nous démontrons que B est inclus dans C. Nous prenons un point quelconque x, y de B, et nous devons prouver qu'il appartient à C.", "L": [["hyp", "Soit (x, y) ∈ B"], ["goal", "On veut :  (x, y) ∈ C,  c'est-à-dire  max{ |x|, |y| } &lt; δ"]]},

{"say": "Comme x, y appartient à B, par la définition de B, la racine carrée de x au carré plus y au carré est inférieure à delta. C'est notre hypothèse.", "L": [["hyp", "(x, y) ∈ B  ⟹  √(x² + y²) &lt; δ<span class='tag'>Hypothèse</span>"]]},

{"clear": 1, "say": "D'abord, comme y au carré est positif ou nul, x au carré est inférieur ou égal à x au carré plus y au carré. De la même façon, comme x au carré est positif ou nul, y au carré est inférieur ou égal à x au carré plus y au carré.", "L": [["txt", "Comme  y² ≥ 0  et  x² ≥ 0 :"], ["sub", "x² ≤ x² + y²"], ["sub", "y² ≤ x² + y²"]]},

{"say": "Prenons les racines carrées, avec la propriété P3. Avec u égal à x au carré, et v égal à x au carré plus y au carré, la racine de x au carré est inférieure ou égale à la racine de x au carré plus y au carré. Et par la propriété P2, la racine carrée de x au carré est la valeur absolue de x. De même avec y.", "L": [["txt", "(P3) avec  u = x²,  v = x² + y²,  puis (P2) avec  a = x :"], ["sub", "|x| = √(x²) ≤ √(x² + y²)"], ["txt", "(P3) avec  u = y²,  v = x² + y²,  puis (P2) avec  a = y :"], ["sub", "|y| = √(y²) ≤ √(x² + y²)"]]},

{"clear": 1, "say": "Utilisons maintenant l'hypothèse. La valeur absolue de x est inférieure ou égale à la racine de x au carré plus y au carré, qui est inférieure à delta. Et de même pour y. Par conséquent, la valeur absolue de x est inférieure à delta, et la valeur absolue de y est inférieure à delta.", "L": [["txt", "En combinant avec l'hypothèse  √(x² + y²) &lt; δ :"], ["res", "|x| ≤ √(x² + y²) &lt; δ"], ["res", "|y| ≤ √(x² + y²) &lt; δ"]]},

{"say": "Le maximum de deux nombres est l'un des deux, et les deux sont inférieurs à delta. Par conséquent, le maximum de la valeur absolue de x et de la valeur absolue de y est inférieur à delta. C'est la définition de C, donc x, y appartient à C. Comme x, y était un point quelconque de B, nous concluons que B est inclus dans C.", "L": [["txt", "|x| &lt; δ  et  |y| &lt; δ  ⟹  max{ |x|, |y| } &lt; δ"], ["hyp", "(x, y) ∈ C"], ["res", "B ⊆ C"]]},

{"title": "Conclusion", "clear": 1, "say": "Conclusion. En réunissant les deux parties, A est inclus dans B, et B est inclus dans C. Géométriquement, le losange est à l'intérieur du disque, et le disque est à l'intérieur du carré. Merci d'avoir regardé.", "L": [["res", "A ⊆ B   et   B ⊆ C   ⟹   A ⊆ B ⊆ C"], ["txt", "<svg viewBox='0 0 300 300' width='100%' style='max-width:300px;display:block' xmlns='http://www.w3.org/2000/svg' font-family='Georgia,serif'><rect x='40' y='40' width='220' height='220' fill='#7be0a0' fill-opacity='.15' stroke='#7be0a0' stroke-width='2.5' stroke-dasharray='6 4'/><circle cx='150' cy='150' r='110' fill='#ffd166' fill-opacity='.15' stroke='#ffd166' stroke-width='2.5' stroke-dasharray='6 4'/><polygon points='150,40 260,150 150,260 40,150' fill='#7cc4ff' fill-opacity='.25' stroke='#7cc4ff' stroke-width='2.5' stroke-dasharray='6 4'/><line x1='10' y1='150' x2='290' y2='150' stroke='#9fb3aa' stroke-width='1'/><line x1='150' y1='10' x2='150' y2='290' stroke='#9fb3aa' stroke-width='1'/><text x='260' y='166' fill='#9fb3aa' font-size='16' text-anchor='middle'>δ</text><text x='40' y='166' fill='#9fb3aa' font-size='16' text-anchor='middle'>−δ</text><text x='156' y='54' fill='#9fb3aa' font-size='14'>δ</text><text x='136' y='155' fill='#7cc4ff' font-size='18'>A</text><text x='184' y='116' fill='#ffd166' font-size='18'>B</text><text x='216' y='84' fill='#7be0a0' font-size='18'>C</text></svg>"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' plus ').replace(/⊙/g,' fois ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Rejouer'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Reprendre'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pause';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/henri|paul|claude|remy|rémy|male|google français$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Inclusions dans le plan";$('sub').textContent="Exercice · Algèbre des ensembles";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
