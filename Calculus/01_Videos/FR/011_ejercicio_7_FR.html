<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loi d’involution</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(15px,1.9vw,24px)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>À retenir</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Commencer</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Vitesse <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Mode enregistrement (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"fr-FR",
"meta":{"nivel": 2, "titulo": "Loi d’involution", "enunciado": "Soit (B, ⊕, ⊙, ∼) une algèbre de Boole.  Montrer que, pour tout a ∈ B, la loi d’involution est vérifiée :", "tesis": "∼(∼a) = a", "datos": ["(Comm ⊕)  x ⊕ y = y ⊕ x", "(Comm ⊙)  x ⊙ y = y ⊙ x", "(Compl)  x ⊕ ∼x = 1,   x ⊙ ∼x = 0", "(Unic)  x ⊕ y = 1 et x ⊙ y = 0 ⇒ y = ∼x"]},
"steps":[
{"title": "Loi d’involution", "sub": "Exercice · Algèbre de Boole", "clear": 1, "say": "Bonjour. Dans cette vidéo, nous allons résoudre un exercice sur les algèbres de Boole. Nous irons très lentement, en écrivant chaque équation et en justifiant chaque étape.", "L": [["txt", "Le complémentaire du complémentaire de a est a"]]},

{"say": "D’abord, les données. B est un ensemble muni de deux opérations, la somme et le produit, et d’une opération complémentaire, que nous notons avec un tilde. C’est une algèbre de Boole : un treillis distributif avec un plus petit élément zéro, un plus grand élément un, et un complémentaire pour chaque élément. L’exemple typique est l’ensemble des parties d’un ensemble U, avec l’union, l’intersection et le complémentaire.", "L": [["hyp", "(B, ⊕, ⊙, ∼) algèbre de Boole<span class='tag'>Hypothèse</span>"], ["txt", "Avec des ensembles :  (𝒫(U), ∪, ∩, complémentaire)"]]},

{"say": "Rappelons la définition du complémentaire. Le complémentaire de x est un élément qui vérifie deux conditions à la fois : x plus son complémentaire égale un, et x fois son complémentaire égale zéro. Avec des ensembles : A union son complémentaire égale U, et A inter son complémentaire est l’ensemble vide.", "L": [["sub", "x ⊕ ∼x = 1<span class='tag'>Définition du complémentaire</span>"], ["sub", "x ⊙ ∼x = 0<span class='tag'>Définition du complémentaire</span>"], ["txt", "Avec des ensembles :  A ∪ A<sup>c</sup> = U,   A ∩ A<sup>c</sup> = ∅"]]},

{"say": "Un résultat de base des algèbres de Boole est que le complémentaire de chaque élément est unique. Cela signifie que si un élément y vérifie les deux conditions par rapport à x, c’est-à-dire x plus y égale un, et x fois y égale zéro, alors y est le complémentaire de x. Avec des ensembles : le seul ensemble qui, réuni avec A, donne U, et intersecté avec A, donne le vide, est le complémentaire de A.", "L": [["sub", "x ⊕ y = 1   et   x ⊙ y = 0   ⟹   y = ∼x<span class='tag'>Unicité du complémentaire</span>"], ["txt", "Avec des ensembles :  A ∪ Y = U  et  A ∩ Y = ∅  ⟹  Y = A<sup>c</sup>"]]},

{"say": "Nous notons à gauche ce que nous allons utiliser : la commutativité de la somme, celle du produit, la définition du complémentaire et l’unicité.", "pin": ["(Comm ⊕) x ⊕ y = y ⊕ x", "(Comm ⊙) x ⊙ y = y ⊙ x", "(Compl) x ⊕ ∼x = 1,   x ⊙ ∼x = 0", "(Unic) x ⊕ y = 1 et x ⊙ y = 0 ⇒ y = ∼x"]},

{"say": "Ce que nous voulons démontrer. Pour tout élément a de B, le complémentaire du complémentaire de a est égal à a. C’est la loi d’involution. Avec des ensembles : le complémentaire du complémentaire de A est A.", "L": [["goal", "∀ a ∈ B:   ∼(∼a) = a<span class='tag'>Thèse : loi d’involution</span>"], ["txt", "Avec des ensembles :  (A<sup>c</sup>)<sup>c</sup> = A"]]},

{"title": "Mise en place", "clear": 1, "say": "Soit a un élément quelconque de B. Par la définition du complémentaire, nous avons deux hypothèses : a plus son complémentaire égale un, et a fois son complémentaire égale zéro.", "L": [["txt", "Soit a ∈ B  (quelconque)"], ["hyp", "a ⊕ ∼a = 1<span class='tag'>Hypothèse : définition de ∼a</span>"], ["hyp", "a ⊙ ∼a = 0<span class='tag'>Hypothèse : définition de ∼a</span>"]]},

{"say": "L’idée est la suivante. Par l’unicité, pour montrer que le complémentaire du complémentaire de a est a, il suffit de vérifier que a satisfait les deux conditions du complémentaire par rapport au complémentaire de a. Autrement dit, nous appliquons l’unicité avec x égal au complémentaire de a, et y égal à a.", "L": [["sub", "x = ∼a,   y = a<span class='tag'>Choix dans (Unic)</span>"], ["goal", "Il suffit de montrer :  ∼a ⊕ a = 1   et   ∼a ⊙ a = 0<span class='tag'>Nouvelle thèse</span>"]]},

{"title": "Première condition", "clear": 1, "say": "Première condition. Nous voulons montrer que le complémentaire de a, plus a, est égal à un. Partons du membre de gauche.", "L": [["goal", "Nous voulons :  ∼a ⊕ a = 1<span class='tag'>Thèse de cette partie</span>"], ["txt", "∼a ⊕ a"]]},

{"say": "Première étape. Nous appliquons la commutativité de la somme, avec x égal au complémentaire de a, et y égal à a. Nous passons du complémentaire de a, plus a, à a plus le complémentaire de a.", "L": [["sub", "∼a ⊕ a  =  a ⊕ ∼a<span class='tag'>Commutativité de ⊕</span>"]]},

{"say": "Deuxième étape. Nous avons maintenant exactement la première hypothèse : a plus son complémentaire égale un. Nous la surlignons et nous substituons.", "L": [["sub", "∼a ⊕ a  =  <mark>a ⊕ ∼a</mark>"], ["txt", "Hypothèse :  <mark>a ⊕ ∼a</mark> = 1"], ["res", "∼a ⊕ a  =  1<span class='tag'>Définition du complémentaire</span>"]]},

{"title": "Seconde condition", "clear": 1, "say": "Seconde condition. Nous voulons montrer que le complémentaire de a, fois a, est égal à zéro. Partons du membre de gauche.", "L": [["goal", "Nous voulons :  ∼a ⊙ a = 0<span class='tag'>Thèse de cette partie</span>"], ["txt", "∼a ⊙ a"]]},

{"say": "Première étape. Nous appliquons la commutativité du produit. Nous passons du complémentaire de a, fois a, à a fois le complémentaire de a.", "L": [["sub", "∼a ⊙ a  =  a ⊙ ∼a<span class='tag'>Commutativité de ⊙</span>"]]},

{"say": "Deuxième étape. Nous avons maintenant exactement la seconde hypothèse : a fois son complémentaire égale zéro. Nous la surlignons et nous substituons.", "L": [["sub", "∼a ⊙ a  =  <mark>a ⊙ ∼a</mark>"], ["txt", "Hypothèse :  <mark>a ⊙ ∼a</mark> = 0"], ["res", "∼a ⊙ a  =  0<span class='tag'>Définition du complémentaire</span>"]]},

{"title": "Conclusion", "clear": 1, "say": "Nous avons vérifié les deux conditions. Autrement dit, a vérifie que le complémentaire de a, plus a, égale un, et que le complémentaire de a, fois a, égale zéro. Donc, a est un complémentaire du complémentaire de a.", "L": [["res", "∼a ⊕ a = 1   et   ∼a ⊙ a = 0<span class='tag'>Les deux conditions</span>"], ["txt", "a est un complémentaire de ∼a"]]},

{"say": "Appliquons maintenant l’unicité du complémentaire, avec x égal au complémentaire de a, et y égal à a. Comme a vérifie les deux conditions, a est le complémentaire du complémentaire de a. Avec des ensembles : le complémentaire du complémentaire de A est A. Et cela démontre la loi d’involution.", "L": [["sub", "(Unic) avec x = ∼a, y = a"], ["res", "a = ∼(∼a)   ∎<span class='tag'>Loi d’involution</span>"], ["txt", "Avec des ensembles :  (A<sup>c</sup>)<sup>c</sup> = A"]]},

{"title": "Résumé", "clear": 1, "say": "En résumé. Pour montrer que le complémentaire du complémentaire de a est a, il n’est pas nécessaire de le calculer : il suffit de voir que a vérifie les deux conditions du complémentaire par rapport au complémentaire de a, grâce à la commutativité, puis d’appliquer l’unicité. Nous concluons que l’opérateur complémentaire est involutif. Avec des ensembles : le complémentaire du complémentaire de A est A. Merci d’avoir regardé.", "L": [["res", "a ⊕ ∼a = 1  ⟹  ∼a ⊕ a = 1   (Comm ⊕)"], ["res", "a ⊙ ∼a = 0  ⟹  ∼a ⊙ a = 0   (Comm ⊙)"], ["res", "Unicité  ⟹  ∼(∼a) = a"], ["txt", "Avec des ensembles :  (A<sup>c</sup>)<sup>c</sup> = A"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' plus ').replace(/⊙/g,' fois ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Rejouer'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Reprendre'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pause';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/henri|paul|claude|remy|rémy|male|google français$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Loi d’involution";$('sub').textContent="Exercice · Algèbre de Boole";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
