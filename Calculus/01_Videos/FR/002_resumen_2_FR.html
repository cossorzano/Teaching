<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Structures algébriques</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:30%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(15px,1.9vw,24px)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>À retenir</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Commencer</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Vitesse <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Mode enregistrement (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"fr-FR",
"meta":{"nivel": 0, "titulo": "Structures algébriques", "enunciado": "Résumé : treillis, treillis distributif et algèbre de Boole", "datos": ["Treillis", "Treillis distributif", "Algèbre de Boole", "Théorèmes de l’algèbre de Boole", "Principe de dualité"]},
"steps":[
{"title": "Structures algébriques", "sub": "Résumé : treillis, treillis distributif et algèbre de Boole", "clear": 1, "say": "Bonjour. Dans cette vidéo, nous révisons, directement avec les formules, trois structures algébriques qui s’emboîtent les unes dans les autres : le treillis, le treillis distributif et l’algèbre de Boole.", "L": [["txt", "Treillis  ⊂  Treillis distributif  ⊂  Algèbre de Boole"]]},

{"title": "Treillis", "clear": 1, "say": "Commençons par le treillis. Le triplet B, plus entouré, point entouré, est un treillis si les deux lois sont binaires et internes, et si certaines propriétés sont vérifiées pour tous a, b et c de B.", "L": [["hyp", "(B, ⊕, ⊙) treillis<span class='tag'>⊕, ⊙ binaires et internes</span>"], ["hyp", "Pour tous  a, b, c ∈ B"]]},

{"say": "Première propriété, la commutativité. a plus b est égal à b plus a. Et a fois b est égal à b fois a.", "L": [["sub", "a ⊕ b = b ⊕ a<span class='tag'>Commutativité</span>"], ["sub", "a ⊙ b = b ⊙ a<span class='tag'>Commutativité</span>"]]},

{"say": "Deuxième propriété, l’associativité. a plus, b plus c, est égal à, a plus b, plus c. Et de même avec le produit : a fois, b fois c, est égal à, a fois b, fois c.", "L": [["sub", "a ⊕ (b ⊕ c) = (a ⊕ b) ⊕ c<span class='tag'>Associativité</span>"], ["sub", "a ⊙ (b ⊙ c) = (a ⊙ b) ⊙ c<span class='tag'>Associativité</span>"]]},

{"say": "Troisième propriété, l’absorption. a plus, a fois b, est égal à a. Et a fois, a plus b, est égal à a. Chaque loi absorbe l’autre.", "L": [["sub", "a ⊕ (a ⊙ b) = a<span class='tag'>Absorption</span>"], ["sub", "a ⊙ (a ⊕ b) = a<span class='tag'>Absorption</span>"]]},

{"say": "De ces axiomes découle un théorème : l’idempotence. a plus a vaut a, et a fois a vaut a. Opérer un élément avec lui-même ne change rien.", "L": [["res", "a ⊕ a = a<span class='tag'>Théorème : idempotence</span>"], ["res", "a ⊙ a = a<span class='tag'>Théorème : idempotence</span>"]]},

{"say": "Notons à gauche l’essentiel du treillis : commutativité, associativité et absorption.", "pin": "Treillis : commutatif, associatif, absorption"},

{"title": "Treillis distributif", "clear": 1, "say": "Passons au treillis distributif. C’est un treillis qui vérifie en plus la distributivité.", "L": [["goal", "Treillis distributif  =  Treillis  +  distributivité"]]},

{"say": "Chaque loi est distributive par rapport à l’autre. a plus, b fois c, est égal à, a plus b, fois, a plus c. Et a fois, b plus c, est égal à, a fois b, plus, a fois c.", "L": [["sub", "a ⊕ (b ⊙ c) = (a ⊕ b) ⊙ (a ⊕ c)<span class='tag'>Distributivité</span>"], ["sub", "a ⊙ (b ⊕ c) = (a ⊙ b) ⊕ (a ⊙ c)<span class='tag'>Distributivité</span>"]]},

{"title": "Algèbre de Boole", "clear": 1, "say": "Et nous arrivons à l’algèbre de Boole. C’est un treillis distributif qui possède en plus un plus petit élément, zéro, un plus grand élément, un, et un complémentaire pour chaque élément.", "L": [["goal", "Algèbre de Boole  =  Treillis distributif  +  0, 1  +  complémentaires"]]},

{"say": "Le zéro est l’élément neutre de la somme, et le un est l’élément neutre du produit. a plus zéro vaut a. Et a fois un vaut a.", "L": [["sub", "a ⊕ 0 = a<span class='tag'>0 neutre pour ⊕</span>"], ["sub", "a ⊙ 1 = a<span class='tag'>1 neutre pour ⊙</span>"]]},

{"say": "Chaque élément a possède un complémentaire, que l’on note avec un tilde devant. Il doit vérifier les deux conditions à la fois : a plus son complémentaire vaut un, et a fois son complémentaire vaut zéro.", "L": [["sub", "a ⊕ ∼a = 1<span class='tag'>Complémentaire (les deux doivent être vraies)</span>"], ["sub", "a ⊙ ∼a = 0<span class='tag'>Complémentaire (les deux doivent être vraies)</span>"]]},

{"say": "Comme c’est un treillis distributif, le complémentaire de chaque élément est unique. De plus, le complémentaire de zéro est un.", "L": [["res", "∼a unique pour chaque a"], ["res", "∼0 = 1"]]},

{"say": "Notons à gauche l’essentiel de l’algèbre de Boole.", "pin": "Boole : distributif + 0, 1 + complémentaires"},

{"title": "Théorèmes de l’algèbre de Boole", "clear": 1, "say": "Plusieurs théorèmes sont vrais dans une algèbre de Boole. Le premier est la loi d’involution : le complémentaire du complémentaire de a est a.", "L": [["res", "∼(∼a) = a<span class='tag'>Loi d’involution</span>"]]},

{"say": "Deuxièmement, la domination. a plus un vaut un. Et a fois zéro vaut zéro.", "L": [["res", "a ⊕ 1 = 1<span class='tag'>Domination</span>"], ["res", "a ⊙ 0 = 0<span class='tag'>Domination</span>"]]},

{"say": "Troisièmement, les lois de De Morgan. a plus b est le complémentaire de, le complémentaire de a fois le complémentaire de b. Et a fois b est le complémentaire de, le complémentaire de a plus le complémentaire de b.", "L": [["res", "a ⊕ b = ∼(∼a ⊙ ∼b)<span class='tag'>Loi de De Morgan</span>"], ["res", "a ⊙ b = ∼(∼a ⊕ ∼b)<span class='tag'>Loi de De Morgan</span>"]]},

{"title": "Principe de dualité", "clear": 1, "say": "Enfin, le principe de dualité. Toute identité vraie le reste si l’on échange la somme et le produit, et le zéro et le un.", "L": [["goal", "⊕ ↔ ⊙,      0 ↔ 1"]]},

{"say": "Voyons un exemple. a plus zéro égale a est une identité vraie. En échangeant les lois et les éléments neutres, on obtient a fois un égale a, qui est vraie aussi.", "L": [["sub", "a ⊕ 0 = a<span class='tag'>Identité vraie</span>"], ["sub", "⊕ ↔ ⊙,  0 ↔ 1"], ["res", "a ⊙ 1 = a<span class='tag'>Identité duale, vraie aussi</span>"]]},

{"title": "Résumé", "clear": 1, "say": "En résumé. Le treillis demande la commutativité, l’associativité et l’absorption. Le treillis distributif ajoute la distributivité. Et l’algèbre de Boole ajoute le zéro, le un et les complémentaires, d’où découlent l’involution, la domination, De Morgan et la dualité. Merci d’avoir regardé cette vidéo.", "L": [["res", "Treillis : commutatif, associatif, absorption ⟹ idempotence"], ["res", "+ distributivité ⟹ Treillis distributif"], ["res", "+ 0, 1, ∼a ⟹ Algèbre de Boole ⟹ involution, domination, De Morgan, dualité"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){const d=document.createElement('div');d.className='l hyp';d.innerHTML=s.pin;if(k<n)d.style.animation='none';pins.appendChild(d)}}
 board.scrollTop=board.scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' plus ').replace(/⊙/g,' fois ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Rejouer'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Reprendre'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pause';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/henri|paul|claude|remy|rémy|male|google français$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Structures algébriques";$('sub').textContent="Résumé : treillis, treillis distributif et algèbre de Boole";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
