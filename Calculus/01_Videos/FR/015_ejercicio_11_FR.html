<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>𝒫(U) est un treillis</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>À retenir</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Commencer</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Vitesse <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Mode enregistrement (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"fr-FR",
"meta":{"nivel": 2, "titulo": "𝒫(U) est un treillis", "enunciado": "Démontrer que (𝒫(U), ∪, ∩) est un treillis.", "tesis": "(𝒫(U), ∪, ∩) est un treillis", "datos": ["(Treillis)  ⊕, ⊙ internes ;  commutativité, associativité, absorption", "(Déf ∪)  x ∈ A ∪ B ⇔ x ∈ A ou x ∈ B", "(Déf ∩)  x ∈ A ∩ B ⇔ x ∈ A et x ∈ B"]},
"steps":[
{"title": "𝒫(U) est un treillis", "sub": "Exercice · Treillis algébriques", "clear": 1, "say": "Bonjour. Dans cette vidéo, nous allons résoudre un exercice sur les treillis et les ensembles. Nous irons très lentement, en écrivant chaque équation et en justifiant chaque étape.", "L": [["txt", "Démontrer que l'ensemble des parties de U, avec la réunion et l'intersection, est un treillis"]]},

{"say": "D'abord, rappelons ce qu'est un treillis. Dans un treillis, B muni des opérations somme et produit, les deux opérations doivent être internes dans B, et vérifier trois propriétés : la commutativité, l'associativité et l'absorption.", "L": [["hyp", "(B, ⊕, ⊙) treillis  ⇔  ⊕, ⊙ internes dans B  et  vérifient :<span class='tag'>Définition</span>"], ["hyp", "Commutativité,   Associativité,   Absorption"]]},

{"say": "Dans notre cas, B est l'ensemble des parties de U, la somme est la réunion, et le produit est l'intersection. Ce que nous voulons démontrer, c'est que ces conditions sont vérifiées.", "L": [["sub", "B = 𝒫(U),     ⊕ = ∪,     ⊙ = ∩<span class='tag'>Notre cas</span>"], ["goal", "Montrer :  (𝒫(U), ∪, ∩) est un treillis<span class='tag'>Thèse</span>"]]},

{"title": "Opérations internes", "clear": 1, "say": "D'abord, les opérations sont internes. Étant donnés deux sous-ensembles A et B de U, la réunion de A et B est aussi un sous-ensemble de U, et l'intersection de A et B est aussi un sous-ensemble de U. Autrement dit, la réunion et l'intersection de deux éléments de l'ensemble des parties de U restent dans l'ensemble des parties de U.", "L": [["txt", "Soient A, B ⊆ U"], ["res", "A ∪ B ⊆ U<span class='tag'>∪ est interne</span>"], ["res", "A ∩ B ⊆ U<span class='tag'>∩ est interne</span>"]]},

{"title": "Méthode : raisonner sur les éléments", "clear": 1, "say": "Démontrons maintenant les propriétés en raisonnant sur les éléments. Soient A, B et C des sous-ensembles de U, et soit x un élément de U. Rappelons que deux ensembles sont égaux si et seulement s'ils ont les mêmes éléments. Ainsi, pour démontrer que deux ensembles sont égaux, nous montrerons que x appartient à l'un si et seulement s'il appartient à l'autre.", "L": [["txt", "Soient A, B, C ⊆ U  et  x ∈ U"], ["goal", "X = Y   ⇔   (x ∈ X ⇔ x ∈ Y)<span class='tag'>Égalité d'ensembles : mêmes éléments</span>"]]},

{"say": "Et rappelons la définition de la réunion et de l'intersection. x appartient à la réunion de A et B si et seulement si x appartient à A, ou x appartient à B. Et x appartient à l'intersection de A et B si et seulement si x appartient à A, et x appartient à B. Nous les notons à gauche.", "L": [["sub", "x ∈ A ∪ B  ⇔  x ∈ A  ou  x ∈ B<span class='tag'>Définition de la réunion</span>"], ["sub", "x ∈ A ∩ B  ⇔  x ∈ A  et  x ∈ B<span class='tag'>Définition de l'intersection</span>"]], "pin": ["(Déf ∪) x ∈ A ∪ B ⇔ x ∈ A ou x ∈ B", "(Déf ∩) x ∈ A ∩ B ⇔ x ∈ A et x ∈ B"]},

{"title": "Commutativité de ∪", "clear": 1, "say": "Commençons par la commutativité de la réunion. Nous voulons démontrer que A union B est égal à B union A. Nous partons de x appartient à A union B.", "L": [["goal", "On veut :  A ∪ B = B ∪ A"], ["txt", "x ∈ A ∪ B"]]},

{"say": "Première étape. Par la définition de la réunion, x appartient à A union B si et seulement si x appartient à A, ou x appartient à B.", "L": [["sub", "⇔  x ∈ A  ou  x ∈ B<span class='tag'>Définition de ∪</span>"]]},

{"say": "Deuxième étape. Par la commutativité de la disjonction logique ou, nous pouvons échanger l'ordre : x appartient à B, ou x appartient à A.", "L": [["sub", "⇔  x ∈ B  ou  x ∈ A<span class='tag'>Commutativité de « ou »</span>"]]},

{"say": "Troisième étape. Par la définition de la réunion, lue en sens inverse, cela équivaut à x appartient à B union A. Comme x est arbitraire, les deux ensembles ont les mêmes éléments, et ils sont donc égaux.", "L": [["res", "⇔  x ∈ B ∪ A<span class='tag'>Définition de ∪</span>"], ["res", "A ∪ B = B ∪ A   ∎"]]},

{"title": "Commutativité de ∩", "clear": 1, "say": "Continuons avec la commutativité de l'intersection. Nous voulons démontrer que A inter B est égal à B inter A. Nous partons de x appartient à A inter B.", "L": [["goal", "On veut :  A ∩ B = B ∩ A"], ["txt", "x ∈ A ∩ B"]]},

{"say": "Première étape. Par la définition de l'intersection, x appartient à A inter B si et seulement si x appartient à A, et x appartient à B.", "L": [["sub", "⇔  x ∈ A  et  x ∈ B<span class='tag'>Définition de ∩</span>"]]},

{"say": "Deuxième étape. Par la commutativité de la conjonction logique et, nous pouvons échanger l'ordre : x appartient à B, et x appartient à A.", "L": [["sub", "⇔  x ∈ B  et  x ∈ A<span class='tag'>Commutativité de « et »</span>"]]},

{"say": "Troisième étape. Par la définition de l'intersection, lue en sens inverse, cela équivaut à x appartient à B inter A. Comme x est arbitraire, les deux ensembles sont égaux.", "L": [["res", "⇔  x ∈ B ∩ A<span class='tag'>Définition de ∩</span>"], ["res", "A ∩ B = B ∩ A   ∎"]]},

{"title": "Associativité de ∪", "clear": 1, "say": "Passons à l'associativité de la réunion. Nous voulons démontrer que A union, B union C, est égal à, A union B, union C. Nous partons de x appartient à A union, B union C.", "L": [["goal", "On veut :  A ∪ (B ∪ C) = (A ∪ B) ∪ C"], ["txt", "x ∈ A ∪ (B ∪ C)"]]},

{"say": "Première étape. Par la définition de la réunion, x appartient à A, ou x appartient à B union C. Et en appliquant de nouveau la définition, x appartient à B union C si et seulement si x appartient à B, ou x appartient à C.", "L": [["sub", "⇔  x ∈ A  ou  (x ∈ B  ou  x ∈ C)<span class='tag'>Définition de ∪, appliquée deux fois</span>"]]},

{"say": "Deuxième étape. Par l'associativité de la disjonction logique ou, le groupement n'a pas d'importance, et nous pouvons donc enlever les parenthèses : x appartient à A, ou x appartient à B, ou x appartient à C.", "L": [["sub", "⇔  (x ∈ A  ou  x ∈ B  ou  x ∈ C)<span class='tag'>Associativité de « ou »</span>"]]},

{"say": "Troisième étape. Regroupons les deux premiers termes. Par la définition de la réunion, x appartient à A, ou x appartient à B, équivaut à x appartient à A union B. Nous avons donc x appartient à A union B, ou x appartient à C.", "L": [["sub", "⇔  (x ∈ A ∪ B)  ou  x ∈ C<span class='tag'>Définition de ∪</span>"]]},

{"say": "Quatrième étape. Par la définition de la réunion, cela équivaut à x appartient à, A union B, union C. Comme x est arbitraire, les deux ensembles sont égaux.", "L": [["res", "⇔  x ∈ (A ∪ B) ∪ C<span class='tag'>Définition de ∪</span>"], ["res", "A ∪ (B ∪ C) = (A ∪ B) ∪ C   ∎"]]},

{"title": "Associativité de ∩", "clear": 1, "say": "Continuons avec l'associativité de l'intersection. Nous voulons démontrer que A inter, B inter C, est égal à, A inter B, inter C. Nous partons de x appartient à A inter, B inter C.", "L": [["goal", "On veut :  A ∩ (B ∩ C) = (A ∩ B) ∩ C"], ["txt", "x ∈ A ∩ (B ∩ C)"]]},

{"say": "Première étape. Par la définition de l'intersection, x appartient à A, et x appartient à B inter C. Et en appliquant de nouveau la définition, x appartient à B inter C si et seulement si x appartient à B, et x appartient à C.", "L": [["sub", "⇔  x ∈ A  et  (x ∈ B  et  x ∈ C)<span class='tag'>Définition de ∩, appliquée deux fois</span>"]]},

{"say": "Deuxième étape. Par l'associativité de la conjonction logique et, nous pouvons enlever les parenthèses : x appartient à A, et x appartient à B, et x appartient à C.", "L": [["sub", "⇔  (x ∈ A  et  x ∈ B  et  x ∈ C)<span class='tag'>Associativité de « et »</span>"]]},

{"say": "Troisième étape. Regroupons les deux premiers termes. Par la définition de l'intersection, x appartient à A, et x appartient à B, équivaut à x appartient à A inter B. Nous avons donc x appartient à A inter B, et x appartient à C.", "L": [["sub", "⇔  (x ∈ A ∩ B)  et  x ∈ C<span class='tag'>Définition de ∩</span>"]]},

{"say": "Quatrième étape. Par la définition de l'intersection, cela équivaut à x appartient à, A inter B, inter C. Comme x est arbitraire, les deux ensembles sont égaux.", "L": [["res", "⇔  x ∈ (A ∩ B) ∩ C<span class='tag'>Définition de ∩</span>"], ["res", "A ∩ (B ∩ C) = (A ∩ B) ∩ C   ∎"]]},

{"title": "Absorption de ∪", "clear": 1, "say": "Terminons par l'absorption de la réunion. Nous voulons démontrer que A union, A inter B, est égal à A. Nous partons de x appartient à A union, A inter B.", "L": [["goal", "On veut :  A ∪ (A ∩ B) = A"], ["txt", "x ∈ A ∪ (A ∩ B)"]]},

{"say": "Première étape. Par la définition de la réunion, puis celle de l'intersection, x appartient à A, ou, x appartient à A et x appartient à B.", "L": [["sub", "⇔  x ∈ A  ou  (x ∈ A  et  x ∈ B)<span class='tag'>Définition de ∪ et de ∩</span>"]]},

{"say": "Deuxième étape. Cela équivaut à x appartient à A. Si x appartient à A, la première partie de la disjonction est vraie. Réciproquement, si la disjonction est vraie, ou bien x appartient à A, ou bien x appartient à A et à B, et dans les deux cas x appartient à A.", "L": [["sub", "⇔  x ∈ A<span class='tag'>Si x ∈ A la disjonction est vraie ; et si la disjonction est vraie, x ∈ A</span>"]]},

{"say": "Troisième étape. La dernière ligne écrit de nouveau que x appartient à A. C'est l'appartenance à l'ensemble du membre de droite de l'égalité. Comme x est arbitraire, les deux ensembles sont égaux.", "L": [["res", "⇔  x ∈ A"], ["res", "A ∪ (A ∩ B) = A   ∎"]]},

{"title": "Absorption de ∩", "clear": 1, "say": "Et l'absorption de l'intersection. Nous voulons démontrer que A inter, A union B, est égal à A. Nous partons de x appartient à A inter, A union B.", "L": [["goal", "On veut :  A ∩ (A ∪ B) = A"], ["txt", "x ∈ A ∩ (A ∪ B)"]]},

{"say": "Première étape. Par la définition de l'intersection, puis celle de la réunion, x appartient à A, et, x appartient à A ou x appartient à B.", "L": [["sub", "⇔  x ∈ A  et  (x ∈ A  ou  x ∈ B)<span class='tag'>Définition de ∩ et de ∪</span>"]]},

{"say": "Deuxième étape. Cela équivaut à x appartient à A. Si x appartient à A, les deux parties de la conjonction sont vraies, car x appartient à A rend la seconde vraie. Réciproquement, si la conjonction est vraie, x appartient à A par sa première partie.", "L": [["sub", "⇔  x ∈ A<span class='tag'>Si x ∈ A la conjonction est vraie ; et si elle est vraie, x ∈ A</span>"]]},

{"say": "Troisième étape. La dernière ligne écrit de nouveau que x appartient à A. Comme x est arbitraire, les deux ensembles sont égaux.", "L": [["res", "⇔  x ∈ A"], ["res", "A ∩ (A ∪ B) = A   ∎"]]},

{"title": "Conclusion", "clear": 1, "say": "Comme les deux opérations sont internes et vérifient la commutativité, l'associativité et l'absorption, nous concluons que l'ensemble des parties de U, avec la réunion et l'intersection, est un treillis. Merci d'avoir regardé.", "L": [["res", "∪, ∩ internes dans 𝒫(U)"], ["res", "Commutativité,  Associativité,  Absorption"], ["res", "(𝒫(U), ∪, ∩) est un treillis   ∎"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' plus ').replace(/⊙/g,' fois ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Rejouer'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Reprendre'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pause';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/henri|paul|claude|remy|rémy|male|google français$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="𝒫(U) est un treillis";$('sub').textContent="Exercice · Treillis algébriques";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
