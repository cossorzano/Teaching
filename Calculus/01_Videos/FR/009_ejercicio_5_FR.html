<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ordre, borne supérieure et borne inférieure</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(15px,1.9vw,24px)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>À retenir</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Commencer</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Vitesse <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Mode enregistrement (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"fr-FR",
"meta":{"nivel": 2, "titulo": "Ordre, borne supérieure et borne inférieure", "enunciado": "Soit (B, ⊕, ⊙) un treillis, muni de la relation  a ≤ b ⇔ a ⊕ b = b.  Montrer que ≤ est un ordre partiel et que, pour tous a, b ∈ B :", "tesis": "a ⊕ b = sup{a, b},   a ⊙ b = inf{a, b}", "datos": ["(Comm ⊕)  x ⊕ y = y ⊕ x", "(Assoc ⊕)  x ⊕ (y ⊕ z) = (x ⊕ y) ⊕ z", "(Idem ⊕)  x ⊕ x = x", "(Assoc ⊙)  x ⊙ (y ⊙ z) = (x ⊙ y) ⊙ z"]},
"steps":[
{"title": "Ordre, borne supérieure et borne inférieure", "sub": "Exercice · Treillis algébriques", "clear": 1, "say": "Bonjour. Dans cette vidéo, nous allons résoudre un exercice sur les treillis algébriques. Nous irons très lentement, en écrivant chaque équation et en justifiant chaque étape.", "L": [["txt", "La somme est la borne supérieure et le produit la borne inférieure d’un ordre"]]},

{"say": "D’abord, les données. B est un ensemble muni de deux opérations, la somme et le produit du treillis, et c’est un treillis. Autrement dit, les deux opérations sont internes, commutatives, associatives, et vérifient les lois d’absorption.", "L": [["hyp", "(B, ⊕, ⊙) treillis<span class='tag'>Hypothèse</span>"]]},

{"say": "Nous allons utiliser trois propriétés de la somme. La commutativité : a plus b égale b plus a. L’associativité : a plus, b plus c, égale a plus b, plus c. Et l’idempotence, qui est un théorème des treillis : a plus a égale a. Nous les épinglons à gauche.", "pin": ["(Comm ⊕) x ⊕ y = y ⊕ x", "(Assoc ⊕) x ⊕ (y ⊕ z) = (x ⊕ y) ⊕ z", "(Idem ⊕) x ⊕ x = x"]},

{"say": "Voici maintenant la définition. Sur B, on définit une relation, inférieur ou égal, de la façon suivante : a est inférieur ou égal à b si et seulement si a plus b est égal à b. Avec des ensembles, c’est la propriété bien connue : A est inclus dans B si et seulement si A union B est égal à B.", "L": [["sub", "a ≤ b  ⇔  a ⊕ b = b<span class='tag'>Définition de ≤</span>"], ["txt", "Avec des ensembles :  A ⊆ B  ⇔  A ∪ B = B"]]},

{"say": "Nous notons la définition à gauche, sous les propriétés précédentes, car c’est la clé de l’exercice.", "pin": ["(Déf) a ≤ b ⇔ a ⊕ b = b"]},

{"say": "Ce que nous voulons démontrer comporte trois parties. Un : inférieur ou égal est une relation d’ordre partiel. Deux : la somme de a et b est la borne supérieure de l’ensemble formé par a et b. Et trois : le produit de a et b est la borne inférieure de cet ensemble. Avec des ensembles, la borne supérieure est l’union et la borne inférieure est l’intersection, pour l’inclusion.", "L": [["goal", "(1)  ≤ est une relation d’ordre partiel sur B"], ["goal", "(2)  a ⊕ b = sup{a, b}"], ["goal", "(3)  a ⊙ b = inf{a, b}<span class='tag'>Thèse</span>"], ["txt", "Avec des ensembles :  sup = ∪,   inf = ∩   (pour ⊆)"]]},

{"title": "Partie 1 : ≤ est un ordre partiel", "clear": 1, "say": "Commençons par la première partie. Une relation est un ordre partiel si elle vérifie trois propriétés : réflexive, antisymétrique et transitive. Nous les démontrons une par une.", "L": [["goal", "Réflexive :  a ≤ a"], ["goal", "Antisymétrique :  a ≤ b  et  b ≤ a  ⇒  a = b"], ["goal", "Transitive :  a ≤ b  et  b ≤ c  ⇒  a ≤ c"]]},

{"title": "Réflexivité", "clear": 1, "say": "Réflexivité. Soit a un élément quelconque de B. Nous voulons montrer que a est inférieur ou égal à a.", "L": [["txt", "Soit a ∈ B  (quelconque)"], ["goal", "Nous voulons :  a ≤ a<span class='tag'>Thèse</span>"]]},

{"say": "Par la définition, avec b égal à a, a est inférieur ou égal à a si et seulement si a plus a est égal à a.", "L": [["sub", "a ≤ a  ⇔  a ⊕ a = a<span class='tag'>Définition avec b = a</span>"]]},

{"say": "Et cette égalité est exactement l’idempotence de la somme. Donc, a est inférieur ou égal à a.", "L": [["res", "a ⊕ a = a   ⟹   a ≤ a   ∎<span class='tag'>Idempotence de ⊕</span>"]]},

{"title": "Antisymétrie", "clear": 1, "say": "Antisymétrie. Soient a et b deux éléments de B. Nous supposons que a est inférieur ou égal à b, et que b est inférieur ou égal à a. C’est une hypothèse.", "L": [["hyp", "a ≤ b   et   b ≤ a<span class='tag'>Hypothèse</span>"]]},

{"say": "Par la définition, la première inégalité signifie que a plus b est égal à b. Et la seconde signifie que b plus a est égal à a.", "L": [["hyp", "a ⊕ b = b<span class='tag'>Hypothèse (a ≤ b)</span>"], ["hyp", "b ⊕ a = a<span class='tag'>Hypothèse (b ≤ a)</span>"]]},

{"say": "Nous voulons montrer que a est égal à b. Partons du membre de gauche, a.", "L": [["goal", "Nous voulons :  a = b<span class='tag'>Thèse</span>"], ["txt", "a"]]},

{"say": "Première étape. Nous utilisons la seconde hypothèse, qui dit que b plus a est égal à a. Nous remplaçons a par b plus a.", "L": [["sub", "a  =  b ⊕ a<span class='tag'>Hypothèse : b ⊕ a = a</span>"]]},

{"say": "Deuxième étape. Nous appliquons la commutativité de la somme : b plus a est égal à a plus b.", "L": [["sub", "a  =  a ⊕ b<span class='tag'>Commutativité de ⊕</span>"]]},

{"say": "Troisième étape. Nous utilisons la première hypothèse, qui dit que a plus b est égal à b. Nous substituons.", "L": [["res", "a  =  b<span class='tag'>Hypothèse : a ⊕ b = b</span>"], ["res", "a ≤ b  et  b ≤ a   ⟹   a = b   ∎"]]},

{"title": "Transitivité", "clear": 1, "say": "Transitivité. Soient a, b et c des éléments de B. Nous supposons que a est inférieur ou égal à b, et que b est inférieur ou égal à c. C’est une hypothèse.", "L": [["hyp", "a ≤ b   et   b ≤ c<span class='tag'>Hypothèse</span>"]]},

{"say": "Par la définition, cela signifie que a plus b est égal à b, et que b plus c est égal à c.", "L": [["hyp", "a ⊕ b = b<span class='tag'>Hypothèse (a ≤ b)</span>"], ["hyp", "b ⊕ c = c<span class='tag'>Hypothèse (b ≤ c)</span>"]]},

{"say": "Nous voulons montrer que a est inférieur ou égal à c. Par la définition, cela signifie que a plus c est égal à c. Partons du membre de gauche, a plus c.", "L": [["goal", "Nous voulons :  a ⊕ c = c<span class='tag'>Thèse, par la définition de ≤</span>"], ["txt", "a ⊕ c"]]},

{"say": "Première étape. Nous utilisons la seconde hypothèse, b plus c est égal à c. Nous remplaçons le c de droite par b plus c.", "L": [["sub", "a ⊕ c  =  a ⊕ (b ⊕ c)<span class='tag'>Hypothèse : b ⊕ c = c</span>"]]},

{"say": "Deuxième étape. Nous appliquons l’associativité de la somme : a plus, b plus c, est égal à, a plus b, plus c.", "L": [["sub", "a ⊕ c  =  (a ⊕ b) ⊕ c<span class='tag'>Associativité de ⊕</span>"]]},

{"say": "Troisième étape. Nous utilisons la première hypothèse : a plus b est égal à b. Nous la surlignons et nous substituons.", "L": [["sub", "a ⊕ c  =  (<mark>a ⊕ b</mark>) ⊕ c"], ["txt", "Hypothèse :  <mark>a ⊕ b</mark> = b"], ["sub", "a ⊕ c  =  b ⊕ c<span class='tag'>Hypothèse : a ⊕ b = b</span>"]]},

{"say": "Quatrième étape. Nous utilisons de nouveau la seconde hypothèse : b plus c est égal à c.", "L": [["res", "a ⊕ c  =  c<span class='tag'>Hypothèse : b ⊕ c = c</span>"], ["res", "a ≤ b  et  b ≤ c   ⟹   a ≤ c   ∎"]]},

{"say": "Nous avons démontré les trois propriétés. Donc, inférieur ou égal est une relation d’ordre partiel sur B. La première partie est terminée.", "L": [["res", "≤ est réflexive, antisymétrique et transitive"], ["res", "≤ est un ordre partiel sur B   ∎"]]},

{"title": "Partie 2 : ⊕ est la borne supérieure", "clear": 1, "say": "Passons à la deuxième partie. Rappelons ce qu’est la borne supérieure de deux éléments. C’est le plus petit des majorants. Il faut donc démontrer deux choses : que a plus b est un majorant de a et de b, et que c’est le plus petit de tous les majorants. Avec des ensembles : l’union de A et B contient A et B, et c’est le plus petit ensemble qui le fait.", "L": [["goal", "(i)  a ⊕ b est un majorant :  a ≤ a ⊕ b   et   b ≤ a ⊕ b"], ["goal", "(ii)  C’est le plus petit : si a ≤ c et b ≤ c, alors a ⊕ b ≤ c"], ["txt", "Avec des ensembles :  A ⊆ A ∪ B,   B ⊆ A ∪ B,   et c’est le plus petit ensemble contenant A et B"]]},

{"say": "La première propriété est un résultat de base sur les treillis : a est inférieur ou égal à a plus b, et b est inférieur ou égal à a plus b. Donc a plus b est un majorant de a et de b. Nous la notons à gauche, car nous allons l’utiliser. Il reste à montrer que c’est le plus petit.", "pin": ["(Majorant) a ≤ a ⊕ b,   b ≤ a ⊕ b"]},

{"say": "Minimalité. Soit c un élément de B qui est un majorant de a et de b. Cela signifie que a est inférieur ou égal à c, et que b est inférieur ou égal à c. C’est l’hypothèse de cette partie.", "L": [["txt", "Soit c ∈ B"], ["hyp", "a ≤ c   et   b ≤ c<span class='tag'>Hypothèse : c est un majorant</span>"]]},

{"say": "Par la définition de inférieur ou égal, cela équivaut à a plus c égal à c, et b plus c égal à c.", "L": [["hyp", "a ⊕ c = c<span class='tag'>Hypothèse (a ≤ c)</span>"], ["hyp", "b ⊕ c = c<span class='tag'>Hypothèse (b ≤ c)</span>"]]},

{"say": "Nous voulons montrer que a plus b est inférieur ou égal à c. Par la définition, cela signifie que a plus b, plus c, est égal à c. Partons du membre de gauche.", "L": [["goal", "Nous voulons :  (a ⊕ b) ⊕ c = c<span class='tag'>Thèse, par la définition de ≤</span>"], ["txt", "(a ⊕ b) ⊕ c"]]},

{"say": "Première étape. Nous appliquons l’associativité de la somme : a plus b, plus c, est égal à a plus, b plus c.", "L": [["sub", "(a ⊕ b) ⊕ c  =  a ⊕ (b ⊕ c)<span class='tag'>Associativité de ⊕</span>"]]},

{"say": "Deuxième étape. Nous utilisons l’hypothèse b plus c égale c. Nous la surlignons et nous substituons.", "L": [["sub", "(a ⊕ b) ⊕ c  =  a ⊕ (<mark>b ⊕ c</mark>)"], ["txt", "Hypothèse :  <mark>b ⊕ c</mark> = c"], ["sub", "(a ⊕ b) ⊕ c  =  a ⊕ c<span class='tag'>Hypothèse : b ⊕ c = c</span>"]]},

{"say": "Troisième étape. Nous utilisons l’hypothèse a plus c égale c.", "L": [["res", "(a ⊕ b) ⊕ c  =  c<span class='tag'>Hypothèse : a ⊕ c = c</span>"]]},

{"say": "Par la définition, cette égalité signifie que a plus b est inférieur ou égal à c. Comme c était un majorant quelconque, a plus b est le plus petit de tous. Par conséquent, a plus b est la borne supérieure de a et b. Avec des ensembles, l’union est le plus petit ensemble contenant A et B. La deuxième partie est terminée.", "L": [["res", "(a ⊕ b) ⊕ c = c   ⟹   a ⊕ b ≤ c"], ["res", "a ⊕ b = sup{a, b}   ∎"], ["txt", "Avec des ensembles :  A ∪ B = sup{A, B}"]]},

{"title": "Partie 3 : ⊙ est la borne inférieure", "clear": 1, "say": "Passons à la troisième partie. La borne inférieure de deux éléments est le plus grand des minorants. Il faut montrer que a fois b est un minorant de a et de b, et que c’est le plus grand de tous les minorants. Avec des ensembles : l’intersection de A et B est incluse dans A et dans B, et c’est le plus grand ensemble qui le vérifie.", "L": [["goal", "(i)  a ⊙ b est un minorant :  a ⊙ b ≤ a   et   a ⊙ b ≤ b"], ["goal", "(ii)  C’est le plus grand : si c ≤ a et c ≤ b, alors c ≤ a ⊙ b"], ["txt", "Avec des ensembles :  A ∩ B ⊆ A,   A ∩ B ⊆ B,   et c’est le plus grand ensemble inclus dans A et dans B"]]},

{"say": "Nous allons utiliser deux résultats de base sur les treillis. Le premier : a fois b est inférieur ou égal à a, et inférieur ou égal à b. Donc a fois b est un minorant de a et de b. Le second est une caractérisation équivalente de l’ordre : x est inférieur ou égal à y si et seulement si x fois y est égal à x. Avec des ensembles : A est inclus dans B si et seulement si A inter B est égal à A. Nous utiliserons aussi l’associativité du produit : x fois, y fois z, égale x fois y, fois z. Nous les notons à gauche.", "L": [["txt", "Avec des ensembles :  A ∩ B ⊆ A,   A ∩ B ⊆ B"], ["txt", "Avec des ensembles :  A ⊆ B  ⇔  A ∩ B = A"]], "pin": ["(Minorant) a ⊙ b ≤ a,   a ⊙ b ≤ b", "(Caract) x ≤ y ⇔ x ⊙ y = x", "(Assoc ⊙) x ⊙ (y ⊙ z) = (x ⊙ y) ⊙ z"]},

{"say": "Maximalité. Soit c un élément de B qui est un minorant de a et de b. Cela signifie que c est inférieur ou égal à a, et que c est inférieur ou égal à b. C’est l’hypothèse de cette partie.", "L": [["txt", "Soit c ∈ B"], ["hyp", "c ≤ a   et   c ≤ b<span class='tag'>Hypothèse : c est un minorant</span>"]]},

{"say": "Par la caractérisation de l’ordre avec le produit, cela équivaut à c fois a égal à c, et c fois b égal à c.", "L": [["hyp", "c ⊙ a = c<span class='tag'>Hypothèse (c ≤ a), par (Caract)</span>"], ["hyp", "c ⊙ b = c<span class='tag'>Hypothèse (c ≤ b), par (Caract)</span>"]]},

{"say": "Nous voulons montrer que c est inférieur ou égal à a fois b. De nouveau par la caractérisation, cela signifie que c fois, a fois b, est égal à c. Partons du membre de gauche.", "L": [["goal", "Nous voulons :  c ⊙ (a ⊙ b) = c<span class='tag'>Thèse, par (Caract)</span>"], ["txt", "c ⊙ (a ⊙ b)"]]},

{"say": "Première étape. Nous appliquons l’associativité du produit : c fois, a fois b, est égal à, c fois a, fois b.", "L": [["sub", "c ⊙ (a ⊙ b)  =  (c ⊙ a) ⊙ b<span class='tag'>Associativité de ⊙</span>"]]},

{"say": "Deuxième étape. Nous utilisons l’hypothèse c fois a égale c. Nous la surlignons et nous substituons.", "L": [["sub", "c ⊙ (a ⊙ b)  =  (<mark>c ⊙ a</mark>) ⊙ b"], ["txt", "Hypothèse :  <mark>c ⊙ a</mark> = c"], ["sub", "c ⊙ (a ⊙ b)  =  c ⊙ b<span class='tag'>Hypothèse : c ⊙ a = c</span>"]]},

{"say": "Troisième étape. Nous utilisons l’hypothèse c fois b égale c.", "L": [["res", "c ⊙ (a ⊙ b)  =  c<span class='tag'>Hypothèse : c ⊙ b = c</span>"]]},

{"say": "Par la caractérisation, cette égalité signifie que c est inférieur ou égal à a fois b. Comme c était un minorant quelconque, a fois b est le plus grand de tous. Par conséquent, a fois b est la borne inférieure de a et b. Avec des ensembles, l’intersection est le plus grand ensemble inclus dans A et dans B. La troisième partie est terminée.", "L": [["res", "c ⊙ (a ⊙ b) = c   ⟹   c ≤ a ⊙ b"], ["res", "a ⊙ b = inf{a, b}   ∎"], ["txt", "Avec des ensembles :  A ∩ B = inf{A, B}"]]},

{"title": "Résumé", "clear": 1, "say": "En résumé. Avec la définition de inférieur ou égal par la somme, nous avons montré qu’elle est réflexive par l’idempotence, antisymétrique par la commutativité, et transitive par l’associativité. Ensuite, nous avons vu que a plus b est un majorant, et que c’est le plus petit car, si a plus c et b plus c valent c, alors a plus b, plus c, vaut aussi c. Et de même, que a fois b est un minorant et que c’est le plus grand. Avec des ensembles : l’union est la borne supérieure et l’intersection la borne inférieure pour l’inclusion. Merci d’avoir regardé.", "L": [["res", "(1)  ≤ est réflexive, antisymétrique et transitive"], ["res", "(2)  a ⊕ b = sup{a, b}"], ["res", "(3)  a ⊙ b = inf{a, b}"], ["txt", "Avec des ensembles :  ∪ est la borne supérieure,  ∩ est la borne inférieure  (pour ⊆)"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' plus ').replace(/⊙/g,' fois ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Rejouer'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Reprendre'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pause';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/henri|paul|claude|remy|rémy|male|google français$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Ordre, borne supérieure et borne inférieure";$('sub').textContent="Exercice · Treillis algébriques";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
