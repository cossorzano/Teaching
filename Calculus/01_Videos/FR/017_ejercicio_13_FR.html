<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>𝒫(U) est une algèbre de Boole</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>À retenir</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Commencer</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Vitesse <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Mode enregistrement (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"fr-FR",
"meta":{"nivel": 2, "titulo": "𝒫(U) est une algèbre de Boole", "enunciado": "Démontrer que (𝒫(U), ∪, ∩, ᶜ) est une algèbre de Boole.", "tesis": "(𝒫(U), ∪, ∩, ᶜ) est une algèbre de Boole", "datos": ["(Hypothèse)  (𝒫(U), ∪, ∩) est un treillis distributif", "(Déf c)  Aᶜ = { x ∈ U | x ∉ A }", "(Déf ∪, ∩)  x ∈ X ∪ Y ⇔ x ∈ X ou x ∈ Y,   x ∈ X ∩ Y ⇔ x ∈ X et x ∈ Y"]},
"steps":[
{"title": "𝒫(U) est une algèbre de Boole", "sub": "Exercice · Algèbre des ensembles", "clear": 1, "say": "Bonjour. Dans cette vidéo, nous allons résoudre un exercice sur l'algèbre des ensembles. Nous irons très lentement, en écrivant chaque équation et en justifiant chaque étape.", "L": [["txt", "Démontrer que l'ensemble des parties de U, avec la réunion, l'intersection et le complémentaire, est une algèbre de Boole"]]},

{"say": "D'abord, les données. U est un ensemble, et P de U est l'ensemble de ses parties. Nous savons que l'ensemble des parties de U, avec la réunion et l'intersection, est un treillis distributif.", "L": [["hyp", "(𝒫(U), ∪, ∩) est un treillis distributif<span class='tag'>Hypothèse</span>"]]},

{"say": "Pour chaque sous-ensemble A de U, nous définissons son complémentaire comme l'ensemble des x de U tels que x n'appartient pas à A.", "L": [["sub", "A<sup>c</sup> = { x ∈ U | x ∉ A }<span class='tag'>Définition du complémentaire</span>"]]},

{"say": "Ce que nous voulons démontrer. L'ensemble des parties de U, avec la réunion, l'intersection et le complémentaire, est une algèbre de Boole.", "L": [["goal", "(𝒫(U), ∪, ∩, <sup>c</sup>) est une algèbre de Boole<span class='tag'>Thèse</span>"]]},

{"say": "Pour le démontrer, nous devons vérifier deux choses, en plus du fait que c'est déjà un treillis distributif. Premièrement : l'existence d'un élément minimum, zéro, et d'un maximum, un. Deuxièmement : que tout élément A, sous-ensemble de U, admet un complément. Nous notons à gauche les définitions de la réunion et de l'intersection avec les éléments, et celle du complémentaire, que nous utiliserons.", "L": [["goal", "(1)  Il existe un élément minimum 0 et un maximum 1"], ["goal", "(2)  Tout A ⊆ U admet un complément<span class='tag'>Ce qu'il faut vérifier</span>"]], "pin": ["(Déf ∪) x ∈ X ∪ Y ⇔ x ∈ X ou x ∈ Y", "(Déf ∩) x ∈ X ∩ Y ⇔ x ∈ X et x ∈ Y", "(Déf c) x ∈ A<sup>c</sup> ⇔ x ∈ U et x ∉ A"]},

{"title": "(1) Éléments minimum et maximum", "clear": 1, "say": "Commençons par l'élément minimum. L'ensemble vide est l'élément minimum. Pour le démontrer, soit A un sous-ensemble quelconque de U. Nous vérifions deux égalités.", "L": [["txt", "Soit A ⊆ U  (quelconque)"], ["goal", "On veut :  ∅ est l'élément minimum"]]},

{"say": "Première égalité. L'ensemble vide union A est égal à A.", "L": [["sub", "∅ ∪ A = A<span class='tag'>Le vide n'ajoute aucun élément</span>"]]},

{"say": "Seconde égalité. L'ensemble vide inter A est égal à l'ensemble vide.", "L": [["sub", "∅ ∩ A = ∅<span class='tag'>Le vide n'a aucun élément en commun avec A</span>"]]},

{"say": "Donc, l'ensemble vide est l'élément minimum.", "L": [["res", "∅ est l'élément minimum   ∎"]]},

{"say": "Continuons avec l'élément maximum. L'ensemble total U est l'élément maximum. Pour le démontrer, soit A un sous-ensemble quelconque de U. Nous vérifions deux égalités.", "L": [["txt", "Soit A ⊆ U  (quelconque)"], ["goal", "On veut :  U est l'élément maximum"]], "title": "Élément maximum", "clear": 1},

{"say": "Première égalité. A union U est égal à U.", "L": [["sub", "A ∪ U = U<span class='tag'>U contient déjà tous les éléments</span>"]]},

{"say": "Seconde égalité. A inter U est égal à A.", "L": [["sub", "A ∩ U = A<span class='tag'>Les éléments de A sont dans U</span>"]]},

{"say": "Donc, l'ensemble total U est l'élément maximum.", "L": [["res", "U est l'élément maximum   ∎"]]},

{"say": "Ainsi, l'ensemble vide est l'élément neutre de la réunion, et U est l'élément neutre de l'intersection. Autrement dit, zéro est l'ensemble vide, et un est U. Nous les notons à gauche.", "L": [["res", "∅ est le neutre de ∪   (0 = ∅)"], ["res", "U est le neutre de ∩   (1 = U)"]], "title": "Éléments neutres", "clear": 1, "pin": ["(Neutres) ∅ ∪ A = A,   A ∩ U = A"]},

{"title": "(2) Existence d'un complément", "clear": 1, "say": "Passons à l'existence d'un complément. Soit A un sous-ensemble de U. Nous allons démontrer que le complémentaire de A est un complément de A. Pour cela, il faut vérifier deux conditions : A union son complémentaire est U, et A inter son complémentaire est l'ensemble vide.", "L": [["txt", "Soit A ⊆ U"], ["goal", "(a)  A ∪ A<sup>c</sup> = U"], ["goal", "(b)  A ∩ A<sup>c</sup> = ∅<span class='tag'>Les deux conditions du complément</span>"]]},

{"title": "(a) Première condition : A ∪ Aᶜ = U", "clear": 1, "say": "Première condition. Nous voulons démontrer que A union son complémentaire est égal à U. Soit x un élément de U. Nous partons de x appartient à A union le complémentaire de A.", "L": [["goal", "On veut :  A ∪ A<sup>c</sup> = U"], ["txt", "Soit x ∈ U"], ["txt", "x ∈ A ∪ A<sup>c</sup>"]]},

{"say": "Première étape. Par la définition de la réunion, x appartient à A union le complémentaire de A, si et seulement si, x appartient à A, ou x appartient au complémentaire de A.", "L": [["sub", "⇔  (x ∈ A  ou  x ∈ A<sup>c</sup>)<span class='tag'>Définition de ∪</span>"]]},

{"say": "Deuxième étape. Par la définition du complémentaire, x appartient au complémentaire de A, si et seulement si, x n'appartient pas à A. Nous avons donc : x appartient à A, ou x n'appartient pas à A.", "L": [["sub", "⇔  (x ∈ A  ou  x ∉ A)<span class='tag'>Définition du complémentaire</span>"]]},

{"say": "C'est toujours vrai : ou bien x appartient à A, ou bien il n'y appartient pas. Donc tout élément x de U appartient à A union son complémentaire. Comme de plus A et son complémentaire sont des sous-ensembles de U, leur réunion l'est aussi, et nous concluons que A union son complémentaire est égal à U.", "L": [["res", "(x ∈ A  ou  x ∉ A)  est toujours vrai<span class='tag'>Un élément appartient ou n'appartient pas à A</span>"], ["res", "A ∪ A<sup>c</sup> = U   ∎"]]},

{"title": "(b) Seconde condition : A ∩ Aᶜ = ∅", "clear": 1, "say": "Seconde condition. Nous voulons démontrer que A inter son complémentaire est égal à l'ensemble vide. Soit x un élément de U. Nous partons de x appartient à A inter le complémentaire de A.", "L": [["goal", "On veut :  A ∩ A<sup>c</sup> = ∅"], ["txt", "Soit x ∈ U"], ["txt", "x ∈ A ∩ A<sup>c</sup>"]]},

{"say": "Première étape. Par la définition de l'intersection, x appartient à A inter le complémentaire de A, si et seulement si, x appartient à A, et x appartient au complémentaire de A.", "L": [["sub", "⇔  (x ∈ A  et  x ∈ A<sup>c</sup>)<span class='tag'>Définition de ∩</span>"]]},

{"say": "Deuxième étape. Par la définition du complémentaire, x appartient au complémentaire de A, si et seulement si, x n'appartient pas à A. Nous avons donc : x appartient à A, et x n'appartient pas à A.", "L": [["sub", "⇔  (x ∈ A  et  x ∉ A)<span class='tag'>Définition du complémentaire</span>"]]},

{"say": "C'est impossible : x ne peut pas appartenir à A et ne pas appartenir à A en même temps. Donc aucun élément x n'appartient à A inter son complémentaire, et nous concluons que A inter son complémentaire est égal à l'ensemble vide.", "L": [["res", "(x ∈ A  et  x ∉ A)  est impossible<span class='tag'>Aucun x ne vérifie les deux</span>"], ["res", "A ∩ A<sup>c</sup> = ∅   ∎"]]},

{"title": "Tout élément a un complément", "clear": 1, "say": "Nous avons démontré que, pour tout sous-ensemble A de U, A union son complémentaire est U, et A inter son complémentaire est l'ensemble vide. Autrement dit, tout élément de l'ensemble des parties de U a un complément.", "L": [["res", "A ∪ A<sup>c</sup> = U<span class='tag'>Pour tout A ⊆ U</span>"], ["res", "A ∩ A<sup>c</sup> = ∅<span class='tag'>Pour tout A ⊆ U</span>"], ["res", "Tout élément de 𝒫(U) a un complément   ∎"]]},

{"title": "Conclusion", "clear": 1, "say": "Comme l'ensemble des parties de U, avec la réunion et l'intersection, est un treillis distributif, avec un élément minimum, l'ensemble vide, un élément maximum, U, et un complément pour chaque élément, nous concluons que l'ensemble des parties de U, avec la réunion, l'intersection et le complémentaire, est une algèbre de Boole. Merci d'avoir regardé.", "L": [["res", "(𝒫(U), ∪, ∩) treillis distributif"], ["res", "Minimum ∅,   maximum U"], ["res", "Tout A a pour complément A<sup>c</sup>"], ["res", "(𝒫(U), ∪, ∩, <sup>c</sup>) est une algèbre de Boole   ∎"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' plus ').replace(/⊙/g,' fois ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Rejouer'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Reprendre'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pause';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/henri|paul|claude|remy|rémy|male|google français$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="𝒫(U) est une algèbre de Boole";$('sub').textContent="Exercice · Algèbre des ensembles";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
