<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ordre dans un treillis</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(15px,1.9vw,24px)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>À retenir</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Commencer</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Vitesse <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Mode enregistrement (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"fr-FR",
"meta":{"nivel": 2, "titulo": "Ordre dans un treillis", "enunciado": "Soit (B, ⊕, ⊙) un treillis. On définit sur B la relation  x ≤ y ⇔ x ⊕ y = y.  Montrer que, pour tous a, b ∈ B :", "tesis": "a ≤ a ⊕ b,   b ≤ a ⊕ b", "datos": ["(Comm)  x ⊕ y = y ⊕ x", "(Assoc)  x ⊕ (y ⊕ z) = (x ⊕ y) ⊕ z", "(Idem)  x ⊕ x = x"]},
"steps":[
{"title": "Ordre dans un treillis", "sub": "Exercice · Treillis algébriques", "clear": 1, "say": "Bonjour. Dans cette vidéo, nous allons résoudre un exercice sur les treillis algébriques. Nous irons très lentement, en écrivant chaque équation et en justifiant chaque étape.", "L": [["txt", "Une relation d’ordre définie avec la somme du treillis"]]},

{"say": "D’abord, les données. B est un ensemble muni de deux lois, la somme et le produit du treillis, et c’est un treillis. Autrement dit, les deux lois sont internes, commutatives, associatives, et vérifient les lois d’absorption.", "L": [["hyp", "(B, ⊕, ⊙) treillis<span class='tag'>Hypothèse</span>"]]},

{"say": "Dans cet exercice, nous n’utiliserons que trois propriétés de la somme. La commutativité : a plus b égale b plus a. L’associativité : a plus, b plus c, égale a plus b, plus c. Et l’idempotence, qui est un théorème des treillis : a plus a égale a. Nous les épinglons à gauche, car nous allons les utiliser.", "pin": ["(Comm) x ⊕ y = y ⊕ x", "(Assoc) x ⊕ (y ⊕ z) = (x ⊕ y) ⊕ z", "(Idem) x ⊕ x = x"]},

{"say": "Voici maintenant la définition. Sur B, on définit une relation, inférieur ou égal, de la façon suivante. x est inférieur ou égal à y si et seulement si x plus y est égal à y. C’est une définition : la relation inférieur ou égal signifie, par définition, qu’en ajoutant x à y on obtient y. Avec des ensembles, c’est la propriété bien connue : A est inclus dans B si et seulement si A union B est égal à B.", "L": [["sub", "x ≤ y  ⇔  x ⊕ y = y<span class='tag'>Définition de ≤</span>"], ["txt", "Exemple avec des ensembles :  A ⊆ B  ⇔  A ∪ B = B"]]},

{"say": "Nous notons aussi la définition à gauche, sous les propriétés précédentes, car c’est la clé de l’exercice. Remarquez qu’elle apparaît en surbrillance dans la colonne de gauche.", "pin": ["(Déf) x ≤ y ⇔ x ⊕ y = y"]},

{"say": "Ce que nous voulons démontrer. Pour tous a et b de B, deux choses sont vraies : a est inférieur ou égal à a plus b, et b est inférieur ou égal à a plus b.", "L": [["goal", "∀ a, b ∈ B :   a ≤ a ⊕ b   et   b ≤ a ⊕ b<span class='tag'>Thèse</span>"]]},

{"title": "Partie 1 : a ≤ a ⊕ b", "clear": 1, "say": "Commençons par la première. Soient a et b deux éléments quelconques de B. Nous voulons prouver que a est inférieur ou égal à a plus b.", "L": [["txt", "Soient a, b ∈ B  (quelconques)"], ["goal", "On veut :  a ≤ a ⊕ b<span class='tag'>Thèse de cette partie</span>"]]},

{"say": "Rappelons la définition : x est inférieur ou égal à y si et seulement si x plus y est égal à y.", "L": [["hyp", "x ≤ y  ⇔  x ⊕ y = y<span class='tag'>Définition</span>"]]},

{"say": "Appliquons la définition avec x égal à a, et y égal à a plus b. C’est légitime, car la somme est interne, donc a plus b appartient à B.", "L": [["sub", "x = a,   y = a ⊕ b  ∈ B<span class='tag'>Choix (⊕ est interne)</span>"]]},

{"say": "En substituant, a est inférieur ou égal à a plus b, si et seulement si a plus, a plus b, est égal à a plus b.", "L": [["sub", "a ≤ a ⊕ b  ⇔  a ⊕ (a ⊕ b) = a ⊕ b<span class='tag'>Définition avec x=a, y=a⊕b</span>"]]},

{"say": "Il suffit donc de prouver l’égalité de droite : a plus, a plus b, est égal à a plus b. Ce n’est plus une inégalité, mais une égalité que nous pouvons démontrer avec les propriétés de la somme.", "L": [["goal", "Il suffit de prouver :  a ⊕ (a ⊕ b) = a ⊕ b<span class='tag'>Nouvelle thèse</span>"]]},

{"say": "Nous partons du membre de gauche, a plus, a plus b, et nous le transformons pas à pas jusqu’à obtenir le membre de droite.", "L": [["txt", "a ⊕ (a ⊕ b)"]]},

{"say": "Première étape. Nous appliquons l’associativité de la somme, avec x égal à a, y égal à a, et z égal à b. Nous déplaçons les parenthèses : a plus, a plus b, devient a plus a, plus b.", "L": [["sub", "a ⊕ (a ⊕ b)  =  (a ⊕ a) ⊕ b<span class='tag'>Associativité de ⊕, avec x=a, y=a, z=b</span>"]]},

{"say": "Deuxième étape. Entre les parenthèses apparaît a plus a. Par idempotence, a plus a est égal à a. Nous le surlignons.", "L": [["sub", "a ⊕ (a ⊕ b)  =  (<mark>a ⊕ a</mark>) ⊕ b"], ["txt", "Par (Idem) :  <mark>a ⊕ a</mark> = a"]]},

{"say": "Nous remplaçons ce bloc par a. Il reste a plus b.", "L": [["sub", "(<mark>a</mark>) ⊕ b"], ["res", "a ⊕ (a ⊕ b)  =  a ⊕ b<span class='tag'>Idempotence de ⊕</span>"]]},

{"say": "Nous avons prouvé l’égalité. D’après l’équivalence vue plus haut, cette égalité signifie exactement que a est inférieur ou égal à a plus b. Ceci termine la première partie.", "L": [["res", "a ⊕ (a ⊕ b) = a ⊕ b   ⟹   a ≤ a ⊕ b   ∎"]]},

{"title": "Partie 2 : b ≤ a ⊕ b", "clear": 1, "say": "Passons à la deuxième partie. Avec les mêmes a et b quelconques, nous voulons prouver que b est inférieur ou égal à a plus b. On procède de la même façon, mais il y aura ici une étape de plus, car b n’est pas en première position.", "L": [["txt", "Soient a, b ∈ B  (quelconques)"], ["goal", "On veut :  b ≤ a ⊕ b<span class='tag'>Thèse de cette partie</span>"]]},

{"say": "Appliquons la définition avec x égal à b, et y égal à a plus b, qui appartient de nouveau à B car la somme est interne.", "L": [["sub", "x = b,   y = a ⊕ b  ∈ B<span class='tag'>Choix (⊕ est interne)</span>"], ["sub", "b ≤ a ⊕ b  ⇔  b ⊕ (a ⊕ b) = a ⊕ b<span class='tag'>Définition avec x=b, y=a⊕b</span>"]]},

{"say": "Il suffit donc de prouver que b plus, a plus b, est égal à a plus b. Nous partons du membre de gauche.", "L": [["goal", "Il suffit de prouver :  b ⊕ (a ⊕ b) = a ⊕ b<span class='tag'>Nouvelle thèse</span>"], ["txt", "b ⊕ (a ⊕ b)"]]},

{"say": "Première étape. Associativité de la somme, avec x égal à b, y égal à a, et z égal à b. Nous passons de b plus, a plus b, à b plus a, plus b.", "L": [["sub", "b ⊕ (a ⊕ b)  =  (b ⊕ a) ⊕ b<span class='tag'>Associativité de ⊕, avec x=b, y=a, z=b</span>"]]},

{"say": "Deuxième étape. Nous avons maintenant b plus a entre les parenthèses, et nous voulons a plus b. Nous appliquons la commutativité : b plus a est égal à a plus b.", "L": [["sub", "(<mark>b ⊕ a</mark>) ⊕ b"], ["txt", "Par (Comm) :  <mark>b ⊕ a</mark> = a ⊕ b"], ["sub", "b ⊕ (a ⊕ b)  =  (a ⊕ b) ⊕ b<span class='tag'>Commutativité de ⊕</span>"]]},

{"say": "Troisième étape. Nous voulons regrouper les deux b. Nous appliquons de nouveau l’associativité, cette fois avec x égal à a, y égal à b, et z égal à b. Nous passons de a plus b, plus b, à a plus, b plus b.", "L": [["sub", "b ⊕ (a ⊕ b)  =  a ⊕ (b ⊕ b)<span class='tag'>Associativité de ⊕, avec x=a, y=b, z=b</span>"]]},

{"say": "Quatrième étape. Entre les parenthèses apparaît b plus b. Par idempotence, b plus b égale b. Nous le surlignons et le remplaçons.", "L": [["sub", "a ⊕ (<mark>b ⊕ b</mark>)"], ["txt", "Par (Idem) :  <mark>b ⊕ b</mark> = b"], ["res", "b ⊕ (a ⊕ b)  =  a ⊕ b<span class='tag'>Idempotence de ⊕</span>"]]},

{"say": "Nous avons prouvé l’égalité. D’après la définition, cette égalité signifie que b est inférieur ou égal à a plus b. Ceci termine la deuxième partie.", "L": [["res", "b ⊕ (a ⊕ b) = a ⊕ b   ⟹   b ≤ a ⊕ b   ∎"]]},

{"title": "Résumé", "clear": 1, "say": "En résumé. Avec la définition de inférieur ou égal, prouver que x est inférieur ou égal à y revient à prouver que x plus y est égal à y. Pour a inférieur ou égal à a plus b, il a suffi d’associer et d’utiliser l’idempotence. Pour b inférieur ou égal à a plus b, il a fallu en plus la commutativité. Ainsi, a plus b est supérieur ou égal à a et à b. Merci d’avoir regardé cette vidéo.", "L": [["res", "a ≤ a ⊕ b   (associativité + idempotence)"], ["res", "b ≤ a ⊕ b   (associativité + commutativité + associativité + idempotence)"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' plus ').replace(/⊙/g,' fois ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Rejouer'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Reprendre'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pause';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/henri|paul|claude|remy|rémy|male|google français$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Ordre dans un treillis";$('sub').textContent="Exercice · Treillis algébriques";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
