<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le corps des nombres réels</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>À retenir</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Commencer</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Vitesse <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Mode enregistrement (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"fr-FR",
"meta":{"nivel": 0, "titulo": "Le corps des nombres réels", "enunciado": "Résumé : les nombres réels comme corps ordonné complet", "datos": ["Structure de corps", "Ordre total compatible", "Propriété d'Archimède", "Majorants et minorants", "Borne supérieure et borne inférieure", "Axiome de complétude"]},
"steps":[
{"title": "Le corps des nombres réels", "sub": "Résumé : les nombres réels comme corps ordonné complet", "clear": 1, "say": "Bonjour. Dans cette vidéo, nous résumons la structure complète des nombres réels : un corps ordonné complet. Nous verrons ses ingrédients un par un : le corps, l'ordre, la propriété d'Archimède, et la complétude, avec la borne supérieure et la borne inférieure.", "L": [["txt", "Corps ordonné complet des réels"], ["sub", "(ℝ, +, ·, ≤)"]]},

{"title": "Corps ordonné complet", "clear": 1, "say": "Les nombres réels, avec l'addition, la multiplication et l'ordre, forment un corps ordonné complet. Cela veut dire trois choses : avec l'addition et la multiplication, ils forment un corps ; l'ordre est total et compatible avec les opérations ; et ils vérifient un axiome de complétude.", "L": [["goal", "(ℝ, +, ·, ≤)   corps ordonné complet"], ["txt", "1) (ℝ, +, ·)  est un corps"], ["txt", "2) ≤  est un ordre total, compatible avec + et ·"], ["txt", "3) Complétude :  axiome de la borne supérieure"]]},

{"title": "1) Corps", "clear": 1, "say": "D'abord, le corps. Pour l'addition, les nombres réels forment un groupe abélien. Pour la multiplication, les réels privés de l'ensemble qui ne contient que zéro forment un groupe abélien. Et de plus, la multiplication est distributive par rapport à l'addition : a fois, b plus c, est égal à a fois b, plus a fois c.", "L": [["goal", "(ℝ, +, ·)  est un corps"], ["res", "(ℝ, +)   groupe abélien"], ["res", "(ℝ ∖ {0}, ·)   groupe abélien"], ["res", "Distributivité :   a · (b + c) = a · b + a · c"]], "pin": ["Corps : (ℝ,+) et (ℝ∖{0},·) abéliens"]},

{"title": "2) Ordre total", "clear": 1, "say": "Ensuite, l'ordre. Inférieur ou égal est une relation d'ordre total sur les nombres réels : elle est réflexive, antisymétrique, transitive, et deux nombres quelconques peuvent toujours être comparés.", "L": [["goal", "≤  est une relation d'ordre total sur ℝ"], ["txt", "Réflexive, antisymétrique, transitive, et toute paire comparable"]], "pin": ["Ordre total ≤"]},

{"say": "Elle est compatible avec l'addition : si a est inférieur ou égal à b, alors a plus c est inférieur ou égal à b plus c. Et elle est compatible avec la multiplication : si zéro est inférieur ou égal à a, et zéro est inférieur ou égal à b, alors zéro est inférieur ou égal à a fois b. Autrement dit, le produit de deux nombres positifs ou nuls est positif ou nul.", "L": [["res", "Compatible avec l'addition :   a ≤ b  ⟹  a + c ≤ b + c"], ["res", "Compatible avec la multiplication :   0 ≤ a,  0 ≤ b  ⟹  0 ≤ a · b"]]},

{"title": "3) Propriété d'Archimède", "clear": 1, "say": "Troisièmement, la propriété d'Archimède. Pour tous nombres a et b strictement positifs, il existe un entier naturel n tel que n fois a soit strictement supérieur à b. En ajoutant a à lui-même suffisamment de fois, on dépasse n'importe quel b.", "L": [["goal", "Propriété d'Archimède"], ["res", "∀ a, b &gt; 0,   ∃ n ∈ ℕ :   n · a &gt; b"]], "pin": ["Archimède : ∀a,b>0 ∃n : n·a>b"]},

{"title": "4) Majorant", "clear": 1, "say": "Quatrièmement, nous préparons la complétude. Soit A une partie non vide des nombres réels. Un nombre réel M est un majorant de A si et seulement si, pour tout élément a de A, a est inférieur ou égal à M.", "L": [["goal", "A ⊆ ℝ,   A ≠ ∅"], ["res", "M ∈ ℝ  est un majorant de A   ⟺   ∀ a ∈ A,   a ≤ M"]], "pin": ["Majorant M : ∀a∈A, a ≤ M"]},

{"title": "5) Borne supérieure", "clear": 1, "say": "Un nombre réel s est la borne supérieure de A s'il vérifie deux conditions. Un : s est un majorant de A. Deux : pour tout majorant M de A, s est inférieur ou égal à M. Autrement dit, la borne supérieure est le plus petit des majorants.", "L": [["goal", "s ∈ ℝ  est la borne supérieure de A  si :"], ["res", "(i)   s  est un majorant de A"], ["res", "(ii)   ∀ M  majorant de A,   s ≤ M"], ["txt", "La borne supérieure est le plus petit majorant"]], "pin": ["Borne sup. s : le plus petit majorant"]},

{"title": "6) Complétude", "clear": 1, "say": "Voici maintenant l'axiome de complétude, aussi appelé axiome de la borne supérieure : toute partie non vide et majorée des réels admet une borne supérieure dans les réels. C'est la propriété qui distingue les nombres réels.", "L": [["goal", "Complétude (axiome de la borne supérieure)"], ["res", "Toute partie  A ⊆ ℝ  non vide et majorée  admet une borne supérieure dans ℝ"]], "pin": ["Complétude : toute A≠∅ majorée a sup A"]},

{"title": "7) Minorant", "clear": 1, "say": "Maintenant, l'analogue pour les minorants. Soit A une partie non vide des nombres réels. Un nombre réel m est un minorant de A si et seulement si, pour tout élément a de A, m est inférieur ou égal à a.", "L": [["goal", "A ⊆ ℝ,   A ≠ ∅"], ["res", "m ∈ ℝ  est un minorant de A   ⟺   ∀ a ∈ A,   m ≤ a"]], "pin": ["Minorant m : ∀a∈A, m ≤ a"]},

{"title": "8) Borne inférieure", "clear": 1, "say": "Un nombre réel i est la borne inférieure de A s'il vérifie deux conditions. Un : i est un minorant de A. Deux : pour tout minorant m de A, m est inférieur ou égal à i. Autrement dit, la borne inférieure est le plus grand des minorants.", "L": [["goal", "i ∈ ℝ  est la borne inférieure de A  si :"], ["res", "(i)   i  est un minorant de A"], ["res", "(ii)   ∀ m  minorant de A,   m ≤ i"], ["txt", "La borne inférieure est le plus grand minorant"]], "pin": ["Borne inf. i : le plus grand minorant"]},

{"title": "9) Complétude pour la borne inférieure", "clear": 1, "say": "Et l'axiome de complétude pour la borne inférieure : toute partie non vide et minorée des réels admet une borne inférieure dans les réels. Il est équivalent à l'axiome de la borne supérieure : il suffit d'appliquer l'axiome de la borne supérieure à l'ensemble des opposés des éléments de A.", "L": [["goal", "Complétude (axiome de la borne inférieure)"], ["res", "Toute partie  A ⊆ ℝ  non vide et minorée  admet une borne inférieure dans ℝ"], ["txt", "Équivaut à l'axiome de la borne supérieure"]], "pin": ["Complétude : toute A≠∅ minorée a inf A"]},

{"title": "Conclusion", "clear": 1, "say": "Conclusion. Ces propriétés caractérisent les nombres réels : les nombres réels sont le seul corps ordonné complet, à isomorphisme près.", "L": [["res", "ℝ  est le seul  corps ordonné complet   (à isomorphisme près)"]]},

{"title": "Résumé", "clear": 1, "say": "Résumé. Les nombres réels forment un corps, muni d'un ordre total compatible avec l'addition et la multiplication, et ils sont complets : toute partie non vide et majorée a une borne supérieure, et toute partie non vide et minorée a une borne inférieure. De plus, ils vérifient la propriété d'Archimède. Merci d'avoir regardé.", "L": [["res", "(ℝ, +, ·)  corps,   ≤  ordre total compatible"], ["res", "Complétude :  toute A ≠ ∅ majorée a  sup A"], ["res", "Toute A ≠ ∅ minorée a  inf A"], ["res", "Archimède :  ∀ a, b &gt; 0,  ∃ n ∈ ℕ :  n · a &gt; b"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' plus ').replace(/⊙/g,' fois ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Rejouer'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Reprendre'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pause';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/henri|paul|claude|remy|rémy|male|google français$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Le corps des nombres réels";$('sub').textContent="Résumé : les nombres réels comme corps ordonné complet";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
