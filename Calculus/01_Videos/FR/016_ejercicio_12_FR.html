<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>𝒫(U) est un treillis distributif</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>À retenir</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Commencer</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Vitesse <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Mode enregistrement (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"fr-FR",
"meta":{"nivel": 2, "titulo": "𝒫(U) est un treillis distributif", "enunciado": "Démontrer que (𝒫(U), ∪, ∩) est un treillis distributif.", "tesis": "(1)  A ∩ (B ∪ C) = (A ∩ B) ∪ (A ∩ C),   (2)  A ∪ (B ∩ C) = (A ∪ B) ∩ (A ∪ C)", "datos": ["(Hypothèse)  (𝒫(U), ∪, ∩) est un treillis", "(Double inclusion)  X = Y ⇔ X ⊆ Y et Y ⊆ X", "(Déf ∪, ∩)  x ∈ X ∪ Y ⇔ x ∈ X ou x ∈ Y,   x ∈ X ∩ Y ⇔ x ∈ X et x ∈ Y"]},
"steps":[
{"title": "𝒫(U) est un treillis distributif", "sub": "Exercice · Algèbre des ensembles", "clear": 1, "say": "Bonjour. Dans cette vidéo, nous allons résoudre un exercice sur l'algèbre des ensembles. Nous irons très lentement, en écrivant chaque équation et en justifiant chaque étape.", "L": [["txt", "Démontrer que l'ensemble des parties de U, avec la réunion et l'intersection, est un treillis distributif"]]},

{"say": "D'abord, les données. Nous savons déjà que l'ensemble des parties de U, avec la réunion et l'intersection, est un treillis, où la réunion joue le rôle de la borne supérieure, et l'intersection celui de la borne inférieure.", "L": [["hyp", "(𝒫(U), ∪, ∩) est un treillis<span class='tag'>Hypothèse : déjà connu</span>"], ["txt", "∪ = borne supérieure,     ∩ = borne inférieure"]]},

{"say": "Pour qu'il soit distributif, nous devons vérifier que, pour tous sous-ensembles A, B et C de U, deux égalités sont vraies. La première : A inter, B union C, est égal à, A inter B, union, A inter C. La seconde : A union, B inter C, est égal à, A union B, inter, A union C.", "L": [["txt", "Soient A, B, C ⊆ U"], ["goal", "(1)  A ∩ (B ∪ C) = (A ∩ B) ∪ (A ∩ C)<span class='tag'>Thèse</span>"], ["goal", "(2)  A ∪ (B ∩ C) = (A ∪ B) ∩ (A ∪ C)<span class='tag'>Thèse</span>"]]},

{"say": "Nous allons démontrer les deux égalités par double inclusion. Rappelons que deux ensembles sont égaux si et seulement si chacun est contenu dans l'autre. Et rappelons les définitions de la réunion et de l'intersection avec les éléments : x appartient à la réunion s'il appartient à l'un des deux ensembles, et x appartient à l'intersection s'il appartient aux deux. Nous les notons à gauche.", "L": [["sub", "X = Y  ⇔  X ⊆ Y  et  Y ⊆ X<span class='tag'>Égalité par double inclusion</span>"], ["sub", "X ⊆ Y  ⇔  (x ∈ X ⇒ x ∈ Y)<span class='tag'>Inclusion</span>"]], "pin": ["(Double inclusion) X = Y ⇔ X ⊆ Y et Y ⊆ X", "(Déf ∪) x ∈ X ∪ Y ⇔ x ∈ X ou x ∈ Y", "(Déf ∩) x ∈ X ∩ Y ⇔ x ∈ X et x ∈ Y"]},

{"title": "Première loi : A ∩ (B ∪ C) ⊆ (A ∩ B) ∪ (A ∩ C)", "clear": 1, "say": "Commençons par la première égalité. Soit x un élément de U. D'abord, nous démontrons l'inclusion de gauche à droite. Supposons que x appartient à A inter, B union C. C'est une hypothèse.", "L": [["txt", "Soit x ∈ U"], ["hyp", "x ∈ A ∩ (B ∪ C)<span class='tag'>Hypothèse</span>"], ["goal", "On veut :  x ∈ (A ∩ B) ∪ (A ∩ C)<span class='tag'>Thèse</span>"]]},

{"say": "Par la définition de l'intersection, x appartient à A, et x appartient à B union C. Et par la définition de la réunion, x appartient à B union C signifie que x appartient à B, ou x appartient à C.", "L": [["hyp", "x ∈ A   et   x ∈ B ∪ C<span class='tag'>Définition de ∩</span>"], ["hyp", "x ∈ A   et   (x ∈ B  ou  x ∈ C)<span class='tag'>Définition de ∪</span>"]]},

{"say": "Distinguons maintenant deux cas. Premier cas : x appartient à B. Comme x appartient aussi à A, par la définition de l'intersection, x appartient à A inter B.", "L": [["sub", "Cas 1 :  x ∈ B"], ["sub", "x ∈ A  et  x ∈ B   ⟹   x ∈ A ∩ B<span class='tag'>Définition de ∩</span>"]]},

{"say": "Second cas : x appartient à C. Comme x appartient aussi à A, par la définition de l'intersection, x appartient à A inter C.", "L": [["sub", "Cas 2 :  x ∈ C"], ["sub", "x ∈ A  et  x ∈ C   ⟹   x ∈ A ∩ C<span class='tag'>Définition de ∩</span>"]]},

{"say": "Dans tous les cas, x appartient à A inter B, ou x appartient à A inter C. Par la définition de la réunion, x appartient à A inter B, union, A inter C. Ceci termine cette inclusion.", "L": [["res", "x ∈ (A ∩ B) ∪ (A ∩ C)<span class='tag'>Définition de ∪, dans tous les cas</span>"], ["res", "A ∩ (B ∪ C) ⊆ (A ∩ B) ∪ (A ∩ C)   ∎"]]},

{"title": "Première loi : (A ∩ B) ∪ (A ∩ C) ⊆ A ∩ (B ∪ C)", "clear": 1, "say": "Réciproquement, démontrons l'inclusion de droite à gauche. Supposons que x appartient à A inter B, union, A inter C. C'est une hypothèse. Par la définition de la réunion, x appartient à A inter B, ou x appartient à A inter C.", "L": [["hyp", "x ∈ (A ∩ B) ∪ (A ∩ C)<span class='tag'>Hypothèse</span>"], ["hyp", "x ∈ A ∩ B   ou   x ∈ A ∩ C<span class='tag'>Définition de ∪</span>"], ["goal", "On veut :  x ∈ A ∩ (B ∪ C)<span class='tag'>Thèse</span>"]]},

{"say": "Dans tous les cas, x appartient à A. Si x appartient à A inter B, alors x appartient à A et à B. Et si x appartient à A inter C, alors x appartient à A et à C. De plus, dans le premier cas x appartient à B, et dans le second x appartient à C. Autrement dit, x appartient à A, et x appartient à B ou x appartient à C.", "L": [["sub", "x ∈ A   et   (x ∈ B  ou  x ∈ C)<span class='tag'>Définition de ∩ dans chaque cas</span>"]]},

{"say": "Par la définition de la réunion, x appartient à B ou x appartient à C signifie que x appartient à B union C.", "L": [["sub", "x ∈ A   et   x ∈ B ∪ C<span class='tag'>Définition de ∪</span>"]]},

{"say": "Donc, par la définition de l'intersection, x appartient à A inter, B union C. Ceci termine cette inclusion.", "L": [["res", "x ∈ A ∩ (B ∪ C)<span class='tag'>Définition de ∩</span>"], ["res", "(A ∩ B) ∪ (A ∩ C) ⊆ A ∩ (B ∪ C)   ∎"]]},

{"title": "Première loi distributive", "clear": 1, "say": "Nous avons démontré les deux inclusions. Par double inclusion, nous concluons la première égalité : A inter, B union C, est égal à, A inter B, union, A inter C.", "L": [["res", "A ∩ (B ∪ C) = (A ∩ B) ∪ (A ∩ C)   ∎<span class='tag'>Double inclusion</span>"]]},

{"title": "Seconde loi (1) : A ∪ (B ∩ C) ⊆ (A ∪ B) ∩ (A ∪ C)", "clear": 1, "say": "Démontrons maintenant la seconde loi distributive, également par double inclusion. Soit x un élément de U. Commençons par la partie un : démontrer que A union, B inter C, est contenu dans, A union B, inter, A union C. Supposons que x appartient à A union, B inter C. C'est une hypothèse.", "L": [["txt", "Soit x ∈ U"], ["hyp", "x ∈ A ∪ (B ∩ C)<span class='tag'>Hypothèse</span>"], ["goal", "On veut :  x ∈ (A ∪ B) ∩ (A ∪ C)<span class='tag'>Thèse</span>"]]},

{"say": "Par la définition de la réunion, x appartient à A, ou x appartient à B inter C. Distinguons deux cas.", "L": [["hyp", "x ∈ A   ou   x ∈ B ∩ C<span class='tag'>Définition de ∪</span>"]]},

{"say": "Premier cas : x appartient à A. Alors, clairement, x appartient à A union B, et x appartient à A union C, par la définition de la réunion. Donc x appartient à l'intersection des deux réunions.", "L": [["sub", "Cas 1 :  x ∈ A"], ["sub", "x ∈ A ∪ B   et   x ∈ A ∪ C<span class='tag'>Définition de ∪</span>"], ["res", "x ∈ (A ∪ B) ∩ (A ∪ C)<span class='tag'>Définition de ∩</span>"]]},

{"say": "Second cas : x appartient à B inter C. Alors x appartient à B, et x appartient à C. En particulier, x appartient à A union B, car x appartient à B. Et x appartient à A union C, car x appartient à C. Donc x appartient à l'intersection des deux réunions.", "L": [["sub", "Cas 2 :  x ∈ B ∩ C   ⟹   x ∈ B  et  x ∈ C<span class='tag'>Définition de ∩</span>"], ["sub", "x ∈ A ∪ B  (car x ∈ B)   et   x ∈ A ∪ C  (car x ∈ C)<span class='tag'>Définition de ∪</span>"], ["res", "x ∈ (A ∪ B) ∩ (A ∪ C)<span class='tag'>Définition de ∩</span>"]]},

{"say": "Dans les deux cas, x appartient à A union B, inter, A union C. Et donc, A union, B inter C, est contenu dans, A union B, inter, A union C.", "L": [["res", "A ∪ (B ∩ C) ⊆ (A ∪ B) ∩ (A ∪ C)   ∎<span class='tag'>Dans les deux cas</span>"]]},

{"title": "Seconde loi (2) : (A ∪ B) ∩ (A ∪ C) ⊆ A ∪ (B ∩ C)", "clear": 1, "say": "Passons à la partie deux : démontrer que A union B, inter, A union C, est contenu dans, A union, B inter C. Supposons maintenant que x appartient à A union B, inter, A union C. C'est une hypothèse.", "L": [["hyp", "x ∈ (A ∪ B) ∩ (A ∪ C)<span class='tag'>Hypothèse</span>"], ["goal", "On veut :  x ∈ A ∪ (B ∩ C)<span class='tag'>Thèse</span>"]]},

{"say": "Par la définition de l'intersection, x appartient à A union B, et x appartient à A union C. Et par la définition de la réunion, cela signifie : x appartient à A ou x appartient à B, et aussi, x appartient à A ou x appartient à C.", "L": [["hyp", "x ∈ A ∪ B   et   x ∈ A ∪ C<span class='tag'>Définition de ∩</span>"], ["hyp", "(x ∈ A  ou  x ∈ B)   et   (x ∈ A  ou  x ∈ C)<span class='tag'>Définition de ∪</span>"]]},

{"say": "Premier cas : supposons que x appartient à A. C'est une hypothèse. Alors, clairement, x appartient à A union, B inter C, par la définition de la réunion, et c'est terminé.", "L": [["hyp", "Cas :  x ∈ A<span class='tag'>Hypothèse du cas</span>"], ["res", "x ∈ A ∪ (B ∩ C)<span class='tag'>Définition de ∪ : c'est terminé</span>"]]},

{"say": "Second cas : supposons donc que x n'appartient pas à A. C'est une hypothèse. Sous cette supposition, les conditions précédentes donnent ce qui suit.", "L": [["hyp", "Cas :  x ∉ A<span class='tag'>Hypothèse du cas</span>"]]},

{"say": "De x appartient à A union B, et x n'appartient pas à A, il découle que x appartient à B.", "L": [["sub", "x ∈ A ∪ B   et   x ∉ A   ⟹   x ∈ B<span class='tag'>Si x ∈ A ou x ∈ B, et x ∉ A, alors x ∈ B</span>"]]},

{"say": "De x appartient à A union C, et x n'appartient pas à A, il découle que x appartient à C.", "L": [["sub", "x ∈ A ∪ C   et   x ∉ A   ⟹   x ∈ C<span class='tag'>Si x ∈ A ou x ∈ C, et x ∉ A, alors x ∈ C</span>"]]},

{"say": "Donc, x appartient à B, et x appartient à C. Autrement dit, par la définition de l'intersection, x appartient à B inter C.", "L": [["sub", "x ∈ B   et   x ∈ C   ⟹   x ∈ B ∩ C<span class='tag'>Définition de ∩</span>"]]},

{"say": "Par conséquent, par la définition de la réunion, x appartient à A union, B inter C.", "L": [["res", "x ∈ A ∪ (B ∩ C)<span class='tag'>Définition de ∪</span>"]]},

{"say": "Nous avons démontré que dans tous les cas x appartient à A union, B inter C. Donc, A union B, inter, A union C, est contenu dans, A union, B inter C.", "L": [["res", "(A ∪ B) ∩ (A ∪ C) ⊆ A ∪ (B ∩ C)   ∎<span class='tag'>Dans tous les cas</span>"]]},

{"title": "Seconde loi distributive", "clear": 1, "say": "Des parties un et deux, par double inclusion, nous concluons l'égalité : A union, B inter C, est égal à, A union B, inter, A union C. Autrement dit, la réunion est distributive sur l'intersection.", "L": [["res", "A ∪ (B ∩ C) = (A ∪ B) ∩ (A ∪ C)   ∎<span class='tag'>Double inclusion : la réunion est distributive sur l'intersection</span>"]]},

{"title": "Conclusion", "clear": 1, "say": "Comme les deux lois distributives sont vérifiées dans l'ensemble des parties de U, avec la réunion et l'intersection, nous concluons que c'est un treillis distributif. Merci d'avoir regardé.", "L": [["res", "A ∩ (B ∪ C) = (A ∩ B) ∪ (A ∩ C)<span class='tag'>L'intersection est distributive sur la réunion</span>"], ["res", "A ∪ (B ∩ C) = (A ∪ B) ∩ (A ∪ C)<span class='tag'>La réunion est distributive sur l'intersection</span>"], ["res", "(𝒫(U), ∪, ∩) est un treillis distributif   ∎"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' plus ').replace(/⊙/g,' fois ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Rejouer'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Reprendre'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pause';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/henri|paul|claude|remy|rémy|male|google français$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="𝒫(U) est un treillis distributif";$('sub').textContent="Exercice · Algèbre des ensembles";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
