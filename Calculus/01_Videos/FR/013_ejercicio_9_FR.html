<html lang="fr"><head><meta charset="utf-8">

<title>Lois de De Morgan</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}

#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}

</style></head><body><div id="app">

<script type="application/json" id="data">
{"lang":"fr-FR",
"meta":{"nivel": 3, "titulo": "Lois de De Morgan", "enunciado": "Soit (B, ⊕, ⊙, ∼) une algèbre de Boole.  Montrer que, pour tous a, b ∈ B, les lois de De Morgan sont vérifiées :", "tesis": "∼(a ⊕ b) = ∼a ⊙ ∼b,   ∼(a ⊙ b) = ∼a ⊕ ∼b", "datos": ["(Dist)  x ⊕ (y ⊙ z) = (x ⊕ y) ⊙ (x ⊕ z),   x ⊙ (y ⊕ z) = (x ⊙ y) ⊕ (x ⊙ z)", "(Compl)  x ⊕ ∼x = 1,   x ⊙ ∼x = 0", "(Dom)  x ⊕ 1 = 1,   x ⊙ 0 = 0", "(Unic)  x ⊕ y = 1 et x ⊙ y = 0 ⇒ y = ∼x"]},
"steps":[
{"title": "Lois de De Morgan", "sub": "Exercice · Algèbre de Boole", "clear": 1, "say": "Bonjour. Dans cette vidéo, nous allons résoudre un exercice sur les algèbres de Boole. Nous irons très lentement, en écrivant chaque équation et en justifiant chaque étape.", "L": [["txt", "Les lois de De Morgan"]]},

{"say": "D’abord, les données. B est un ensemble muni de deux opérations, la somme et le produit, et d’une opération complémentaire, que nous notons avec un tilde. C’est une algèbre de Boole : un treillis distributif avec un plus petit élément zéro, un plus grand élément un, et un complémentaire pour chaque élément. L’exemple typique est l’ensemble des parties d’un ensemble U, avec l’union, l’intersection et le complémentaire.", "L": [["hyp", "(B, ⊕, ⊙, ∼) algèbre de Boole<span class='tag'>Hypothèse</span>"], ["txt", "Avec des ensembles :  (𝒫(U), ∪, ∩, complémentaire),   0 = ∅,   1 = U"]]},

{"say": "Nous allons utiliser beaucoup de propriétés, alors nous les notons toutes à gauche. D’abord, la commutativité et l’associativité de la somme et du produit.", "pin": ["(Comm ⊕) x ⊕ y = y ⊕ x", "(Comm ⊙) x ⊙ y = y ⊙ x", "(Assoc ⊕) x ⊕ (y ⊕ z) = (x ⊕ y) ⊕ z", "(Assoc ⊙) x ⊙ (y ⊙ z) = (x ⊙ y) ⊙ z"]},

{"say": "Ensuite, la distributivité. Un treillis distributif vérifie que chaque opération est distributive par rapport à l’autre. Les deux premières formules sont celles de la définition. Les deux autres sont les mêmes avec les facteurs échangés, et elles découlent de la commutativité.", "pin": ["(Dist 1) x ⊕ (y ⊙ z) = (x ⊕ y) ⊙ (x ⊕ z)", "(Dist 2) x ⊙ (y ⊕ z) = (x ⊙ y) ⊕ (x ⊙ z)", "(Dist 3) (x ⊕ y) ⊙ z = (x ⊙ z) ⊕ (y ⊙ z)", "(Dist 4) (x ⊙ y) ⊕ z = (x ⊕ z) ⊙ (y ⊕ z)"]},

{"say": "Troisièmement, les éléments neutres et les complémentaires. Zéro est neutre pour la somme, et un est neutre pour le produit. Et la définition du complémentaire : x plus son complémentaire égale un, et x fois son complémentaire égale zéro. Les égalités avec les termes échangés découlent de la commutativité.", "pin": ["(Neutre ⊕) x ⊕ 0 = x = 0 ⊕ x", "(Neutre ⊙) x ⊙ 1 = x = 1 ⊙ x", "(Compl) x ⊕ ∼x = 1,   x ⊙ ∼x = 0"]},

{"say": "Et quatrièmement, deux théorèmes connus des algèbres de Boole. Les lois de domination : x plus un égale un, et x fois zéro égale zéro, aussi avec les termes échangés. Et l’unicité du complémentaire : si x plus y égale un, et x fois y égale zéro, alors y est le complémentaire de x.", "pin": ["(Dom) x ⊕ 1 = 1 = 1 ⊕ x", "(Dom) x ⊙ 0 = 0 = 0 ⊙ x", "(Unic) x ⊕ y = 1 et x ⊙ y = 0 ⇒ y = ∼x"]},

{"say": "Ce que nous voulons démontrer. Pour tous a et b de B, le complémentaire de a plus b est égal au complémentaire de a, fois le complémentaire de b. Et le complémentaire de a fois b est égal au complémentaire de a, plus le complémentaire de b. Ce sont les lois de De Morgan. Avec des ensembles : le complémentaire de A union B est le complémentaire de A inter le complémentaire de B. Et le complémentaire de A inter B est le complémentaire de A union le complémentaire de B.", "L": [["goal", "∀ a, b ∈ B:   ∼(a ⊕ b) = ∼a ⊙ ∼b<span class='tag'>Thèse (1)</span>"], ["goal", "∼(a ⊙ b) = ∼a ⊕ ∼b<span class='tag'>Thèse (2)</span>"], ["txt", "Avec des ensembles :  (A ∪ B)<sup>c</sup> = A<sup>c</sup> ∩ B<sup>c</sup>"], ["txt", "Avec des ensembles :  (A ∩ B)<sup>c</sup> = A<sup>c</sup> ∪ B<sup>c</sup>"]]},

{"title": "Partie 1 : ∼(a ⊕ b) = ∼a ⊙ ∼b", "clear": 1, "say": "Commençons par la première loi. Soient a et b deux éléments quelconques de B. Il suffit de montrer que le complémentaire de a fois le complémentaire de b est le complémentaire de a plus b. Par l’unicité du complémentaire, cela revient à vérifier deux conditions.", "L": [["txt", "Soient a, b ∈ B  (quelconques)"], ["sub", "x = a ⊕ b,   y = ∼a ⊙ ∼b<span class='tag'>Choix dans (Unic)</span>"]]},

{"say": "Autrement dit, il suffit de montrer deux égalités. Première : a plus b, plus, le complémentaire de a fois le complémentaire de b, égale un. Seconde : a plus b, fois, le complémentaire de a fois le complémentaire de b, égale zéro.", "L": [["goal", "(i)   (a ⊕ b) ⊕ (∼a ⊙ ∼b) = 1"], ["goal", "(ii)  (a ⊕ b) ⊙ (∼a ⊙ ∼b) = 0<span class='tag'>Nouvelle thèse</span>"]]},

{"title": "Condition (i)", "clear": 1, "say": "Première condition. Nous voulons montrer que a plus b, plus, le complémentaire de a fois le complémentaire de b, est égal à un. Partons du membre de gauche et transformons-le étape par étape.", "L": [["goal", "Nous voulons :  (a ⊕ b) ⊕ (∼a ⊙ ∼b) = 1"], ["txt", "(a ⊕ b) ⊕ (∼a ⊙ ∼b)"]]},

{"say": "Première étape. Nous appliquons la distributivité de la somme par rapport au produit, avec x égal à a plus b, y égal au complémentaire de a, et z égal au complémentaire de b. Nous obtenons un produit de deux facteurs : a plus b, plus le complémentaire de a, fois, a plus b, plus le complémentaire de b.", "L": [["sub", "= ((a ⊕ b) ⊕ ∼a) ⊙ ((a ⊕ b) ⊕ ∼b)<span class='tag'>Distributivité : x ⊕ (y ⊙ z) = (x ⊕ y) ⊙ (x ⊕ z)</span>"]]},

{"say": "Deuxième étape. Nous réorganisons chaque facteur avec l’associativité et la commutativité de la somme, pour que chaque élément soit à côté de son complémentaire. Dans le premier facteur, a plus b, plus le complémentaire de a, devient a plus son complémentaire, plus b. Dans le second facteur, a plus b, plus le complémentaire de b, devient a plus, b plus son complémentaire.", "L": [["sub", "= ((a ⊕ ∼a) ⊕ b) ⊙ (a ⊕ (b ⊕ ∼b))<span class='tag'>Associativité et commutativité de ⊕</span>"]]},

{"say": "Troisième étape. Par la définition du complémentaire, a plus son complémentaire égale un, et b plus son complémentaire égale un.", "L": [["sub", "= (1 ⊕ b) ⊙ (a ⊕ 1)<span class='tag'>Complémentaire : a ⊕ ∼a = 1,  b ⊕ ∼b = 1</span>"]]},

{"say": "Quatrième étape. Par la loi de domination, un plus b égale un, et a plus un égale un.", "L": [["sub", "= 1 ⊙ 1<span class='tag'>Domination : 1 ⊕ b = 1,  a ⊕ 1 = 1</span>"]]},

{"say": "Cinquième étape. Un est l’élément neutre du produit, donc un fois un égale un. La première condition est terminée.", "L": [["res", "= 1   ∎<span class='tag'>Neutre de ⊙</span>"]]},

{"title": "Condition (ii)", "clear": 1, "say": "Seconde condition. Nous voulons montrer que a plus b, fois, le complémentaire de a fois le complémentaire de b, est égal à zéro. Partons du membre de gauche.", "L": [["goal", "Nous voulons :  (a ⊕ b) ⊙ (∼a ⊙ ∼b) = 0"], ["txt", "(a ⊕ b) ⊙ (∼a ⊙ ∼b)"]]},

{"say": "Première étape. Associativité du produit, avec x égal à a plus b, y égal au complémentaire de a, et z égal au complémentaire de b.", "L": [["sub", "= ((a ⊕ b) ⊙ ∼a) ⊙ ∼b<span class='tag'>Associativité de ⊙</span>"]]},

{"say": "Deuxième étape. Distributivité du produit par rapport à la somme, dans la parenthèse intérieure, avec x égal à a, y égal à b, et z égal au complémentaire de a. A plus b, fois le complémentaire de a, devient a fois son complémentaire, plus, b fois le complémentaire de a.", "L": [["sub", "= ((a ⊙ ∼a) ⊕ (b ⊙ ∼a)) ⊙ ∼b<span class='tag'>Distributivité : (x ⊕ y) ⊙ z = (x ⊙ z) ⊕ (y ⊙ z)</span>"]]},

{"say": "Troisième étape. Par la définition du complémentaire, a fois son complémentaire égale zéro.", "L": [["sub", "= (0 ⊕ (b ⊙ ∼a)) ⊙ ∼b<span class='tag'>Complémentaire : a ⊙ ∼a = 0</span>"]]},

{"say": "Quatrième étape. Zéro est l’élément neutre de la somme : zéro plus x égale x. Donc zéro plus, b fois le complémentaire de a, égale b fois le complémentaire de a.", "L": [["sub", "= (b ⊙ ∼a) ⊙ ∼b<span class='tag'>Neutre de ⊕ : 0 ⊕ x = x</span>"]]},

{"say": "Cinquième étape. Nous utilisons l’associativité et la commutativité du produit. Nous partons de b fois le complémentaire de a, le tout fois le complémentaire de b. Nous réordonnons les facteurs pour que b soit à côté de son complémentaire, et nous obtenons b fois, le complémentaire de b fois le complémentaire de a.", "L": [["sub", "= b ⊙ (∼b ⊙ ∼a)<span class='tag'>Commutativité et associativité de ⊙</span>"]]},

{"say": "Sixième étape. Associativité du produit, avec x égal à b, y égal au complémentaire de b, et z égal au complémentaire de a. Nous passons de b fois, le complémentaire de b fois le complémentaire de a, à, b fois son complémentaire, le tout fois le complémentaire de a.", "L": [["sub", "= (b ⊙ ∼b) ⊙ ∼a<span class='tag'>Associativité de ⊙</span>"]]},

{"say": "Septième étape. Par la définition du complémentaire, b fois son complémentaire égale zéro.", "L": [["sub", "= 0 ⊙ ∼a<span class='tag'>Complémentaire : b ⊙ ∼b = 0</span>"]]},

{"say": "Huitième étape. Par la loi de domination, zéro fois x égale zéro. La seconde condition est terminée.", "L": [["res", "= 0   ∎<span class='tag'>Domination : 0 ⊙ x = 0</span>"]]},

{"title": "Conclusion de la partie 1", "clear": 1, "say": "Comme le complémentaire de a fois le complémentaire de b vérifie les deux conditions, c’est le complémentaire de a plus b. Et par l’unicité du complémentaire dans un treillis distributif, nous obtenons la première loi de De Morgan. Avec des ensembles : le complémentaire de A union B est le complémentaire de A inter le complémentaire de B.", "L": [["res", "∼a ⊙ ∼b est le complémentaire de a ⊕ b"], ["res", "∼(a ⊕ b) = ∼a ⊙ ∼b   ∎<span class='tag'>Unicité du complémentaire</span>"], ["txt", "Avec des ensembles :  (A ∪ B)<sup>c</sup> = A<sup>c</sup> ∩ B<sup>c</sup>"]]},

{"title": "Partie 2 : ∼(a ⊙ b) = ∼a ⊕ ∼b", "clear": 1, "say": "Passons à la seconde loi. Soient a et b deux éléments quelconques de B. De nouveau, il suffit de montrer que le complémentaire de a plus le complémentaire de b est le complémentaire de a fois b. Par l’unicité du complémentaire, cela revient à vérifier deux conditions.", "L": [["txt", "Soient a, b ∈ B  (quelconques)"], ["sub", "x = a ⊙ b,   y = ∼a ⊕ ∼b<span class='tag'>Choix dans (Unic)</span>"]]},

{"say": "Autrement dit, il suffit de montrer deux égalités. Première : a fois b, plus, le complémentaire de a plus le complémentaire de b, égale un. Seconde : a fois b, fois, le complémentaire de a plus le complémentaire de b, égale zéro.", "L": [["goal", "(i)   (a ⊙ b) ⊕ (∼a ⊕ ∼b) = 1"], ["goal", "(ii)  (a ⊙ b) ⊙ (∼a ⊕ ∼b) = 0<span class='tag'>Nouvelle thèse</span>"]]},

{"title": "Condition (i)", "clear": 1, "say": "Première condition. Nous voulons montrer que a fois b, plus, le complémentaire de a plus le complémentaire de b, est égal à un. Partons du membre de gauche.", "L": [["goal", "Nous voulons :  (a ⊙ b) ⊕ (∼a ⊕ ∼b) = 1"], ["txt", "(a ⊙ b) ⊕ (∼a ⊕ ∼b)"]]},

{"say": "Première étape. Associativité de la somme, avec x égal à a fois b, y égal au complémentaire de a, et z égal au complémentaire de b.", "L": [["sub", "= ((a ⊙ b) ⊕ ∼a) ⊕ ∼b<span class='tag'>Associativité de ⊕</span>"]]},

{"say": "Deuxième étape. Distributivité de la somme par rapport au produit, dans la parenthèse intérieure, avec x égal à a, y égal à b, et z égal au complémentaire de a. A fois b, plus le complémentaire de a, devient a plus son complémentaire, fois, b plus le complémentaire de a.", "L": [["sub", "= ((a ⊕ ∼a) ⊙ (b ⊕ ∼a)) ⊕ ∼b<span class='tag'>Distributivité : (x ⊙ y) ⊕ z = (x ⊕ z) ⊙ (y ⊕ z)</span>"]]},

{"say": "Troisième étape. Par la définition du complémentaire, a plus son complémentaire égale un.", "L": [["sub", "= (1 ⊙ (b ⊕ ∼a)) ⊕ ∼b<span class='tag'>Complémentaire : a ⊕ ∼a = 1</span>"]]},

{"say": "Quatrième étape. Un est l’élément neutre du produit : un fois x égale x. Donc un fois, b plus le complémentaire de a, égale b plus le complémentaire de a.", "L": [["sub", "= (b ⊕ ∼a) ⊕ ∼b<span class='tag'>Neutre de ⊙ : 1 ⊙ x = x</span>"]]},

{"say": "Cinquième étape. Avec la commutativité et l’associativité de la somme, nous rapprochons b de son complémentaire. D’abord nous commutons b avec le complémentaire de a, puis nous associons. Le résultat est le complémentaire de a plus, b plus son complémentaire.", "L": [["sub", "= ∼a ⊕ (b ⊕ ∼b)<span class='tag'>Commutativité et associativité de ⊕</span>"]]},

{"say": "Sixième étape. Par la définition du complémentaire, b plus son complémentaire égale un.", "L": [["sub", "= ∼a ⊕ 1<span class='tag'>Complémentaire : b ⊕ ∼b = 1</span>"]]},

{"say": "Septième étape. Par la loi de domination, x plus un égale un. La première condition est terminée.", "L": [["res", "= 1   ∎<span class='tag'>Domination : x ⊕ 1 = 1</span>"]]},

{"title": "Condition (ii)", "clear": 1, "say": "Seconde condition. Nous voulons montrer que a fois b, fois, le complémentaire de a plus le complémentaire de b, est égal à zéro. Partons du membre de gauche.", "L": [["goal", "Nous voulons :  (a ⊙ b) ⊙ (∼a ⊕ ∼b) = 0"], ["txt", "(a ⊙ b) ⊙ (∼a ⊕ ∼b)"]]},

{"say": "Première étape. Distributivité du produit par rapport à la somme, avec x égal à a fois b, y égal au complémentaire de a, et z égal au complémentaire de b. Nous obtenons une somme de deux termes : a fois b, fois le complémentaire de a, plus, a fois b, fois le complémentaire de b.", "L": [["sub", "= ((a ⊙ b) ⊙ ∼a) ⊕ ((a ⊙ b) ⊙ ∼b)<span class='tag'>Distributivité : x ⊙ (y ⊕ z) = (x ⊙ y) ⊕ (x ⊙ z)</span>"]]},

{"say": "Deuxième étape. Nous réorganisons chaque terme avec l’associativité et la commutativité du produit, pour que chaque élément soit à côté de son complémentaire. Dans le premier terme, a fois b, fois le complémentaire de a, devient a fois son complémentaire, fois b. Dans le second, a fois b, fois le complémentaire de b, devient a fois, b fois son complémentaire.", "L": [["sub", "= ((a ⊙ ∼a) ⊙ b) ⊕ (a ⊙ (b ⊙ ∼b))<span class='tag'>Associativité et commutativité de ⊙</span>"]]},

{"say": "Troisième étape. Par la définition du complémentaire, a fois son complémentaire égale zéro, et b fois son complémentaire égale zéro.", "L": [["sub", "= (0 ⊙ b) ⊕ (a ⊙ 0)<span class='tag'>Complémentaire : a ⊙ ∼a = 0,  b ⊙ ∼b = 0</span>"]]},

{"say": "Quatrième étape. Par la loi de domination, zéro fois b égale zéro, et a fois zéro égale zéro.", "L": [["sub", "= 0 ⊕ 0<span class='tag'>Domination : 0 ⊙ b = 0,  a ⊙ 0 = 0</span>"]]},

{"say": "Cinquième étape. Zéro est l’élément neutre de la somme, et on peut aussi y voir l’idempotence de la somme : zéro plus zéro égale zéro. La seconde condition est terminée.", "L": [["res", "= 0   ∎<span class='tag'>Idempotence / neutre de ⊕</span>"]]},

{"title": "Conclusion de la partie 2", "clear": 1, "say": "Comme le complémentaire de a plus le complémentaire de b vérifie les deux conditions, c’est le complémentaire de a fois b. Et par l’unicité du complémentaire, nous obtenons la seconde loi de De Morgan. Avec des ensembles : le complémentaire de A inter B est le complémentaire de A union le complémentaire de B.", "L": [["res", "∼a ⊕ ∼b est le complémentaire de a ⊙ b"], ["res", "∼(a ⊙ b) = ∼a ⊕ ∼b   ∎<span class='tag'>Unicité du complémentaire</span>"], ["txt", "Avec des ensembles :  (A ∩ B)<sup>c</sup> = A<sup>c</sup> ∪ B<sup>c</sup>"]]},

{"title": "Résumé", "clear": 1, "say": "En résumé. Dans les deux lois, l’unicité du complémentaire nous permet de ne pas calculer directement le complémentaire, mais de vérifier les deux conditions. Dans chacune, nous utilisons la distributivité, nous regroupons chaque élément avec son complémentaire, et nous appliquons les neutres et la domination. Avec des ensembles : le complémentaire de l’union est l’intersection des complémentaires, et le complémentaire de l’intersection est l’union des complémentaires. Merci d’avoir regardé.", "L": [["res", "∼(a ⊕ b) = ∼a ⊙ ∼b"], ["res", "∼(a ⊙ b) = ∼a ⊕ ∼b"], ["txt", "Avec des ensembles :  (A ∪ B)<sup>c</sup> = A<sup>c</sup> ∩ B<sup>c</sup>,   (A ∩ B)<sup>c</sup> = A<sup>c</sup> ∪ B<sup>c</sup>"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' plus ').replace(/⊙/g,' fois ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Rejouer'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Reprendre'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pause';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/henri|paul|claude|remy|rémy|male|google français$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
