<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Différence et différence symétrique</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>À retenir</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Commencer</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Vitesse <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Mode enregistrement (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"fr-FR",
"meta":{"nivel": 2, "titulo": "Différence et différence symétrique", "enunciado": "Démontrer que, pour tous ensembles A et B, on a :", "tesis": "A ∖ B = A △ (A ∩ B)", "datos": ["(Déf △)  X △ Y = (X ∖ Y) ∪ (Y ∖ X)"]},
"steps":[
{"title": "A ∖ B = A △ (A ∩ B)", "sub": "Exercice · Algèbre des ensembles", "clear": 1, "say": "Bonjour. Dans cette vidéo, nous allons démontrer que A moins B est égal à la différence symétrique de A avec l'intersection de A et B. Nous raisonnerons élément par élément, très lentement, en écrivant chaque équation et en justifiant chaque étape.", "L": [["txt", "Démontrer que  A ∖ B = A △ (A ∩ B)"]]},

{"say": "Ce que nous voulons démontrer. Pour tous ensembles A et B, A moins B est égal à A différence symétrique, l'intersection de A et B. Nous rappelons à gauche les définitions que nous allons utiliser : la différence symétrique, la différence, l'intersection et la réunion avec les éléments ; le fait que l'ensemble vide n'a pas d'éléments ; et le fait que deux ensembles sont égaux quand chacun est inclus dans l'autre.", "L": [["goal", "A ∖ B = A △ (A ∩ B)<span class='tag'>Démontrer, pour tous A et B</span>"]], "pin": ["(Déf △) X △ Y = (X ∖ Y) ∪ (Y ∖ X)", "(Déf ∖) x ∈ X ∖ Y  ⟺  x ∈ X  et  x ∉ Y", "(Déf ∩) x ∈ X ∩ Y  ⟺  x ∈ X  et  x ∈ Y", "(Déf ∪) x ∈ X ∪ Y  ⟺  x ∈ X  ou  x ∈ Y", "(Déf ∅) aucun x ne vérifie  x ∈ ∅", "(Déf =) X = Y  ⟺  X ⊆ Y  et  Y ⊆ X"]},

{"title": "Point de départ", "clear": 1, "say": "D'abord, rappelons la définition de la différence symétrique : X différence symétrique Y est la réunion de X moins Y, avec Y moins X. Appliquons-la maintenant à notre cas, en prenant X égal à A, et Y égal à l'intersection de A et B. Nous remplaçons X par A, et Y par A inter B.", "L": [["txt", "Par (Déf △) :"], ["sub", "X △ Y = (X ∖ Y) ∪ (Y ∖ X)"], ["txt", "On prend  X = A  et  Y = A ∩ B :"], ["sub", "A △ (A ∩ B) = ( A ∖ <mark>(A ∩ B)</mark> ) ∪ ( <mark>(A ∩ B)</mark> ∖ A )<span class='tag'>(★)</span>"]]},

{"title": "Plan", "clear": 1, "say": "Nous allons maintenant simplifier chacun des deux morceaux de cette réunion. Dans la partie un, nous verrons que l'intersection de A et B, moins A, est l'ensemble vide. Dans la partie deux, nous verrons que A moins l'intersection de A et B, est égal à A moins B. Et dans la partie trois, nous conclurons.", "L": [["goal", "(1)  (A ∩ B) ∖ A = ∅"], ["goal", "(2)  A ∖ (A ∩ B) = A ∖ B"], ["goal", "(3)  Conclure en remplaçant dans (★)"]]},

{"title": "(1) (A ∩ B) ∖ A = ∅", "clear": 1, "say": "Partie un. Nous voulons voir que l'intersection de A et B, moins A, n'a aucun élément. Supposons que x soit un élément de cet ensemble, et nous aboutirons à une contradiction.", "L": [["hyp", "Soit x ∈ (A ∩ B) ∖ A"], ["goal", "On veut :  aboutir à une contradiction"]]},

{"say": "Par la définition de la différence, x appartient à l'intersection de A et B, et x n'appartient pas à A.", "L": [["txt", "Par (Déf ∖) :"], ["sub", "x ∈ A ∩ B   et   x ∉ A"]]},

{"say": "Par la définition de l'intersection, que x appartienne à l'intersection de A et B signifie que x appartient à A, et x appartient à B. En particulier, x appartient à A.", "L": [["txt", "Par (Déf ∩) :  x ∈ A ∩ B  signifie  x ∈ A  et  x ∈ B.  En particulier :"], ["sub", "x ∈ A"]]},

{"say": "Mais nous avions obtenu que x n'appartient pas à A. Alors x appartient à A, et x n'appartient pas à A, à la fois. C'est une contradiction.", "L": [["warn", "x ∈ A   et   x ∉ A      →   contradiction"]]},

{"say": "Par conséquent, il n'existe aucun élément x dans l'intersection de A et B, moins A. Un ensemble sans éléments est l'ensemble vide. Donc l'intersection de A et B, moins A, est l'ensemble vide.", "L": [["txt", "Aucun x ne peut appartenir à  (A ∩ B) ∖ A,  donc :"], ["res", "(A ∩ B) ∖ A = ∅"]]},

{"title": "(2) A ∖ (A ∩ B) = A ∖ B", "clear": 1, "say": "Partie deux. Nous voulons voir que A moins l'intersection de A et B, est égal à A moins B. Par la définition de l'égalité, nous démontrons deux inclusions. D'abord, A moins l'intersection de A et B, est inclus dans A moins B. Ensuite, A moins B est inclus dans A moins l'intersection de A et B.", "L": [["goal", "(2a)  A ∖ (A ∩ B) ⊆ A ∖ B"], ["goal", "(2b)  A ∖ B ⊆ A ∖ (A ∩ B)"]]},

{"title": "(2a) A ∖ (A ∩ B) ⊆ A ∖ B", "clear": 1, "say": "Soit x un élément quelconque de A moins l'intersection de A et B. Par la définition de la différence, x appartient à A, et x n'appartient pas à l'intersection de A et B.", "L": [["hyp", "Soit x ∈ A ∖ (A ∩ B)"], ["goal", "On veut :  x ∈ A ∖ B"], ["txt", "Par (Déf ∖) :"], ["sub", "x ∈ A   et   x ∉ A ∩ B"]]},

{"say": "Par la définition de l'intersection, que x n'appartienne pas à l'intersection de A et B signifie qu'il est faux que x appartienne à A et à B à la fois. Comme nous savons que x appartient à A, la seule façon pour que les deux ne soient pas vraies à la fois est que x n'appartienne pas à B.", "L": [["txt", "Par (Déf ∩) :  x ∉ A ∩ B  signifie"], ["sub", "non (x ∈ A  et  x ∈ B)"], ["txt", "Comme  x ∈ A,  on doit avoir :"], ["sub", "x ∉ B"]]},

{"say": "Nous avons donc que x appartient à A, et x n'appartient pas à B. Par la définition de la différence, x appartient à A moins B. Cela démontre la première inclusion.", "L": [["txt", "x ∈ A  et  x ∉ B,  donc par (Déf ∖) :"], ["res", "x ∈ A ∖ B"], ["res", "A ∖ (A ∩ B) ⊆ A ∖ B"]]},

{"title": "(2b) A ∖ B ⊆ A ∖ (A ∩ B)", "clear": 1, "say": "Maintenant l'inclusion réciproque. Soit x un élément quelconque de A moins B. Par la définition de la différence, x appartient à A, et x n'appartient pas à B.", "L": [["hyp", "Soit x ∈ A ∖ B"], ["goal", "On veut :  x ∈ A ∖ (A ∩ B)"], ["txt", "Par (Déf ∖) :"], ["sub", "x ∈ A   et   x ∉ B"]]},

{"say": "Comme x n'appartient pas à B, il ne peut pas arriver que x appartienne à A et à B à la fois. Par la définition de l'intersection, x n'appartient pas à l'intersection de A et B.", "L": [["txt", "x ∉ B  ⟹  non (x ∈ A  et  x ∈ B),  donc par (Déf ∩) :"], ["sub", "x ∉ A ∩ B"]]},

{"say": "Nous avons donc que x appartient à A, et x n'appartient pas à l'intersection de A et B. Par la définition de la différence, x appartient à A moins l'intersection de A et B. Cela démontre la seconde inclusion.", "L": [["txt", "x ∈ A  et  x ∉ A ∩ B,  donc par (Déf ∖) :"], ["res", "x ∈ A ∖ (A ∩ B)"], ["res", "A ∖ B ⊆ A ∖ (A ∩ B)"]]},

{"title": "(2) Conclusion", "clear": 1, "say": "Comme les deux inclusions sont vraies, par la définition de l'égalité, nous concluons que A moins l'intersection de A et B, est égal à A moins B.", "L": [["txt", "(2a)  A ∖ (A ∩ B) ⊆ A ∖ B"], ["txt", "(2b)  A ∖ B ⊆ A ∖ (A ∩ B)"], ["res", "A ∖ (A ∩ B) = A ∖ B"]]},

{"title": "(3) Conclusion", "clear": 1, "say": "Partie trois. Revenons à l'expression de départ. A différence symétrique, l'intersection de A et B, est la réunion de A moins l'intersection, avec l'intersection moins A.", "L": [["txt", "On part de (★) :"], ["sub", "A △ (A ∩ B) = ( A ∖ (A ∩ B) ) ∪ ( (A ∩ B) ∖ A )"]]},

{"say": "Nous remplaçons le second morceau par l'ensemble vide, en utilisant le résultat de la partie un.", "L": [["txt", "Par (1),  (A ∩ B) ∖ A = ∅ :"], ["sub", "A △ (A ∩ B) = ( A ∖ (A ∩ B) ) ∪ <mark>∅</mark>"]]},

{"say": "Réunir un ensemble avec l'ensemble vide ne change pas cet ensemble. En effet, x appartient à la réunion d'un ensemble X avec le vide, si et seulement si x appartient à X, ou x appartient au vide. Mais aucun élément n'appartient au vide, donc cela équivaut à ce que x appartienne à X. Nous l'appliquons avec X égal à A moins l'intersection de A et B.", "L": [["txt", "Par (Déf ∪) et (Déf ∅) :  x ∈ X ∪ ∅  ⟺  x ∈ X  ou  x ∈ ∅  ⟺  x ∈ X"], ["txt", "Avec  X = A ∖ (A ∩ B):"], ["sub", "A △ (A ∩ B) = A ∖ (A ∩ B)"]]},

{"say": "Enfin, nous remplaçons A moins l'intersection de A et B par A moins B, en utilisant le résultat de la partie deux.", "L": [["txt", "Par (2),  A ∖ (A ∩ B) = A ∖ B :"], ["res", "A △ (A ∩ B) = A ∖ B"]]},

{"title": "Conclusion", "clear": 1, "say": "Conclusion. Nous avons démontré que, pour tous ensembles A et B, A moins B est égal à A différence symétrique, l'intersection de A et B. Merci d'avoir regardé.", "L": [["txt", "A △ (A ∩ B) = ( A ∖ (A ∩ B) ) ∪ ∅ = A ∖ (A ∩ B) = A ∖ B"], ["res", "A ∖ B = A △ (A ∩ B)"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' plus ').replace(/⊙/g,' fois ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Rejouer'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Reprendre'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pause';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/henri|paul|claude|remy|rémy|male|google français$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Différence et différence symétrique";$('sub').textContent="Exercice · Algèbre des ensembles";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
