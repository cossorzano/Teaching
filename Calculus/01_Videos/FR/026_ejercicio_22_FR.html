<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Produit cartésien et intersection</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>À retenir</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Commencer</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Vitesse <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Mode enregistrement (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"fr-FR",
"meta":{"nivel": 2, "titulo": "Produit cartésien et intersection", "enunciado": "Démontrer que, pour tous ensembles A, B, C, D, on a :", "tesis": "(A ∩ B) × (C ∩ D) = (A × C) ∩ (B × D)", "datos": ["(Déf ×)  (x, y) ∈ X × Y  ⟺  x ∈ X  et  y ∈ Y"]},
"steps":[
{"title": "Produit cartésien et intersection", "sub": "Exercice · Algèbre des ensembles", "clear": 1, "say": "Bonjour. Dans cette vidéo, nous allons démontrer que le produit cartésien de deux intersections est l'intersection de deux produits cartésiens. Nous raisonnerons élément par élément, très lentement, en écrivant chaque équation et en justifiant chaque étape.", "L": [["txt", "Démontrer que  (A ∩ B) × (C ∩ D) = (A × C) ∩ (B × D)"]]},

{"say": "Ce que nous voulons démontrer. Pour tous ensembles A, B, C et D, l'intersection de A et B, croix l'intersection de C et D, est égale à l'intersection de A croix C, avec B croix D. Nous rappelons à gauche les définitions que nous allons utiliser : produit cartésien, intersection, inclusion et égalité d'ensembles.", "L": [["goal", "(A ∩ B) × (C ∩ D) = (A × C) ∩ (B × D)<span class='tag'>Démontrer, pour tous A, B, C, D</span>"]], "pin": ["(Déf ×) (x, y) ∈ X × Y  ⟺  x ∈ X  et  y ∈ Y", "(Déf ∩) p ∈ X ∩ Y  ⟺  p ∈ X  et  p ∈ Y", "(Déf ⊆) X ⊆ Y  ⟺  tout p ∈ X vérifie p ∈ Y", "(Déf =) X = Y  ⟺  X ⊆ Y  et  Y ⊆ X"]},

{"title": "Plan : double inclusion", "clear": 1, "say": "Nous raisonnerons élément par élément. Par la définition de l'égalité, nous devons démontrer deux inclusions. La première : l'intersection de A et B, croix l'intersection de C et D, est incluse dans l'intersection de A croix C avec B croix D. La seconde : l'inclusion contraire.", "L": [["goal", "(1)  (A ∩ B) × (C ∩ D) ⊆ (A × C) ∩ (B × D)"], ["goal", "(2)  (A × C) ∩ (B × D) ⊆ (A ∩ B) × (C ∩ D)"]]},

{"title": "(1) (A ∩ B) × (C ∩ D) ⊆ (A × C) ∩ (B × D)", "clear": 1, "say": "Première inclusion. Par la définition de l'inclusion, nous prenons un élément quelconque x, y du premier ensemble, et nous devons prouver qu'il appartient au second.", "L": [["hyp", "Soit (x, y) ∈ (A ∩ B) × (C ∩ D)"], ["goal", "On veut :  (x, y) ∈ (A × C) ∩ (B × D)"]]},

{"say": "Par la définition du produit cartésien, avec X égal à A inter B, et Y égal à C inter D, la première coordonnée x appartient à A inter B, et la seconde coordonnée y appartient à C inter D.", "L": [["txt", "Par (Déf ×) avec  X = A ∩ B,  Y = C ∩ D :"], ["sub", "x ∈ A ∩ B   et   y ∈ C ∩ D"]]},

{"say": "Par la définition de l'intersection, que x appartienne à A inter B signifie que x appartient à A, et x appartient à B. Et que y appartienne à C inter D signifie que y appartient à C, et y appartient à D.", "L": [["txt", "Par (Déf ∩) :"], ["sub", "x ∈ A  et  x ∈ B"], ["sub", "y ∈ C  et  y ∈ D"]]},

{"clear": 1, "say": "Regroupons maintenant autrement. Comme x appartient à A, et y appartient à C, par la définition du produit cartésien, x, y appartient à A croix C. Et comme x appartient à B, et y appartient à D, x, y appartient à B croix D.", "L": [["txt", "On regroupe :  x ∈ A  et  y ∈ C,  donc par (Déf ×) :"], ["sub", "(x, y) ∈ A × C"], ["txt", "Et aussi :  x ∈ B  et  y ∈ D,  donc par (Déf ×) :"], ["sub", "(x, y) ∈ B × D"]]},

{"say": "Par la définition de l'intersection, avec X égal à A croix C, et Y égal à B croix D, x, y appartient à l'intersection de A croix C avec B croix D.", "L": [["txt", "(x, y) ∈ A × C   et   (x, y) ∈ B × D,  donc par (Déf ∩) :"], ["res", "(x, y) ∈ (A × C) ∩ (B × D)"]]},

{"say": "Comme x, y était un élément quelconque de l'intersection de A et B, croix l'intersection de C et D, nous concluons la première inclusion.", "L": [["res", "(A ∩ B) × (C ∩ D) ⊆ (A × C) ∩ (B × D)"]]},

{"title": "(2) (A × C) ∩ (B × D) ⊆ (A ∩ B) × (C ∩ D)", "clear": 1, "say": "Seconde inclusion. Nous prenons un élément quelconque x, y de l'intersection de A croix C avec B croix D, et nous devons prouver qu'il appartient à l'intersection de A et B, croix l'intersection de C et D.", "L": [["hyp", "Soit (x, y) ∈ (A × C) ∩ (B × D)"], ["goal", "On veut :  (x, y) ∈ (A ∩ B) × (C ∩ D)"]]},

{"say": "Par la définition de l'intersection, x, y appartient à A croix C, et x, y appartient à B croix D.", "L": [["txt", "Par (Déf ∩) :"], ["sub", "(x, y) ∈ A × C   et   (x, y) ∈ B × D"]]},

{"say": "Par la définition du produit cartésien, que x, y appartienne à A croix C signifie que x appartient à A, et y appartient à C. Et que x, y appartienne à B croix D signifie que x appartient à B, et y appartient à D.", "L": [["txt", "Par (Déf ×) :"], ["sub", "x ∈ A  et  y ∈ C"], ["sub", "x ∈ B  et  y ∈ D"]]},

{"clear": 1, "say": "Regroupons maintenant autrement. Comme x appartient à A, et x appartient à B, par la définition de l'intersection, x appartient à A inter B. Et comme y appartient à C, et y appartient à D, y appartient à C inter D.", "L": [["txt", "On regroupe :  x ∈ A  et  x ∈ B,  donc par (Déf ∩) :"], ["sub", "x ∈ A ∩ B"], ["txt", "Et aussi :  y ∈ C  et  y ∈ D,  donc par (Déf ∩) :"], ["sub", "y ∈ C ∩ D"]]},

{"say": "Par la définition du produit cartésien, avec X égal à A inter B, et Y égal à C inter D, x, y appartient à l'intersection de A et B, croix l'intersection de C et D.", "L": [["txt", "x ∈ A ∩ B  et  y ∈ C ∩ D,  donc par (Déf ×) :"], ["res", "(x, y) ∈ (A ∩ B) × (C ∩ D)"]]},

{"say": "Comme x, y était un élément quelconque de l'intersection de A croix C avec B croix D, nous concluons la seconde inclusion.", "L": [["res", "(A × C) ∩ (B × D) ⊆ (A ∩ B) × (C ∩ D)"]]},

{"title": "Conclusion", "clear": 1, "say": "Conclusion. Comme les deux inclusions sont vraies, par la définition de l'égalité, l'intersection de A et B, croix l'intersection de C et D, est égale à l'intersection de A croix C avec B croix D. Merci d'avoir regardé.", "L": [["txt", "(1)  (A ∩ B) × (C ∩ D) ⊆ (A × C) ∩ (B × D)"], ["txt", "(2)  (A × C) ∩ (B × D) ⊆ (A ∩ B) × (C ∩ D)"], ["res", "(A ∩ B) × (C ∩ D) = (A × C) ∩ (B × D)"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' plus ').replace(/⊙/g,' fois ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Rejouer'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Reprendre'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pause';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/henri|paul|claude|remy|rémy|male|google français$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Produit cartésien et intersection";$('sub').textContent="Exercice · Algèbre des ensembles";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
