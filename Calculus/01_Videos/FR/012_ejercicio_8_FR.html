<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lois de domination</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(15px,1.9vw,24px)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>À retenir</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Commencer</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Vitesse <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Mode enregistrement (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"fr-FR",
"meta":{"nivel": 2, "titulo": "Lois de domination", "enunciado": "Soit (B, ⊕, ⊙, ∼) une algèbre de Boole.  Montrer que, pour tout a ∈ B, les lois de domination sont vérifiées :", "tesis": "a ⊕ 1 = 1,   a ⊙ 0 = 0", "datos": ["(Assoc ⊕)  x ⊕ (y ⊕ z) = (x ⊕ y) ⊕ z", "(Assoc ⊙)  x ⊙ (y ⊙ z) = (x ⊙ y) ⊙ z", "(Idem)  x ⊕ x = x,   x ⊙ x = x", "(Compl)  x ⊕ ∼x = 1,   x ⊙ ∼x = 0"]},
"steps":[
{"title": "Lois de domination", "sub": "Exercice · Algèbre de Boole", "clear": 1, "say": "Bonjour. Dans cette vidéo, nous allons résoudre un exercice sur les algèbres de Boole. Nous irons très lentement, en écrivant chaque équation et en justifiant chaque étape.", "L": [["txt", "Ajouter un donne un, et multiplier par zéro donne zéro"]]},

{"say": "D’abord, les données. B est un ensemble muni de deux opérations, la somme et le produit, et d’une opération complémentaire, que nous notons avec un tilde. C’est une algèbre de Boole : un treillis distributif avec un plus petit élément zéro, un plus grand élément un, et un complémentaire pour chaque élément. L’exemple typique est l’ensemble des parties d’un ensemble U, avec l’union, l’intersection et le complémentaire.", "L": [["hyp", "(B, ⊕, ⊙, ∼) algèbre de Boole<span class='tag'>Hypothèse</span>"], ["txt", "Avec des ensembles :  (𝒫(U), ∪, ∩, complémentaire),   0 = ∅,   1 = U"]]},

{"say": "Rappelons la définition du complémentaire. Le complémentaire de a vérifie deux conditions à la fois : a plus son complémentaire égale un, et a fois son complémentaire égale zéro. Avec des ensembles : A union son complémentaire égale U, et A inter son complémentaire est l’ensemble vide.", "L": [["sub", "a ⊕ ∼a = 1<span class='tag'>Définition du complémentaire</span>"], ["sub", "a ⊙ ∼a = 0<span class='tag'>Définition du complémentaire</span>"], ["txt", "Avec des ensembles :  A ∪ A<sup>c</sup> = U,   A ∩ A<sup>c</sup> = ∅"]]},

{"say": "Nous utiliserons aussi l’associativité de la somme et celle du produit, et l’idempotence des deux opérations : a plus a égale a, et a fois a égale a. Nous les notons à gauche avec la définition du complémentaire.", "pin": ["(Assoc ⊕) x ⊕ (y ⊕ z) = (x ⊕ y) ⊕ z", "(Assoc ⊙) x ⊙ (y ⊙ z) = (x ⊙ y) ⊙ z", "(Idem ⊕) x ⊕ x = x", "(Idem ⊙) x ⊙ x = x", "(Compl) x ⊕ ∼x = 1,   x ⊙ ∼x = 0"]},

{"say": "Ce que nous voulons démontrer. Pour tout élément a de B, a plus un égale un, et a fois zéro égale zéro. Ce sont les lois de domination : le un domine la somme, et le zéro domine le produit. Avec des ensembles : A union U égale U, et A inter l’ensemble vide est le vide.", "L": [["goal", "∀ a ∈ B:   a ⊕ 1 = 1   et   a ⊙ 0 = 0<span class='tag'>Thèse : lois de domination</span>"], ["txt", "Avec des ensembles :  A ∪ U = U,   A ∩ ∅ = ∅"]]},

{"title": "Partie 1 : a ⊕ 1 = 1", "clear": 1, "say": "Commençons par la première. Soit a un élément quelconque de B. Nous voulons montrer que a plus un est égal à un. Partons du membre de gauche.", "L": [["txt", "Soit a ∈ B  (quelconque)"], ["goal", "Nous voulons :  a ⊕ 1 = 1<span class='tag'>Thèse de cette partie</span>"], ["txt", "a ⊕ 1"]]},

{"say": "Première étape. Par la définition du complémentaire, a plus son complémentaire égale un. C’est l’hypothèse. Nous pouvons donc remplacer le un par a plus le complémentaire de a. Nous laissons le a de gauche tel quel.", "L": [["sub", "a ⊕ 1  =  a ⊕ (a ⊕ ∼a)<span class='tag'>Substitution : 1 = a ⊕ ∼a  (définition du complémentaire)</span>"]]},

{"say": "Deuxième étape. Nous appliquons l’associativité de la somme, avec x égal à a, y égal à a, et z égal au complémentaire de a. Nous passons de a plus, a plus le complémentaire de a, à, a plus a, plus le complémentaire de a.", "L": [["sub", "a ⊕ 1  =  (a ⊕ a) ⊕ ∼a<span class='tag'>Associativité de ⊕</span>"]]},

{"say": "Troisième étape. Entre parenthèses apparaît a plus a. Par l’idempotence de la somme, a plus a est égal à a. Nous le surlignons et nous substituons.", "L": [["sub", "a ⊕ 1  =  (<mark>a ⊕ a</mark>) ⊕ ∼a"], ["txt", "Par (Idem ⊕) :  <mark>a ⊕ a</mark> = a"], ["sub", "a ⊕ 1  =  a ⊕ ∼a<span class='tag'>Idempotence de ⊕</span>"]]},

{"say": "Quatrième étape. Nous avons maintenant a plus le complémentaire de a, qui, par la définition du complémentaire, est égal à un.", "L": [["res", "a ⊕ 1  =  1<span class='tag'>Définition du complémentaire</span>"]]},

{"say": "Nous avons démontré la première loi de domination. Avec des ensembles : A union U égale U. La première partie est terminée.", "L": [["res", "a ⊕ 1 = 1   ∎"], ["txt", "Avec des ensembles :  A ∪ U = U"]]},

{"title": "Partie 2 : a ⊙ 0 = 0", "clear": 1, "say": "Passons à la seconde partie. Elle est analogue, en échangeant la somme et le produit, et le un et le zéro. Soit a un élément quelconque de B. Nous voulons montrer que a fois zéro est égal à zéro. Partons du membre de gauche.", "L": [["txt", "Soit a ∈ B  (quelconque)"], ["goal", "Nous voulons :  a ⊙ 0 = 0<span class='tag'>Thèse de cette partie</span>"], ["txt", "a ⊙ 0"]]},

{"say": "Première étape. Par la définition du complémentaire, a fois son complémentaire égale zéro. C’est l’hypothèse. Nous remplaçons donc le zéro par a fois le complémentaire de a. Nous laissons le a de gauche tel quel.", "L": [["sub", "a ⊙ 0  =  a ⊙ (a ⊙ ∼a)<span class='tag'>Substitution : 0 = a ⊙ ∼a  (définition du complémentaire)</span>"]]},

{"say": "Deuxième étape. Nous appliquons l’associativité du produit. Nous passons de a fois, a fois le complémentaire de a, à, a fois a, fois le complémentaire de a.", "L": [["sub", "a ⊙ 0  =  (a ⊙ a) ⊙ ∼a<span class='tag'>Associativité de ⊙</span>"]]},

{"say": "Troisième étape. Entre parenthèses apparaît a fois a. Par l’idempotence du produit, a fois a est égal à a. Nous le surlignons et nous substituons.", "L": [["sub", "a ⊙ 0  =  (<mark>a ⊙ a</mark>) ⊙ ∼a"], ["txt", "Par (Idem ⊙) :  <mark>a ⊙ a</mark> = a"], ["sub", "a ⊙ 0  =  a ⊙ ∼a<span class='tag'>Idempotence de ⊙</span>"]]},

{"say": "Quatrième étape. Nous avons maintenant a fois le complémentaire de a, qui, par la définition du complémentaire, est égal à zéro.", "L": [["res", "a ⊙ 0  =  0<span class='tag'>Définition du complémentaire</span>"]]},

{"say": "Nous avons démontré la seconde loi de domination. Avec des ensembles : A inter l’ensemble vide est le vide. La seconde partie est terminée.", "L": [["res", "a ⊙ 0 = 0   ∎"], ["txt", "Avec des ensembles :  A ∩ ∅ = ∅"]]},

{"title": "Résumé", "clear": 1, "say": "En résumé. Nous écrivons le un comme a plus le complémentaire de a, nous associons, nous appliquons l’idempotence et nous revenons à la définition du complémentaire. Et avec le produit, la même chose avec le zéro. Nous concluons que les lois de domination sont vérifiées dans toute algèbre de Boole. Avec des ensembles : A union U égale U, et A inter l’ensemble vide est le vide. Merci d’avoir regardé.", "L": [["res", "a ⊕ 1 = 1   (substitution + associativité + idempotence + complémentaire)"], ["res", "a ⊙ 0 = 0   (substitution + associativité + idempotence + complémentaire)"], ["txt", "Avec des ensembles :  A ∪ U = U,   A ∩ ∅ = ∅"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' plus ').replace(/⊙/g,' fois ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Rejouer'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Reprendre'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pause';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/henri|paul|claude|remy|rémy|male|google français$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Lois de domination";$('sub').textContent="Exercice · Algèbre de Boole";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
