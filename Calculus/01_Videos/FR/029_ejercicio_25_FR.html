<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Distributivité par rapport à la différence</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>À retenir</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Commencer</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Vitesse <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Mode enregistrement (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"fr-FR",
"meta":{"nivel": 2, "titulo": "Distributivité par rapport à la différence", "enunciado": "Soient A, B, C des ensembles. Démontrer que le produit cartésien est distributif par rapport à la différence :", "tesis": "<span dir='ltr'>(A ∖ B) × C = (A × C) ∖ (B × C)</span><br><span dir='ltr'>A × (B ∖ C) = (A × B) ∖ (A × C)</span>", "datos": ["(Déf ×)  (x, y) ∈ X × Y  ⟺  x ∈ X  et  y ∈ Y"]},
"steps":[
{"title": "Distributivité par rapport à la différence", "sub": "Exercice · Algèbre des ensembles", "clear": 1, "say": "Bonjour. Dans cette vidéo, nous allons démontrer que le produit cartésien est distributif par rapport à la différence. Nous raisonnerons élément par élément, très lentement, en écrivant chaque équation et en justifiant chaque étape.", "L": [["txt", "Démontrer que le produit cartésien est distributif par rapport à la différence"]]},

{"clear": 1, "say": "Ce que nous voulons démontrer. Pour tous ensembles A, B et C, deux égalités sont vraies. La première : A moins B, croix C, est égal à A croix C, moins B croix C. La seconde : A croix, B moins C, est égal à A croix B, moins A croix C. Nous rappelons à gauche les définitions que nous allons utiliser : produit cartésien, différence, inclusion et égalité d'ensembles.", "L": [["goal", "(1)  (A ∖ B) × C = (A × C) ∖ (B × C)"], ["goal", "(2)  A × (B ∖ C) = (A × B) ∖ (A × C)"]], "pin": ["(Déf ×) (x, y) ∈ X × Y  ⟺  x ∈ X  et  y ∈ Y", "(Déf ∖) p ∈ X ∖ Y  ⟺  p ∈ X  et  p ∉ Y", "(Déf ⊆) X ⊆ Y  ⟺  tout p ∈ X vérifie p ∈ Y", "(Déf =) X = Y  ⟺  X ⊆ Y  et  Y ⊆ X"]},

{"title": "(1) (A ∖ B) × C = (A × C) ∖ (B × C)", "clear": 1, "say": "Égalité numéro 1. Par la définition de l'égalité, nous démontrons deux inclusions : d'abord, le membre de gauche est inclus dans celui de droite, puis l'inclusion contraire.", "L": [["goal", "(i)   (A ∖ B) × C ⊆ (A × C) ∖ (B × C)"], ["goal", "(ii)  (A × C) ∖ (B × C) ⊆ (A ∖ B) × C"]]},

{"title": "(1-i) (A ∖ B) × C ⊆ (A × C) ∖ (B × C)", "clear": 1, "say": "Inclusion i. Nous prenons un élément quelconque x, y du premier ensemble, et nous devons prouver qu'il appartient au second.", "L": [["hyp", "Soit (x, y) ∈ (A ∖ B) × C"], ["goal", "On veut :  (x, y) ∈ (A × C) ∖ (B × C)"]]},

{"say": "Par la définition du produit cartésien, x appartient à A moins B, et y appartient à C.", "L": [["txt", "Par (Déf ×) :"], ["sub", "x ∈ A ∖ B  et  y ∈ C"]]},

{"say": "Par la définition de la différence, que x appartienne à A moins B signifie que x appartient à A, et x n'appartient pas à B.", "L": [["txt", "Par (Déf ∖) :  x ∈ A ∖ B  signifie"], ["sub", "x ∈ A  et  x ∉ B"]]},

{"clear": 1, "say": "D'abord, comme x appartient à A, et y appartient à C, par la définition du produit cartésien, x, y appartient à A croix C.", "L": [["txt", "x ∈ A  et  y ∈ C,  donc par (Déf ×) :"], ["sub", "(x, y) ∈ A × C"]]},

{"say": "Ensuite, voyons que x, y n'appartient pas à B croix C. S'il y appartenait, par la définition du produit cartésien, x appartiendrait à B. Mais nous savons que x n'appartient pas à B. C'est une contradiction, donc x, y n'appartient pas à B croix C.", "L": [["txt", "Si  (x, y) ∈ B × C,  par (Déf ×)  x ∈ B."], ["warn", "Mais  x ∉ B   →   contradiction"], ["sub", "(x, y) ∉ B × C"]]},

{"say": "Par la définition de la différence, x, y appartient à A croix C, et n'appartient pas à B croix C. Donc x, y appartient à A croix C, moins B croix C.", "L": [["txt", "Par (Déf ∖) :"], ["res", "(x, y) ∈ (A × C) ∖ (B × C)"], ["res", "(A ∖ B) × C ⊆ (A × C) ∖ (B × C)"]]},

{"title": "(1-ii) (A × C) ∖ (B × C) ⊆ (A ∖ B) × C", "clear": 1, "say": "Inclusion ii. Nous prenons un élément quelconque x, y de A croix C, moins B croix C, et nous devons prouver qu'il appartient à A moins B, croix C.", "L": [["hyp", "Soit (x, y) ∈ (A × C) ∖ (B × C)"], ["goal", "On veut :  (x, y) ∈ (A ∖ B) × C"]]},

{"say": "Par la définition de la différence, x, y appartient à A croix C, et x, y n'appartient pas à B croix C.", "L": [["txt", "Par (Déf ∖) :"], ["sub", "(x, y) ∈ A × C   et   (x, y) ∉ B × C"]]},

{"say": "La première condition, par la définition du produit cartésien, dit que x appartient à A, et y appartient à C.", "L": [["txt", "Première condition, par (Déf ×) :"], ["sub", "x ∈ A  et  y ∈ C"]]},

{"say": "La seconde condition, par la définition du produit cartésien, dit qu'il est faux que x appartienne à B et y appartienne à C à la fois.", "L": [["txt", "Seconde condition, par (Déf ×) :"], ["sub", "non (x ∈ B  et  y ∈ C)"]]},

{"say": "Mais nous savons déjà que y appartient à C. Donc, pour que les deux ne soient pas vraies à la fois, x n'appartient nécessairement pas à B.", "L": [["txt", "Comme  y ∈ C:"], ["sub", "x ∉ B"]]},

{"clear": 1, "say": "Nous avons donc que x appartient à A, et x n'appartient pas à B. Par la définition de la différence, x appartient à A moins B. Et de plus y appartient à C.", "L": [["txt", "x ∈ A  et  x ∉ B,  donc par (Déf ∖) :"], ["sub", "x ∈ A ∖ B"], ["sub", "y ∈ C"]]},

{"say": "Par la définition du produit cartésien, x, y appartient à A moins B, croix C. Cela démontre la seconde inclusion. Comme les deux inclusions sont vraies, par la définition de l'égalité, l'égalité numéro 1 est démontrée.", "L": [["txt", "Par (Déf ×) :"], ["res", "(x, y) ∈ (A ∖ B) × C"], ["res", "(A × C) ∖ (B × C) ⊆ (A ∖ B) × C"], ["res", "(A ∖ B) × C = (A × C) ∖ (B × C)"]]},

{"title": "(2) A × (B ∖ C) = (A × B) ∖ (A × C)", "clear": 1, "say": "Égalité numéro 2. Par la définition de l'égalité, nous démontrons deux inclusions : d'abord, le membre de gauche est inclus dans celui de droite, puis l'inclusion contraire.", "L": [["goal", "(i)   A × (B ∖ C) ⊆ (A × B) ∖ (A × C)"], ["goal", "(ii)  (A × B) ∖ (A × C) ⊆ A × (B ∖ C)"]]},

{"title": "(2-i) A × (B ∖ C) ⊆ (A × B) ∖ (A × C)", "clear": 1, "say": "Inclusion i. Nous prenons un élément quelconque x, y du premier ensemble, et nous devons prouver qu'il appartient au second.", "L": [["hyp", "Soit (x, y) ∈ A × (B ∖ C)"], ["goal", "On veut :  (x, y) ∈ (A × B) ∖ (A × C)"]]},

{"say": "Par la définition du produit cartésien, x appartient à A, et y appartient à B moins C.", "L": [["txt", "Par (Déf ×) :"], ["sub", "x ∈ A  et  y ∈ B ∖ C"]]},

{"say": "Par la définition de la différence, que y appartienne à B moins C signifie que y appartient à B, et y n'appartient pas à C.", "L": [["txt", "Par (Déf ∖) :  y ∈ B ∖ C  signifie"], ["sub", "y ∈ B  et  y ∉ C"]]},

{"clear": 1, "say": "D'abord, comme y appartient à B, et x appartient à A, par la définition du produit cartésien, x, y appartient à A croix B.", "L": [["txt", "y ∈ B  et  x ∈ A,  donc par (Déf ×) :"], ["sub", "(x, y) ∈ A × B"]]},

{"say": "Ensuite, voyons que x, y n'appartient pas à A croix C. S'il y appartenait, par la définition du produit cartésien, y appartiendrait à C. Mais nous savons que y n'appartient pas à C. C'est une contradiction, donc x, y n'appartient pas à A croix C.", "L": [["txt", "Si  (x, y) ∈ A × C,  par (Déf ×)  y ∈ C."], ["warn", "Mais  y ∉ C   →   contradiction"], ["sub", "(x, y) ∉ A × C"]]},

{"say": "Par la définition de la différence, x, y appartient à A croix B, et n'appartient pas à A croix C. Donc x, y appartient à A croix B, moins A croix C.", "L": [["txt", "Par (Déf ∖) :"], ["res", "(x, y) ∈ (A × B) ∖ (A × C)"], ["res", "A × (B ∖ C) ⊆ (A × B) ∖ (A × C)"]]},

{"title": "(2-ii) (A × B) ∖ (A × C) ⊆ A × (B ∖ C)", "clear": 1, "say": "Inclusion ii. Nous prenons un élément quelconque x, y de A croix B, moins A croix C, et nous devons prouver qu'il appartient à A croix, B moins C.", "L": [["hyp", "Soit (x, y) ∈ (A × B) ∖ (A × C)"], ["goal", "On veut :  (x, y) ∈ A × (B ∖ C)"]]},

{"say": "Par la définition de la différence, x, y appartient à A croix B, et x, y n'appartient pas à A croix C.", "L": [["txt", "Par (Déf ∖) :"], ["sub", "(x, y) ∈ A × B   et   (x, y) ∉ A × C"]]},

{"say": "La première condition, par la définition du produit cartésien, dit que x appartient à A, et y appartient à B.", "L": [["txt", "Première condition, par (Déf ×) :"], ["sub", "x ∈ A  et  y ∈ B"]]},

{"say": "La seconde condition, par la définition du produit cartésien, dit qu'il est faux que x appartienne à A et y appartienne à C à la fois.", "L": [["txt", "Seconde condition, par (Déf ×) :"], ["sub", "non (x ∈ A  et  y ∈ C)"]]},

{"say": "Mais nous savons déjà que x appartient à A. Donc, pour que les deux ne soient pas vraies à la fois, y n'appartient nécessairement pas à C.", "L": [["txt", "Comme  x ∈ A:"], ["sub", "y ∉ C"]]},

{"clear": 1, "say": "Nous avons donc que y appartient à B, et y n'appartient pas à C. Par la définition de la différence, y appartient à B moins C. Et de plus x appartient à A.", "L": [["txt", "y ∈ B  et  y ∉ C,  donc par (Déf ∖) :"], ["sub", "y ∈ B ∖ C"], ["sub", "x ∈ A"]]},

{"say": "Par la définition du produit cartésien, x, y appartient à A croix, B moins C. Cela démontre la seconde inclusion. Comme les deux inclusions sont vraies, par la définition de l'égalité, l'égalité numéro 2 est démontrée.", "L": [["txt", "Par (Déf ×) :"], ["res", "(x, y) ∈ A × (B ∖ C)"], ["res", "(A × B) ∖ (A × C) ⊆ A × (B ∖ C)"], ["res", "A × (B ∖ C) = (A × B) ∖ (A × C)"]]},

{"title": "Conclusion", "clear": 1, "say": "Conclusion. Nous avons démontré les deux égalités. Autrement dit, le produit cartésien est distributif par rapport à la différence, à gauche comme à droite. Merci d'avoir regardé.", "L": [["res", "(1)  (A ∖ B) × C = (A × C) ∖ (B × C)"], ["res", "(2)  A × (B ∖ C) = (A × B) ∖ (A × C)"], ["txt", "Le produit cartésien est distributif par rapport à la différence"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' plus ').replace(/⊙/g,' fois ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Rejouer'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Reprendre'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pause';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/henri|paul|claude|remy|rémy|male|google français$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Distributivité par rapport à la différence";$('sub').textContent="Exercice · Algèbre des ensembles";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
