<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Principe de dualité</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>À retenir</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Commencer</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Vitesse <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Mode enregistrement (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"fr-FR",
"meta":{"nivel": 2, "titulo": "Principe de dualité", "enunciado": "Soit (B, ⊕, ⊙, ∼, 0, 1) une algèbre de Boole.  À l’aide du principe de dualité, écrire et vérifier les identités duales de :", "tesis": "(a)  a ⊕ 1 = 1,   (b)  a ⊕ (a ⊙ b) = a", "datos": ["(Dualité)  ⊕ ↔ ⊙,   0 ↔ 1", "(Dom)  a ⊕ 1 = 1,   a ⊙ 0 = 0", "(Abs)  a ⊕ (a ⊙ b) = a,   a ⊙ (a ⊕ b) = a"]},
"steps":[
{"title": "Principe de dualité", "sub": "Exercice · Algèbre de Boole", "clear": 1, "say": "Bonjour. Dans cette vidéo, nous allons résoudre un exercice sur les algèbres de Boole. Nous irons très lentement, en écrivant chaque équation et en justifiant chaque étape.", "L": [["txt", "Utiliser le principe de dualité pour obtenir de nouvelles identités"]]},

{"say": "D’abord, les données. B est un ensemble muni de deux opérations, la somme et le produit, d’une opération complémentaire, et de deux éléments distingués, zéro et un. C’est une algèbre de Boole. L’exemple typique est l’ensemble des parties d’un ensemble U, avec l’union, l’intersection et le complémentaire, où zéro est l’ensemble vide et un est U.", "L": [["hyp", "(B, ⊕, ⊙, ∼, 0, 1) algèbre de Boole<span class='tag'>Hypothèse</span>"], ["txt", "Avec des ensembles :  (𝒫(U), ∪, ∩, complémentaire),   0 = ∅,   1 = U"]]},

{"say": "Rappelons le principe de dualité. Toute identité valide dans une algèbre de Boole reste valide quand on échange simultanément la somme et le produit, et zéro et un. Avec des ensembles, cela revient à échanger l’union et l’intersection, et l’ensemble vide et U.", "L": [["sub", "⊕ ↔ ⊙,      0 ↔ 1<span class='tag'>Principe de dualité : on échange simultanément</span>"], ["txt", "Avec des ensembles :  ∪ ↔ ∩,      ∅ ↔ U"]]},

{"say": "Nous le notons à gauche, car c’est ce que nous allons utiliser dans tout l’exercice.", "pin": ["(Dualité) Toute identité valide le reste en échangeant ⊕ ↔ ⊙ et 0 ↔ 1"]},

{"say": "Ce que nous voulons faire. Partie a : à partir de la loi de domination, a plus un égale un, écrire son identité duale et vérifier qu’elle est aussi valide. Partie b : à partir de la loi d’absorption, a plus, a fois b, égale a, écrire son identité duale et vérifier qu’elle est aussi valide.", "L": [["goal", "(a)  Dual de  a ⊕ 1 = 1  et vérifier qu’il est valide"], ["goal", "(b)  Dual de  a ⊕ (a ⊙ b) = a  et vérifier qu’il est valide<span class='tag'>Thèse</span>"]]},

{"title": "(a) Dual de la loi de domination", "clear": 1, "say": "Partie a. L’identité de départ est la loi de domination : a plus un est égal à un. Avec des ensembles : A union U égale U. Nous la notons à gauche, car c’est une identité valide de départ.", "L": [["sub", "a ⊕ 1 = 1<span class='tag'>Identité de départ : loi de domination</span>"], ["txt", "Avec des ensembles :  A ∪ U = U"]], "pin": ["(Dom) a ⊕ 1 = 1"]},

{"say": "En appliquant le principe de dualité, nous échangeons la somme et le produit, et le un et le zéro. Dans l’identité, il y a une somme et deux uns, donc nous changeons la somme en produit, et les deux uns en zéros.", "L": [["sub", "⊕ → ⊙,      1 → 0<span class='tag'>Échange dual</span>"], ["txt", "a ⊕ 1 = 1   devient   a ⊙ 0 = 0"]]},

{"say": "Nous obtenons l’identité duale : a fois zéro est égal à zéro. Avec des ensembles : A inter l’ensemble vide est le vide.", "L": [["res", "a ⊙ 0 = 0<span class='tag'>Identité duale</span>"], ["txt", "Avec des ensembles :  A ∩ ∅ = ∅"]]},

{"say": "Vérifions maintenant qu’elle est valide. Cette égalité est précisément la seconde loi de domination, déjà démontrée. Nous la notons à gauche. Donc l’identité duale est aussi valide. La partie a est terminée.", "L": [["res", "a ⊙ 0 = 0  est la seconde loi de domination   ∎<span class='tag'>L’identité duale est aussi valide</span>"]], "pin": ["(Dom) a ⊙ 0 = 0"]},

{"title": "(b) Dual de la loi d’absorption", "clear": 1, "say": "Partie b. L’identité de départ est la loi d’absorption : a plus, a fois b, est égal à a. Avec des ensembles : A union, A inter B, égale A. Nous la notons à gauche.", "L": [["sub", "a ⊕ (a ⊙ b) = a<span class='tag'>Identité de départ : loi d’absorption</span>"], ["txt", "Avec des ensembles :  A ∪ (A ∩ B) = A"]], "pin": ["(Abs) a ⊕ (a ⊙ b) = a"]},

{"say": "En appliquant le principe de dualité, nous échangeons la somme et le produit, et inversement. Dans cette identité, ni zéro ni un n’apparaissent, donc nous changeons seulement la somme en produit, et le produit en somme.", "L": [["sub", "⊕ ↔ ⊙<span class='tag'>Échange dual</span>"], ["txt", "a ⊕ (a ⊙ b) = a   devient   a ⊙ (a ⊕ b) = a"]]},

{"say": "Nous obtenons l’identité duale : a fois, a plus b, est égal à a. Avec des ensembles : A inter, A union B, égale A.", "L": [["res", "a ⊙ (a ⊕ b) = a<span class='tag'>Identité duale</span>"], ["txt", "Avec des ensembles :  A ∩ (A ∪ B) = A"]]},

{"say": "Vérifions maintenant qu’elle est valide. Cette égalité correspond à la seconde loi d’absorption, valide dans tout treillis, et donc aussi dans une algèbre de Boole. Nous la notons à gauche. La partie b est terminée.", "L": [["res", "a ⊙ (a ⊕ b) = a  est la seconde loi d’absorption   ∎<span class='tag'>Valide dans tout treillis, donc dans une algèbre de Boole</span>"]], "pin": ["(Abs) a ⊙ (a ⊕ b) = a"]},

{"title": "Conclusion", "clear": 1, "say": "Nous concluons qu’une fois une identité démontrée, son identité duale est automatiquement valide, sans avoir besoin d’une nouvelle démonstration indépendante. Avec des ensembles : si une égalité entre ensembles est valide, celle obtenue en échangeant union et intersection, et ensemble vide et U, l’est aussi. Merci d’avoir regardé.", "L": [["res", "Identité valide  ⟹  sa duale est aussi valide"], ["res", "(a)  a ⊕ 1 = 1   ⟹   a ⊙ 0 = 0"], ["res", "(b)  a ⊕ (a ⊙ b) = a   ⟹   a ⊙ (a ⊕ b) = a"], ["txt", "Avec des ensembles :  ∪ ↔ ∩,   ∅ ↔ U"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' plus ').replace(/⊙/g,' fois ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Rejouer'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Reprendre'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pause';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/henri|paul|claude|remy|rémy|male|google français$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Principe de dualité";$('sub').textContent="Exercice · Algèbre de Boole";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
