<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Idempotence avec bornes supérieure et inférieure</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(15px,1.9vw,24px)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>À retenir</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Commencer</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Vitesse <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Mode enregistrement (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"fr-FR",
"meta":{"nivel": 2, "titulo": "Idempotence avec bornes supérieure et inférieure", "enunciado": "Soit (B, ≤) un ensemble ordonné qui est un treillis, avec a ⊕ b = sup{a, b} et a ⊙ b = inf{a, b}.  Montrer que, pour tout a ∈ B :", "tesis": "a ⊕ a = a,   a ⊙ a = a", "datos": ["(Réfl)  a ≤ a", "(Sup)  s = sup S : majorant et le plus petit", "(Inf)  i = inf S : minorant et le plus grand"]},
"steps":[
{"title": "Idempotence avec bornes supérieure et inférieure", "sub": "Exercice · Treillis algébriques", "clear": 1, "say": "Bonjour. Dans cette vidéo, nous allons résoudre un exercice sur les treillis algébriques. Nous irons très lentement, en écrivant chaque équation et en justifiant chaque étape.", "L": [["txt", "Montrer que la somme et le produit du treillis sont idempotents"]]},

{"say": "D’abord, les données. B est un ensemble muni d’un ordre, c’est-à-dire d’une relation inférieur ou égal qui est réflexive, antisymétrique et transitive. Et c’est un treillis. Par définition, pour tous a et b de B, leur borne supérieure et leur borne inférieure existent. La somme de a et b est la borne supérieure de l’ensemble formé par a et b, et le produit est la borne inférieure. Avec des ensembles : l’union est la borne supérieure et l’intersection la borne inférieure, pour l’inclusion.", "L": [["hyp", "(B, ≤) ordonné,  (B, ⊕, ⊙) treillis<span class='tag'>Hypothèse</span>"], ["hyp", "a ⊕ b = sup{a, b}<span class='tag'>Hypothèse : la borne supérieure existe</span>"], ["hyp", "a ⊙ b = inf{a, b}<span class='tag'>Hypothèse : la borne inférieure existe</span>"], ["txt", "Avec des ensembles :  A ∪ B = sup{A, B},   A ∩ B = inf{A, B}"]]},

{"say": "La propriété de l’ordre que nous allons utiliser, à gauche. La réflexivité : tout élément a est inférieur ou égal à a. Et les définitions des bornes supérieure et inférieure, que nous rappelons maintenant.", "pin": ["(Réfl) a ≤ a"]},

{"say": "La borne supérieure d’un ensemble S est son plus petit majorant. Autrement dit, s est la borne supérieure de S s’il vérifie deux conditions. Un : s est un majorant, c’est-à-dire que tout élément x de S est inférieur ou égal à s. Deux : s est le plus petit, c’est-à-dire que si c est un autre majorant de S, alors s est inférieur ou égal à c.", "L": [["sub", "s = sup S  ⇔  (i) ∀ x ∈ S:  x ≤ s<span class='tag'>Majorant</span>"], ["sub", "(ii)  si ∀ x ∈ S: x ≤ c,  alors  s ≤ c<span class='tag'>C’est le plus petit</span>"]]},

{"say": "Et la borne inférieure de S est son plus grand minorant. Autrement dit, i est la borne inférieure de S s’il vérifie deux conditions. Un : i est un minorant, c’est-à-dire que i est inférieur ou égal à tout élément x de S. Deux : i est le plus grand, c’est-à-dire que si c est un autre minorant de S, alors c est inférieur ou égal à i.", "L": [["sub", "i = inf S  ⇔  (i) ∀ x ∈ S:  i ≤ x<span class='tag'>Minorant</span>"], ["sub", "(ii)  si ∀ x ∈ S: c ≤ x,  alors  c ≤ i<span class='tag'>C’est le plus grand</span>"]]},

{"say": "Nous notons les deux définitions à gauche, sous la réflexivité, car elles sont la clé de l’exercice.", "pin": ["(Sup) s = sup S ⇔ (i) x ≤ s ∀x∈S;  (ii) c majorant ⇒ s ≤ c", "(Inf) i = inf S ⇔ (i) i ≤ x ∀x∈S;  (ii) c minorant ⇒ c ≤ i"]},

{"say": "Ce que nous voulons démontrer. Pour tout élément a de B, a plus a est égal à a, et a fois a est égal à a. Avec des ensembles : A union A égale A, et A inter A égale A.", "L": [["goal", "∀ a ∈ B:   a ⊕ a = a   et   a ⊙ a = a<span class='tag'>Thèse</span>"], ["txt", "Avec des ensembles :  A ∪ A = A,   A ∩ A = A"]]},

{"title": "Partie 1 : a ⊕ a = a", "clear": 1, "say": "Commençons par la somme. Soit a un élément quelconque de B. Nous voulons montrer que a plus a est égal à a.", "L": [["txt", "Soit a ∈ B  (quelconque)"], ["goal", "Nous voulons :  a ⊕ a = a<span class='tag'>Thèse de cette partie</span>"]]},

{"say": "Première étape. Nous appliquons l’hypothèse, qui dit que a plus b est la borne supérieure de l’ensemble formé par a et b, avec b égal à a. Nous obtenons que a plus a est la borne supérieure de l’ensemble formé par a et a. Avec des ensembles : A union A est la borne supérieure de A et A.", "L": [["sub", "a ⊕ a  =  sup{a, a}<span class='tag'>Hypothèse avec b = a</span>"], ["txt", "Avec des ensembles :  A ∪ A = sup{A, A}"]]},

{"say": "Deuxième étape. Un ensemble ne répète pas ses éléments, donc l’ensemble formé par a et a est égal à l’ensemble formé par a seul. C’est un ensemble à un seul élément.", "L": [["sub", "{a, a}  =  {a}<span class='tag'>Un ensemble ne répète pas ses éléments</span>"], ["res", "a ⊕ a  =  sup{a}"]]},

{"say": "Il reste à montrer que la borne supérieure de l’ensemble formé par a seul est a. Nous le faisons avec la définition de la borne supérieure, en vérifiant les deux conditions. Autrement dit, nous voulons montrer que a est la borne supérieure de l’ensemble formé par a.", "L": [["goal", "Nous voulons :  sup{a} = a<span class='tag'>Thèse auxiliaire</span>"]]},

{"say": "Condition un : a est un majorant. Tout élément x de l’ensemble formé par a est inférieur ou égal à a. Or le seul élément est a, et a est inférieur ou égal à a par réflexivité.", "L": [["sub", "(i)  x ∈ {a}  ⇒  x = a  ⇒  x ≤ a<span class='tag'>Réflexivité : a ≤ a</span>"], ["res", "a est un majorant de {a}"]]},

{"say": "Condition deux : a est le plus petit majorant. Soit c un autre majorant de l’ensemble formé par a. C’est une hypothèse : tout élément x de l’ensemble est inférieur ou égal à c.", "L": [["txt", "Soit c ∈ B"], ["hyp", "∀ x ∈ {a}:  x ≤ c<span class='tag'>Hypothèse : c est un majorant de {a}</span>"]]},

{"say": "Comme a appartient à l’ensemble formé par a, nous appliquons l’hypothèse avec x égal à a. Nous obtenons que a est inférieur ou égal à c. Et c’est exactement ce que nous voulions montrer.", "L": [["sub", "a ∈ {a}  ⇒  a ≤ c<span class='tag'>Hypothèse avec x = a</span>"], ["res", "(ii)  c majorant de {a}  ⇒  a ≤ c"]]},

{"say": "Nous avons vérifié les deux conditions. Donc, a est la borne supérieure de l’ensemble formé par a. Et comme a plus a est cette borne supérieure, nous concluons que a plus a est égal à a. Avec des ensembles : A union A égale A. La première partie est terminée.", "L": [["res", "sup{a} = a   ⟹   a ⊕ a = a   ∎"], ["txt", "Avec des ensembles :  A ∪ A = A"]]},

{"title": "Partie 2 : a ⊙ a = a", "clear": 1, "say": "Passons à la seconde partie, avec le produit. Elle est analogue, en échangeant borne supérieure et borne inférieure, et majorants et minorants. Soit a un élément quelconque de B. Nous voulons montrer que a fois a est égal à a.", "L": [["txt", "Soit a ∈ B  (quelconque)"], ["goal", "Nous voulons :  a ⊙ a = a<span class='tag'>Thèse de cette partie</span>"]]},

{"say": "Première étape. Nous appliquons l’hypothèse, qui dit que a fois b est la borne inférieure de l’ensemble formé par a et b, avec b égal à a. Et comme l’ensemble formé par a et a est l’ensemble formé par a seul, nous obtenons que a fois a est la borne inférieure de l’ensemble formé par a. Avec des ensembles : A inter A est la borne inférieure de A et A.", "L": [["sub", "a ⊙ a  =  inf{a, a}<span class='tag'>Hypothèse avec b = a</span>"], ["txt", "Avec des ensembles :  A ∩ A = inf{A, A}"], ["res", "a ⊙ a  =  inf{a}<span class='tag'>{a, a} = {a}</span>"]]},

{"say": "Il reste à montrer que la borne inférieure de l’ensemble formé par a seul est a. Nous le faisons avec la définition de la borne inférieure, en vérifiant les deux conditions.", "L": [["goal", "Nous voulons :  inf{a} = a<span class='tag'>Thèse auxiliaire</span>"]]},

{"say": "Condition un : a est un minorant. Tout élément x de l’ensemble formé par a vérifie que a est inférieur ou égal à x. Or le seul élément est a, et a est inférieur ou égal à a par réflexivité.", "L": [["sub", "(i)  x ∈ {a}  ⇒  x = a  ⇒  a ≤ x<span class='tag'>Réflexivité : a ≤ a</span>"], ["res", "a est un minorant de {a}"]]},

{"say": "Condition deux : a est le plus grand minorant. Soit c un autre minorant de l’ensemble formé par a. C’est une hypothèse : c est inférieur ou égal à tout élément x de l’ensemble.", "L": [["txt", "Soit c ∈ B"], ["hyp", "∀ x ∈ {a}:  c ≤ x<span class='tag'>Hypothèse : c est un minorant de {a}</span>"]]},

{"say": "Comme a appartient à l’ensemble formé par a, nous appliquons l’hypothèse avec x égal à a. Nous obtenons que c est inférieur ou égal à a. Et c’est exactement ce que nous voulions montrer.", "L": [["sub", "a ∈ {a}  ⇒  c ≤ a<span class='tag'>Hypothèse avec x = a</span>"], ["res", "(ii)  c minorant de {a}  ⇒  c ≤ a"]]},

{"say": "Nous avons vérifié les deux conditions. Donc, a est la borne inférieure de l’ensemble formé par a. Et comme a fois a est cette borne inférieure, nous concluons que a fois a est égal à a. Avec des ensembles : A inter A égale A. La seconde partie est terminée.", "L": [["res", "inf{a} = a   ⟹   a ⊙ a = a   ∎"], ["txt", "Avec des ensembles :  A ∩ A = A"]]},

{"title": "Conclusion", "clear": 1, "say": "Nous avons démontré les deux égalités pour un élément a quelconque. Donc, dans tout treillis, la somme et le produit sont idempotents. Avec des ensembles : A union A égale A, et A inter A égale A. Merci d’avoir regardé.", "L": [["res", "∀ a ∈ B:   a ⊕ a = a"], ["res", "∀ a ∈ B:   a ⊙ a = a"], ["txt", "Avec des ensembles :  A ∪ A = A,   A ∩ A = A"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' plus ').replace(/⊙/g,' fois ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Rejouer'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Reprendre'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pause';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/henri|paul|claude|remy|rémy|male|google français$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Idempotence avec bornes supérieure et inférieure";$('sub').textContent="Exercice · Treillis algébriques";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
