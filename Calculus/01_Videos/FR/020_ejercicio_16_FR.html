mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}

2='170' y2='92' stroke='#7be0a0' stroke-width='6'/><polygon points='22,92 32,85 32,99' fill='#7be0a0'/><circle cx='170' cy='92' r='7' fill='#7be0a0' stroke='#7be0a0' stroke-width='3'/><line x1='310' y1='92' x2='450' y2='92' stroke='#7be0a0' stroke-width='6'/><polygon points='458,92 448,85 448,99' fill='#7be0a0'/><circle cx='310' cy='92' r='7' fill='#7be0a0' stroke='#7be0a0' stroke-width='3'/><line x1='170' y1='116' x2='170' y2='124' stroke='#9fb3aa'/><text x='170' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>0</text><line x1='240' y1='116' x2='240' y2='124' stroke='#9fb3aa'/><text x='240' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>1</text><line x1='310' y1='116' x2='310' y2='124' stroke='#9fb3aa'/><text x='310' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>2</text></svg>"]]},

{"say": "Maintenant, nous réunissons. Deux appartient à l'intervalle fermé de deux à plus l'infini, donc l'intervalle ouvert de un à deux et l'intervalle de deux à plus l'infini se rejoignent en l'intervalle ouvert de un à plus l'infini. Donc la différence symétrique est la réunion de l'intervalle de moins l'infini à zéro, fermé, avec l'intervalle ouvert de un à plus l'infini.", "L": [["txt", "(1, 2) ∪ [2, ∞) = (1, ∞)   car  2 ∈ [2, ∞)"], ["res", "A △ B = (−∞, 0] ∪ (1, ∞)"], ["txt", "<svg viewBox='0 0 470 150' width='100%' style='max-width:520px;display:block' xmlns='http://www.w3.org/2000/svg'><text x='0' y='15' fill='#7cc4ff' font-size='15' font-family='Georgia,serif'>A = (0, 2)</text><line x1='30' y1='24' x2='450' y2='24' stroke='#3d5a50' stroke-width='2'/><line x1='170' y1='24' x2='310' y2='24' stroke='#7cc4ff' stroke-width='6'/><circle cx='170' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><circle cx='310' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><text x='0' y='49' fill='#ffd166' font-size='15' font-family='Georgia,serif'>B = (−∞, 1] ∪ [2, ∞)</text><line x1='30' y1='58' x2='450' y2='58' stroke='#3d5a50' stroke-width='2'/><line x1='30' y1='58' x2='240' y2='58' stroke='#ffd166' stroke-width='6'/><polygon points='22,58 32,51 32,65' fill='#ffd166'/><circle cx='240' cy='58' r='7' fill='#ffd166' stroke='#ffd166' stroke-width='3'/><line x1='310' y1='58' x2='450' y2='58' stroke='#ffd166' stroke-width='6'/><polygon points='458,58 448,51 448,65' fill='#ffd166'/><circle cx='310' cy='58' r='7' fill='#ffd166' stroke='#ffd166' stroke-width='3'/><text x='0' y='83' fill='#7be0a0' font-size='15' font-family='Georgia,serif'>A △ B</text><line x1='30' y1='92' x2='450' y2='92' stroke='#3d5a50' stroke-width='2'/><line x1='30' y1='92' x2='170' y2='92' stroke='#7be0a0' stroke-width='6'/><polygon points='22,92 32,85 32,99' fill='#7be0a0'/><circle cx='170' cy='92' r='7' fill='#7be0a0' stroke='#7be0a0' stroke-width='3'/><line x1='240' y1='92' x2='450' y2='92' stroke='#7be0a0' stroke-width='6'/><polygon points='458,92 448,85 448,99' fill='#7be0a0'/><circle cx='240' cy='92' r='7' fill='#16231f' stroke='#7be0a0' stroke-width='3'/><line x1='170' y1='116' x2='170' y2='124' stroke='#9fb3aa'/><text x='170' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>0</text><line x1='240' y1='116' x2='240' y2='124' stroke='#9fb3aa'/><text x='240' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>1</text><line x1='310' y1='116' x2='310' y2='124' stroke='#9fb3aa'/><text x='310' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>2</text></svg>"]]},

{"title": "Résumé", "clear": 1, "say": "En résumé. A union B est toute la droite réelle. A inter B est l'intervalle de zéro, ouvert, à un, fermé. A privé de B est l'intervalle ouvert de un à deux. B privé de A est la réunion de l'intervalle de moins l'infini à zéro, fermé, avec celui de deux à plus l'infini, fermé. Et la différence symétrique est la réunion de l'intervalle de moins l'infini à zéro, fermé, avec l'intervalle de un à plus l'infini, ouvert. Merci d'avoir regardé.", "L": [["res", "A ∪ B = ℝ"], ["res", "A ∩ B = (0, 1]"], ["res", "A ∖ B = (1, 2)"], ["res", "B ∖ A = (−∞, 0] ∪ [2, ∞)"], ["res", "A △ B = (−∞, 0] ∪ (1, ∞)"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' plus ').replace(/⊙/g,' fois ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Rejouer'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Reprendre'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pause';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/henri|paul|claude|remy|rémy|male|google français$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Ensembles et inégalités";$('sub').textContent="Exercice · Algèbre des ensembles";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
