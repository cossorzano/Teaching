<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treillis : idempotence de ⊕ et ⊙</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--mut:#9fb3aa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#16231f}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3.2vw,40px);margin:12px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(16px,2.2vw,28px)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t">Treillis algébriques : idempotence</h1><div id="sub">Calcul · Exercice 1</div>
<div id="main"><div id="pin" class="pin"><h2>Hypothèses</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Commencer</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Vitesse <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Mode enregistrement (H)</button><span id="cap"></span></div></div>
<script>
const A='a ⊕ a = a', S=(c,t)=>({c,t});
const meta={nivel:2,titulo:'Treillis algébriques : idempotence',
 enunciado:'Soit (B, ⊕, ⊙) un treillis. Démontrer l’idempotence de ⊕ et de ⊙ :',
 tesis:'∀a∈B :   a ⊕ a = a,   a ⊙ a = a',
 datos:['(Abs1)  x ⊕ (x ⊙ y) = x','(Abs2)  x ⊙ (x ⊕ y) = x']};
const steps=[
{title:'Treillis algébriques : idempotence',sub:'Exercice 1',clear:1,say:'Bonjour. Dans cette vidéo, nous allons résoudre un exercice sur les treillis algébriques. Nous allons avancer très lentement, en écrivant chaque équation et en justifiant chaque étape.',L:[S('txt','Démontrer l’idempotence de ⊕ et de ⊙')]},
{say:'D’abord, les données. B est un ensemble muni de deux opérations, la somme de treillis et le produit de treillis. Les deux sont internes : si l’on combine deux éléments de B, le résultat reste dans B.',L:[S('hyp','(B, ⊕, ⊙) treillis<span class="tag">Hypothèse</span>'),S('hyp','⊕, ⊙ internes : x ⊕ y ∈ B,  x ⊙ y ∈ B<span class="tag">Hypothèse</span>')]},
{say:'De plus, elles sont commutatives et associatives. Mais attention : dans toute la démonstration, nous n’en aurons pas besoin. Nous utiliserons seulement les lois d’absorption.',L:[S('hyp','⊕, ⊙ commutatives et associatives<span class="tag">Hypothèse (non utilisée)</span>')]},
{say:'Voici la première loi d’absorption, Abs1. Elle dit que, pour tous x et y de B, x ⊕ (x ⊙ y) est égal à x. Nous la fixons à gauche, car c’est une hypothèse que nous allons utiliser.',pin:'(Abs1) x ⊕ (x ⊙ y) = x   ∀x,y∈B'},
{say:'Et la seconde, Abs2 : x ⊙ (x ⊕ y) est égal à x, également pour tous x et y. C’est la même idée avec les opérations échangées.',pin:'(Abs2) x ⊙ (x ⊕ y) = x   ∀x,y∈B'},
{say:'Ce que nous voulons démontrer : pour tout élément a de B, a ⊕ a est égal à a, et a ⊙ a est égal à a. Autrement dit, combiner un élément avec lui-même ne le change pas. C’est ce qu’on appelle l’idempotence.',L:[S('goal','Démontrer : ∀a∈B, a ⊕ a = a  et  a ⊙ a = a<span class="tag">Objectif</span>')]},
{title:'Partie 1 : idempotence de ⊕',clear:1,say:'Commençons par l’idempotence de la somme. Prenons un élément a quelconque de B. Comme il est arbitraire, ce que nous démontrerons sera vrai pour tous.',L:[S('txt','Soit a ∈ B  (arbitraire)'),S('goal','On veut : a ⊕ a = a<span class="tag">Objectif</span>')]},
{say:'Nous partons de Abs2. Rappelons : x ⊙ (x ⊕ y) = x, et c’est vrai pour tous x et y de B.',L:[S('hyp','(Abs2)  x ⊙ (x ⊕ y) = x<span class="tag">Hypothèse</span>')]},
{say:'Comme Abs2 est vraie pour tous x et y, elle l’est en particulier si l’on choisit x égal à a, et y égal à a. C’est légitime, car a appartient à B.',L:[S('sub','x = a,   y = a<span class="tag">Choix</span>')]},
{say:'Nous substituons. Là où il y avait un x, nous écrivons a, et là où il y avait un y, nous écrivons a. À gauche, il reste a ⊙ (a ⊕ a), et à droite, x devient a. Appelons cette égalité l’équation un.',L:[S('sub','a ⊙ (a ⊕ a) = a      (1)<span class="tag">Abs2 avec x=a, y=a</span>')]},
{say:'Remarquez que a ⊕ a apparaît déjà : c’est l’expression que nous voulons simplifier. Mais il nous reste à éliminer le produit à l’extérieur. Pour cela, nous utiliserons Abs1.',L:[S('hyp','(Abs1)  x ⊕ (x ⊙ y) = x<span class="tag">Hypothèse</span>')]},
{say:'Choisissons maintenant x égal à a, mais cette fois y égal à a ⊕ a. Est-ce légitime ? Oui : comme la somme est une opération interne, a ⊕ a appartient à B, donc il peut jouer le rôle de y.',L:[S('sub','x = a,   y = a ⊕ a  ∈ B<span class="tag">Choix (⊕ interne)</span>')]},
{say:'Nous substituons dans Abs1. Le x devient a. Et le y devient la parenthèse a ⊕ a. Nous obtenons a ⊕ (a ⊙ (a ⊕ a)) égal à a. C’est l’équation deux.',L:[S('sub','a ⊕ ( a ⊙ (a ⊕ a) ) = a      (2)<span class="tag">Abs1 avec x=a, y=a⊕a</span>')]},
{say:'Voici l’étape clé. Regardez à l’intérieur de la parenthèse de l’équation deux : on y trouve exactement a ⊙ (a ⊕ a). D’après l’équation un, cette expression vaut a. Mettons-la en évidence.',L:[S('sub','a ⊕ ( <mark>a ⊙ (a ⊕ a)</mark> ) = a      (2)'),S('txt','Par (1) :  <mark>a ⊙ (a ⊕ a)</mark> = a')]},
{say:'Nous remplaçons ce bloc par a. L’équation deux devient : a ⊕ a égal à a.',L:[S('sub','a ⊕ ( <mark>a</mark> ) = a'),S('res','a ⊕ a = a   ∎<span class="tag">Conclusion : ⊕ est idempotente</span>')]},
{say:'Comme a était arbitraire, cela vaut pour tout a de B. Nous avons démontré l’idempotence de la somme.',L:[S('res','∀a∈B :  a ⊕ a = a')]},
{title:'Partie 2 : idempotence de ⊙',clear:1,say:'Passons à l’idempotence du produit. L’idée est la même, mais en échangeant les rôles de Abs1 et Abs2. Prenons à nouveau un a arbitraire dans B.',L:[S('txt','Soit a ∈ B  (arbitraire)'),S('goal','On veut : a ⊙ a = a<span class="tag">Objectif</span>')]},
{say:'Cette fois, nous partons de Abs1 : x ⊕ (x ⊙ y) = x.',L:[S('hyp','(Abs1)  x ⊕ (x ⊙ y) = x<span class="tag">Hypothèse</span>')]},
{say:'Nous choisissons x égal à a, et y égal à a. C’est vrai pour tous x et y, donc en particulier pour ceux-ci.',L:[S('sub','x = a,   y = a<span class="tag">Choix</span>')]},
{say:'En substituant : a ⊕ (a ⊙ a) est égal à a. C’est l’équation trois. Maintenant apparaît a ⊙ a, que nous voulons simplifier.',L:[S('sub','a ⊕ (a ⊙ a) = a      (3)<span class="tag">Abs1 avec x=a, y=a</span>')]},
{say:'Utilisons maintenant Abs2 : x ⊙ (x ⊕ y) = x.',L:[S('hyp','(Abs2)  x ⊙ (x ⊕ y) = x<span class="tag">Hypothèse</span>')]},
{say:'Nous choisissons x égal à a, et y égal à a ⊙ a. C’est légitime car le produit est une opération interne, et donc a ⊙ a est dans B.',L:[S('sub','x = a,   y = a ⊙ a  ∈ B<span class="tag">Choix (⊙ interne)</span>')]},
{say:'Nous substituons : a ⊙ (a ⊕ (a ⊙ a)) est égal à a. C’est l’équation quatre.',L:[S('sub','a ⊙ ( a ⊕ (a ⊙ a) ) = a      (4)<span class="tag">Abs2 avec x=a, y=a⊙a</span>')]},
{say:'Observez la parenthèse intérieure de l’équation quatre : c’est a ⊕ (a ⊙ a). D’après l’équation trois, elle vaut a.',L:[S('sub','a ⊙ ( <mark>a ⊕ (a ⊙ a)</mark> ) = a      (4)'),S('txt','Par (3) :  <mark>a ⊕ (a ⊙ a)</mark> = a')]},
{say:'En remplaçant ce bloc par a, l’équation quatre devient : a ⊙ a égal à a.',L:[S('sub','a ⊙ ( <mark>a</mark> ) = a'),S('res','a ⊙ a = a   ∎<span class="tag">Conclusion : ⊙ est idempotente</span>')]},
{title:'Résumé',clear:1,say:'En résumé. Avec seulement les deux lois d’absorption, et en utilisant que les opérations sont internes, nous avons démontré que pour tout a de B, a ⊕ a vaut a, et a ⊙ a vaut a. Nous avons suivi le même schéma : appliquer une loi d’absorption avec x et y égaux à a, appliquer l’autre avec y égal au résultat, puis substituer. Merci d’avoir regardé cette vidéo.',L:[S('res','∀a∈B :  a ⊕ a = a'),S('res','∀a∈B :  a ⊙ a = a')]}
];
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l.c;d.innerHTML=l.t;if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){const d=document.createElement('div');d.className='l hyp';d.textContent=s.pin;if(k<n)d.style.animation='none';pins.appendChild(d)}}
 board.scrollTop=board.scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();txt=txt.replace(/⊕/g,' plus ').replace(/⊙/g,' fois ').replace(/[()]/g,', ').replace(/\s+/g,' ');const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang='fr-FR';
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Recommencer'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Reprendre'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pause';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/henri|remy|paul|claude|thomas|male|google français$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
document.body.addEventListener('click',()=>{},{once:true});
render(-1);$('cap').textContent='0 / '+steps.length;
</script></body></html>
