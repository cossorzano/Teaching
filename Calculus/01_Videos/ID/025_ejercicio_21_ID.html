<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Selisih dan selisih simetris</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>Ingat</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Mulai</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Kecepatan <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Mode rekam (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"id-ID",
"meta":{"nivel": 2, "titulo": "Selisih dan selisih simetris", "enunciado": "Buktikan bahwa, untuk sebarang himpunan A dan B, berlaku:", "tesis": "A ∖ B = A △ (A ∩ B)", "datos": ["(Def △)  X △ Y = (X ∖ Y) ∪ (Y ∖ X)"]},
"steps":[
{"title": "A ∖ B = A △ (A ∩ B)", "sub": "Latihan · Aljabar himpunan", "clear": 1, "say": "Halo. Dalam video ini kita akan membuktikan bahwa A kurang B sama dengan selisih simetris A dengan irisan A dan B. Kita akan bernalar unsur demi unsur, sangat perlahan, menuliskan setiap persamaan dan memberikan alasan untuk setiap langkah.", "L": [["txt", "Buktikan bahwa  A ∖ B = A △ (A ∩ B)"]]},

{"say": "Yang ingin kita buktikan. Untuk sebarang himpunan A dan B, A kurang B sama dengan A selisih simetris, irisan A dan B. Di sebelah kiri kita ingat definisi yang akan kita pakai: selisih simetris, selisih, irisan, dan gabungan dengan unsur; bahwa himpunan kosong tidak mempunyai unsur; dan bahwa dua himpunan sama jika masing-masing termuat dalam yang lain.", "L": [["goal", "A ∖ B = A △ (A ∩ B)<span class='tag'>Buktikan, untuk sebarang A dan B</span>"]], "pin": ["(Def △) X △ Y = (X ∖ Y) ∪ (Y ∖ X)", "(Def ∖) x ∈ X ∖ Y  ⟺  x ∈ X  dan  x ∉ Y", "(Def ∩) x ∈ X ∩ Y  ⟺  x ∈ X  dan  x ∈ Y", "(Def ∪) x ∈ X ∪ Y  ⟺  x ∈ X  atau  x ∈ Y", "(Def ∅) tidak ada x yang memenuhi  x ∈ ∅", "(Def =) X = Y  ⟺  X ⊆ Y  dan  Y ⊆ X"]},

{"title": "Titik awal", "clear": 1, "say": "Pertama, kita ingat definisi selisih simetris: X selisih simetris Y adalah gabungan X kurang Y, dengan Y kurang X. Sekarang kita terapkan pada kasus kita, dengan X sama dengan A, dan Y sama dengan irisan A dan B. Kita ganti X dengan A, dan Y dengan A irisan B.", "L": [["txt", "Dengan (Def △):"], ["sub", "X △ Y = (X ∖ Y) ∪ (Y ∖ X)"], ["txt", "Kita ambil  X = A  dan  Y = A ∩ B:"], ["sub", "A △ (A ∩ B) = ( A ∖ <mark>(A ∩ B)</mark> ) ∪ ( <mark>(A ∩ B)</mark> ∖ A )<span class='tag'>(★)</span>"]]},

{"title": "Rencana", "clear": 1, "say": "Sekarang kita akan menyederhanakan masing-masing dari dua bagian gabungan ini. Pada bagian satu, kita akan melihat bahwa irisan A dan B, kurang A, adalah himpunan kosong. Pada bagian dua, kita akan melihat bahwa A kurang irisan A dan B, sama dengan A kurang B. Dan pada bagian tiga, kita menyimpulkan.", "L": [["goal", "(1)  (A ∩ B) ∖ A = ∅"], ["goal", "(2)  A ∖ (A ∩ B) = A ∖ B"], ["goal", "(3)  Simpulkan dengan substitusi ke (★)"]]},

{"title": "(1) (A ∩ B) ∖ A = ∅", "clear": 1, "say": "Bagian satu. Kita ingin menunjukkan bahwa irisan A dan B, kurang A, tidak mempunyai unsur. Misalkan x adalah unsur himpunan itu, dan kita akan sampai pada kontradiksi.", "L": [["hyp", "Misalkan x ∈ (A ∩ B) ∖ A"], ["goal", "Ingin ditunjukkan:  sampai pada kontradiksi"]]},

{"say": "Menurut definisi selisih, x anggota irisan A dan B, dan x bukan anggota A.", "L": [["txt", "Dengan (Def ∖):"], ["sub", "x ∈ A ∩ B   dan   x ∉ A"]]},

{"say": "Menurut definisi irisan, x anggota irisan A dan B berarti x anggota A, dan x anggota B. Khususnya, x anggota A.", "L": [["txt", "Dengan (Def ∩):  x ∈ A ∩ B  berarti  x ∈ A  dan  x ∈ B.  Khususnya:"], ["sub", "x ∈ A"]]},

{"say": "Tetapi kita telah memperoleh bahwa x bukan anggota A. Maka x anggota A, dan x bukan anggota A, sekaligus. Ini adalah kontradiksi.", "L": [["warn", "x ∈ A   dan   x ∉ A      →   kontradiksi"]]},

{"say": "Jadi, tidak ada unsur x di irisan A dan B, kurang A. Himpunan tanpa unsur adalah himpunan kosong. Maka irisan A dan B, kurang A, adalah himpunan kosong.", "L": [["txt", "Tidak ada x yang menjadi anggota  (A ∩ B) ∖ A,  jadi:"], ["res", "(A ∩ B) ∖ A = ∅"]]},

{"title": "(2) A ∖ (A ∩ B) = A ∖ B", "clear": 1, "say": "Bagian dua. Kita ingin menunjukkan bahwa A kurang irisan A dan B, sama dengan A kurang B. Menurut definisi kesamaan, kita buktikan dua inklusi. Pertama, A kurang irisan A dan B, termuat dalam A kurang B. Kedua, A kurang B termuat dalam A kurang irisan A dan B.", "L": [["goal", "(2a)  A ∖ (A ∩ B) ⊆ A ∖ B"], ["goal", "(2b)  A ∖ B ⊆ A ∖ (A ∩ B)"]]},

{"title": "(2a) A ∖ (A ∩ B) ⊆ A ∖ B", "clear": 1, "say": "Misalkan x adalah sebarang unsur dari A kurang irisan A dan B. Menurut definisi selisih, x anggota A, dan x bukan anggota irisan A dan B.", "L": [["hyp", "Misalkan x ∈ A ∖ (A ∩ B)"], ["goal", "Ingin ditunjukkan:  x ∈ A ∖ B"], ["txt", "Dengan (Def ∖):"], ["sub", "x ∈ A   dan   x ∉ A ∩ B"]]},

{"say": "Menurut definisi irisan, x bukan anggota irisan A dan B berarti tidak benar bahwa x anggota A dan B sekaligus. Karena kita tahu x anggota A, satu-satunya cara agar keduanya tidak berlaku sekaligus adalah x bukan anggota B.", "L": [["txt", "Dengan (Def ∩):  x ∉ A ∩ B  berarti"], ["sub", "tidak (x ∈ A  dan  x ∈ B)"], ["txt", "Karena  x ∈ A,  haruslah:"], ["sub", "x ∉ B"]]},

{"say": "Jadi x anggota A, dan x bukan anggota B. Menurut definisi selisih, x anggota A kurang B. Ini membuktikan inklusi pertama.", "L": [["txt", "x ∈ A  dan  x ∉ B,  jadi dengan (Def ∖):"], ["res", "x ∈ A ∖ B"], ["res", "A ∖ (A ∩ B) ⊆ A ∖ B"]]},

{"title": "(2b) A ∖ B ⊆ A ∖ (A ∩ B)", "clear": 1, "say": "Sekarang inklusi kebalikannya. Misalkan x adalah sebarang unsur dari A kurang B. Menurut definisi selisih, x anggota A, dan x bukan anggota B.", "L": [["hyp", "Misalkan x ∈ A ∖ B"], ["goal", "Ingin ditunjukkan:  x ∈ A ∖ (A ∩ B)"], ["txt", "Dengan (Def ∖):"], ["sub", "x ∈ A   dan   x ∉ B"]]},

{"say": "Karena x bukan anggota B, tidak mungkin x menjadi anggota A dan B sekaligus. Menurut definisi irisan, x bukan anggota irisan A dan B.", "L": [["txt", "x ∉ B  ⟹  tidak (x ∈ A  dan  x ∈ B),  jadi dengan (Def ∩):"], ["sub", "x ∉ A ∩ B"]]},

{"say": "Jadi x anggota A, dan x bukan anggota irisan A dan B. Menurut definisi selisih, x anggota A kurang irisan A dan B. Ini membuktikan inklusi kedua.", "L": [["txt", "x ∈ A  dan  x ∉ A ∩ B,  jadi dengan (Def ∖):"], ["res", "x ∈ A ∖ (A ∩ B)"], ["res", "A ∖ B ⊆ A ∖ (A ∩ B)"]]},

{"title": "(2) Kesimpulan", "clear": 1, "say": "Karena kedua inklusi berlaku, menurut definisi kesamaan, kita simpulkan bahwa A kurang irisan A dan B, sama dengan A kurang B.", "L": [["txt", "(2a)  A ∖ (A ∩ B) ⊆ A ∖ B"], ["txt", "(2b)  A ∖ B ⊆ A ∖ (A ∩ B)"], ["res", "A ∖ (A ∩ B) = A ∖ B"]]},

{"title": "(3) Kesimpulan", "clear": 1, "say": "Bagian tiga. Kita kembali ke ungkapan awal. A selisih simetris, irisan A dan B, adalah gabungan A kurang irisan, dengan irisan kurang A.", "L": [["txt", "Kita mulai dari (★):"], ["sub", "A △ (A ∩ B) = ( A ∖ (A ∩ B) ) ∪ ( (A ∩ B) ∖ A )"]]},

{"say": "Kita ganti bagian kedua dengan himpunan kosong, menggunakan hasil bagian satu.", "L": [["txt", "Dengan (1),  (A ∩ B) ∖ A = ∅ :"], ["sub", "A △ (A ∩ B) = ( A ∖ (A ∩ B) ) ∪ <mark>∅</mark>"]]},

{"say": "Menggabungkan suatu himpunan dengan himpunan kosong tidak mengubah himpunan itu. Memang, x anggota gabungan himpunan X dengan himpunan kosong, jika dan hanya jika x anggota X, atau x anggota himpunan kosong. Tetapi tidak ada unsur yang menjadi anggota himpunan kosong, jadi ini setara dengan x anggota X. Kita terapkan ini dengan X sama dengan A kurang irisan A dan B.", "L": [["txt", "Dengan (Def ∪) dan (Def ∅):  x ∈ X ∪ ∅  ⟺  x ∈ X  atau  x ∈ ∅  ⟺  x ∈ X"], ["txt", "Dengan  X = A ∖ (A ∩ B):"], ["sub", "A △ (A ∩ B) = A ∖ (A ∩ B)"]]},

{"say": "Terakhir, kita ganti A kurang irisan A dan B dengan A kurang B, menggunakan hasil bagian dua.", "L": [["txt", "Dengan (2),  A ∖ (A ∩ B) = A ∖ B :"], ["res", "A △ (A ∩ B) = A ∖ B"]]},

{"title": "Kesimpulan", "clear": 1, "say": "Kesimpulan. Kita telah membuktikan bahwa, untuk sebarang himpunan A dan B, A kurang B sama dengan A selisih simetris, irisan A dan B. Terima kasih sudah menonton.", "L": [["txt", "A △ (A ∩ B) = ( A ∖ (A ∩ B) ) ∪ ∅ = A ∖ (A ∩ B) = A ∖ B"], ["res", "A ∖ B = A △ (A ∩ B)"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' tambah ').replace(/⊙/g,' kali ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Ulangi'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Lanjutkan'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Jeda';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Jeda';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Jeda';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^id/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/ardi|andika|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Selisih dan selisih simetris";$('sub').textContent="Latihan · Aljabar himpunan";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
