*{box-sizing:border-box}

"steps":[
{"title": "Nilai mutlak dan himpunan", "sub": "Latihan · Aljabar himpunan", "clear": 1, "say": "Halo. Dalam video ini kita akan menyelesaikan sebuah soal aljabar himpunan, di mana himpunannya didefinisikan dengan nilai mutlak. Kita akan berjalan sangat perlahan, menuliskan setiap persamaan dan memberikan alasan untuk setiap langkah.", "L": [["txt", "Gabungan, irisan, selisih, dan selisih simetris dua himpunan yang didefinisikan dengan nilai mutlak"]]},

{"say": "Data yang diketahui. A adalah himpunan bilangan real x sehingga nilai mutlak x lebih kecil dari dua. B adalah himpunan bilangan real x sehingga nilai mutlak x dikurangi satu, ditambah nilai mutlak x dikurangi dua, lebih kecil dari dua.", "L": [["hyp", "A = { x ∈ ℝ | |x| &lt; 2 }<span class='tag'>Diketahui</span>"], ["hyp", "B = { x ∈ ℝ | |x − 1| + |x − 2| &lt; 2 }<span class='tag'>Diketahui</span>"]]},

{"say": "Yang ingin kita lakukan. Mendefinisikan dan menghitung lima himpunan: gabungan A dan B, irisannya, A kurang B, B kurang A, dan selisih simetrisnya. Di sebelah kiri kita ingat definisi nilai mutlak dan definisi operasi dengan unsur, yang akan kita pakai.", "L": [["goal", "A ∪ B,   A ∩ B,   A ∖ B,   B ∖ A,   A △ B<span class='tag'>Definisikan dan hitung</span>"]], "pin": ["(Def |·|) |a| = a jika a ≥ 0;   |a| = −a jika a &lt; 0", "(Def ∪) A ∪ B = { x ∈ ℝ | x ∈ A atau x ∈ B }", "(Def ∩) A ∩ B = { x ∈ ℝ | x ∈ A dan x ∈ B }", "(Def ∖) A ∖ B = { x ∈ ℝ | x ∈ A dan x ∉ B }", "(Def △) A △ B = (A ∖ B) ∪ (B ∖ A)"]},

{"title": "1) Menentukan A", "clear": 1, "say": "Langkah satu. Pertama kita tentukan A dan B sebagai selang. Kita mulai dengan A. Kita punya nilai mutlak x lebih kecil dari dua. Kita gunakan definisi nilai mutlak, dan kita bedakan dua kasus menurut tanda x.", "L": [["sub", "|x| &lt; 2<span class='tag'>Pertidaksamaan A</span>"], ["hyp", "Kasus 1:  x ≥ 0   ⟹   |x| = x"], ["hyp", "Kasus 2:  x &lt; 0   ⟹   |x| = −x"]]},

{"say": "Pada kasus satu, x lebih besar atau sama dengan nol, dan nilai mutlak x sama dengan x. Pertidaksamaannya menjadi x lebih kecil dari dua. Jadi x berada di antara nol, termasuk, dan dua. Pada kasus dua, x lebih kecil dari nol, dan nilai mutlak x sama dengan minus x. Pertidaksamaannya menjadi minus x lebih kecil dari dua. Jika dikalikan dengan minus satu, tanda pertidaksamaan berbalik, dan kita dapat x lebih besar dari minus dua. Jadi x berada di antara minus dua dan nol, tanpa nol. Menggabungkan kedua kasus, x berada di antara minus dua dan dua.", "L": [["sub", "Kasus 1:  x &lt; 2   dan   x ≥ 0   ⟹   0 ≤ x &lt; 2"], ["sub", "Kasus 2:  −x &lt; 2  ⟺  x &gt; −2   dan   x &lt; 0   ⟹   −2 &lt; x &lt; 0"], ["res", "A = (−2, 2)"], ["txt", "<svg viewBox='0 0 470 82' width='100%' style='max-width:520px;display:block' xmlns='http://www.w3.org/2000/svg'><text x='0' y='15' fill='#7cc4ff' font-size='15' font-family='Georgia,serif'>A = (−2, 2)</text><line x1='30.0' y1='24' x2='440.0' y2='24' stroke='#3d5a50' stroke-width='2'/><line x1='67.27272727272728' y1='24' x2='365.45454545454544' y2='24' stroke='#7cc4ff' stroke-width='6'/><circle cx='67.27272727272728' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><circle cx='365.45454545454544' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><line x1='67.27272727272728' y1='48' x2='67.27272727272728' y2='56' stroke='#9fb3aa'/><text x='67.27272727272728' y='72' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>−2</text><line x1='216.36363636363637' y1='48' x2='216.36363636363637' y2='56' stroke='#9fb3aa'/><text x='216.36363636363637' y='72' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>0</text><line x1='253.63636363636363' y1='48' x2='253.63636363636363' y2='56' stroke='#9fb3aa'/><text x='253.63636363636363' y='72' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>1/2</text><line x1='365.45454545454544' y1='48' x2='365.45454545454544' y2='56' stroke='#9fb3aa'/><text x='365.45454545454544' y='72' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>2</text><line x1='402.72727272727275' y1='48' x2='402.72727272727275' y2='56' stroke='#9fb3aa'/><text x='402.72727272727275' y='72' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>5/2</text></svg>"]]},

{"title": "2) Menentukan B", "clear": 1, "say": "Sekarang B. Kita punya nilai mutlak x dikurangi satu, ditambah nilai mutlak x dikurangi dua, lebih kecil dari dua. Setiap nilai mutlak berubah bentuk di titik tempat isinya bernilai nol: x dikurangi satu bernilai nol di satu, dan x dikurangi dua bernilai nol di dua. Kedua titik ini membagi garis menjadi tiga zona: x lebih kecil atau sama dengan satu, x di antara satu dan dua, dan x lebih besar atau sama dengan dua.", "L": [["sub", "|x − 1| + |x − 2| &lt; 2<span class='tag'>Pertidaksamaan B</span>"], ["txt", "|x − 1| berubah di  x = 1,    |x − 2| berubah di  x = 2"], ["hyp", "Zona 1:  x ≤ 1"], ["hyp", "Zona 2:  1 ≤ x ≤ 2"], ["hyp", "Zona 3:  x ≥ 2"]]},

{"clear": 1, "say": "Zona satu: x lebih kecil atau sama dengan satu. Maka x dikurangi satu lebih kecil atau sama dengan nol, dan nilai mutlaknya adalah satu dikurangi x. Juga x dikurangi dua bernilai negatif, dan nilai mutlaknya adalah dua dikurangi x. Jumlahnya adalah satu dikurangi x, ditambah dua dikurangi x, yaitu tiga dikurangi dua x.", "L": [["hyp", "Zona 1:  x ≤ 1"], ["txt", "x − 1 ≤ 0  ⟹  |x − 1| = 1 − x"], ["txt", "x − 2 &lt; 0  ⟹  |x − 2| = 2 − x"], ["sub", "|x − 1| + |x − 2| = (1 − x) + (2 − x) = 3 − 2x"]]},

{"say": "Zona dua: x di antara satu dan dua. Maka x dikurangi satu lebih besar atau sama dengan nol, dan nilai mutlaknya adalah x dikurangi satu. Tetapi x dikurangi dua lebih kecil atau sama dengan nol, dan nilai mutlaknya adalah dua dikurangi x. Jumlahnya adalah x dikurangi satu, ditambah dua dikurangi x. Suku x saling menghapus, dan tersisa satu.", "L": [["hyp", "Zona 2:  1 ≤ x ≤ 2"], ["txt", "x − 1 ≥ 0  ⟹  |x − 1| = x − 1"], ["txt", "x − 2 ≤ 0  ⟹  |x − 2| = 2 − x"], ["sub", "|x − 1| + |x − 2| = (x − 1) + (2 − x) = 1"]], "clear": 1},

{"say": "Zona tiga: x lebih besar atau sama dengan dua. Maka kedua besaran lebih besar atau sama dengan nol, dan nilai mutlaknya adalah x dikurangi satu, dan x dikurangi dua. Jumlahnya adalah x dikurangi satu, ditambah x dikurangi dua, yaitu dua x dikurangi tiga.", "L": [["hyp", "Zona 3:  x ≥ 2"], ["txt", "x − 1 ≥ 0  ⟹  |x − 1| = x − 1"], ["txt", "x − 2 ≥ 0  ⟹  |x − 2| = x − 2"], ["sub", "|x − 1| + |x − 2| = (x − 1) + (x − 2) = 2x − 3"]], "clear": 1},

{"clear": 1, "say": "Sekarang kita syaratkan jumlahnya lebih kecil dari dua di setiap zona. Di zona satu, tiga dikurangi dua x lebih kecil dari dua. Dengan mengurangkan tiga, minus dua x lebih kecil dari minus satu. Dengan membagi dengan minus dua, tanda pertidaksamaan berbalik, dan x lebih besar dari setengah. Karena x juga lebih kecil atau sama dengan satu, di zona ini x berada di antara setengah, tidak termasuk, dan satu, termasuk.", "L": [["hyp", "Zona 1:  x ≤ 1"], ["txt", "|x − 1| + |x − 2| = 3 − 2x &lt; 2"], ["sub", "3 − 2x &lt; 2  ⟺  −2x &lt; −1  ⟺  x &gt; 1/2"], ["sub", "1/2 &lt; x ≤ 1"]]},

{"say": "Di zona dua, jumlahnya sama dengan satu, dan satu lebih kecil dari dua. Ini selalu benar, jadi semua x di antara satu dan dua, keduanya termasuk, memenuhi syarat.", "L": [["hyp", "Zona 2:  1 ≤ x ≤ 2"], ["txt", "|x − 1| + |x − 2| = 1"], ["sub", "1 &lt; 2   (selalu benar)"], ["sub", "1 ≤ x ≤ 2"]], "clear": 1},

{"say": "Di zona tiga, dua x dikurangi tiga lebih kecil dari dua. Dengan menambahkan tiga, dua x lebih kecil dari lima. Dengan membagi dengan dua, x lebih kecil dari lima per dua. Karena x juga lebih besar atau sama dengan dua, di zona ini x berada di antara dua, termasuk, dan lima per dua, tidak termasuk.", "L": [["hyp", "Zona 3:  x ≥ 2"], ["txt", "|x − 1| + |x − 2| = 2x − 3 &lt; 2"], ["sub", "2x − 3 &lt; 2  ⟺  2x &lt; 5  ⟺  x &lt; 5/2"], ["sub", "2 ≤ x &lt; 5/2"]], "clear": 1},

{"clear": 1, "say": "Menggabungkan ketiga zona, setengah lebih kecil dari x lebih kecil atau sama dengan satu, bersama x di antara satu dan dua, bersama x lebih besar atau sama dengan dua dan lebih kecil dari lima per dua, kita peroleh x berada di antara setengah dan lima per dua. Jadi, B adalah selang terbuka dari setengah sampai lima per dua.", "L": [["sub", "(1/2, 1] ∪ [1, 2] ∪ [2, 5/2) = (1/2, 5/2)"], ["res", "B = (1/2, 5/2)"], ["txt", "<svg viewBox='0 0 470 116' width='100%' style='max-width:520px;display:block' xmlns='http://www.w3.org/2000/svg'><text x='0' y='15' fill='#7cc4ff' font-size='15' font-family='Georgia,serif'>A = (−2, 2)</text><line x1='30.0' y1='24' x2='440.0' y2='24' stroke='#3d5a50' stroke-width='2'/><line x1='67.27272727272728' y1='24' x2='365.45454545454544' y2='24' stroke='#7cc4ff' stroke-width='6'/><circle cx='67.27272727272728' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><circle cx='365.45454545454544' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><text x='0' y='49' fill='#ffd166' font-size='15' font-family='Georgia,serif'>B = (1/2, 5/2)</text><line x1='30.0' y1='58' x2='440.0' y2='58' stroke='#3d5a50' stroke-width='2'/><line x1='253.63636363636363' y1='58' x2='402.72727272727275' y2='58' stroke='#ffd166' stroke-width='6'/><circle cx='253.63636363636363' cy='58' r='7' fill='#16231f' stroke='#ffd166' stroke-width='3'/><circle cx='402.72727272727275' cy='58' r='7' fill='#16231f' stroke='#ffd166' stroke-width='3'/><line x1='67.27272727272728' y1='82' x2='67.27272727272728' y2='90' stroke='#9fb3aa'/><text x='67.27272727272728' y='106' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>−2</text><line x1='216.36363636363637' y1='82' x2='216.36363636363637' y2='90' stroke='#9fb3aa'/><text x='216.36363636363637' y='106' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>0</text><line x1='253.63636363636363' y1='82' x2='253.63636363636363' y2='90' stroke='# {"title": "3) Gabungan A ∪ B", "clear": 1, "say": "Langkah tiga. Gabungan. Menurut definisi, A gabung B adalah himpunan bilangan real x sehingga x anggota A, atau x anggota B.", "L": [["sub", "A ∪ B = { x ∈ ℝ | x ∈ A  atau  x ∈ B }<span class='tag'>Definisi gabungan</span>"]]},

<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' tambah ').replace(/⊙/g,' kali ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Ulangi'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Lanjutkan'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Jeda';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Jeda';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Jeda';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^id/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/ardi|andika|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Nilai mutlak dan himpunan";$('sub').textContent="Latihan · Aljabar himpunan";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
