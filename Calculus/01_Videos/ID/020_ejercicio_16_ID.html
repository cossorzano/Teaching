<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Himpunan dan pertidaksamaan</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>Ingat</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Mulai</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Kecepatan <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Mode rekam (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"id-ID",
"meta":{"nivel": 1, "titulo": "Himpunan dan pertidaksamaan", "enunciado": "Misalkan A = { x ∈ ℝ | x² − 2x < 0 } dan B = { x ∈ ℝ | x² − 3x + 2 ≥ 0 }. Definisikan dan hitunglah:", "tesis": "A ∪ B,   A ∩ B,   A ∖ B,   B ∖ A,   A △ B", "datos": ["A = { x ∈ ℝ | x² − 2x < 0 }", "B = { x ∈ ℝ | x² − 3x + 2 ≥ 0 }", "(Def △)  A △ B = (A ∖ B) ∪ (B ∖ A)"]},
"steps":[
{"title": "Himpunan dan pertidaksamaan", "sub": "Latihan · Aljabar himpunan", "clear": 1, "say": "Halo. Dalam video ini kita akan menyelesaikan sebuah soal aljabar himpunan, di mana himpunannya didefinisikan dengan pertidaksamaan. Kita akan berjalan sangat perlahan, menuliskan setiap persamaan dan memberikan alasan untuk setiap langkah.", "L": [["txt", "Gabungan, irisan, selisih, dan selisih simetris dua himpunan yang didefinisikan dengan pertidaksamaan"]]},

{"say": "Data yang diketahui. A adalah himpunan bilangan real x sehingga x kuadrat dikurangi dua x lebih kecil dari nol. B adalah himpunan bilangan real x sehingga x kuadrat dikurangi tiga x ditambah dua lebih besar atau sama dengan nol.", "L": [["hyp", "A = { x ∈ ℝ | x² − 2x &lt; 0 }<span class='tag'>Diketahui</span>"], ["hyp", "B = { x ∈ ℝ | x² − 3x + 2 ≥ 0 }<span class='tag'>Diketahui</span>"]]},

{"say": "Yang ingin kita lakukan. Mendefinisikan dan menghitung lima himpunan: gabungan A dan B, irisannya, A kurang B, B kurang A, dan selisih simetrisnya. Kita ingat di sebelah kiri definisi dengan unsur, yang akan kita pakai.", "L": [["goal", "A ∪ B,   A ∩ B,   A ∖ B,   B ∖ A,   A △ B<span class='tag'>Definisikan dan hitung</span>"]], "pin": ["(Def ∪) A ∪ B = { x ∈ ℝ | x ∈ A atau x ∈ B }", "(Def ∩) A ∩ B = { x ∈ ℝ | x ∈ A dan x ∈ B }", "(Def ∖) A ∖ B = { x ∈ ℝ | x ∈ A dan x ∉ B }", "(Def △) A △ B = (A ∖ B) ∪ (B ∖ A)"]},

{"title": "1) Menentukan A", "clear": 1, "say": "Langkah satu. Pertama kita tentukan A dan B sebagai selang. Kita mulai dengan A. Kita punya x kuadrat dikurangi dua x lebih kecil dari nol.", "L": [["sub", "x² − 2x &lt; 0<span class='tag'>Pertidaksamaan A</span>"]]},

{"say": "Kita keluarkan faktor persekutuan x. Maka x kuadrat dikurangi dua x sama dengan x kali, x dikurangi dua. Pertidaksamaannya setara dengan x kali, x dikurangi dua, lebih kecil dari nol.", "L": [["txt", "Faktor persekutuan  x :"], ["sub", "x² − 2x &lt; 0  ⟺  x (x − 2) &lt; 0"]]},

{"say": "Hasil kali bernilai negatif jika kedua faktor berlawanan tanda. Ada dua kasus. Kasus pertama: x lebih besar dari nol, dan x dikurangi dua lebih kecil dari nol. Kasus kedua: x lebih kecil dari nol, dan x dikurangi dua lebih besar dari nol.", "L": [["txt", "Hasil kali negatif ⟺ faktor berlawanan tanda:"], ["hyp", "Kasus 1:  x &gt; 0  dan  x − 2 &lt; 0"], ["hyp", "Kasus 2:  x &lt; 0  dan  x − 2 &gt; 0"]]},

{"say": "Pada kasus satu, x lebih besar dari nol, dan x lebih kecil dari dua. Ini memberi selang terbuka dari nol sampai dua. Pada kasus dua, x lebih kecil dari nol, dan x lebih besar dari dua. Ini mustahil, karena tidak ada bilangan yang sekaligus lebih kecil dari nol dan lebih besar dari dua. Jadi, A adalah selang terbuka dari nol sampai dua.", "L": [["sub", "Kasus 1:  0 &lt; x &lt; 2"], ["warn", "Kasus 2:  x &lt; 0  dan  x &gt; 2   →   mustahil"], ["res", "A = (0, 2)"], ["txt", "<svg viewBox='0 0 470 82' width='100%' style='max-width:520px;display:block' xmlns='http://www.w3.org/2000/svg'><text x='0' y='15' fill='#7cc4ff' font-size='15' font-family='Georgia,serif'>A = (0, 2)</text><line x1='30' y1='24' x2='450' y2='24' stroke='#3d5a50' stroke-width='2'/><line x1='170' y1='24' x2='310' y2='24' stroke='#7cc4ff' stroke-width='6'/><circle cx='170' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><circle cx='310' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><line x1='170' y1='48' x2='170' y2='56' stroke='#9fb3aa'/><text x='170' y='72' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>0</text><line x1='240' y1='48' x2='240' y2='56' stroke='#9fb3aa'/><text x='240' y='72' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>1</text><line x1='310' y1='48' x2='310' y2='56' stroke='#9fb3aa'/><text x='310' y='72' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>2</text></svg>"]]},

{"title": "2) Menentukan B", "clear": 1, "say": "Sekarang B. Kita punya x kuadrat dikurangi tiga x ditambah dua lebih besar atau sama dengan nol.", "L": [["sub", "x² − 3x + 2 ≥ 0<span class='tag'>Pertidaksamaan B</span>"]]},

{"say": "Kita faktorkan polinomialnya. Akarnya adalah satu dan dua, karena satu ditambah dua sama dengan tiga, dan satu kali dua sama dengan dua. Maka x kuadrat dikurangi tiga x ditambah dua sama dengan, x dikurangi satu, kali, x dikurangi dua.", "L": [["txt", "Akar 1 dan 2  (jumlah 3, hasil kali 2):"], ["sub", "x² − 3x + 2 ≥ 0  ⟺  (x − 1)(x − 2) ≥ 0"]]},

{"say": "Hasil kali lebih besar atau sama dengan nol jika kedua faktor lebih besar atau sama dengan nol, atau keduanya lebih kecil atau sama dengan nol. Kasus satu: x dikurangi satu lebih besar atau sama dengan nol, dan x dikurangi dua lebih besar atau sama dengan nol. Kasus dua: x dikurangi satu lebih kecil atau sama dengan nol, dan x dikurangi dua lebih kecil atau sama dengan nol.", "L": [["txt", "Hasil kali ≥ 0 ⟺ faktor bertanda sama (atau salah satunya nol):"], ["hyp", "Kasus 1:  x − 1 ≥ 0  dan  x − 2 ≥ 0"], ["hyp", "Kasus 2:  x − 1 ≤ 0  dan  x − 2 ≤ 0"]]},

{"say": "Pada kasus satu, x lebih besar atau sama dengan satu, dan x lebih besar atau sama dengan dua. Keduanya berlaku bersamaan jika x lebih besar atau sama dengan dua. Pada kasus dua, x lebih kecil atau sama dengan satu, dan x lebih kecil atau sama dengan dua. Keduanya berlaku bersamaan jika x lebih kecil atau sama dengan satu. Jadi, B adalah gabungan selang dari minus tak hingga sampai satu, tertutup di satu, dengan selang dari dua sampai tak hingga, tertutup di dua.", "L": [["sub", "Kasus 1:  x ≥ 1  dan  x ≥ 2   ⟹   x ≥ 2"], ["sub", "Kasus 2:  x ≤ 1  dan  x ≤ 2   ⟹   x ≤ 1"], ["res", "B = (−∞, 1] ∪ [2, ∞)"], ["txt", "<svg viewBox='0 0 470 116' width='100%' style='max-width:520px;display:block' xmlns='http://www.w3.org/2000/svg'><text x='0' y='15' fill='#7cc4ff' font-size='15' font-family='Georgia,serif'>A = (0, 2)</text><line x1='30' y1='24' x2='450' y2='24' stroke='#3d5a50' stroke-width='2'/><line x1='170' y1='24' x2='310' y2='24' stroke='#7cc4ff' stroke-width='6'/><circle cx='170' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><circle cx='310' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><text x='0' y='49' fill='#ffd166' font-size='15' font-family='Georgia,serif'>B = (−∞, 1] ∪ [2, ∞)</text><line x1='30' y1='58' x2='450' y2='58' stroke='#3d5a50' stroke-width='2'/><line x1='30' y1='58' x2='240' y2='58' stroke='#ffd166' stroke-width='6'/><polygon points='22,58 32,51 32,65' fill='#ffd166'/><circle cx='240' cy='58' r='7' fill='#ffd166' stroke='#ffd166' stroke-width='3'/><line x1='310' y1='58' x2='450' y2='58' stroke='#ffd166' stroke-width='6'/><polygon points='458,58 448,51 448,65' fill='#ffd166'/><circle cx='310' cy='58' r='7' fill='#ffd166' stroke='#ffd166' stroke-width='3'/><line x1='170' y1='82' x2='170' y2='90' stroke='#9fb3aa'/><text x='170' y='106' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>0</text><line x1='240' y1='82' x2='240' y2='90' stroke='#9fb3aa'/><text x='240' y='106' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>1</text><line x1='310' y1='82' x2='310' y2='90' stroke='#9fb3aa'/><text x='310' y='106' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>2</text></svg>"]]},

{"title": "3) Gabungan A ∪ B", "clear": 1, "say": "Langkah tiga. Gabungan. Menurut definisi, A gabung B adalah himpunan bilangan real x sehingga x anggota A, atau x anggota B.", "L": [["sub", "A ∪ B = { x ∈ ℝ | x ∈ A  atau  x ∈ B }<span class='tag'>Definisi gabungan</span>"]]},

{"say": "Kita ganti A dan B dengan selang yang sudah kita hitung.", "L": [["txt", "Dengan mensubstitusi A dan B:"], ["sub", "A ∪ B = (0, 2) ∪ ( (−∞, 1] ∪ [2, ∞) )"]]},

{"say": "B mencakup semua bilangan sampai satu, termasuk satu, dan dari dua seterusnya, termasuk dua. Yang tidak tercakup adalah selang terbuka dari satu sampai dua, dan selang itu termuat dalam A, karena A adalah selang dari nol sampai dua. Jadi, setiap bilangan real ada di A atau di B, dan gabungannya adalah seluruh garis bilangan real.", "L": [["txt", "B tidak memuat  (1, 2) , dan  (1, 2) ⊆ (0, 2) = A"], ["res", "A ∪ B = ℝ"], ["txt", "<svg viewBox='0 0 470 150' width='100%' style='max-width:520px;display:block' xmlns='http://www.w3.org/2000/svg'><text x='0' y='15' fill='#7cc4ff' font-size='15' font-family='Georgia,serif'>A = (0, 2)</text><line x1='30' y1='24' x2='450' y2='24' stroke='#3d5a50' stroke-width='2'/><line x1='170' y1='24' x2='310' y2='24' stroke='#7cc4ff' stroke-width='6'/><circle cx='170' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><circle cx='310' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><text x='0' y='49' fill='#ffd166' font-size='15' font-family='Georgia,serif'>B = (−∞, 1] ∪ [2, ∞)</text><line x1='30' y1='58' x2='450' y2='58' stroke='#3d5a50' stroke-width='2'/><line x1='30' y1='58' x2='240' y2='58' stroke='#ffd166' stroke-width='6'/><polygon points='22,58 32,51 32,65' fill='#ffd166'/><circle cx='240' cy='58' r='7' fill='#ffd166' stroke='#ffd166' stroke-width='3'/><line x1='310' y1='58' x2='450' y2='58' stroke='#ffd166' stroke-width='6'/><polygon points='458,58 448,51 448,65' fill='#ffd166'/><circle cx='310' cy='58' r='7' fill='#ffd166' stroke='#ffd166' stroke-width='3'/><text x='0' y='83' fill='#7be0a0' font-size='15' font-family='Georgia,serif'>A ∪ B = ℝ</text><line x1='30' y1='92' x2='450' y2='92' stroke='#3d5a50' stroke-width='2'/><line x1='30' y1='92' x2='450' y2='92' stroke='#7be0a0' stroke-width='6'/><polygon points='22,92 32,85 32,99' fill='#7be0a0'/><polygon points='458,92 448,85 448,99' fill='#7be0a0'/><line x1='170' y1='116' x2='170' y2='124' stroke='#9fb3aa'/><text x='170' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>0</text><line x1='240' y1='116' x2='240' y2='124' stroke='#9fb3aa'/><text x='240' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>1</text><line x1='310' y1='116' x2='310' y2='124' stroke='#9fb3aa'/><text x='310' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>2</text></svg>"]]},

{"title": "4) Irisan A ∩ B", "clear": 1, "say": "Langkah empat. Irisan. Menurut definisi, A irisan B adalah himpunan bilangan real x sehingga x anggota A, dan x anggota B.", "L": [["sub", "A ∩ B = { x ∈ ℝ | x ∈ A  dan  x ∈ B }<span class='tag'>Definisi irisan</span>"]]},

{"say": "Kita substitusikan. Nilai bersama adalah nilai di A, antara nol dan dua, yang juga ada di B. Di dalam A, titik-titik B adalah yang lebih kecil atau sama dengan satu; selang dari dua seterusnya tidak menambah apa pun, karena dua tidak ada di A. Jadi irisannya adalah selang dari nol, terbuka, sampai satu, tertutup.", "L": [["txt", "Dengan mensubstitusi A dan B:"], ["sub", "A ∩ B = (0, 2) ∩ ( (−∞, 1] ∪ [2, ∞) )"], ["sub", "Nilai bersama:   0 &lt; x ≤ 1"], ["res", "A ∩ B = (0, 1]"], ["txt", "<svg viewBox='0 0 470 150' width='100%' style='max-width:520px;display:block' xmlns='http://www.w3.org/2000/svg'><text x='0' y='15' fill='#7cc4ff' font-size='15' font-family='Georgia,serif'>A = (0, 2)</text><line x1='30' y1='24' x2='450' y2='24' stroke='#3d5a50' stroke-width='2'/><line x1='170' y1='24' x2='310' y2='24' stroke='#7cc4ff' stroke-width='6'/><circle cx='170' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><circle cx='310' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><text x='0' y='49' fill='#ffd166' font-size='15' font-family='Georgia,serif'>B = (−∞, 1] ∪ [2, ∞)</text><line x1='30' y1='58' x2='450' y2='58' stroke='#3d5a50' stroke-width='2'/><line x1='30' y1='58' x2='240' y2='58' stroke='#ffd166' stroke-width='6'/><polygon points='22,58 32,51 32,65' fill='#ffd166'/><circle cx='240' cy='58' r='7' fill='#ffd166' stroke='#ffd166' stroke-width='3'/><line x1='310' y1='58' x2='450' y2='58' stroke='#ffd166' stroke-width='6'/><polygon points='458,58 448,51 448,65' fill='#ffd166'/><circle cx='310' cy='58' r='7' fill='#ffd166' stroke='#ffd166' stroke-width='3'/><text x='0' y='83' fill='#7be0a0' font-size='15' font-family='Georgia,serif'>A ∩ B</text><line x1='30' y1='92' x2='450' y2='92' stroke='#3d5a50' stroke-width='2'/><line x1='170' y1='92' x2='240' y2='92' stroke='#7be0a0' stroke-width='6'/><circle cx='170' cy='92' r='7' fill='#16231f' stroke='#7be0a0' stroke-width='3'/><circle cx='240' cy='92' r='7' fill='#7be0a0' stroke='#7be0a0' stroke-width='3'/><line x1='170' y1='116' x2='170' y2='124' stroke='#9fb3aa'/><text x='170' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>0</text><line x1='240' y1='116' x2='240' y2='124' stroke='#9fb3aa'/><text x='240' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>1</text><line x1='310' y1='116' x2='310' y2='124' stroke='#9fb3aa'/><text x='310' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>2</text></svg>"]]},

{"title": "5) Selisih A ∖ B", "clear": 1, "say": "Langkah lima. Selisih A kurang B. Menurut definisi, ini adalah himpunan bilangan real x sehingga x anggota A, dan x bukan anggota B.", "L": [["sub", "A ∖ B = { x ∈ ℝ | x ∈ A  dan  x ∉ B }<span class='tag'>Definisi selisih</span>"]]},

{"say": "Sekarang kita gabungkan. Dua adalah anggota selang tertutup dari dua sampai tak hingga, jadi selang terbuka dari satu sampai dua dan selang dari dua sampai tak hingga menyatu menjadi selang terbuka dari satu sampai tak hingga. Jadi, selisih simetrisnya adalah gabungan selang dari minus tak hingga sampai nol, tertutup, dengan selang terbuka dari satu sampai tak hingga.", "L": [["txt", "(1, 2) ∪ [2, ∞) = (1, ∞)   karena  2 ∈ [2, ∞)"], ["res", "A △ B = (−∞, 0] ∪ (1, ∞)"], ["txt", "<svg viewBox='0 0 470 150' width='100%' style='max-width:520px;display:block' xmlns='http://www.w3.org/2000/svg'><text x='0' y='15' fill='#7cc4ff' font-size='15' font-family='Georgia,serif'>A = (0, 2)</text><line x1='30' y1='24' x2='450' y2='24' stroke='#3d5a50' stroke-width='2'/><line x1='170' y1='24' x2='310' y2='24' stroke='#7cc4ff' stroke-width='6'/><circle cx='170' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><circle cx='310' cy='24' r='7' fill='#16231f' stroke='#7cc4ff' stroke-width='3'/><text x='0' y='49' fill='#ffd166' font-size='15' font-family='Georgia,serif'>B = (−∞, 1] ∪ [2, ∞)</text><line x1='30' y1='58' x2='450' y2='58' stroke='#3d5a50' stroke-width='2'/><line x1='30' y1='58' x2='240' y2='58' stroke='#ffd166' stroke-width='6'/><polygon points='22,58 32,51 32,65' fill='#ffd166'/><circle cx='240' cy='58' r='7' fill='#ffd166' stroke='#ffd166' stroke-width='3'/><line x1='310' y1='58' x2='450' y2='58' stroke='#ffd166' stroke-width='6'/><polygon points='458,58 448,51 448,65' fill='#ffd166'/><circle cx='310' cy='58' r='7' fill='#ffd166' stroke='#ffd166' stroke-width='3'/><text x='0' y='83' fill='#7be0a0' font-size='15' font-family='Georgia,serif'>A △ B</text><line x1='30' y1='92' x2='450' y2='92' stroke='#3d5a50' stroke-width='2'/><line x1='30' y1='92' x2='170' y2='92' stroke='#7be0a0' stroke-width='6'/><polygon points='22,92 32,85 32,99' fill='#7be0a0'/><circle cx='170' cy='92' r='7' fill='#7be0a0' stroke='#7be0a0' stroke-width='3'/><line x1='240' y1='92' x {"title": "Ringkasan", "clear": 1, "say": "Ringkasnya. A gabung B adalah seluruh garis bilangan real. A irisan B adalah selang dari nol, terbuka, sampai satu, tertutup. A kurang B adalah selang terbuka dari satu sampai dua. B kurang A adalah gabungan selang dari minus tak hingga sampai nol, tertutup, dengan selang dari dua sampai tak hingga, tertutup. Dan selisih simetrisnya adalah gabungan selang dari minus tak hingga sampai nol, tertutup, dengan selang dari satu sampai tak hingga, terbuka. Terima kasih sudah menonton.", "L": [["res", "A ∪ B = ℝ"], ["res", "A ∩ B = (0, 1]"], ["res", "A ∖ B = (1, 2)"], ["res", "B ∖ A = (−∞, 0] ∪ [2, ∞)"], ["res", "A △ B = (−∞, 0] ∪ (1, ∞)"]]}

<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' tambah ').replace(/⊙/g,' kali ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Ulangi'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Lanjutkan'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Jeda';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Jeda';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Jeda';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^id/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/ardi|andika|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Himpunan dan pertidaksamaan";$('sub').textContent="Latihan · Aljabar himpunan";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
