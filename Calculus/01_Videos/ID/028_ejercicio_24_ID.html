<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sifat distributif terhadap irisan</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>Ingat</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Mulai</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Kecepatan <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Mode rekam (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"id-ID",
"meta":{"nivel": 2, "titulo": "Sifat distributif terhadap irisan", "enunciado": "Misalkan A, B, C himpunan. Buktikan bahwa hasil kali Kartesius bersifat distributif terhadap irisan:", "tesis": "<span dir='ltr'>(A ∩ B) × C = (A × C) ∩ (B × C)</span><br><span dir='ltr'>A × (B ∩ C) = (A × B) ∩ (A × C)</span>", "datos": ["(Def ×)  (x, y) ∈ X × Y  ⟺  x ∈ X  dan  y ∈ Y"]},
"steps":[
{"title": "Sifat distributif terhadap irisan", "sub": "Latihan · Aljabar himpunan", "clear": 1, "say": "Halo. Dalam video ini kita akan membuktikan bahwa hasil kali Kartesius bersifat distributif terhadap irisan. Kita akan bernalar unsur demi unsur, sangat perlahan, menuliskan setiap persamaan dan memberikan alasan untuk setiap langkah.", "L": [["txt", "Buktikan bahwa hasil kali Kartesius bersifat distributif terhadap irisan"]]},

{"clear": 1, "say": "Yang ingin kita buktikan. Untuk sebarang himpunan A, B, dan C, berlaku dua kesamaan. Pertama: A irisan B, kali C, sama dengan A kali C, irisan B kali C. Kedua: A kali, B irisan C, sama dengan A kali B, irisan A kali C. Di sebelah kiri kita ingat definisi yang akan kita pakai: hasil kali Kartesius, irisan, inklusi, dan kesamaan himpunan.", "L": [["goal", "(1)  (A ∩ B) × C = (A × C) ∩ (B × C)"], ["goal", "(2)  A × (B ∩ C) = (A × B) ∩ (A × C)"]], "pin": ["(Def ×) (x, y) ∈ X × Y  ⟺  x ∈ X  dan  y ∈ Y", "(Def ∩) p ∈ X ∩ Y  ⟺  p ∈ X  dan  p ∈ Y", "(Def ⊆) X ⊆ Y  ⟺  setiap p ∈ X memenuhi p ∈ Y", "(Def =) X = Y  ⟺  X ⊆ Y  dan  Y ⊆ X"]},

{"title": "(1) (A ∩ B) × C = (A × C) ∩ (B × C)", "clear": 1, "say": "Kesamaan nomor 1. Menurut definisi kesamaan, kita buktikan dua inklusi: pertama, ruas kiri termuat dalam ruas kanan, dan kedua, inklusi sebaliknya.", "L": [["goal", "(i)   (A ∩ B) × C ⊆ (A × C) ∩ (B × C)"], ["goal", "(ii)  (A × C) ∩ (B × C) ⊆ (A ∩ B) × C"]]},

{"title": "(1-i) (A ∩ B) × C ⊆ (A × C) ∩ (B × C)", "clear": 1, "say": "Inklusi i. Kita ambil sebarang unsur x, y dari himpunan pertama, dan kita harus membuktikan bahwa unsur itu anggota himpunan kedua.", "L": [["hyp", "Misalkan (x, y) ∈ (A ∩ B) × C"], ["goal", "Ingin ditunjukkan:  (x, y) ∈ (A × C) ∩ (B × C)"]]},

{"say": "Menurut definisi hasil kali Kartesius, x anggota A irisan B, dan y anggota C.", "L": [["txt", "Dengan (Def ×):"], ["sub", "x ∈ A ∩ B  dan  y ∈ C"]]},

{"say": "Menurut definisi irisan, x anggota A irisan B berarti x anggota A, dan x anggota B.", "L": [["txt", "Dengan (Def ∩):  x ∈ A ∩ B  berarti"], ["sub", "x ∈ A  dan  x ∈ B"]]},

{"clear": 1, "say": "Karena x anggota A, dan y anggota C, menurut definisi hasil kali Kartesius, x, y anggota A kali C. Dan karena x anggota B, dan y anggota C, x, y anggota B kali C.", "L": [["txt", "x ∈ A  dan  y ∈ C,  jadi dengan (Def ×):"], ["sub", "(x, y) ∈ A × C"], ["txt", "x ∈ B  dan  y ∈ C,  jadi dengan (Def ×):"], ["sub", "(x, y) ∈ B × C"]]},

{"say": "Menurut definisi irisan, x, y anggota A kali C, dan x, y anggota B kali C, jadi x, y anggota irisan keduanya.", "L": [["txt", "Dengan (Def ∩):"], ["res", "(x, y) ∈ (A × C) ∩ (B × C)"]]},

{"clear": 1, "say": "Karena x, y adalah sebarang unsur, inklusi pertama terbukti.", "L": [["res", "(A ∩ B) × C ⊆ (A × C) ∩ (B × C)"]]},

{"title": "(1-ii) (A × C) ∩ (B × C) ⊆ (A ∩ B) × C", "clear": 1, "say": "Inklusi ii. Kita ambil sebarang unsur x, y dari A kali C, irisan B kali C, dan kita harus membuktikan bahwa unsur itu anggota A irisan B, kali C.", "L": [["hyp", "Misalkan (x, y) ∈ (A × C) ∩ (B × C)"], ["goal", "Ingin ditunjukkan:  (x, y) ∈ (A ∩ B) × C"]]},

{"say": "Menurut definisi irisan, x, y anggota A kali C, dan x, y anggota B kali C.", "L": [["txt", "Dengan (Def ∩):"], ["sub", "(x, y) ∈ A × C   dan   (x, y) ∈ B × C"]]},

{"say": "Menurut definisi hasil kali Kartesius, yang diterapkan pada masing-masing syarat, x anggota A, dan y anggota C. Dan juga, x anggota B, dan y anggota C.", "L": [["txt", "Dengan (Def ×):"], ["sub", "x ∈ A  dan  y ∈ C"], ["sub", "x ∈ B  dan  y ∈ C"]]},

{"say": "Khususnya, x anggota A, dan x anggota B. Menurut definisi irisan, x anggota A irisan B. Selain itu, y anggota C.", "L": [["txt", "Khususnya:"], ["sub", "x ∈ A  dan  x ∈ B   ⟹   dengan (Def ∩):  x ∈ A ∩ B"], ["sub", "y ∈ C"]]},

{"clear": 1, "say": "Jadi, x anggota A irisan B, dan y anggota C. Menurut definisi hasil kali Kartesius, x, y anggota A irisan B, kali C. Ini membuktikan inklusi kedua. Karena kedua inklusi berlaku, menurut definisi kesamaan, kesamaan nomor 1 terbukti.", "L": [["txt", "x ∈ A ∩ B  dan  y ∈ C,  jadi dengan (Def ×):"], ["res", "(x, y) ∈ (A ∩ B) × C"], ["res", "(A × C) ∩ (B × C) ⊆ (A ∩ B) × C"], ["res", "(A ∩ B) × C = (A × C) ∩ (B × C)"]]},

{"title": "(2) A × (B ∩ C) = (A × B) ∩ (A × C)", "clear": 1, "say": "Kesamaan nomor 2. Menurut definisi kesamaan, kita buktikan dua inklusi: pertama, ruas kiri termuat dalam ruas kanan, dan kedua, inklusi sebaliknya.", "L": [["goal", "(i)   A × (B ∩ C) ⊆ (A × B) ∩ (A × C)"], ["goal", "(ii)  (A × B) ∩ (A × C) ⊆ A × (B ∩ C)"]]},

{"title": "(2-i) A × (B ∩ C) ⊆ (A × B) ∩ (A × C)", "clear": 1, "say": "Inklusi i. Kita ambil sebarang unsur x, y dari himpunan pertama, dan kita harus membuktikan bahwa unsur itu anggota himpunan kedua.", "L": [["hyp", "Misalkan (x, y) ∈ A × (B ∩ C)"], ["goal", "Ingin ditunjukkan:  (x, y) ∈ (A × B) ∩ (A × C)"]]},

{"say": "Menurut definisi hasil kali Kartesius, x anggota A, dan y anggota B irisan C.", "L": [["txt", "Dengan (Def ×):"], ["sub", "x ∈ A  dan  y ∈ B ∩ C"]]},

{"say": "Menurut definisi irisan, y anggota B irisan C berarti y anggota B, dan y anggota C.", "L": [["txt", "Dengan (Def ∩):  y ∈ B ∩ C  berarti"], ["sub", "y ∈ B  dan  y ∈ C"]]},

{"clear": 1, "say": "Karena y anggota B, dan x anggota A, menurut definisi hasil kali Kartesius, x, y anggota A kali B. Dan karena y anggota C, dan x anggota A, x, y anggota A kali C.", "L": [["txt", "y ∈ B  dan  x ∈ A,  jadi dengan (Def ×):"], ["sub", "(x, y) ∈ A × B"], ["txt", "y ∈ C  dan  x ∈ A,  jadi dengan (Def ×):"], ["sub", "(x, y) ∈ A × C"]]},

{"say": "Menurut definisi irisan, x, y anggota A kali B, dan x, y anggota A kali C, jadi x, y anggota irisan keduanya.", "L": [["txt", "Dengan (Def ∩):"], ["res", "(x, y) ∈ (A × B) ∩ (A × C)"]]},

{"clear": 1, "say": "Karena x, y adalah sebarang unsur, inklusi pertama terbukti.", "L": [["res", "A × (B ∩ C) ⊆ (A × B) ∩ (A × C)"]]},

{"title": "(2-ii) (A × B) ∩ (A × C) ⊆ A × (B ∩ C)", "clear": 1, "say": "Inklusi ii. Kita ambil sebarang unsur x, y dari A kali B, irisan A kali C, dan kita harus membuktikan bahwa unsur itu anggota A kali, B irisan C.", "L": [["hyp", "Misalkan (x, y) ∈ (A × B) ∩ (A × C)"], ["goal", "Ingin ditunjukkan:  (x, y) ∈ A × (B ∩ C)"]]},

{"say": "Menurut definisi irisan, x, y anggota A kali B, dan x, y anggota A kali C.", "L": [["txt", "Dengan (Def ∩):"], ["sub", "(x, y) ∈ A × B   dan   (x, y) ∈ A × C"]]},

{"say": "Menurut definisi hasil kali Kartesius, yang diterapkan pada masing-masing syarat, x anggota A, dan y anggota B. Dan juga, x anggota A, dan y anggota C.", "L": [["txt", "Dengan (Def ×):"], ["sub", "x ∈ A  dan  y ∈ B"], ["sub", "x ∈ A  dan  y ∈ C"]]},

{"say": "Khususnya, y anggota B, dan y anggota C. Menurut definisi irisan, y anggota B irisan C. Selain itu, x anggota A.", "L": [["txt", "Khususnya:"], ["sub", "y ∈ B  dan  y ∈ C   ⟹   dengan (Def ∩):  y ∈ B ∩ C"], ["sub", "x ∈ A"]]},

{"clear": 1, "say": "Jadi, y anggota B irisan C, dan x anggota A. Menurut definisi hasil kali Kartesius, x, y anggota A kali, B irisan C. Ini membuktikan inklusi kedua. Karena kedua inklusi berlaku, menurut definisi kesamaan, kesamaan nomor 2 terbukti.", "L": [["txt", "y ∈ B ∩ C  dan  x ∈ A,  jadi dengan (Def ×):"], ["res", "(x, y) ∈ A × (B ∩ C)"], ["res", "(A × B) ∩ (A × C) ⊆ A × (B ∩ C)"], ["res", "A × (B ∩ C) = (A × B) ∩ (A × C)"]]},

{"title": "Kesimpulan", "clear": 1, "say": "Kesimpulan. Kita telah membuktikan kedua kesamaan. Artinya, hasil kali Kartesius bersifat distributif terhadap irisan, baik dari kiri maupun dari kanan. Terima kasih sudah menonton.", "L": [["res", "(1)  (A ∩ B) × C = (A × C) ∩ (B × C)"], ["res", "(2)  A × (B ∩ C) = (A × B) ∩ (A × C)"], ["txt", "Hasil kali Kartesius bersifat distributif terhadap irisan"]]}

<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' tambah ').replace(/⊙/g,' kali ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Ulangi'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Lanjutkan'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Jeda';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Jeda';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Jeda';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^id/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/ardi|andika|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Sifat distributif terhadap irisan";$('sub').textContent="Latihan · Aljabar himpunan";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
