<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Latis: sifat idempoten ⊕ dan ⊙</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--mut:#9fb3aa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#16231f}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3.2vw,40px);margin:12px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(16px,2.2vw,28px)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t">Latis aljabar: sifat idempoten</h1><div id="sub">Kalkulus · Latihan 1</div>
<div id="main"><div id="pin" class="pin"><h2>Hipotesis</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Mulai</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Kecepatan <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Mode rekam (H)</button><span id="cap"></span></div></div>
<script>
const A='a ⊕ a = a', S=(c,t)=>({c,t});
const meta={nivel:2,titulo:'Latis aljabar: sifat idempoten',
 enunciado:'Misalkan (B, ⊕, ⊙) sebuah latis. Buktikan sifat idempoten dari ⊕ dan ⊙:',
 tesis:'∀a∈B:   a ⊕ a = a,   a ⊙ a = a',
 datos:['(Abs1)  x ⊕ (x ⊙ y) = x','(Abs2)  x ⊙ (x ⊕ y) = x']};
const steps=[
{title:'Latis aljabar: sifat idempoten',sub:'Latihan 1',clear:1,say:'Halo. Dalam video ini kita akan menyelesaikan sebuah soal tentang latis aljabar. Kita akan berjalan sangat perlahan, menuliskan setiap persamaan dan memberikan alasan untuk setiap langkah.',L:[S('txt','Buktikan sifat idempoten dari ⊕ dan ⊙')]},
{say:'Pertama, data yang diketahui. B adalah himpunan dengan dua operasi, yaitu jumlah latis dan hasil kali latis. Keduanya tertutup: jika kita mengoperasikan dua anggota B, hasilnya tetap berada di B.',L:[S('hyp','(B, ⊕, ⊙) latis<span class="tag">Hipotesis</span>'),S('hyp','⊕, ⊙ tertutup: x ⊕ y ∈ B,  x ⊙ y ∈ B<span class="tag">Hipotesis</span>')]},
{say:'Selain itu, keduanya bersifat komutatif dan asosiatif. Tetapi perhatikan: dalam seluruh pembuktian kita tidak akan memerlukannya. Kita hanya akan menggunakan hukum absorpsi.',L:[S('hyp','⊕, ⊙ komutatif dan asosiatif<span class="tag">Hipotesis (tidak digunakan)</span>')]},
{say:'Inilah hukum absorpsi pertama, Abs1. Hukum ini menyatakan bahwa untuk sembarang x dan y di B, x ⊕ (x ⊙ y) sama dengan x. Kita tempelkan di sebelah kiri, karena ini adalah hipotesis yang akan kita gunakan.',pin:'(Abs1) x ⊕ (x ⊙ y) = x   ∀x,y∈B'},
{say:'Dan yang kedua, Abs2: x ⊙ (x ⊕ y) sama dengan x, juga untuk semua x dan y. Idenya sama, hanya operasinya ditukar.',pin:'(Abs2) x ⊙ (x ⊕ y) = x   ∀x,y∈B'},
{say:'Yang ingin kita buktikan: untuk setiap anggota a di B, a ⊕ a sama dengan a, dan a ⊙ a sama dengan a. Artinya, mengoperasikan suatu anggota dengan dirinya sendiri tidak mengubahnya. Inilah yang disebut sifat idempoten.',L:[S('goal','Buktikan: ∀a∈B, a ⊕ a = a  dan  a ⊙ a = a<span class="tag">Tujuan</span>')]},
{title:'Bagian 1: sifat idempoten ⊕',clear:1,say:'Kita mulai dengan sifat idempoten penjumlahan. Ambil sembarang anggota a di B. Karena a sembarang, apa yang kita buktikan akan berlaku untuk semua anggota.',L:[S('txt','Misalkan a ∈ B  (sembarang)'),S('goal','Kita ingin: a ⊕ a = a<span class="tag">Tujuan</span>')]},
{say:'Kita mulai dari Abs2. Ingat: x ⊙ (x ⊕ y) = x, dan ini berlaku untuk semua x dan y di B.',L:[S('hyp','(Abs2)  x ⊙ (x ⊕ y) = x<span class="tag">Hipotesis</span>')]},
{say:'Karena Abs2 berlaku untuk sembarang x dan y, maka khususnya berlaku juga jika kita memilih x sama dengan a, dan y sama dengan a. Ini sah, karena a adalah anggota B.',L:[S('sub','x = a,   y = a<span class="tag">Pemilihan</span>')]},
{say:'Kita substitusikan. Di tempat x kita tulis a, dan di tempat y kita tulis a. Di ruas kiri tersisa a ⊙ (a ⊕ a), dan di ruas kanan, x menjadi a. Kita sebut kesamaan ini persamaan satu.',L:[S('sub','a ⊙ (a ⊕ a) = a      (1)<span class="tag">Abs2 dengan x=a, y=a</span>')]},
{say:'Perhatikan bahwa a ⊕ a sudah muncul, yaitu ekspresi yang ingin kita sederhanakan. Tetapi kita masih harus menghilangkan perkalian di luarnya. Untuk itu, kita akan menggunakan Abs1.',L:[S('hyp','(Abs1)  x ⊕ (x ⊙ y) = x<span class="tag">Hipotesis</span>')]},
{say:'Sekarang kita pilih x sama dengan a, tetapi kali ini y sama dengan a ⊕ a. Apakah ini sah? Ya: karena penjumlahan adalah operasi tertutup, a ⊕ a adalah anggota B, sehingga bisa berperan sebagai y.',L:[S('sub','x = a,   y = a ⊕ a  ∈ B<span class="tag">Pemilihan (⊕ tertutup)</span>')]},
{say:'Kita substitusikan ke Abs1. x menjadi a. Dan y menjadi kurung a ⊕ a. Kita peroleh a ⊕ (a ⊙ (a ⊕ a)) sama dengan a. Inilah persamaan dua.',L:[S('sub','a ⊕ ( a ⊙ (a ⊕ a) ) = a      (2)<span class="tag">Abs1 dengan x=a, y=a⊕a</span>')]},
{say:'Sekarang langkah kuncinya. Lihat ke dalam kurung pada persamaan dua: di sana ada tepat a ⊙ (a ⊕ a). Menurut persamaan satu, ekspresi ini sama dengan a. Kita tandai.',L:[S('sub','a ⊕ ( <mark>a ⊙ (a ⊕ a)</mark> ) = a      (2)'),S('txt','Dari (1):  <mark>a ⊙ (a ⊕ a)</mark> = a')]},
{say:'Kita ganti blok itu dengan a. Persamaan dua menjadi: a ⊕ a sama dengan a.',L:[S('sub','a ⊕ ( <mark>a</mark> ) = a'),S('res','a ⊕ a = a   ∎<span class="tag">Kesimpulan: ⊕ idempoten</span>')]},
{say:'Karena a sembarang, ini berlaku untuk setiap a di B. Sifat idempoten penjumlahan sudah terbukti.',L:[S('res','∀a∈B:  a ⊕ a = a')]},
{title:'Bagian 2: sifat idempoten ⊙',clear:1,say:'Sekarang sifat idempoten perkalian. Idenya sama, tetapi peran Abs1 dan Abs2 ditukar. Kita ambil lagi sembarang a di B.',L:[S('txt','Misalkan a ∈ B  (sembarang)'),S('goal','Kita ingin: a ⊙ a = a<span class="tag">Tujuan</span>')]},
{say:'Kali ini kita mulai dari Abs1: x ⊕ (x ⊙ y) = x.',L:[S('hyp','(Abs1)  x ⊕ (x ⊙ y) = x<span class="tag">Hipotesis</span>')]},
{say:'Kita pilih x sama dengan a, dan y sama dengan a. Hukum ini berlaku untuk semua x dan y, jadi khususnya untuk pilihan ini.',L:[S('sub','x = a,   y = a<span class="tag">Pemilihan</span>')]},
{say:'Dengan substitusi: a ⊕ (a ⊙ a) sama dengan a. Inilah persamaan tiga. Sekarang muncul a ⊙ a, yang ingin kita sederhanakan.',L:[S('sub','a ⊕ (a ⊙ a) = a      (3)<span class="tag">Abs1 dengan x=a, y=a</span>')]},
{say:'Sekarang kita gunakan Abs2: x ⊙ (x ⊕ y) = x.',L:[S('hyp','(Abs2)  x ⊙ (x ⊕ y) = x<span class="tag">Hipotesis</span>')]},
{say:'Kita pilih x sama dengan a, dan y sama dengan a ⊙ a. Ini sah karena perkalian adalah operasi tertutup, sehingga a ⊙ a berada di B.',L:[S('sub','x = a,   y = a ⊙ a  ∈ B<span class="tag">Pemilihan (⊙ tertutup)</span>')]},
{say:'Kita substitusikan: a ⊙ (a ⊕ (a ⊙ a)) sama dengan a. Inilah persamaan empat.',L:[S('sub','a ⊙ ( a ⊕ (a ⊙ a) ) = a      (4)<span class="tag">Abs2 dengan x=a, y=a⊙a</span>')]},
{say:'Perhatikan kurung bagian dalam pada persamaan empat: yaitu a ⊕ (a ⊙ a). Menurut persamaan tiga, nilainya sama dengan a.',L:[S('sub','a ⊙ ( <mark>a ⊕ (a ⊙ a)</mark> ) = a      (4)'),S('txt','Dari (3):  <mark>a ⊕ (a ⊙ a)</mark> = a')]},
{say:'Dengan mengganti blok itu dengan a, persamaan empat menjadi: a ⊙ a sama dengan a.',L:[S('sub','a ⊙ ( <mark>a</mark> ) = a'),S('res','a ⊙ a = a   ∎<span class="tag">Kesimpulan: ⊙ idempoten</span>')]},
{title:'Ringkasan',clear:1,say:'Sebagai ringkasan. Hanya dengan dua hukum absorpsi, dan dengan memakai fakta bahwa operasinya tertutup, kita telah membuktikan bahwa untuk setiap a di B, a ⊕ a sama dengan a, dan a ⊙ a sama dengan a. Kita mengikuti pola yang sama dua kali: terapkan satu hukum absorpsi dengan x dan y sama dengan a, terapkan hukum yang lain dengan y sama dengan hasil tersebut, lalu substitusikan. Terima kasih sudah menonton.',L:[S('res','∀a∈B:  a ⊕ a = a'),S('res','∀a∈B:  a ⊙ a = a')]}
];
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l.c;d.innerHTML=l.t;if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){const d=document.createElement('div');d.className='l hyp';d.textContent=s.pin;if(k<n)d.style.animation='none';pins.appendChild(d)}}
 board.scrollTop=board.scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();txt=txt.replace(/⊕/g,' tambah ').replace(/⊙/g,' kali ').replace(/[()]/g,', ').replace(/\s+/g,' ');const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang='id-ID';
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Ulangi'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Lanjutkan'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Jeda';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Jeda';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Jeda';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^id/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/ardi|andika|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
document.body.addEventListener('click',()=>{},{once:true});
render(-1);$('cap').textContent='0 / '+steps.length;
</script></body></html>
