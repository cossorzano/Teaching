<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Garis real diperluas</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>Ingat</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Mulai</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Kecepatan <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Mode rekam (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"id-ID",
"meta":{"nivel": 0, "titulo": "Garis real diperluas", "enunciado": "Ringkasan: definisi, urutan, supremum dan infimum, serta operasi pada garis real diperluas", "datos": ["Definisi", "Urutan", "Supremum dan infimum", "Operasi yang terdefinisi", "Operasi yang tak terdefinisi", "Bukan medan"]},
"steps":[
{"title": "Garis real diperluas", "sub": "Ringkasan: definisi, urutan, supremum dan infimum, serta operasi pada garis real diperluas", "clear": 1, "say": "Halo. Dalam video ini kita merangkum garis real diperluas: bagaimana definisinya, bagaimana urutannya, apa yang terjadi dengan supremum dan infimum, dan operasi apa saja yang dapat dilakukan dengan plus dan minus tak hingga.", "L": [["txt", "Garis real diperluas  <span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span>"]]},

{"title": "1) Definisi", "clear": 1, "say": "Garis real diperluas diperoleh dengan menambahkan dua simbol, minus tak hingga dan plus tak hingga, pada bilangan real. Garis ini ditulis dengan garis di atas huruf R bergaris ganda untuk bilangan real.", "L": [["goal", "<span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span> = ℝ ∪ { −∞, +∞ }"]], "pin": ["Definisi: <span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span> = ℝ ∪ {−∞, +∞}"]},

{"title": "2) Urutan", "clear": 1, "say": "Pertama, urutan. Urutan pada garis real diperluas memperluas urutan bilangan real. Untuk setiap x real, minus tak hingga kurang dari atau sama dengan x, dan x kurang dari atau sama dengan plus tak hingga. Dan minus tak hingga lebih kecil dari plus tak hingga.", "L": [["goal", "≤  memperluas urutan pada ℝ"], ["res", "∀ x ∈ ℝ :   −∞ ≤ x ≤ +∞"], ["res", "−∞ &lt; +∞"]], "pin": ["Urutan: −∞ ≤ x ≤ +∞"]},

{"title": "3) Batas", "clear": 1, "say": "Kedua, batas. Berbeda dengan bilangan real, pada garis diperluas setiap himpunan bagian A mempunyai supremum dan infimum, tanpa perlu terbatas. Misalnya, himpunan kosong: setiap unsur adalah batas atas himpunan kosong, dan yang terkecil adalah minus tak hingga. Jadi, supremum himpunan kosong adalah minus tak hingga, dan infimumnya adalah plus tak hingga.", "L": [["goal", "Setiap  A ⊆ <span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span>  mempunyai supremum dan infimum di <span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span>"], ["txt", "Misalnya, untuk  A = ∅:"], ["sub", "sup ∅ = −∞,        inf ∅ = +∞"]], "pin": ["Setiap A ⊆ <span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span> punya sup A dan inf A"]},

{"title": "4) Supremum", "clear": 1, "say": "Ketiga, kapan supremum bernilai plus atau minus tak hingga. Jika A himpunan bagian dari bilangan real, supremum A adalah plus tak hingga jika dan hanya jika A tidak terbatas di atas dalam bilangan real. Dan supremum A adalah minus tak hingga jika dan hanya jika A himpunan kosong, atau A himpunan yang hanya berisi minus tak hingga.", "L": [["goal", "Supremum"], ["res", "A ⊆ ℝ:   sup A = +∞   ⟺   A tidak terbatas di atas dalam ℝ"], ["res", "sup A = −∞   ⟺   A = ∅   atau   A = { −∞ }"]], "pin": ["Supremum: +∞ jika tak terbatas; −∞ jika A=∅ atau {−∞}"]},

{"say": "Secara umum, untuk himpunan bagian A sembarang dari garis real diperluas, supremumnya plus tak hingga jika dan hanya jika plus tak hingga anggota A, atau bagian real dari A tidak terbatas di atas.", "L": [["txt", "Secara umum, untuk  A ⊆ <span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span> :"], ["sub", "sup A = +∞   ⟺   +∞ ∈ A   atau   A ∩ ℝ tidak terbatas di atas dalam ℝ"]]},

{"title": "5) Infimum", "clear": 1, "say": "Keempat, infimum, yang simetris. Jika A himpunan bagian dari bilangan real, infimum A adalah minus tak hingga jika dan hanya jika A tidak terbatas di bawah dalam bilangan real. Dan infimum A adalah plus tak hingga jika dan hanya jika A himpunan kosong, atau A himpunan yang hanya berisi plus tak hingga.", "L": [["goal", "Infimum"], ["res", "A ⊆ ℝ:   inf A = −∞   ⟺   A tidak terbatas di bawah dalam ℝ"], ["res", "inf A = +∞   ⟺   A = ∅   atau   A = { +∞ }"]], "pin": ["Infimum: −∞ jika tak terbatas; +∞ jika A=∅ atau {+∞}"]},

{"title": "6) Operasi", "clear": 1, "say": "Kelima, operasi, yang hanya terdefinisi sebagian. Penjumlahan: untuk setiap x real, x tambah plus tak hingga adalah plus tak hingga, dan x tambah minus tak hingga adalah minus tak hingga. Perkalian: jika a lebih besar dari nol, a kali plus tak hingga adalah plus tak hingga, dan a kali minus tak hingga adalah minus tak hingga. Jika a lebih kecil dari nol, tandanya berbalik: a kali plus tak hingga adalah minus tak hingga, dan a kali minus tak hingga adalah plus tak hingga.", "L": [["goal", "Operasi yang terdefinisi"], ["res", "x + (±∞) = ±∞        ∀ x ∈ ℝ"], ["res", "a · (±∞) = ±∞        jika  a &gt; 0"], ["res", "a · (±∞) = ∓∞        jika  a &lt; 0"]], "pin": ["Operasi: x+(±∞)=±∞, a·(±∞)=±∞ (a>0)"]},

{"say": "Dan pembagian: untuk setiap a real, a dibagi plus atau minus tak hingga adalah nol. Yang juga terdefinisi adalah plus tak hingga tambah plus tak hingga, yaitu plus tak hingga, dan minus tak hingga tambah minus tak hingga, yaitu minus tak hingga.", "L": [["res", "a / (±∞) = 0        ∀ a ∈ ℝ"], ["res", "(+∞) + (+∞) = +∞,        (−∞) + (−∞) = −∞"]]},

{"title": "7) Operasi tak terdefinisi", "clear": 1, "say": "Namun, ada operasi yang tidak terdefinisi, karena tidak dapat diberi nilai yang masuk akal. Plus tak hingga dikurangi plus tak hingga, yaitu menjumlahkan plus tak hingga dengan minus tak hingga, tidak terdefinisi. Begitu juga nol kali plus atau minus tak hingga.", "L": [["goal", "Tidak terdefinisi"], ["warn", "(+∞) + (−∞)    yaitu,    ∞ − ∞"], ["warn", "0 · (±∞)"]]},

{"title": "8) Catatan", "clear": 1, "say": "Catatan akhir. Garis real diperluas bukan medan dan bukan gelanggang. Misalnya, plus tak hingga tidak mempunyai lawan: tidak ada unsur yang jika dijumlahkan dengan plus tak hingga menghasilkan nol. Garis ini hanya boleh dipakai sebagai alat bantu untuk menggambarkan perilaku tak terbatas.", "L": [["warn", "<span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span> bukan medan dan bukan gelanggang"], ["txt", "Misalnya,  +∞  tidak mempunyai lawan"], ["txt", "Alat bantu untuk perilaku tak terbatas"]]},

{"title": "Ringkasan", "clear": 1, "say": "Ringkasnya. Garis real diperluas adalah bilangan real ditambah minus tak hingga dan plus tak hingga. Urutannya memperluas urutan bilangan real, dan setiap himpunan bagian mempunyai supremum dan infimum. Operasinya terdefinisi sebagian, dan garis ini bukan medan maupun gelanggang. Terima kasih sudah menonton.", "L": [["res", "<span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span> = ℝ ∪ { −∞, +∞ },    −∞ ≤ x ≤ +∞"], ["res", "Setiap A ⊆ <span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span> punya  sup A  dan  inf A"], ["res", "∞ − ∞   dan   0 · (±∞)   tak terdefinisi"], ["res", "<span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span> bukan medan dan bukan gelanggang"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' tambah ').replace(/⊙/g,' kali ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Ulangi'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Lanjutkan'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Jeda';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Jeda';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Jeda';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^id/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/ardi|andika|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Garis real diperluas";$('sub').textContent="Ringkasan: definisi, urutan, supremum dan infimum, serta operasi pada garis real diperluas";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
