<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Idempoten dengan supremum dan infimum</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(15px,1.9vw,24px)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>Ingat</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Mulai</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Kecepatan <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Mode rekam (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"id-ID",
"meta":{"nivel": 2, "titulo": "Idempoten dengan supremum dan infimum", "enunciado": "Misalkan (B, ≤) himpunan terurut yang merupakan latis, dengan a ⊕ b = sup{a, b} dan a ⊙ b = inf{a, b}.  Buktikan bahwa untuk setiap a ∈ B:", "tesis": "a ⊕ a = a,   a ⊙ a = a", "datos": ["(Refl)  a ≤ a", "(Sup)  s = sup S: batas atas dan yang terkecil", "(Inf)  i = inf S: batas bawah dan yang terbesar"]},
"steps":[
{"title": "Idempoten dengan supremum dan infimum", "sub": "Latihan · Latis aljabar", "clear": 1, "say": "Halo. Dalam video ini kita akan menyelesaikan sebuah soal tentang latis aljabar. Kita akan berjalan sangat perlahan, menuliskan setiap persamaan dan memberikan alasan untuk setiap langkah.", "L": [["txt", "Buktikan bahwa jumlah dan hasil kali latis bersifat idempoten"]]},

{"say": "Pertama, data yang diketahui. B adalah himpunan dengan sebuah urutan, yaitu relasi kurang dari atau sama dengan yang refleksif, antisimetris, dan transitif. Dan B adalah latis. Menurut definisi, untuk sebarang a dan b di B, supremum dan infimumnya ada. Jumlah a dan b adalah supremum dari himpunan yang dibentuk oleh a dan b, dan hasil kalinya adalah infimum. Pada himpunan: terhadap relasi termuat, gabungan adalah supremum dan irisan adalah infimum.", "L": [["hyp", "(B, ≤) terurut,  (B, ⊕, ⊙) latis<span class='tag'>Hipotesis</span>"], ["hyp", "a ⊕ b = sup{a, b}<span class='tag'>Hipotesis: supremum ada</span>"], ["hyp", "a ⊙ b = inf{a, b}<span class='tag'>Hipotesis: infimum ada</span>"], ["txt", "Pada himpunan:  A ∪ B = sup{A, B},   A ∩ B = inf{A, B}"]]},

{"say": "Sifat urutan yang akan kita pakai, di sebelah kiri. Sifat refleksif: setiap anggota a kurang dari atau sama dengan a. Dan definisi supremum serta infimum, yang kita ingat sekarang.", "pin": ["(Refl) a ≤ a"]},

{"say": "Supremum dari himpunan S adalah batas atas terkecilnya. Artinya, s adalah supremum dari S jika memenuhi dua syarat. Satu: s adalah batas atas, yaitu setiap anggota x dari S kurang dari atau sama dengan s. Dua: s yang terkecil, yaitu jika c batas atas lain dari S, maka s kurang dari atau sama dengan c.", "L": [["sub", "s = sup S  ⇔  (i) ∀ x ∈ S:  x ≤ s<span class='tag'>Batas atas</span>"], ["sub", "(ii)  jika ∀ x ∈ S: x ≤ c,  maka  s ≤ c<span class='tag'>Ia yang terkecil</span>"]]},

{"say": "Dan infimum dari S adalah batas bawah terbesarnya. Artinya, i adalah infimum dari S jika memenuhi dua syarat. Satu: i adalah batas bawah, yaitu i kurang dari atau sama dengan setiap anggota x dari S. Dua: i yang terbesar, yaitu jika c batas bawah lain dari S, maka c kurang dari atau sama dengan i.", "L": [["sub", "i = inf S  ⇔  (i) ∀ x ∈ S:  i ≤ x<span class='tag'>Batas bawah</span>"], ["sub", "(ii)  jika ∀ x ∈ S: c ≤ x,  maka  c ≤ i<span class='tag'>Ia yang terbesar</span>"]]},

{"say": "Kita catat kedua definisi di sebelah kiri, di bawah sifat refleksif, karena keduanya adalah kunci soal ini.", "pin": ["(Sup) s = sup S ⇔ (i) x ≤ s ∀x∈S;  (ii) c batas atas ⇒ s ≤ c", "(Inf) i = inf S ⇔ (i) i ≤ x ∀x∈S;  (ii) c batas bawah ⇒ c ≤ i"]},

{"say": "Yang ingin kita buktikan. Untuk setiap anggota a dari B, a tambah a sama dengan a, dan a kali a sama dengan a. Pada himpunan: A gabung A adalah A, dan A irisan A adalah A.", "L": [["goal", "∀ a ∈ B:   a ⊕ a = a   dan   a ⊙ a = a<span class='tag'>Yang dibuktikan</span>"], ["txt", "Pada himpunan:  A ∪ A = A,   A ∩ A = A"]]},

{"title": "Bagian 1: a ⊕ a = a", "clear": 1, "say": "Kita mulai dengan penjumlahan. Misalkan a sebarang anggota B. Kita ingin membuktikan bahwa a tambah a sama dengan a.", "L": [["txt", "Misalkan a ∈ B  (sebarang)"], ["goal", "Kita ingin:  a ⊕ a = a<span class='tag'>Yang dibuktikan di bagian ini</span>"]]},

{"say": "Langkah pertama. Kita terapkan hipotesis, yang menyatakan a tambah b adalah supremum dari himpunan yang dibentuk oleh a dan b, dengan b sama dengan a. Kita peroleh a tambah a adalah supremum dari himpunan yang dibentuk oleh a dan a. Pada himpunan: A gabung A adalah supremum dari A dan A.", "L": [["sub", "a ⊕ a  =  sup{a, a}<span class='tag'>Hipotesis dengan b = a</span>"], ["txt", "Pada himpunan:  A ∪ A = sup{A, A}"]]},

{"say": "Langkah kedua. Himpunan tidak mengulang anggotanya, jadi himpunan yang dibentuk oleh a dan a sama dengan himpunan yang hanya berisi a. Ini himpunan dengan satu anggota.", "L": [["sub", "{a, a}  =  {a}<span class='tag'>Himpunan tidak mengulang anggota</span>"], ["res", "a ⊕ a  =  sup{a}"]]},

{"say": "Tinggal membuktikan bahwa supremum dari himpunan yang hanya berisi a adalah a. Kita lakukan dengan definisi supremum, memeriksa kedua syarat. Artinya, kita ingin membuktikan bahwa a adalah supremum dari himpunan yang berisi a.", "L": [["goal", "Kita ingin:  sup{a} = a<span class='tag'>Pernyataan bantu</span>"]]},

{"say": "Syarat satu: a adalah batas atas. Setiap anggota x dari himpunan yang berisi a kurang dari atau sama dengan a. Tetapi satu-satunya anggota adalah a, dan a kurang dari atau sama dengan a karena sifat refleksif.", "L": [["sub", "(i)  x ∈ {a}  ⇒  x = a  ⇒  x ≤ a<span class='tag'>Refleksif: a ≤ a</span>"], ["res", "a batas atas dari {a}"]]},

{"say": "Syarat dua: a adalah batas atas terkecil. Misalkan c batas atas lain dari himpunan yang berisi a. Ini adalah hipotesis: setiap anggota x dari himpunan itu kurang dari atau sama dengan c.", "L": [["txt", "Misalkan c ∈ B"], ["hyp", "∀ x ∈ {a}:  x ≤ c<span class='tag'>Hipotesis: c batas atas dari {a}</span>"]]},

{"say": "Karena a anggota himpunan yang berisi a, kita terapkan hipotesis dengan x sama dengan a. Kita peroleh a kurang dari atau sama dengan c. Dan inilah tepatnya yang ingin kita buktikan.", "L": [["sub", "a ∈ {a}  ⇒  a ≤ c<span class='tag'>Hipotesis dengan x = a</span>"], ["res", "(ii)  c batas atas dari {a}  ⇒  a ≤ c"]]},

{"say": "Kita sudah memeriksa kedua syarat. Jadi, a adalah supremum dari himpunan yang berisi a. Dan karena a tambah a adalah supremum itu, kita simpulkan bahwa a tambah a sama dengan a. Pada himpunan: A gabung A adalah A. Dengan ini bagian pertama selesai.", "L": [["res", "sup{a} = a   ⟹   a ⊕ a = a   ∎"], ["txt", "Pada himpunan:  A ∪ A = A"]]},

{"title": "Bagian 2: a ⊙ a = a", "clear": 1, "say": "Sekarang bagian kedua, dengan perkalian. Caranya serupa, dengan menukar supremum menjadi infimum, dan batas atas menjadi batas bawah. Misalkan a sebarang anggota B. Kita ingin membuktikan bahwa a kali a sama dengan a.", "L": [["txt", "Misalkan a ∈ B  (sebarang)"], ["goal", "Kita ingin:  a ⊙ a = a<span class='tag'>Yang dibuktikan di bagian ini</span>"]]},

{"say": "Langkah pertama. Kita terapkan hipotesis, yang menyatakan a kali b adalah infimum dari himpunan yang dibentuk oleh a dan b, dengan b sama dengan a. Dan karena himpunan yang dibentuk oleh a dan a adalah himpunan yang hanya berisi a, kita peroleh a kali a adalah infimum dari himpunan yang berisi a. Pada himpunan: A irisan A adalah infimum dari A dan A.", "L": [["sub", "a ⊙ a  =  inf{a, a}<span class='tag'>Hipotesis dengan b = a</span>"], ["txt", "Pada himpunan:  A ∩ A = inf{A, A}"], ["res", "a ⊙ a  =  inf{a}<span class='tag'>{a, a} = {a}</span>"]]},

{"say": "Tinggal membuktikan bahwa infimum dari himpunan yang hanya berisi a adalah a. Kita lakukan dengan definisi infimum, memeriksa kedua syarat.", "L": [["goal", "Kita ingin:  inf{a} = a<span class='tag'>Pernyataan bantu</span>"]]},

{"say": "Syarat satu: a adalah batas bawah. Setiap anggota x dari himpunan yang berisi a memenuhi a kurang dari atau sama dengan x. Tetapi satu-satunya anggota adalah a, dan a kurang dari atau sama dengan a karena sifat refleksif.", "L": [["sub", "(i)  x ∈ {a}  ⇒  x = a  ⇒  a ≤ x<span class='tag'>Refleksif: a ≤ a</span>"], ["res", "a batas bawah dari {a}"]]},

{"say": "Syarat dua: a adalah batas bawah terbesar. Misalkan c batas bawah lain dari himpunan yang berisi a. Ini adalah hipotesis: c kurang dari atau sama dengan setiap anggota x dari himpunan itu.", "L": [["txt", "Misalkan c ∈ B"], ["hyp", "∀ x ∈ {a}:  c ≤ x<span class='tag'>Hipotesis: c batas bawah dari {a}</span>"]]},

{"say": "Karena a anggota himpunan yang berisi a, kita terapkan hipotesis dengan x sama dengan a. Kita peroleh c kurang dari atau sama dengan a. Dan inilah tepatnya yang ingin kita buktikan.", "L": [["sub", "a ∈ {a}  ⇒  c ≤ a<span class='tag'>Hipotesis dengan x = a</span>"], ["res", "(ii)  c batas bawah dari {a}  ⇒  c ≤ a"]]},

{"say": "Kita sudah memeriksa kedua syarat. Jadi, a adalah infimum dari himpunan yang berisi a. Dan karena a kali a adalah infimum itu, kita simpulkan bahwa a kali a sama dengan a. Pada himpunan: A irisan A adalah A. Dengan ini bagian kedua selesai.", "L": [["res", "inf{a} = a   ⟹   a ⊙ a = a   ∎"], ["txt", "Pada himpunan:  A ∩ A = A"]]},

{"title": "Kesimpulan", "clear": 1, "say": "Kita sudah membuktikan kedua kesamaan untuk sebarang anggota a. Jadi, pada setiap latis, penjumlahan dan perkalian bersifat idempoten. Pada himpunan: A gabung A adalah A, dan A irisan A adalah A. Terima kasih sudah menonton.", "L": [["res", "∀ a ∈ B:   a ⊕ a = a"], ["res", "∀ a ∈ B:   a ⊙ a = a"], ["txt", "Pada himpunan:  A ∪ A = A,   A ∩ A = A"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' tambah ').replace(/⊙/g,' kali ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Ulangi'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Lanjutkan'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Jeda';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Jeda';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Jeda';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^id/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/ardi|andika|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Idempoten dengan supremum dan infimum";$('sub').textContent="Latihan · Latis aljabar";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
