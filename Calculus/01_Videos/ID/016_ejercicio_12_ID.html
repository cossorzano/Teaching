<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>𝒫(U) adalah latis distributif</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}

.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}

</style></head><body><div id="app">

<script type="application/json" id="data">
{"lang":"id-ID",
"meta":{"nivel": 2, "titulo": "𝒫(U) adalah latis distributif", "enunciado": "Buktikan bahwa (𝒫(U), ∪, ∩) adalah latis distributif.", "tesis": "(1)  A ∩ (B ∪ C) = (A ∩ B) ∪ (A ∩ C),   (2)  A ∪ (B ∩ C) = (A ∪ B) ∩ (A ∪ C)", "datos": ["(Hipotesis)  (𝒫(U), ∪, ∩) adalah latis", "(Inklusi ganda)  X = Y ⇔ X ⊆ Y dan Y ⊆ X", "(Def ∪, ∩)  x ∈ X ∪ Y ⇔ x ∈ X atau x ∈ Y,   x ∈ X ∩ Y ⇔ x ∈ X dan x ∈ Y"]},
"steps":[
{"title": "𝒫(U) adalah latis distributif", "sub": "Latihan · Aljabar himpunan", "clear": 1, "say": "Halo. Dalam video ini kita akan menyelesaikan sebuah soal tentang aljabar himpunan. Kita akan berjalan sangat perlahan, menuliskan setiap persamaan dan memberikan alasan untuk setiap langkah.", "L": [["txt", "Buktikan bahwa himpunan kuasa U, dengan gabungan dan irisan, adalah latis distributif"]]},

{"say": "Pertama, data yang diketahui. Kita sudah tahu bahwa himpunan kuasa U, dengan gabungan dan irisan, adalah latis, di mana gabungan berperan sebagai supremum, dan irisan sebagai infimum.", "L": [["hyp", "(𝒫(U), ∪, ∩) adalah latis<span class='tag'>Hipotesis: sudah diketahui</span>"], ["txt", "∪ = supremum,     ∩ = infimum"]]},

{"say": "Agar distributif, kita harus memeriksa bahwa, untuk sembarang himpunan bagian A, B, dan C dari U, dua kesamaan berlaku. Yang pertama: A irisan, B gabung C, sama dengan, A irisan B, gabung, A irisan C. Yang kedua: A gabung, B irisan C, sama dengan, A gabung B, irisan, A gabung C.", "L": [["txt", "Misalkan A, B, C ⊆ U"], ["goal", "(1)  A ∩ (B ∪ C) = (A ∩ B) ∪ (A ∩ C)<span class='tag'>Yang dibuktikan</span>"], ["goal", "(2)  A ∪ (B ∩ C) = (A ∪ B) ∩ (A ∪ C)<span class='tag'>Yang dibuktikan</span>"]]},

{"say": "Kita akan membuktikan kedua kesamaan dengan inklusi ganda. Ingat bahwa dua himpunan sama jika dan hanya jika masing-masing termuat dalam yang lain. Dan ingat definisi gabungan dan irisan dengan unsur: x anggota gabungan jika x anggota salah satu dari kedua himpunan, dan x anggota irisan jika x anggota keduanya. Kita catat di sebelah kiri.", "L": [["sub", "X = Y  ⇔  X ⊆ Y  dan  Y ⊆ X<span class='tag'>Kesamaan dengan inklusi ganda</span>"], ["sub", "X ⊆ Y  ⇔  (x ∈ X ⇒ x ∈ Y)<span class='tag'>Inklusi</span>"]], "pin": ["(Inklusi ganda) X = Y ⇔ X ⊆ Y dan Y ⊆ X", "(Def ∪) x ∈ X ∪ Y ⇔ x ∈ X atau x ∈ Y", "(Def ∩) x ∈ X ∩ Y ⇔ x ∈ X dan x ∈ Y"]},

{"title": "Hukum pertama: A ∩ (B ∪ C) ⊆ (A ∩ B) ∪ (A ∩ C)", "clear": 1, "say": "Kita mulai dengan kesamaan pertama. Misalkan x sebuah unsur dari U. Pertama kita buktikan inklusi dari kiri ke kanan. Kita andaikan x anggota A irisan, B gabung C. Ini adalah hipotesis.", "L": [["txt", "Misalkan x ∈ U"], ["hyp", "x ∈ A ∩ (B ∪ C)<span class='tag'>Hipotesis</span>"], ["goal", "Ingin dibuktikan:  x ∈ (A ∩ B) ∪ (A ∩ C)<span class='tag'>Yang dibuktikan</span>"]]},

{"say": "Menurut definisi irisan, x anggota A, dan x anggota B gabung C. Dan menurut definisi gabungan, x anggota B gabung C berarti x anggota B, atau x anggota C.", "L": [["hyp", "x ∈ A   dan   x ∈ B ∪ C<span class='tag'>Definisi ∩</span>"], ["hyp", "x ∈ A   dan   (x ∈ B  atau  x ∈ C)<span class='tag'>Definisi ∪</span>"]]},

{"say": "Sekarang kita bedakan dua kasus. Kasus pertama: x anggota B. Karena x juga anggota A, menurut definisi irisan, x anggota A irisan B.", "L": [["sub", "Kasus 1:  x ∈ B"], ["sub", "x ∈ A  dan  x ∈ B   ⟹   x ∈ A ∩ B<span class='tag'>Definisi ∩</span>"]]},

{"say": "Kasus kedua: x anggota C. Karena x juga anggota A, menurut definisi irisan, x anggota A irisan C.", "L": [["sub", "Kasus 2:  x ∈ C"], ["sub", "x ∈ A  dan  x ∈ C   ⟹   x ∈ A ∩ C<span class='tag'>Definisi ∩</span>"]]},

{"say": "Dalam kasus mana pun, x anggota A irisan B, atau x anggota A irisan C. Menurut definisi gabungan, x anggota A irisan B, gabung, A irisan C. Dengan ini inklusi tersebut selesai.", "L": [["res", "x ∈ (A ∩ B) ∪ (A ∩ C)<span class='tag'>Definisi ∪, dalam kasus mana pun</span>"], ["res", "A ∩ (B ∪ C) ⊆ (A ∩ B) ∪ (A ∩ C)   ∎"]]},

{"title": "Hukum pertama: (A ∩ B) ∪ (A ∩ C) ⊆ A ∩ (B ∪ C)", "clear": 1, "say": "Sebaliknya, kita buktikan inklusi dari kanan ke kiri. Kita andaikan x anggota A irisan B, gabung, A irisan C. Ini adalah hipotesis. Menurut definisi gabungan, x anggota A irisan B, atau x anggota A irisan C.", "L": [["hyp", "x ∈ (A ∩ B) ∪ (A ∩ C)<span class='tag'>Hipotesis</span>"], ["hyp", "x ∈ A ∩ B   atau   x ∈ A ∩ C<span class='tag'>Definisi ∪</span>"], ["goal", "Ingin dibuktikan:  x ∈ A ∩ (B ∪ C)<span class='tag'>Yang dibuktikan</span>"]]},

{"say": "Dalam kasus mana pun, x anggota A. Jika x anggota A irisan B, maka x anggota A dan B. Dan jika x anggota A irisan C, maka x anggota A dan C. Selain itu, pada kasus pertama x anggota B, dan pada kasus kedua x anggota C. Artinya, x anggota A, dan, x anggota B atau x anggota C.", "L": [["sub", "x ∈ A   dan   (x ∈ B  atau  x ∈ C)<span class='tag'>Definisi ∩ pada tiap kasus</span>"]]},

{"say": "Menurut definisi gabungan, x anggota B atau x anggota C berarti x anggota B gabung C.", "L": [["sub", "x ∈ A   dan   x ∈ B ∪ C<span class='tag'>Definisi ∪</span>"]]},

{"say": "Jadi, menurut definisi irisan, x anggota A irisan, B gabung C. Dengan ini inklusi tersebut selesai.", "L": [["res", "x ∈ A ∩ (B ∪ C)<span class='tag'>Definisi ∩</span>"], ["res", "(A ∩ B) ∪ (A ∩ C) ⊆ A ∩ (B ∪ C)   ∎"]]},

{"title": "Hukum distributif pertama", "clear": 1, "say": "Kita sudah membuktikan kedua inklusi. Dengan inklusi ganda, kita simpulkan kesamaan pertama: A irisan, B gabung C, sama dengan, A irisan B, gabung, A irisan C.", "L": [["res", "A ∩ (B ∪ C) = (A ∩ B) ∪ (A ∩ C)   ∎<span class='tag'>Inklusi ganda</span>"]]},

{"title": "Hukum kedua (1): A ∪ (B ∩ C) ⊆ (A ∪ B) ∩ (A ∪ C)", "clear": 1, "say": "Sekarang kita buktikan hukum distributif kedua, juga dengan inklusi ganda. Misalkan x sebuah unsur dari U. Kita mulai dengan bagian satu: membuktikan bahwa A gabung, B irisan C, termuat dalam, A gabung B, irisan, A gabung C. Kita andaikan x anggota A gabung, B irisan C. Ini adalah hipotesis.", "L": [["txt", "Misalkan x ∈ U"], ["hyp", "x ∈ A ∪ (B ∩ C)<span class='tag'>Hipotesis</span>"], ["goal", "Ingin dibuktikan:  x ∈ (A ∪ B) ∩ (A ∪ C)<span class='tag'>Yang dibuktikan</span>"]]},

{"say": "Menurut definisi gabungan, x anggota A, atau x anggota B irisan C. Kita bedakan dua kasus.", "L": [["hyp", "x ∈ A   atau   x ∈ B ∩ C<span class='tag'>Definisi ∪</span>"]]},

{"say": "Kasus pertama: x anggota A. Maka jelas, menurut definisi gabungan, x anggota A gabung B, dan x anggota A gabung C. Jadi, x anggota irisan kedua gabungan itu.", "L": [["sub", "Kasus 1:  x ∈ A"], ["sub", "x ∈ A ∪ B   dan   x ∈ A ∪ C<span class='tag'>Definisi ∪</span>"], ["res", "x ∈ (A ∪ B) ∩ (A ∪ C)<span class='tag'>Definisi ∩</span>"]]},

{"say": "Kasus kedua: x anggota B irisan C. Maka x anggota B, dan x anggota C. Khususnya, x anggota A gabung B, karena x anggota B. Dan x anggota A gabung C, karena x anggota C. Jadi x anggota irisan kedua gabungan itu.", "L": [["sub", "Kasus 2:  x ∈ B ∩ C   ⟹   x ∈ B  dan  x ∈ C<span class='tag'>Definisi ∩</span>"], ["sub", "x ∈ A ∪ B  (karena x ∈ B)   dan   x ∈ A ∪ C  (karena x ∈ C)<span class='tag'>Definisi ∪</span>"], ["res", "x ∈ (A ∪ B) ∩ (A ∪ C)<span class='tag'>Definisi ∩</span>"]]},

{"say": "Dalam kedua kasus, x anggota A gabung B, irisan, A gabung C. Dan karena itu, A gabung, B irisan C, termuat dalam, A gabung B, irisan, A gabung C.", "L": [["res", "A ∪ (B ∩ C) ⊆ (A ∪ B) ∩ (A ∪ C)   ∎<span class='tag'>Pada kedua kasus</span>"]]},

{"title": "Hukum kedua (2): (A ∪ B) ∩ (A ∪ C) ⊆ A ∪ (B ∩ C)", "clear": 1, "say": "Kita beralih ke bagian dua: membuktikan bahwa A gabung B, irisan, A gabung C, termuat dalam, A gabung, B irisan C. Sekarang kita andaikan x anggota A gabung B, irisan, A gabung C. Ini adalah hipotesis.", "L": [["hyp", "x ∈ (A ∪ B) ∩ (A ∪ C)<span class='tag'>Hipotesis</span>"], ["goal", "Ingin dibuktikan:  x ∈ A ∪ (B ∩ C)<span class='tag'>Yang dibuktikan</span>"]]},

{"say": "Menurut definisi irisan, x anggota A gabung B, dan x anggota A gabung C. Dan menurut definisi gabungan, ini berarti: x anggota A atau x anggota B, dan juga, x anggota A atau x anggota C.", "L": [["hyp", "x ∈ A ∪ B   dan   x ∈ A ∪ C<span class='tag'>Definisi ∩</span>"], ["hyp", "(x ∈ A  atau  x ∈ B)   dan   (x ∈ A  atau  x ∈ C)<span class='tag'>Definisi ∪</span>"]]},

{"say": "Kasus pertama: andaikan x anggota A. Ini adalah hipotesis. Maka jelas, menurut definisi gabungan, x anggota A gabung, B irisan C, dan selesai.", "L": [["hyp", "Kasus:  x ∈ A<span class='tag'>Hipotesis kasus</span>"], ["res", "x ∈ A ∪ (B ∩ C)<span class='tag'>Definisi ∪: selesai</span>"]]},

{"say": "Kasus kedua: maka andaikan x bukan anggota A. Ini adalah hipotesis. Dengan pengandaian ini, dari syarat-syarat sebelumnya diperoleh hal berikut.", "L": [["hyp", "Kasus:  x ∉ A<span class='tag'>Hipotesis kasus</span>"]]},

{"say": "Dari x anggota A gabung B, dan x bukan anggota A, diperoleh bahwa x anggota B.", "L": [["sub", "x ∈ A ∪ B   dan   x ∉ A   ⟹   x ∈ B<span class='tag'>Jika x ∈ A atau x ∈ B, dan x ∉ A, maka x ∈ B</span>"]]},

{"say": "Dari x anggota A gabung C, dan x bukan anggota A, diperoleh bahwa x anggota C.", "L": [["sub", "x ∈ A ∪ C   dan   x ∉ A   ⟹   x ∈ C<span class='tag'>Jika x ∈ A atau x ∈ C, dan x ∉ A, maka x ∈ C</span>"]]},

{"say": "Jadi, x anggota B, dan x anggota C. Artinya, menurut definisi irisan, x anggota B irisan C.", "L": [["sub", "x ∈ B   dan   x ∈ C   ⟹   x ∈ B ∩ C<span class='tag'>Definisi ∩</span>"]]},

{"say": "Akibatnya, menurut definisi gabungan, x anggota A gabung, B irisan C.", "L": [["res", "x ∈ A ∪ (B ∩ C)<span class='tag'>Definisi ∪</span>"]]},

{"say": "Kita sudah membuktikan bahwa dalam semua kasus x anggota A gabung, B irisan C. Jadi, A gabung B, irisan, A gabung C, termuat dalam, A gabung, B irisan C.", "L": [["res", "(A ∪ B) ∩ (A ∪ C) ⊆ A ∪ (B ∩ C)   ∎<span class='tag'>Pada semua kasus</span>"]]},

{"title": "Hukum distributif kedua", "clear": 1, "say": "Dari bagian satu dan dua, dengan inklusi ganda, kita simpulkan kesamaannya: A gabung, B irisan C, sama dengan, A gabung B, irisan, A gabung C. Artinya, gabungan distributif terhadap irisan.", "L": [["res", "A ∪ (B ∩ C) = (A ∪ B) ∩ (A ∪ C)   ∎<span class='tag'>Inklusi ganda: gabungan distributif terhadap irisan</span>"]]},

{"title": "Kesimpulan", "clear": 1, "say": "Karena kedua hukum distributif berlaku pada himpunan kuasa U, dengan gabungan dan irisan, kita simpulkan bahwa ia adalah latis distributif. Terima kasih sudah menonton.", "L": [["res", "A ∩ (B ∪ C) = (A ∩ B) ∪ (A ∩ C)<span class='tag'>Irisan distributif terhadap gabungan</span>"], ["res", "A ∪ (B ∩ C) = (A ∪ B) ∩ (A ∪ C)<span class='tag'>Gabungan distributif terhadap irisan</span>"], ["res", "(𝒫(U), ∪, ∩) adalah latis distributif   ∎"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' tambah ').replace(/⊙/g,' kali ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Ulangi'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Lanjutkan'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Jeda';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Jeda';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Jeda';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^id/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/ardi|andika|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="𝒫(U) adalah latis distributif";$('sub').textContent="Latihan · Aljabar himpunan";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
