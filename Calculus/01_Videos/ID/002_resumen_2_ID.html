<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Struktur aljabar</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:30%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(15px,1.9vw,24px)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>Ingat</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Mulai</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Kecepatan <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Mode rekam (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"id-ID",
"meta":{"nivel": 0, "titulo": "Struktur aljabar", "enunciado": "Ringkasan: latis, latis distributif, dan aljabar Boole", "datos": ["Latis", "Latis distributif", "Aljabar Boole", "Teorema-teorema aljabar Boole", "Prinsip dualitas"]},
"steps":[
{"title": "Struktur aljabar", "sub": "Ringkasan: latis, latis distributif, dan aljabar Boole", "clear": 1, "say": "Halo. Dalam video ini kita mengulas, langsung dengan rumus-rumusnya, tiga struktur aljabar yang saling bertingkat: latis, latis distributif, dan aljabar Boole.", "L": [["txt", "Latis  ⊂  Latis distributif  ⊂  Aljabar Boole"]]},

{"title": "Latis", "clear": 1, "say": "Kita mulai dengan latis. Tripel B, tambah berlingkar, titik berlingkar, adalah latis jika kedua operasinya biner dan tertutup, serta beberapa sifat berlaku untuk semua a, b, dan c di B.", "L": [["hyp", "(B, ⊕, ⊙) latis<span class='tag'>⊕, ⊙ biner dan tertutup</span>"], ["hyp", "Berlaku  ∀ a, b, c ∈ B"]]},

{"say": "Sifat pertama, komutatif. a tambah b sama dengan b tambah a. Dan a kali b sama dengan b kali a.", "L": [["sub", "a ⊕ b = b ⊕ a<span class='tag'>Komutatif</span>"], ["sub", "a ⊙ b = b ⊙ a<span class='tag'>Komutatif</span>"]]},

{"say": "Sifat kedua, asosiatif. a tambah, b tambah c, sama dengan, a tambah b, tambah c. Begitu pula dengan perkalian: a kali, b kali c, sama dengan, a kali b, kali c.", "L": [["sub", "a ⊕ (b ⊕ c) = (a ⊕ b) ⊕ c<span class='tag'>Asosiatif</span>"], ["sub", "a ⊙ (b ⊙ c) = (a ⊙ b) ⊙ c<span class='tag'>Asosiatif</span>"]]},

{"say": "Sifat ketiga, absorpsi. a tambah, a kali b, sama dengan a. Dan a kali, a tambah b, sama dengan a. Setiap operasi menyerap operasi lainnya.", "L": [["sub", "a ⊕ (a ⊙ b) = a<span class='tag'>Absorpsi</span>"], ["sub", "a ⊙ (a ⊕ b) = a<span class='tag'>Absorpsi</span>"]]},

{"say": "Dari aksioma-aksioma ini diturunkan sebuah teorema: sifat idempoten. a tambah a adalah a, dan a kali a adalah a. Mengoperasikan suatu anggota dengan dirinya sendiri tidak mengubah apa pun.", "L": [["res", "a ⊕ a = a<span class='tag'>Teorema: idempoten</span>"], ["res", "a ⊙ a = a<span class='tag'>Teorema: idempoten</span>"]]},

{"say": "Kita catat di sebelah kiri inti dari latis: komutatif, asosiatif, dan absorpsi.", "pin": "Latis: komutatif, asosiatif, absorpsi"},

{"title": "Latis distributif", "clear": 1, "say": "Sekarang latis distributif. Ini adalah latis yang juga memenuhi sifat distributif.", "L": [["goal", "Latis distributif  =  Latis  +  distributif"]]},

{"say": "Setiap operasi bersifat distributif terhadap yang lain. a tambah, b kali c, sama dengan, a tambah b, kali, a tambah c. Dan a kali, b tambah c, sama dengan, a kali b, tambah, a kali c.", "L": [["sub", "a ⊕ (b ⊙ c) = (a ⊕ b) ⊙ (a ⊕ c)<span class='tag'>Distributif</span>"], ["sub", "a ⊙ (b ⊕ c) = (a ⊙ b) ⊕ (a ⊙ c)<span class='tag'>Distributif</span>"]]},

{"title": "Aljabar Boole", "clear": 1, "say": "Dan sampailah kita pada aljabar Boole. Ini adalah latis distributif yang juga memiliki anggota terkecil, nol, anggota terbesar, satu, dan komplemen untuk setiap anggota.", "L": [["goal", "Aljabar Boole  =  Latis distributif  +  0, 1  +  komplemen"]]},

{"say": "Nol adalah anggota netral penjumlahan, dan satu adalah anggota netral perkalian. a tambah nol adalah a. Dan a kali satu adalah a.", "L": [["sub", "a ⊕ 0 = a<span class='tag'>0 netral untuk ⊕</span>"], ["sub", "a ⊙ 1 = a<span class='tag'>1 netral untuk ⊙</span>"]]},

{"say": "Setiap anggota a memiliki komplemen, yang kita tulis dengan tanda tilde di depannya. Komplemen harus memenuhi kedua syarat sekaligus: a tambah komplemennya adalah satu, dan a kali komplemennya adalah nol.", "L": [["sub", "a ⊕ ∼a = 1<span class='tag'>Komplemen (keduanya harus berlaku)</span>"], ["sub", "a ⊙ ∼a = 0<span class='tag'>Komplemen (keduanya harus berlaku)</span>"]]},

{"say": "Karena merupakan latis distributif, komplemen setiap anggota bersifat tunggal. Selain itu, komplemen dari nol adalah satu.", "L": [["res", "∼a tunggal untuk setiap a"], ["res", "∼0 = 1"]]},

{"say": "Kita catat di sebelah kiri inti dari aljabar Boole.", "pin": "Boole: distributif + 0, 1 + komplemen"},

{"title": "Teorema-teorema aljabar Boole", "clear": 1, "say": "Dalam aljabar Boole berlaku beberapa teorema. Yang pertama adalah hukum involusi: komplemen dari komplemen a adalah a.", "L": [["res", "∼(∼a) = a<span class='tag'>Hukum involusi</span>"]]},

{"say": "Kedua, dominasi. a tambah satu adalah satu. Dan a kali nol adalah nol.", "L": [["res", "a ⊕ 1 = 1<span class='tag'>Dominasi</span>"], ["res", "a ⊙ 0 = 0<span class='tag'>Dominasi</span>"]]},

{"say": "Ketiga, hukum De Morgan. a tambah b adalah komplemen dari, komplemen a kali komplemen b. Dan a kali b adalah komplemen dari, komplemen a tambah komplemen b.", "L": [["res", "a ⊕ b = ∼(∼a ⊙ ∼b)<span class='tag'>Hukum De Morgan</span>"], ["res", "a ⊙ b = ∼(∼a ⊕ ∼b)<span class='tag'>Hukum De Morgan</span>"]]},

{"title": "Prinsip dualitas", "clear": 1, "say": "Terakhir, prinsip dualitas. Setiap identitas yang benar tetap benar jika kita menukar penjumlahan dengan perkalian, dan nol dengan satu.", "L": [["goal", "⊕ ↔ ⊙,      0 ↔ 1"]]},

{"say": "Mari kita lihat contohnya. a tambah nol sama dengan a adalah identitas yang benar. Dengan menukar operasi dan anggota netralnya, kita peroleh a kali satu sama dengan a, yang juga benar.", "L": [["sub", "a ⊕ 0 = a<span class='tag'>Identitas yang benar</span>"], ["sub", "⊕ ↔ ⊙,  0 ↔ 1"], ["res", "a ⊙ 1 = a<span class='tag'>Identitas dual, juga benar</span>"]]},

{"title": "Ringkasan", "clear": 1, "say": "Ringkasnya. Latis memerlukan sifat komutatif, asosiatif, dan absorpsi. Latis distributif menambahkan sifat distributif. Dan aljabar Boole menambahkan nol, satu, dan komplemen, yang menghasilkan involusi, dominasi, De Morgan, dan dualitas. Terima kasih sudah menonton.", "L": [["res", "Latis: komutatif, asosiatif, absorpsi ⟹ idempoten"], ["res", "+ distributif ⟹ Latis distributif"], ["res", "+ 0, 1, ∼a ⟹ Aljabar Boole ⟹ involusi, dominasi, De Morgan, dualitas"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){const d=document.createElement('div');d.className='l hyp';d.innerHTML=s.pin;if(k<n)d.style.animation='none';pins.appendChild(d)}}
 board.scrollTop=board.scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' tambah ').replace(/⊙/g,' kali ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Ulangi'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Lanjutkan'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Jeda';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Jeda';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Jeda';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^id/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/ardi|andika|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Struktur aljabar";$('sub').textContent="Ringkasan: latis, latis distributif, dan aljabar Boole";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
