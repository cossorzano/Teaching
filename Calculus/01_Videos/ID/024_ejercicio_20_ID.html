<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Selisih simetris</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>Ingat</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Mulai</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Kecepatan <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Mode rekam (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"id-ID",
"meta":{"nivel": 2, "titulo": "Selisih simetris", "enunciado": "Buktikan bahwa, untuk sebarang himpunan A dan B, berlaku:", "tesis": "A △ B = (A ∪ B) ∖ (A ∩ B)", "datos": ["(Def △)  A △ B = (A ∖ B) ∪ (B ∖ A)"]},
"steps":[
{"title": "Selisih simetris", "sub": "Latihan · Aljabar himpunan", "clear": 1, "say": "Halo. Dalam video ini kita akan membuktikan bahwa selisih simetris dua himpunan dapat ditulis sebagai gabungan dikurangi irisan. Kita akan bernalar unsur demi unsur, sangat perlahan, menuliskan setiap persamaan dan memberikan alasan untuk setiap langkah.", "L": [["txt", "Buktikan bahwa  A △ B = (A ∪ B) ∖ (A ∩ B)"]]},

{"say": "Yang ingin kita buktikan. Untuk sebarang himpunan A dan B, A selisih simetris B sama dengan gabungan A dan B, dikurangi irisan A dan B. Di sebelah kiri kita ingat definisi yang akan kita pakai: selisih simetris adalah gabungan A kurang B dengan B kurang A; selisih, gabungan, dan irisan dengan unsur; dan bahwa dua himpunan sama jika masing-masing termuat dalam yang lain.", "L": [["goal", "A △ B = (A ∪ B) ∖ (A ∩ B)<span class='tag'>Buktikan, untuk sebarang A dan B</span>"]], "pin": ["(Def △) A △ B = (A ∖ B) ∪ (B ∖ A)", "(Def ∖) x ∈ X ∖ Y  ⟺  x ∈ X  dan  x ∉ Y", "(Def ∪) x ∈ X ∪ Y  ⟺  x ∈ X  atau  x ∈ Y", "(Def ∩) x ∈ X ∩ Y  ⟺  x ∈ X  dan  x ∈ Y", "(Def ⊆) X ⊆ Y  ⟺  setiap x ∈ X memenuhi x ∈ Y", "(Def =) X = Y  ⟺  X ⊆ Y  dan  Y ⊆ X"]},

{"title": "Rencana: inklusi dua arah", "clear": 1, "say": "Kita akan bernalar unsur demi unsur. Menurut definisi kesamaan, kita harus membuktikan dua inklusi. Pertama, A selisih simetris B termuat dalam gabungan dikurangi irisan. Kedua, gabungan dikurangi irisan termuat dalam A selisih simetris B.", "L": [["goal", "(1)  A △ B ⊆ (A ∪ B) ∖ (A ∩ B)"], ["goal", "(2)  (A ∪ B) ∖ (A ∩ B) ⊆ A △ B"]]},

{"title": "(1) A △ B ⊆ (A ∪ B) ∖ (A ∩ B)", "clear": 1, "say": "Inklusi pertama. Menurut definisi inklusi, kita ambil sebarang unsur x dari A selisih simetris B, dan kita harus membuktikan bahwa x anggota gabungan dikurangi irisan.", "L": [["hyp", "Misalkan x ∈ A △ B"], ["goal", "Ingin ditunjukkan:  x ∈ (A ∪ B) ∖ (A ∩ B)"]]},

{"say": "Menurut definisi selisih simetris, x anggota gabungan A kurang B, dengan B kurang A. Dan menurut definisi gabungan, ini berarti x anggota A kurang B, atau x anggota B kurang A. Jadi, paling sedikit satu dari dua kemungkinan berlaku, dan kita pelajari masing-masing secara terpisah.", "L": [["txt", "Dengan (Def △):"], ["sub", "x ∈ (A ∖ B) ∪ (B ∖ A)"], ["txt", "Dengan (Def ∪):"], ["hyp", "Kasus (i):  x ∈ A ∖ B"], ["hyp", "Kasus (ii):  x ∈ B ∖ A"]]},

{"clear": 1, "say": "Kasus satu: x anggota A kurang B. Menurut definisi selisih, ini berarti x anggota A, dan x bukan anggota B.", "L": [["hyp", "Kasus (i):  x ∈ A ∖ B"], ["txt", "Dengan (Def ∖):"], ["sub", "x ∈ A   dan   x ∉ B"]]},

{"say": "Karena x anggota A, khususnya x anggota A, atau x anggota B. Menurut definisi gabungan, x anggota gabungan A dan B.", "L": [["txt", "x ∈ A  ⟹  x ∈ A  atau  x ∈ B,  jadi dengan (Def ∪):"], ["res", "x ∈ A ∪ B"]]},

{"say": "Selain itu, karena x bukan anggota B, tidak mungkin x menjadi anggota A dan B sekaligus. Menurut definisi irisan, x bukan anggota irisan A dan B.", "L": [["txt", "x ∉ B  ⟹  tidak benar bahwa  x ∈ A  dan  x ∈ B,  jadi dengan (Def ∩):"], ["res", "x ∉ A ∩ B"]]},

{"say": "Jadi x anggota gabungan, dan x bukan anggota irisan. Menurut definisi selisih, dengan X sama dengan A gabung B, dan Y sama dengan A irisan B, x anggota gabungan dikurangi irisan.", "L": [["txt", "x ∈ A ∪ B   dan   x ∉ A ∩ B,  jadi dengan (Def ∖):"], ["res", "x ∈ (A ∪ B) ∖ (A ∩ B)"]]},

{"clear": 1, "say": "Kasus dua: x anggota B kurang A. Menurut definisi selisih, ini berarti x anggota B, dan x bukan anggota A.", "L": [["hyp", "Kasus (ii):  x ∈ B ∖ A"], ["txt", "Dengan (Def ∖):"], ["sub", "x ∈ B   dan   x ∉ A"]]},

{"say": "Karena x anggota B, khususnya x anggota A, atau x anggota B. Menurut definisi gabungan, x anggota gabungan A dan B.", "L": [["txt", "x ∈ B  ⟹  x ∈ A  atau  x ∈ B,  jadi dengan (Def ∪):"], ["res", "x ∈ A ∪ B"]]},

{"say": "Selain itu, karena x bukan anggota A, tidak mungkin x menjadi anggota A dan B sekaligus. Menurut definisi irisan, x bukan anggota irisan A dan B.", "L": [["txt", "x ∉ A  ⟹  tidak benar bahwa  x ∈ A  dan  x ∈ B,  jadi dengan (Def ∩):"], ["res", "x ∉ A ∩ B"]]},

{"say": "Jadi x anggota gabungan, dan x bukan anggota irisan. Menurut definisi selisih, x anggota gabungan dikurangi irisan.", "L": [["txt", "x ∈ A ∪ B   dan   x ∉ A ∩ B,  jadi dengan (Def ∖):"], ["res", "x ∈ (A ∪ B) ∖ (A ∩ B)"]]},

{"clear": 1, "say": "Pada kedua kasus, x anggota gabungan dikurangi irisan. Karena x adalah sebarang unsur dari A selisih simetris B, inklusi pertama terbukti.", "L": [["txt", "Pada kedua kasus  x ∈ (A ∪ B) ∖ (A ∩ B),  jadi:"], ["res", "A △ B ⊆ (A ∪ B) ∖ (A ∩ B)"]]},

{"title": "(2) (A ∪ B) ∖ (A ∩ B) ⊆ A △ B", "clear": 1, "say": "Inklusi kedua. Kita ambil sebarang unsur x dari gabungan dikurangi irisan, dan kita harus membuktikan bahwa x anggota A selisih simetris B.", "L": [["hyp", "Misalkan x ∈ (A ∪ B) ∖ (A ∩ B)"], ["goal", "Ingin ditunjukkan:  x ∈ A △ B"]]},

{"say": "Menurut definisi selisih, x anggota gabungan A dan B, dan x bukan anggota irisan A dan B.", "L": [["txt", "Dengan (Def ∖):"], ["sub", "x ∈ A ∪ B   dan   x ∉ A ∩ B"]]},

{"say": "Syarat pertama, menurut definisi gabungan, mengatakan bahwa x anggota A, atau x anggota B. Syarat kedua, menurut definisi irisan, mengatakan bahwa tidak benar x anggota A dan B sekaligus.", "L": [["txt", "Dengan (Def ∪):  x ∈ A ∪ B  berarti"], ["sub", "x ∈ A   atau   x ∈ B"], ["txt", "Dengan (Def ∩):  x ∉ A ∩ B  berarti"], ["sub", "tidak (x ∈ A  dan  x ∈ B)"]]},

{"clear": 1, "say": "Menggabungkan kedua syarat, tepat satu dari dua kemungkinan terjadi. Jika x anggota A, karena x tidak dapat menjadi anggota A dan B sekaligus, x bukan anggota B. Dan jika x anggota B, dengan alasan yang sama, x bukan anggota A. Kita pelajari kedua kasus secara terpisah.", "L": [["hyp", "Kasus (i):  x ∈ A   dan   x ∉ B"], ["hyp", "Kasus (ii):  x ∈ B   dan   x ∉ A"]]},

{"clear": 1, "say": "Kasus satu: x anggota A, dan x bukan anggota B. Menurut definisi selisih, x anggota A kurang B. Dan menurut definisi gabungan, dengan X sama dengan A kurang B, x anggota gabungan A kurang B dengan B kurang A, yang menurut definisi adalah A selisih simetris B.", "L": [["hyp", "Kasus (i):  x ∈ A   dan   x ∉ B"], ["txt", "Dengan (Def ∖):"], ["sub", "x ∈ A ∖ B"], ["txt", "Dengan (Def ∪) dan (Def △):"], ["res", "x ∈ (A ∖ B) ∪ (B ∖ A) = A △ B"]]},

{"clear": 1, "say": "Kasus dua: x anggota B, dan x bukan anggota A. Menurut definisi selisih, x anggota B kurang A. Dan menurut definisi gabungan, x anggota gabungan A kurang B dengan B kurang A, yang menurut definisi adalah A selisih simetris B.", "L": [["hyp", "Kasus (ii):  x ∈ B   dan   x ∉ A"], ["txt", "Dengan (Def ∖):"], ["sub", "x ∈ B ∖ A"], ["txt", "Dengan (Def ∪) dan (Def △):"], ["res", "x ∈ (A ∖ B) ∪ (B ∖ A) = A △ B"]]},

{"clear": 1, "say": "Pada kedua kasus, x anggota A selisih simetris B. Karena x adalah sebarang unsur dari gabungan dikurangi irisan, inklusi kedua terbukti.", "L": [["txt", "Pada kedua kasus  x ∈ A △ B,  jadi:"], ["res", "(A ∪ B) ∖ (A ∩ B) ⊆ A △ B"]]},

{"title": "Kesimpulan", "clear": 1, "say": "Kesimpulan. Karena kedua inklusi berlaku, menurut definisi kesamaan, A selisih simetris B sama dengan gabungan A dan B, dikurangi irisan A dan B. Terima kasih sudah menonton.", "L": [["txt", "(1)  A △ B ⊆ (A ∪ B) ∖ (A ∩ B)"], ["txt", "(2)  (A ∪ B) ∖ (A ∩ B) ⊆ A △ B"], ["res", "A △ B = (A ∪ B) ∖ (A ∩ B)"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' tambah ').replace(/⊙/g,' kali ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Ulangi'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Lanjutkan'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Jeda';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Jeda';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Jeda';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^id/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/ardi|andika|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Selisih simetris";$('sub').textContent="Latihan · Aljabar himpunan";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
