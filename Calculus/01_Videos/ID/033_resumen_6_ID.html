<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relasi, operasi, dan struktur aljabar</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>Ingat</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Mulai</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Kecepatan <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Mode rekam (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"id-ID",
"meta":{"nivel": 0, "titulo": "Relasi, operasi, dan struktur aljabar", "enunciado": "Ringkasan: relasi biner, operasi, dan hierarki struktur, dari magma sampai medan", "datos": ["Relasi ekuivalensi", "Urutan parsial dan total", "Operasi biner", "Magma, semigrup, dan monoid", "Grup dan grup abelian", "Gelanggang", "Medan"]},
"steps":[
{"title": "Relasi, operasi, dan struktur aljabar", "sub": "Ringkasan: relasi biner, operasi, dan hierarki struktur, dari magma sampai medan", "clear": 1, "say": "Halo. Dalam video ini kita merangkum relasi biner, operasi, dan hierarki struktur aljabar: dari magma sampai medan. Pertama relasinya, lalu strukturnya, dengan menambahkan sifat satu per satu.", "L": [["txt", "Relasi biner  →  operasi  →  struktur aljabar"]]},

{"title": "1) Relasi biner", "clear": 1, "say": "Relasi biner pada himpunan E adalah himpunan bagian R dari hasil kali Kartesius E kali E. Menulis bahwa pasangan a, b anggota R berarti a berelasi dengan b.", "L": [["goal", "Relasi biner:   R ⊆ E × E"], ["txt", "(a, b) ∈ R   berarti  a  berelasi dengan  b"]]},

{"title": "2) Relasi ekuivalensi", "clear": 1, "say": "Relasi ekuivalensi adalah relasi biner yang memenuhi tiga sifat. Refleksif: untuk setiap a, pasangan a, a anggota R. Simetris: jika pasangan a, b anggota R, maka pasangan b, a anggota R. Dan transitif: jika pasangan a, b dan b, c anggota R, maka pasangan a, c anggota R.", "L": [["goal", "Relasi ekuivalensi"], ["res", "Refleksif:   (a, a) ∈ R"], ["res", "Simetris:   (a, b) ∈ R  ⟹  (b, a) ∈ R"], ["res", "Transitif:   (a, b), (b, c) ∈ R  ⟹  (a, c) ∈ R"]]},

{"say": "Relasi ini ditulis dengan tiga cara, sesuai konteks: pasangan a, b anggota R, a ekuivalen dengan b, atau a sama dengan b.", "L": [["txt", "Notasi, sesuai konteks:"], ["sub", "(a, b) ∈ R,       a ∼ b,       a = b"]]},

{"title": "3) Urutan parsial", "clear": 1, "say": "Relasi urutan parsial juga memenuhi tiga sifat. Refleksif: pasangan a, a anggota R. Antisimetris: jika pasangan a, b dan b, a anggota R, maka a sama dengan b. Dan transitif, seperti sebelumnya. Ditulis pasangan a, b anggota R, atau a kurang dari atau sama dengan b.", "L": [["goal", "Relasi urutan parsial"], ["res", "Refleksif:   (a, a) ∈ R"], ["res", "Antisimetris:   (a, b), (b, a) ∈ R  ⟹  a = b"], ["res", "Transitif:   (a, b), (b, c) ∈ R  ⟹  (a, c) ∈ R"], ["sub", "Notasi:   (a, b) ∈ R,       a ≤ b"]]},

{"title": "4) Urutan total", "clear": 1, "say": "Relasi urutan total adalah urutan parsial yang setiap dua unsurnya dapat dibandingkan: untuk semua a dan b, pasangan a, b anggota R, atau pasangan b, a anggota R. Perhatikan: jangan dikacaukan dengan pernyataan bahwa jika a, b ada di R maka b, a tidak ada di R, karena itu bertentangan dengan sifat refleksif.", "L": [["goal", "Relasi urutan total"], ["txt", "Urutan parsial, dan juga:"], ["res", "∀ a, b:   (a, b) ∈ R   atau   (b, a) ∈ R"], ["warn", "Bukan:  (a, b) ∈ R ⟹ (b, a) ∉ R   (bertentangan dengan refleksif)"]]},

{"title": "5) Operasi biner", "clear": 1, "say": "Sekarang operasi. Operasi biner internal pada E adalah fungsi f dari E kali E ke E: operasi ini menggabungkan dua unsur E dan menghasilkan unsur lain dari E. Operasi biner eksternal adalah fungsi f dari E kali F ke E: operasi ini menggabungkan satu unsur E dengan satu unsur dari himpunan lain F, dan menghasilkan unsur E.", "L": [["goal", "Operasi biner internal:   f : E × E → E"], ["goal", "Operasi biner eksternal:   f : E × F → E"]]},

{"title": "6) Magma", "clear": 1, "say": "Sekarang hierarki strukturnya, dengan menambahkan sifat di setiap tingkat. Magma adalah himpunan E dengan sebuah operasi biner internal, yang kita tulis dengan simbol tambah berlingkaran.", "L": [["goal", "Magma:   (E, ⊕)"], ["txt", "⊕  operasi biner internal"]], "pin": ["Magma:  ⊕ internal"]},

{"title": "7) Semigrup", "clear": 1, "say": "Semigrup adalah magma yang operasinya asosiatif: a tambah b, tambah c, sama dengan a tambah, b tambah c.", "L": [["goal", "Semigrup:   (E, ⊕)   Magma  +"], ["res", "Asosiatif:   (a ⊕ b) ⊕ c = a ⊕ (b ⊕ c)"]], "pin": ["Semigrup:  + asosiatif"]},

{"title": "8) Monoid", "clear": 1, "say": "Monoid adalah semigrup yang mempunyai unsur identitas: ada tepat satu unsur, yang kita sebut nol, sehingga untuk setiap a, a tambah nol adalah a, dan nol tambah a adalah a.", "L": [["goal", "Monoid:   (E, ⊕)   Semigrup  +"], ["res", "Unsur identitas:   ∃! 0  sehingga  ∀ a:   a ⊕ 0 = a,    0 ⊕ a = a"]], "pin": ["Monoid:  + unsur identitas"]},

{"title": "9) Grup", "clear": 1, "say": "Grup adalah monoid yang setiap unsurnya mempunyai invers: untuk setiap a, ada tepat satu unsur, yaitu invers a, sehingga a tambah inversnya, dan inversnya tambah a, sama dengan unsur identitas nol.", "L": [["goal", "Grup:   (E, ⊕)   Monoid  +"], ["res", "Unsur invers:   ∀ a,  ∃! ∼a  sehingga"], ["res", "a ⊕ (∼a) = (∼a) ⊕ a = 0"]], "pin": ["Grup:  + unsur invers"]},

{"title": "10) Grup abelian", "clear": 1, "say": "Grup abelian adalah grup yang operasinya komutatif: a tambah b sama dengan b tambah a.", "L": [["goal", "Grup abelian:   (E, ⊕)   Grup  +"], ["res", "Komutatif:   a ⊕ b = b ⊕ a"]], "pin": ["Grup abelian:  + komutatif"]},

{"title": "11) Gelanggang", "clear": 1, "say": "Gelanggang mempunyai dua operasi: penjumlahan, yang ditulis dengan tambah berlingkaran, dan perkalian, yang ditulis dengan titik berlingkaran. Terhadap penjumlahan, E adalah grup abelian. Terhadap perkalian, E adalah semigrup.", "L": [["goal", "Gelanggang:   (E, ⊕, ⊙)"], ["res", "(E, ⊕)   Grup abelian"], ["res", "(E, ⊙)   Semigrup"]], "pin": ["Gelanggang:  (E,⊕) abelian, (E,⊙) semigrup"]},

{"say": "Dan selain itu, kedua operasi dihubungkan oleh dua sifat distributif. Di kiri: a kali, b tambah c, sama dengan a kali b, tambah a kali c. Di kanan: b tambah c, kali a, sama dengan b kali a, tambah c kali a.", "L": [["res", "Distributif kiri:   a ⊙ (b ⊕ c) = (a ⊙ b) ⊕ (a ⊙ c)"], ["res", "Distributif kanan:   (b ⊕ c) ⊙ a = (b ⊙ a) ⊕ (c ⊙ a)"]]},

{"title": "12) Gelanggang unital", "clear": 1, "say": "Gelanggang unital adalah gelanggang yang perkaliannya mempunyai unsur identitas: artinya, E terhadap perkalian adalah monoid.", "L": [["goal", "Gelanggang unital:   (E, ⊕, ⊙)   Gelanggang  +"], ["res", "(E, ⊙)   Monoid"]], "pin": ["Gelanggang unital:  (E,⊙) monoid"]},

{"title": "13) Gelanggang pembagian", "clear": 1, "say": "Gelanggang pembagian adalah gelanggang unital yang setiap unsur tak nolnya mempunyai invers terhadap perkalian: artinya, E dikurangi himpunan yang hanya berisi nol, terhadap perkalian, adalah grup.", "L": [["goal", "Gelanggang pembagian:   (E, ⊕, ⊙)   Gelanggang unital  +"], ["res", "(E ∖ {0}, ⊙)   Grup"]], "pin": ["Gelanggang pembagian:  (E∖{0},⊙) grup"]},

{"title": "14) Medan", "clear": 1, "say": "Dan medan adalah gelanggang pembagian yang perkaliannya komutatif.", "L": [["goal", "Medan:   (E, ⊕, ⊙)   Gelanggang pembagian  +"], ["res", "⊙  komutatif"]], "pin": ["Medan:  ⊙ komutatif"]},

{"title": "Ringkasan", "clear": 1, "say": "Ringkasnya. Relasi ekuivalensi bersifat refleksif, simetris, dan transitif. Urutan parsial bersifat refleksif, antisimetris, dan transitif, dan urutannya total jika semua pasangan dapat dibandingkan. Untuk struktur, setiap tingkat menambahkan satu sifat: semigrup, asosiatif; monoid, unsur identitas; grup, invers; grup abelian, komutatif. Dengan dua operasi: gelanggang, gelanggang unital, gelanggang pembagian, dan medan. Terima kasih sudah menonton.", "L": [["res", "Ekuivalensi:  refleksif, simetris, transitif"], ["res", "Urutan parsial:  refleksif, antisimetris, transitif"], ["res", "Urutan total:  ∀ a, b:  (a, b) ∈ R  atau  (b, a) ∈ R"], ["res", "Magma → Semigrup → Monoid → Grup → Grup abelian"], ["txt", "        + asosiatif    + identitas    + invers    + komutatif"], ["res", "Gelanggang → Gelanggang unital → Gelanggang pembagian → Medan"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' tambah ').replace(/⊙/g,' kali ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Ulangi'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Lanjutkan'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Jeda';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Jeda';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Jeda';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^id/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/ardi|andika|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Relasi, operasi, dan struktur aljabar";$('sub').textContent="Ringkasan: relasi biner, operasi, dan hierarki struktur, dari magma sampai medan";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
