<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bilangan real</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>Ingat</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Mulai</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Kecepatan <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Mode rekam (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"id-ID",
"meta":{"nivel": 0, "titulo": "Bilangan real", "enunciado": "Ringkasan: medan, urutan, kelengkapan, sifat Archimedes, garis diperluas, dan nilai mutlak", "datos": ["Struktur medan", "Urutan", "Kelengkapan", "Sifat Archimedes", "Garis real yang diperluas", "Nilai mutlak"]},
"steps":[
{"title": "Bilangan real: ringkasan", "sub": "Ringkasan: medan, urutan, kelengkapan, sifat Archimedes, garis diperluas, dan nilai mutlak", "clear": 1, "say": "Halo. Dalam video ini kita merangkum sifat-sifat dasar bilangan real, yang menjadi fondasi seluruh kalkulus: limit, kekontinuan, keterdiferensialan, dan keterintegralan. Kita akan melihat enam gagasan: struktur medan, urutan, kelengkapan, sifat Archimedes, garis real yang diperluas, dan nilai mutlak.", "L": [["txt", "Himpunan bilangan real  ℝ  adalah kerangka Kalkulus"], ["txt", "Limit · kekontinuan · keterdiferensialan · keterintegralan"], ["txt", "Semuanya bergantung pada sifat struktural ℝ, bukan hanya pada berhitung"]]},

{"title": "1) Struktur medan", "clear": 1, "say": "Gagasan pertama: struktur aljabar. Bilangan real, dengan penjumlahan dan perkalian, membentuk sebuah medan komutatif. Artinya ada empat hal. Satu: penjumlahan dan perkalian adalah operasi yang tertutup, asosiatif, dan komutatif. Dua: ada unsur identitas, nol untuk penjumlahan, dan satu untuk perkalian. Tiga: setiap bilangan real x mempunyai lawan, yaitu negatif x. Dan empat: jika x tidak sama dengan nol, x mempunyai invers perkalian, yaitu x pangkat negatif satu.", "L": [["goal", "(ℝ, +, ·)  adalah medan komutatif"], ["txt", "Penjumlahan dan perkalian: tertutup, asosiatif, dan komutatif"], ["txt", "Unsur identitas:  0  dan  1"], ["txt", "Lawan:  setiap x mempunyai  −x"], ["txt", "Invers:  jika x ≠ 0,  ada  x⁻¹"]], "pin": ["1. Medan: (ℝ, +, ·)"]},

{"clear": 1, "say": "Untuk semua bilangan real a, b, dan c, berlaku identitas berikut. Asosiatif penjumlahan: a tambah, b tambah c, sama dengan, a tambah b, tambah c. Asosiatif perkalian: a kali, b kali c, sama dengan, a kali b, kali c. Distributif: a kali, b tambah c, sama dengan a kali b, tambah a kali c. Dan unsur identitas: a tambah nol adalah a, dan a kali satu adalah a. Sifat-sifat ini menjamin bahwa manipulasi aljabar dalam kalkulus konsisten.", "L": [["res", "a + (b + c) = (a + b) + c"], ["res", "a (b c) = (a b) c"], ["res", "a (b + c) = a b + a c"], ["res", "a + 0 = a,        a · 1 = a"], ["txt", "Menjamin konsistensi manipulasi aljabar"]]},

{"title": "2) Urutan", "clear": 1, "say": "Gagasan kedua: urutan. Selain merupakan medan, himpunan bilangan real mempunyai relasi urutan total, kurang dari atau sama dengan, yang selaras dengan operasi. Total berarti kita dapat membandingkan setiap dua bilangan real.", "L": [["goal", "ℝ  mempunyai urutan total  ≤"], ["txt", "Setiap dua bilangan real dapat dibandingkan"]], "pin": ["2. Urutan total ≤"]},

{"say": "Keselarasan dengan penjumlahan menyatakan bahwa jika a kurang dari atau sama dengan b, maka a tambah c kurang dari atau sama dengan b tambah c, untuk setiap c. Keselarasan dengan perkalian menyatakan bahwa jika c lebih dari atau sama dengan nol, dan a kurang dari atau sama dengan b, maka a kali c kurang dari atau sama dengan b kali c. Perhatikan: c harus positif atau nol.", "L": [["res", "a ≤ b   ⟹   a + c ≤ b + c"], ["res", "0 ≤ c  dan  a ≤ b   ⟹   a c ≤ b c"]]},

{"say": "Urutan total memungkinkan kita mendefinisikan selang: selang terbuka dari a ke b, selang tertutup dari a ke b, dari a ke tak hingga positif, dan lainnya. Selang sangat penting untuk merumuskan limit dan kekontinuan.", "L": [["txt", "Selang:   (a, b),    [a, b],    (a, +∞),   …"], ["txt", "Berperan sentral dalam limit dan kekontinuan"]]},

{"title": "3) Kelengkapan", "clear": 1, "say": "Gagasan ketiga, yang paling penting: kelengkapan. Inilah sifat khas bilangan real. Misalkan A adalah himpunan bagian tak kosong dari bilangan real, dan terbatas di atas. Maka ada bilangan real s dengan dua sifat.", "L": [["goal", "A ⊆ ℝ,   A ≠ ∅,   terbatas di atas"], ["txt", "Maka ada  s ∈ ℝ  sehingga:"]], "pin": ["3. Kelengkapan: sup A"]},

{"say": "Sifat pertama: untuk setiap unsur a dari A, a kurang dari atau sama dengan s. Artinya, s adalah batas atas A.", "L": [["res", "(1)   ∀ a ∈ A,   a ≤ s"], ["txt", "s adalah batas atas A"]]},

{"say": "Sifat kedua: untuk setiap epsilon yang lebih dari nol, ada unsur a dari A sehingga s kurang epsilon lebih kecil dari a. Artinya, tidak ada besaran yang lebih kecil dari s yang menjadi batas atas: s adalah batas atas yang terkecil.", "L": [["res", "(2)   ∀ ε &gt; 0,   ∃ a ∈ A :   s − ε &lt; a"], ["txt", "Tidak ada yang lebih kecil dari s yang menjadi batas atas: s batas atas terkecil"]]},

{"say": "Bilangan s ini disebut supremum A, dan ditulis sup A. Serupa dengan itu, setiap himpunan tak kosong yang terbatas di bawah mempunyai infimum.", "L": [["res", "s = sup A      (supremum A)"], ["txt", "Serupa: tak kosong dan terbatas di bawah  ⟹  ada  inf A"]]},

{"say": "Sifat-sifat ini tidak diturunkan dari aljabar maupun urutan: keduanya adalah aksioma khas bilangan real. Bahkan, sifat ini gagal pada bilangan rasional. Dan inilah fondasi logis kalkulus: keberadaan limit barisan monoton dan terbatas, kekonvergenan barisan yang didefinisikan dengan hampiran, dan definisi limit yang ketat, semuanya bertumpu pada keberadaan supremum dan infimum.", "L": [["txt", "Aksioma khas ℝ.  Gagal di ℚ"], ["txt", "Menjadi dasar:"], ["txt", "· limit barisan monoton dan terbatas"], ["txt", "· kekonvergenan barisan yang didefinisikan dengan hampiran"], ["txt", "· definisi yang ketat:   lim aₙ = L   (n → ∞)"]], "clear": 1},

{"title": "4) Sifat Archimedes", "clear": 1, "say": "Gagasan keempat: sifat Archimedes. Sifat ini menyatakan bahwa untuk semua bilangan a dan b yang lebih dari nol, ada bilangan asli n sehingga n kali a lebih besar dari b. Artinya, sekecil apa pun a, jika dijumlahkan cukup banyak kali, hasilnya melampaui b mana pun.", "L": [["goal", "Sifat Archimedes"], ["res", "∀ a, b &gt; 0,   ∃ n ∈ ℕ :   n a &gt; b"]], "pin": ["4. Archimedes"]},

{"say": "Ini menjamin bahwa bilangan asli tidak terbatas di dalam bilangan real, dan memungkinkan kita menghubungkan besaran real dengan hampiran diskret. Ini adalah alat penting dalam pembuktian yang memakai estimasi dan pengendalian galat.", "L": [["txt", "ℕ tidak terbatas di ℝ"], ["txt", "Menghubungkan besaran real dengan hampiran diskret"], ["txt", "Berguna dalam estimasi dan pengendalian galat"]]},

{"title": "5) Garis real yang diperluas", "clear": 1, "say": "Gagasan kelima: garis real yang diperluas. Garis ini diperoleh dengan menambahkan pada bilangan real dua simbol, tak hingga negatif dan tak hingga positif. Garis ini memungkinkan kita menggambarkan perilaku tak terbatas secara terpadu.", "L": [["goal", "<span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span> = ℝ ∪ { −∞, +∞ }"], ["txt", "Menggambarkan perilaku tak terbatas secara terpadu"]], "pin": ["5. Garis diperluas <span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span>"]},

{"say": "Urutan bilangan real diperluas: untuk setiap x real, tak hingga negatif kurang dari atau sama dengan x, dan x kurang dari atau sama dengan tak hingga positif. Namun, garis yang diperluas bukan medan dan bukan gelanggang, karena beberapa operasi hanya terdefinisi sebagian. Garis ini sebaiknya dipakai hanya sebagai alat bantu.", "L": [["res", "∀ x ∈ ℝ :   −∞ ≤ x ≤ +∞"], ["warn", "<span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span> bukan medan dan bukan gelanggang"], ["txt", "Alat bantu"]]},

{"title": "6) Nilai mutlak", "clear": 1, "say": "Gagasan keenam: nilai mutlak, yang terkait dengan struktur terurut bilangan real. Nilai mutlak didefinisikan per kasus. Nilai mutlak x adalah x, jika x lebih dari atau sama dengan nol, dan negatif x, jika x kurang dari nol.", "L": [["goal", "Nilai mutlak"], ["res", "|x| = x    jika  x ≥ 0"], ["res", "|x| = −x   jika  x &lt; 0"]], "pin": ["6. Nilai mutlak |x|"]},

{"say": "Nilai mutlak memungkinkan kita menyatakan jarak antara dua bilangan real sebagai nilai mutlak x kurang y, dan merumuskan pertidaksamaan secara simetris. Khususnya, nilai mutlak x kurang a lebih kecil dari epsilon, jika dan hanya jika, x terletak di antara a kurang epsilon dan a tambah epsilon.", "L": [["txt", "Jarak antara x dan y:   |x − y|"], ["res", "|x − a| &lt; ε   ⟺   a − ε &lt; x &lt; a + ε"], ["txt", "Dasar teknis definisi limit dan kekontinuan"]]},

{"title": "Ringkasan", "clear": 1, "say": "Ringkasnya. Bilangan real membentuk medan komutatif, dengan urutan total yang selaras dengan operasi. Sifat khasnya adalah kelengkapan: setiap himpunan tak kosong yang terbatas di atas mempunyai supremum. Dari sifat ini diperoleh sifat Archimedes. Garis yang diperluas adalah alat bantu, dan nilai mutlak mengukur jarak. Terima kasih sudah menonton.", "L": [["res", "ℝ:  medan komutatif  +  urutan total yang selaras"], ["res", "Kelengkapan:  setiap A ≠ ∅ terbatas di atas mempunyai  sup A"], ["res", "Archimedes:  ∀ a, b &gt; 0,  ∃ n ∈ ℕ :  n a &gt; b"], ["res", "|x − a| &lt; ε  ⟺  a − ε &lt; x &lt; a + ε"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' tambah ').replace(/⊙/g,' kali ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Ulangi'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Lanjutkan'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Jeda';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Jeda';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Jeda';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^id/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/ardi|andika|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Bilangan real";$('sub').textContent="Ringkasan: medan, urutan, kelengkapan, sifat Archimedes, garis diperluas, dan nilai mutlak";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
