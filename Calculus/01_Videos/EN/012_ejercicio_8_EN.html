<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Domination laws</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(15px,1.9vw,24px)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>Remember</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Start</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Speed <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Recording mode (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"en-US",
"meta":{"nivel": 2, "titulo": "Domination laws", "enunciado": "Let (B, ⊕, ⊙, ∼) be a Boolean algebra.  Prove that, for every a ∈ B, the domination laws hold:", "tesis": "a ⊕ 1 = 1,   a ⊙ 0 = 0", "datos": ["(Assoc ⊕)  x ⊕ (y ⊕ z) = (x ⊕ y) ⊕ z", "(Assoc ⊙)  x ⊙ (y ⊙ z) = (x ⊙ y) ⊙ z", "(Idem)  x ⊕ x = x,   x ⊙ x = x", "(Compl)  x ⊕ ∼x = 1,   x ⊙ ∼x = 0"]},
"steps":[
{"title": "Domination laws", "sub": "Exercise · Boolean algebra", "clear": 1, "say": "Hello. In this video we are going to solve an exercise about Boolean algebras. We will go very slowly, writing every equation and justifying every step.", "L": [["txt", "Adding one gives one, and multiplying by zero gives zero"]]},

{"say": "First, the data. B is a set with two operations, the sum and the product, and a complement operation, which we write with a tilde. It is a Boolean algebra: a distributive lattice with a least element zero, a greatest element one, and a complement for each element. The typical example is the power set of a set U, with union, intersection and set complement.", "L": [["hyp", "(B, ⊕, ⊙, ∼) Boolean algebra<span class='tag'>Hypothesis</span>"], ["txt", "With sets:  (𝒫(U), ∪, ∩, complement),   0 = ∅,   1 = U"]]},

{"say": "Let us recall the definition of complement. The complement of a satisfies two conditions at once: a plus its complement is one, and a times its complement is zero. With sets: A union its complement is U, and A intersection its complement is the empty set.", "L": [["sub", "a ⊕ ∼a = 1<span class='tag'>Definition of complement</span>"], ["sub", "a ⊙ ∼a = 0<span class='tag'>Definition of complement</span>"], ["txt", "With sets:  A ∪ A<sup>c</sup> = U,   A ∩ A<sup>c</sup> = ∅"]]},

{"say": "We will also use associativity of the sum and of the product, and idempotence of both operations: a plus a is a, and a times a is a. We write them on the left together with the definition of complement.", "pin": ["(Assoc ⊕) x ⊕ (y ⊕ z) = (x ⊕ y) ⊕ z", "(Assoc ⊙) x ⊙ (y ⊙ z) = (x ⊙ y) ⊙ z", "(Idem ⊕) x ⊕ x = x", "(Idem ⊙) x ⊙ x = x", "(Compl) x ⊕ ∼x = 1,   x ⊙ ∼x = 0"]},

{"say": "What we want to prove. For every element a of B, a plus one is one, and a times zero is zero. These are the domination laws: one dominates the sum, and zero dominates the product. With sets: A union U is U, and A intersection the empty set is the empty set.", "L": [["goal", "∀ a ∈ B:   a ⊕ 1 = 1   and   a ⊙ 0 = 0<span class='tag'>Claim: domination laws</span>"], ["txt", "With sets:  A ∪ U = U,   A ∩ ∅ = ∅"]]},

{"title": "Part 1: a ⊕ 1 = 1", "clear": 1, "say": "We start with the first one. Let a be any element of B. We want to prove that a plus one equals one. We start from the left-hand side.", "L": [["txt", "Let a ∈ B  (arbitrary)"], ["goal", "We want:  a ⊕ 1 = 1<span class='tag'>Claim of this part</span>"], ["txt", "a ⊕ 1"]]},

{"say": "First step. By the definition of complement, a plus its complement is one. This is the hypothesis. So we can replace the one with a plus the complement of a. We leave the a on the left as it is.", "L": [["sub", "a ⊕ 1  =  a ⊕ (a ⊕ ∼a)<span class='tag'>Substitution: 1 = a ⊕ ∼a  (definition of complement)</span>"]]},

{"say": "Second step. We apply associativity of the sum, with x equal to a, y equal to a, and z equal to the complement of a. We go from a plus, a plus the complement of a, to, a plus a, plus the complement of a.", "L": [["sub", "a ⊕ 1  =  (a ⊕ a) ⊕ ∼a<span class='tag'>Associativity of ⊕</span>"]]},

{"say": "Third step. Inside the parentheses we have a plus a. By idempotence of the sum, a plus a equals a. We highlight it and substitute.", "L": [["sub", "a ⊕ 1  =  (<mark>a ⊕ a</mark>) ⊕ ∼a"], ["txt", "By (Idem ⊕):  <mark>a ⊕ a</mark> = a"], ["sub", "a ⊕ 1  =  a ⊕ ∼a<span class='tag'>Idempotence of ⊕</span>"]]},

{"say": "Fourth step. Now we have a plus the complement of a, which by the definition of complement is one.", "L": [["res", "a ⊕ 1  =  1<span class='tag'>Definition of complement</span>"]]},

{"say": "We have proved the first domination law. With sets: A union U is U. This ends the first part.", "L": [["res", "a ⊕ 1 = 1   ∎"], ["txt", "With sets:  A ∪ U = U"]]},

{"title": "Part 2: a ⊙ 0 = 0", "clear": 1, "say": "We move on to the second part. It is analogous, swapping the sum for the product, and one for zero. Let a be any element of B. We want to prove that a times zero equals zero. We start from the left-hand side.", "L": [["txt", "Let a ∈ B  (arbitrary)"], ["goal", "We want:  a ⊙ 0 = 0<span class='tag'>Claim of this part</span>"], ["txt", "a ⊙ 0"]]},

{"say": "First step. By the definition of complement, a times its complement is zero. This is the hypothesis. So we replace the zero with a times the complement of a. We leave the a on the left as it is.", "L": [["sub", "a ⊙ 0  =  a ⊙ (a ⊙ ∼a)<span class='tag'>Substitution: 0 = a ⊙ ∼a  (definition of complement)</span>"]]},

{"say": "Second step. We apply associativity of the product. We go from a times, a times the complement of a, to, a times a, times the complement of a.", "L": [["sub", "a ⊙ 0  =  (a ⊙ a) ⊙ ∼a<span class='tag'>Associativity of ⊙</span>"]]},

{"say": "Third step. Inside the parentheses we have a times a. By idempotence of the product, a times a equals a. We highlight it and substitute.", "L": [["sub", "a ⊙ 0  =  (<mark>a ⊙ a</mark>) ⊙ ∼a"], ["txt", "By (Idem ⊙):  <mark>a ⊙ a</mark> = a"], ["sub", "a ⊙ 0  =  a ⊙ ∼a<span class='tag'>Idempotence of ⊙</span>"]]},

{"say": "Fourth step. Now we have a times the complement of a, which by the definition of complement is zero.", "L": [["res", "a ⊙ 0  =  0<span class='tag'>Definition of complement</span>"]]},

{"say": "We have proved the second domination law. With sets: A intersection the empty set is the empty set. This ends the second part.", "L": [["res", "a ⊙ 0 = 0   ∎"], ["txt", "With sets:  A ∩ ∅ = ∅"]]},

{"title": "Summary", "clear": 1, "say": "To sum up. We write one as a plus the complement of a, we associate, we apply idempotence, and we go back to the definition of complement. And with the product, the same with zero. We conclude that the domination laws hold in every Boolean algebra. With sets: A union U is U, and A intersection the empty set is the empty set. Thanks for watching.", "L": [["res", "a ⊕ 1 = 1   (substitution + associativity + idempotence + complement)"], ["res", "a ⊙ 0 = 0   (substitution + associativity + idempotence + complement)"], ["txt", "With sets:  A ∪ U = U,   A ∩ ∅ = ∅"]]}
]}

<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' plus ').replace(/⊙/g,' times ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Replay'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Resume'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pause';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/andrew|guy|brian|christopher|eric|david|mark|male|google us english$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Domination laws";$('sub').textContent="Exercise · Boolean algebra";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
