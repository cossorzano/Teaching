<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order in a lattice</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(15px,1.9vw,24px)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>Remember</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Start</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Speed <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Recording mode (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"en-US",
"meta":{"nivel": 2, "titulo": "Order in a lattice", "enunciado": "Let (B, ⊕, ⊙) be a lattice. Define on B the relation  x ≤ y ⇔ x ⊕ y = y.  Prove that, for any a, b ∈ B:", "tesis": "a ≤ a ⊕ b,   b ≤ a ⊕ b", "datos": ["(Comm)  x ⊕ y = y ⊕ x", "(Assoc)  x ⊕ (y ⊕ z) = (x ⊕ y) ⊕ z", "(Idem)  x ⊕ x = x"]},
"steps":[
{"title": "Order in a lattice", "sub": "Exercise · Algebraic lattices", "clear": 1, "say": "Hello. In this video we will solve an exercise about algebraic lattices. We will go very slowly, writing down every equation and justifying every step.", "L": [["txt", "An order relation defined with the lattice sum"]]},

{"say": "First, the data. B is a set with two operations, the lattice sum and the lattice product, and it is a lattice. That is, both operations are internal, commutative, associative, and satisfy the absorption laws.", "L": [["hyp", "(B, ⊕, ⊙) lattice<span class='tag'>Hypothesis</span>"]]},

{"say": "In this exercise we will only use three properties of the sum. Commutativity: a plus b is b plus a. Associativity: a plus, b plus c, is a plus b, plus c. And idempotence, which is a theorem about lattices: a plus a is a. We pin them on the left, because we are going to use them.", "pin": ["(Comm) x ⊕ y = y ⊕ x", "(Assoc) x ⊕ (y ⊕ z) = (x ⊕ y) ⊕ z", "(Idem) x ⊕ x = x"]},

{"say": "Now the definition. On B we define a relation, less than or equal to, as follows. x is less than or equal to y if and only if x plus y equals y. It is a definition: the relation less than or equal to means, by definition, that adding x to y gives y. With sets, it is the well-known property: A is contained in B if and only if A union B equals B.", "L": [["sub", "x ≤ y  ⇔  x ⊕ y = y<span class='tag'>Definition of ≤</span>"], ["txt", "Example with sets:  A ⊆ B  ⇔  A ∪ B = B"]]},

{"say": "We also note the definition on the left, below the previous properties, because it is the key to the exercise. Notice that it appears highlighted in the left column.", "pin": ["(Def) x ≤ y ⇔ x ⊕ y = y"]},

{"say": "What we want to prove. For any a and b in B, two things hold: a is less than or equal to a plus b, and b is less than or equal to a plus b.", "L": [["goal", "∀ a, b ∈ B:   a ≤ a ⊕ b   and   b ≤ a ⊕ b<span class='tag'>Claim</span>"]]},

{"title": "Part 1: a ≤ a ⊕ b", "clear": 1, "say": "Let's start with the first one. Let a and b be any two elements of B. We want to prove that a is less than or equal to a plus b.", "L": [["txt", "Let a, b ∈ B  (arbitrary)"], ["goal", "We want:  a ≤ a ⊕ b<span class='tag'>Claim of this part</span>"]]},

{"say": "Let's recall the definition: x is less than or equal to y if and only if x plus y equals y.", "L": [["hyp", "x ≤ y  ⇔  x ⊕ y = y<span class='tag'>Definition</span>"]]},

{"say": "We apply the definition with x equal to a, and y equal to a plus b. This is legitimate, because the sum is internal, so a plus b belongs to B.", "L": [["sub", "x = a,   y = a ⊕ b  ∈ B<span class='tag'>Choice (⊕ is internal)</span>"]]},

{"say": "Substituting, a is less than or equal to a plus b, if and only if a plus, a plus b, equals a plus b.", "L": [["sub", "a ≤ a ⊕ b  ⇔  a ⊕ (a ⊕ b) = a ⊕ b<span class='tag'>Definition with x=a, y=a⊕b</span>"]]},

{"say": "Therefore, it is enough to prove the equality on the right: a plus, a plus b, equals a plus b. This is no longer an inequality, but an equality that we can prove with the properties of the sum.", "L": [["goal", "It suffices to prove:  a ⊕ (a ⊕ b) = a ⊕ b<span class='tag'>New claim</span>"]]},

{"say": "We start from the left-hand side, a plus, a plus b, and transform it step by step until we reach the right-hand side.", "L": [["txt", "a ⊕ (a ⊕ b)"]]},

{"say": "First step. We apply the associativity of the sum, with x equal to a, y equal to a, and z equal to b. We move the parentheses: a plus, a plus b, becomes a plus a, plus b.", "L": [["sub", "a ⊕ (a ⊕ b)  =  (a ⊕ a) ⊕ b<span class='tag'>Associativity of ⊕, with x=a, y=a, z=b</span>"]]},

{"say": "Second step. Inside the parentheses we have a plus a. By idempotence, a plus a equals a. We highlight it.", "L": [["sub", "a ⊕ (a ⊕ b)  =  (<mark>a ⊕ a</mark>) ⊕ b"], ["txt", "By (Idem):  <mark>a ⊕ a</mark> = a"]]},

{"say": "We replace that block with a. We are left with a plus b.", "L": [["sub", "(<mark>a</mark>) ⊕ b"], ["res", "a ⊕ (a ⊕ b)  =  a ⊕ b<span class='tag'>Idempotence of ⊕</span>"]]},

{"say": "We have proved the equality. By the equivalence we saw before, this equality means exactly that a is less than or equal to a plus b. This completes the first part.", "L": [["res", "a ⊕ (a ⊕ b) = a ⊕ b   ⟹   a ≤ a ⊕ b   ∎"]]},

{"title": "Part 2: b ≤ a ⊕ b", "clear": 1, "say": "Now the second part. With the same arbitrary a and b, we want to prove that b is less than or equal to a plus b. It works the same way, but here there will be an extra step, because b is not in the first position.", "L": [["txt", "Let a, b ∈ B  (arbitrary)"], ["goal", "We want:  b ≤ a ⊕ b<span class='tag'>Claim of this part</span>"]]},

{"say": "We apply the definition with x equal to b, and y equal to a plus b, which again belongs to B because the sum is internal.", "L": [["sub", "x = b,   y = a ⊕ b  ∈ B<span class='tag'>Choice (⊕ is internal)</span>"], ["sub", "b ≤ a ⊕ b  ⇔  b ⊕ (a ⊕ b) = a ⊕ b<span class='tag'>Definition with x=b, y=a⊕b</span>"]]},

{"say": "Therefore, it is enough to prove that b plus, a plus b, equals a plus b. We start from the left-hand side.", "L": [["goal", "It suffices to prove:  b ⊕ (a ⊕ b) = a ⊕ b<span class='tag'>New claim</span>"], ["txt", "b ⊕ (a ⊕ b)"]]},

{"say": "First step. Associativity of the sum, with x equal to b, y equal to a, and z equal to b. We go from b plus, a plus b, to b plus a, plus b.", "L": [["sub", "b ⊕ (a ⊕ b)  =  (b ⊕ a) ⊕ b<span class='tag'>Associativity of ⊕, with x=b, y=a, z=b</span>"]]},

{"say": "Second step. Now we have b plus a inside the parentheses, and we want a plus b. We apply commutativity: b plus a equals a plus b.", "L": [["sub", "(<mark>b ⊕ a</mark>) ⊕ b"], ["txt", "By (Comm):  <mark>b ⊕ a</mark> = a ⊕ b"], ["sub", "b ⊕ (a ⊕ b)  =  (a ⊕ b) ⊕ b<span class='tag'>Commutativity of ⊕</span>"]]},

{"say": "Third step. We want to bring the two b's together. We apply associativity again, now with x equal to a, y equal to b, and z equal to b. We go from a plus b, plus b, to a plus, b plus b.", "L": [["sub", "b ⊕ (a ⊕ b)  =  a ⊕ (b ⊕ b)<span class='tag'>Associativity of ⊕, with x=a, y=b, z=b</span>"]]},

{"say": "Fourth step. Inside the parentheses we have b plus b. By idempotence, b plus b is b. We highlight it and replace it.", "L": [["sub", "a ⊕ (<mark>b ⊕ b</mark>)"], ["txt", "By (Idem):  <mark>b ⊕ b</mark> = b"], ["res", "b ⊕ (a ⊕ b)  =  a ⊕ b<span class='tag'>Idempotence of ⊕</span>"]]},

{"say": "We have proved the equality. By the definition, this equality means that b is less than or equal to a plus b. This completes the second part.", "L": [["res", "b ⊕ (a ⊕ b) = a ⊕ b   ⟹   b ≤ a ⊕ b   ∎"]]},

{"title": "Summary", "clear": 1, "say": "To sum up. With the definition of less than or equal to, proving that x is less than or equal to y means proving that x plus y equals y. For a less than or equal to a plus b, it was enough to associate and use idempotence. For b less than or equal to a plus b, we also needed commutativity. So a plus b is greater than or equal to both a and b. Thanks for watching.", "L": [["res", "a ≤ a ⊕ b   (associativity + idempotence)"], ["res", "b ≤ a ⊕ b   (associativity + commutativity + associativity + idempotence)"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' plus ').replace(/⊙/g,' times ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Replay'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Resume'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pause';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/andrew|guy|brian|christopher|eric|david|mark|male|google us english$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Order in a lattice";$('sub').textContent="Exercise · Algebraic lattices";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
