<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The field of real numbers</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>Remember</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Start</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Speed <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Recording mode (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"en-US",
"meta":{"nivel": 0, "titulo": "The field of real numbers", "enunciado": "Summary: the real numbers as a complete ordered field", "datos": ["Field structure", "Compatible total order", "Archimedean property", "Upper and lower bounds", "Supremum and infimum", "Completeness axiom"]},
"steps":[
{"title": "The field of real numbers", "sub": "Summary: the real numbers as a complete ordered field", "clear": 1, "say": "Hello. In this video we summarize the complete structure of the real numbers: a complete ordered field. We will look at its ingredients one by one: the field, the order, the Archimedean property, and completeness, with the supremum and the infimum.", "L": [["txt", "Complete ordered field of the reals"], ["sub", "(ℝ, +, ·, ≤)"]]},

{"title": "Complete ordered field", "clear": 1, "say": "The real numbers, with addition, multiplication and the order, form a complete ordered field. This means three things: with addition and multiplication they are a field; the order is total and compatible with the operations; and they satisfy a completeness axiom.", "L": [["goal", "(ℝ, +, ·, ≤)   complete ordered field"], ["txt", "1) (ℝ, +, ·)  is a field"], ["txt", "2) ≤  is a total order, compatible with + and ·"], ["txt", "3) Completeness:  supremum axiom"]]},

{"title": "1) Field", "clear": 1, "say": "First, the field. With addition, the real numbers form an abelian group. With multiplication, the reals minus the set containing only zero form an abelian group. And in addition, multiplication distributes over addition: a times, b plus c, equals a times b, plus a times c.", "L": [["goal", "(ℝ, +, ·)  is a field"], ["res", "(ℝ, +)   abelian group"], ["res", "(ℝ ∖ {0}, ·)   abelian group"], ["res", "Distributivity:   a · (b + c) = a · b + a · c"]], "pin": ["Field: (ℝ,+) and (ℝ∖{0},·) abelian"]},

{"title": "2) Total order", "clear": 1, "say": "Second, the order. Less than or equal to is a total order relation on the real numbers: it is reflexive, antisymmetric, transitive, and any two numbers can be compared.", "L": [["goal", "≤  is a total order relation on ℝ"], ["txt", "Reflexive, antisymmetric, transitive, and every pair comparable"]], "pin": ["Total order ≤"]},

{"say": "It is compatible with addition: if a is less than or equal to b, then a plus c is less than or equal to b plus c. And it is compatible with multiplication: if zero is less than or equal to a, and zero is less than or equal to b, then zero is less than or equal to a times b. That is, the product of two numbers that are positive or zero is positive or zero.", "L": [["res", "Compatible with addition:   a ≤ b  ⟹  a + c ≤ b + c"], ["res", "Compatible with multiplication:   0 ≤ a,  0 ≤ b  ⟹  0 ≤ a · b"]]},

{"title": "3) Archimedean property", "clear": 1, "say": "Third, the Archimedean property. For all numbers a and b greater than zero, there is a natural number n such that n times a is greater than b. Adding a to itself enough times, you exceed any b.", "L": [["goal", "Archimedean property"], ["res", "∀ a, b &gt; 0,   ∃ n ∈ ℕ :   n · a &gt; b"]], "pin": ["Archimedean: ∀a,b>0 ∃n: n·a>b"]},

{"title": "4) Upper bound", "clear": 1, "say": "Fourth, we prepare completeness. Let A be a nonempty subset of the real numbers. A real number M is an upper bound of A if and only if, for every element a of A, a is less than or equal to M.", "L": [["goal", "A ⊆ ℝ,   A ≠ ∅"], ["res", "M ∈ ℝ  is an upper bound of A   ⟺   ∀ a ∈ A,   a ≤ M"]], "pin": ["Upper bound M: ∀a∈A, a ≤ M"]},

{"title": "5) Supremum", "clear": 1, "say": "A real number s is the supremum of A if it satisfies two conditions. One: s is an upper bound of A. Two: for every upper bound M of A, s is less than or equal to M. That is, the supremum is the least of the upper bounds.", "L": [["goal", "s ∈ ℝ  is the supremum of A  if:"], ["res", "(i)   s  is an upper bound of A"], ["res", "(ii)   ∀ M  upper bound of A,   s ≤ M"], ["txt", "The supremum is the least upper bound"]], "pin": ["Supremum s: the least upper bound"]},

{"title": "6) Completeness", "clear": 1, "say": "Now the completeness axiom, also called the supremum axiom: every nonempty subset of the reals that is bounded above has a supremum in the reals. This is the property that distinguishes the real numbers.", "L": [["goal", "Completeness (supremum axiom)"], ["res", "Every nonempty  A ⊆ ℝ  bounded above  has a supremum in ℝ"]], "pin": ["Completeness: every A≠∅ bounded above has sup A"]},

{"title": "7) Lower bound", "clear": 1, "say": "Now, the analogue for lower bounds. Let A be a nonempty subset of the real numbers. A real number m is a lower bound of A if and only if, for every element a of A, m is less than or equal to a.", "L": [["goal", "A ⊆ ℝ,   A ≠ ∅"], ["res", "m ∈ ℝ  is a lower bound of A   ⟺   ∀ a ∈ A,   m ≤ a"]], "pin": ["Lower bound m: ∀a∈A, m ≤ a"]},

{"title": "8) Infimum", "clear": 1, "say": "A real number i is the infimum of A if it satisfies two conditions. One: i is a lower bound of A. Two: for every lower bound m of A, m is less than or equal to i. That is, the infimum is the greatest of the lower bounds.", "L": [["goal", "i ∈ ℝ  is the infimum of A  if:"], ["res", "(i)   i  is a lower bound of A"], ["res", "(ii)   ∀ m  lower bound of A,   m ≤ i"], ["txt", "The infimum is the greatest lower bound"]], "pin": ["Infimum i: the greatest lower bound"]},

{"title": "9) Completeness for the infimum", "clear": 1, "say": "And the completeness axiom for the infimum: every nonempty subset of the reals that is bounded below has an infimum in the reals. It is equivalent to the supremum axiom: just apply the supremum axiom to the set of the opposites of the elements of A.", "L": [["goal", "Completeness (infimum axiom)"], ["res", "Every nonempty  A ⊆ ℝ  bounded below  has an infimum in ℝ"], ["txt", "Equivalent to the supremum axiom"]], "pin": ["Completeness: every A≠∅ bounded below has inf A"]},

{"title": "Conclusion", "clear": 1, "say": "Conclusion. These properties characterize the real numbers: the real numbers are the only complete ordered field, up to isomorphism.", "L": [["res", "ℝ  is the only  complete ordered field   (up to isomorphism)"]]},

{"title": "Summary", "clear": 1, "say": "Summary. The real numbers are a field, with a total order compatible with addition and multiplication, and they are complete: every nonempty set bounded above has a supremum, and every nonempty set bounded below has an infimum. They also satisfy the Archimedean property. Thanks for watching.", "L": [["res", "(ℝ, +, ·)  field,   ≤  compatible total order"], ["res", "Completeness:  every A ≠ ∅ bounded above has  sup A"], ["res", "Every A ≠ ∅ bounded below has  inf A"], ["res", "Archimedean:  ∀ a, b &gt; 0,  ∃ n ∈ ℕ :  n · a &gt; b"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' plus ').replace(/⊙/g,' times ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Replay'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Resume'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pause';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/andrew|guy|brian|christopher|eric|david|mark|male|google us english$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="The field of real numbers";$('sub').textContent="Summary: the real numbers as a complete ordered field";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
