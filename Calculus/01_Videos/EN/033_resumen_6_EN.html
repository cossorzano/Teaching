<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relations, operations and algebraic structures</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>Remember</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Start</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Speed <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Recording mode (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"en-US",
"meta":{"nivel": 0, "titulo": "Relations, operations and algebraic structures", "enunciado": "Summary: binary relations, operations and the hierarchy of structures, from magma to field", "datos": ["Equivalence relations", "Partial and total orders", "Binary operations", "Magma, semigroup and monoid", "Group and abelian group", "Rings", "Field"]},
"steps":[
{"title": "Relations, operations and algebraic structures", "sub": "Summary: binary relations, operations and the hierarchy of structures, from magma to field", "clear": 1, "say": "Hello. In this video we summarize binary relations, operations, and the hierarchy of algebraic structures: from the magma up to the field. First the relations, and then the structures, adding properties one by one.", "L": [["txt", "Binary relations  →  operations  →  algebraic structures"]]},

{"title": "1) Binary relation", "clear": 1, "say": "A binary relation on a set E is a subset R of the Cartesian product E times E. Writing that the pair a, b belongs to R means that a is related to b.", "L": [["goal", "Binary relation:   R ⊆ E × E"], ["txt", "(a, b) ∈ R   means that  a  is related to  b"]]},

{"title": "2) Equivalence relation", "clear": 1, "say": "An equivalence relation is a binary relation that satisfies three properties. Reflexive: for every a, the pair a, a belongs to R. Symmetric: if the pair a, b belongs to R, then the pair b, a belongs to R. And transitive: if the pairs a, b and b, c belong to R, then the pair a, c belongs to R.", "L": [["goal", "Equivalence relation"], ["res", "Reflexive:   (a, a) ∈ R"], ["res", "Symmetric:   (a, b) ∈ R  ⟹  (b, a) ∈ R"], ["res", "Transitive:   (a, b), (b, c) ∈ R  ⟹  (a, c) ∈ R"]]},

{"say": "It is written in three ways, depending on the context: the pair a, b belongs to R, a is equivalent to b, or a equals b.", "L": [["txt", "Notation, depending on the context:"], ["sub", "(a, b) ∈ R,       a ∼ b,       a = b"]]},

{"title": "3) Partial order", "clear": 1, "say": "A partial order relation also satisfies three properties. Reflexive: the pair a, a belongs to R. Antisymmetric: if the pairs a, b and b, a belong to R, then a equals b. And transitive, as before. We write the pair a, b belongs to R, or a less than or equal to b.", "L": [["goal", "Partial order relation"], ["res", "Reflexive:   (a, a) ∈ R"], ["res", "Antisymmetric:   (a, b), (b, a) ∈ R  ⟹  a = b"], ["res", "Transitive:   (a, b), (b, c) ∈ R  ⟹  (a, c) ∈ R"], ["sub", "Notation:   (a, b) ∈ R,       a ≤ b"]]},

{"title": "4) Total order", "clear": 1, "say": "A total order relation is a partial order in which any two elements are comparable: for all a and b, the pair a, b belongs to R, or the pair b, a belongs to R. Careful: do not confuse it with saying that if a, b is in R then b, a is not, which contradicts reflexivity.", "L": [["goal", "Total order relation"], ["txt", "A partial order and, in addition:"], ["res", "∀ a, b:   (a, b) ∈ R   or   (b, a) ∈ R"], ["warn", "Not:  (a, b) ∈ R ⟹ (b, a) ∉ R   (it contradicts reflexivity)"]]},

{"title": "5) Binary operations", "clear": 1, "say": "Now the operations. An internal binary operation on E is a function f from E times E to E: it combines two elements of E and returns another element of E. An external binary operation is a function f from E times F to E: it combines an element of E with one from another set F, and returns an element of E.", "L": [["goal", "Internal binary operation:   f : E × E → E"], ["goal", "External binary operation:   f : E × F → E"]]},

{"title": "6) Magma", "clear": 1, "say": "Now the hierarchy of structures, adding properties at each level. A magma is a set E with an internal binary operation, which we write with the circled plus symbol.", "L": [["goal", "Magma:   (E, ⊕)"], ["txt", "⊕  internal binary operation"]], "pin": ["Magma:  ⊕ internal"]},

{"title": "7) Semigroup", "clear": 1, "say": "A semigroup is a magma in which the operation is associative: a plus b, plus c, equals a plus, b plus c.", "L": [["goal", "Semigroup:   (E, ⊕)   Magma  +"], ["res", "Associative:   (a ⊕ b) ⊕ c = a ⊕ (b ⊕ c)"]], "pin": ["Semigroup:  + associative"]},

{"title": "8) Monoid", "clear": 1, "say": "A monoid is a semigroup with an identity element: there is a unique element, which we call zero, such that, for every a, a plus zero is a, and zero plus a is a.", "L": [["goal", "Monoid:   (E, ⊕)   Semigroup  +"], ["res", "Identity element:   ∃! 0  such that  ∀ a:   a ⊕ 0 = a,    0 ⊕ a = a"]], "pin": ["Monoid:  + identity element"]},

{"title": "9) Group", "clear": 1, "say": "A group is a monoid in which every element has an inverse: for every a, there is a unique element, the inverse of a, such that a plus its inverse, and its inverse plus a, are equal to the identity element zero.", "L": [["goal", "Group:   (E, ⊕)   Monoid  +"], ["res", "Inverse element:   ∀ a,  ∃! ∼a  such that"], ["res", "a ⊕ (∼a) = (∼a) ⊕ a = 0"]], "pin": ["Group:  + inverse element"]},

{"title": "10) Abelian group", "clear": 1, "say": "An abelian group is a group in which the operation is commutative: a plus b equals b plus a.", "L": [["goal", "Abelian group:   (E, ⊕)   Group  +"], ["res", "Commutative:   a ⊕ b = b ⊕ a"]], "pin": ["Abelian group:  + commutative"]},

{"title": "11) Ring", "clear": 1, "say": "A ring has two operations: the sum, written with the circled plus, and the product, written with the circled dot. With the sum, E is an abelian group. With the product, E is a semigroup.", "L": [["goal", "Ring:   (E, ⊕, ⊙)"], ["res", "(E, ⊕)   Abelian group"], ["res", "(E, ⊙)   Semigroup"]], "pin": ["Ring:  (E,⊕) abelian, (E,⊙) semigroup"]},

{"say": "And, in addition, the two operations are related by two distributive laws. On the left: a times, b plus c, equals a times b, plus a times c. On the right: b plus c, times a, equals b times a, plus c times a.", "L": [["res", "Left distributive:   a ⊙ (b ⊕ c) = (a ⊙ b) ⊕ (a ⊙ c)"], ["res", "Right distributive:   (b ⊕ c) ⊙ a = (b ⊙ a) ⊕ (c ⊙ a)"]]},

{"title": "12) Unital ring", "clear": 1, "say": "A unital ring is a ring in which the product has an identity element: that is, E with the product is a monoid.", "L": [["goal", "Unital ring:   (E, ⊕, ⊙)   Ring  +"], ["res", "(E, ⊙)   Monoid"]], "pin": ["Unital ring:  (E,⊙) monoid"]},

{"title": "13) Division ring", "clear": 1, "say": "A division ring is a unital ring in which every nonzero element has an inverse for the product: that is, E minus the set containing only zero, with the product, is a group.", "L": [["goal", "Division ring:   (E, ⊕, ⊙)   Unital ring  +"], ["res", "(E ∖ {0}, ⊙)   Group"]], "pin": ["Division ring:  (E∖{0},⊙) group"]},

{"title": "14) Field", "clear": 1, "say": "And a field is a division ring in which the product is commutative.", "L": [["goal", "Field:   (E, ⊕, ⊙)   Division ring  +"], ["res", "⊙  commutative"]], "pin": ["Field:  ⊙ commutative"]},

{"title": "Summary", "clear": 1, "say": "Summary. Equivalence relations are reflexive, symmetric and transitive. Partial orders are reflexive, antisymmetric and transitive, and the order is total if all pairs are comparable. For the structures, each level adds one property: the semigroup, associativity; the monoid, the identity element; the group, the inverse; the abelian group, commutativity. With two operations, the ring, the unital ring, the division ring, and the field. Thanks for watching.", "L": [["res", "Equivalence:  reflexive, symmetric, transitive"], ["res", "Partial order:  reflexive, antisymmetric, transitive"], ["res", "Total order:  ∀ a, b:  (a, b) ∈ R  or  (b, a) ∈ R"], ["res", "Magma → Semigroup → Monoid → Group → Abelian group"], ["txt", "        + associative    + identity    + inverse    + commutative"], ["res", "Ring → Unital ring → Division ring → Field"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' plus ').replace(/⊙/g,' times ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Replay'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Resume'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pause';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/andrew|guy|brian|christopher|eric|david|mark|male|google us english$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Relations, operations and algebraic structures";$('sub').textContent="Summary: binary relations, operations and the hierarchy of structures, from magma to field";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
