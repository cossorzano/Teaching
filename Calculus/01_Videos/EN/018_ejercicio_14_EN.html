<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inclusion with differences</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>Remember</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Start</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Speed <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Recording mode (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"en-US",
"meta":{"nivel": 1, "titulo": "Inclusion with differences", "enunciado": "Prove that, for any sets A, B, D, the following holds:", "tesis": "A ∖ B ⊆ (A ∖ D) ∪ (D ∖ B)", "datos": ["(Incl)  X ⊆ Y ⇔ (x ∈ X ⇒ x ∈ Y)", "(Diff)  x ∈ X ∖ Y ⇔ x ∈ X and x ∉ Y", "(Def ∪)  x ∈ X ∪ Y ⇔ x ∈ X or x ∈ Y"]},
"steps":[
{"title": "Inclusion with differences", "sub": "Exercise · Algebra of sets", "clear": 1, "say": "Hello. In this video we are going to solve an exercise about the algebra of sets. We will go very slowly, writing every equation and justifying every step.", "L": [["txt", "An inclusion between sets with differences"]]},

{"say": "What we want to prove. For any sets A, B and D, A minus B is contained in, A minus D, union, D minus B.", "L": [["txt", "Let A, B, D be any sets"], ["goal", "A ∖ B ⊆ (A ∖ D) ∪ (D ∖ B)<span class='tag'>Claim</span>"]]},

{"say": "To prove it, we recall three definitions, which we write on the left. Inclusion: X is contained in Y if every element x of X belongs to Y. Difference: x belongs to X minus Y if x belongs to X, and x does not belong to Y. And union: x belongs to X union Y if x belongs to X, or x belongs to Y.", "L": [["sub", "X ⊆ Y  ⇔  (x ∈ X ⇒ x ∈ Y)<span class='tag'>Inclusion</span>"], ["sub", "x ∈ X ∖ Y  ⇔  x ∈ X  and  x ∉ Y<span class='tag'>Difference</span>"], ["sub", "x ∈ X ∪ Y  ⇔  x ∈ X  or  x ∈ Y<span class='tag'>Union</span>"]], "pin": ["(Incl) X ⊆ Y ⇔ (x ∈ X ⇒ x ∈ Y)", "(Diff) x ∈ X ∖ Y ⇔ x ∈ X and x ∉ Y", "(Def ∪) x ∈ X ∪ Y ⇔ x ∈ X or x ∈ Y"]},

{"title": "Let x ∈ A ∖ B", "clear": 1, "say": "By the definition of inclusion, we must take any element of the set on the left and prove that it belongs to the one on the right. Let x be an element of A minus B. This is a hypothesis. We want to prove that x belongs to A minus D, union, D minus B.", "L": [["hyp", "Let  x ∈ A ∖ B<span class='tag'>Hypothesis</span>"], ["goal", "We want:  x ∈ (A ∖ D) ∪ (D ∖ B)<span class='tag'>Claim</span>"]]},

{"say": "By the definition of difference, x belongs to A, and x does not belong to B.", "L": [["hyp", "x ∈ A   and   x ∉ B<span class='tag'>Definition of difference</span>"]]},

{"say": "Now we consider two cases, depending on whether or not x belongs to D. These are the only two possible cases: either x does not belong to D, or x belongs to D.", "L": [["sub", "Case 1:  x ∉ D"], ["sub", "Case 2:  x ∈ D<span class='tag'>These are the only two possible cases</span>"]]},

{"title": "Case 1: x ∉ D", "clear": 1, "say": "First case: suppose that x does not belong to D. This is a hypothesis.", "L": [["hyp", "x ∉ D<span class='tag'>Hypothesis of case 1</span>"]]},

{"say": "Then, since x belongs to A, and x does not belong to D, by the definition of difference, x belongs to A minus D.", "L": [["sub", "x ∈ A   and   x ∉ D   ⟹   x ∈ A ∖ D<span class='tag'>Definition of difference</span>"]]},

{"say": "Therefore, by the definition of union, x belongs to A minus D, union, D minus B. This ends the first case.", "L": [["res", "x ∈ (A ∖ D) ∪ (D ∖ B)<span class='tag'>Definition of ∪</span>"]]},

{"title": "Case 2: x ∈ D", "clear": 1, "say": "Second case: suppose that x belongs to D. This is a hypothesis.", "L": [["hyp", "x ∈ D<span class='tag'>Hypothesis of case 2</span>"]]},

{"say": "Then, since x belongs to D, and x does not belong to B, by the definition of difference, x belongs to D minus B. Recall that x does not belong to B was part of the initial hypothesis.", "L": [["sub", "x ∈ D   and   x ∉ B   ⟹   x ∈ D ∖ B<span class='tag'>Definition of difference</span>"]]},

{"say": "Therefore, by the definition of union, x belongs to A minus D, union, D minus B. This ends the second case.", "L": [["res", "x ∈ (A ∖ D) ∪ (D ∖ B)<span class='tag'>Definition of ∪</span>"]]},

{"title": "Conclusion", "clear": 1, "say": "In both cases, x belongs to A minus D, union, D minus B. Since x was an arbitrary element of A minus B, by the definition of inclusion we conclude that A minus B is contained in, A minus D, union, D minus B. Thanks for watching.", "L": [["res", "In both cases:  x ∈ (A ∖ D) ∪ (D ∖ B)"], ["res", "A ∖ B ⊆ (A ∖ D) ∪ (D ∖ B)   ∎<span class='tag'>x was arbitrary in A ∖ B</span>"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' plus ').replace(/⊙/g,' times ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Replay'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Resume'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pause';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/andrew|guy|brian|christopher|eric|david|mark|male|google us english$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Inclusion with differences";$('sub').textContent="Exercise · Algebra of sets";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
