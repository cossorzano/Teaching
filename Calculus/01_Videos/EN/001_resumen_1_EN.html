<script type="application/json" id="data">
{"lang":"en-US",
"meta":{"nivel": 0, "titulo": "Lattices and Boolean algebras", "enunciado": "Theory of the chapter: operations with sets and algebraic structures", "datos": ["1. Lattices", "2. Distributive lattices", "3. Boolean algebras", "4. The Boolean algebra of sets", "5. Difference and symmetric difference", "6. Cartesian product"]},
"steps":[
{"title": "Lattices and Boolean algebras", "sub": "Theory · Sets and operations", "clear": 1, "say": "Hello. In this video we will go over the theory we will use throughout the chapter: how to formalize operations between sets, and what algebraic structure appears when we combine them. We will go very slowly, one definition at a time, with examples at every step.", "L": [["txt", "Operations with sets ⟶ algebraic structures"]]},

{"title": "1. Lattices", "clear": 1, "say": "Let's start with an idea. Union and intersection of sets satisfy many properties. Instead of proving them one by one, we keep only the essential properties and give them a name: that abstract structure is called a lattice.", "L": [["txt", "Union ∪ and intersection ∩ share common properties"], ["goal", "Abstraction: lattice"]]},

{"say": "Let B be any set, with two internal binary operations, which we write with the symbols circled plus and circled dot. Binary means that they operate on two elements at a time. Internal means that the result stays in B. As an example, B can be the power set of a universal set U, which we will see later, with union as circled plus and intersection as circled dot.", "L": [["hyp", "B a set,  ⊕, ⊙ : B × B ⟶ B<span class='tag'>Data: two internal binary operations</span>"], ["txt", "Example: B = power set of U,  ⊕ = ∪,  ⊙ = ∩"]]},

{"say": "We say that B with these operations is a lattice if, for all a, b and c in B, three kinds of properties hold. The first is commutativity: the order of the two elements does not matter. With sets: A union B equals B union A, and A intersection B equals B intersection A.", "L": [["hyp", "a ⊕ b = b ⊕ a,     a ⊙ b = b ⊙ a<span class='tag'>Commutativity</span>"], ["txt", "With sets:  A ∪ B = B ∪ A,   A ∩ B = B ∩ A"]]},

{"say": "The second is associativity: when operating three elements, it does not matter which two we group first. Thanks to it we can write a plus b plus c without parentheses, with no ambiguity.", "L": [["hyp", "a ⊕ (b ⊕ c) = (a ⊕ b) ⊕ c<span class='tag'>Associativity of ⊕</span>"], ["hyp", "a ⊙ (b ⊙ c) = (a ⊙ b) ⊙ c<span class='tag'>Associativity of ⊙</span>"]]},

{"say": "The third is absorption, which links the two operations to each other. If we add to an element a its product with any other element, we get a back. And the same holds with the operations swapped.", "L": [["hyp", "a ⊕ (a ⊙ b) = a<span class='tag'>Absorption 1</span>"], ["hyp", "a ⊙ (a ⊕ b) = a<span class='tag'>Absorption 2</span>"]]},

{"say": "Let's see why this is natural with sets. A union, A intersection B, should be A: the intersection is contained in A, so joining it with A adds nothing new. That is why A absorbs the intersection.", "L": [["txt", "A ∩ B ⊆ A   ⟹   A ∪ (A ∩ B) = A"]]},

{"say": "To sum up. A lattice is a set with two internal operations that are commutative, associative, and satisfy the two absorption laws. We note it down on the left.", "pin": "Lattice: ⊕, ⊙ internal, commutative, associative, with absorption"},

{"say": "From these axioms one proves that both operations are idempotent: operating an element with itself has no effect. With sets: A union A equals A, and A intersection A equals A.", "L": [["res", "a ⊕ a = a,     a ⊙ a = a<span class='tag'>Idempotence (proved using absorption)</span>"], ["txt", "With sets:  A ∪ A = A,  A ∩ A = A"]]},

{"title": "2. Distributive lattices", "clear": 1, "say": "Now an extra property, a very important one: distributivity. A lattice is distributive if each operation distributes over the other.", "L": [["goal", "Distributive lattice"]]},

{"say": "Let's write the two laws. The first says that a plus, b times c, equals, a plus b, all of it times, a plus c. The second is the same with the roles swapped.", "L": [["hyp", "a ⊕ (b ⊙ c) = (a ⊕ b) ⊙ (a ⊕ c)"], ["hyp", "a ⊙ (b ⊕ c) = (a ⊙ b) ⊕ (a ⊙ c)"]]},

{"say": "Watch out for an important difference with ordinary algebra. With numbers, multiplication distributes over addition, but addition does not distribute over multiplication. Here, instead, both laws hold at the same time.", "L": [["txt", "Numbers:  a·(b + c) = a·b + a·c   ✔"], ["warn", "Numbers:  a + (b·c) = (a + b)·(a + c)   ✘<span class='tag'>False for numbers</span>"], ["res", "In a distributive lattice both hold"]]},

{"say": "This property is key because it lets us turn complex expressions into simpler combinations. We note it down.", "pin": "Distributive: ⊕ and ⊙ distribute over each other"},

{"title": "3. Boolean algebras", "clear": 1, "say": "Now we add more structure. Imagine a distributive lattice in which there is a minimum element, which we call zero, and a maximum element, which we call one. With sets, they will be the empty set and the universal set.", "L": [["goal", "Distributive lattice + 0 + 1 + complements"]]},

{"say": "Zero and one behave as neutral elements. Adding zero to an element does not change it, and neither does multiplying by one. With sets: A union the empty set is A, and A intersection the universal set U is A.", "L": [["hyp", "a ⊕ 0 = a,     a ⊙ 1 = a<span class='tag'>Neutral elements</span>"], ["txt", "With sets:  A ∪ ∅ = A,   A ∩ U = A"]]},

{"say": "Moreover, we require every element a to have a complement, which we write with a tilde in front. The complement satisfies two conditions at once. Added to a, it gives one. Multiplied by a, it gives zero. With sets: A union its complement is the universal set U, and A intersection its complement is the empty set.", "L": [["hyp", "a ⊕ ∼a = 1<span class='tag'>Complement</span>"], ["hyp", "a ⊙ ∼a = 0<span class='tag'>Complement</span>"], ["txt", "With sets:  A ∪ A<sup>c</sup> = U,   A ∩ A<sup>c</sup> = ∅"]]},

{"say": "When all these conditions hold, the structure is called a Boolean algebra. We note it down on the left, next to the previous ones.", "pin": "Boolean: distributive + 0, 1 + complements"},

{"say": "In a Boolean algebra, the complement of each element is unique. And the involution law holds: the complement of the complement of a is a itself. With sets, the complement of the complement of A is A.", "L": [["res", "∼(∼a) = a<span class='tag'>Involution</span>"], ["txt", "With sets:  (A<sup>c</sup>)<sup>c</sup> = A"]]},

{"say": "The domination laws also hold. Adding one to any element gives one. Multiplying any element by zero gives zero. Notice that one dominates the sum and zero dominates the product. With sets: A union U is U, and A intersection the empty set is the empty set.", "L": [["res", "a ⊕ 1 = 1,     a ⊙ 0 = 0<span class='tag'>Domination</span>"], ["txt", "With sets:  A ∪ U = U,   A ∩ ∅ = ∅"]]},

{"say": "And De Morgan's laws. The sum of a and b is the complement of the product of the complements. And the other one, with the operations swapped. They let us move from one operation to the other through the complement. With sets: A union B is the complement of, the complement of A intersection the complement of B. And A intersection B is the complement of, the complement of A union the complement of B.", "L": [["res", "a ⊕ b = ∼(∼a ⊙ ∼b)"], ["res", "a ⊙ b = ∼(∼a ⊕ ∼b)<span class='tag'>De Morgan's laws</span>"], ["txt", "With sets:  A ∪ B = (A<sup>c</sup> ∩ B<sup>c</sup>)<sup>c</sup>"], ["txt", "With sets:  A ∩ B = (A<sup>c</sup> ∪ B<sup>c</sup>)<sup>c</sup>"]]},

{"say": "An essential feature is the duality principle. Any valid identity remains valid if we swap the two operations, and at the same time zero and one. Let's see an example: if a plus zero is a, then a times one is a.", "L": [["sub", "a ⊕ 0 = a<span class='tag'>Valid identity</span>"], ["sub", "⊕ ↔ ⊙,   0 ↔ 1<span class='tag'>Dual swap</span>"], ["res", "a ⊙ 1 = a<span class='tag'>Dual identity, also valid</span>"]]},

{"title": "4. The Boolean algebra of sets", "clear": 1, "say": "Now we make all this concrete with sets. Given a universal set U, the power set of U is the set made up of all the subsets of U. It is written with a calligraphic capital P. For example, if U is the set containing one and two, the power set of U has four elements: the empty set, the set one, the set two, and the set one, two.", "L": [["txt", "P(U) = { A | A ⊆ U }"], ["txt", "Example: U = {1, 2}  ⟹  P(U) = { ∅, {1}, {2}, {1,2} }"]]},

{"say": "With union and intersection as operations, P of U is a Boolean algebra. This table is the dictionary between the abstract language and the language of sets.", "L": [["hyp", "⊕  ⟷  ∪   (union)"], ["hyp", "⊙  ⟷  ∩   (intersection)"], ["hyp", "0  ⟷  ∅   (empty set)"], ["hyp", "1  ⟷  U   (universal set)"], ["hyp", "∼A  ⟷  A<sup>c</sup>   (complement)"]]},

{"say": "The complement of A is the set of elements of U that do not belong to A. For example, if U is one, two, three, and A is the set one, the complement of A is two, three.", "L": [["sub", "A<sup>c</sup> = { x ∈ U | x ∉ A }<span class='tag'>Definition</span>"], ["txt", "Example: U = {1,2,3},  A = {1}  ⟹  A<sup>c</sup> = {2,3}"]]},

{"say": "Another useful fact. Two sets A and B are equal if and only if each one is contained in the other. This is the usual technique for proving equalities: prove the two inclusions separately.", "L": [["sub", "A = B  ⟺  A ⊆ B  and  B ⊆ A"], ["txt", "To prove A ⊆ B: take x ∈ A and deduce x ∈ B"]]},

{"title": "5. Difference and symmetric difference", "clear": 1, "say": "From the complement we define other operations. The difference A minus B is the set of elements that are in A but not in B. For example, the set one, two, three minus the set two is the set one, three.", "L": [["sub", "A ∖ B = { x ∈ A | x ∉ B } = A ∩ B<sup>c</sup><span class='tag'>Difference</span>"], ["txt", "Example: {1,2,3} ∖ {2} = {1,3}"]]},

{"say": "The equality with A intersection the complement of B is very useful: it lets us turn a difference into an intersection and use all the properties we already know. Keep in mind that the difference is not commutative.", "L": [["warn", "A ∖ B ≠ B ∖ A  (in general)<span class='tag'>Careful</span>"]]},

{"say": "The symmetric difference collects the elements that are in only one of the two sets. It is obtained by joining A minus B with B minus A. For example, let A be one, two, and B be two, three. A minus B is one, B minus A is three, and the union is one, three.", "L": [["sub", "A △ B = (A ∖ B) ∪ (B ∖ A)<span class='tag'>Symmetric difference</span>"], ["txt", "Example: {1,2} △ {2,3} = {1} ∪ {3} = {1,3}"]]},

{"say": "These operations satisfy identities that let us rewrite expressions. The symmetric difference is the union without the intersection: what is in either of the two, removing what is in both. The second says that A minus B is the symmetric difference of A with A intersection B. Let's check the first one with the previous example: the union is one, two, three; the intersection is two; and one, two, three minus two is one, three, which matches the result.", "L": [["res", "A △ B = (A ∪ B) ∖ (A ∩ B)"], ["res", "A ∖ B = A △ (A ∩ B)"], ["txt", "Check with the previous example: (A ∪ B) ∖ (A ∩ B) = {1,2,3} ∖ {2} = {1,3} ✔"]]},

{"title": "6. Cartesian product", "clear": 1, "say": "One last construction: the Cartesian product. Given sets A one, A two, up to A n, their product is the set of n-tuples whose i-th component belongs to A i.", "L": [["sub", "A₁ × A₂ × ⋯ × Aₙ = { (x₁, x₂, …, xₙ) | xᵢ ∈ Aᵢ }<span class='tag'>Definition</span>"]]},

{"say": "Let's see an example with two sets. A is one, two, and B is a, b. Their product has all the pairs whose first component is from A and whose second is from B. There are four pairs. Order matters: the product B times A is different.", "L": [["txt", "A = {1,2},   B = {a,b}"], ["res", "A × B = { (1,a), (1,b), (2,a), (2,b) }"], ["warn", "A × B ≠ B × A  (in general)"]]},

{"say": "This operation is essential for functions of several variables, graphs, and regions of the plane and of space. For example, the plane is the product of the real line with itself.", "L": [["txt", "ℝ × ℝ = ℝ²  (the plane),    ℝ × ℝ × ℝ = ℝ³  (space)"]]},

{"say": "The Cartesian product gets along well with union. The union of A and B, times C, equals the union of A times C and B times C. The reason: a pair x, y is in the first set if x is in A or in B, and y is in C. That is the same as saying that it is in A times C, or in B times C.", "L": [["res", "(A ∪ B) × C = (A × C) ∪ (B × C)"], ["txt", "(x,y) ∈ (A∪B)×C ⟺ (x ∈ A or x ∈ B) and y ∈ C ⟺ (x,y) ∈ A×C or (x,y) ∈ B×C"]]},

{"say": "The same happens with intersection: a pair is in the first set if x is in A and in B, and y is in C, and that is equivalent to being in A times C and, at the same time, in B times C. And the same goes for the difference.", "L": [["res", "(A ∩ B) × C = (A × C) ∩ (B × C)"], ["res", "(A ∖ B) × C = (A × C) ∖ (B × C)"]]},

{"say": "Applying the union property twice gives the expansion formula. The union of A and B, times, the union of C and D, is the union of four products: A times C, B times C, A times D, and B times D. Think of four rectangles.", "L": [["res", "(A ∪ B) × (C ∪ D) = (A × C) ∪ (B × C) ∪ (A × D) ∪ (B × D)"], ["warn", "≠ (A × C) ∪ (B × D)<span class='tag'>Typical mistake: the cross terms are missing</span>"]]},

{"title": "Conclusion", "clear": 1, "say": "To finish: all these identities are not isolated rules, but consequences of the underlying algebraic structure. Knowing them lets you manipulate sets with confidence, break complex regions into simpler parts, and reason precisely about domains and ranges. In the exercises we will use them both in practice and in theory. Thanks for watching.", "L": [["res", "Lattice ⟶ distributive ⟶ Boolean algebra"], ["res", "P(U) with ∪, ∩, ∅, U, complement"], ["res", "Difference, symmetric difference and Cartesian product"]]}
]}

<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){const d=document.createElement('div');d.className='l hyp';d.innerHTML=s.pin;if(k<n)d.style.animation='none';pins.appendChild(d)}}
 board.scrollTop=board.scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' plus ').replace(/⊙/g,' times ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Replay'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Resume'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pause';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/andrew|guy|brian|christopher|eric|david|mark|male|google us english$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Lattices and Boolean algebras";$('sub').textContent="Theory · Sets and operations";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
