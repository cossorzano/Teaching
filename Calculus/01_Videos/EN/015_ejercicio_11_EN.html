<style>

{"title": "𝒫(U) is a lattice", "sub": "Exercise · Algebraic lattices", "clear": 1, "say": "Hello. In this video we are going to solve an exercise about lattices and sets. We will go very slowly, writing every equation and justifying every step.", "L": [["txt", "Prove that the power set of U, with union and intersection, is a lattice"]]},

{"title": "Internal operations", "clear": 1, "say": "First, the operations are internal. Given two subsets A and B of U, the union of A and B is also a subset of U, and the intersection of A and B is also a subset of U. That is, the union and the intersection of two elements of the power set of U are still in the power set of U.", "L": [["txt", "Let A, B ⊆ U"], ["res", "A ∪ B ⊆ U<span class='tag'>∪ is internal</span>"], ["res", "A ∩ B ⊆ U<span class='tag'>∩ is internal</span>"]]},

{"title": "Method: reasoning with elements", "clear": 1, "say": "Now we prove the properties by reasoning with elements. Let A, B and C be subsets of U, and let x be an element of U. Recall that two sets are equal if and only if they have the same elements. So, to prove that two sets are equal, we will prove that x belongs to one if and only if it belongs to the other.", "L": [["txt", "Let A, B, C ⊆ U  and  x ∈ U"], ["goal", "X = Y   ⇔   (x ∈ X ⇔ x ∈ Y)<span class='tag'>Equality of sets: same elements</span>"]]},

{"say": "And let us recall the definitions of union and intersection. x belongs to the union of A and B if and only if x belongs to A, or x belongs to B. And x belongs to the intersection of A and B if and only if x belongs to A, and x belongs to B. We write them on the left.", "L": [["sub", "x ∈ A ∪ B  ⇔  x ∈ A  or  x ∈ B<span class='tag'>Definition of union</span>"], ["sub", "x ∈ A ∩ B  ⇔  x ∈ A  and  x ∈ B<span class='tag'>Definition of intersection</span>"]], "pin": ["(Def ∪) x ∈ A ∪ B ⇔ x ∈ A or x ∈ B", "(Def ∩) x ∈ A ∩ B ⇔ x ∈ A and x ∈ B"]},

{"title": "Commutativity of ∪", "clear": 1, "say": "We start with the commutativity of the union. We want to prove that A union B equals B union A. We start from x belongs to A union B.", "L": [["goal", "We want:  A ∪ B = B ∪ A"], ["txt", "x ∈ A ∪ B"]]},

{"say": "Third step. By the definition of union, read backwards, this is equivalent to x belonging to B union A. Since x is arbitrary, both sets have the same elements, and therefore they are equal.", "L": [["res", "⇔  x ∈ B ∪ A<span class='tag'>Definition of ∪</span>"], ["res", "A ∪ B = B ∪ A   ∎"]]},

{"title": "Commutativity of ∩", "clear": 1, "say": "We continue with the commutativity of the intersection. We want to prove that A intersection B equals B intersection A. We start from x belongs to A intersection B.", "L": [["goal", "We want:  A ∩ B = B ∩ A"], ["txt", "x ∈ A ∩ B"]]},

{"say": "First step. By the definition of intersection, x belongs to A intersection B if and only if x belongs to A, and x belongs to B.", "L": [["sub", "⇔  x ∈ A  and  x ∈ B<span class='tag'>Definition of ∩</span>"]]},

{"say": "Second step. By the commutativity of the logical conjunction and, we can swap the order: x belongs to B, and x belongs to A.", "L": [["sub", "⇔  x ∈ B  and  x ∈ A<span class='tag'>Commutativity of «and»</span>"]]},

{"say": "Third step. By the definition of intersection, read backwards, this is equivalent to x belonging to B intersection A. Since x is arbitrary, both sets are equal.", "L": [["res", "⇔  x ∈ B ∩ A<span class='tag'>Definition of ∩</span>"], ["res", "A ∩ B = B ∩ A   ∎"]]},

{"title": "Associativity of ∪", "clear": 1, "say": "We move on to the associativity of the union. We want to prove that A union, B union C, equals, A union B, union C. We start from x belongs to A union, B union C.", "L": [["goal", "We want:  A ∪ (B ∪ C) = (A ∪ B) ∪ C"], ["txt", "x ∈ A ∪ (B ∪ C)"]]},

{"say": "First step. By the definition of union, x belongs to A, or x belongs to B union C. And applying the definition again, x belongs to B union C if and only if x belongs to B, or x belongs to C.", "L": [["sub", "⇔  x ∈ A  or  (x ∈ B  or  x ∈ C)<span class='tag'>Definition of ∪, applied twice</span>"]]},

{"say": "Fourth step. By the definition of union, this is equivalent to x belonging to, A union B, union C. Since x is arbitrary, both sets are equal.", "L": [["res", "⇔  x ∈ (A ∪ B) ∪ C<span class='tag'>Definition of ∪</span>"], ["res", "A ∪ (B ∪ C) = (A ∪ B) ∪ C   ∎"]]},

{"say": "Second step. By the associativity of the logical conjunction and, we can remove the brackets: x belongs to A, and x belongs to B, and x belongs to C.", "L": [["sub", "⇔  (x ∈ A  and  x ∈ B  and  x ∈ C)<span class='tag'>Associativity of «and»</span>"]]},

{"say": "Third step. We group the first two terms. By the definition of intersection, x belongs to A, and x belongs to B, is equivalent to x belonging to A intersection B. Therefore, we have x belongs to A intersection B, and x belongs to C.", "L": [["sub", "⇔  (x ∈ A ∩ B)  and  x ∈ C<span class='tag'>Definition of ∩</span>"]]},

{"say": "First step. By the definition of union, and then that of intersection, x belongs to A, or, x belongs to A and x belongs to B.", "L": [["sub", "⇔  x ∈ A  or  (x ∈ A  and  x ∈ B)<span class='tag'>Definition of ∪ and of ∩</span>"]]},

{"title": "Absorption of ∩", "clear": 1, "say": "And the absorption of the intersection. We want to prove that A intersection, A union B, equals A. We start from x belongs to A intersection, A union B.", "L": [["goal", "We want:  A ∩ (A ∪ B) = A"], ["txt", "x ∈ A ∩ (A ∪ B)"]]},

{"say": "First step. By the definition of intersection, and then that of union, x belongs to A, and, x belongs to A or x belongs to B.", "L": [["sub", "⇔  x ∈ A  and  (x ∈ A  or  x ∈ B)<span class='tag'>Definition of ∩ and of ∪</span>"]]},

{"say": "Second step. This is equivalent to x belonging to A. If x belongs to A, both parts of the conjunction hold, because x belonging to A makes the second one true. Conversely, if the conjunction is true, x belongs to A by its first part.", "L": [["sub", "⇔  x ∈ A<span class='tag'>If x ∈ A the conjunction holds; and if it holds, x ∈ A</span>"]]},

{"title": "Conclusion", "clear": 1, "say": "Since both operations are internal and satisfy commutativity, associativity and absorption, we conclude that the power set of U, with union and intersection, is a lattice. Thanks for watching.", "L": [["res", "∪, ∩ internal in 𝒫(U)"], ["res", "Commutativity,  Associativity,  Absorption"], ["res", "(𝒫(U), ∪, ∩) is a lattice   ∎"]]}

<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' plus ').replace(/⊙/g,' times ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Replay'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Resume'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pause';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/andrew|guy|brian|christopher|eric|david|mark|male|google us english$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="𝒫(U) is a lattice";$('sub').textContent="Exercise · Algebraic lattices";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
