<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inclusions in the plane</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>Remember</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Start</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Speed <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Recording mode (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"en-US",
"meta":{"nivel": 1, "titulo": "Inclusions in the plane", "enunciado": "Let δ > 0 and consider in ℝ² the sets A = { (x, y) ∈ ℝ² | |x| + |y| < δ }, B = { (x, y) ∈ ℝ² | √(x² + y²) < δ } and C = { (x, y) ∈ ℝ² | max{ |x|, |y| } < δ }. Prove that:", "tesis": "A ⊆ B ⊆ C", "datos": ["δ > 0", "A = { (x, y) ∈ ℝ² | |x| + |y| < δ }", "B = { (x, y) ∈ ℝ² | √(x² + y²) < δ }", "C = { (x, y) ∈ ℝ² | max{ |x|, |y| } < δ }"]},
"steps":[
{"title": "Inclusions in the plane", "sub": "Exercise · Algebra of sets", "clear": 1, "say": "Hello. In this video we are going to prove that three sets in the plane, defined with the absolute value, the Euclidean norm and the maximum, lie one inside the other. We will go very slowly, writing every equation and justifying every step.", "L": [["txt", "Prove that  A ⊆ B ⊆ C  in the plane"]]},

{"say": "The data. Let delta be a real number greater than zero. A is the set of points x, y of the plane such that the absolute value of x, plus the absolute value of y, is less than delta. B is the set of points x, y such that the square root of x squared plus y squared is less than delta. And C is the set of points x, y such that the maximum of the absolute value of x and the absolute value of y is less than delta.", "L": [["hyp", "δ &gt; 0<span class='tag'>Data</span>"], ["hyp", "A = { (x, y) ∈ ℝ² | |x| + |y| &lt; δ }"], ["hyp", "B = { (x, y) ∈ ℝ² | √(x² + y²) &lt; δ }"], ["hyp", "C = { (x, y) ∈ ℝ² | max{ |x|, |y| } &lt; δ }"]]},

{"say": "What we want to prove. A is included in B, and B is included in C. Here inclusion means included or equal. On the right we see the three sets drawn for delta equal to one: A is the diamond, B is the circle, and C is the square. The dashed lines indicate that the boundary does not belong to the set. On the left we recall what we are going to use: the definition of inclusion, that the square of an absolute value is the square of the number, that the square root of the square of a number is its absolute value, and that the square root preserves order.", "L": [["goal", "A ⊆ B   and   B ⊆ C<span class='tag'>Prove</span>"], ["txt", "<svg viewBox='0 0 300 300' width='100%' style='max-width:300px;display:block' xmlns='http://www.w3.org/2000/svg' font-family='Georgia,serif'><rect x='40' y='40' width='220' height='220' fill='#7be0a0' fill-opacity='.15' stroke='#7be0a0' stroke-width='2.5' stroke-dasharray='6 4'/><circle cx='150' cy='150' r='110' fill='#ffd166' fill-opacity='.15' stroke='#ffd166' stroke-width='2.5' stroke-dasharray='6 4'/><polygon points='150,40 260,150 150,260 40,150' fill='#7cc4ff' fill-opacity='.25' stroke='#7cc4ff' stroke-width='2.5' stroke-dasharray='6 4'/><line x1='10' y1='150' x2='290' y2='150' stroke='#9fb3aa' stroke-width='1'/><line x1='150' y1='10' x2='150' y2='290' stroke='#9fb3aa' stroke-width='1'/><text x='260' y='166' fill='#9fb3aa' font-size='16' text-anchor='middle'>δ</text><text x='40' y='166' fill='#9fb3aa' font-size='16' text-anchor='middle'>−δ</text><text x='156' y='54' fill='#9fb3aa' font-size='14'>δ</text><text x='136' y='155' fill='#7cc4ff' font-size='18'>A</text><text x='184' y='116' fill='#ffd166' font-size='18'>B</text><text x='216' y='84' fill='#7be0a0' font-size='18'>C</text></svg>"]], "pin": ["(Def ⊆) X ⊆ Y  ⟺  every p ∈ X satisfies p ∈ Y", "(P1) |a|² = a²", "(P2) √(a²) = |a|", "(P3) if 0 ≤ u ≤ v then √u ≤ √v"], "clear": 1},

{"title": "1) A ⊆ B", "clear": 1, "say": "First part: we prove that A is included in B. By the definition of inclusion, we take an arbitrary point x, y of A, and we have to prove that it belongs to B.", "L": [["hyp", "Let (x, y) ∈ A"], ["goal", "We want:  (x, y) ∈ B,  that is,  √(x² + y²) &lt; δ"]]},

{"say": "Since x, y belongs to A, by the definition of A the absolute value of x, plus the absolute value of y, is less than delta. This is our hypothesis.", "L": [["hyp", "(x, y) ∈ A  ⟹  |x| + |y| &lt; δ<span class='tag'>Hypothesis</span>"]]},

{"clear": 1, "say": "Now we compute the square of the sum of the absolute values. Expanding the square of a sum, it is the square of the absolute value of x, plus twice the absolute value of x times the absolute value of y, plus the square of the absolute value of y.", "L": [["txt", "We expand the square of a sum:"], ["sub", "(|x| + |y|)² = |x|² + 2|x||y| + |y|²"]]},

{"say": "By property P1, the square of the absolute value of x is x squared, and the square of the absolute value of y is y squared. We substitute them.", "L": [["txt", "By (P1) with a = x  and  with a = y:"], ["sub", "(|x| + |y|)² = <mark>x²</mark> + 2|x||y| + <mark>y²</mark>"]]},

{"say": "Since the absolute value of x and the absolute value of y are greater than or equal to zero, the term two times the absolute value of x times the absolute value of y is greater than or equal to zero. Therefore, if we remove it from the sum, the sum decreases or stays the same. So the square of the sum is greater than or equal to x squared plus y squared.", "L": [["txt", "Since |x| ≥ 0 and |y| ≥ 0, we have 2|x||y| ≥ 0, so:"], ["res", "x² + y² ≤ (|x| + |y|)²"]]},

{"clear": 1, "say": "Now we take square roots. We use property P3, with u equal to x squared plus y squared, and v equal to the square of the sum of the absolute values. Both are greater than or equal to zero, and u is less than or equal to v. Then the square root of x squared plus y squared is less than or equal to the square root of, the absolute value of x plus the absolute value of y, squared.", "L": [["txt", "(P3) with  u = x² + y²,  v = (|x| + |y|)²,  0 ≤ u ≤ v:"], ["sub", "√(x² + y²) ≤ √( (|x| + |y|)² )"]]},

{"say": "And by property P2, with a equal to the sum of the absolute value of x and the absolute value of y, the square root of that square is the absolute value of the sum. But the sum is already greater than or equal to zero, so its absolute value is the sum itself.", "L": [["txt", "(P2) with  a = |x| + |y| ≥ 0:   √( (|x| + |y|)² ) = | |x| + |y| | = |x| + |y|"], ["res", "√(x² + y²) ≤ |x| + |y|"]]},

{"clear": 1, "say": "We combine this inequality with the hypothesis. The square root of x squared plus y squared is less than or equal to the absolute value of x plus the absolute value of y, and this is less than delta.", "L": [["txt", "Combining with the hypothesis  |x| + |y| &lt; δ :"], ["res", "√(x² + y²) ≤ |x| + |y| &lt; δ"]]},

{"say": "Therefore, the square root of x squared plus y squared is less than delta. This is exactly the definition of B, so x, y belongs to B. Since x, y was an arbitrary point of A, we conclude that A is included in B.", "L": [["txt", "Then  √(x² + y²) &lt; δ,  so:"], ["hyp", "(x, y) ∈ B"], ["res", "A ⊆ B"]]},

{"title": "2) B ⊆ C", "clear": 1, "say": "Second part: we prove that B is included in C. We take an arbitrary point x, y of B, and we have to prove that it belongs to C.", "L": [["hyp", "Let (x, y) ∈ B"], ["goal", "We want:  (x, y) ∈ C,  that is,  max{ |x|, |y| } &lt; δ"]]},

{"say": "Since x, y belongs to B, by the definition of B the square root of x squared plus y squared is less than delta. This is our hypothesis.", "L": [["hyp", "(x, y) ∈ B  ⟹  √(x² + y²) &lt; δ<span class='tag'>Hypothesis</span>"]]},

{"clear": 1, "say": "First, since y squared is greater than or equal to zero, x squared is less than or equal to x squared plus y squared. In the same way, since x squared is greater than or equal to zero, y squared is less than or equal to x squared plus y squared.", "L": [["txt", "Since  y² ≥ 0  and  x² ≥ 0:"], ["sub", "x² ≤ x² + y²"], ["sub", "y² ≤ x² + y²"]]},

{"say": "We take square roots, with property P3. With u equal to x squared, and v equal to x squared plus y squared, the root of x squared is less than or equal to the root of x squared plus y squared. And by property P2, the square root of x squared is the absolute value of x. The same with y.", "L": [["txt", "(P3) with  u = x²,  v = x² + y²,  and then (P2) with  a = x:"], ["sub", "|x| = √(x²) ≤ √(x² + y²)"], ["txt", "(P3) with  u = y²,  v = x² + y²,  and then (P2) with  a = y:"], ["sub", "|y| = √(y²) ≤ √(x² + y²)"]]},

{"clear": 1, "say": "Now we use the hypothesis. The absolute value of x is less than or equal to the root of x squared plus y squared, which is less than delta. And the same for y. Therefore, the absolute value of x is less than delta, and the absolute value of y is less than delta.", "L": [["txt", "Combining with the hypothesis  √(x² + y²) &lt; δ :"], ["res", "|x| ≤ √(x² + y²) &lt; δ"], ["res", "|y| ≤ √(x² + y²) &lt; δ"]]},

{"say": "The maximum of two numbers is one of the two, and both are less than delta. Therefore, the maximum of the absolute value of x and the absolute value of y is less than delta. This is the definition of C, so x, y belongs to C. Since x, y was an arbitrary point of B, we conclude that B is included in C.", "L": [["txt", "|x| &lt; δ  and  |y| &lt; δ  ⟹  max{ |x|, |y| } &lt; δ"], ["hyp", "(x, y) ∈ C"], ["res", "B ⊆ C"]]},

{"title": "Conclusion", "clear": 1, "say": "Conclusion. Putting the two parts together, A is included in B, and B is included in C. Geometrically, the diamond lies inside the circle, and the circle lies inside the square. Thanks for watching.", "L": [["res", "A ⊆ B   and   B ⊆ C   ⟹   A ⊆ B ⊆ C"], ["txt", "<svg viewBox='0 0 300 300' width='100%' style='max-width:300px;display:block' xmlns='http://www.w3.org/2000/svg' font-family='Georgia,serif'><rect x='40' y='40' width='220' height='220' fill='#7be0a0' fill-opacity='.15' stroke='#7be0a0' stroke-width='2.5' stroke-dasharray='6 4'/><circle cx='150' cy='150' r='110' fill='#ffd166' fill-opacity='.15' stroke='#ffd166' stroke-width='2.5' stroke-dasharray='6 4'/><polygon points='150,40 260,150 150,260 40,150' fill='#7cc4ff' fill-opacity='.25' stroke='#7cc4ff' stroke-width='2.5' stroke-dasharray='6 4'/><line x1='10' y1='150' x2='290' y2='150' stroke='#9fb3aa' stroke-width='1'/><line x1='150' y1='10' x2='150' y2='290' stroke='#9fb3aa' stroke-width='1'/><text x='260' y='166' fill='#9fb3aa' font-size='16' text-anchor='middle'>δ</text><text x='40' y='166' fill='#9fb3aa' font-size='16' text-anchor='middle'>−δ</text><text x='156' y='54' fill='#9fb3aa' font-size='14'>δ</text><text x='136' y='155' fill='#7cc4ff' font-size='18'>A</text><text x='184' y='116' fill='#ffd166' font-size='18'>B</text><text x='216' y='84' fill='#7be0a0' font-size='18'>C</text></svg>"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' plus ').replace(/⊙/g,' times ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Replay'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Resume'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pause';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/andrew|guy|brian|christopher|eric|david|mark|male|google us english$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Inclusions in the plane";$('sub').textContent="Exercise · Algebra of sets";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
