<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duality principle</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-right:2px dashed #3d5a50;padding-right:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-left:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>Remember</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ Start</button><button id="next">▶|</button>
<select id="voice"></select>
<label>Speed <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">Recording mode (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"en-US",
"meta":{"nivel": 2, "titulo": "Duality principle", "enunciado": "Let (B, ⊕, ⊙, ∼, 0, 1) be a Boolean algebra.  Using the duality principle, write and check the dual identities of:", "tesis": "(a)  a ⊕ 1 = 1,   (b)  a ⊕ (a ⊙ b) = a", "datos": ["(Duality)  ⊕ ↔ ⊙,   0 ↔ 1", "(Dom)  a ⊕ 1 = 1,   a ⊙ 0 = 0", "(Abs)  a ⊕ (a ⊙ b) = a,   a ⊙ (a ⊕ b) = a"]},
"steps":[
{"title": "Duality principle", "sub": "Exercise · Boolean algebra", "clear": 1, "say": "Hello. In this video we are going to solve an exercise about Boolean algebras. We will go very slowly, writing every equation and justifying every step.", "L": [["txt", "Using the duality principle to obtain new identities"]]},

{"say": "First, the data. B is a set with two operations, the sum and the product, a complement operation, and two distinguished elements, zero and one. It is a Boolean algebra. The typical example is the power set of a set U, with union, intersection and set complement, where zero is the empty set and one is U.", "L": [["hyp", "(B, ⊕, ⊙, ∼, 0, 1) Boolean algebra<span class='tag'>Hypothesis</span>"], ["txt", "With sets:  (𝒫(U), ∪, ∩, complement),   0 = ∅,   1 = U"]]},

{"say": "Let us recall the duality principle. Any identity valid in a Boolean algebra remains valid when we simultaneously swap the sum for the product, and zero for one. With sets, this means swapping union for intersection, and the empty set for U.", "L": [["sub", "⊕ ↔ ⊙,      0 ↔ 1<span class='tag'>Duality principle: swapped at the same time</span>"], ["txt", "With sets:  ∪ ↔ ∩,      ∅ ↔ U"]]},

{"say": "We write it on the left, because it is what we are going to use throughout the exercise.", "pin": ["(Duality) Every valid identity remains valid when swapping ⊕ ↔ ⊙ and 0 ↔ 1"]},

{"say": "What we want to do. Part a: starting from the domination law, a plus one is one, write its dual identity and check that it is also valid. Part b: starting from the absorption law, a plus, a times b, is a, write its dual identity and check that it is also valid.", "L": [["goal", "(a)  Dual of  a ⊕ 1 = 1  and check that it is valid"], ["goal", "(b)  Dual of  a ⊕ (a ⊙ b) = a  and check that it is valid<span class='tag'>Claim</span>"]]},

{"title": "(a) Dual of the domination law", "clear": 1, "say": "Part a. The original identity is the domination law: a plus one equals one. With sets: A union U is U. We write it on the left, because it is a valid starting identity.", "L": [["sub", "a ⊕ 1 = 1<span class='tag'>Original identity: domination law</span>"], ["txt", "With sets:  A ∪ U = U"]], "pin": ["(Dom) a ⊕ 1 = 1"]},

{"say": "Applying the duality principle, we swap the sum for the product, and one for zero. In the identity there is one sum and two ones, so we change the sum into a product, and the two ones into zeros.", "L": [["sub", "⊕ → ⊙,      1 → 0<span class='tag'>Dual swap</span>"], ["txt", "a ⊕ 1 = 1   becomes   a ⊙ 0 = 0"]]},

{"say": "We get the dual identity: a times zero equals zero. With sets: A intersection the empty set is the empty set.", "L": [["res", "a ⊙ 0 = 0<span class='tag'>Dual identity</span>"], ["txt", "With sets:  A ∩ ∅ = ∅"]]},

{"say": "Now we check that it is valid. This equality is precisely the second domination law, already proved. We write it on the left. Therefore, the dual identity is also valid. This ends part a.", "L": [["res", "a ⊙ 0 = 0  is the second domination law   ∎<span class='tag'>The dual identity is also valid</span>"]], "pin": ["(Dom) a ⊙ 0 = 0"]},

{"title": "(b) Dual of the absorption law", "clear": 1, "say": "Part b. The original identity is the absorption law: a plus, a times b, equals a. With sets: A union, A intersection B, is A. We write it on the left.", "L": [["sub", "a ⊕ (a ⊙ b) = a<span class='tag'>Original identity: absorption law</span>"], ["txt", "With sets:  A ∪ (A ∩ B) = A"]], "pin": ["(Abs) a ⊕ (a ⊙ b) = a"]},

{"say": "Applying the duality principle, we swap the sum for the product, and vice versa. In this identity neither zero nor one appears, so we only change the sum into the product, and the product into the sum.", "L": [["sub", "⊕ ↔ ⊙<span class='tag'>Dual swap</span>"], ["txt", "a ⊕ (a ⊙ b) = a   becomes   a ⊙ (a ⊕ b) = a"]]},

{"say": "We get the dual identity: a times, a plus b, equals a. With sets: A intersection, A union B, is A.", "L": [["res", "a ⊙ (a ⊕ b) = a<span class='tag'>Dual identity</span>"], ["txt", "With sets:  A ∩ (A ∪ B) = A"]]},

{"say": "Now we check that it is valid. This equality corresponds to the second absorption law, valid in every lattice, and therefore also in a Boolean algebra. We write it on the left. This ends part b.", "L": [["res", "a ⊙ (a ⊕ b) = a  is the second absorption law   ∎<span class='tag'>Valid in every lattice, hence in a Boolean algebra</span>"]], "pin": ["(Abs) a ⊙ (a ⊕ b) = a"]},

{"title": "Conclusion", "clear": 1, "say": "We conclude that, once an identity has been proved, its dual identity is automatically valid, with no need for a new independent proof. With sets: if an equality between sets is valid, so is the one obtained by swapping union for intersection, and the empty set for U. Thanks for watching.", "L": [["res", "Valid identity  ⟹  its dual is also valid"], ["res", "(a)  a ⊕ 1 = 1   ⟹   a ⊙ 0 = 0"], ["res", "(b)  a ⊕ (a ⊙ b) = a   ⟹   a ⊙ (a ⊕ b) = a"], ["txt", "With sets:  ∪ ↔ ∩,   ∅ ↔ U"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' plus ').replace(/⊙/g,' times ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ Replay'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ Resume'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ Pause';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ Pause';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/andrew|guy|brian|christopher|eric|david|mark|male|google us english$/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="Duality principle";$('sub').textContent="Exercise · Boolean algebra";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
