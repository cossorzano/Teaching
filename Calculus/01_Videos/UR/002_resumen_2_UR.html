<!DOCTYPE html>
<html lang="ur" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الجبری ساختیں</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:30%;border-inline-end:2px dashed #3d5a50;padding-inline-end:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-inline-start:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(15px,1.9vw,24px)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>یاد رکھیں</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ شروع کریں</button><button id="next">▶|</button>
<select id="voice"></select>
<label>رفتار <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">ریکارڈنگ موڈ (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"ur-PK",
"meta":{"nivel": 0, "titulo": "الجبری ساختیں", "enunciado": "خلاصہ: لیٹس، توزیعی لیٹس اور بولین الجبرا", "datos": ["لیٹس", "توزیعی لیٹس", "بولین الجبرا", "بولین الجبرا کے مسئلے", "ثنویت کا اصول"]},
"steps":[
{"title": "الجبری ساختیں", "sub": "خلاصہ: لیٹس، توزیعی لیٹس اور بولین الجبرا", "clear": 1, "say": "السلام علیکم۔ اس ویڈیو میں ہم براہِ راست فارمولوں کے ساتھ تین الجبری ساختوں کو دہرائیں گے، جو ایک دوسرے کے اندر سماتی جاتی ہیں: لیٹس، توزیعی لیٹس، اور بولین الجبرا۔", "L": [["txt", "لیٹس  <span dir='ltr'>⊃</span>  توزیعی لیٹس  <span dir='ltr'>⊃</span>  بولین الجبرا"]]},

{"title": "لیٹس", "clear": 1, "say": "لیٹس سے شروع کرتے ہیں۔ تکون B، دائرے والا جمع، دائرے والا نقطہ، ایک لیٹس ہے اگر دونوں عملیات ثنائی اور بند ہوں، اور B کے تمام a، b اور c کے لیے کچھ خصوصیات درست ہوں۔", "L": [["hyp", "<span dir='ltr'>(B, ⊕, ⊙)</span> لیٹس<span class='tag'><span dir='ltr'>⊕</span>، <span dir='ltr'>⊙</span> ثنائی اور بند</span>"], ["hyp", "تمام  <span dir='ltr'>a, b, c ∈ B</span>  کے لیے"]]},

{"say": "پہلی خصوصیت، مبادلیت۔ a جمع b برابر ہے b جمع a کے۔ اور a ضرب b برابر ہے b ضرب a کے۔", "L": [["sub", "<span dir='ltr'>a ⊕ b = b ⊕ a</span><span class='tag'>مبادلیت</span>"], ["sub", "<span dir='ltr'>a ⊙ b = b ⊙ a</span><span class='tag'>مبادلیت</span>"]]},

{"say": "دوسری خصوصیت، تلازمیت۔ a جمع، b جمع c، برابر ہے، a جمع b، جمع c کے۔ اور ضرب کے ساتھ بھی یہی: a ضرب، b ضرب c، برابر ہے، a ضرب b، ضرب c کے۔", "L": [["sub", "<span dir='ltr'>a ⊕ (b ⊕ c) = (a ⊕ b) ⊕ c</span><span class='tag'>تلازمیت</span>"], ["sub", "<span dir='ltr'>a ⊙ (b ⊙ c) = (a ⊙ b) ⊙ c</span><span class='tag'>تلازمیت</span>"]]},

{"say": "تیسری خصوصیت، جذب۔ a جمع، a ضرب b، برابر ہے a کے۔ اور a ضرب، a جمع b، برابر ہے a کے۔ ہر عمل دوسرے کو جذب کر لیتا ہے۔", "L": [["sub", "<span dir='ltr'>a ⊕ (a ⊙ b) = a</span><span class='tag'>جذب</span>"], ["sub", "<span dir='ltr'>a ⊙ (a ⊕ b) = a</span><span class='tag'>جذب</span>"]]},

{"say": "ان مسلمات سے ایک مسئلہ نکلتا ہے: ہم قوتی۔ a جمع a، a ہے، اور a ضرب a، a ہے۔ کسی رکن پر خود اسی کے ساتھ عمل کرنے سے کچھ نہیں بدلتا۔", "L": [["res", "<span dir='ltr'>a ⊕ a = a</span><span class='tag'>مسئلہ: ہم قوتی</span>"], ["res", "<span dir='ltr'>a ⊙ a = a</span><span class='tag'>مسئلہ: ہم قوتی</span>"]]},

{"say": "ایک طرف لیٹس کی بنیادی باتیں لکھ لیتے ہیں: مبادلیت، تلازمیت اور جذب۔", "pin": "لیٹس: مبادلی، تلازمی، جذب"},

{"title": "توزیعی لیٹس", "clear": 1, "say": "اب توزیعی لیٹس۔ یہ ایسی لیٹس ہے جو توزیعیت بھی پوری کرتی ہے۔", "L": [["goal", "توزیعی لیٹس  <span dir='ltr'>=</span>  لیٹس  +  توزیعیت"]]},

{"say": "ہر عمل دوسرے پر توزیعی ہے۔ a جمع، b ضرب c، برابر ہے، a جمع b، ضرب، a جمع c کے۔ اور a ضرب، b جمع c، برابر ہے، a ضرب b، جمع، a ضرب c کے۔", "L": [["sub", "<span dir='ltr'>a ⊕ (b ⊙ c) = (a ⊕ b) ⊙ (a ⊕ c)</span><span class='tag'>توزیعیت</span>"], ["sub", "<span dir='ltr'>a ⊙ (b ⊕ c) = (a ⊙ b) ⊕ (a ⊙ c)</span><span class='tag'>توزیعیت</span>"]]},

{"title": "بولین الجبرا", "clear": 1, "say": "اور ہم بولین الجبرا تک پہنچتے ہیں۔ یہ ایک توزیعی لیٹس ہے جس میں کم ترین رکن صفر، زیادہ ترین رکن ایک، اور ہر رکن کا ایک تکملہ بھی ہوتا ہے۔", "L": [["goal", "بولین الجبرا  <span dir='ltr'>=</span>  توزیعی لیٹس  +  <span dir='ltr'>0</span>، <span dir='ltr'>1</span>  +  تکملے"]]},

{"say": "صفر جمع کا غیر جانبدار رکن ہے، اور ایک ضرب کا غیر جانبدار رکن ہے۔ a جمع صفر، a ہے۔ اور a ضرب ایک، a ہے۔", "L": [["sub", "<span dir='ltr'>a ⊕ 0 = a</span><span class='tag'><span dir='ltr'>0</span>، <span dir='ltr'>⊕</span> کا غیر جانبدار رکن</span>"], ["sub", "<span dir='ltr'>a ⊙ 1 = a</span><span class='tag'><span dir='ltr'>1</span>، <span dir='ltr'>⊙</span> کا غیر جانبدار رکن</span>"]]},

{"say": "ہر رکن a کا ایک تکملہ ہوتا ہے، جسے ہم آگے ٹلڈا لگا کر لکھتے ہیں۔ اسے دونوں شرطیں ایک ساتھ پوری کرنی ہوتی ہیں: a جمع اس کا تکملہ ایک ہے، اور a ضرب اس کا تکملہ صفر ہے۔", "L": [["sub", "<span dir='ltr'>a ⊕ ∼a = 1</span><span class='tag'>تکملہ (دونوں شرطیں لازمی)</span>"], ["sub", "<span dir='ltr'>a ⊙ ∼a = 0</span><span class='tag'>تکملہ (دونوں شرطیں لازمی)</span>"]]},

{"say": "توزیعی لیٹس ہونے کی وجہ سے ہر رکن کا تکملہ یکتا ہے۔ مزید یہ کہ صفر کا تکملہ ایک ہے۔", "L": [["res", "ہر <span dir='ltr'>a</span> کے لیے <span dir='ltr'>∼a</span> یکتا"], ["res", "<span dir='ltr'>∼0 = 1</span>"]]},

{"say": "ایک طرف بولین الجبرا کی بنیادی باتیں لکھ لیتے ہیں۔", "pin": "بولین: توزیعی + <span dir='ltr'>0</span>، <span dir='ltr'>1</span> + تکملے"},

{"title": "بولین الجبرا کے مسئلے", "clear": 1, "say": "بولین الجبرا میں کئی مسئلے درست ہیں۔ پہلا انعکاس کا قانون ہے: a کے تکملے کا تکملہ a ہے۔", "L": [["res", "<span dir='ltr'>∼(∼a) = a</span><span class='tag'>انعکاس کا قانون</span>"]]},

{"say": "دوسرا، غلبہ۔ a جمع ایک، ایک ہے۔ اور a ضرب صفر، صفر ہے۔", "L": [["res", "<span dir='ltr'>a ⊕ 1 = 1</span><span class='tag'>غلبہ</span>"], ["res", "<span dir='ltr'>a ⊙ 0 = 0</span><span class='tag'>غلبہ</span>"]]},

{"say": "تیسرا، ڈی مارگن کے قوانین۔ a جمع b، a کے تکملے ضرب b کے تکملے، کا تکملہ ہے۔ اور a ضرب b، a کے تکملے جمع b کے تکملے، کا تکملہ ہے۔", "L": [["res", "<span dir='ltr'>a ⊕ b = ∼(∼a ⊙ ∼b)</span><span class='tag'>ڈی مارگن کا قانون</span>"], ["res", "<span dir='ltr'>a ⊙ b = ∼(∼a ⊕ ∼b)</span><span class='tag'>ڈی مارگن کا قانون</span>"]]},

{"title": "ثنویت کا اصول", "clear": 1, "say": "آخر میں، ثنویت کا اصول۔ کوئی بھی درست مماثلت درست ہی رہتی ہے اگر ہم جمع کو ضرب سے، اور صفر کو ایک سے بدل دیں۔", "L": [["goal", "<span dir='ltr'>⊕ ↔ ⊙,      0 ↔ 1</span>"]]},

{"say": "ایک مثال دیکھتے ہیں۔ a جمع صفر برابر a، ایک درست مماثلت ہے۔ عملیات اور غیر جانبدار ارکان کو بدلنے سے ہمیں a ضرب ایک برابر a ملتا ہے، جو بھی درست ہے۔", "L": [["sub", "<span dir='ltr'>a ⊕ 0 = a</span><span class='tag'>درست مماثلت</span>"], ["sub", "<span dir='ltr'>⊕ ↔ ⊙,  0 ↔ 1</span>"], ["res", "<span dir='ltr'>a ⊙ 1 = a</span><span class='tag'>ثنوی مماثلت، یہ بھی درست</span>"]]},

{"title": "خلاصہ", "clear": 1, "say": "خلاصہ یہ ہے۔ لیٹس کے لیے مبادلیت، تلازمیت اور جذب ضروری ہیں۔ توزیعی لیٹس اس میں توزیعیت کا اضافہ کرتی ہے۔ اور بولین الجبرا صفر، ایک اور تکملے شامل کرتا ہے، جن سے انعکاس، غلبہ، ڈی مارگن اور ثنویت نکلتے ہیں۔ دیکھنے کا شکریہ۔", "L": [["res", "لیٹس: مبادلی، تلازمی، جذب ⟸ ہم قوتی"], ["res", "+ توزیعیت ⟸ توزیعی لیٹس"], ["res", "+ <span dir='ltr'>0</span>، <span dir='ltr'>1</span>، <span dir='ltr'>∼a</span> ⟸ بولین الجبرا ⟸ انعکاس، غلبہ، ڈی مارگن، ثنویت"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){const d=document.createElement('div');d.className='l hyp';d.innerHTML=s.pin;if(k<n)d.style.animation='none';pins.appendChild(d)}}
 board.scrollTop=board.scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' جمع ').replace(/⊙/g,' ضرب ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ دوبارہ چلائیں'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ جاری رکھیں'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ وقفہ';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ وقفہ';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ وقفہ';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^ur/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/asad|salman|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="الجبری ساختیں";$('sub').textContent="خلاصہ: لیٹس، توزیعی لیٹس اور بولین الجبرا";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
