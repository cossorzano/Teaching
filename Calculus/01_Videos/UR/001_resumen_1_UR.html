{"title": "4. سیٹ کا بولین الجبرا", "clear": 1, "say": "اب یہ سب سیٹ کے ساتھ ٹھوس شکل میں دیکھتے ہیں۔ کسی عالمگیر سیٹ U کے لیے، U کے تمام ذیلی سیٹ سے بننے والے سیٹ کو U کا پاور سیٹ کہتے ہیں۔ اسے خوش خط بڑے P سے لکھا جاتا ہے۔ مثال کے طور پر، اگر U ایک اور دو سے بنا سیٹ ہے، تو U کے پاور سیٹ میں چار ارکان ہیں: خالی سیٹ، سیٹ ایک، سیٹ دو، اور سیٹ ایک، دو۔", "L": [["txt", "<span dir='ltr'>P(U) = { A | A ⊆ U }</span>"], ["txt", "مثال: <span dir='ltr'>U = {1, 2}  ⟹  P(U) = { ∅, {1}, {2}, {1,2} }</span>"]]},

{"say": "A کا تکملہ U کے ان ارکان کا سیٹ ہے جو A میں نہیں ہیں۔ مثال کے طور پر، اگر U ایک، دو، تین ہے، اور A سیٹ ایک ہے، تو A کا تکملہ دو، تین ہے۔", "L": [["sub", "<span dir='ltr'>A<sup>c</sup> = { x ∈ U | x ∉ A }</span><span class='tag'>تعریف</span>"], ["txt", "مثال: <span dir='ltr'>U = {1,2,3}</span>،  <span dir='ltr'>A = {1}  ⟹  A<sup>c</sup> = {2,3}</span>"]]},

{"say": "ایک اور مفید بات۔ دو سیٹ A اور B برابر ہیں اگر اور صرف اگر ہر ایک دوسرے میں شامل ہو۔ مساوات ثابت کرنے کا یہی عام طریقہ ہے: دونوں شمولیتیں الگ الگ ثابت کرنا۔", "L": [["sub", "<span dir='ltr'>A = B  ⟺  A ⊆ B</span>  اور  <span dir='ltr'>B ⊆ A</span>"], ["txt", "<span dir='ltr'>A ⊆ B</span> ثابت کرنے کے لیے: <span dir='ltr'>x ∈ A</span> لیں اور <span dir='ltr'>x ∈ B</span> اخذ کریں"]]},

{"title": "5. فرق اور متشاکل فرق", "clear": 1, "say": "تکملے سے دوسری عملیات کی تعریف کی جاتی ہے۔ A تفریق B کا فرق ان ارکان کا سیٹ ہے جو A میں ہیں لیکن B میں نہیں۔ مثال کے طور پر، سیٹ ایک، دو، تین میں سے سیٹ دو نکالنے پر سیٹ ایک، تین ملتا ہے۔", "L": [["sub", "<span dir='ltr'>A ∖ B = { x ∈ A | x ∉ B } = A ∩ B<sup>c</sup></span><span class='tag'>فرق</span>"], ["txt", "مثال: <span dir='ltr'>{1,2,3} ∖ {2} = {1,3}</span>"]]},

{"say": "A تقاطع B کے تکملے والی مساوات بہت مفید ہے: اس سے ہم فرق کو تقاطع میں بدل سکتے ہیں اور وہ تمام خصوصیات استعمال کر سکتے ہیں جو ہم پہلے سے جانتے ہیں۔ یاد رکھیں کہ فرق مبادلی نہیں ہے۔", "L": [["warn", "<span dir='ltr'>A ∖ B ≠ B ∖ A</span>  (عام طور پر)<span class='tag'>احتیاط</span>"]]},

{"say": "متشاکل فرق ان ارکان کو جمع کرتا ہے جو دونوں میں سے صرف ایک سیٹ میں ہوں۔ یہ A تفریق B اور B تفریق A کے اتصال سے ملتا ہے۔ مثال کے طور پر، A کو ایک، دو اور B کو دو، تین لیتے ہیں۔ A تفریق B ایک ہے، B تفریق A تین ہے، اور اتصال ایک، تین ہے۔", "L": [["sub", "<span dir='ltr'>A △ B = (A ∖ B) ∪ (B ∖ A)</span><span class='tag'>متشاکل فرق</span>"], ["txt", "مثال: <span dir='ltr'>{1,2} △ {2,3} = {1} ∪ {3} = {1,3}</span>"]]},

{"say": "یہ عملیات ایسی مماثلتیں پوری کرتی ہیں جن سے اظہاریوں کو دوبارہ لکھا جا سکتا ہے۔ متشاکل فرق، تقاطع کے بغیر اتصال ہے: جو دونوں میں سے کسی ایک میں ہے، اس میں سے وہ نکال کر جو دونوں میں ہے۔ دوسری کہتی ہے کہ A تفریق B، A اور A تقاطع B کا متشاکل فرق ہے۔ پچھلی مثال سے پہلی کی جانچ کرتے ہیں: اتصال ایک، دو، تین ہے؛ تقاطع دو ہے؛ اور ایک، دو، تین میں سے دو نکالیں تو ایک، تین بچتا ہے، جو نتیجے سے مطابقت رکھتا ہے۔", "L": [["res", "<span dir='ltr'>A △ B = (A ∪ B) ∖ (A ∩ B)</span>"], ["res", "<span dir='ltr'>A ∖ B = A △ (A ∩ B)</span>"], ["txt", "پچھلی مثال سے جانچ: <span dir='ltr'>(A ∪ B) ∖ (A ∩ B) = {1,2,3} ∖ {2} = {1,3} ✔</span>"]]},

{"title": "6. کارتیسی حاصل ضرب", "clear": 1, "say": "آخری بناوٹ: کارتیسی حاصل ضرب۔ سیٹ A ایک، A دو، سے لے کر A n تک دیے ہوں، تو ان کا حاصل ضرب ان n ٹپلز کا سیٹ ہے جن کا i واں جزو A i میں ہو۔", "L": [["sub", "<span dir='ltr'>A₁ × A₂ × ⋯ × Aₙ = { (x₁, x₂, …, xₙ) | xᵢ ∈ Aᵢ }</span><span class='tag'>تعریف</span>"]]},

{"say": "دو سیٹ کے ساتھ ایک مثال دیکھتے ہیں۔ A ایک، دو ہے، اور B، a، b ہے۔ ان کے حاصل ضرب میں وہ تمام جوڑے ہیں جن کا پہلا جزو A سے اور دوسرا B سے ہو۔ یہ چار جوڑے ہیں۔ ترتیب اہم ہے: B ضرب A کا حاصل ضرب مختلف ہے۔", "L": [["txt", "<span dir='ltr'>A = {1,2}</span>،   <span dir='ltr'>B = {a,b}</span>"], ["res", "<span dir='ltr'>A × B = { (1,a), (1,b), (2,a), (2,b) }</span>"], ["warn", "<span dir='ltr'>A × B ≠ B × A</span>  (عام طور پر)"]]},

{"say": "یہ عمل کئی متغیرات کے تفاعلات، گراف، اور مستوی اور فضا کے خطوں کے لیے لازمی ہے۔ مثال کے طور پر، مستوی حقیقی خط کا خود اسی کے ساتھ حاصل ضرب ہے۔", "L": [["txt", "<span dir='ltr'>ℝ × ℝ = ℝ²</span>  (مستوی)،    <span dir='ltr'>ℝ × ℝ × ℝ = ℝ³</span>  (فضا)"]]},

{"say": "کارتیسی حاصل ضرب اتصال کے ساتھ اچھی طرح میل کھاتا ہے۔ A اور B کا اتصال، ضرب C، برابر ہے A ضرب C اور B ضرب C کے اتصال کے۔ وجہ یہ ہے: ایک جوڑا x، y پہلے سیٹ میں ہے اگر x، A میں یا B میں ہو، اور y، C میں ہو۔ یہ کہنے کے برابر ہے کہ وہ A ضرب C میں ہے، یا B ضرب C میں۔", "L": [["res", "<span dir='ltr'>(A ∪ B) × C = (A × C) ∪ (B × C)</span>"], ["txt", "<span dir='ltr'>(x,y) ∈ (A∪B)×C ⟺ (x ∈ A یا x ∈ B) اور y ∈ C ⟺ (x,y) ∈ A×C یا (x,y) ∈ B×C</span>"]]},

{"say": "تقاطع کے ساتھ بھی ایسا ہی ہے: ایک جوڑا پہلے سیٹ میں ہے اگر x، A میں اور B میں ہو، اور y، C میں ہو، اور یہ A ضرب C میں اور ساتھ ہی B ضرب C میں ہونے کے مترادف ہے۔ اور فرق کے ساتھ بھی یہی۔", "L": [["res", "<span dir='ltr'>(A ∩ B) × C = (A × C) ∩ (B × C)</span>"], ["res", "<span dir='ltr'>(A ∖ B) × C = (A × C) ∖ (B × C)</span>"]]},

{"say": "اتصال والی خصوصیت کو دو بار لگانے سے پھیلاؤ کا فارمولا ملتا ہے۔ A اور B کا اتصال، ضرب، C اور D کا اتصال، چار حاصل ضربوں کا اتصال ہے: A ضرب C، B ضرب C، A ضرب D، اور B ضرب D۔ چار مستطیلوں کے بارے میں سوچیں۔", "L": [["res", "<span dir='ltr'>(A ∪ B) × (C ∪ D) = (A × C) ∪ (B × C) ∪ (A × D) ∪ (B × D)</span>"], ["warn", "<span dir='ltr'>≠ (A × C) ∪ (B × D)</span><span class='tag'>عام غلطی: آڑے حدود غائب ہیں</span>"]]},

{"title": "اختتام", "clear": 1, "say": "آخر میں: یہ تمام مماثلتیں الگ تھلگ قواعد نہیں، بلکہ پس منظر کی الجبری ساخت کے نتائج ہیں۔ انہیں جان کر ہم سیٹ کو اعتماد سے سنبھال سکتے ہیں، پیچیدہ خطوں کو سادہ حصوں میں بانٹ سکتے ہیں، اور ڈومین اور رینج کے بارے میں درست استدلال کر سکتے ہیں۔ مشقوں میں ہم انہیں عملی اور نظریاتی، دونوں طرح استعمال کریں گے۔ دیکھنے کا شکریہ۔", "L": [["res", "لیٹس ⟵ توزیعی ⟵ بولین الجبرا"], ["res", "<span dir='ltr'>P(U)</span>، <span dir='ltr'>∪</span>، <span dir='ltr'>∩</span>، <span dir='ltr'>∅</span>، <span dir='ltr'>U</span> اور تکملے کے ساتھ"], ["res", "فرق، متشاکل فرق اور کارتیسی حاصل ضرب"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){const d=document.createElement('div');d.className='l hyp';d.innerHTML=s.pin;if(k<n)d.style.animation='none';pins.appendChild(d)}}
 board.scrollTop=board.scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' جمع ').replace(/⊙/g,' ضرب ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ دوبارہ چلائیں'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ جاری رکھیں'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ وقفہ';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ وقفہ';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ وقفہ';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^ur/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/asad|salman|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="لیٹس اور بولین الجبرا";$('sub').textContent="نظریہ · سیٹ اور عملیات";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
