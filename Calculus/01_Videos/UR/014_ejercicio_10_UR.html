<!DOCTYPE html>
<html lang="ur" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اصولِ ثنویت</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-inline-end:2px dashed #3d5a50;padding-inline-end:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-inline-start:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
span[dir='ltr']{white-space:nowrap}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>یاد رکھیں</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ شروع کریں</button><button id="next">▶|</button>
<select id="voice"></select>
<label>رفتار <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">ریکارڈنگ موڈ (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"ur-PK",
"meta":{"nivel": 2, "titulo": "اصولِ ثنویت", "enunciado": "فرض کریں <span dir='ltr'>(B, ⊕, ⊙, ∼, 0, 1)</span> ایک بولین الجبرا ہے۔  اصولِ ثنویت استعمال کرتے ہوئے، ان شناختوں کی ثنوی شناختیں لکھیں اور جانچیں:", "tesis": "(a)  a ⊕ 1 = 1,   (b)  a ⊕ (a ⊙ b) = a", "datos": ["(ثنویت)  <span dir='ltr'>⊕ ↔ ⊙,   0 ↔ 1</span>", "(غلبہ)  <span dir='ltr'>a ⊕ 1 = 1,   a ⊙ 0 = 0</span>", "(جذب)  <span dir='ltr'>a ⊕ (a ⊙ b) = a,   a ⊙ (a ⊕ b) = a</span>"]},
"steps":[
{"title": "اصولِ ثنویت", "sub": "مشق · بولین الجبرا", "clear": 1, "say": "السلام علیکم۔ اس ویڈیو میں ہم بولین الجبرا پر ایک مشق حل کریں گے۔ ہم بہت آہستہ چلیں گے، ہر مساوات لکھیں گے اور ہر قدم کی وجہ بتائیں گے۔", "L": [["txt", "نئی شناختیں حاصل کرنے کے لیے اصولِ ثنویت کا استعمال"]]},

{"say": "پہلے، دی گئی معلومات۔ B ایک سیٹ ہے جس پر دو عمل ہیں، جمع اور ضرب، ایک تکملے کا عمل، اور دو خاص ارکان، صفر اور ایک۔ یہ ایک بولین الجبرا ہے۔ عام مثال کسی سیٹ U کے تمام ذیلی سیٹوں کا سیٹ ہے، اتصال، تقاطع اور تکملے کے ساتھ، جہاں صفر خالی سیٹ ہے اور ایک U ہے۔", "L": [["hyp", "<span dir='ltr'>(B, ⊕, ⊙, ∼, 0, 1)</span> بولین الجبرا<span class='tag'>مفروضہ</span>"], ["txt", "سیٹ کے ساتھ:  <span dir='ltr'>𝒫(U)</span> اتصال، تقاطع اور تکملے کے ساتھ،  <span dir='ltr'>0 = ∅</span>،  <span dir='ltr'>1 = U</span>"]]},

{"say": "اصولِ ثنویت یاد کرتے ہیں۔ بولین الجبرا میں درست کوئی بھی شناخت، جمع اور ضرب کو، اور صفر اور ایک کو ایک ساتھ آپس میں بدلنے پر بھی درست رہتی ہے۔ سیٹ میں اس کا مطلب ہے اتصال اور تقاطع کو، اور خالی سیٹ اور U کو آپس میں بدلنا۔", "L": [["sub", "<span dir='ltr'>⊕ ↔ ⊙,      0 ↔ 1</span><span class='tag'>اصولِ ثنویت: ایک ساتھ تبادلہ</span>"], ["txt", "سیٹ کے ساتھ:  <span dir='ltr'>∪ ↔ ∩,      ∅ ↔ U</span>"]]},

{"say": "اسے ہم ایک طرف لکھ لیتے ہیں، کیونکہ پوری مشق میں یہی استعمال کریں گے۔", "pin": ["(ثنویت) ہر درست شناخت <span dir='ltr'>⊕ ↔ ⊙</span> اور <span dir='ltr'>0 ↔ 1</span> بدلنے پر بھی درست رہتی ہے"]},

{"say": "ہمیں کیا کرنا ہے۔ حصہ الف: قانونِ غلبہ، a جمع ایک، ایک ہے، سے شروع کر کے اس کی ثنوی شناخت لکھنا اور جانچنا کہ وہ بھی درست ہے۔ حصہ ب: قانونِ جذب، a جمع، a ضرب b، a ہے، سے شروع کر کے اس کی ثنوی شناخت لکھنا اور جانچنا کہ وہ بھی درست ہے۔", "L": [["goal", "<span dir='ltr'>(a)  a ⊕ 1 = 1</span>  کی ثنوی، اور جانچیں کہ یہ درست ہے"], ["goal", "<span dir='ltr'>(b)  a ⊕ (a ⊙ b) = a</span>  کی ثنوی، اور جانچیں کہ یہ درست ہے<span class='tag'>مطلوب</span>"]]},

{"title": "(الف) قانونِ غلبہ کی ثنوی", "clear": 1, "say": "حصہ الف۔ اصل شناخت قانونِ غلبہ ہے: a جمع ایک، ایک کے برابر ہے۔ سیٹ میں: A اتصال U، U ہے۔ اسے ہم ایک طرف لکھ لیتے ہیں، کیونکہ یہ ایک درست ابتدائی شناخت ہے۔", "L": [["sub", "<span dir='ltr'>a ⊕ 1 = 1</span><span class='tag'>اصل شناخت: قانونِ غلبہ</span>"], ["txt", "سیٹ کے ساتھ:  <span dir='ltr'>A ∪ U = U</span>"]], "pin": ["(غلبہ) <span dir='ltr'>a ⊕ 1 = 1</span>"]},

{"say": "اصولِ ثنویت لگا کر، ہم جمع کو ضرب سے، اور ایک کو صفر سے بدلتے ہیں۔ شناخت میں ایک جمع اور دو ایک ہیں، اس لیے جمع کو ضرب میں، اور دونوں ایک کو صفر میں بدلتے ہیں۔", "L": [["sub", "<span dir='ltr'>⊕ → ⊙,      1 → 0</span><span class='tag'>ثنوی تبادلہ</span>"], ["txt", "<span dir='ltr'>a ⊕ 1 = 1</span>   بن جاتی ہے   <span dir='ltr'>a ⊙ 0 = 0</span>"]]},

{"say": "ہمیں ثنوی شناخت ملتی ہے: a ضرب صفر، صفر کے برابر ہے۔ سیٹ میں: A تقاطع خالی سیٹ، خالی سیٹ ہے۔", "L": [["res", "<span dir='ltr'>a ⊙ 0 = 0</span><span class='tag'>ثنوی شناخت</span>"], ["txt", "سیٹ کے ساتھ:  <span dir='ltr'>A ∩ ∅ = ∅</span>"]]},

{"say": "اب جانچتے ہیں کہ یہ درست ہے۔ یہ مساوات ٹھیک دوسرا قانونِ غلبہ ہے، جو پہلے ثابت ہو چکا ہے۔ اسے ایک طرف لکھ لیتے ہیں۔ اس لیے ثنوی شناخت بھی درست ہے۔ اس کے ساتھ حصہ الف مکمل ہوتا ہے۔", "L": [["res", "<span dir='ltr'>a ⊙ 0 = 0</span>  دوسرا قانونِ غلبہ ہے   <span dir='ltr'>∎</span><span class='tag'>ثنوی شناخت بھی درست ہے</span>"]], "pin": ["(غلبہ) <span dir='ltr'>a ⊙ 0 = 0</span>"]},

{"title": "(ب) قانونِ جذب کی ثنوی", "clear": 1, "say": "حصہ ب۔ اصل شناخت قانونِ جذب ہے: a جمع، a ضرب b، a کے برابر ہے۔ سیٹ میں: A اتصال، A تقاطع B، A ہے۔ اسے ایک طرف لکھ لیتے ہیں۔", "L": [["sub", "<span dir='ltr'>a ⊕ (a ⊙ b) = a</span><span class='tag'>اصل شناخت: قانونِ جذب</span>"], ["txt", "سیٹ کے ساتھ:  <span dir='ltr'>A ∪ (A ∩ B) = A</span>"]], "pin": ["(جذب) <span dir='ltr'>a ⊕ (a ⊙ b) = a</span>"]},

{"say": "اصولِ ثنویت لگا کر، ہم جمع کو ضرب سے، اور ضرب کو جمع سے بدلتے ہیں۔ اس شناخت میں نہ صفر ہے نہ ایک، اس لیے صرف جمع کو ضرب میں، اور ضرب کو جمع میں بدلتے ہیں۔", "L": [["sub", "<span dir='ltr'>⊕ ↔ ⊙</span><span class='tag'>ثنوی تبادلہ</span>"], ["txt", "<span dir='ltr'>a ⊕ (a ⊙ b) = a</span>   بن جاتی ہے   <span dir='ltr'>a ⊙ (a ⊕ b) = a</span>"]]},

{"say": "ہمیں ثنوی شناخت ملتی ہے: a ضرب، a جمع b، a کے برابر ہے۔ سیٹ میں: A تقاطع، A اتصال B، A ہے۔", "L": [["res", "<span dir='ltr'>a ⊙ (a ⊕ b) = a</span><span class='tag'>ثنوی شناخت</span>"], ["txt", "سیٹ کے ساتھ:  <span dir='ltr'>A ∩ (A ∪ B) = A</span>"]]},

{"say": "اب جانچتے ہیں کہ یہ درست ہے۔ یہ مساوات دوسرا قانونِ جذب ہے، جو ہر لیٹس میں درست ہے، اور اس لیے بولین الجبرا میں بھی۔ اسے ایک طرف لکھ لیتے ہیں۔ اس کے ساتھ حصہ ب مکمل ہوتا ہے۔", "L": [["res", "<span dir='ltr'>a ⊙ (a ⊕ b) = a</span>  دوسرا قانونِ جذب ہے   <span dir='ltr'>∎</span><span class='tag'>ہر لیٹس میں درست، اس لیے بولین الجبرا میں بھی</span>"]], "pin": ["(جذب) <span dir='ltr'>a ⊙ (a ⊕ b) = a</span>"]},

{"title": "نتیجہ", "clear": 1, "say": "ہم نتیجہ نکالتے ہیں کہ ایک بار کوئی شناخت ثابت ہو جائے، تو اس کی ثنوی شناخت خود بخود درست ہوتی ہے، کسی نئے آزاد ثبوت کی ضرورت نہیں۔ سیٹ میں: اگر سیٹوں کی کوئی مساوات درست ہے، تو اتصال کو تقاطع سے، اور خالی سیٹ کو U سے بدلنے پر ملنے والی مساوات بھی درست ہے۔ دیکھنے کا شکریہ۔", "L": [["res", "درست شناخت  ⟹  اس کی ثنوی بھی درست"], ["res", "<span dir='ltr'>(a)  a ⊕ 1 = 1   ⟹   a ⊙ 0 = 0</span>"], ["res", "<span dir='ltr'>(b)  a ⊕ (a ⊙ b) = a   ⟹   a ⊙ (a ⊕ b) = a</span>"], ["txt", "سیٹ کے ساتھ:  <span dir='ltr'>∪ ↔ ∩,   ∅ ↔ U</span>"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' جمع ').replace(/⊙/g,' ضرب ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ دوبارہ چلائیں'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ جاری رکھیں'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ وقفہ';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ وقفہ';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ وقفہ';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^ur/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/asad|salman|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="اصولِ ثنویت";$('sub').textContent="مشق · بولین الجبرا";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
