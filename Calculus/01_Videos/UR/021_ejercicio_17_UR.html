<!DOCTYPE html>
<html lang="ur" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مطلق قیمتیں اور سیٹ</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-inline-end:2px dashed #3d5a50;padding-inline-end:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-inline-start:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
span[dir='ltr']{white-space:nowrap}
svg{direction:ltr}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>یاد رکھیں</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ شروع کریں</button><button id="next">▶|</button>
<select id="voice"></select>
<label>رفتار <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">ریکارڈنگ موڈ (H)</button><span id="cap"></span></div></div>

"steps":[
{"title": "مطلق قیمتیں اور سیٹ", "sub": "مشق · سیٹوں کا الجبرا", "clear": 1, "say": "السلام علیکم۔ اس ویڈیو میں ہم سیٹوں کے الجبرا کی ایک مشق حل کریں گے، جس میں سیٹ مطلق قیمتوں سے تعریف کیے گئے ہیں۔ ہم بہت آہستہ چلیں گے، ہر مساوات لکھیں گے اور ہر قدم کی وجہ بتائیں گے۔", "L": [["txt", "مطلق قیمتوں سے تعریف شدہ دو سیٹوں کا اتصال، تقاطع، فرق اور متناظر فرق"]]},

{"say": "ہمیں کیا کرنا ہے۔ پانچ سیٹوں کی تعریف کرنا اور ان کا حساب لگانا: A اور B کا اتصال، تقاطع، A منفی B، B منفی A، اور متناظر فرق۔ ہم ایک طرف مطلق قیمت کی تعریف، اور ارکان کے ذریعے عملیات کی تعریفیں یاد کرتے ہیں، جو ہم استعمال کریں گے۔", "L": [["goal", "<span dir='ltr'>A ∪ B,   A ∩ B,   A ∖ B,   B ∖ A,   A △ B</span><span class='tag'>تعریف کریں اور حساب لگائیں</span>"]], "pin": ["مطلق قیمت کی تعریف: <span dir='ltr'>|a| = a</span> اگر <span dir='ltr'>a ≥ 0</span>؛   <span dir='ltr'>|a| = −a</span> اگر <span dir='ltr'>a &lt; 0</span>", "اتصال کی تعریف: <span dir='ltr'>A ∪ B = { x ∈ ℝ | x ∈ A ∨ x ∈ B }</span>", "تقاطع کی تعریف: <span dir='ltr'>A ∩ B = { x ∈ ℝ | x ∈ A ∧ x ∈ B }</span>", "فرق کی تعریف: <span dir='ltr'>A ∖ B = { x ∈ ℝ | x ∈ A ∧ x ∉ B }</span>", "متناظر فرق: <span dir='ltr'>A △ B = (A ∖ B) ∪ (B ∖ A)</span>"]},

{"title": "۱) A معلوم کرنا", "clear": 1, "say": "قدم ایک۔ پہلے ہم A اور B کو وقفوں کی شکل میں معلوم کرتے ہیں۔ A سے شروع کرتے ہیں۔ ہمارے پاس ہے کہ x کی مطلق قیمت دو سے چھوٹی ہے۔ ہم مطلق قیمت کی تعریف استعمال کرتے ہیں، اور x کی علامت کے مطابق دو صورتیں الگ کرتے ہیں۔", "L": [["sub", "<span dir='ltr'>|x| &lt; 2</span><span class='tag'><span dir='ltr'>A</span> کی عدم مساوات</span>"], ["hyp", "صورت ۱:  <span dir='ltr'>x ≥ 0   ⟹   |x| = x</span>"], ["hyp", "صورت ۲:  <span dir='ltr'>x &lt; 0   ⟹   |x| = −x</span>"]]},

/><text x='365.45454545454544' y='72' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>2</text><line x1='402.72727272727275' y1='48' x2='402.72727272727275' y2='56' stroke='#9fb3aa'/><text x='402.72727272727275' y='72' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>5/2</text></svg>"]]},

{"title": "۲) B معلوم کرنا", "clear": 1, "say": "اب B۔ ہمارے پاس ہے کہ x منفی ایک کی مطلق قیمت، جمع x منفی دو کی مطلق قیمت، دو سے چھوٹی ہے۔ ہر مطلق قیمت اس نقطے پر اپنی شکل بدلتی ہے جہاں اس کا اندرونی حصہ صفر ہو جاتا ہے: x منفی ایک، ایک پر صفر ہوتا ہے، اور x منفی دو، دو پر صفر ہوتا ہے۔ یہ دو نقطے خط کو تین حصوں میں بانٹتے ہیں: x ایک سے چھوٹا یا برابر، x ایک اور دو کے درمیان، اور x دو سے بڑا یا برابر۔", "L": [["sub", "<span dir='ltr'>|x − 1| + |x − 2| &lt; 2</span><span class='tag'><span dir='ltr'>B</span> کی عدم مساوات</span>"], ["txt", "<span dir='ltr'>|x − 1|</span> بدلتا ہے  <span dir='ltr'>x = 1</span>  پر،    <span dir='ltr'>|x − 2|</span> بدلتا ہے  <span dir='ltr'>x = 2</span>  پر"], ["hyp", "حصہ ۱:  <span dir='ltr'>x ≤ 1</span>"], ["hyp", "حصہ ۲:  <span dir='ltr'>1 ≤ x ≤ 2</span>"], ["hyp", "حصہ ۳:  <span dir='ltr'>x ≥ 2</span>"]]},

stroke='#7be0a0' stroke-width='6'/><circle cx='365.45454545454544' cy='92' r='7' fill='#7be0a0' stroke='#7be0a0' stroke-width='3'/><circle cx='402.72727272727275' cy='92' r='7' fill='#16231f' stroke='#7be0a0' stroke-width='3'/><line x1='67.27272727272728' y1='116' x2='67.27272727272728' y2='124' stroke='#9fb3aa'/><text x='67.27272727272728' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>−2</text><line x1='216.36363636363637' y1='116' x2='216.36363636363637' y2='124' stroke='#9fb3aa'/><text x='216.36363636363637' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>0</text><line x1='253.63636363636363' y1='116' x2='253.63636363636363' y2='124' stroke='#9fb3aa'/><text x='253.63636363636363' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>1/2</text><line x1='365.45454545454544' y1='116' x2='365.45454545454544' y2='124' stroke='#9fb3aa'/><text x='365.45454545454544' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>2</text><line x1='402.72727272727275' y1='116' x2='402.72727272727275' y2='124' stroke='#9fb3aa'/><text x='402.72727272727275' y='140' fill='#9fb3aa' font-size='14' text-anchor='middle' font-family='Georgia,serif'>5/2</text></svg>"]]},

{"title": "خلاصہ", "clear": 1, "say": "خلاصہ۔ A اتصال B منفی دو سے پانچ بٹا دو تک کا کھلا وقفہ ہے۔ A تقاطع B ایک بٹا دو سے دو تک کا کھلا وقفہ ہے۔ A منفی B منفی دو، کھلا، سے ایک بٹا دو، بند، تک کا وقفہ ہے۔ B منفی A دو، بند، سے پانچ بٹا دو، کھلا، تک کا وقفہ ہے۔ اور متناظر فرق ان آخری دو وقفوں کا اتصال ہے۔ دیکھنے کا شکریہ۔", "L": [["res", "<span dir='ltr'>A ∪ B = (−2, 5/2)</span>"], ["res", "<span dir='ltr'>A ∩ B = (1/2, 2)</span>"], ["res", "<span dir='ltr'>A ∖ B = (−2, 1/2]</span>"], ["res", "<span dir='ltr'>B ∖ A = [2, 5/2)</span>"], ["res", "<span dir='ltr'>A △ B = (−2, 1/2] ∪ [2, 5/2)</span>"]]}

<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' جمع ').replace(/⊙/g,' ضرب ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ دوبارہ چلائیں'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ جاری رکھیں'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ وقفہ';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ وقفہ';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ وقفہ';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^ur/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/asad|salman|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="مطلق قیمتیں اور سیٹ";$('sub').textContent="مشق · سیٹوں کا الجبرا";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
