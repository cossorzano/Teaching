<!DOCTYPE html>
<html lang="ur" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فرق اور متناظر فرق</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-inline-end:2px dashed #3d5a50;padding-inline-end:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-inline-start:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
span[dir='ltr']{white-space:nowrap}
svg{direction:ltr}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>یاد رکھیں</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ شروع کریں</button><button id="next">▶|</button>
<select id="voice"></select>
<label>رفتار <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">ریکارڈنگ موڈ (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">

"meta":{"nivel": 2, "titulo": "فرق اور متناظر فرق", "enunciado": "ثابت کریں کہ کسی بھی سیٹ <span dir='ltr'>A</span> اور <span dir='ltr'>B</span> کے لیے:", "tesis": "A ∖ B = A △ (A ∩ B)", "datos": ["متناظر فرق کی تعریف:  <span dir='ltr'>X △ Y = (X ∖ Y) ∪ (Y ∖ X)</span>"]},
"steps":[
{"title": "فرق اور متناظر فرق", "sub": "مشق · سیٹوں کا الجبرا", "clear": 1, "say": "السلام علیکم۔ اس ویڈیو میں ہم ثابت کریں گے کہ A منفی B، A اور A و B کے تقاطع کے متناظر فرق کے برابر ہے۔ ہم رکن بہ رکن استدلال کریں گے، بہت آہستہ، ہر مساوات لکھیں گے اور ہر قدم کی وجہ بتائیں گے۔", "L": [["txt", "ثابت کریں کہ  <span dir='ltr'>A ∖ B = A △ (A ∩ B)</span>"]]},

{"say": "ہم کیا ثابت کرنا چاہتے ہیں۔ کسی بھی سیٹ A اور B کے لیے، A منفی B، A اور A تقاطع B کے متناظر فرق کے برابر ہے۔ ہم ایک طرف وہ تعریفیں یاد کرتے ہیں جو ہم استعمال کریں گے: ارکان کے ذریعے متناظر فرق، فرق، تقاطع اور اتصال؛ یہ کہ خالی سیٹ میں کوئی رکن نہیں ہوتا؛ اور یہ کہ دو سیٹ برابر ہوتے ہیں جب ہر ایک دوسرے میں شامل ہو۔", "L": [["goal", "<span dir='ltr'>A ∖ B = A △ (A ∩ B)</span><span class='tag'>کسی بھی <span dir='ltr'>A</span> اور <span dir='ltr'>B</span> کے لیے ثابت کریں</span>"]], "pin": ["متناظر فرق کی تعریف: <span dir='ltr'>X △ Y = (X ∖ Y) ∪ (Y ∖ X)</span>", "فرق کی تعریف: <span dir='ltr'>x ∈ X ∖ Y  ⟺  x ∈ X ∧ x ∉ Y</span>", "تقاطع کی تعریف: <span dir='ltr'>x ∈ X ∩ Y  ⟺  x ∈ X ∧ x ∈ Y</span>", "اتصال کی تعریف: <span dir='ltr'>x ∈ X ∪ Y  ⟺  x ∈ X ∨ x ∈ Y</span>", "خالی سیٹ کی تعریف: کوئی <span dir='ltr'>x</span> ایسا نہیں کہ  <span dir='ltr'>x ∈ ∅</span>", "برابری کی تعریف: <span dir='ltr'>X = Y  ⟺  X ⊆ Y ∧ Y ⊆ X</span>"]},

{"title": "نقطۂ آغاز", "clear": 1, "say": "پہلے، ہم متناظر فرق کی تعریف یاد کرتے ہیں: X اور Y کا متناظر فرق، X منفی Y اور Y منفی X کا اتصال ہے۔ اب ہم اسے اپنی صورت پر لاگو کرتے ہیں، X برابر A، اور Y برابر A اور B کا تقاطع لے کر۔ ہم X کی جگہ A، اور Y کی جگہ A تقاطع B رکھتے ہیں۔", "L": [["txt", "متناظر فرق کی تعریف سے:"], ["sub", "<span dir='ltr'>X △ Y = (X ∖ Y) ∪ (Y ∖ X)</span>"], ["txt", "ہم لیتے ہیں  <span dir='ltr'>X = A</span>  اور  <span dir='ltr'>Y = A ∩ B</span>:"], ["sub", "<span dir='ltr'>A △ (A ∩ B) = ( A ∖ <mark>(A ∩ B)</mark> ) ∪ ( <mark>(A ∩ B)</mark> ∖ A )</span><span class='tag'><span dir='ltr'>(★)</span></span>"]]},

{"title": "منصوبہ", "clear": 1, "say": "اب ہم اس اتصال کے دونوں ٹکڑوں کو سادہ کریں گے۔ حصہ ایک میں، ہم دیکھیں گے کہ A اور B کا تقاطع منفی A، خالی سیٹ ہے۔ حصہ دو میں، ہم دیکھیں گے کہ A منفی، A اور B کا تقاطع، A منفی B کے برابر ہے۔ اور حصہ تین میں، ہم نتیجہ نکالیں گے۔", "L": [["goal", "<span dir='ltr'>(1)  (A ∩ B) ∖ A = ∅</span>"], ["goal", "<span dir='ltr'>(2)  A ∖ (A ∩ B) = A ∖ B</span>"], ["goal", "<span dir='ltr'>(3)  (★)</span> میں رکھ کر نتیجہ"]]},

{"title": "(۱) خالی سیٹ", "clear": 1, "say": "حصہ ایک۔ ہم دیکھنا چاہتے ہیں کہ A اور B کے تقاطع منفی A میں کوئی رکن نہیں ہے۔ فرض کرتے ہیں کہ x اس سیٹ کا ایک رکن ہے، اور ہم ایک تضاد تک پہنچیں گے۔", "L": [["hyp", "فرض کریں <span dir='ltr'>x ∈ (A ∩ B) ∖ A</span>"], ["goal", "ہمیں چاہیے:  تضاد تک پہنچنا"]]},

{"say": "فرق کی تعریف کے مطابق، x، A اور B کے تقاطع میں ہے، اور x، A میں نہیں ہے۔", "L": [["txt", "فرق کی تعریف سے:"], ["sub", "<span dir='ltr'>x ∈ A ∩ B   ∧   x ∉ A</span>"]]},

{"say": "تقاطع کی تعریف کے مطابق، x کا A اور B کے تقاطع میں ہونا، اس کا مطلب ہے کہ x، A میں ہے، اور x، B میں ہے۔ خاص طور پر، x، A میں ہے۔", "L": [["txt", "تقاطع کی تعریف سے:  <span dir='ltr'>x ∈ A ∩ B</span>  کا مطلب ہے  <span dir='ltr'>x ∈ A  ∧  x ∈ B</span>؛  خاص طور پر:"], ["sub", "<span dir='ltr'>x ∈ A</span>"]]},

{"say": "لیکن ہم نے پایا تھا کہ x، A میں نہیں ہے۔ تب x ایک ساتھ A میں ہے اور A میں نہیں ہے۔ یہ ایک تضاد ہے۔", "L": [["warn", "<span dir='ltr'>x ∈ A   ∧   x ∉ A</span>      →   تضاد"]]},

{"say": "لہٰذا، A اور B کے تقاطع منفی A میں کوئی رکن x نہیں ہے۔ جس سیٹ میں کوئی رکن نہ ہو وہ خالی سیٹ ہے۔ چنانچہ A اور B کا تقاطع منفی A، خالی سیٹ ہے۔", "L": [["txt", "کوئی <span dir='ltr'>x</span> اس میں نہیں ہو سکتا:  <span dir='ltr'>(A ∩ B) ∖ A</span>،  لہٰذا:"], ["res", "<span dir='ltr'>(A ∩ B) ∖ A = ∅</span>"]]},

{"title": "(۲) فرق کی تسہیل", "clear": 1, "say": "حصہ دو۔ ہم دیکھنا چاہتے ہیں کہ A منفی، A اور B کا تقاطع، A منفی B کے برابر ہے۔ برابری کی تعریف کے مطابق، ہم دو شمولیتیں ثابت کرتے ہیں۔ پہلی، A منفی، A اور B کا تقاطع، A منفی B میں شامل ہے۔ دوسری، A منفی B، A منفی، A اور B کے تقاطع میں شامل ہے۔", "L": [["goal", "<span dir='ltr'>(2a)  A ∖ (A ∩ B) ⊆ A ∖ B</span>"], ["goal", "<span dir='ltr'>(2b)  A ∖ B ⊆ A ∖ (A ∩ B)</span>"]]},

{"title": "(۲الف) پہلی شمولیت", "clear": 1, "say": "فرض کریں x، A منفی، A اور B کے تقاطع کا کوئی بھی رکن ہے۔ فرق کی تعریف کے مطابق، x، A میں ہے، اور x، A اور B کے تقاطع میں نہیں ہے۔", "L": [["hyp", "فرض کریں <span dir='ltr'>x ∈ A ∖ (A ∩ B)</span>"], ["goal", "ہمیں چاہیے:  <span dir='ltr'>x ∈ A ∖ B</span>"], ["txt", "فرق کی تعریف سے:"], ["sub", "<span dir='ltr'>x ∈ A   ∧   x ∉ A ∩ B</span>"]]},

{"say": "تقاطع کی تعریف کے مطابق، x کا A اور B کے تقاطع میں نہ ہونا، اس کا مطلب ہے کہ یہ درست نہیں کہ x ایک ساتھ A میں اور B میں ہو۔ چونکہ ہم جانتے ہیں کہ x، A میں ہے، دونوں کے ایک ساتھ درست نہ ہونے کا واحد طریقہ یہ ہے کہ x، B میں نہ ہو۔", "L": [["txt", "تقاطع کی تعریف سے:  <span dir='ltr'>x ∉ A ∩ B</span>  کا مطلب ہے"], ["sub", "نہیں <span dir='ltr'>(x ∈ A  ∧  x ∈ B)</span>"], ["txt", "چونکہ  <span dir='ltr'>x ∈ A</span>،  تو لازماً:"], ["sub", "<span dir='ltr'>x ∉ B</span>"]]},

{"say": "تو x، A میں ہے، اور x، B میں نہیں ہے۔ فرق کی تعریف کے مطابق، x، A منفی B میں ہے۔ یہ پہلی شمولیت ثابت کرتا ہے۔", "L": [["txt", "<span dir='ltr'>x ∈ A  ∧  x ∉ B</span>،  لہٰذا فرق کی تعریف سے:"], ["res", "<span dir='ltr'>x ∈ A ∖ B</span>"], ["res", "<span dir='ltr'>A ∖ (A ∩ B) ⊆ A ∖ B</span>"]]},

{"title": "(۲ب) دوسری شمولیت", "clear": 1, "say": "اب الٹی شمولیت۔ فرض کریں x، A منفی B کا کوئی بھی رکن ہے۔ فرق کی تعریف کے مطابق، x، A میں ہے، اور x، B میں نہیں ہے۔", "L": [["hyp", "فرض کریں <span dir='ltr'>x ∈ A ∖ B</span>"], ["goal", "ہمیں چاہیے:  <span dir='ltr'>x ∈ A ∖ (A ∩ B)</span>"], ["txt", "فرق کی تعریف سے:"], ["sub", "<span dir='ltr'>x ∈ A   ∧   x ∉ B</span>"]]},

{"say": "چونکہ x، B میں نہیں ہے، یہ نہیں ہو سکتا کہ x ایک ساتھ A میں اور B میں ہو۔ تقاطع کی تعریف کے مطابق، x، A اور B کے تقاطع میں نہیں ہے۔", "L": [["txt", "<span dir='ltr'>x ∉ B</span>  ⟹  نہیں <span dir='ltr'>(x ∈ A  ∧  x ∈ B)</span>،  لہٰذا تقاطع کی تعریف سے:"], ["sub", "<span dir='ltr'>x ∉ A ∩ B</span>"]]},

{"say": "تو x، A میں ہے، اور x، A اور B کے تقاطع میں نہیں ہے۔ فرق کی تعریف کے مطابق، x، A منفی، A اور B کے تقاطع میں ہے۔ یہ دوسری شمولیت ثابت کرتا ہے۔", "L": [["txt", "<span dir='ltr'>x ∈ A  ∧  x ∉ A ∩ B</span>،  لہٰذا فرق کی تعریف سے:"], ["res", "<span dir='ltr'>x ∈ A ∖ (A ∩ B)</span>"], ["res", "<span dir='ltr'>A ∖ B ⊆ A ∖ (A ∩ B)</span>"]]},

{"title": "(۲) نتیجہ", "clear": 1, "say": "چونکہ دونوں شمولیتیں درست ہیں، برابری کی تعریف کے مطابق، ہم نتیجہ نکالتے ہیں کہ A منفی، A اور B کا تقاطع، A منفی B کے برابر ہے۔", "L": [["txt", "<span dir='ltr'>(2a)  A ∖ (A ∩ B) ⊆ A ∖ B</span>"], ["txt", "<span dir='ltr'>(2b)  A ∖ B ⊆ A ∖ (A ∩ B)</span>"], ["res", "<span dir='ltr'>A ∖ (A ∩ B) = A ∖ B</span>"]]},

{"title": "(۳) نتیجہ", "clear": 1, "say": "حصہ تین۔ ہم ابتدائی عبارت پر واپس آتے ہیں۔ A اور A تقاطع B کا متناظر فرق، A منفی تقاطع، اور تقاطع منفی A کا اتصال ہے۔", "L": [["txt", "<span dir='ltr'>(★)</span> سے شروع کرتے ہیں:"], ["sub", "<span dir='ltr'>A △ (A ∩ B) = ( A ∖ (A ∩ B) ) ∪ ( (A ∩ B) ∖ A )</span>"]]},

{"say": "حصہ ایک کے نتیجے کو استعمال کرتے ہوئے، ہم دوسرے ٹکڑے کی جگہ خالی سیٹ رکھتے ہیں۔", "L": [["txt", "<span dir='ltr'>(1)</span> سے،  <span dir='ltr'>(A ∩ B) ∖ A = ∅</span> :"], ["sub", "<span dir='ltr'>A △ (A ∩ B) = ( A ∖ (A ∩ B) ) ∪ <mark>∅</mark></span>"]]},

{"say": "کسی سیٹ کا خالی سیٹ کے ساتھ اتصال اس سیٹ کو نہیں بدلتا۔ درحقیقت، x کسی سیٹ X اور خالی سیٹ کے اتصال میں ہے، اگر اور صرف اگر x، X میں ہے، یا x خالی سیٹ میں ہے۔ لیکن کوئی بھی رکن خالی سیٹ میں نہیں ہوتا، اس لیے یہ x کے X میں ہونے کے مساوی ہے۔ ہم اسے X برابر A منفی، A اور B کا تقاطع، لے کر لاگو کرتے ہیں۔", "L": [["txt", "اتصال کی تعریف اور خالی سیٹ کی تعریف سے:  <span dir='ltr'>x ∈ X ∪ ∅  ⟺  x ∈ X  ∨  x ∈ ∅  ⟺  x ∈ X</span>"], ["txt", "لے کر  <span dir='ltr'>X = A ∖ (A ∩ B)</span>:"], ["sub", "<span dir='ltr'>A △ (A ∩ B) = A ∖ (A ∩ B)</span>"]]},

{"say": "آخر میں، حصہ دو کے نتیجے کو استعمال کرتے ہوئے، ہم A منفی، A اور B کے تقاطع کی جگہ A منفی B رکھتے ہیں۔", "L": [["txt", "<span dir='ltr'>(2)</span> سے،  <span dir='ltr'>A ∖ (A ∩ B) = A ∖ B</span> :"], ["res", "<span dir='ltr'>A △ (A ∩ B) = A ∖ B</span>"]]},

{"title": "نتیجہ", "clear": 1, "say": "نتیجہ۔ ہم نے ثابت کیا کہ کسی بھی سیٹ A اور B کے لیے، A منفی B، A اور A تقاطع B کے متناظر فرق کے برابر ہے۔ دیکھنے کا شکریہ۔", "L": [["txt", "<span dir='ltr'>A △ (A ∩ B) = ( A ∖ (A ∩ B) ) ∪ ∅ = A ∖ (A ∩ B) = A ∖ B</span>"], ["res", "<span dir='ltr'>A ∖ B = A △ (A ∩ B)</span>"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' جمع ').replace(/⊙/g,' ضرب ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ دوبارہ چلائیں'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ جاری رکھیں'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ وقفہ';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ وقفہ';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ وقفہ';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^ur/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/asad|salman|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="فرق اور متناظر فرق";$('sub').textContent="مشق · سیٹوں کا الجبرا";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
