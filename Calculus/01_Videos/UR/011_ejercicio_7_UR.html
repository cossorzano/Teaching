<!DOCTYPE html>
<html lang="ur" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قانونِ انعکاسِ مکرر</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-inline-end:2px dashed #3d5a50;padding-inline-end:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-inline-start:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(15px,1.9vw,24px)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
span[dir='ltr']{white-space:nowrap}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>یاد رکھیں</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ شروع کریں</button><button id="next">▶|</button>
<select id="voice"></select>
<label>رفتار <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">ریکارڈنگ موڈ (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"ur-PK",
"meta":{"nivel": 2, "titulo": "قانونِ انعکاسِ مکرر", "enunciado": "فرض کریں <span dir='ltr'>(B, ⊕, ⊙, ∼)</span> ایک بولین الجبرا ہے۔  ثابت کریں کہ ہر <span dir='ltr'>a ∈ B</span> کے لیے قانونِ انعکاسِ مکرر درست ہے:", "tesis": "∼(∼a) = a", "datos": ["(جمع کا مبادلہ)  <span dir='ltr'>x ⊕ y = y ⊕ x</span>", "(ضرب کا مبادلہ)  <span dir='ltr'>x ⊙ y = y ⊙ x</span>", "(تکملہ)  <span dir='ltr'>x ⊕ ∼x = 1,   x ⊙ ∼x = 0</span>", "(یکتائی)  <span dir='ltr'>x ⊕ y = 1</span> اور <span dir='ltr'>x ⊙ y = 0 ⇒ y = ∼x</span>"]},
"steps":[
{"title": "قانونِ انعکاسِ مکرر", "sub": "مشق · بولین الجبرا", "clear": 1, "say": "السلام علیکم۔ اس ویڈیو میں ہم بولین الجبرا پر ایک مشق حل کریں گے۔ ہم بہت آہستہ چلیں گے، ہر مساوات لکھیں گے اور ہر قدم کی وجہ بتائیں گے۔", "L": [["txt", "<span dir='ltr'>a</span> کے تکملے کا تکملہ <span dir='ltr'>a</span> ہے"]]},

{"say": "پہلے، دی گئی معلومات۔ B ایک سیٹ ہے جس پر دو عمل ہیں، جمع اور ضرب، اور ایک تکملے کا عمل، جسے ہم ٹلڈا سے لکھتے ہیں۔ یہ ایک بولین الجبرا ہے: ایک تقسیمی لیٹس، جس کا کم ترین رکن صفر، بیش ترین رکن ایک، اور ہر رکن کا ایک تکملہ ہے۔ عام مثال کسی سیٹ U کے تمام ذیلی سیٹوں کا سیٹ ہے، اتصال، تقاطع اور تکملے کے ساتھ۔", "L": [["hyp", "<span dir='ltr'>(B, ⊕, ⊙, ∼)</span> بولین الجبرا<span class='tag'>مفروضہ</span>"], ["txt", "سیٹ کے ساتھ:  <span dir='ltr'>𝒫(U)</span> اتصال، تقاطع اور تکملے کے ساتھ"]]},

{"say": "تکملے کی تعریف یاد کرتے ہیں۔ x کا تکملہ ایک ایسا رکن ہے جو ایک ساتھ دو شرطیں پوری کرتا ہے: x جمع اس کا تکملہ ایک ہے، اور x ضرب اس کا تکملہ صفر ہے۔ سیٹ میں: A اتصال اس کا تکملہ U ہے، اور A تقاطع اس کا تکملہ خالی سیٹ ہے۔", "L": [["sub", "<span dir='ltr'>x ⊕ ∼x = 1</span><span class='tag'>تکملے کی تعریف</span>"], ["sub", "<span dir='ltr'>x ⊙ ∼x = 0</span><span class='tag'>تکملے کی تعریف</span>"], ["txt", "سیٹ کے ساتھ:  <span dir='ltr'>A ∪ A<sup>c</sup> = U,   A ∩ A<sup>c</sup> = ∅</span>"]]},

{"say": "بولین الجبرا کا ایک بنیادی نتیجہ یہ ہے کہ ہر رکن کا تکملہ یکتا ہوتا ہے۔ اس کا مطلب ہے کہ اگر کوئی رکن y، x کے لحاظ سے دونوں شرطیں پوری کرے، یعنی x جمع y ایک ہو، اور x ضرب y صفر ہو، تو y، x کا تکملہ ہے۔ سیٹ میں: وہ واحد سیٹ جو A کے ساتھ اتصال میں U اور تقاطع میں خالی سیٹ دے، A کا تکملہ ہے۔", "L": [["sub", "<span dir='ltr'>x ⊕ y = 1</span>   اور   <span dir='ltr'>x ⊙ y = 0   ⟹   y = ∼x</span><span class='tag'>تکملے کی یکتائی</span>"], ["txt", "سیٹ کے ساتھ:  <span dir='ltr'>A ∪ Y = U</span>  اور  <span dir='ltr'>A ∩ Y = ∅  ⟹  Y = A<sup>c</sup></span>"]]},

{"say": "ہم ایک طرف وہ لکھ لیتے ہیں جو استعمال کریں گے: جمع کی مبادلیت، ضرب کی مبادلیت، تکملے کی تعریف، اور یکتائی۔", "pin": ["(جمع کا مبادلہ) <span dir='ltr'>x ⊕ y = y ⊕ x</span>", "(ضرب کا مبادلہ) <span dir='ltr'>x ⊙ y = y ⊙ x</span>", "(تکملہ) <span dir='ltr'>x ⊕ ∼x = 1,   x ⊙ ∼x = 0</span>", "(یکتائی) <span dir='ltr'>x ⊕ y = 1</span> اور <span dir='ltr'>x ⊙ y = 0 ⇒ y = ∼x</span>"]},

{"say": "ہمیں کیا ثابت کرنا ہے۔ B کے ہر رکن a کے لیے، a کے تکملے کا تکملہ a کے برابر ہے۔ یہ قانونِ انعکاسِ مکرر ہے۔ سیٹ میں: A کے تکملے کا تکملہ A ہے۔", "L": [["goal", "<span dir='ltr'>∀ a ∈ B:   ∼(∼a) = a</span><span class='tag'>مطلوب: قانونِ انعکاسِ مکرر</span>"], ["txt", "سیٹ کے ساتھ:  <span dir='ltr'>(A<sup>c</sup>)<sup>c</sup> = A</span>"]]},

{"title": "خیال", "clear": 1, "say": "فرض کریں a، B کا کوئی بھی رکن ہے۔ تکملے کی تعریف سے ہمارے پاس دو مفروضے ہیں: a جمع اس کا تکملہ ایک ہے، اور a ضرب اس کا تکملہ صفر ہے۔", "L": [["txt", "فرض کریں <span dir='ltr'>a ∈ B</span>  (کوئی بھی)"], ["hyp", "<span dir='ltr'>a ⊕ ∼a = 1</span><span class='tag'>مفروضہ: <span dir='ltr'>∼a</span> کی تعریف</span>"], ["hyp", "<span dir='ltr'>a ⊙ ∼a = 0</span><span class='tag'>مفروضہ: <span dir='ltr'>∼a</span> کی تعریف</span>"]]},

{"say": "خیال یہ ہے۔ یکتائی سے، یہ ثابت کرنے کے لیے کہ a کے تکملے کا تکملہ a ہے، یہ جانچنا کافی ہے کہ a، a کے تکملے کے لحاظ سے تکملے کی دونوں شرطیں پوری کرتا ہے۔ یعنی ہم یکتائی کو x برابر a کا تکملہ، اور y برابر a لے کر لگاتے ہیں۔", "L": [["sub", "<span dir='ltr'>x = ∼a,   y = a</span><span class='tag'>یکتائی میں انتخاب</span>"], ["goal", "ثابت کرنا کافی ہے:  <span dir='ltr'>∼a ⊕ a = 1</span>   اور   <span dir='ltr'>∼a ⊙ a = 0</span><span class='tag'>نیا مطلوب</span>"]]},

{"title": "پہلی شرط", "clear": 1, "say": "پہلی شرط۔ ہمیں ثابت کرنا ہے کہ a کا تکملہ، جمع a، ایک کے برابر ہے۔ ہم بائیں طرف سے شروع کرتے ہیں۔", "L": [["goal", "ہمیں چاہیے:  <span dir='ltr'>∼a ⊕ a = 1</span><span class='tag'>اس حصے کا مطلوب</span>"], ["txt", "<span dir='ltr'>∼a ⊕ a</span>"]]},

{"say": "پہلا قدم۔ ہم جمع کی مبادلیت لگاتے ہیں، x برابر a کا تکملہ، اور y برابر a لے کر۔ a کے تکملے، جمع a، سے ہم a جمع a کے تکملے تک پہنچتے ہیں۔", "L": [["sub", "<span dir='ltr'>∼a ⊕ a  =  a ⊕ ∼a</span><span class='tag'>جمع کی مبادلیت</span>"]]},

{"say": "دوسرا قدم۔ اب ہمارے پاس ٹھیک پہلا مفروضہ ہے: a جمع اس کا تکملہ ایک ہے۔ اسے نمایاں کر کے بدل دیتے ہیں۔", "L": [["sub", "<span dir='ltr'>∼a ⊕ a  =  <mark>a ⊕ ∼a</mark></span>"], ["txt", "مفروضہ:  <span dir='ltr'><mark>a ⊕ ∼a</mark> = 1</span>"], ["res", "<span dir='ltr'>∼a ⊕ a  =  1</span><span class='tag'>تکملے کی تعریف</span>"]]},

{"title": "دوسری شرط", "clear": 1, "say": "دوسری شرط۔ ہمیں ثابت کرنا ہے کہ a کا تکملہ، ضرب a، صفر کے برابر ہے۔ ہم بائیں طرف سے شروع کرتے ہیں۔", "L": [["goal", "ہمیں چاہیے:  <span dir='ltr'>∼a ⊙ a = 0</span><span class='tag'>اس حصے کا مطلوب</span>"], ["txt", "<span dir='ltr'>∼a ⊙ a</span>"]]},

{"say": "پہلا قدم۔ ہم ضرب کی مبادلیت لگاتے ہیں۔ a کے تکملے، ضرب a، سے ہم a ضرب a کے تکملے تک پہنچتے ہیں۔", "L": [["sub", "<span dir='ltr'>∼a ⊙ a  =  a ⊙ ∼a</span><span class='tag'>ضرب کی مبادلیت</span>"]]},

{"say": "دوسرا قدم۔ اب ہمارے پاس ٹھیک دوسرا مفروضہ ہے: a ضرب اس کا تکملہ صفر ہے۔ اسے نمایاں کر کے بدل دیتے ہیں۔", "L": [["sub", "<span dir='ltr'>∼a ⊙ a  =  <mark>a ⊙ ∼a</mark></span>"], ["txt", "مفروضہ:  <span dir='ltr'><mark>a ⊙ ∼a</mark> = 0</span>"], ["res", "<span dir='ltr'>∼a ⊙ a  =  0</span><span class='tag'>تکملے کی تعریف</span>"]]},

{"title": "نتیجہ", "clear": 1, "say": "ہم نے دونوں شرطیں جانچ لیں۔ یعنی a کے لیے، a کا تکملہ، جمع a، ایک ہے، اور a کا تکملہ، ضرب a، صفر ہے۔ اس لیے، a، a کے تکملے کا ایک تکملہ ہے۔", "L": [["res", "<span dir='ltr'>∼a ⊕ a = 1</span>   اور   <span dir='ltr'>∼a ⊙ a = 0</span><span class='tag'>دونوں شرطیں</span>"], ["txt", "<span dir='ltr'>a</span>، <span dir='ltr'>∼a</span> کا ایک تکملہ ہے"]]},

{"say": "اب ہم تکملے کی یکتائی لگاتے ہیں، x برابر a کا تکملہ، اور y برابر a لے کر۔ چونکہ a دونوں شرطیں پوری کرتا ہے، a ہی a کے تکملے کا تکملہ ہے۔ سیٹ میں: A کے تکملے کا تکملہ A ہے۔ اور اس سے قانونِ انعکاسِ مکرر ثابت ہوتا ہے۔", "L": [["sub", "(یکتائی) لے کر <span dir='ltr'>x = ∼a, y = a</span>"], ["res", "<span dir='ltr'>a = ∼(∼a)   ∎</span><span class='tag'>قانونِ انعکاسِ مکرر</span>"], ["txt", "سیٹ کے ساتھ:  <span dir='ltr'>(A<sup>c</sup>)<sup>c</sup> = A</span>"]]},

{"title": "خلاصہ", "clear": 1, "say": "خلاصہ یہ ہے۔ یہ ثابت کرنے کے لیے کہ a کے تکملے کا تکملہ a ہے، اسے حساب کرنے کی ضرورت نہیں: مبادلیت سے یہ دیکھنا کافی ہے کہ a، a کے تکملے کے لحاظ سے تکملے کی دونوں شرطیں پوری کرتا ہے، اور پھر یکتائی لگانا۔ ہم نتیجہ نکالتے ہیں کہ تکملے کا عمل انعکاسِ مکرر ہے۔ سیٹ میں: A کے تکملے کا تکملہ A ہے۔ دیکھنے کا شکریہ۔", "L": [["res", "<span dir='ltr'>a ⊕ ∼a = 1  ⟹  ∼a ⊕ a = 1</span>   (جمع کا مبادلہ)"], ["res", "<span dir='ltr'>a ⊙ ∼a = 0  ⟹  ∼a ⊙ a = 0</span>   (ضرب کا مبادلہ)"], ["res", "یکتائی  ⟹  <span dir='ltr'>∼(∼a) = a</span>"], ["txt", "سیٹ کے ساتھ:  <span dir='ltr'>(A<sup>c</sup>)<sup>c</sup> = A</span>"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' جمع ').replace(/⊙/g,' ضرب ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ دوبارہ چلائیں'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ جاری رکھیں'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ وقفہ';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ وقفہ';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ وقفہ';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^ur/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/asad|salman|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="قانونِ انعکاسِ مکرر";$('sub').textContent="مشق · بولین الجبرا";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
