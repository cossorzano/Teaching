<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="ur" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>توسیعی حقیقی خط</title>
<style>
:root{--bg:#16231f;--fg:#f1efe4;--hyp:#7cc4ff;--sub:#ffd166;--res:#7be0a0;--goal:#ff9f80;--warn:#ff6b6b;--mut:#9fb3aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{display:flex;flex-direction:column;height:100%;padding:16px 24px}
h1{margin:0 0 4px;font-size:clamp(20px,3vw,34px);font-weight:600}
#sub{color:var(--mut);margin-bottom:12px;font-size:clamp(14px,1.8vw,20px)}
#main{flex:1;display:flex;gap:24px;min-height:0}
#pin{width:32%;border-inline-end:2px dashed #3d5a50;padding-inline-end:16px;overflow:auto}
#pin h2{font-size:18px;color:var(--mut);margin:0 0 8px;font-weight:400}
#board{flex:1;overflow:auto}
.l{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:clamp(20px,3vw,38px);margin:10px 0;padding:6px 12px;border-inline-start:6px solid;animation:in .6s ease both;line-height:1.35}
.pin .l{font-size:clamp(13px,1.5vw,20px);margin:6px 0;padding:4px 10px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hyp{color:var(--hyp);border-color:var(--hyp)}.sub{color:var(--sub);border-color:var(--sub)}
.res{color:var(--res);border-color:var(--res);background:#1f3a30}.goal{color:var(--goal);border-color:var(--goal)}
.warn{color:var(--warn);border-color:var(--warn)}
.txt{color:var(--fg);border-color:transparent;font-family:Georgia,serif;font-size:clamp(16px,2.2vw,26px)}
.tag{font:13px sans-serif;color:var(--mut);display:block}
span[dir='ltr']{white-space:nowrap}
svg{direction:ltr}
mark{background:#6b5a14;color:inherit;padding:0 4px;border-radius:4px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font:14px sans-serif}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #4b6b5f;background:#22362f;color:var(--fg);cursor:pointer}
#cap{color:var(--mut);margin-left:auto}
.rec #bar,.rec #cap{display:none}
</style></head><body><div id="app">
<h1 id="t"></h1><div id="sub"></div>
<div id="main"><div id="pin" class="pin"><h2>یاد رکھیں</h2><div id="pins"></div></div><div id="board"></div></div>
<div id="bar">
<button id="prev">◀</button><button id="play">▶ شروع کریں</button><button id="next">▶|</button>
<select id="voice"></select>
<label>رفتار <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></label>
<button id="rec">ریکارڈنگ موڈ (H)</button><span id="cap"></span></div></div>
<script type="application/json" id="data">
{"lang":"ur-PK",
"meta":{"nivel": 0, "titulo": "توسیعی حقیقی خط", "enunciado": "خلاصہ: توسیعی حقیقی خط کی تعریف، ترتیب، سپریمم اور انفیمم، اور عملیات", "datos": ["تعریف", "ترتیب", "سپریمم اور انفیمم", "متعین عملیات", "غیر متعین عملیات", "یہ فیلڈ نہیں ہے"]},

{"title": "توسیعی حقیقی خط", "sub": "خلاصہ: توسیعی حقیقی خط کی تعریف، ترتیب، سپریمم اور انفیمم، اور عملیات", "clear": 1, "say": "السلام علیکم۔ اس ویڈیو میں ہم توسیعی حقیقی خط کا خلاصہ کریں گے: اس کی تعریف کیسے ہوتی ہے، اس کی ترتیب کیسی ہے، سپریمم اور انفیمم کا کیا ہوتا ہے، اور مثبت اور منفی لامتناہی کے ساتھ کون سی عملیات کی جا سکتی ہیں۔", "L": [["txt", "توسیعی حقیقی خط  <span dir='ltr'><span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span></span>"]]},

{"title": "1) تعریف", "clear": 1, "say": "توسیعی حقیقی خط، حقیقی اعداد میں منفی لامتناہی اور مثبت لامتناہی، یہ دو علامتیں شامل کر کے حاصل ہوتا ہے۔ اسے حقیقی اعداد کے دوہری لکیر والے R کے اوپر ایک لکیر لگا کر لکھتے ہیں۔", "L": [["goal", "<span dir='ltr'><span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span> = ℝ ∪ { −∞, +∞ }</span>"]], "pin": ["تعریف: <span dir='ltr'><span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span> = ℝ ∪ {−∞, +∞}</span>"]},

{"title": "2) ترتیب", "clear": 1, "say": "پہلے، ترتیب۔ توسیعی حقیقی خط کی ترتیب، حقیقی اعداد کی ترتیب کی توسیع ہے۔ ہر حقیقی x کے لیے، منفی لامتناہی چھوٹا یا برابر ہے x کے، اور x چھوٹا یا برابر ہے مثبت لامتناہی کے۔ اور منفی لامتناہی، مثبت لامتناہی سے قطعی طور پر چھوٹا ہے۔", "L": [["goal", "<span dir='ltr'>≤  ℝ</span> کی ترتیب کی توسیع ہے"], ["res", "<span dir='ltr'>∀ x ∈ ℝ :   −∞ ≤ x ≤ +∞</span>"], ["res", "<span dir='ltr'>−∞ &lt; +∞</span>"]], "pin": ["ترتیب: <span dir='ltr'>−∞ ≤ x ≤ +∞</span>"]},

{"title": "3) حدیں", "clear": 1, "say": "دوسرا، حدیں۔ حقیقی اعداد کے برعکس، توسیعی خط میں ہر ذیلی سیٹ A کا سپریمم اور انفیمم ہوتا ہے، اس کا محدود ہونا ضروری نہیں۔ مثلاً خالی سیٹ: ہر عنصر خالی سیٹ کی بالائی حد ہے، اور ان میں سب سے چھوٹی منفی لامتناہی ہے۔ اس لیے خالی سیٹ کا سپریمم منفی لامتناہی ہے، اور اس کا انفیمم مثبت لامتناہی ہے۔", "L": [["goal", "ہر  <span dir='ltr'>A ⊆ <span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span></span>  کا <span dir='ltr'><span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span></span> میں سپریمم اور انفیمم ہوتا ہے"], ["txt", "مثلاً، اگر  <span dir='ltr'>A = ∅</span>:"], ["sub", "<span dir='ltr'>sup ∅ = −∞,        inf ∅ = +∞</span>"]], "pin": ["ہر <span dir='ltr'>A ⊆ <span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span></span> کا <span dir='ltr'>sup A</span> اور <span dir='ltr'>inf A</span> ہے"]},

{"title": "4) سپریمم", "clear": 1, "say": "تیسرا، سپریمم کب مثبت یا منفی لامتناہی ہوتا ہے۔ اگر A حقیقی اعداد کا ذیلی سیٹ ہو، تو A کا سپریمم مثبت لامتناہی ہے، اگر اور صرف اگر A حقیقی اعداد میں اوپر سے محدود نہ ہو۔ اور A کا سپریمم منفی لامتناہی ہے، اگر اور صرف اگر A خالی سیٹ ہو، یا A وہ سیٹ ہو جس میں صرف منفی لامتناہی ہے۔", "L": [["goal", "سپریمم"], ["res", "اگر  <span dir='ltr'>A ⊆ ℝ</span>،   <span dir='ltr'>sup A = +∞   ⟺   A</span>، <span dir='ltr'>ℝ</span> میں اوپر سے محدود نہیں"], ["res", "<span dir='ltr'>sup A = −∞   ⟺   A = ∅</span>   یا   <span dir='ltr'>A = { −∞ }</span>"]], "pin": ["<span dir='ltr'>sup A</span>: محدود نہ ہو تو <span dir='ltr'>+∞</span>، اور <span dir='ltr'>A=∅</span> یا <span dir='ltr'>{−∞}</span> ہو تو <span dir='ltr'>−∞</span>"]},

{"say": "عمومی طور پر، توسیعی حقیقی خط کے کسی بھی ذیلی سیٹ A کے لیے، سپریمم مثبت لامتناہی ہے، اگر اور صرف اگر مثبت لامتناہی A میں ہو، یا A کا حقیقی حصہ اوپر سے محدود نہ ہو۔", "L": [["txt", "عمومی طور پر، اگر  <span dir='ltr'>A ⊆ <span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span></span>:"], ["sub", "<span dir='ltr'>sup A = +∞   ⟺   +∞ ∈ A</span>   یا   <span dir='ltr'>A ∩ ℝ</span>، <span dir='ltr'>ℝ</span> میں اوپر سے محدود نہیں"]]},

{"title": "5) انفیمم", "clear": 1, "say": "چوتھا، انفیمم، جو متشاکل صورت ہے۔ اگر A حقیقی اعداد کا ذیلی سیٹ ہو، تو A کا انفیمم منفی لامتناہی ہے، اگر اور صرف اگر A حقیقی اعداد میں نیچے سے محدود نہ ہو۔ اور A کا انفیمم مثبت لامتناہی ہے، اگر اور صرف اگر A خالی سیٹ ہو، یا A وہ سیٹ ہو جس میں صرف مثبت لامتناہی ہے۔", "L": [["goal", "انفیمم"], ["res", "اگر  <span dir='ltr'>A ⊆ ℝ</span>،   <span dir='ltr'>inf A = −∞   ⟺   A</span>، <span dir='ltr'>ℝ</span> میں نیچے سے محدود نہیں"], ["res", "<span dir='ltr'>inf A = +∞   ⟺   A = ∅</span>   یا   <span dir='ltr'>A = { +∞ }</span>"]], "pin": ["<span dir='ltr'>inf A</span>: محدود نہ ہو تو <span dir='ltr'>−∞</span>، اور <span dir='ltr'>A=∅</span> یا <span dir='ltr'>{+∞}</span> ہو تو <span dir='ltr'>+∞</span>"]},

{"title": "6) عملیات", "clear": 1, "say": "پانچواں، عملیات، جو صرف جزوی طور پر متعین ہیں۔ جمع: ہر حقیقی x کے لیے، x جمع مثبت لامتناہی، مثبت لامتناہی ہے، اور x جمع منفی لامتناہی، منفی لامتناہی ہے۔ ضرب: اگر a صفر سے بڑا ہو، تو a ضرب مثبت لامتناہی، مثبت لامتناہی ہے، اور a ضرب منفی لامتناہی، منفی لامتناہی ہے۔ اگر a صفر سے چھوٹا ہو، تو علامت الٹ جاتی ہے: a ضرب مثبت لامتناہی، منفی لامتناہی ہے، اور a ضرب منفی لامتناہی، مثبت لامتناہی ہے۔", "L": [["goal", "متعین عملیات"], ["res", "<span dir='ltr'>x + (±∞) = ±∞        ∀ x ∈ ℝ</span>"], ["res", "<span dir='ltr'>a · (±∞) = ±∞</span>        اگر  <span dir='ltr'>a &gt; 0</span>"], ["res", "<span dir='ltr'>a · (±∞) = ∓∞</span>        اگر  <span dir='ltr'>a &lt; 0</span>"]], "pin": ["عملیات: <span dir='ltr'>x+(±∞)=±∞</span>، <span dir='ltr'>a·(±∞)=±∞ (a>0)</span>"]},

{"say": "اور تقسیم: ہر حقیقی a کے لیے، a کو مثبت یا منفی لامتناہی سے تقسیم کرنے پر صفر آتا ہے۔ مثبت لامتناہی جمع مثبت لامتناہی بھی متعین ہے، جو مثبت لامتناہی ہے، اور منفی لامتناہی جمع منفی لامتناہی، جو منفی لامتناہی ہے۔", "L": [["res", "<span dir='ltr'>a / (±∞) = 0        ∀ a ∈ ℝ</span>"], ["res", "<span dir='ltr'>(+∞) + (+∞) = +∞,        (−∞) + (−∞) = −∞</span>"]]},

{"title": "7) غیر متعین عملیات", "clear": 1, "say": "تاہم، کچھ عملیات متعین نہیں ہیں، کیونکہ انہیں کوئی معقول قدر نہیں دی جا سکتی۔ مثبت لامتناہی منفی مثبت لامتناہی، یعنی مثبت لامتناہی اور منفی لامتناہی کا مجموعہ، متعین نہیں ہے۔ اور صفر ضرب مثبت یا منفی لامتناہی بھی متعین نہیں۔", "L": [["goal", "متعین نہیں"], ["warn", "<span dir='ltr'>(+∞) + (−∞)</span>    یعنی    <span dir='ltr'>∞ − ∞</span>"], ["warn", "<span dir='ltr'>0 · (±∞)</span>"]]},

{"title": "8) نوٹ", "clear": 1, "say": "آخری نوٹ۔ توسیعی حقیقی خط نہ فیلڈ ہے نہ رِنگ۔ مثلاً، مثبت لامتناہی کا کوئی معکوس نہیں: ایسا کوئی عنصر نہیں جسے مثبت لامتناہی میں جمع کرنے سے صفر آئے۔ اسے صرف غیر محدود رویے کو بیان کرنے کے معاون آلے کے طور پر استعمال کرنا چاہیے۔", "L": [["warn", "<span dir='ltr'><span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span></span> نہ فیلڈ ہے نہ رِنگ"], ["txt", "مثلاً،  <span dir='ltr'>+∞</span>  کا کوئی معکوس نہیں"], ["txt", "غیر محدود رویے کے لیے معاون آلہ"]]},

{"title": "خلاصہ", "clear": 1, "say": "خلاصہ۔ توسیعی حقیقی خط، حقیقی اعداد کے ساتھ منفی لامتناہی اور مثبت لامتناہی ہے۔ اس کی ترتیب حقیقی اعداد کی ترتیب کی توسیع ہے، اور ہر ذیلی سیٹ کا سپریمم اور انفیمم ہوتا ہے۔ عملیات جزوی طور پر متعین ہیں، اور یہ نہ فیلڈ ہے نہ رِنگ۔ دیکھنے کا شکریہ۔", "L": [["res", "<span dir='ltr'><span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span> = ℝ ∪ { −∞, +∞ },    −∞ ≤ x ≤ +∞</span>"], ["res", "ہر <span dir='ltr'>A ⊆ <span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span></span> کا  <span dir='ltr'>sup A</span>  اور  <span dir='ltr'>inf A</span>  ہے"], ["res", "<span dir='ltr'>∞ − ∞</span>   اور   <span dir='ltr'>0 · (±∞)</span>   غیر متعین"], ["res", "<span dir='ltr'><span style='text-decoration:overline;text-decoration-thickness:0.07em'>ℝ</span></span> نہ فیلڈ ہے نہ رِنگ"]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),steps=D.steps;
let i=-1,tok=0,playing=false,timer;
const $=id=>document.getElementById(id),board=$('board'),pins=$('pins');
function render(n){board.innerHTML='';pins.innerHTML='';
 for(let k=0;k<=n;k++){const s=steps[k];
  if(s.clear)board.innerHTML='';
  if(s.title)$('t').textContent=s.title; if(s.sub)$('sub').textContent=s.sub;
  (s.L||[]).forEach(l=>{const d=document.createElement('div');d.className='l '+l[0];d.innerHTML=l[1];if(k<n)d.style.animation='none';board.appendChild(d)});
  if(s.pin){s.pin.forEach(t=>{const d=document.createElement('div');d.className='l hyp';d.innerHTML=t;if(k<n)d.style.animation='none';else d.style.background='#2a4a6b';pins.appendChild(d)})}}
 board.scrollTop=board.scrollHeight;if(steps[n]&&steps[n].pin)$('pin').scrollTop=$('pin').scrollHeight;$('cap').textContent=(n+1)+' / '+steps.length}
function speak(txt,done){speechSynthesis.cancel();
 txt=txt.replace(/⊕/g,' جمع ').replace(/⊙/g,' ضرب ').replace(/[()]/g,', ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);
 const v=voices()[$('voice').value];if(v){u.voice=v;u.lang=v.lang}else u.lang=D.lang;
 u.rate=+$('rate').value;let fin=0;const f=()=>{if(!fin){fin=1;done()}};
 u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function go(n){clearTimeout(timer);const my=++tok;i=Math.max(0,Math.min(steps.length-1,n));render(i);
 if(!playing)return;speak(steps[i].say,()=>{if(my!==tok)return;
  timer=setTimeout(()=>{if(my!==tok)return;if(i<steps.length-1)go(i+1);else{playing=false;$('play').textContent='↺ دوبارہ چلائیں'}},1500)})}
function stop(){playing=false;tok++;clearTimeout(timer);speechSynthesis.cancel();$('play').textContent='▶ جاری رکھیں'}
$('play').onclick=()=>{if(playing){stop();return}
 if(i>=steps.length-1&&$('play').textContent.startsWith('↺'))i=-1;
 playing=true;$('play').textContent='⏸ وقفہ';go(Math.max(i,0))};
$('next').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ وقفہ';go(i+1)};
$('prev').onclick=()=>{const p=playing;stop();playing=p;if(p)$('play').textContent='⏸ وقفہ';go(i-1)};
function voices(){return speechSynthesis.getVoices().filter(v=>/^ur/i.test(v.lang))}
function loadV(){const vs=voices(),s=$('voice');s.innerHTML='';
 vs.forEach((v,k)=>{const o=document.createElement('option');o.value=k;o.textContent=v.name+' ('+v.lang+')';s.appendChild(o)});
 const m=vs.findIndex(v=>/asad|salman|male/i.test(v.name));if(m>=0)s.value=m}
try{speechSynthesis.onvoiceschanged=loadV;loadV()}catch(e){}
$('rec').onclick=()=>document.body.classList.toggle('rec');
document.onkeydown=e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
 if(e.key===' '){e.preventDefault();$('play').click()}if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()};
$('t').textContent="توسیعی حقیقی خط";$('sub').textContent="خلاصہ: توسیعی حقیقی خط کی تعریف، ترتیب، سپریمم اور انفیمم، اور عملیات";
$('cap').textContent='0 / '+steps.length;
</script></body></html>
